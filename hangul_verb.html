],1,[]],["우려내다","동사",0,"",[["물체를 액체에 담가 그 물체의 성분이나 맛, 빛깔 등이 액체 속으로 빠져나오게 하다.","성분을 우려내다.","يُرَشِّح"],["물체를 액체에 담가 성분, 맛, 빛깔 따위가 빠져나오게 하거나 액체에 배어들게 하다.","멸치 국물을 우려내다."]],1,[]],["땋다","동사",0,"",[["머리카락 또는 실을 둘 이상의 가닥으로 갈라서 엮어 한 가닥으로 만들다.","땋은 머리.","يَضْفِرُ"],["머리털이나 실 따위를 둘 이상의 가닥으로 갈라서 어긋나게 엮어 한 가닥으로 하다.","어머니는 나의 머리를 두 갈래로 땋아 리본을 묶어 주었다."],["머리에 댕기를 끼워 드리다.","옆구리에 꼭 끼고 온 보퉁이에서 군데군데 빗살이 부러진 헌 참빗을 꺼내 곱게 빗질을 해 주고 댕기를 땋아 주었다.≪문순태, 타오르는 강≫"]],1,[]],["공연하다(公演하다)","동사",0,"공평할 공, 펼 연",[["음악, 무용, 연극 따위를 많은 사람 앞에서 보이다.","연극을 공연하다."]],1,[]],["뒤집다","동사",0,"",[["어떤 것의 안과 겉을 서로 바꾸다.","가방을 뒤집다.","يَقْلِبُ"],["안과 겉을 뒤바꾸다.","버선목을 뒤집다."]],1,[]],["보태다","동사",0,"",[["부족한 것을 더하여 채우다.","보태 쓰다.","يُضِيفُ إِلَى"],["이미 있던 것에 더하여 많아지게 하다.","일손을 보태다."]],1,[]],["폐지하다(廢止하다)","동사",0,"폐할 폐, 그칠 지",[["실시하여 오던 제도나 법규, 일 따위를 그만두거나 없애다.","법률을 폐지하다."]],1,[]],["꺼지다","동사",0,"",[["불이나 빛이 없어지다.","꺼진 등잔불.","يُطْفَأُ"],["등잔이나 양초 따위의 불이 사라져 없어지다.","연탄불이 꺼지다."]],1,[]],["괴이하다(怪異하다)","형용사",0,"괴이할 괴, 다를 이",[["정상적이지 않고 별나며 괴상하다.","갑자기 어디선가 괴이한 신음 소리가 흘러나왔다."]],1,[]],["자랑하다","동사",0,"",[["자기 자신 또는 자기와 관계있는 사람이나 물건, 일 따위가 썩 훌륭하거나 남에게 칭찬을 받을 만한 것임을 드러내어 말하다.","친구들에게 자식을 자랑하다."]],1,[]],["인용하다(引用하다)","동사",0,"끌 인, 쓸 용",[["남의 말이나 글을 자신의 말이나 글 속에 끌어 쓰다.","성경에서 한 구절을 인용하다."]],1,[]],["찬양하다(讚揚하다)","동사",0,"기릴 찬, 날릴 양",[["아름답고 훌륭함을 크게 기리고 드러내다.","왕의 덕을 찬양하다."]],1,[]],["건너다","동사",0,"",[["무엇을 넘거나 지나서 맞은편으로 이동하다.","강을 건너다.","يَقْطَعُ"],["무엇을 사이에 두고 한편에서 맞은편으로 가다.","강을 건너다."],["끼니, 당번, 차례 따위를 거르다.","이틀 건너 한 번씩 머리를 감는다."]],1,[]],["간절하다(懇切하다)","형용사",0,"간절할 간, 끊을 절",[["정성이나 마음 등이 아주 깊다.","간절한 기도.","جَادّ"],["정성이나 마음 씀씀이가 더없이 정성스럽고 지극하다.","간절한 사랑."],["마음속에서 우러나와 바라는 정도가 매우 절실하다.","간절한 부탁."]],1,[]],["헤엄치다","동사",0,"",[["사람이나 물고기 따위가 물속에서 나아가기 위하여 팔다리를 젓거나 지느러미를 움직이다.","바람이 잔잔한 날을 택하여 우리는 바다를 헤엄쳐 건너갔다."]],1,[]],["달하다(達하다)","동사",0,"통달할 달",[["어떠한 정도, 수준, 수량, 상태, 정도 등에 이르다.","경지에 달하다.","يُحَقِّقُ"],["일정한 표준, 수량, 정도 따위에 이르다.","절정에 달하다."]],1,[]],["못나다","동사",0,"",[["생김새가 잘나거나 예쁘지 않다.","못난 남자.","قَبِيح"],["얼굴이 못생기거나 예쁘게 생기지 아니하다.","얼굴이 못났다."]],1,[]],["가려지다","동사",0,"",[["무엇이 사이에 가려서 보이지 않게 되다.","가려진 부분.","مُغَطَّى"],["승패 따위가 구분되다.","연장전에 가서야 승부가 가려질 만큼 팽팽한 경기였다."],["‘가리어지다’의 준말.","그 길은 소나무 숲에 가려져 있었고, 숲은 어둠에 덮이고 있었다.≪한승원, 새끼 무당≫"]],1,[]],["짓궂다","형용사",0,"",[["장난스럽게 남을 괴롭고 귀찮게 하여 달갑지 아니하다.","짓궂은 웃음."]],1,[]],["진귀하다(珍貴하다)","형용사",0,"보배 진, 귀할 귀",[["보배롭고 보기 드물게 귀하다.","진귀한 선물."]],1,[]],["솟구치다","동사",0,"",[["아래에서 위로, 또는 안에서 밖으로 세차게 솟아오르다.","분화구에서 용암이 솟구쳐 오른다."]],1,[]],["감탄하다(感歎하다/感嘆하다)","동사",0,"느낄 감, 탄식할 탄 / 느낄 감, 탄식할 탄",[["마음속 깊이 느끼어 탄복하다.","사람들은 마술사의 신기한 묘기에 감탄했다."]],1,[]],["뛰어오르다","동사",0,"",[["낮은 곳에서 위로 몸을 솟구쳐 오르다.","물고기가 뛰어오르다.","يَقْفِزُ"],["몸을 날리어 높은 곳으로 단숨에 오르다.","달리는 기차에 뛰어오르지 마라."]],1,[]],["잠그다","동사",0,"",[["문 등을 자물쇠나 고리로 남이 열 수 없게 채우다.","잠근 방문.","يُغلق"],["여닫는 물건을 열지 못하도록 자물쇠를 채우거나 빗장을 걸거나 하다.","대문을 잠그다."],["물속에 물체를 넣거나 가라앉게 하다.","물에 수건을 잠그다."]],1,[]],["보존하다(保存하다)","동사",0,"지킬 보, 있을 존",[["잘 보호하고 간수하여 남기다.","환경을 보존하다."]],1,[]],["지지다","동사",0,"",[["국물을 조금 붓고 끓여서 익히다.","지지는 냄새.","يُغَطِّي"],["불이나 불에 달군 물건을 다른 물체에 대어 약간 태우거나 눋게 하다.","인두로 살을 지지다."]],1,[]],["서식하다(棲息하다)","동사",0,"깃들일 서, 쉴 식",[["생물 따위가 일정한 곳에 자리를 잡고 살다.","강에 서식하는 동식물."]],1,[]],["독립되다(獨立되다)","동사",0,"홀로 독, 설 립",[["남에게 의존하거나 매여 있지 않게 되다.","독립된 삶.","يَعْتَمِدُ عَلَى النَّفْس"],["다른 것에 예속하거나 의존하지 아니하는 상태로 되다.","이제는 너도 어른이니 남에게 의존하지 말고 독립된 삶을 살아라."]],1,[]],["음란하다(淫亂하다)","형용사",0,"음란할 음, 어지러울 란",[["음탕하고 난잡하다.","음란한 여자."]],1,[]],["취임하다(就任하다)","동사",0,"나아갈 취, 맡길 임",[["새로운 직무를 수행하기 위하여 맡은 자리에 처음으로 나아가다.","총리에 취임하다."]],1,[]],["출가하다(出家하다)","동사",0,"날 출, 집 가",[["집을 떠나다.","출가하여 성공하다.","يترك المنزل"],["집을 떠나가다.",""]],1,[]],["비참하다(悲慘하다)","형용사",0,"슬플 비, 참혹할 참",[["더할 수 없이 슬프고 끔찍하다.","폭발 사고 현장의 비참한 모습은 말로는 다할 수 없을 지경이었다."]],1,[]],["협력하다(協力하다)","동사",0,"화할 협, 힘 력",[["힘을 합하여 서로 돕다.","힘이 닿는 데까지 당신들에게 협력하겠으니 부탁할 일이 있으면 언제든지 하십시오."]],1,[]],["엇갈리다","동사",0,"",[["가는 방향이나 마주치는 시간이 맞지 않아 서로 만나지 못하다.","길이 엇갈리다.",""],["마주 오는 사람이나 차량 따위가 어떤 한곳에서 순간적으로 만나 서로 지나치다.","내가 차와 엇갈리기 직전에 차가 멈춰 섰다."],["생각이나 주장 따위가 일치하지 않다.","동업자와 이해가 엇갈리다."]],1,[]],["번거롭다","형용사",0,"",[["귀찮을 만큼 몹시 복잡하다.","번거로운 일.","مُعَقَّد"],["일의 갈피가 어수선하고 복잡한 데가 있다.","절차가 번거롭다."]],1,[]],["엉뚱하다","형용사",0,"",[["상식적으로 생각하는 것과 전혀 다르다.","그 사람은 모습과는 다르게 엉뚱한 데가 있다."]],1,[]],["추측하다(推測하다)","동사",0,"밀 추, 헤아릴 측",[["미루어 생각하여 헤아리다.","미래에 일어날 일을 추측하다."]],1,[]],["찔리다","동사",0,"",[["끝이 뾰족하거나 날카로운 것에 의해 어떤 것의 겉면이 뚫어지거나 쑥 들어가도록 세차게 밀리다.","손이 찔리다.","يُطعن، ينثقب، ينخرم"],["끝이 뾰족하거나 날카로운 것에 물체의 겉면이 뚫어지거나 쑥 들어가도록 세차게 들이밀리다. ‘찌르다[1]「1」’의 피동사.","바늘에 손가락이 찔리다."]],1,[]],["되바라지다","동사",0,"",[["너그럽지 못하고 적대적이다.","말투가 되바라지다.","غَيْر وَدُود"],["튀어져 나오고 벌어져서 아늑한 맛이 없다.","그 사람은 늘 뻣뻣한 어깨에 되바라진 가슴팍으로 사뭇 남을 압박하는 듯하다."]],1,[]],["교환하다(交換하다)","동사",0,"사귈 교, 바꿀 환",[["무엇을 다른 것으로 바꾸다.","불량품을 교환하다.","يَسْتَرْجِعُ"],["서로 바꾸다.","화물을 화물표와 교환하다."]],1,[]],["넓히다","동사",0,"",[["면이나 바닥 등의 면적을 크게 하다.","공간을 넓히다.","يُوَسِّع"],["면이나 바닥 따위의 면적을 크게 하다. ‘넓다「1」’의 사동사.","집을 넓히다."]],1,[]],["신봉하다(信奉하다)","동사",0,"믿을 신, 받들 봉",[["사상이나 학설, 교리 따위를 옳다고 믿고 받들다.","자유를 신봉하다."]],1,[]],["겹다","형용사",0,"",[["정도가 지나쳐서 참거나 견뎌 내기가 어렵다.","고통에 겹다.","شَاقّ"],["정도나 양이 지나쳐 참거나 견뎌 내기 어렵다.","힘에 겨운 일."]],1,[]],["엿보다","동사",0,"",[["남이 알지 못하게 몰래 보다.","남을 엿보다.","يختلس النظر إلى"],["남이 보이지 아니하는 곳에 숨거나 남이 알아차리지 못하게 하여 대상을 살펴보다.","창문으로 방 안을 엿보다."]],1,[]],["불러일으키다","동사",0,"",[["어떤 마음, 행동, 상태를 일어나게 하다.","젊은이들에게 과학 기술에 대한 관심을 불러일으키다."]],1,[]],["항복하다(降伏하다/降服하다)","동사",0,"내릴 항, 엎드릴 복 / 내릴 항, 옷 복",[["적이나 상대편의 힘에 눌리어 굴복하다.","일본이 연합군에 항복하다."]],1,[]],["순하다(順하다)","형용사",0,"순할 순",[["성질, 태도 등이 부드럽고 착하다.","순한 눈빛.","وَدِيع"],["성질이나 태도가 까다롭거나 고집스럽지 않다.","순한 사람."]],1,[]],["확대하다(擴大하다)","동사",0,"넓힐 확, 클 대",[["모양이나 규모 따위를 더 크게 하다.","고용을 확대하다."]],1,[]],["거들다","동사",0,"",[["남의 일을 함께 하여 돕다.","부모님을 거들다.","يُسَاعِدُ"],["남이 하는 일을 함께 하면서 돕다.","일을 거들다."]],1,[]],["내키다","동사",0,"",[["하고 싶은 마음이 생기다.","마음이 내키다."]],1,[]],["벗어지다","동사",0,"",[["덮이거나 씌워진 물건 등이 흘러내리거나 몸에서 떼어져서 나가다.","모자가 벗어지다."]],0,[]],["빼어나다","형용사",0,"",[["여럿 가운데서 두드러지게 뛰어나다.","빼어난 미모."]],1,[]],["나아지다","동사",0,"",[["어떤 일이나 상태가 좋아지다.","생활이 나아지다."]],1,[]],["통통하다","동사",0,"",[["작은북이나 속이 빈 작은 나무통 따위를 잇따라 두드려 울리는 소리가 나다. 또는 그런 소리를 내다.",""]],1,[]],["달구다","동사",0,"",[["쇠나 돌 등의 타지 않는 물체를 불에 대어 뜨겁게 하다.","강철을 달구다.","يُسَخِّنُ"],["타지 않는 고체인 쇠나 돌 따위를 불에 대어 뜨겁게 하다.","무쇠를 달구다."]],1,[]],["신중하다(愼重하다)","형용사",0,"삼갈 신, 무거울 중",[["매우 조심스럽다.","신중한 자세."]],1,[]],["잘리다","동사",0,"",[["물체가 베어져 동강이 나다.","잘린 부분.","يُقطع"],["동강이 나거나 끊어지다. ‘자르다01「1」’의 피동사.","수족이 잘리다."],["잘록할 정도로 단단히 죄어 매이다. ‘자르다02’의 피동사.",""]],1,[]],["꼬이다","동사",0,"",[["벌레나 사람 등이 한곳에 많이 몰려들다.","벌레가 꼬이다.","يَحْتَشِدُ"],["가는 줄 따위의 여러 가닥이 비벼지면서 엇감겨 한 줄이 되다. ‘꼬다「1」’의 피동사.","실이 꼬이다."],["벌레 따위가 한곳에 많이 모여들어 뒤끓다.","벌레가 꼬이다."]],1,[]],["물어보다","동사",0,"",[["무엇을 밝히거나 알아내기 위하여 상대편에게 묻다.","행인에게 길을 물어보다."]],1,[]],["천연스럽다(天然스럽다)","형용사",0,"하늘 천, 그럴 연",[["생긴 그대로 조금도 거짓이나 꾸밈이 없고 자연스러운 느낌이 있다.","수수하고 은근하고 천연스러워서 나이 어린 소년들은 때아닌 꽃구경이나 하듯이 이리로 모여들어 왔다.≪한설야, 탑≫"]],1,[]],["운행하다(運行하다)","동사",0,"옮길 운, 다닐 행",[["정해진 길을 따라 자동차나 열차 등이 다니다.","구간을 운행하다.","يسير"],["차량 따위가 정해진 도로나 목적지를 오고 가다.","금일 부산행 열차는 운행하지 않습니다."]],1,[]],["끊이다","동사",0,"",[["계속하거나 이어져 있던 것이 끊어지게 되다.","끊이지 않고 밀려드는 관객들."]],1,[]],["그늘지다","동사",0,"",[["빛이 어떤 물체에 가려져 그늘이 생기다.","그늘진 곳."]],0,[]],["급격하다(急激하다)","형용사",0,"급할 급, 격할 격",[["변화의 움직임 따위가 급하고 격렬하다.","급격하게 변하고 있는 국제 정세."]],1,[]],["뺏다","동사",0,"",[["다른 사람이 가진 것을 강제로 없애거나 자기 것으로 하다.","돈을 뺏다.","يَسْرِقُ"],["‘빼앗다[1]「1」’의 준말.","형이 동생에게서 장난감을 뺏었다."]],1,[]],["물려받다","동사",0,"",[["재물이나 지위 또는 기예나 학술 따위를 전하여 받다.","부모님에게서 유산을 물려받다."]],1,[]],["손상되다(損傷되다)","동사",0,"덜 손, 다칠 상",[["어떤 물건이 깨지거나 상하다.","가구가 손상되다.","يُضَرِّرُ"],["물체가 깨지거나 상하다.","병이 손상되지 않게 뚜껑을 열었다."]],1,[]],["세밀하다(細密하다)","형용사",0,"가늘 세, 빽빽할 밀",[["자세하고 꼼꼼하다.","세밀한 검토."]],1,[]],["방지하다(防止하다)","동사",0,"막을 방, 그칠 지",[["어떤 일이나 현상이 일어나지 못하게 막다.","사고를 미연에 방지하려면 대비를 철저히 해야 한다."]],1,[]],["거주하다(居住하다)","동사",0,"살 거, 살 주",[["일정한 곳에 머물러 살다.","외국에 거주하고 있는 동포들이 조국을 찾아왔다."]],1,[]],["추진하다(推進하다)","동사",0,"밀 추, 나아갈 진",[["물체를 밀어 앞으로 나아가게 하다.","로켓을 추진하다.","يدفع، يحرّك، يسيّر"],["물체를 밀어 앞으로 내보내다.","로켓을 추진하는 고성능 엔진."]],1,[]],["맞아들이다","동사",0,"",[["오는 사람을 맞아 안으로 안내하다.","맞아들인 관광객.","يَسْتَقْبِلُ"],["오는 사람을 맞아 안으로 인도하다.","손님을 맞아들이다."]],1,[]],["고하다(告하다)","동사",0,"고할 고",[["어떤 사실을 알리거나 말하다.","사람들에게 작별을 고하다."]],1,[]],["뻗치다","동사",0,"",[["(강조하는 말로) 나뭇가지나 덩굴, 뿌리 등이 길게 자라나다.","가지를 뻗치다.","يَمْتَدُّ"],["‘뻗다「1」’를 강조하여 이르는 말. ‘벋치다「1」’보다 센 느낌을 준다.","물줄기가 위로 시원하게 뻗치는 분수대."]],1,[]],["양보하다(讓步하다)","동사",0,"사양할 양, 걸음 보",[["다른 사람을 위해 자리나 물건 등을 내주거나 넘겨주다.","길을 양보하다.","يَتَنَازَل عَنْ"],["길이나 자리, 물건 따위를 사양하여 남에게 미루어 주다.","노약자에게 자리를 양보하다."]],1,[]],["퍼뜨리다","동사",0,"",[["널리 퍼지게 하다.","그녀에 대한 소문을 동네에 퍼뜨리다."]],1,[]],["흘러가다","동사",0,"",[["액체 등이 높은 곳에서 낮은 곳으로 흐르면서 나아가다.","흘러가는 강물.","يَجْرِي"],["액체 따위가 높은 곳에서 낮은 곳으로 흐르면서 나아가다.","동쪽으로 흘러가는 강물."]],1,[]],["작용시키다(作用시키다)","동사",0,"지을 작, 쓸 용",[["어떠한 현상이나 행동을 일으키게 하거나 영향을 주게 하다.","법칙을 작용시키다."]],0,[]],["흘러나오다","동사",0,"",[["액체나 기체 등이 밖으로 나오다.","흘러나오는 연기."]],0,[]],["지우다","동사",0,"",[["쓰거나 그린 것 또는 흔적 등을 도구를 사용해 안 보이게 없애다.","지운 흔적.","يَمْحُو"],["일정한 기간이 지날 때까지 시간을 보내다.","사흘 밤을 지우고 쉽게 나왔으나 문수는 소식이 없다.≪이효석, 들≫"],["묻었거나 붙어 있던 것을 닦거나 씻어 없애다. ‘지다02「3」’의 사동사.","마룻바닥에 묻은 얼룩을 걸레로 지웠다."],["아래로 떨어뜨리거나 놓다.","돌아오는 길에는 열이틀 달이 지우는 그늘만 골라 다녔다.≪황순원, 소나기≫"]],1,[]],["탁하다(濁하다)","형용사",0,"흐릴 탁",[["액체나 공기 등에 다른 물질이 섞여 흐리다.","탁한 공기.","موحل، عكر، غير صاف"],["액체나 공기 따위에 다른 물질이 섞여 흐리다.","출근길의 지하철 안은 공기가 무척 탁하다."]],1,[]],["괴로워하다","동사",0,"",[["괴로움을 느끼다.","통증 때문에 괴로워하다."]],1,[]],["성행하다(盛行하다)","동사",0,"성할 성, 다닐 행",[["매우 성하게 유행하다.","조선 태조 이성계 역시 성행하던 풍수지리설에 크게 영향을 받았다."]],1,[]],["수정하다(修正하다)","동사",0,"닦을 수, 바를 정",[["바로잡아 고치다.","계획을 전면으로 수정하다."]],1,[]],["방탕하다(放蕩하다)","형용사",0,"놓을 방, 방탕할 탕",[["주색잡기에 빠져 행실이 좋지 못하다.","방탕한 생활을 청산하다."]],1,[]],["논의하다(論議하다)","동사",0,"논할 논, 의논할 의",[["어떤 문제에 대하여 서로 의견을 내어 토의하다.","책임자와 비상 대책을 논의하다."]],1,[]],["처리되다(處理되다)","동사",0,"곳 처, 다스릴 리",[["일이나 사무, 사건이 절차에 따라 정리되어 마무리되다.","사고가 처리되다.","يتمّ تناوُل، يُعالج"],["사무나 사건 따위가 절차에 따라 정리되어 치러지거나 마무리가 지어지다.","그 사람은 끝내 실종으로 처리되었다."],["일정한 결과를 얻을 목적으로 화학적 또는 물리적 작용이 이루어지다.","방수 약품으로 처리된 시계."]],1,[]],["경작하다(耕作하다)","동사",0,"밭갈 경, 지을 작",[["땅을 갈아서 농사를 짓다.","논밭을 경작하다."]],1,[]],["간섭하다(干涉하다)","동사",0,"방패 간, 건널 섭",[["직접 관계가 없는 남의 일에 부당하게 참견하다.","남의 일에 간섭하지 마라."]],1,[]],["날아오다","동사",0,"",[["공중으로 날아서 오다.","날아오는 비둘기.","يَطِيرُ إِلَى"],["공중으로 날면서 오다.","공이 갑자기 나에게 날아와서 피하지 못했다."]],1,[]],["불거지다","동사",0,"",[["물체의 겉으로 두드러지게 내밀어 나오다.","불거진 여드름.","يَبْرُزُ"],["물체의 거죽으로 둥글게 툭 비어져 나오다.","해어진 양말 밖으로 발가락이 불거지다."]],1,[]],["치밀하다(緻密하다)","형용사",0,"빽빽할 치, 빽빽할 밀",[["자세하고 꼼꼼하다.","치밀한 계획.","شديد التدقيق"],["아주 곱고 촘촘하다.","무늬가 치밀하다."]],1,[]],["수립하다(樹立하다)","동사",0,"나무 수, 설 립",[["국가나 정부, 제도, 계획 따위를 이룩하여 세우다.","외교 관계를 수립하다."]],1,[]],["깊숙하다","형용사",0,"",[["위에서 밑바닥까지 또는 겉에서 속까지의 거리가 아주 멀다.","깊숙하게 들어가다.","عَمِيق إِلَى حَدٍّ مَا"],["위에서 밑바닥까지, 또는 겉에서 속까지의 거리가 멀고 으슥하다.","깊숙한 산골짜기."]],1,[]],["키다","동사",0,"",[["‘켜이다02’의 준말.","나는 물이 자꾸 킨다."],["→ 키우다「1」.",""]],1,[]],["교차하다(交叉하다)","동사",0,"사귈 교, 갈래 차",[["둘 이상의 선이나 물체가 서로 마주치거나 엇갈리다.","길이 교차하다.","يَتَدَاخَلُ"],["서로 엇갈리거나 마주치다.","동해안은 한류와 난류가 교차하고 있어서 좋은 어장으로 손꼽힌다."]],1,[]],["조정하다(調整하다)","동사",0,"고를 조, 가지런할 정",[["어떤 기준이나 실정에 맞게 정돈하다.","대학 정원을 조정하다."]],1,[]],["공정하다(公正하다)","형용사",0,"공평할 공, 바를 정",[["공평하고 올바르다.","판사는 법률에 따라 공정한 재판을 하려고 노력했다."]],1,[]],["거대하다(巨大하다)","형용사",0,"클 거, 클 대",[["엄청나게 크다.","몸집이 거대하다."]],1,[]],["조종하다(操縱하다)","동사",0,"잡을 조, 세로 종",[["비행기나 배 같은 기계를 다루어 움직이게 하다.","조종하는 기술.","يَقُودُ"],["비행기나 선박, 자동차 따위의 기계를 다루어 부리다.","배를 조종하다."]],1,[]],["오리다","동사",0,"",[["칼이나 가위 따위로 베어 내다.","색종이를 오리다."]],1,[]],["명확하다(明確하다)","형용사",0,"밝을 명, 굳을 확",[["명백하고 확실하다.","이 문제에 대해 명확한 입장을 밝혀 주십시오."]],1,[]],["평등하다(平等하다)","형용사",0,"평평할 평, 무리 등",[["권리, 의무, 자격 등이 차별 없이 고르고 한결같다.","그는 자기에게도 다른 사람과 평등한 대우를 해 달라고 요구하였다."]],1,[]],["도읍하다(都邑하다)","동사",0,"도읍 도, 고을 읍",[["그 나라의 수도를 정하다.","한양에 도읍하다."]],1,[]],["감시하다(監視하다)","동사",0,"볼 감, 볼 시",[["단속하기 위하여 주의 깊게 살피다.","아군은 적군의 움직임을 철저하게 감시했다."]],1,[]],["뚫어지다","동사",0,"",[["구멍이나 틈이 생기다.","양말에 구멍이 뚫어지다."]],1,[]],["증가하다(增加하다)","동사",0,"더할 증, 더할 가",[["양이나 수치가 늘다.","소비가 증가하다."]],1,[]],["자빠지다","동사",0,"",[["뒤 또는 옆으로 넘어지다.","뒤로 자빠지다.","يَسْقُط"],["뒤로 또는 옆으로 넘어지다.","눈길에 미끄러져 자빠지다."]],1,[]],["수록되다(收錄되다)","동사",0,"거둘 수, 기록할 록",[["모아져 기록되다.","수많은 신화와 전설이 채집되고 수록되어 후대에 전해지고 있다."]],1,[]],["소박하다(疏薄하다)","동사",0,"소통할 소, 엷을 박",[["처나 첩을 박대하다.","조강지처를 이유 없이 소박하면 비난을 받는다."]],1,[]],["곪다","동사",0,"",[["상처 난 곳에 염증으로 인하여 고름이 생기다.","곪아 터지다.","يَلْتَهِب"],["상처에 염증이 생겨 고름이 들게 되다.","상처가 곪다."]],1,[]],["날뛰다","동사",0,"",[["날듯이 껑충껑충 뛰다.","개가 날뛰다.","يَقْفِزُ"],["날 듯이 껑충껑충 뛰다.","갑자기 말이 날뛰는 바람에 말에서 떨어졌다."]],1,[]],["얄밉다","형용사",0,"",[["말이나 행동이 약빠르고 밉다.","어린 녀석이 되바라진 게 얄밉다."]],1,[]],["뒤틀리다","동사",0,"",[["몸이나 팔다리가 이리저리 돌려지고 비틀려 꼬이다.","뒤틀린 다리.","يَتَلَوّي"],["꼬인 것처럼 몹시 비틀리다. ‘뒤틀다「1」’의 피동사.","얼마나 지루한지 몸이 저절로 뒤틀린다."]],1,[]],["진술하다(陳述하다)","동사",0,"베풀 진, 펼 술",[["일이나 상황에 대해 의견을 자세히 이야기하다.","진술한 글.","يُبيّن٬ يُصرِّح ببيان"],["일이나 상황에 대하여 자세하게 이야기하다.","그는 청중들에게 자신의 의견을 차분히 진술했다."]],1,[]],["시험하다(試驗하다)","동사",0,"시험 시, 시험 험",[["문제, 질문, 실제의 행동 등의 일정한 절차에 따라 지식이나 능력을 검사하고 평가하다.","시험하는 문제.","يمتحن"],["재능이나 실력 따위를 일정한 절차에 따라 검사하고 평가하다.","그는 내 담력을 시험하여 보려고 밤에 공동묘지에 가도록 했다."]],1,[]],["기원하다(祈願하다)","동사",0,"빌 기, 원할 원",[["바라는 일이 이루어지기를 빌다.","온 동네 사람들이 모여 풍년을 기원하는 마을 잔치를 벌였다."]],1,[]],["매끈하다","형용사",0,"",[["울퉁불퉁하거나 거친 데가 없이 미끄럽고 보드랍다.","매끈한 돌.","نَاعِم"],["흠이나 거친 데가 없이 부드럽고 반드럽다.","매끈하게 단장한 집."]],1,[]],["모나다","형용사",0,"",[["사물의 겉 부분에 모가 져 있다.","모난 돌.","يَزْوِي"],["사물의 모습에 모가 있거나 일에 드러난 표가 있다.","모난 기둥."],["물건이 쓰이는 데 유용한 구석이 있다.","그는 적은 돈이지만 모나게 쓴다."]],1,[]],["끔찍하다","형용사",0,"",[["보기에 정도가 지나쳐 놀랄 만하다.","끔찍한 더위.","رَهِيب. مُرْعِب"],["정도가 지나쳐 놀랍다.","끔찍하게 큰 코끼리."]],1,[]],["졸이다","동사",0,"",[["찌개, 국, 한약 등의 물을 줄어들게 하여 양이 적어지게 하다.","졸여서 만들다.",""],["찌개, 국, 한약 따위의 물을 증발시켜 분량을 적어지게 하다. ‘졸다02「1」’의 사동사.","찌개를 졸이다."]],1,[]],["털다","동사",0,"",[["어떤 것에 달려 있거나 붙어 있는 것을 떼어 내기 위해 흔들거나 치다.","곰방대를 털다.","يَهْتَزُّ"],["달려 있는 것, 붙어 있는 것 따위가 떨어지게 흔들거나 치거나 하다.","이불을 털다."]],1,[]],["산화하다(酸化하다)","동사",0,"실 산, 될 화",[["어떤 원자, 분자, 이온 따위가 전자를 잃다.",""]],1,[]],["어루만지다","동사",0,"",[["손으로 부드럽게 쓰다듬어 만지다.","등을 어루만지다.","يَلْمِسُ"],["가볍게 쓰다듬어 만지다.","뺨을 어루만지다."]],1,[]],["무너뜨리다","동사",0,"",[["쌓아 올린 것을 허물어 내려앉게 하다.","건물을 무너뜨리다."]],0,[]],["비틀거리다","동사",0,"",[["힘이 없거나 어지러워서 몸을 바로 가누지 못하고 이리저리 쓰러질 듯이 계속 걷다.","그는 술에 취했는지 몸을 비틀거리며 걷는다."]],1,[]],["물다","동사",0,"",[["어떤 것을 윗입술과 아랫입술 사이에 또는 윗니와 아랫니 사이에 끼워 넣고 벌어진 두 입술이나 이를 다물어 누르다.","담배를 물다.","يَعَضُّ"],["윗니나 아랫니 또는 양 입술 사이에 끼운 상태로 떨어지거나 빠져나가지 않도록 다소 세게 누르다.","담배를 물다."]],1,[]],["관장하다(管掌하다)","동사",0,"대롱 관, 손바닥 장",[["일을 맡아서 주관하다.","대출 업무를 관장하다."]],1,[]],["활용하다(活用하다)","동사",0,"살 활, 쓸 용",[["어떤 대상이 가지고 있는 쓰임이나 능력을 충분히 잘 이용하다.","활용한 인력.","يَسْتَعْمِلُ"],["도구나 물건 따위를 충분히 잘 이용하다.","여가를 자기 계발에 잘 활용하는 사람만이 성공할 수 있다."]],1,[]],["무색투명하다(無色透明하다)","형용사",0,"없을 무, 빛 색, 사무칠 투, 밝을 명",[["빛깔이 없고 투명하다.","유리잔에는 무색투명한 물이 가득 담겨 있었다."]],1,[]],["발효시키다(發效시키다)","동사",0,"필 발, 본받을 효",[["조약, 법, 공문서 등의 효력이 나타나게 하다.","법을 발효시키다."]],0,[]],["해내다","동사",0,"",[["상대편을 사정을 보아주지 않고 이겨 내다.","상대를 해내다.","ينجح، ينجز، يحقّق، ينفّذ"],["상대편을 여지없이 이겨 내다.","이 동리에서 안하무인으로 곤댓짓을 하고 다니는 양반을 해내고 만 것이 통쾌하였다.≪이기영, 고향≫"],["맡은 일이나 닥친 일을 능히 처리하다.","힘든 일을 해내다."]],1,[]],["달콤하다","형용사",0,"",[["맛이나 냄새가 기분 좋게 달다.","달콤한 과일.","حُلْو"],["감칠맛이 있게 달다.","달콤한 사탕."]],1,[]],["유사하다(類似하다)","형용사",0,"무리 유, 닮을 사",[["서로 비슷하다.","그는 식성이 아버지와 유사하다."]],1,[]],["지불하다(支拂하다)","동사",0,"지탱할 지, 떨칠 불",[["돈을 내어주다. 또는 값을 치르다.","피해자에게 배상금을 지불하다."]],1,[]],["배반하다(背反하다/背叛하다)","동사",0,"등 배, 돌이킬 반 / 등 배, 배반할 반",[["믿음과 의리를 저버리고 돌아서다.","의리를 배반하다."]],1,[]],["마련되다","동사",0,"",[["어떤 물건이나 상황이 준비되어 갖추어지다.","어렵게 마련된 등록금."]],0,[]],["부당하다(不當하다)","형용사",0,"아닐 부, 마땅 당",[["이치에 맞지 아니하다.","부당한 요구."]],1,[]],["면제하다(免除하다)","동사",0,"면할 면, 덜 제",[["책임이나 의무 따위를 면하여 주다.","조세와 부역을 면제하다."]],1,[]],["화목하다(和睦하다)","형용사",0,"화할 화, 화목할 목",[["서로 뜻이 맞고 정답다.","이웃들과 화목하게 지내다."]],1,[]],["기대하다(期待하다/企待하다)","동사",0,"기약할 기, 기다릴 대 / 꾀할 기, 기다릴 대",[["어떤 일이 원하는 대로 이루어지기를 바라면서 기다리다.","변화를 기대하다."]],1,[]],["출판하다(出版하다)","동사",0,"날 출, 판목 판",[["서적이나 회화 따위를 인쇄하여 세상에 내놓다.","자비로 책을 출판하다."]],1,[]],["온순하다(溫順하다)","형용사",0,"따뜻할 온, 순할 순",[["성질이나 마음씨가 온화하고 양순하다.","성격이 온순하다."]],1,[]],["미련하다","형용사",0,"",[["터무니없는 고집을 부릴 정도로 매우 어리석고 둔하다.","아프면 미련하게 참지 말고 빨리 병원에 가도록 해."]],1,[]],["사이다","동사",0,"",[["값을 치르고 어떤 물건이나 권리를 자기 것으로 만들게 하다. ‘사다[1]’의 사동사.",""],["안 해도 좋을 일을 일부러 시키다. ‘사다[2]「2」’의 사동사.",""]],1,[]],["관할하다(管轄하다)","동사",0,"대롱 관, 다스릴 할",[["일정한 권한을 가지고 통제하거나 지배하다.","이 고가 도로는 동대문 경찰서가 관할하고 있다."]],1,[]],["엎어지다","동사",0,"",[["앞으로 넘어지다.","아이가 엎어지다.","يُوقِعُ"],["서 있는 사람이나 물체 따위가 앞으로 넘어지다.","사내는 그대로 땅바닥에 엎어졌다."]],1,[]],["얼리다","동사",0,"",[["어울리게 하다.","천길이가 귀순이의 목덜미를 저고리 깃과 얼려서 낚아채는 바람에….≪염상섭, 어설픈 사람들≫"],["액체나 물기가 있는 물체를 찬 기운에 의해 고체 상태로 굳어지게 하다. ‘얼다「1」’의 사동사.","물을 얼리다."]],1,[]],["우아하다(優雅하다)","형용사",0,"넉넉할 우, 맑을 아",[["고상하고 기품이 있으며 아름답다.","우아한 자태."]],1,[]],["총괄하다(總括하다)","동사",0,"다 총, 묶을 괄",[["개별적인 여러 가지를 한데 모아서 묶다.","그는 수많은 민요를 총괄하여 종합적으로 분류하였다."]],1,[]],["부산하다","형용사",0,"",[["급하게 서두르거나 시끄럽게 떠들어 어수선하다.","교실 안은 많은 아이들로 매우 부산하다."]],1,[]],["욕하다(辱하다)","동사",0,"욕될 욕",[["남의 인격을 무시하는 모욕적인 말이나 남을 저주하는 말을 하다.","친구에게 바보라고 욕하다."]],1,[]],["빠뜨리다","동사",0,"",[["물이나 구덩이 등의 깊은 곳에 빠지게 하다.","강에 빠뜨리다.","يُوقِعُ"],["물이나 허방이나 또는 어떤 깊숙한 곳에 빠지게 하다.","반지를 강물에 빠뜨리다."]],1,[]],["둥그렇다","형용사",0,"",[["뚜렷하게 둥글다.","보름달이 둥그렇다."]],1,[]],["흥겹다(興겹다)","형용사",0,"일 흥",[["매우 흥이 나서 즐겁다.","흥겨운 잔치."]],1,[]],["건방지다","형용사",0,"",[["잘난 체하거나 남을 낮추어 보듯이 행동하는 데가 있다.","건방진 소리."]],1,[]],["성장하다(成長하다)","동사",0,"이룰 성, 긴 장",[["사람이나 동물 등이 자라서 점점 커지다.","나무가 성장하다.","يَنْمُو"],["사람이나 동식물 따위가 자라서 점점 커지다.","한창 성장하는 시기인 청소년."]],1,[]],["그득하다","형용사",0,"",[["양이나 수가 정해진 범위에 아주 꽉 찬 상태에 있다.","바구니가 그득하다.","مَلْآن"],["분량이나 수효 따위가 어떤 범위나 한도에 아주 꽉 찬 상태에 있다.","쌀독에 쌀이 그득하다."]],1,[]],["가루다","동사",0,"",[["자리 따위를 함께 나란히 하다.",""]],1,[]],["졸업하다(卒業하다)","동사",0,"마칠 졸, 업 업",[["학생이 규정에 따라 소정의 교과 과정을 마치다.","중학교를 졸업하다."]],1,[]],["끈적끈적하다","형용사",0,"",[["자꾸 들러붙어 끈끈하다.","끈적끈적한 땀."]],0,[]],["엉성하다","형용사",0,"",[["잘 짜이지 않아 어설프고 빈틈이 있다.","엉성하게 만들다.","فَقِير"],["꽉 짜이지 아니하여 어울리는 맛이 없고 빈틈이 있다.","행사의 진행이 어쩐지 엉성하기만 하였다."],["살이 빠져서 뼈만 남을 만큼 버쩍 마른 듯하다.","두 눈이 퀭하고 한편으로 처진 어깻죽지는 엉성하게 야위어 보였다."]],1,[]],["창간하다(創刊하다)","동사",0,"비롯할 창, 새길 간",[["신문, 잡지 따위의 정기 간행물의 첫 번째 호(號)를 펴내다.","잡지를 창간하다."]],1,[]],["생성하다(生成하다)","동사",0,"날 생, 이룰 성",[["사물이 생겨나다. 또는 사물이 생겨 이루어지게 하다.","끊임없이 생성하고 소멸하는 삼라만상."]],1,[]],["세모지다","형용사",0,"",[["모양이 세모꼴로 이루어져 있다.","세모지게 부릅뜬 눈."]],1,[]],["음흉하다(陰凶하다)","형용사",0,"그늘 음, 흉할 흉",[["겉으로는 부드러워 보이나 속으로는 엉큼하고 흉악하다.","음흉한 웃음."]],1,[]],["반반하다","형용사",0,"",[["표면이 구겨지거나 울퉁불퉁한 데가 없이 고르고 평평하다.","반반하게 고르다.","جَيِّد"],["구김살이나 울퉁불퉁한 데가 없이 고르고 반듯하다.","땅을 반반하게 고르다."]],1,[]],["멀어지다","동사",0,"",[["거리가 많이 떨어지게 되다.","기차는 어느새 저만치 멀어졌다."]],1,[]],["좋아지다","동사",0,"",[["좋게 되다.","날씨가 좋아지다."]],1,[]],["마주치다","동사",0,"",[["서로 똑바로 부딪치다.","모퉁이를 돌다가 낯선 사람과 마주쳤다."]],1,[]],["들끓다","동사",0,"",[["여럿이 한곳에 모여 혼잡하게 마구 움직이다.","피난민들이 들끓다"]],0,[]],["우기다","동사",0,"",[["억지를 부려 제 의견을 고집스럽게 내세우다.","그는 가족들에게 자신의 주장을 끝까지 우겼다."]],1,[]],["둘러치다","동사",0,"",[["휘둘러 세게 내던지다.","가방을 둘러치다.","يَهْبِتُ"],["휘둘러 세차게 내던지다.","씨름 경기에서 상대 선수를 힘껏 둘러쳤다."],["둘레를 돌아가며 보이지 않게 막거나 가리다.","별당에 담을 높이 둘러치다."]],1,[]],["이룩하다","동사",0,"",[["큰 현상이나 일, 목적 등을 이루다.","대업을 이룩하다.","يُنْجِزُ"],["어떤 큰 현상이나 사업 따위를 이루다.","민족의 재통일을 이룩하다."]],1,[]],["보좌하다(補佐하다/輔佐하다)","동사",0,"기울 보, 도울 좌 / 도울 보, 도울 좌",[["상관을 도와 일을 처리하다.","그는 사장을 보좌하는 비서실로 발령이 났다."]],1,[]],["해설하다(解說하다)","동사",0,"풀 해, 말씀 설",[["문제나 사건의 내용 따위를 알기 쉽게 풀어 설명하다.","복잡한 내용을 알기 쉽게 해설하다."]],1,[]],["민첩하다(敏捷하다)","형용사",0,"민첩할 민, 빠를 첩",[["재빠르고 날쌔다.","움직임이 민첩하다."]],1,[]],["닥쳐오다","동사",0,"",[["어떤 일이나 대상 따위가 가까이 다다라 오다.","우리에게 언제 닥쳐올지 모르는 자연재해를 대비해야 한다."]],1,[]],["신성하다(神聖하다)","형용사",0,"귀신 신, 성인 성",[["함부로 가까이할 수 없을 만큼 고결하고 거룩하다.","신성한 의식."]],1,[]],["경쾌하다(輕快하다)","형용사",0,"가벼울 경, 쾌할 쾌",[["움직임이나 모습, 기분 따위가 가볍고 상쾌하다.","경쾌한 걸음걸이."]],1,[]],["은밀하다(隱密하다)","형용사",0,"숨을 은, 빽빽할 밀",[["숨어 있어서 겉으로 드러나지 아니하다.","은밀한 요구."]],1,[]],["살리다","동사",0,"",[["생명을 지니게 하다.","목숨을 살리다.","يحي"],["잃어 가던 생명을 다시 지니게 하다. ‘살다01[1]「1」’의 사동사.","죽어 가는 사람을 살리다."]],1,[]],["공평하다(公平하다)","형용사",0,"공평할 공, 평평할 평",[["어느 쪽으로도 치우치지 않고 고르다.","공평한 분배."]],1,[]],["안되다","동사",0,"",[["일이나 현상 등이 좋게 이루어지지 않다.","구별이 안되다.",""],["일, 현상, 물건 따위가 좋게 이루어지지 않다.","올해는 비가 너무 많이 와서 과일 농사가 안돼 큰일이다."]],1,[]],["붙들다","동사",0,"",[["무엇을 떨어뜨리거나 놓치지 않도록 쥐다.","붙드는 전화기.","يُمْسِكُ"],["놓치지 않게 꽉 쥐다.","아이는 어머니의 손목을 꼭 붙들었다."]],1,[]],["일삼다","동사",0,"",[["일로 생각하고 하다.","사냥을 일삼아 해 오다."]],1,[]],["지속되다(持續되다)","동사",0,"가질 지, 이을 속",[["어떤 상태가 오래 계속되다.","경제 성장이 지속되다."]],1,[]],["다녀오다","동사",0,"",[["어떤 곳에 갔다가 돌아오다.","시내를 다녀오다."]],0,[]],["야위다","동사",0,"",[["몸의 살이 빠져 조금 파리하게 되다.","시험을 치른 동생의 얼굴은 몰라보게 야위었다."]],1,[]],["신선하다(新鮮하다)","형용사",0,"새 신, 고울 선",[["새롭고 산뜻하다.","신선한 감동.","طَازَج"],["채소나 과일, 생선 따위가 싱싱하다.","제철에 나는 신선한 과일을 먹는 것이 맛도 좋고 영양가도 많다."]],1,[]],["촬영하다(撮影하다)","동사",0,"모을 촬, 그림자 영",[["사람, 사물, 풍경 따위를 사진이나 영화로 찍다.","기념사진을 촬영하다."]],1,[]],["내다보다","동사",0,"",[["안에서 밖을 보다.","창밖을 내다보다."]],1,[]],["촉진하다(促進하다)","동사",0,"재촉할 촉, 나아갈 진",[["다그쳐 빨리 나아가게 하다.","경제 활동을 촉진하는 기능."]],1,[]],["한정되다(限定되다)","동사",0,"한할 한, 정할 정",[["수량이나 범위 따위가 제한되어 정해지다.","이런 분야의 책은 읽은 사람이 전공자에 한정된다."]],1,[]],["파견되다(派遣되다)","동사",0,"갈래 파, 보낼 견",[["일정한 임무가 주어져 사람이 보내어지다.","김 대리는 해외 지사에 파견되었다."]],1,[]],["근거하다(根據하다)","동사",0,"뿌리 근, 근거 거",[["어떤 곳을 생활이나 활동 등의 근본이 되는 곳으로 삼다.","섬에 근거하다.","يَتَّخِذُ قَاعِدَتَهُ فِي"],["어떠한 곳을 거점으로 삼다.","조선 함경도 원산만에 상륙하여 평안도 평양에 근거하고 있는 적 청군을 모조리 섬멸함으로써….≪유주현, 대한 제국≫"]],1,[]],["시기하다(猜忌하다)","동사",0,"시기할 시, 꺼릴 기",[["남이 잘되는 것을 샘하여 미워하다.","시기하는 마음."]],1,[]],["방출하다(放出하다)","동사",0,"놓을 방, 날 출",[["모아 둔 것을 널리 공급하다.","돈을 방출하다.","يُقَدِّمُ"],["비축하여 놓은 것을 내놓다.","명절을 앞두고 물가의 안정을 위해 농산물을 시중에 전량 방출하였다."]],1,[]],["철저하다(徹底하다)","형용사",0,"통할 철, 밑 저",[["속속들이 꿰뚫어 미치어 밑바닥까지 빈틈이나 부족함이 없다.","그는 자기가 맡은 일에는 아주 철저한 사람이다."]],1,[]],["태평하다(太平하다/泰平하다)","형용사",0,"클 태, 평평할 평 / 클 태, 평평할 평",[["나라가 안정되어 아무 걱정 없고 평안하다.","정치가 잘되어야 나라가 태평하다."]],1,[]],["명령하다(命令하다)","동사",0,"목숨 명, 하여금 령",[["윗사람이 아랫사람에게 무엇을 시키거나 지시하다.","명령하는 말투.","يَأْمُر"],["윗사람이나 상위 조직이 아랫사람이나 하위 조직에 무엇을 하게 하다.","아버지는 정혼한 여자와 결혼할 것을 명령하셨다."]],1,[]],["명백하다(明白하다)","형용사",0,"밝을 명, 흰 백",[["의심할 바 없이 아주 뚜렷하다.","명백한 사실."]],1,[]],["교만하다(驕慢하다)","형용사",0,"교만할 교, 거만할 만",[["잘난 체하며 뽐내고 건방지다.","교만한 태도."]],1,[]],["도리다","동사",0,"",[["둥글게 빙 돌려서 베거나 파다.","종이를 가위로 도리다."]],1,[]],["번영하다(繁榮하다)","동사",0,"번성할 번, 영화 영",[["번성하고 영화롭게 되다.","날로 번영하는 기업."]],1,[]],["섭취하다(攝取하다)","동사",0,"다스릴 섭, 가질 취",[["생물체가 양분 따위를 몸속에 빨아들이다.","영양분을 섭취하다."]],1,[]],["반사하다(反射하다)","동사",0,"돌이킬 반, 쏠 사",[["일정한 방향으로 나아가던 파동이 다른 물체의 표면에 부딪쳐서 나아가던 방향이 반대로 바뀌다. 또는 방향을 반대로 바꾸다.","강물에 햇빛이 반사하며 물비늘을 이룬다."]],1,[]],["재생하다(再生하다)","동사",0,"두 재, 날 생",[["죽게 되었다가 다시 살아나다.","얼굴을 대하고 몸까지 만져 볼 수 있다면 그것은 노국 공주가 재생하는 거나 마찬가지다.≪박종화, 다정불심≫"]],1,[]],["특유하다(特有하다)","형용사",0,"특별할 특, 있을 유",[["일정한 사물만이 특별히 갖추고 있다.","온돌은 한국에 특유한 난방 방식이다."]],1,[]],["처지르다","동사",0,"",[["함부로 불에 대어서 살라 버리다.","장롱을 들어 엎고 불을 처지르고 장독대를 모조리 두들겨 깨뜨려 버리고 가야 한다고 생각했다.≪한승원, 해일≫"]],1,[]],["덧대다","동사",0,"",[["대어 놓은 것 위에 겹쳐 대다.","문에 널빤지를 덧대다."]],1,[]],["꼿꼿하다","형용사",0,"",[["사람의 자세나 서 있는 사물이 굽지 않고 곧다.","꼿꼿하게 서 있다.","مُسْتَقِيم"],["휘거나 구부러지지 아니하고 단단하다.","고개를 꼿꼿하게 쳐들다."]],1,[]],["잦다","동사",0,"",[["액체가 속으로 스며들거나 점점 졸아들어 없어지다.","모심기를 하려고 대어 놓은 물이 다 잦아 논바닥이 말라 버렸다."]],1,[]],["놓치다","동사",0,"",[["손에 잡거나 쥐고 있던 것을 잘못하여 놓아 버리다.","손을 놓치다.","يَفُوتُ، يَفْقِدُ"],["잡거나 쥐고 있던 것을 떨어뜨리거나 빠뜨리다.","그는 잡고 있던 밧줄을 놓쳤다."]],1,[]],["고부라지다","동사",0,"",[["한쪽으로 고붓하게 휘어지다.","늙어서 허리가 고부라진 노인."]],1,[]],["충실하다(充實하다)","형용사",0,"채울 충, 열매 실",[["내용이 알차고 단단하다.","충실한 강의."]],1,[]],["얌전하다","형용사",0,"",[["성격이나 태도가 조용하고 차분하다.","얌전하게 굴다.","لَطِيف"],["성품이나 태도가 침착하고 단정하다.","며느리가 얌전하고 싹싹해서 귀염을 받는다."]],1,[]],["쌀쌀하다","형용사",0,"",[["조금 춥게 느껴질 정도로 날씨가 차다.","쌀쌀한 날씨.","بَارِد"],["날씨나 바람 따위가 음산하고 상당히 차갑다.","낮에는 덥지만 아침저녁으로는 쌀쌀하다."]],1,[]],["대들다","동사",0,"",[["요구하거나 반항하느라고 맞서서 달려들다.","혼자서 깡패 조직에 대들다."]],1,[]],["실없다(實없다)","형용사",0,"열매 실",[["말이나 하는 짓이 실답지 못하다.","실없는 사람."]],1,[]],["불안정하다(不安定하다)","형용사",0,"아닐 불, 편안 안, 정할 정",[["안정성이 없거나 안정되지 못한 상태이다.","이 학생은 정서적으로 불안정한 상태에 놓여 있으니 주위에서 신경을 많이 써 주셔야 합니다."]],1,[]],["산출되다(算出되다)","동사",0,"셈 산, 날 출",[["계산되어 나오다.","가격이 산출되다."]],1,[]],["재촉하다","동사",0,"",[["어떤 일을 빨리하도록 조르다.","봄을 재촉하는 비가 밤새 내렸다."]],1,[]],["반듯하다","형용사",0,"",[["비뚤어지거나 굽거나 흐트러지지 않고 바르다.","반듯한 도형.","مُنْبَسِط"],["작은 물체, 또는 생각이나 행동 따위가 비뚤어지거나 기울거나 굽지 아니하고 바르다.","반듯한 사각형."]],1,[]],["별다르다(別다르다)","형용사",0,"다를 별",[["다른 것과 특별히 다르다.","천재라고 하지만 생긴 것은 일반 아이에 비해 별다른 점이 없다."]],1,[]],["불길하다(不吉하다)","형용사",0,"아닐 불, 길할 길",[["운수 따위가 좋지 아니하다. 또는 일이 예사롭지 아니하다.","불길한 꿈."]],1,[]],["상당하다(相當하다)","형용사",0,"서로 상, 마땅 당",[["어느 정도에 가깝거나 알맞다.","능력에 상당한 대우를 받다."]],1,[]],["기도하다(企圖하다)","동사",0,"꾀할 기, 그림 도",[["어떤 일을 이루도록 꾀하다.","범행을 기도하다."]],1,[]],["노르다","형용사",0,"",[["달걀노른자의 빛깔과 같이 밝고 선명하다.",""]],1,[]],["청구하다(請求하다)","동사",0,"청할 청, 구할 구",[["남에게 돈이나 물건 따위를 달라고 요구하다.","그녀는 김 대리에게 지난달 술값을 청구하러 사무실까지 찾아왔다."]],1,[]],["탐내다(貪내다)","동사",0,"탐낼 탐",[["가지거나 차지하고 싶어 하다.","재산을 탐내다."]],1,[]],["부담하다(負擔하다)","동사",0,"질 부, 멜 담",[["어떠한 의무나 책임을 지다.","그 업무는 애초에 총감독인 내가 많은 책임을 부담할 수밖에 없는 일이다."]],1,[]],["빠져나오다","동사",0,"",[["제한된 환경이나 경계의 밖으로 나오다.","회의가 너무 진지해서 자리에서 빠져나올 수가 없었다."]],1,[]],["들르다","동사",0,"",[["지나는 길에 잠깐 들어가 머무르다.","친구 집에 들르다."]],1,[]],["창작하다(創作하다)","동사",0,"비롯할 창, 지을 작",[["무엇을 처음으로 만들어 내다.","교재를 창작하다.","يبدع"],["방안이나 물건 따위를 처음으로 만들어 내다.","우리는 미래의 세계를 소재로 한 여러 가지 프로그램들을 창작했다."]],1,[]],["취급하다(取扱하다)","동사",0,"가질 취, 거둘 급",[["물건을 사용하거나 판매 등의 대상으로 삼다.","취급하는 물품.","يَتناول، يعالج"],["물건이나 일 따위를 대상으로 삼거나 처리하다.","그는 공장에서 주로 용접기를 취급하고 있다."]],1,[]],["짚이다","동사",0,"",[["헤아려 본 결과 어떠할 것으로 짐작이 가다.","아무리 생각해 보아도 짚이는 바가 없다."]],1,[]],["섬세하다(纖細하다)","형용사",0,"가늘 섬, 가늘 세",[["곱고 가늘다.","섬세한 필치."]],1,[]],["내쫓다","동사",0,"",[["있던 곳에서 강제로 밖으로 나가게 하다.","마을에서 내쫓다.","يَطْرُد"],["밖으로 몰아내다.","마당에 널린 곡식을 쪼아 먹는 참새 떼를 밖으로 내쫓았다."]],1,[]],["소화되다(消化되다)","동사",0,"사라질 소, 될 화",[["먹은 음식물이 뱃속에서 분해되어 영양분으로 흡수되다.","고기가 소화되다.","يَهْضِم"],["섭취한 음식물이 분해되어 영양분이 흡수되기 쉬운 형태로 변화되다. 음식물을 씹는 작용에 의해 기계적으로 소화되는 일과 소화 효소에 의해 화학적으로 소화되는 일이 있다.","천천히 소화되다."]],1,[]],["돌출하다(突出하다)","동사",0,"갑자기 돌, 날 출",[["예기치 못하게 갑자기 쑥 나오거나 불거지다.","예고 없이 돌출한 사태에 모두 놀랐다."]],1,[]],["더부룩하다","형용사",0,"",[["풀이나 머리카락 등이 다듬지 않아서 단정하지 못하고 거칠다.","나무가 더부룩하다.","كَثِيف"],["풀이나 나무 따위가 거칠게 수북하다.","집 앞 묵정밭에는 잡초만 더부룩하게 자라 있다."],["소화가 잘 안되어 뱃속이 거북하다.","이것저것 너무 많이 먹었더니 배가 더부룩하다."]],1,[]],["이바지하다","동사",0,"",[["도움이 되게 하다.","나라에 이바지하다."]],1,[]],["막연하다(漠然하다)","형용사",0,"넓을 막, 그럴 연",[["어떤 일이 닥쳤을 때 어떻게 하면 좋을지 몰라 아득하다.","막연한 상황.","مُبْهَم"],["갈피를 잡을 수 없게 아득하다.","앞으로 살아갈 길이 막연하다."]],1,[]],["입각하다(立脚하다)","동사",0,"설 입, 다리 각",[["어떤 사실이나 주장 따위에 근거를 두어 그 입장에 서다.","그것은 사실에 입각한 주장이 아니다."]],1,[]],["길들이다","동사",0,"",[["사람이 짐승을 잘 따르게 가르쳐서 부리기 좋게 하다.","사육사가 길들이다."]],0,[]],["겸임하다(兼任하다)","동사",0,"겸할 겸, 맡길 임",[["두 가지 이상의 직무를 아울러 맡아보다.","그는 한 주식회사의 대표 이사로 있으면서 우리 대학 이사장을 겸임하였다."]],1,[]],["잠자다","동사",0,"",[["몸과 정신이 활동을 멈추고 한동안 쉬다.","잠자는 모습.","ينام"],["자는 상태에 있다.","곤하게 잠자다."]],1,[]],["비속하다(卑俗하다)","형용사",0,"낮을 비, 풍속 속",[["격이 낮고 속되다.","비속한 말씨."]],1,[]],["맹세하다(盟誓▽하다)","동사",0,"맹세 맹, 맹세할 서",[["일정한 약속이나 목표를 꼭 실천하겠다고 다짐하다.","국가에 충성을 맹세하다."]],1,[]],["채택하다(採擇하다)","동사",0,"캘 채, 가릴 택",[["작품, 의견, 제도 따위를 골라서 다루거나 뽑아 쓰다.","결의안을 채택하다."]],1,[]],["떠내다","동사",0,"",[["액체를 퍼서 밖으로 옮기다.","된장찌개에서 국물을 떠내다."]],1,[]],["흡족하다(洽足하다)","형용사",0,"흡족할 흡, 발 족",[["조금도 모자람이 없을 정도로 넉넉하여 만족스러운 상태에 있다.","마음이 흡족하다."]],1,[]],["질다","형용사",0,"",[["밥이나 반죽 등이 물기가 많다.","반죽을 질게 하다.","ليّن"],["밥이나 반죽 따위가 되지 아니하고 물기가 많다.","밥이 질다."]],1,[]],["뿜다","동사",0,"",[["속에 있는 기체나 액체 등을 밖으로 세게 밀어 내다.","김을 뿜다.","يَبْجُس ، يُفَجِّر"],["속에 있는 것을 밖으로 세게 밀어 내다.","물을 뿜는 분수."]],1,[]],["장사하다","동사",0,"",[["이익을 얻으려고 물건을 사서 팔다.","선흥이가 원래 성미가 쾌활하고 사람 사귀기를 좋아하니 산지사방을 떠돌며 장사하는 것에 이력이 나서, 말수가 적고 소심한 인흥이보다 상리가 많았다.≪황석영, 장길산≫"]],1,[]],["북받치다","동사",0,"",[["감정이나 힘 따위가 속에서 세차게 치밀어 오르다.","노여움이 북받치다."]],1,[]],["넘쳐흐르다","동사",0,"",[["액체가 가득 차서 밖으로 흐르다.","강물이 넘쳐흐르다."]],0,[]],["빈정거리다","동사",0,"",[["남을 은근히 비웃는 태도로 자꾸 놀리다.","그는 나에게 겨우 그런 학교에 입학했느냐고 빈정거리면서 은근히 무시하였다."]],1,[]],["붙잡다","동사",0,"",[["무엇을 놓치지 않도록 단단히 잡다.","손을 붙잡다.","يَسْمُكُ"],["놓치지 않도록 단단히 쥐다.","소매를 붙잡다."]],1,[]],["그렇다","형용사",0,"",[["상태, 모양, 성질 등이 그와 같다.","그런 경우.","كَذَا"],["상태, 모양, 성질 따위가 그와 같다.","상황이 그러니 어찌하겠나?"]],1,[]],["두근거리다","동사",0,"",[["놀람, 불안, 기대 등으로 가슴이 자꾸 세고 빠르게 뛰다.","가슴이 두근거리다."]],0,[]],["전파되다(傳播되다)","동사",0,"전할 전, 뿌릴 파",[["전하여져 널리 퍼뜨려지다.","풍문은 꼬리에 꼬리를 물고 인근 사방에 전파되었다."]],1,[]],["운반되다(運搬되다)","동사",0,"옮길 운, 옮길 반",[["물건 따위가 옮겨지다.","목재가 인접한 산지에 운반되었다."]],1,[]],["참견하다(參見하다)","동사",0,"참여할 참, 볼 견",[["자기와 별로 관계없는 일이나 말 따위에 끼어들어 쓸데없이 아는 체하거나 이래라저래라 하다.","남의 일에 참견하다."],["어떤 자리에 직접 나아가서 보다.",""]],1,[]],["설익다","동사",0,"",[["충분하지 않게 익다.","설익은 밥.","غَيْر نَاضِج"],["충분하지 아니하게 익다.","아침에 설익은 밥을 먹었더니 하루 종일 속이 더부룩하다."]],1,[]],["인접하다(鄰接하다)","동사",0,"이웃 인, 이을 접",[["이웃하여 있다. 또는 옆에 닿아 있다.","바다에 인접한 마을."]],1,[]],["실현하다(實現하다)","동사",0,"열매 실, 나타날 현",[["꿈, 기대 따위를 실제로 이루다.","꿈을 실현하다."]],1,[]],["다가오다","동사",0,"",[["어떤 대상이 있는 쪽으로 가까이 옮기어 오다.","기차가 다가오다.","يُهِلُّ"],["어떤 대상이 있는 쪽으로 더 가까이 옮기어 오다.","아내는 미소를 지으며 나에게 다가왔다."]],1,[]],["일다","동사",0,"",[["어떤 현상이나 사건이 생기다.","논란이 일다.","يَقَعُ"],["없던 현상이 생기다.","파문이 일다."],["곡식이나 사금 따위를 그릇에 담아 물을 붓고 이리저리 흔들어서 쓸 것과 못 쓸 것을 가려내다.","그녀는 조리로 쌀을 일어 밥을 지었다."]],1,[]],["정벌하다(征伐하다)","동사",0,"칠 정, 칠 벌",[["적 또는 죄 있는 무리를 무력으로써 치다.","오랑캐를 정벌하다."]],1,[]],["실천하다(實踐하다)","동사",0,"열매 실, 밟을 천",[["생각한 바를 실제로 행하다.","계획을 실천하다."]],1,[]],["강렬하다(強烈하다)","형용사",0,"강할 강, 매울 렬",[["강하고 세차다.","강렬한 빛."]],1,[]],["사양하다(辭讓하다)","동사",0,"말씀 사, 사양할 양",[["겸손하여 받지 아니하거나 응하지 아니하다. 또는 남에게 양보하다.","벼슬을 사양하다."]],1,[]],["원활하다(圓滑하다)","형용사",0,"둥글 원, 미끄러울 활",[["까다로운 데가 없이 원만하다.","원활하게 유지하다.","موائم"],["모난 데가 없고 원만하다.","원활한 사회 적응."]],1,[]],["생생하다","형용사",0,"",[["시들거나 상하지 않고 생기가 있다.","생생한 꽃.","طَازَج"],["시들거나 상하지 아니하고 생기가 있다.","생생한 야채."]],1,[]],["우러나오다","동사",0,"",[["생각, 감정, 성질 따위가 마음속에서 저절로 생겨나다.","진심에서 우러나오는 충고."]],1,[]],["쪼다","동사",0,"",[["뾰족한 끝으로 쳐서 찍다.","닭이 모이를 쪼고 있다."]],1,[]],["감염되다(感染되다)","동사",0,"느낄 감, 물들 염",[["나쁜 버릇, 풍습, 가치관, 환경 등이 영향을 주어 똑같이 되게 하다.","권위주의에 감염되다.","يَتَأَثَّرُ، إِصَابَة"],["병원체인 미생물이 동물이나 식물의 몸 안으로 들어와 증식되다.","병균에 감염되다."]],1,[]],["모방하다(模倣하다/摸倣하다/摹倣하다)","동사",0,"본뜰 모, 본뜰 방 / 본뜰 모, 본뜰 방 / 베낄 모, 본뜰 방",[["다른 것을 본뜨거나 본받다.","남의 작품을 모방하다."]],1,[]],["유쾌하다(愉快하다)","형용사",0,"즐거울 유, 쾌할 쾌",[["즐겁고 상쾌하다.","유쾌한 기분."]],1,[]],["심해지다(甚해지다)","동사",0,"심할 심",[["정도가 지나치게 되다.","감기가 심해지다."]],1,[]],["회복하다(回復/恢復하다)","동사",0,"돌아올 회, 회복할 복 / 넓을 회, 회복할 복",[["아프거나 약해졌던 몸을 다시 예전의 상태로 돌이키다.","건강을 회복하다.","يَنْتَعِشُ"],["잃었던 것을 되찾거나 나빠졌던 것을 원래의 상태로 돌이키다.","경기를 회복하다."]],0,[]],["까맣다","형용사",0,"",[["불빛이 전혀 없는 밤하늘과 같이 짙게 검다.","까만 구두.","أَسْوَد ، فَاحِم"],["불빛이 전혀 없는 밤하늘과 같이 밝고 짙게 검다. ‘가맣다「1」’보다 센 느낌을 준다.","까만 머리카락."]],1,[]],["울퉁불퉁하다","형용사",0,"",[["물체의 거죽이나 면이 고르지 않게 여기저기 몹시 나오고 들어간 데가 있다.","도로포장이 안 된 길이라 노면이 울퉁불퉁하였으므로 버스는 있는 대로 요동을 치고 있었다.≪최인호, 지구인≫"]],1,[]],["실현되다(實現되다)","동사",0,"열매 실, 나타날 현",[["꿈, 기대 따위가 실제로 이루어지다.","할아버지는 통일이 실현될 날을 손꼽아 기다리셨다."]],1,[]],["격하다(激하다)","동사",0,"격할 격",[["갑작스럽게 성을 내거나 흥분하다.","동생은 조그만 일에 격하여 문제를 일으키곤 했다."]],1,[]],["자살하다(自殺하다)","동사",0,"스스로 자, 죽일 살",[["스스로 자기의 목숨을 끊다.","권총으로 자살하다."]],1,[]],["현명하다(賢明하다)","형용사",0,"어질 현, 밝을 명",[["어질고 슬기로워 사리에 밝다.","현명한 선택."]],1,[]],["시도하다(試圖하다)","동사",0,"시험 시, 그림 도",[["어떤 것을 이루어 보려고 계획하거나 행동하다.","재착륙을 시도하다."]],1,[]],["부어오르다","동사",0,"",[["살갗 따위가 부어서 부풀어 오르다.","눈이 부어오르다."]],1,[]],["위협하다(威脅하다)","동사",0,"위엄 위, 위협할 협",[["상대가 겁을 먹도록 무서운 말이나 행동으로 협박하다.","생명을 위협하다."]],1,[]],["산출하다(算出하다)","동사",0,"셈 산, 날 출",[["계산하여 내다.","원가를 산출하다."]],1,[]],["단속하다(團束하다)","동사",0,"둥글 단, 묶을 속",[["잘못되지 않도록 주의를 기울여 관리하다.","물건을 단속하다.","يُشْرِفُ"],["주의를 기울여 다잡거나 보살피다.","아이들을 단속하다."]],1,[]],["헐겁다","형용사",0,"",[["어떤 물건과 그것이 끼워질 자리가 꼭 맞지 않고 틈이 있다.","구두가 헐겁다.","غير مشدود ، مَرخي"],["낄 물건보다 낄 자리가 꼭 맞지 아니하고 크다.","신발이 헐거워서 너무 불편했다."]],1,[]],["뱉다","동사",0,"",[["입안에 들어 있는 것을 입 밖으로 내보내다.","기침을 뱉다.","يَبْصُق"],["입속에 있는 것을 입 밖으로 내보내다.","침을 뱉다."]],1,[]],["오므라지다","동사",0,"",[["물건의 가장자리 끝이 한곳으로 줄어지어 모이다.","꽃봉오리가 오므라지다."],["물체의 거죽이 안으로 오목하게 패어 들어가다.","두 볼이 오므라진 노파."]],1,[]],["저러하다","형용사",0,"",[["‘저렇다’의 본말.","저러한 환경에서 사람이 살 수 있을까?"]],1,[]],["배뚤어지다","동사",0,"",[["바르지 아니하고 한쪽으로 조금 기울어지거나 쏠리다.","입이 좀 배뚤어졌다."]],1,[]],["낚다","동사",0,"",[["낚시나 그물로 물고기를 잡다.","고기를 낚다.","يَصِيدُ سَمَكًا"],["낚시로 물고기를 잡다.","월척을 낚다."]],1,[]],["감당하다(堪當하다)","동사",0,"견딜 감, 마땅 당",[["어떤 일을 맡아 자기 능력으로 해내다.","역할을 감당하다.","يَتَمَكَّنُ"],["일 따위를 맡아서 능히 해내다.","입원비를 감당할 능력이 없다."]],1,[]],["본뜨다(本뜨다)","동사",0,"근본 본",[["무엇을 본보기로 삼아 그대로 따라하다.","말을 본뜨다.","يُقَلِّدُ"],["무엇을 본보기로 삼아 그대로 좇아 하다.","아이들은 부모의 행동을 본뜨게 마련이다."]],1,[]],["방문하다(訪問하다)","동사",0,"찾을 방, 물을 문",[["어떤 사람이나 장소를 찾아가서 만나거나 보다.","오후에 고객의 사무실에 방문하기로 약속했다."]],1,[]],["수집하다(蒐集하다)","동사",0,"모을 수, 모을 집",[["취미나 연구를 위하여 여러 가지 물건이나 재료를 찾아 모으다.","도자기를 수집하다."]],1,[]],["거룩하다","형용사",0,"",[["뜻이 매우 높고 위대하다.","거룩하신 하느님."]],1,[]],["점령하다(占領하다)","동사",0,"점칠 점, 거느릴 령",[["무력으로 어떤 장소나 공간을 빼앗아 차지하다.","시위대가 점령하다.","يَحْتَلُّ"],["어떤 장소를 차지하여 자리를 잡다.","시위대는 도청을 점령한 채 농성을 계속하였다."]],1,[]],["친밀하다(親密하다)","형용사",0,"친할 친, 빽빽할 밀",[["지내는 사이가 매우 친하고 가깝다.","그는 동료들과 친밀하게 지낸다."]],1,[]],["장악하다(掌握하다)","동사",0,"손바닥 장, 쥘 악",[["무엇을 마음대로 할 수 있게 휘어잡다. 손안에 잡아 쥔다는 뜻에서 나온 말이다.","그는 서서히 소대를 무리 없이 장악하고 동료 장교들과 부하들의 신뢰를 어느 정도 얻을 수 있었다.≪이원규, 훈장과 굴레≫"]],1,[]],["설계하다(設計하다)","동사",0,"베풀 설, 셀 계",[["앞으로 할 일에 대하여 계획을 세우다.","꿈을 설계하다.",""],["계획을 세우다.","내 인생은 내 스스로 설계하고 싶다."]],1,[]],["손쉽다","형용사",0,"",[["어떤 것을 다루거나 어떤 일을 하기가 퍽 쉽다.","손쉬운 해결 방법."]],1,[]],["푸르스름하다","형용사",0,"",[["조금 푸르다.","푸르스름한 불빛."]],1,[]],["발휘하다(發揮하다)","동사",0,"필 발, 휘두를 휘",[["재능, 능력 따위를 떨치어 나타내다.","능력을 발휘하다."]],1,[]],["창립하다(創立하다)","동사",0,"비롯할 창, 설 립",[["기관이나 단체 따위를 새로 만들어 세우다.","학회를 창립하고 학회지를 창간했다."]],1,[]],["찾아보다","동사",0,"",[["어떤 사람이 있는 곳에 가서 그 사람을 만나다.","관계자를 찾아보다.","يَزُور"],["어떤 사람이 있는 곳으로 가서 그 사람을 만나다.","그는 누구 하나 찾아보는 사람이 없는 처량한 신세였다."],["원하는 정보를 구하거나 알기 위하여 대상물을 검토하거나 조사하다.","이 단어의 뜻을 알고 싶으면 사전을 찾아보아라."]],1,[]],["기운차다","형용사",0,"",[["힘이 가득하고 넘치는 듯하다.","군인들이 기운차게 군가를 부른다."]],1,[]],["되돌아가다","동사",0,"",[["원래 있던 곳으로 다시 돌아가다.","되돌아가는 길.","يَعُودُ إِلَى"],["원래 있던 곳이나 원래 상태로 도로 돌아가다.","옛 애인에게 되돌아가다."]],1,[]],["끈덕지다","형용사",0,"",[["끈기가 있고 꾸준하다.","끈덕진 생명력."]],1,[]],["막되다","형용사",0,"",[["말이나 행동이 버릇없고 난폭하다.","막된 사람.","وَقِح، غَيْر مُهَذَّب"],["거칠고 좋지 못하다.","막된 일."]],1,[]],["폐하다(廢하다)","동사",0,"폐할 폐",[["있던 제도, 기관, 풍습 등을 버리거나 없애다.","국호를 폐하다.","يُلْغِي"],["있던 제도·기관·풍습 따위를 버리거나 없애다.","왕은 형식적인 의례를 모두 폐하라고 명했다."]],1,[]],["한탄하다(恨歎하다/恨嘆하다)","동사",0,"한 한, 탄식할 탄 / 한 한, 탄식할 탄",[["원통하거나 뉘우치는 일이 있을 때 한숨을 쉬며 탄식하다.","자신의 불운을 한탄하다."]],1,[]],["꿇다","동사",0,"",[["무릎을 굽혀 땅에 대다.","무릎을 꿇다.","يَرْكَعُ"],["무릎을 구부려 바닥에 대다.","무릎을 꿇고 머리가 땅에 닿도록 빌다."],["자기가 마땅히 할 차례에 못 하다.","그는 아파서 한 학년을 꿇었다."]],1,[]],["바라지다","동사",0,"",[["틈이나 간격 등이 생기다.","바라진 문.","يَنْشَقُّ"],["갈라져서 사이가 뜨다.","바라진 문 사이로 바람이 들어온다."]],1,[]],["인쇄되다(印刷되다)","동사",0,"도장 인, 인쇄할 쇄",[["잉크가 사용되어 판면(版面)에 그려져 있는 글이나 그림 따위가 종이, 천 따위에 박혀 나오다.","꽃무늬가 선명하게 인쇄된 천."]],1,[]],["풀어지다","동사",0,"",[["매이거나 묶이거나 얽힌 것이 원래의 상태로 되다.","풀어진 매듭.","ينحلّ"],["묶이거나 얽힌 것이 그렇지 아니한 상태로 되다.","옷고름이 풀어지다."]],1,[]],["불필요하다(不必要하다)","형용사",0,"아닐 불, 반드시 필, 요긴할 요",[["필요하지 아니하다.","생활하는 데에 불필요한 지출을 줄이다."]],1,[]],["끼이다","동사",0,"",[["벌어진 사이에 넣어지고 죄여 빠지지 않게 되다.","머리가 끼이다.","يُدْخَلُ بَيْنَ"],["벌어진 사이에 들어가 죄이고 빠지지 않게 되다. ‘끼다03[1]「1」’의 피동사.","옆구리에 끼인 가방."],["무엇에 걸려 있도록 꿰어지거나 꽂히다. ‘끼다03[1]「2」’의 피동사.","반지가 작아 손가락에 끼이질 않는다."]],1,[]],["자라나다","동사",0,"",[["키나 몸집이 점점 커지다.","키가 자라나다."]],0,[]],["수다스럽다","형용사",0,"",[["쓸데없이 말수가 많은 데가 있다.","수다스럽게 지껄이다."]],1,[]],["거무스름하다","형용사",0,"",[["빛깔이 조금 검은 듯하다.","거무스름한 살결."]],1,[]],["징수하다(徵收하다)","동사",0,"부를 징, 거둘 수",[["나라, 공공 단체, 지주 등이 돈, 곡식, 물품 등을 거두어들이다.","징수한 단체.","يَجْمَعُ"],["나라, 공공 단체, 지주 등이 돈, 곡식, 물품 따위를 거두어들이다.","회원들에게서 회비를 징수하다."]],1,[]],["심사하다(審査하다)","동사",0,"살필 심, 조사할 사",[["자세하게 조사하여 등급이나 당락 따위를 결정하다.","자격을 심사하다."]],1,[]],["설립되다(設立되다)","동사",0,"베풀 설, 설 립",[["기관이나 조직체 따위가 만들어져 일으켜지다.","대학에 부설 연구소가 설립되다."]],1,[]],["몰아내다","동사",0,"",[["강제로 밖으로 나가게 하거나 다른 곳으로 쫓아내다.","외세를 몰아내다.","يُبْعِدُ"],["몰아서 밖으로 쫓거나 나가게 하다.","침입한 외적을 영토 밖으로 몰아내다."]],1,[]],["의존하다(依存하다)","동사",0,"의지할 의, 있을 존",[["다른 것에 의지하여 존재하다.","우리나라 경제는 석유에 크게 의존하고 있다."]],1,[]],["가혹하다(苛酷하다)","형용사",0,"가혹할 가, 심할 혹",[["몹시 모질고 혹독하다.","가혹한 처벌."]],1,[]],["오래다","형용사",0,"",[["때의 지나간 동안이 길다.","내가 고향을 떠나고 오래지 않아 우리는 다시 만났다."]],1,[]],["거래하다(去來하다)","동사",0,"갈 거, 올 래",[["돈이나 물건을 주고받거나 사고팔다.","물건을 거래하다.","يُتَاجِرُ"],["물건 따위를 주고받거나 사고팔다.","우리는 그들과 공산품을 거래한다."],["친분 관계를 이루기 위하여 오고 가다.","뭐, 밥 한 끼 얻어먹는다든가 그런 것이 문제가 아니라 해외에 나와서 자기 나라 외교인들과 거래한다는 것은 어딘지 모르게 마음 든든한 일이거든요.≪정비석, 비석과 금강산의 대화≫"]],1,[]],["옮다","동사",0,"",[["어떤 곳에서 다른 곳으로 이동하다.","옮아 다니다.","يتنقّل"],["어떤 곳에서 다른 곳으로 움직여 자리를 바꾸다.","그래 그들 젊은 부부는 남편의 폐병에 좋다 하여 마을 뒤 과수원으로 옮아 살았다.≪이범선, 살모사≫"]],1,[]],["이행하다(履行하다)","동사",0,"밟을 이, 다닐 행",[["실제로 행하다.","약속을 이행하다."]],1,[]],["몰아치다","동사",0,"",[["한꺼번에 몰려서 매우 강하게 일어나다.","눈보라가 몰아치다.","يَهُبُّ"],["한꺼번에 몰려 닥치다.","눈보라가 몰아치다."]],1,[]],["붉어지다","동사",0,"",[["빛깔이 점점 붉게 되어 가다.","고추가 붉어지다."]],1,[]],["달아오르다","동사",0,"",[["물체가 매우 뜨거워지다.","난로가 달아오르다.","يَسْخُنُ"],["어떤 물체가 몹시 뜨거워지다.","쇠붙이가 달아오르다."]],1,[]],["해산하다(解散하다)","동사",0,"풀 해, 흩을 산",[["모였던 사람들이 흩어지다. 또는 흩어지게 하다.","해산한 군중.","يشتّت، يبدّد، يفضّ، يفرّق"],["모였던 사람이 흩어지다. 또는 흩어지게 하다.","군중이 해산하다."]],1,[]],["참혹하다(慘酷하다)","형용사",0,"참혹할 참, 심할 혹",[["비참하고 끔찍하다.","참혹한 결과."]],1,[]],["지향하다(志向하다)","동사",0,"뜻 지, 향할 향",[["어떤 목표로 뜻이 쏠리어 향하다.","평화를 지향하다."]],1,[]],["평온하다(平穩하다)","형용사",0,"평평할 평, 편안할 온",[["조용하고 평안하다.","평온한 표정."]],1,[]],["둘리다","동사",0,"",[["그럴듯한 꾀에 속다.","잔꾀에 둘리다.","يَخْضَعُ"],["둘레가 둘러싸이다.","이 섬은 산과 내로 둘려 있어 아름다울 뿐 아니라 분위기도 아늑하다."]],1,[]],["참고하다(參考하다)","동사",0,"참여할 참, 생각할 고",[["살펴 생각하여 도움을 얻다.","참고할 사항.","يُراجِع"],["살펴서 생각하다.","그의 말을 참고하여 대책을 세우도록 하시오."]],1,[]],["방이다","동사",0,"",[["어떤 부분을 힘 있게 후려치다.","그의 가슴을 냅다 한 방 방이었더니 나가동그라졌다."]],1,[]],["지극하다(至極하다)","형용사",0,"이를 지, 극진할 극",[["더할 수 없이 극진하다.","그녀는 효성이 지극하다."]],1,[]],["고집하다(固執하다)","동사",0,"굳을 고, 잡을 집",[["자기의 의견을 바꾸거나 고치지 않고 굳게 버티다.","그는 자기주장을 끝까지 고집하며 결코 양보하지 않았다."]],1,[]],["한가롭다(閑暇롭다)","형용사",0,"한가할 한, 틈 가",[["한가한 느낌이 있다.","한가로운 오후 시간."]],1,[]],["망치다","동사",0,"",[["잘못하여 그르치거나 아주 못 쓰게 만들다.","신세를 망치다."]],1,[]],["축다","동사",0,"",[["물기에 젖어 축축해지다.",""]],1,[]],["배치되다(背馳되다)","동사",0,"등 배, 달릴 치",[["서로 반대로 되어 어그러지거나 어긋나게 되다.","법규에 배치되다."]],1,[]],["비방하다(比方하다)","동사",0,"견줄 비, 모 방",[["서로 견주어 보다.","외국 제품을 우리 제품과 꼼꼼히 비방해 보다."]],1,[]],["쐬다","동사",0,"",[["얼굴이나 몸에 바람이나 햇볕 등을 직접 받다.","맑은 공기를 쐬다.","يعرّض شيئًا ، يستقبل"],["얼굴이나 몸에 바람이나 연기, 햇빛 따위를 직접 받다.","바람을 쐬다."]],1,[]],["정성스럽다(精誠스럽다)","형용사",0,"정할 정, 정성 성",[["보기에 온갖 힘을 다하려는 참되고 성실한 마음이 있다.","정성스러운 뒷바라지."]],1,[]],["조각하다(彫刻하다/雕刻하다)","동사",0,"새길 조, 새길 각 / 독수리 조, 새길 각",[["재료를 새기거나 깎아서 입체 형상을 만들다. 주로 나무, 돌, 금속 따위로 만든다.","대리석으로 얼굴을 조각하다.",""],["재료를 깎고 새기거나 빚어서 입체 형상을 만들다. 보통 조각하는 일과 소조하는 일을 아울러 이른다.",""]],1,[]],["헤매다","동사",0,"",[["이리저리 돌아다니다.","헤매는 사람.","يهيم"],["갈 바를 몰라 이리저리 돌아다니다.","우리는 친구의 집을 못 찾아 골목에서 헤매고 다녔다."]],1,[]],["비기다","동사",0,"",[["경기에서 점수가 같아 승부를 내지 못하고 끝내다.","비긴 경기.","يَتَعَادَلُ"],["서로 견주어 보다.","자식의 마음을 감히 부모의 마음에 비길 수는 없다."]],1,[]],["방정맞다","형용사",0,"",[["말이나 행동이 찬찬하지 못하고 몹시 까불어서 가볍고 점잖지 못하다.","방정맞게 떠들지 말고 조용히 해라."]],1,[]],["달려들다","동사",0,"",[["갑자기 세차게 다가가다.","밥상에 달려들다.","يُلْقِي بِنَفْسِهِ فِي"],["사나운 기세로 무섭게 다가들다.","그는 며칠을 굶은 사람처럼 밥상에 달려들었다."]],1,[]],["덤비다","동사",0,"",[["대들거나 달려들다.","무작정 덤비다.","يُهَاجِم"],["마구 대들거나 달려들다.","버릇없이 어머니에게 덤벼서는 안 된다."]],1,[]],["건립하다(建立하다)","동사",0,"세울 건, 설 립",[["동상, 건물, 탑, 기념비 등을 만들어 세우다.","건물을 건립하다.","يَبْنِي"],["건물, 기념비, 동상, 탑 따위를 만들어 세우다.","기념관을 유적지에 건립하였다."]],1,[]],["보채다","동사",0,"",[["아기가 아프거나 졸리거나 마음에 차지 않아 자꾸 울거나 짜증을 내다.","갓난아이가 보채다.","يَئِنُّ"],["어떠한 것을 요구하며 성가시게 조르다.","아이는 할머니에게 업어 달라고 보챈다."]],1,[]],["넘어서다","동사",0,"",[["높은 곳을 넘어서 지나다.","고개를 넘어서다.","يَتَجَاوَز"],["경계가 되는 일정한 장소를 넘어서 지나다.","문지방을 넘어서다."]],1,[]],["영리하다(怜悧하다/伶俐하다)","형용사",0,"영리할 영, 영리할 리 / 영리할 영, 영리할 리",[["눈치가 빠르고 똑똑하다.","영리한 소년."]],1,[]],["번쩍이다","동사",0,"",[["큰 빛이 잠깐 나타났다가 사라지다. 또는 그렇게 되게 하다.","번쩍이는 금반지."]],1,[]],["대립되다(對立되다)","동사",0,"대할 대, 설 립",[["의견이나 처지, 속성 따위가 서로 반대되거나 모순되다.","땅과 물과 빛과 열매와 꽃들은 인간과 대립되어 있는 것이 아니다.≪이어령, 흙 속에 저 바람 속에≫"]],1,[]],["가려내다","동사",0,"",[["여럿 가운데서 어떤 것을 골라내다.","가짜를 가려내다.","يَفْرِزُ"],["여럿 가운데서 일정한 것을 골라내다.","생산품 중에서 불량품을 가려내다."]],1,[]],["솟아나다","동사",0,"",[["안에서 밖으로 나오다.","이마에 진땀이 솟아나고 입술이 바싹 말랐다.≪김승옥, 차나 한잔≫"]],1,[]],["수리하다(修理하다)","동사",0,"닦을 수, 다스릴 리",[["고장 나거나 허름한 데를 손보아 고치다.","자전거를 수리하다."]],1,[]],["귀여워하다","동사",0,"",[["귀엽게 여기다.","자식을 귀여워하다."]],1,[]],["살아나다","동사",0,"",[["죽었거나 거의 죽게 되었다가 다시 생명을 얻게 되다.","구사일생으로 살아나다.","يحيّ"],["죽었거나 거의 죽게 되었다가 다시 살게 되다.","구사일생으로 살아났다."]],1,[]],["견고하다(堅固하다)","형용사",0,"굳을 견, 굳을 고",[["단단하고 튼튼하다.","견고한 목재.","ثَابِت"],["굳고 단단하다.","견고한 제방을 쌓다."]],1,[]],["벌겋다","형용사",0,"",[["어둡고 엷게 붉다.","눈자위가 벌겋다."]],1,[]],["맞붙다","동사",0,"",[["서로 마주 닿다.","하늘과 바다가 맞붙은 수평선."]],1,[]],["비평하다(批評하다)","동사",0,"비평할 비, 평할 평",[["사물의 옳고 그름, 아름다움과 추함 따위를 분석하여 가치를 논하다.","작가가 자신의 작품을 객관적으로 비평하기란 거의 불가능한 일이다."]],1,[]],["큼직하다","형용사",0,"",[["꽤 크다.","신문에 큼직하게 기사가 실리다."]],1,[]],["쓸리다","동사",0,"",[["쓰레기 등이 비에 밀려 한데 모아지거나 버려지다.","먼지가 쓸리다.","يُكنَس"],["바닥에 질질 끌려서 스쳐지다. ‘쓸다02「3」’의 피동사","바지가 길어서 자꾸 바닥에 쓸린다."],["한꺼번에 막 몰리다.","찬 바람이 대합실로 쓸려 들어왔다."]],1,[]],["귀국하다(歸國하다)","동사",0,"돌아갈 귀, 나라 국",[["외국에 나가 있던 사람이 자기 나라로 돌아오거나 돌아가다.","여행을 마치고 귀국하다."]],1,[]],["합류하다(合流하다)","동사",0,"합할 합, 흐를 류",[["여러 물줄기가 하나로 모여 흐르다.","길이 합류하다.","يلتقي ، يجتمع"],["둘 이상의 흐름이 한데 합하여 흐르다.","서도 땅 굽이굽이 천리를 흘러내린 압록강 물이 바야흐로 황해와 합류하는 강가에서 나는 자랐다.≪정비석, 비석과 금강산의 대화≫"]],1,[]],["해치우다","동사",0,"",[["어떤 일을 빠르고 시원스럽게 끝내다.","나는 동료의 일까지 모두 해치웠다."]],1,[]],["밋밋하다","형용사",0,"",[["경사나 굴곡이 심하지 않고 평평하다.","밋밋한 능선.","مُسْتَوٍ"],["생김새가 미끈하게 곧고 길다.","그 집 아들들은 모두가 밋밋하고 훤칠하여 보는 사람을 시원스럽게 해 준다."],["생긴 모양 따위가 두드러진 특징이 없이 평범하다.","모두 같은 옷에 같은 행동을 하니 누가 누구인지 구별이 안 될 만큼 그저 밋밋해 보인다."]],1,[]],["냉각하다(冷却하다)","동사",0,"찰 냉, 물리칠 각",[["식혀서 차게 하다.","고기를 냉각하다."]],1,[]],["접대하다(接待하다)","동사",0,"이을 접, 기다릴 대",[["손님을 맞아서 시중을 들다.","손님을 극진히 접대하다."]],1,[]],["굶주리다","동사",0,"",[["오랫동안 제대로 먹지 못하다.","굶주리는 사람들.","يَجُوعُ"],["먹을 것이 없어서 배를 곯다.","굶주린 배를 채우다."]],1,[]],["바람직하다","형용사",0,"",[["바랄 만한 가치가 있다.","바람직한 사회."]],1,[]],["휘젓다","동사",0,"",[["골고루 섞이도록 이리저리 마구 젓다.","국을 휘젓다.","يُحرّك"],["골고루 섞이도록 마구 젓다.","밀가루로 풀을 쑬 때에는 잘 휘저어 주어야 눋지 않는다."],["비틀거리며 발을 이리저리 옮겨 놓다.",""]],1,[]],["인정받다(認定받다)","동사",0,"알 인, 정할 정",[["확실히 그렇다고 여김을 받다.","공로를 인정받다."]],1,[]],["집착하다(執着하다)","동사",0,"잡을 집, 붙을 착",[["어떤 것에 늘 마음이 쏠려 잊지 못하고 매달리다.","돈에 집착하다."]],1,[]],["고다","동사",0,"",[["고기나 뼈의 진한 국물이 우러나도록 푹 삶다.","고기를 고다.","يَغْلِي"],["고기나 뼈 따위를 무르거나 진액이 빠지도록 끓는 물에 푹 삶다.","소뼈를 푹 고다."]],1,[]],["파견하다(派遣하다)","동사",0,"갈래 파, 보낼 견",[["일정한 임무를 주어 사람을 보내다.","사건 해결을 위해 처리 요원을 현장에 파견하였다."]],1,[]],["그윽하다","형용사",0,"",[["어떤 곳이 깊숙하여 조용하고 편안하다.","그윽한 분위기.","يَكُونُ سَالِمًا"],["깊숙하여 아늑하고 고요하다.","아무도 찾지 않는 산사의 겨울밤은 그윽하기만 하다."]],1,[]],["제도하다(製圖하다)","동사",0,"지을 제, 그림 도",[["기계, 건축물, 공작물 따위의 도면이나 도안을 그리다.","바지의 원형을 제도하다."]],1,[]],["얼어붙다","동사",0,"",[["액체나 물기가 있는 물체가 찬 기운으로 인해 얼어서 단단히 들러붙다.","얼어붙은 강."]],0,[]],["급작스럽다","형용사",0,"",[["미처 생각할 겨를이 없이 매우 급하게 일어난 데가 있다.","급작스러운 사고."]],1,[]],["전념하다(專念하다)","동사",0,"오로지 전, 생각 념",[["오직 한 가지 일에만 마음을 쓰다.","집 걱정 하지 말고 공부에만 전념해라."]],1,[]],["정교하다(精巧하다)","형용사",0,"정할 정, 공교할 교",[["솜씨나 기술이 빈틈이 없이 자세하고 뛰어나다.","정교한 기법.","متقّن"],["솜씨나 기술 따위가 정밀하고 교묘하다.","정교하게 그리다."]],1,[]],["허전하다","형용사",0,"",[["주변에 아무것도 없어서 텅 빈 느낌이 있다.","허전한 기분.","يشعر بفراغ، يشعر بخواء"],["주위에 아무것도 없어서 공허한 느낌이 있다.","허전한 풍경."]],1,[]],["긴장하다(緊張하다)","동사",0,"긴할 긴, 베풀 장",[["마음을 놓지 않고 정신을 바짝 차리다.","긴장한 나머지."],["몸의 근육이나 신경이 계속 움츠러들거나 흥분하다.","관절이 긴장하다."]],0,[]],["생각나다","동사",0,"",[["새로운 생각이 머릿속에 떠오르다.","방도가 생각나다.","يتبادر إلى الذهن"],["어떤 의견이나 느낌이 떠오르다.","좋은 의견이 생각나시면 저에게 알려 주십시오."]],1,[]],["비례하다(比例하다)","동사",0,"견줄 비, 법식 례",[["한쪽의 양이나 수가 증가하는 만큼 그와 관련 있는 다른 쪽의 양이나 수도 증가하다.","주주의 권리는 소유하고 있는 주식의 수에 비례한다."],["예를 들어 견주어 보다.",""]],1,[]],["잠들다","동사",0,"",[["잠을 자는 상태가 되다.","모두 잠들었는지 문을 열어 주는 사람이 없다."]],1,[]],["옹졸하다(壅拙하다)","형용사",0,"막을 옹, 옹졸할 졸",[["마음이 너그럽지 못하고 생각이 좁다.","옹졸한 사람.","متعصب"],["성품이 너그럽지 못하고 생각이 좁다.","옹졸한 생각."]],1,[]],["저항하다(抵抗하다)","동사",0,"막을 저, 겨룰 항",[["어떤 힘이나 조건에 굽히지 아니하고 거역하거나 버티다.","잡혀 들어간 독립운동가들은 대부분 일본 경찰에게 저항하다가 목숨을 잃었다."]],1,[]],["긴요하다(緊要하다)","형용사",0,"긴할 긴, 요긴할 요",[["꼭 필요하고 중요하다.","생명을 유지하는 데 가장 긴요한 것은 물이다."]],1,[]],["주선하다(周旋하다)","동사",0,"두루 주, 돌 선",[["일이 잘되도록 여러 가지 방법으로 힘쓰다.","혼사를 주선하다."]],1,[]],["비틀다","동사",0,"",[["힘을 주어 꼬면서 돌리다.","고개를 비틀다.","يَلْوِي"],["힘 있게 바싹 꼬면서 틀다.","빨래를 비틀어 짰다."]],1,[]],["가렵다","형용사",0,"",[["피부에 긁고 싶은 느낌이 있다.","가려운 데를 긁다."]],1,[]],["모집하다(募集하다)","동사",0,"모을 모, 모을 집",[["사람이나 작품, 물품 따위를 일정한 조건 아래 널리 알려 뽑아 모으다.","자원봉사자를 모집하다."]],1,[]],["검토하다(檢討하다)","동사",0,"검사할 검, 칠 토",[["어떤 사실이나 내용을 분석하여 따지다.","시험 답안지를 검토하다."]],1,[]],["쇠하다(衰하다)","동사",0,"쇠할 쇠",[["힘이나 세력이 점점 줄어서 약해지다.","근력이 쇠하다."]],1,[]],["슬다","동사",0,"",[["쇠붙이에 녹이 생기다.","녹이 슬다.","يَصْدَأ"],["형체나 현상 따위가 차차 희미해지면서 없어지다.","문턱이 슬도록 드나들다."],["곰팡이나 곤충의 알 따위가 생기다.","식빵에 곰팡이가 슬다."]],1,[]],["옹호하다(擁護하다)","동사",0,"낄 옹, 도울 호",[["두둔하고 편들어 지키다.","인권을 옹호하다."]],1,[]],["요청하다(要請하다)","동사",0,"요긴할 요, 청할 청",[["필요한 어떤 일이나 행동을 청하다.","의장에게 중재를 요청하다."]],1,[]],["긴급하다(緊急하다)","형용사",0,"긴할 긴, 급할 급",[["긴요하고 급하다.","긴급한 문제에 대한 대책이 시급하게 요청된다."]],1,[]],["음탕하다(淫蕩하다)","형용사",0,"음란할 음, 방탕할 탕",[["음란하고 방탕하다.","음탕한 노래."]],1,[]]]</script>
<script>
'use strict';
// D[i] = [단어, 품사, 등급(미사용), 훈음, [[뜻,용례],...], 출처(0기초 1표준), 비슷한말(대표어인 경우만)]
let D = [];
const store = (()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}
  catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();

// ---------- 공용 ----------
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function synHTML(e){
  const syn = e[6];
  return (syn&&syn.length) ? `<div class="syn"><b>비슷한 말</b>${esc(syn.join(', '))}</div>` : '';
}
function entryHTML(e, maxSenses, onlyIdx){
  const [w,p,g,h,ss,src]=e;
  const idxs = onlyIdx || ss.map((_,i)=>i).slice(0, maxSenses||ss.length);
  const senses = idxs.map(i=>{const s=ss[i];
    return `<div class="sense">${starBtnHTML(e,i)}${ss.length>1?`<span class="n">${i+1}.</span>`:''}${esc(s[0])}`+
    (s[2]?`<span class="arw">${esc(s[2])}</span>`:'')+
    (s[1]?`<span class="ex">${esc(s[1])}</span>`:'')+`</div>`}).join('');
  const hidden = (!onlyIdx && ss.length>(maxSenses||ss.length)) ? `<button class="more" data-all="1">뜻 ${ss.length}개 모두 보기</button>` : '';
  return `<div class="entry"><div class="entryHead"><div class="w">${esc(w)}</div>${bmBtnHTML(e)}</div>
    <div class="meta"><span class="tag">${esc(p)}</span>${src?'<span class="tag">표준국어대사전</span>':'<span class="tag">기초사전</span>'}</div>
    ${h?`<div class="hm">${esc(h)}</div>`:''}${senses}${hidden}${synHTML(e)}</div>`;
}

// ---------- 별표 (뜻풀이 단위) ----------
// 저장 키: 단어|품사|뜻번호
let starArr=[];
try{starArr=JSON.parse(store.getItem('krw_star')||'[]')}catch(e){starArr=[]}
if(!Array.isArray(starArr))starArr=[];
starArr=starArr.filter(x=>typeof x==='string')
  .map(k=>k.split('|').length===2?k+'|0':k);   // 예전 '단어 단위' 별표는 첫 번째 뜻으로 옮김
let starSet=new Set(starArr);
function saveStar(){try{store.setItem('krw_star',JSON.stringify(starArr))}catch(e){}}
const wkeyOf=e=>e[0]+'|'+e[1];
const skeyOf=(e,i)=>e[0]+'|'+e[1]+'|'+i;
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}
const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 3.4l2.65 5.37 5.93.86-4.29 4.18 1.01 5.9L12 16.92l-5.3 2.79 1.01-5.9-4.29-4.18 5.93-.86z"/></svg>';
function starBtnHTML(e,i){
  const k=skeyOf(e,i);
  return `<button class="starBtn${starSet.has(k)?' on':''}" data-star="${escAttr(k)}" `+
         `aria-label="이 뜻 별표" title="이 뜻을 별표에 담기/빼기">${STAR_SVG}</button>`;
}
function syncStarBtns(){
  document.querySelectorAll('.starBtn').forEach(b=>
    b.classList.toggle('on',starSet.has(b.dataset.star)));
}
function toggleStar(k){
  if(starSet.has(k)){starSet.delete(k);starArr=starArr.filter(x=>x!==k)}
  else{starSet.add(k);starArr.unshift(k)}
  saveStar();starByIdx=null;syncStarBtns();updateStarCnt();
  if(curTab==='card'&&cMode==='star')updateCardStat();
  if(curTab==='star')renderStars();
}
// 캡처 단계에서 가로채 카드 뒤집기 등 상위 클릭과 겹치지 않게 한다
document.addEventListener('click',ev=>{

let keyIndex=null;
function buildKeyIndex(){
  keyIndex=new Map();
  for(let i=0;i<D.length;i++){const k=wkeyOf(D[i]);if(!keyIndex.has(k))keyIndex.set(k,i)}
}
function updateStarCnt(){
  const c=document.getElementById('starCnt');
  if(c)c.textContent=starArr.length?`뜻 ${starArr.length.toLocaleString()}개`:'';
  const cl=document.getElementById('starClear');
  if(cl)cl.classList.toggle('hidden',!starArr.length);
}
function renderStars(){
  const box=document.getElementById('starList');
  if(!box)return;
  if(!keyIndex)buildKeyIndex();
  // 같은 단어의 여러 뜻은 한 카드에 모아서 (최근에 담은 단어가 위로)
  const order=[],group=new Map();
  for(const k of starArr){
    const p=k.lastIndexOf('|');
    const wk=k.slice(0,p), si=+k.slice(p+1);
    const di=keyIndex.get(wk);
    if(di===undefined||!(si>=0)||si>=D[di][4].length)continue;
    if(!group.has(wk)){group.set(wk,[]);order.push(wk)}
    group.get(wk).push(si);
  }
  const frag=document.createDocumentFragment();
  for(const wk of order){
    const di=keyIndex.get(wk);
    const idxs=[...new Set(group.get(wk))].sort((a,b)=>a-b);
    frag.append(el(entryHTML(D[di],null,idxs)));
  }
  box.innerHTML='';
  if(!order.length)box.innerHTML='<div class="empty">별표한 뜻이 없습니다.<br>사전이나 카드에서 뜻 옆의 별표를 눌러 담아 보세요.</div>';
  else box.append(frag);
  updateStarCnt();
}

function segOn(seg,btn){seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn))}
let deb;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(deb);deb=setTimeout(()=>{query=e.target.value.trim();saveUI({query});search()},160)});
function search(){
  const q=query;
  results=[];
  for(let i=0;i<D.length;i++){
    const e=D[i];
    if(q){
      const inW=e[0].includes(q), inH=e[3]&&e[3].includes(q);
      let inS=false;
      if(!inW&&!inH){for(const s of e[4]){if(s[0].includes(q)||(s[2]&&s[2].includes(q))){inS=true;break}}}
      if(!inW&&!inH&&!inS)continue;
      results.push([i, inW?0:(inH?1:2), e[0].length]);
    } else results.push([i,0,0]);
    if(!q&&results.length>=4000)break;
  }
  if(q)results.sort((a,b)=>a[1]-b[1]||a[2]-b[2]);
  shown=0;
  document.getElementById('list').innerHTML='';
  renderMore();
}
function renderMore(){
  const list=document.getElementById('list');
  const end=Math.min(shown+50,results.length);
  const frag=document.createDocumentFragment();
  for(let i=shown;i<end;i++){
    const e=D[results[i][0]];
    const node=el(entryHTML(e,3));
    const btn=node.querySelector('[data-all]');
    if(btn)btn.onclick=()=>{node.outerHTML=entryHTML(e)};
    frag.append(node);
  }
  list.append(frag);
  shown=end;
  document.getElementById('moreBtn').classList.toggle('hidden',shown>=results.length);
  if(!results.length)list.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';
}

let progress={};

const keyOf=i=>D[i][0]+'|'+D[i][1];

// 별표한 뜻을 단어(D 인덱스)별로 모아 둔 표 — 카드 '별표' 모드에서 사용
let starByIdx=null;
function buildStarByIdx(){
  if(!keyIndex)buildKeyIndex();
  starByIdx=new Map();
  for(const k of starArr){
    const p=k.lastIndexOf('|');
    const di=keyIndex.get(k.slice(0,p)), si=+k.slice(p+1);
    if(di===undefined||!(si>=0)||si>=D[di][4].length)continue;
    if(!starByIdx.has(di))starByIdx.set(di,[]);
    const a=starByIdx.get(di);
    if(a.indexOf(si)<0)a.push(si);
  }
  for(const a of starByIdx.values())a.sort((x,y)=>x-y);
}
function starredIdxOf(i){
  if(!starByIdx)buildStarByIdx();
  const a=starByIdx.get(i);
  return (a&&a.length)?a:null;
}
// 카드 뒷면에 보여줄 뜻 목록 (별표 모드면 별표한 뜻만)
function cardSenseList(e,i){
  if(cMode==='star'){const o=starredIdxOf(i);if(o)return o.map(n=>[e[4][n],n])}
  return e[4].map((s,n)=>[s,n]);
}

let cMode='all',cardIdx=[],cardPos=0,flipped=false;
document.getElementById('cardMode').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  cMode=b.dataset.m;segOn(cardMode,b);saveUI({cMode});cardReset()};
function cardPool(){
  const out=[];
  if(cMode==='star'){
    if(!starByIdx)buildStarByIdx();
    for(const i of starByIdx.keys())out.push(i);
    return out;
  }
  for(let i=0;i<D.length;i++){
    if(D[i][5]!==0)continue;           // 카드에는 기초사전(쉬운 풀이) 항목만
    const lv=progress[keyOf(i)]||0;
    if(cMode==='unknown'&&lv>=3)continue;
    out.push(i);
  }
  return out;
}
function cardReset(){cardIdx=shuffle(cardPool());cardPos=0;showCard()}
function showCard(){
  const f=document.getElementById('flash');
  if(!cardIdx.length){f.innerHTML=cMode==='star'?'<div class="empty">별표한 뜻이 없습니다.<br>사전에서 뜻 옆의 별표를 눌러 담아 보세요.</div>':'<div class="empty">조건에 맞는 카드가 없습니다.<br>모두 학습 완료했는지 확인해 보세요.</div>';updateCardStat();return}
  if(cardPos>=cardIdx.length){cardIdx=shuffle(cardIdx);cardPos=0}
  const i=cardIdx[cardPos],e=D[i];
  flipped=false;
  f.innerHTML=`<span class="tag p">${esc(e[1])}</span><span class="prog">${cardPos+1} / ${cardIdx.length}</span>
    <div class="w">${esc(e[0].split('(')[0])}</div>
    ${e[0].includes('(')?`<div class="hm" style="color:var(--sub);font-weight:400">${esc(e[0].slice(e[0].indexOf('(')))}</div>`:''}
    <div class="hint">카드를 누르면 뜻이 보입니다</div>`;
  updateCardStat();
}
document.getElementById('flash').onclick=()=>{
  if(!cardIdx.length)return;
  const i=cardIdx[cardPos],e=D[i];
  if(flipped){showCard();return}
  flipped=true;
  const f=document.getElementById('flash');
  f.innerHTML=`<span class="tag p">${esc(e[1])}</span><span class="prog">${cardPos+1} / ${cardIdx.length}</span>
    <div style="font-weight:800;font-size:19px;margin-bottom:6px">${esc(e[0])}</div>
    ${e[3]?`<div class="hm" style="margin-bottom:10px">${esc(e[3])}</div>`:''}
    <div class="def">${cardSenseList(e,i).map(([s,n])=>`<div class="sense">${starBtnHTML(e,n)}${e[4].length>1?`<span class="n">${n+1}.</span>`:''}${esc(s[0])}${s[2]?`<span class="arw">${esc(s[2])}</span>`:''}${s[1]?`<span class="ex">${esc(s[1])}</span>`:''}</div>`).join('')}${synHTML(e)}</div>`;
};
function mark(know){
  if(!cardIdx.length)return;
  const k=keyOf(cardIdx[cardPos]);
  const lv=progress[k]||0;
  progress[k]=know?Math.min(lv+1,3):0;
  saveProg();
  cardPos++;showCard();
}
document.getElementById('btnOk').onclick=()=>mark(true);
document.getElementById('btnNo').onclick=()=>mark(false);
function updateCardStat(){
  if(cMode==='star'){
    if(!starByIdx)buildStarByIdx();
    let d=0,s=0,t=0;
    for(const i of starByIdx.keys()){t++;const lv=progress[keyOf(i)]||0;
      if(lv>=3)d++;else if(lv>0)s++}
    document.getElementById('cardStat').innerHTML=
      `<span>완료 <b>${d.toLocaleString()}</b></span><span>학습 중 <b>${s.toLocaleString()}</b></span>`+
      `<span>별표 단어 <b>${t.toLocaleString()}</b></span>`;
    return;
  }
  let done=0,seen=0;
  const pool=cardPool.length?null:null;
  let total=0;
  for(let i=0;i<D.length;i++){
    if(D[i][5]!==0)continue;
    total++;
    const lv=progress[keyOf(i)]||0;
    if(lv>=3)done++;else if(lv>0)seen++;
  }
  document.getElementById('cardStat').innerHTML=
    `<span>완료 <b>${done.toLocaleString()}</b></span><span>학습 중 <b>${seen.toLocaleString()}</b></span><span>전체 <b>${total.toLocaleString()}</b></span>`;
}

let qDir='d2w',qOk=0,qAll=0,qCur=null,quizStarted=false,answered=false;
document.getElementById('quizDir').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  qDir=b.dataset.d;segOn(quizDir,b);saveUI({qDir});nextQuiz()};
document.getElementById('qNext').onclick=()=>nextQuiz();
function quizPool(){
  const out=[];
  for(let i=0;i<D.length;i++){
    if(D[i][5]!==0)continue;
    if(!D[i][4][0]||!D[i][4][0][0])continue;
    out.push(i);
  }
  return out;
}
function pick(arr,n,skip){
  const out=new Set();
  let guard=0;
  while(out.size<n&&guard++<500){
    const c=arr[Math.floor(Math.random()*arr.length)];
    if(c!==skip&&D[c][0].split('(')[0]!==D[skip][0].split('(')[0])out.add(c);
  }
  return [...out];
}
function nextQuiz(){
  const pool=quizPool();
  const P=document.getElementById('qPrompt'),C=document.getElementById('qChoices');
  answered=false;
  if(pool.length<4){P.textContent='이 조건에는 문제가 부족합니다.';C.innerHTML='';return}
  const ans=pool[Math.floor(Math.random()*pool.length)];
  const opts=shuffle([ans,...pick(pool,3,ans)]);
  qCur=ans;
  const word=i=>D[i][0].split('(')[0], def=i=>D[i][4][0][0];
  if(qDir==='d2w'){
    P.innerHTML=`<span class="small">다음 뜻에 맞는 단어는?</span><br>${esc(def(ans))}`;
    C.innerHTML=opts.map(i=>`<button data-i="${i}">${esc(word(i))}</button>`).join('');
  }else{
    P.innerHTML=`<span class="small">다음 단어의 뜻은?</span><br><b>${esc(D[ans][0])}</b>${D[ans][3]?` <span class="small">${esc(D[ans][3])}</span>`:''}`;
    C.innerHTML=opts.map(i=>`<button data-i="${i}">${esc(def(i))}</button>`).join('');
  }
  C.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;qAll++;
    const sel=+b.dataset.i;
    if(sel===qCur)qOk++;
    C.querySelectorAll('button').forEach(x=>{
      x.disabled=true;
      if(+x.dataset.i===qCur)x.classList.add('right');
      else if(x===b)x.classList.add('wrong');
    });
    document.getElementById('qScore').textContent=`${qOk} / ${qAll}`;
    setTimeout(nextQuiz,1400);
  });
}

<script>
// ---------- 단어집: 하루 200개 단어장 (차례대로 / 임의대로) + 학습 완료 날짜 ----------
(function(){
'use strict';
const SIZE=200, CHUNK=50;
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const body=document.getElementById('wbBody');
const mainEl=document.getElementById('main');
let wb=null, KEY='', view=0, listScroll=0, permCache=null, permKey='', reshuffleArmed=false;

function hash(){
  let h=2166136261>>>0; const n=D.length;
  const add=s=>{for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}};
  add(String(n));
  const step=Math.max(1,Math.floor(n/300));
  for(let i=0;i<n;i+=step)add(D[i][0]+'|'+D[i][1]);
  add(D[n-1][0]);
  return h.toString(36);
}
function newSeed(){return (Math.random()*4294967296)>>>0}
function load(){
  KEY='krw_wb_'+hash();
  let o=null; try{o=JSON.parse(store.getItem(KEY)||'null')}catch(e){}
  if(!o||typeof o!=='object')o={};
  wb={mode:o.mode==='rnd'?'rnd':'seq', seed:Number.isFinite(o.seed)?o.seed:newSeed(), done:{seq:{},rnd:{}}};
  if(o.done)for(const m of ['seq','rnd'])if(o.done[m]&&typeof o.done[m]==='object')wb.done[m]=o.done[m];
}
function save(){try{store.setItem(KEY,JSON.stringify(wb))}catch(e){}}

// 시드 기반 섞기 — 순서를 저장하지 않고 시드만 저장해도 같은 순서가 다시 만들어진다
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function perm(){
  const k=wb.seed+'_'+D.length;
  if(permCache&&permKey===k)return permCache;
  const n=D.length,a=new Uint32Array(n);
  for(let i=0;i<n;i++)a[i]=i;
  const r=rng(wb.seed);
  for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
  permCache=a;permKey=k;return a;
}
const totalDays=()=>Math.ceil(D.length/SIZE);
function setIdx(day){
  const s=(day-1)*SIZE,e=Math.min(s+SIZE,D.length),out=[];
  if(wb.mode==='seq'){for(let i=s;i<e;i++)out.push(i)}
  else{const p=perm();for(let i=s;i<e;i++)out.push(p[i])}
  return out;
}
const head=i=>D[i][0].split('(')[0];
function today(){const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?`${m[1]}.${+m[2]}.${+m[3]}`:''}
const doneMap=()=>wb.done[wb.mode];
function firstUndone(){const m=doneMap(),n=totalDays();for(let d=1;d<=n;d++)if(!m[d])return d;return 0}
function subOf(d){
  const s=(d-1)*SIZE,e=Math.min(s+SIZE,D.length);
  if(wb.mode==='seq')return `${s+1}–${e}번째 · ${esc(head(s))} ~ ${esc(head(e-1))}`;
  return `임의 ${e-s}개`;
}
function toggleDone(d){const m=doneMap(); if(m[d])delete m[d]; else m[d]=today(); save()}

// ---------- 목록 ----------
function renderOverview(){
  const n=totalDays(),m=doneMap(),nx=firstUndone();
  let cnt=0,last='';
  for(let d=1;d<=n;d++)if(m[d]){cnt++;if(m[d]>last)last=m[d]}
  let rows='';
  for(let d=1;d<=n;d++){
    rows+=`<div class="wbRow${m[d]?' done':''}${d===nx?' next':''}" data-d="${d}">
      <button class="wbChk" data-chk="${d}" aria-label="Day ${d} 학습 완료 체크">${CHECK}</button>
      <div class="wbInfo"><div class="wbT">Day ${d}</div><div class="wbS">${subOf(d)}</div></div>
      <div class="wbDate">${m[d]?fmt(m[d]):''}</div><span class="wbGo">›</span></div>`;
  }
  body.innerHTML=`
    <div class="seg" id="wbMode">
      <button data-m="seq"${wb.mode==='seq'?' class="on"':''}>차례대로</button>
      <button data-m="rnd"${wb.mode==='rnd'?' class="on"':''}>임의대로</button>
    </div>
    <div class="wbBar"><i style="width:${n?(cnt/n*100):0}%"></i></div>
    <div class="wbSum"><span>완료 <b>${cnt.toLocaleString()}</b> / ${n.toLocaleString()}일치 · 단어 ${D.length.toLocaleString()}개</span>
      <span>${last?'최근 '+fmt(last):''}</span></div>
    ${nx?`<button class="bigbtn" id="wbNext">Day ${nx} 학습하기</button>`:'<div class="empty" style="padding:22px 0">모든 단어집을 완료했습니다 🎉</div>'}
    <div class="wbTools"><span class="note" style="margin:8px 0">${wb.mode==='seq'
      ? '사전의 표제어 순서대로 200개씩 나눕니다.'
      : '사전 표제어 전체를 무작위로 섞어 200개씩 나눕니다. 순서는 저장되어 유지됩니다.'}</span>
      ${wb.mode==='rnd'?'<button class="more" id="wbShuffle">다시 섞기</button>':''}</div>
    <div id="wbRows">${rows}</div>`;
}

// ---------- 하루치 단어장 ----------
let curIdx=[],shown=0;
function renderDetail(d){
  const n=totalDays(),m=doneMap(),done=!!m[d];
  curIdx=setIdx(d);shown=0;
  body.innerHTML=`
    <button class="wbBack" id="wbBack">‹ 목록</button>
    <div class="wbHead">
      <div class="wbHeadTop"><h2>Day ${d}</h2><span class="tag">${wb.mode==='seq'?'차례대로':'임의대로'}</span></div>
      <div class="wbS">${subOf(d)} · ${curIdx.length}단어</div>
      <button class="wbDetChk${done?' done':''}" id="wbDetChk"><span class="wbChk">${CHECK}</span>${done?'학습 완료':'학습 완료로 체크하기'}</button>
      ${done?`<div class="wbDateRow">완료한 날 <input type="date" id="wbDate" value="${m[d]}"></div>`:''}
    </div>
    <div id="wbList"></div>
    <button class="more hidden" id="wbMore">더 보기</button>
    <div class="wbNav"><button id="wbPrev"${d<=1?' disabled':''}>‹ Day ${d-1}</button>
      <button id="wbNextDay"${d>=n?' disabled':''}>Day ${d+1} ›</button></div>`;
  renderMore();
  mainEl.scrollTop=0;
}
function renderMore(){
  const list=document.getElementById('wbList'),end=Math.min(shown+CHUNK,curIdx.length);
  const frag=document.createDocumentFragment();
  for(let k=shown;k<end;k++){
    const e=D[curIdx[k]],node=el(entryHTML(e,3));
    const btn=node.querySelector('[data-all]');
    if(btn)btn.onclick=()=>{node.outerHTML=entryHTML(e)};
    frag.append(node);
  }
  list.append(frag);shown=end;
  const mb=document.getElementById('wbMore');
  mb.textContent=`더 보기 (${shown} / ${curIdx.length})`;
  mb.classList.toggle('hidden',shown>=curIdx.length);
}

function render(){ view?renderDetail(view):renderOverview() }
function rerenderKeepScroll(){const y=mainEl.scrollTop;render();mainEl.scrollTop=y}
function openDay(d){listScroll=mainEl.scrollTop;view=d;renderDetail(d)}
function backToList(){view=0;renderOverview();mainEl.scrollTop=listScroll}

body.addEventListener('click',ev=>{
  const t=ev.target;
  let b;
  if((b=t.closest('#wbMode button'))){
    if(wb.mode!==b.dataset.m){wb.mode=b.dataset.m;save();listScroll=0;renderOverview()}
    return;
  }
  if((b=t.closest('.wbChk[data-chk]'))){
    ev.stopPropagation();toggleDone(+b.dataset.chk);rerenderKeepScroll();return;
  }
  if((b=t.closest('.wbRow'))){openDay(+b.dataset.d);return}
  if(t.closest('#wbNext')){openDay(firstUndone());return}
  if((b=t.closest('#wbShuffle'))){
    if(!reshuffleArmed){reshuffleArmed=true;b.textContent='완료 기록도 지워집니다. 다시 누르면 섞기';
      setTimeout(()=>{reshuffleArmed=false;const x=document.getElementById('wbShuffle');if(x)x.textContent='다시 섞기'},3500);return}
    reshuffleArmed=false;wb.seed=newSeed();wb.done.rnd={};permCache=null;save();renderOverview();return;
  }
  if(t.closest('#wbBack')){backToList();return}
  if(t.closest('#wbDetChk')){toggleDone(view);renderDetailHeadOnly();return}
  if(t.closest('#wbMore')){renderMore();return}
  if(t.closest('#wbPrev')){view=Math.max(1,view-1);renderDetail(view);return}
  if(t.closest('#wbNextDay')){view=Math.min(totalDays(),view+1);renderDetail(view);return}
});
body.addEventListener('change',ev=>{
  if(ev.target.id==='wbDate'&&/^\d{4}-\d{2}-\d{2}$/.test(ev.target.value)){
    doneMap()[view]=ev.target.value;save();
  }
});
// 체크 토글 때 단어 목록 위치를 잃지 않도록 머리 부분만 갈아 끼운다
function renderDetailHeadOnly(){
  const m=doneMap(),done=!!m[view];
  const btn=document.getElementById('wbDetChk');
  btn.classList.toggle('done',done);
  btn.lastChild.textContent=done?'학습 완료':'학습 완료로 체크하기';
  const old=document.querySelector('.wbDateRow');
  if(old)old.remove();
  if(done)btn.insertAdjacentHTML('afterend',`<div class="wbDateRow">완료한 날 <input type="date" id="wbDate" value="${m[view]}"></div>`);
}

// ---------- 탭 연결 ----------
tabs.words='tab-words';
document.getElementById('nav-words').onclick=()=>showTab('words');
const origShowTab=showTab;
showTab=function(k,save_){
  if(k==='words'&&D.length&&!wb){ load(); render(); }
  return origShowTab(k,save_);
};
})();
</script>
<script>
// 카드 탭에서 방향키 ↑ : 카드 앞면/뒷면 전환 (카드를 누르는 것과 같음)
document.addEventListener('keydown',function(e){
  if(e.key!=='ArrowUp'||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  var a=document.activeElement,tg=a&&a.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||(a&&a.isContentEditable))return;
  var sec=document.getElementById('tab-card'),fl=document.getElementById('flash');
  if(!sec||!fl||sec.classList.contains('hidden'))return;
  e.preventDefault();fl.click();
});
</script>
</body>
</html>
