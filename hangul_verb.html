<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3864">
<title>우리말 단어장</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1a1d24; --sub:#6b7280; --line:#e5e7eb;
  --brand:#1F3864; --brand2:#2d4f8a; --accent:#c8873a; --ok:#2e7d4f; --no:#b3423a;
  --chip:#eef1f6; --shadow:0 1px 3px rgba(15,25,50,.08),0 4px 14px rgba(15,25,50,.06);
  --bm:#2d7d6e; --bm-bg:#e7f3f0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c; --card:#1c212b; --ink:#e8eaf0; --sub:#98a0ae; --line:#2a3140;
        --brand:#7d9bd4; --brand2:#5b7cb8; --accent:#d9a05c; --ok:#5cb883; --no:#d97b73; --chip:#252b38;
        --shadow:0 1px 3px rgba(0,0,0,.4); --bm:#5fb39f; --bm-bg:#1c2b28}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top)}
header{padding:14px 18px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
header .htitle{display:flex;align-items:baseline;gap:10px;min-width:0}
header h1{font-size:19px;margin:0;color:var(--brand);letter-spacing:-.3px}
header .cnt{font-size:12px;color:var(--sub)}
.hdrBmBtn{border:none;background:var(--bm-bg);color:var(--bm);width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:0 0 auto}
.hdrBmBtn svg{width:16px;height:16px}
.hdrBmBtn .dot{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--accent);
  border:1.5px solid var(--bg)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 20px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 0 9px;border:0;background:none;color:var(--sub);
  font-size:12.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brand)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;
  padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.searchbox{position:sticky;top:0;background:var(--bg);padding:6px 0 4px;z-index:5}
.searchbox input{width:100%;padding:12px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none;box-shadow:var(--shadow)}
.searchbox input:focus{border-color:var(--brand2)}
.entry{background:var(--card);border-radius:14px;padding:14px 16px;margin:9px 0;box-shadow:var(--shadow)}
.entry.bmHighlight{outline:2px solid var(--bm);outline-offset:2px}
.entryHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.entry .w{font-size:17px;font-weight:700}
.bmBtn{border:none;background:none;padding:3px;cursor:pointer;flex:0 0 auto;color:var(--sub);line-height:0;border-radius:6px}
.bmBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.bmBtn.on{color:var(--bm)}
.bmBtn.on svg{fill:var(--bm-bg);stroke:var(--bm)}
.bmBtn:active{transform:scale(.85)}
.entry .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;color:var(--sub)}
.tag.g3{color:var(--ok)} .tag.g2{color:var(--accent)} .tag.g1{color:var(--no)}
.hm{color:var(--accent);font-size:13px;margin-top:5px;font-weight:600}
.sense{margin-top:8px;font-size:14.5px;line-height:1.55}
.sense .n{color:var(--brand);font-weight:700;margin-right:4px;font-size:13px}
.sense .ex{display:block;color:var(--sub);font-size:13px;margin-top:2px;font-style:normal}
.sense .ex::before{content:"예) "}
.sense .arw{display:inline-block;direction:rtl;unicode-bidi:isolate;color:var(--brand2);
  font-size:15px;font-weight:600;margin-left:6px}
.syn{color:var(--brand2);font-size:12.5px;margin-top:8px;line-height:1.5}
.syn b{font-weight:700;color:var(--sub);margin-right:2px}
.more{color:var(--brand);font-size:13px;font-weight:600;margin-top:8px;cursor:pointer;background:none;border:none;padding:0}
.empty{text-align:center;color:var(--sub);padding:50px 0;font-size:14px}
/* 카드 */
.cardwrap{max-width:520px;margin:0 auto}
.flash{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 22px;cursor:pointer;position:relative;margin-top:8px}
.flash .w{font-size:34px;font-weight:800;letter-spacing:-.5px}
.flash .hm{font-size:15px;margin-top:10px}
.flash .p{position:absolute;top:14px;left:16px}
.flash .prog{position:absolute;top:14px;right:16px;font-size:12px;color:var(--sub)}
.flash .hint{position:absolute;bottom:12px;font-size:12px;color:var(--sub)}
.flash .def{font-size:16.5px;line-height:1.6;text-align:left}
.flash .def .ex{color:var(--sub);font-size:13.5px}
.flash .syn{text-align:left;margin-top:4px}
.answers{display:flex;gap:10px;margin-top:14px}
.answers button{flex:1;padding:15px 0;border-radius:14px;border:0;font-size:15.5px;font-weight:700;cursor:pointer;color:#fff}
.answers .no{background:var(--no)} .answers .ok{background:var(--ok)}
.bigbtn{width:100%;padding:15px 0;border-radius:14px;border:0;font-size:15.5px;font-weight:700;
  cursor:pointer;background:var(--brand);color:#fff;margin-top:14px}
.statline{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:13px;color:var(--sub)}
.statline b{color:var(--ink)}
/* 퀴즈 */
.q{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:8px}
.q .prompt{font-size:17px;line-height:1.55;font-weight:600;min-height:60px}
.q .prompt .small{font-size:13px;color:var(--sub);font-weight:400}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.choices button{padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);
  color:var(--ink);font-size:15px;text-align:left;cursor:pointer;line-height:1.45}
.choices button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg));font-weight:700}
.choices button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--bg))}
.choices button:disabled{cursor:default;opacity:.92}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
.score{font-weight:700;color:var(--brand)}
.note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
/* 별표 (뜻 단위) */
.sense{position:relative;padding-right:26px}
.starBtn{position:absolute;top:-1px;right:-3px;background:none;border:0;padding:4px;cursor:pointer;line-height:0}
.starBtn svg{width:18px;height:18px;fill:none;stroke:var(--sub);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.starBtn.on svg{fill:var(--accent);stroke:var(--accent)}
.starBtn:active{transform:scale(.85)}
.flash .def .sense{padding-right:28px}
.flash .starBtn svg{width:20px;height:20px}
.starhead{display:flex;justify-content:space-between;align-items:center;
  margin:10px 2px 2px;font-size:12.5px;color:var(--sub)}
.starhead .more{margin-top:0}
/* ---------- 책갈피 ---------- */
.bmOverlay{position:fixed;inset:0;background:rgba(20,20,15,.32);display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;z-index:90}
.bmOverlay.show{opacity:1;pointer-events:auto}
.bmSheet{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;max-height:76%;
  display:flex;flex-direction:column;transform:translateY(14px);transition:transform .18s;
  box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.bmOverlay.show .bmSheet{transform:translateY(0)}
.bmHead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.bmHead h3{margin:0;font-size:15px;flex:1;color:var(--ink)}
.bmHead .closeX{border:none;background:none;color:var(--sub);width:26px;height:26px;border-radius:7px;
  cursor:pointer;font-size:16px}
.bmHead .closeX:hover{background:var(--chip)}
#bmList{overflow-y:auto;padding:6px 8px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.bmRow{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:10px;cursor:pointer}
.bmRow:active{background:var(--bg)}
.bmRow .bmw{font-size:14px;font-weight:700;flex:1;min-width:0;color:var(--ink)}
.bmRow .bmw .p{font-size:11px;color:var(--sub);font-weight:500;margin-left:6px}
.bmRow .bmw .bmsnip{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmRow .go{color:var(--bm);font-size:11px;font-weight:700;flex:0 0 auto}
.bmRow .rm{border:none;background:none;color:var(--sub);font-size:16px;padding:3px 6px;border-radius:6px;cursor:pointer;flex:0 0 auto}
.bmRow .rm:hover{color:var(--no);background:var(--chip)}
.hidden{display:none!important}
#boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#boot .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--brand);animation:sp 0.85s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#boot .msg{color:var(--sub);font-size:13.5px;line-height:1.6;max-width:280px}
#boot .err{display:none;color:var(--no);font-size:13.5px;line-height:1.6;max-width:300px}
#boot .err button{margin-top:12px;padding:10px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
/* ---------- 단어집 ---------- */
#tab-words .wbWrap{max-width:560px;margin:0 auto}
.wbBar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:12px}
.wbBar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .25s}
.wbSum{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--sub);margin-top:8px}
.wbSum b{color:var(--ink)}
.wbTools{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 0;font-size:12.5px;color:var(--sub)}
.wbTools .more{margin-top:0}
.wbRow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 14px;
  margin:8px 0;box-shadow:var(--shadow);cursor:pointer}
.wbRow:active{opacity:.85}
.wbRow.next{outline:2px solid var(--brand2);outline-offset:1px}
.wbInfo{flex:1;min-width:0}
.wbT{font-size:15px;font-weight:700}
.wbS{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbDate{font-size:12px;color:var(--ok);font-weight:700;flex:0 0 auto}
.wbGo{color:var(--sub);font-size:18px;flex:0 0 auto}
.wbChk{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;padding:0}
.wbChk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wbRow.done .wbChk,.wbDetChk.done .wbChk{background:var(--ok);border-color:var(--ok);color:#fff}
.wbRow.done .wbT{color:var(--sub)}
.wbHead{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin:8px 0}
.wbHeadTop{display:flex;align-items:center;gap:8px}
.wbHeadTop h2{margin:0;font-size:18px;flex:1;color:var(--brand)}
.wbHead .wbS{white-space:normal;margin-top:4px}
.wbDetChk{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:14.5px;font-weight:700;color:var(--ink);width:100%;text-align:left}
.wbDetChk.done{border-color:var(--ok)}
.wbDetChk .wbChk{pointer-events:none}
.wbDateRow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--sub)}
.wbDateRow input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 9px;font-size:14px;font-family:inherit}
.wbNav{display:flex;gap:10px;margin:14px 0 6px}
.wbNav button{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--brand);font-size:14px;font-weight:700;cursor:pointer}
.wbNav button:disabled{opacity:.35;cursor:default}
.wbBack{border:none;background:none;color:var(--brand);font-size:14px;font-weight:700;cursor:pointer;padding:6px 2px}
</style>
</head>
<body>
<div id="boot">
  <div class="spin" id="bootSpin"></div>
  <div class="msg" id="bootMsg">사전을 불러오는 중입니다…<br>단어 수가 많아 몇 초 걸릴 수 있어요.</div>
  <div class="err" id="bootErr">불러오는 데 문제가 생겼습니다.<br>기기 메모리가 부족하거나 파일이 온전히 전달되지 않았을 수 있어요.
    <br><button onclick="location.reload()">다시 시도</button></div>
</div>
<header>
  <div class="htitle"><h1>우리말 단어장</h1><span class="cnt" id="cnt"></span></div>
  <button class="hdrBmBtn" id="hdrBmBtn" title="책갈피 목록"><span class="dot hidden" id="hdrBmDot"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.2L5 21V4.5a1 1 0 0 1 1-1z"/></svg>
  </button>
</header>
<main id="main">
  <!-- 사전 -->
  <section id="tab-dict">
    <div class="searchbox"><input id="q" type="search" placeholder="단어·뜻·훈음 검색" autocomplete="off"></div>
    <div id="list"></div>
    <button class="more hidden" id="moreBtn">더 보기</button>
  </section>
  <!-- 카드 -->
  <section id="tab-card" class="hidden">
    <div class="cardwrap">
      <div class="seg" id="cardMode">
        <button data-m="all" class="on">전체 단어</button><button data-m="unknown">모르는 단어만</button><button data-m="star">별표</button>
      </div>
      <div class="flash" id="flash"></div>
      <div class="answers">
        <button class="no" id="btnNo">모르겠어요</button>
        <button class="ok" id="btnOk">알아요</button>
      </div>
      <div class="statline" id="cardStat"></div>
      <p class="note">카드를 누르면 뜻이 나옵니다. ‘알아요’ 3번이면 학습 완료로 표시됩니다. 진행 상황은 이 기기에 저장됩니다.</p>
    </div>
  </section>
  <!-- 퀴즈 -->
  <section id="tab-quiz" class="hidden">
    <div class="cardwrap">
      <div class="seg" id="quizDir">
        <button data-d="d2w" class="on">뜻 → 단어</button><button data-d="w2d">단어 → 뜻</button>
      </div>
      <div class="q">
        <div class="prompt" id="qPrompt"></div>
        <div class="choices" id="qChoices"></div>
        <div class="qfoot">
          <span class="score" id="qScore">0 / 0</span>
          <button class="more" id="qNext">다음 문제 →</button>
        </div>
      </div>
    </div>
  </section>
  <!-- 별표 -->
  <section id="tab-star" class="hidden">
    <div class="starhead"><span id="starCnt"></span><button class="more" id="starClear">전체 지우기</button></div>
    <div id="starList"></div>
  </section>
  <!-- 단어집 -->
  <section id="tab-words" class="hidden"><div class="wbWrap" id="wbBody"></div></section>
</main>
<nav>
  <button id="nav-dict" class="on"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>사전</button>
  <button id="nav-card"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="15" height="13" rx="2"/><path d="M7 9h7M7 13h4M21 8v9a2 2 0 0 1-2 2H8"/></svg>카드</button>
  <button id="nav-quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.7 2.4c-.8.4-1.2 1-1.2 1.8v.3"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>퀴즈</button>
  <button id="nav-star"><svg viewBox="0 0 24 24"><path d="M12 3.4l2.65 5.37 5.93.86-4.29 4.18 1.01 5.9L12 16.92l-5.3 2.79 1.01-5.9-4.29-4.18 5.93-.86z"/></svg>별표</button>
  <button id="nav-words"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v13H5.5A1.5 1.5 0 0 0 4 18.5z"/><path d="M4 18.5A1.5 1.5 0 0 0 5.5 20H20v-3"/><path d="M9 8.5h7M9 12h4.5"/></svg>단어집</button>
</nav>
<div id="bmOverlay" class="bmOverlay">
  <div class="bmSheet">
    <div class="bmHead"><h3 id="bmTitle">책갈피</h3><button class="closeX" id="bmClose">×</button></div>
    <div id="bmList"></div>
  </div>
</div>

?”≪이기영, 신개지≫"]],1,[]],["알맞다","형용사",0,"",[["일정한 기준, 조건, 정도 따위에 넘치거나 모자라지 아니한 데가 있다.","학생 신분에 알맞은 옷차림."]],1,[]],["자르다","동사",0,"",[["물체를 베거나 동강을 내어 일부를 끊어 내다.","고기를 자르다."]],0,[]],["굳다","동사",0,"",[["무르던 것이 단단하거나 딱딱하게 되다.","땅이 굳다.","يَتَصَلَّبُ"],["무른 물질이 단단하게 되다.","기름이 굳다."]],1,[]],["앉다","동사",0,"",[["윗몸을 바로 한 상태에서 엉덩이에 몸무게를 실어 다른 물건이나 바닥에 몸을 올려놓다.","관람석에 앉다.","يَجْلِسُ"],["사람이나 동물이 윗몸을 바로 한 상태에서 엉덩이에 몸무게를 실어 다른 물건이나 바닥에 몸을 올려놓다.","의자에 앉다."]],1,[]],["푸르다","형용사",0,"",[["맑은 가을 하늘이나 깊은 바다, 싱싱한 풀의 빛깔과 같이 밝고 선명하다.","푸른 물결.","أزرق، أخضر"],["맑은 가을 하늘이나 깊은 바다, 풀의 빛깔과 같이 밝고 선명하다.","푸른 물결."]],1,[]],["다르다","형용사",0,"",[["두 개의 대상이 서로 같지 아니하다.","다른 느낌.","مُخْتَلِف"],["비교가 되는 두 대상이 서로 같지 아니하다.","아들이 아버지와 얼굴이 다르다."]],1,[]],["삼다","동사",0,"",[["어떤 사람을 자기와 관계가 있는 사람이 되게 하다.","남편으로 삼다.","يَجْعَلُ"],["무엇을 무엇이 되게 하거나 여기다.","위기를 전화위복의 계기로 삼다."],["짚신이나 미투리 따위를 결어서 만들다.","짚신을 삼다."],["삼이나 모시 따위의 섬유를 가늘게 찢어서 그 끝을 맞대고 비벼 꼬아 잇다.","삼을 삼다 말고 쉬는 때면 뒤꼍의 무 구덩이에 가서 긴 싸리 꼬챙이로 무를 찔러 내어 그걸 깎아 먹으며….≪한수산, 유민≫"]],1,[]],["처리하다(處理하다)","동사",0,"곳 처, 다스릴 리",[["일이나 사무, 사건을 절차에 따라 정리해 마무리하다.","문제를 처리하다.","يتناول، يعالج"],["사무나 사건 따위를 절차에 따라 정리하여 치르거나 마무리를 짓다.","검찰은 그를 무혐의로 처리하기로 방침을 세웠다."],["일정한 결과를 얻기 위하여 화학적 또는 물리적 작용을 일으키다.","그들은 시체의 부패를 방지하기 위하여 시체를 알코올로 처리하여 안치하였다."]],1,[]],["약용하다(藥用하다)","동사",0,"약 약, 쓸 용",[["약으로 쓰다.","식물의 뿌리를 약용하다."]],1,[]],["향하다(向하다)","동사",0,"향할 향",[["어느 쪽을 정면이 되게 대하다.","나에게 향한 눈길.","يواجه، يتجه إلى"],["어느 한쪽을 정면이 되게 대하다.","사람들의 눈길이 노인에게 향했다."]],1,[]],["깨끗하다","형용사",0,"",[["사물이 더럽지 않다.","깨끗한 거리.","نَظِيفٌ"],["때나 찌꺼기 따위가 없다.","깨끗한 옷."]],1,[]],["관련되다(關聯되다/關連되다)","동사",0,"관계할 관, 연이을 련 / 관계할 관, 이을 련",[["둘 이상의 사람, 사물, 현상 따위가 서로 얽혀서 가까운 관계에 있다.","마약과 관련된 범죄."]],1,[]],["기록하다(記錄하다)","동사",0,"기록할 기, 기록할 록",[["주로 후일에 남길 목적으로 어떤 사실이나 생각을 적거나 영상으로 남기다.","기록한 메모.","يُسَجِّلُ"],["주로 후일에 남길 목적으로 어떤 사실을 적다.","그는 수첩에 일의 진행 과정을 간단하게 기록했다."]],1,[]],["울다","동사",0,"",[["슬프거나 아프거나 너무 좋아서 참지 못하고 눈물을 흘리다. 또는 그렇게 눈물을 흘리며 소리를 내다.","아이가 울다.","يَبْكِي"],["기쁨, 슬픔 따위의 감정을 억누르지 못하거나 아픔을 참지 못하여 눈물을 흘리다. 또는 그렇게 눈물을 흘리면서 소리를 내다.","승리의 기쁨에 넘쳐 우는 선수들."]],1,[]],["닦다","동사",0,"",[["더러운 것을 없애려고 문지르다.","구두를 닦다.","يُنَظِّفُ"],["때, 먼지 녹 따위의 더러운 것을 없애거나 윤기를 내려고 거죽을 문지르다.","이를 닦다."]],1,[]],["걸리다","동사",0,"",[["어떤 물체가 떨어지지 않게 어디에 매달리다.","가방이 걸리다.","يَتَعَلَّقُ، يَتَدَلَّى"],["어떤 물체가 떨어지지 않고 벽이나 못 따위에 매달리다. ‘걸다02[1]「1」’의 피동사.","그림이 벽에 걸리다."]],1,[]],["세차다","형용사",0,"",[["기운이나 일이 되어가는 형편 등이 힘 있고 거세다.","세찬 눈보라.","قَوِيّ"],["기세나 형세 따위가 힘 있고 억세다.","세찬 바람."]],1,[]],["깎다","동사",0,"",[["칼과 같은 도구로 물건의 표면이나 과일 등의 껍질을 얇게 벗겨 내다.","껍질을 깎다.","يَقْطَعُ، يَقْشِرُ"],["칼 따위로 물건의 거죽이나 표면을 얇게 벗겨 내다.","사과를 깎다."]],1,[]],["가리키다","동사",0,"",[["손가락이나 물건을 어떤 방향이나 대상으로 향하게 하여 다른 사람에게 그것을 알게 하다.","가리키는 곳."]],0,[]],["여기다","동사",0,"",[["마음속으로 그러하다고 인정하거나 생각하다.","그는 모든 일이 잘되고 있는 것으로 여기고 있다."]],1,[]],["짜다","동사",0,"",[["가구나 상자 등의 틀이나 구조물을 만들다.","짠 문짝.","يشكّل"],["실이나 끈 따위를 씨와 날로 결어서 천 따위를 만들다.","가마니를 짜다."]],1,[]],["작다","형용사",0,"",[["길이, 넓이, 부피 등이 다른 것이나 보통보다 덜하다.","작은 가방.","صَغِير"],["길이, 넓이, 부피 따위가 비교 대상이나 보통보다 덜하다.","깨알처럼 작은 글씨."]],1,[]],["숨다","동사",0,"",[["남이 볼 수 없게 몸을 감추다.","숨을 곳.","يُخَبِّئُ"],["보이지 않게 몸을 감추다.","소도는 죄인이 숨더라도 잡아가지 못하는 신성한 지역이었다."]],1,[]],["알리다","동사",0,"",[["모르던 것이나 잊었던 것을 깨닫게 하거나 알게 하다.","결과를 알리다.","يُبَلِّغُ"],["사물이나 상황에 대한 정보나 지식을 알게 하다. ‘알다[1]「1」’의 사동사.","본부에 상황을 알리다."]],1,[]],["찍다","동사",0,"",[["날이 있는 연장 등으로 내리치거나 끝이 뾰족한 것으로 찌르다.","나무를 찍다.","يطعن، يحتطب"],["바닥에 대고 눌러서 자국을 내다.","서류에 도장을 찍다."]],1,[]],["약하다(弱하다)","형용사",0,"약할 약",[["힘의 정도가 작다.","맥박이 약하다."]],1,[]],["끓이다","동사",0,"",[["액체를 거품이 솟아오를 정도로 뜨겁게 하다.","물을 끓이다."]],0,[]],["녹다","동사",0,"",[["얼음이나 눈이 열을 받아서 물이 되다.","녹아 흐르다.","يُذيِبُ"],["얼음이나 얼음같이 매우 차가운 것이 열을 받아 액체가 되다.","얼음이 녹다."]],1,[]],["옮기다","동사",0,"",[["한곳에서 다른 곳으로 이동하게 하다.","나무를 옮기다.","يَنْقُلُ"],["어떤 곳에서 다른 곳으로 자리를 바꾸게 하다. ‘옮다[1]「1」’의 사동사.","의사가 환자를 응급실로 옮겼다."]],1,[]],["가리다","동사",0,"",[["막거나 감추어 보이거나 통하지 않게 되다.","앞이 가리다.","يَخْفَى"],["여럿 가운데서 하나를 구별하여 고르다.","우승 팀을 가리다."]],1,[]],["느리다","형용사",0,"",[["어떤 행동을 하는 데 걸리는 시간이 길다.","느린 걸음.","بَطِئ"],["어떤 동작을 하는 데 걸리는 시간이 길다.","행동이 느리다."]],1,[]],["짙다","형용사",0,"",[["빛깔이 보통의 정도보다 뚜렷하고 강하다.","짙은 색깔.","غامق"],["빛깔을 나타내는 물질이 많이 들어 있어 보통 정도보다 빛깔이 강하다.","짙은 빨강."]],1,[]],["강조하다(強調하다)","동사",0,"강할 강, 고를 조",[["어떤 부분을 특별히 강하게 주장하거나 두드러지게 하다.","이 그림은 특히 명암을 강조했다."]],1,[]],["알려지다","동사",0,"",[["어떤 일이나 사실 등이 드러나다.","비리가 알려지다.","يُعرف"],["어떤 사실을 다른 사람들이 전해 듣고 알게 되다.","적에게 비밀이 알려지다."]],1,[]],["마시다","동사",0,"",[["물 등의 액체를 목구멍으로 넘어가게 하다.","물을 마시다.","يَشْرَبُ"],["물이나 술 따위의 액체를 목구멍으로 넘기다.","차를 마시다."],["공기나 냄새 따위를 입이나 코로 들이쉬다.","정상에 올라 신선한 공기를 가득 마셨다."]],1,[]],["추다","동사",0,"",[["업거나 지거나 한 것을 치밀어서 올리다.","바지춤을 추다."],["물건을 찾으려고 뒤지다.","온 방을 다 추어도 공책을 찾을 수가 없었다."]],1,[]],["벌리다","동사",0,"",[["가까이 있거나 붙어 있는 둘 사이를 넓히거나 멀게 하다.","간격을 벌리다.","يُوَسِّع"],["둘 사이를 넓히거나 멀게 하다.","줄 간격을 벌리다."]],1,[]],["들어오다","동사",0,"",[["어떤 범위의 밖에서 안으로 이동하다.","서울로 들어오다."]],0,[]],["돌아가다","동사",0,"",[["물체가 한 점을 중심으로 하여 원을 그리면서 움직이다.","물레방아가 돌아가다."]],0,[]],["표시하다(標示하다)","동사",0,"표할 표, 보일 시",[["표를 하여 외부에 드러내 보이다.","상품에 가격을 표시하다."]],1,[]],["태어나다","동사",0,"",[["사람이나 동물이 형태를 갖추어 어미의 태(胎)로부터 세상에 나오다.","좋은 가문에서 태어나다."]],1,[]],["모이다","동사",0,"",[["따로 있는 것이 한데 합쳐지다.","여럿이 모이다.","يَتَجَمَّعُ"],["한데 합쳐지다. ‘모으다[1]「1」’의 피동사.","재료가 다 모이면 한데 섞어라."]],1,[]],["분명하다(分明하다)","형용사",0,"나눌 분, 밝을 명",[["모습이나 소리가 흐릿하지 않고 또렷하다.","분명한 목소리.","وَاضِحٌ"],["모습이나 소리 따위가 흐릿함이 없이 똑똑하고 뚜렷하다.","얼굴을 분명하게 알아보다."]],1,[]],["잘다","형용사",0,"",[["알곡이나 과일, 모래 등의 둥근 물건이나 글씨의 크기가 작다.","잔 알맹이.","صَغِير"],["알곡이나 과일, 모래 따위의 둥근 물건이나 글씨 따위의 크기가 작다.","알약이 너무 커서 잘게 부순 다음 삼켰다."]],1,[]],["뛰다","동사",0,"",[["몸을 위로 높이 솟게 하다.","제자리에서 뛰다.","يَقْفِزُ"],["있던 자리로부터 몸을 높이 솟구쳐 오르다.","제자리에서 높이 뛰다."]],1,[]],["인하다(因하다)","동사",0,"인할 인",[["어떤 사실로 말미암다.","부주의로 인한 사고."]],1,[]],["발생하다(發生하다)","동사",0,"필 발, 날 생",[["어떤 일이나 사물이 생겨나다.","이곳에서 사건이 발생한 것은 오늘 새벽 두 시께였다."]],1,[]],["타다","동사",0,"",[["불씨나 높은 열로 불꽃이 일어나거나 불이 붙어 번지다.","탄 종이.","يحترق، يشتعل"],["탈것이나 짐승의 등 따위에 몸을 얹다.","비행기에 타다."]],1,[]],["풀다","동사",0,"",[["매이거나 묶이거나 얽힌 것을 원래의 상태로 되게 하다.","결박을 풀다.","يحلّ، يفكّ"],["묶이거나 감기거나 얽히거나 합쳐진 것 따위를 그렇지 아니한 상태로 되게 하다.","보따리를 풀다."]],1,[]],["덮다","동사",0,"",[["무엇이 드러나거나 보이지 않도록 다른 것을 얹어서 씌우다.","이불을 머리에 덮다.","يُغَطِّي"],["물건 따위가 드러나거나 보이지 않도록 넓은 천 따위를 얹어서 씌우다.","책상보를 책상에 덮다."]],1,[]],["다루다","동사",0,"",[["어떤 것을 일거리로 삼다.","문서를 다루다.","يَتَعَامَل"],["어떤 물건이나 일거리 따위를 어떤 성격을 가진 대상 혹은 어떤 방법으로 취급하다.","그는 외과 수술을 전문으로 다룬다."]],1,[]],["활발하다(活潑하다)","형용사",0,"살 활, 물뿌릴 발",[["생기가 있고 힘차다.","활발한 움직임."]],0,[]],["새기다","동사",0,"",[["그림이나 글씨 등을 파다.","그림을 새기다.","يَنْقُش"],["글씨나 형상을 파다.","팔뚝에 문신을 새긴 사내."],["글이나 말의 뜻을 알기 쉽게 풀이하다.","어려운 글을 쉽게 새겨 주다."]],1,[]],["차지하다","동사",0,"",[["사물이나 공간, 지위 등을 자기 몫으로 가지다.","권력을 차지하다.","يَحْتَلُّ"],["사물이나 공간, 지위 따위를 자기 몫으로 가지다.","농토를 차지하다."]],1,[]],["다스리다","동사",0,"",[["국가나 사회, 단체, 집안의 일이나 그에 속한 사람들을 보살피고 관리하다.","나라를 다스리다.","يُهَيْمِنُ"],["국가나 사회, 단체, 집안의 일을 보살펴 관리하고 통제하다.","나라를 다스리다."],["음식물을 먹어서 배고픔 따위를 없애다.","과음하였을 때에는 꿀물로 속을 다스린다."]],1,[]],["삶다","동사",0,"",[["물에 넣고 끓이다.","국수를 삶다."]],1,[]],["불다","동사",0,"",[["바람이 일어나 어느 방향으로 움직이다.","부는 산들바람.","تَهُبُّ الرِّيح"],["바람이 일어나서 어느 방향으로 움직이다.","동풍이 부는 날."],["입을 오므리고 날숨을 내어보내어, 입김을 내거나 바람을 일으키다.","유리창에 입김을 불다."]],1,[]],["맡아보다","동사",0,"",[["어떤 일에 대한 책임을 지고 담당하여 직무를 수행하다.","금고 관리를 맡아보다."]],1,[]],["끝나다","동사",0,"",[["일이 마지막까지 이루어지다.","강의가 끝나다."]],0,[]],["계속하다(繼續하다)","동사",0,"이을 계, 이을 속",[["끊지 않고 이어 나가다.","두 달 동안 아침 운동을 계속했다."]],1,[]],["당하다(當하다)","동사",0,"마땅 당",[["원하지 않게 고통이나 피해를 받다.","거짓말에 당하다.","يُعَانِي"],["해를 입거나 놀림을 받다.","사기꾼에게 당하다."],["어떤 때나 형편에 이르거나 처하다.","선수들은 시합 날에 당하여 마음을 더욱 단단히 먹었다."],["맞서 이겨 내다.","사람을 부리는 수완에 있어서는 그에게 당할 사람이 없다."]],1,[]],["싸다","형용사",0,"",[["값이 보통보다 낮다.","싼 가격.","رَخِيص"],["걸음이 재빠르다.","걸음이 싸다."],["들은 말 따위를 진중하게 간직하지 아니하고 잘 떠벌리다.","입이 싸다."],["불기운이 세다.","싼 불에 국을 끓이다."]],1,[]],["묶다","동사",0,"",[["끈이나 줄 등을 매듭으로 만들다.","고무줄을 묶다.","يَرْبِطُ"],["끈 등으로 물건을 잡아매다.","머리카락을 묶다."]],0,[]],["지나가다","동사",0,"",[["시간이 가서 어떤 시기가 끝나다.","지나가는 주말.","يمرّ ب، يمرّ على"],["어디를 거치거나 통과하여 가다.","이 항공기는 중국 영공으로 지나간다."]],1,[]],["맞부딪치다","동사",0,"",[["서로 세게 마주 닿다. 또는 그렇게 되게 하다.","맞부딪친 자동차."]],0,[]],["아름답다","형용사",0,"",[["보이는 대상이나 목소리, 빛깔 등이 눈과 귀에 즐거움과 만족을 줄 만하다.","아름다운 목소리.","جَمِيل"],["보이는 대상이나 음향, 목소리 따위가 균형과 조화를 이루어 눈과 귀에 즐거움과 만족을 줄 만하다.","아름다운 목소리."]],1,[]],["특별하다(特別하다)","형용사",0,"특별할 특, 다를 별",[["보통과 구별되게 다르다.","특별한 감정."]],1,[]],["끼다","동사",0,"",[["구름이나 안개, 연기 등이 퍼져서 엉기다.","구름이 끼다.","يَلْتَفُّ"],["무엇에 걸려 빠지지 않도록 꿰거나 꽂다.","안경을 끼다."]],0,[]],["나아가다","동사",0,"",[["앞으로 향하여 가다.","한 걸음을 나아가다.","يَتَقَدَّمُ إِلَى الْأَمَامِ"],["앞으로 향하여 가다. 또는 앞을 향하여 가다.","그는 아무나 만날 수 있을 때까지 앞으로 나아가기로 하였다."]],1,[]],["뭉쳐나다","동사",0,"",[["풀이나 나무가 무더기로 더부룩하게 나다.",""]],1,[]],["바치다","동사",0,"",[["윗사람에게 물건을 드리다.","꽃을 바치다.","يَقْدَمُ"],["신이나 웃어른에게 정중하게 드리다.","새로 부임한 군수에게 음식을 만들어 바쳤다."],["주접스러울 정도로 좋아하여 찾다.","술을 바치다."]],1,[]],["섞이다","동사",0,"",[["두 가지 이상의 것이 한데 합쳐지다.","기름이 섞이다.","يَخْتَلِطُ"],["두 가지 이상의 것이 한데 합쳐지다. ‘섞다「1」’의 피동사.","쌀에 돌이 섞이다."]],1,[]],["열리다","동사",0,"",[["열매가 나뭇가지에 맺히다.","감이 열리다.","يُثمِرُ"],["닫히거나 잠긴 것이 트이거나 벗겨지다. ‘열다02[1]「1」’의 피동사.","문이 열려 있다."]],1,[]],["차다","동사",0,"",[["일정한 공간에 더 들어갈 수 없이 가득하게 되다.","교실이 차다.","يَمْتَلِئُ"],["발로 내어 지르거나 받아 올리다.","공을 차다."],["혀끝을 입천장 앞쪽에 붙였다가 떼어 소리를 내다.","혀를 끌끌 차다."]],1,[]],["곧다","형용사",0,"",[["길, 선, 자세 등이 휘지 않고 똑바르다.","곧은 길.","مُسْتَقِيم"],["굽거나 비뚤어지지 아니하고 똑바르다.","곧게 뻗은 도로."]],1,[]],["상대하다(相對하다)","동사",0,"서로 상, 대할 대",[["서로 마주 대하다.","가게에서 다양한 손님과 상대하다 보면 스트레스를 받기도 합니다."]],1,[]],["특정하다(特定하다)","동사",0,"특별할 특, 정할 정",[["구체적으로 명확히 지정하다.","시점을 특정하다."]],1,[]],["납작하다","동사",0,"",[["말대답을 하거나 무엇을 받아먹을 때 입을 냉큼 벌렸다가 닫다.",""],["몸을 바닥에 바짝 대고 냉큼 엎드리다.","그는 몸을 납작하더니 땅에 엎드렸다."]],1,[]],["급하다(急하다)","형용사",0,"급할 급",[["사정이나 형편이 빨리 처리해야 할 상태에 있다.","급한 부탁.","عَاجِلٌ"],["사정이나 형편이 조금도 지체할 겨를이 없이 빨리 처리하여야 할 상태에 있다.","급한 사정."]],1,[]],["뜨다","동사",0,"",[["물 위나 공중에 있거나 위쪽으로 솟아오르다.","하늘에 떠 있다.","يَعُومُ"],["물속이나 지면 따위에서 가라앉거나 내려앉지 않고 물 위나 공중에 있거나 위쪽으로 솟아오르다.","종이배가 물에 뜨다."]],1,[]],["담그다","동사",0,"",[["액체 속에 넣다.","시냇물에 발을 담그다."]],1,[]],["갖다","동사",0,"",[["무엇을 손에 쥐거나 몸에 지니다.","가방을 갖다."]],0,[]],["배우다","동사",0,"",[["새로운 지식을 얻다.","글을 배우다.","يَتَعَلَّمُ"],["새로운 지식이나 교양을 얻다.","한국에 유학 온 외국인에게서 외국어를 배우다."],["남의 행동, 태도를 본받아 따르다.","아이들은 일상 속에서 부모의 생활 태도를 배운다."]],1,[]],["취하다(取하다)","동사",0,"가질 취",[["일정한 조건에 맞는 것을 골라 가지다.","여러 가지 중 줄기들이 만나 이룬 강.","يَتَلَاقَى"],["누군가 가거나 와서 둘이 서로 마주 대하다.","어제 만난 후배."]],0,[]],["치르다","동사",0,"",[["주어야 할 돈을 내주다.","주인에게 내일까지 아파트 잔금을 치러야 한다."],["무슨 일을 겪어 내다.","시험을 치르다."]],1,[]],["낮추다","동사",0,"",[["아래에서 위까지의 길이를 짧게 하다.","높이를 낮추다.","يَقُصّ"],["아래에서 위까지의 높이를 기준이 되는 대상이나 보통 정도에 미치지 못하는 상태가 되게 하다. ‘낮다「1」’의 사동사.","몸을 낮추다."]],1,[]],["연주하다(演奏하다)","동사",0,"펼 연, 아뢸 주",[["악기를 다루어 곡을 표현하거나 들려주다.","바이올린을 연주하다."]],1,[]],["따뜻하다","형용사",0,"",[["아주 덥지 않고 기분이 좋은 정도로 온도가 알맞게 높다.","따뜻한 기후.","دَافِئ"],["덥지 않을 정도로 온도가 알맞게 높다.","따뜻한 햇살."]],1,[]],["심다","동사",0,"",[["풀이나 나무 등의 뿌리나 씨앗을 흙 속에 묻다.","꽃을 심다.","يَغْرِسُ"],["초목의 뿌리나 씨앗 따위를 흙 속에 묻다.","정원에 나무를 심다."]],1,[]],["놀라다","동사",0,"",[["뜻밖의 일을 당하거나 무서워서 순간적으로 긴장하거나 가슴이 뛰다.","놀라는 표정.","يَنْدَهِشُ"],["뜻밖의 일이나 무서움에 가슴이 두근거리다.","고함 소리에 화들짝 놀라다."]],1,[]],["연결하다(連結하다)","동사",0,"이을 연, 맺을 결",[["사물과 사물을 서로 잇거나 현상과 현상이 관계를 맺게 하다.","호스를 수도꼭지에 연결하다."]],1,[]],["뻗다","동사",0,"",[["가지나 덩굴, 뿌리 등이 길게 자라나다. 또는 그렇게 하다.","가지가 뻗다.","يَمْتَدُّ"],["가지나 덩굴, 뿌리 따위가 길게 자라나다. 또는 그렇게 하다. ‘벋다01「1」’보다 센 느낌을 준다.","칡덩굴의 뿌리가 산기슭으로 뻗다."]],1,[]],["남기다","동사",0,"",[["다 쓰지 않고 나머지가 있게 하다.","밥을 남기다.","يَتْرُكُ"],["잊히지 않게 하거나 나중에까지 전해지게 하다.","명곡을 남기다."]],0,[]],["거볍다","형용사",0,"",[["무게가 적다.","그가 준 보따리는 기대했던 것보다 거벼웠기에 허전한 느낌마저 주었다."]],1,[]],["죽이다","동사",0,"",[["생물이 생명을 잃게 하다.","곤충을 죽이다."]],0,[]],["벗어나다","동사",0,"",[["일정한 공간이나 범위 밖으로 빠져나가다.","시내를 벗어나다.","يَخْرُجُ مِنْ"],["공간적 범위나 경계 밖으로 빠져나오다.","터널에서 벗어나자, 기차는 길게 기적 소리를 두 번 울렸다."]],1,[]],["익히다","동사",0,"",[["고기, 채소, 곡식 등의 날것을 열을 가해 맛과 성질이 달라지게 하다.","익힌 고기.","يَطْبُخُ"],["열매나 씨를 여물게 하다. ‘익다01「1」’의 사동사.","가을볕이 감을 빨갛게 익혔다."]],1,[]],["이어지다","동사",0,"",[["끊기지 않고 연결되다.","이어진 밧줄."]],0,[]],["돌아다니다","동사",0,"",[["여기저기를 두루 다니다.","돌아다니는 사람.","يَتَجَوَّلُ، يَتَرَحَّلُ"],["여기저기 여러 곳으로 다니다.","밤늦게 돌아다니지 말고 집에 일찍 들어가거라."]],1,[]],["조사하다(調査하다)","동사",0,"고를 조, 조사할 사",[["사물의 내용을 명확히 알기 위하여 자세히 살펴보거나 찾아보다.","제품 선호도를 조사하다."]],1,[]],["막히다","동사",0,"",[["길, 통로, 구멍 등이 통하지 못하게 되다.","막힌 구멍.","يَنْسَدُّ"],["길, 통로 따위가 통하지 못하게 되다. ‘막다[1]「1」’의 피동사.","길이 막히다."]],1,[]],["빚다","동사",0,"",[["흙 등을 반죽하고 주물러서 어떤 형태를 만들다.","그릇을 빚다.","يَصْنَع"],["흙 따위의 재료를 이겨서 어떤 형태를 만들다.","흙으로 독을 빚다."]],1,[]],["늙다","동사",0,"",[["나이가 많이 들다.","늙은 사람.","يَكْبَرُ فِي السِّنّ"],["사람이나 동물, 식물 따위가 나이를 많이 먹다. 사람의 경우에는 흔히 중년이 지난 상태가 됨을 이른다.","사람은 늙거나 병들면 죽는다."]],1,[]],["딸리다","동사",0,"",[["어떤 것에 매이거나 붙어 있다.","그 집에는 비교적 넓은 앞마당이 딸려 있다."]],1,[]],["들이다","동사",0,"",[["사람을 안으로 들어오게 하다.","손님을 들이다.","يُدَخّلُ"],["밖에서 속이나 안으로 향해 가게 하거나 오게 하다. ‘들다01[Ⅰ][1]「1」’의 사동사.","친구를 방에 들이다."]],1,[]],["불리다","동사",0,"",[["오라고 하거나 주의를 끄는 말이나 명령, 지시 등을 받다.","불리어 가다.","يُدْعَى إِلَى"],["무엇이라고 가리켜 말해지거나 이름이 붙여지다. ‘부르다01[3]’의 피동사.","농사일에 새참으로 나오는 탁주는 농민들에게 농주로도 불렸다."],["물에 젖게 해서 부피를 커지게 하다. ‘붇다「1」’의 사동사.","녹두를 물에 불리다."]],1,[]],["굽다","동사",0,"",[["음식을 불에 익히다.","갓 구운 빵.","يَشْوِي"],["불에 익히다.","화롯불에 구운 고구마."]],1,[]],["감다","동사",0,"",[["눈꺼풀로 눈을 덮다.","반쯤 감다.","يُغْمِضُ"],["어떤 물체를 다른 물체에 말거나 빙 두르다.","실을 실패에 감다."]],1,[]],["살피다","동사",0,"",[["이것저것 조심하여 자세히 보다.","사방을 살피다.","يدرس، ينظر إلى"],["두루두루 주의하여 자세히 보다.","사방을 살피다."]],1,[]],["발견하다(發見하다)","동사",0,"필 발, 볼 견",[["미처 찾아내지 못하였거나 아직 알려지지 아니한 사물이나 현상, 사실 따위를 찾아내다.","새로 발견한 법칙."]],1,[]],["마련하다","동사",0,"",[["어떤 물건이나 상황을 준비하여 갖추다.","돈을 마련하다.","يُحَضِّرُ"],["헤아려서 갖추다.","돈을 마련하다."]],1,[]],["밟다","동사",0,"",[["어떤 대상 위에 발을 올려놓고 누르다.","담배를 밟아 끄다.","يَطَأُ"],["발을 들었다 놓으면서 어떤 대상 위에 대고 누르다.","옆 사람 발을 밟다."]],1,[]],["밝히다","동사",0,"",[["불이나 전등 등으로 어두운 곳을 환하게 하다.","거리를 밝히다.","يُضِيءُ"],["불빛 따위로 어두운 곳을 환하게 하다. ‘밝다[Ⅱ][1]「1」’의 사동사.","어둠을 밝히다."],["드러나게 좋아하다.","돈과 지위를 밝히다."]],1,[]],["돌리다","동사",0,"",[["환자가 위험한 상황을 넘기게 하다.","기운을 돌리다.","يُنْهِي حَالَةَ الْأَزْمَة"],["물체를 일정한 축을 중심으로 원을 그리면서 움직이게 하다. ‘돌다[1]「1」’의 사동사.","바퀴를 돌리다."]],1,[]],["빼앗다","동사",0,"",[["다른 사람이 가진 것을 강제로 없애거나 자기 것으로 하다.","돈을 빼앗다.","يَسْلُبُ"],["남의 것을 억지로 제 것으로 만들다.","행인에게서 돈을 빼앗다."]],1,[]],["잘못되다","동사",0,"",[["일이 틀리거나 실패하게 되다.","잘못된 교육.","يُخْطِئ"],["어떤 일이 그릇되거나 실패로 돌아가다.","잘못된 생활 방식."]],1,[]],["구성하다(構成하다)","동사",0,"얽을 구, 이룰 성",[["몇 가지의 부분 혹은 요소를 모아서 하나의 전체를 이루다.","단체를 구성하다.","يُكَوِّنُ"],["몇 가지 부분이나 요소들을 모아서 일정한 전체를 짜 이루다.","조사단을 구성하다."]],1,[]],["보호하다(保護하다)","동사",0,"지킬 보, 도울 호",[["위험이나 곤란 따위가 미치지 아니하도록 잘 보살펴 돌보다.","어린이를 보호하다."]],1,[]],["결정하다(決定하다)","동사",0,"결단할 결, 정할 정",[["행동이나 태도를 분명하게 정하다.","집안의 대소사를 결정하다."]],1,[]],["어렵다","형용사",0,"",[["하기가 복잡하거나 힘이 들다.","어려운 수술.","صَعْب"],["하기가 까다로워 힘에 겹다.","어려운 수술."]],1,[]],["깨닫다","동사",0,"",[["사물의 본질이나 이치, 진리 등을 깊이 생각한 끝에 알게 되다.","가르침을 깨닫다.","يُدْرِكُ"],["사물의 본질이나 이치 따위를 생각하거나 궁리하여 알게 되다.","잘못을 깨닫다."],["감각 따위를 느끼거나 알게 되다.","그녀는 닥쳐오는 위기를 본능적으로 깨달았다."]],1,[]],["표현하다(表現하다)","동사",0,"겉 표, 나타날 현",[["생각이나 느낌 따위를 언어나 몸짓 따위의 형상으로 드러내어 나타내다.","이별의 한을 표현한 작품."]],1,[]],["돕다","동사",0,"",[["남이 하는 일을 거들거나 보탬이 되는 일을 하다.","농사를 돕다.","يُسَاعِدُ، يُعَاوِنُ، يَمُدُّ الْيَد"],["남이 하는 일이 잘되도록 거들거나 힘을 보태다.","식사 준비를 돕다."]],1,[]],["썰다","동사",0,"",[["어떤 물체에 칼이나 톱을 대고 아래로 누르면서 날을 앞뒤로 움직여서 잘라 내거나 토막이 나게 하다.","가래떡을 썰다."]],1,[]],["기울어지다","동사",0,"",[["물체가 한 방향으로 조금 낮아지거나 비뚤어지게 되다.","고개가 기울어지다.","يَتَمَيَّلُ، يَتَحَدَّرُ"],["비스듬하게 한쪽이 낮아지거나 비뚤어지게 되다.","거친 파도에 배가 한쪽으로 기울어졌다."]],1,[]],["끊다","동사",0,"",[["실, 줄, 끈 등의 이어진 것을 잘라 따로 떨어지게 하다.","고무줄을 끊다."]],0,[]],["이기다","동사",0,"",[["내기나 시합, 싸움 등에서 상대를 누르고 더 좋은 결과를 내다.","상대편을 이기다.","يَفُوزُ"],["내기나 시합, 싸움 따위에서 재주나 힘을 겨루어 우위를 차지하다.","아군의 수가 월등히 많아서 적에게 쉽게 이겼다."],["가루나 흙 따위에 물을 부어 반죽하다.","진흙을 물에 이기다."]],1,[]],["존재하다(存在하다)","동사",0,"있을 존, 있을 재",[["현실에 실재하다.","이 세상에는 신이 존재한다."]],1,[]],["담다","동사",0,"",[["어떤 물건을 그릇 등에 넣다.","쌀을 담다.","يَضَع"],["어떤 물건을 그릇 따위에 넣다.","쌀통에 쌀을 담다."]],1,[]],["무르다","동사",0,"",[["단단했던 것이 물렁물렁해지다.","무른 감자.","يُلَيِّنُ"],["이미 행한 일을 그 전의 상태로 돌리다.","한 수만 물러 주게."],["굳은 것이 물렁거리게 되다.","단감이 물러 연시처럼 되었다."]],1,[]],["이끌다","동사",0,"",[["가고자 하는 곳으로 같이 가면서 따라오게 하다.","가족을 이끌다"],["늙거나 지친 몸을 힘들게 움직이다.","늙은 몸을 이끌다."]],0,[]],["오래되다","형용사",0,"",[["시간이 지나간 동안이 길다.","쓰던 가전제품이 오래되고 낡아서 새것으로 바꿨다."]],1,[]],["돌아오다","동사",0,"",[["원래 있던 곳으로 다시 오거나 다시 그 상태가 되다.","아들이 고향에 돌아오다."]],1,[]],["피하다(避하다)","동사",0,"피할 피",[["원치 않은 일을 당하거나 어려운 일이 일어나지 않게 하다.","마찰을 피하다.","يَتَجَنَّبُ"],["원치 않은 일을 당하거나 어려운 처지에 놓이지 않도록 하다.","소뿔도 피하고 독사 혓바닥도 피하려면 새가 돼야겠소.≪박경리, 토지≫"]],1,[]],["떠나다","동사",0,"",[["있던 곳에서 다른 곳으로 옮겨 가다.","먼 곳으로 떠나다."]],0,[]],["내밀다","동사",0,"",[["몸이나 물체의 일부분이 밖이나 앞으로 나가게 하다.","끝을 내밀다.","يَدْفَعُ"],["신체나 물체의 일부분이 밖이나 앞으로 나가게 하다.","문밖으로 얼굴을 내밀다."],["힘껏 밀어서 어떤 공간에서 밖으로 나가게 하다.","낯선 사람을 집 밖으로 내밀다."]],1,[]],["구하다(求하다)","동사",0,"구할 구",[["필요한 것을 얻으려고 찾다. 또는 찾아서 얻다.","돈을 구하다."]],0,[]],["간단하다(簡單하다)","형용사",0,"대쪽 간, 홑 단",[["길거나 복잡하지 않다.","간단한 설명.","بَسِيط"],["단순하고 간략하다.","간단한 구조."]],1,[]],["내려오다","동사",0,"",[["높은 곳에서 낮은 곳으로 또는 위에서 아래로 오다.","밑으로 내려오다.","يَنْزِلُ"],["높은 곳에서 낮은 곳으로 또는 위에서 아래로 가다.","위층 사람들이 아래층에 내려왔다."]],1,[]],["설명하다(說明하다)","동사",0,"말씀 설, 밝을 명",[["어떤 일이나 대상의 내용을 상대편이 잘 알 수 있도록 밝혀 말하다.","신자들에게 교리를 설명하다."]],1,[]],["가난하다","형용사",0,"",[["살림살이가 넉넉하지 못하여 몸과 마음이 괴로운 상태에 있다.","그는 비록 가난했지만 정직하고 바르게 살려고 노력했다."]],1,[]],["종사하다(從事하다)","동사",0,"좇을 종, 일 사",[["어떤 일에 마음과 힘을 다하다.","과학에 종사하다.","يَعْمَلُ"],["어떤 일을 일삼아서 하다.","사무직에 종사하다."]],1,[]],["차리다","동사",0,"",[["준비한 음식 등을 먹을 수 있게 상 위에 놓다.","생일상을 차리다.","يمدّ المائدة، يعدّ، يحضّر، يهيّئ"],["해야 할 일을 준비하거나 그 일의 방법을 찾다.","이제 그만 떠날 준비를 차려라."]],1,[]],["가르치다","동사",0,"",[["지식이나 기술 등을 설명해서 익히게 하다.","교과목을 가르치다.","يُدَرِّسُ، يُعَلِّمُ"],["지식이나 기능, 이치 따위를 깨닫게 하거나 익히게 하다.","그는 그녀에게 운전을 가르쳤다."]],1,[]],["곱다","형용사",0,"",[["모양이나 생김새가 아름답다.","고운 손."],["만져 보았을 때의 느낌이 매끄럽고 부드럽다.","고운 옷감."]],0,[]],["다하다","동사",0,"",[["다 써 버려서 남아 있지 않거나 이어지지 않고 끝나다.","기력이 다하다.","يَفْنَى"],["어떤 것이 끝나거나 남아 있지 아니하다.","기름이 다하다."],["어떤 일을 위하여 힘, 마음 따위를 모두 들이다.","최선을 다하다."]],1,[]],["치료하다(治療하다)","동사",0,"다스릴 치, 병고칠 료",[["병이나 상처 따위를 잘 다스려 낫게 하다.","상처를 치료하다."]],1,[]],["즐기다","동사",0,"",[["즐겁게 마음껏 누리다.","즐기는 인생.","يتمتّع ب"],["즐겁게 누리거나 맛보다.","청춘을 즐기다."]],1,[]],["끌다","동사",0,"",[["바닥에 댄 채로 잡아당겨 움직이다.","다리를 끌다.","يَجُرُّ"],["바닥에 댄 채로 잡아당기다.","신을 끌다."]],1,[]],["질기다","형용사",0,"",[["물건이 쉽게 닳거나 끊어지지 않고 견디는 힘이 세다.","질긴 끈.","متين، عسير"],["물건이 쉽게 해지거나 끊어지지 아니하고 견디는 힘이 세다.","냉면 면발이 어찌나 질긴지 끊어지지 않는다."]],1,[]],["지다","동사",0,"",[["해나 달이 서쪽으로 넘어가다.","겨울이 되니 해가 일찍 진다."]],1,[]],["솟다","동사",0,"",[["아래에서 위로 세차게 혹은 곧바로 오르다.","김이 솟다.","يَرْتَفِعُ"],["연기와 같은 물질이나 비행기와 같은 물체가 아래에서 위로, 또는 속에서 겉으로 세차게 움직이다.","김이 모락모락 솟고 있는 주전자."]],1,[]],["대신하다(代身하다)","동사",0,"대신할 대, 몸 신",[["어떤 대상의 자리나 구실을 바꾸어서 새로 맡다.","우유는 모유를 대신한다."]],1,[]],["얕다","형용사",0,"",[["위에서 밑바닥까지 또는 겉에서 속까지의 거리가 짧다.","얕은 바다.","ضحل"],["겉에서 속, 또는 밑에서 위까지의 길이가 짧다.","얕은 물."]],1,[]],["조직하다(組織하다)","동사",0,"짤 조, 짤 직",[["짜서 이루거나 얽어서 만들다.",""]],1,[]],["모으다","동사",0,"",[["따로 있는 것을 한데 합치다.","나뭇잎을 모으다.","يَجْمَعُ"],["한데 합치다.","두 손을 모으고 기도드리다."]],1,[]],["줄이다","동사",0,"",[["어떤 물체의 길이, 넓이, 부피 등을 원래보다 작게 하다.","길이를 줄이다.","يقلّل، يصغّر"],["물체의 길이나 넓이, 부피 따위를 본디보다 작게 하다. ‘줄다「1」’의 사동사.","집을 줄여 이사를 하였다."]],1,[]],["인정하다(認定하다)","동사",0,"알 인, 정할 정",[["확실히 그렇다고 여기다.","권위를 인정하다."]],1,[]],["받들다","동사",0,"",[["공경하여 모시다. 또는 소중히 대하다.","가족을 받들다.","يَحْتَرِم"],["물건의 밑을 받쳐 올려 들다.","잔을 받들다."]],1,[]],["거두다","동사",0,"",[["벌이거나 차려 놓은 것을 정리하다.","물건을 거두다.",""],["흩어져 있는 물건 따위를 한데 모으다.","시간이 끝나고 답안지를 거둔 아이의 말에 의하면 기표의 답안지는 거의 백지에 가까웠다는 것만 알았을 뿐이다.≪전상국, 우상의 눈물≫"]],1,[]],["뚜렷하다","형용사",0,"",[["엉클어지거나 흐리지 아니하고 아주 분명하다.","뚜렷한 모습."]],1,[]],["흔들다","동사",0,"",[["무엇을 좌우, 앞뒤로 자꾸 움직이게 하다.","고개를 흔들다.","يَهُزُّ"],["사람이나 동물 등이 몸의 일부나 전체, 또는 손에 잡은 물체 따위를 좌우, 앞뒤, 상하로 자꾸 움직이게 하다.","손을 흔들다."]],1,[]],["받치다","동사",0,"",[["어떤 물건이나 몸의 한 부분을 다른 물건이나 몸의 아래에 놓이게 하다.","책받침을 받치다.","يَضَع"],["물건의 밑이나 옆 따위에 다른 물체를 대다.","쟁반에 커피를 받치고 조심조심 걸어오던 그녀의 모습이 아직도 잊히지 않는다."]],1,[]],["뜻하다","동사",0,"",[["무엇을 하고자 하는 마음을 가지다.","뜻하는 관계.","يَتَّخِذُ قَرَاراَ"],["무엇을 할 마음을 먹다.","모든 일이 뜻하는 대로 되면 좋겠다."],["어떤 의미를 가지다.","정부라고 하면 대개의 경우 행정부를 뜻한다."]],1,[]],["두드리다","동사",0,"",[["소리가 나도록 잇따라 치거나 때리다.","어깨를 두드리다."]],1,[]],["겨루다","동사",0,"",[["서로 버티어 승부를 다투다.","상대 선수와 기량을 겨루다."]],1,[]],["공격하다(攻擊하다)","동사",0,"칠 공, 칠 격",[["전쟁에서 적을 치다.","성을 공격하다.","يُغِير(فِي الحَرْب)"],["나아가 적을 치다.","적군의 고지를 공격하다."]],1,[]],["팔다","동사",0,"",[["값을 받고 물건이나 권리를 남에게 넘기거나 노력 등을 제공하다.","땅을 팔다."]],0,[]],["힘들다","형용사",0,"",[["힘이 많이 쓰이는 면이 있다.","걷기가 힘들다."]],0,[]],["편찬하다(編纂하다)","동사",0,"엮을 편, 모을 찬",[["여러 가지 자료를 모아 체계적으로 정리하여 책을 만들다.","사전을 편찬하는 사업."]],1,[]],["어지럽다","형용사",0,"",[["주위의 모든 사물이 돌고 있는 듯한 느낌이 들어 몸을 바로잡을 수가 없다.","어지러운 머리.","د ,[]],["잡히다","동사",0,"",[["얼음이 얼기 시작하다.","잡힌 얼음.","يَتَجَمَّدُ"],["붙들려 손에 넣어지다. ‘잡다01[1]「2」’의 피동사.","일단 경찰의 포위망에 잡히면 도망치기 어렵다."]],1,[]],["올라가다","동사",0,"",[["아래에서 위로, 낮은 곳에서 높은 곳으로 가다.","산 위로 올라가다.",""],["낮은 곳에서 높은 곳으로 또는 아래에서 위로 가다.","나무에 올라가다."]],1,[]],["유지하다(維持하다)","동사",0,"벼리 유, 가질 지",[["어떤 상태나 상황을 그대로 보존하거나 변함없이 계속하여 지탱하다.","현재 상태를 유지하다."]],1,[]],["잇다","동사",0,"",[["실, 끈, 조각 등의 두 끝을 매거나 붙여서 하나로 만들거나 물건 등을 맞대어 붙이다.","끈을 잇다.","يَرْبِطُ"],["두 끝을 맞대어 붙이다.","직선은 한 점과 또 다른 한 점을 잇는 가장 짧은 선이다."]],1,[]],["시작되다(始作되다)","동사",0,"비로소 시, 지을 작",[["어떤 일이나 행동의 처음 단계가 이루어지다.","기말고사가 시작되다."]],1,[]],["수행하다(修行하다)","동사",0,"닦을 수, 다닐 행",[["몸과 마음을 바르게 갈고 닦다.","오랫동안 수행하다.","يُمَارِسُ الزُّهْدَ"],["행실, 학문, 기예 따위를 닦다.",""]],1,[]],["꿰다","동사",0,"",[["구멍을 통해 실이나 끈 등을 한쪽에서 다른 쪽으로 나가게 하다.","구슬을 끈에 꿰다.","يَخْرِقُ"],["실이나 끈 따위를 구멍이나 틈의 한쪽에 넣어 다른 쪽으로 내다.","실을 바늘에 꿰다."]],1,[]],["어리석다","형용사",0,"",[["슬기롭지 못하고 둔하다.","어리석은 행동."]],1,[]],["벌이다","동사",0,"",[["일을 계획하여 시작하거나 펼치다.","사업을 벌이다.","يَجْرِي"],["일을 계획하여 시작하거나 펼쳐 놓다.","잔치를 벌이다."]],1,[]],["놓이다","동사",0,"",[["걱정이나 긴장 등이 잊히거나 풀어져 없어지다.","마음이 놓이다.","يَسْتَرْخِي"],["걱정이나 근심, 긴장 따위가 사라지거나 풀리다. ‘놓다[Ⅰ][1]「3」’의 피동사.","무사하다는 소식을 들으니 나는 이제야 마음이 놓인다."],["물체가 일정한 곳에 두어지다. ‘놓다[Ⅰ][2]「1」’의 피동사.","연필이 책상 위에 놓여 있다."]],1,[]],["힘차다","형용사",0,"",[["힘이 있고 씩씩하다.","힘찬 발걸음."]],1,[]],["잘되다","동사",0,"",[["어떤 일이나 현상이 좋게 이루어지다.","잘된 농사."]],0,[]],["통과하다(通過하다)","동사",0,"통할 통, 지날 과",[["어떤 장소나 때를 거쳐서 지나가다.","검문을 통과하다.","يمرّ، يعبر"],["어떤 곳이나 때를 거쳐서 지나가다.","마을을 통과하다."]],1,[]],["비하다(比하다)","동사",0,"견줄 비",[["다른 것과 견주거나 비교하다.","비할 것이 아니다.","يُقَارِنُ بِ"],["사물 따위를 다른 것에 비교하거나 견주다.","어머니의 사랑을 어디에다 비하랴."]],1,[]],["체하다","동사",0,"",[["앞말이 뜻하는 행동이나 상태를 거짓으로 그럴듯하게 꾸밈을 나타내는 말.","잘난 체하다."]],1,[]],["썩다","동사",0,"",[["음식물이나 자연물이 세균에 의해 분해되어 상하거나 나쁘게 변하다.","썩는 냄새."]],0,[]],["피우다","동사",0,"",[["꽃봉오리나 잎 등을 벌어지게 하다.","꽃을 피우다.","يفتّح"],["꽃봉오리 따위를 벌어지게 하다. ‘피다01[1]「1」’의 사동사.","꽃을 피우다."]],1,[]],["드러내다","동사",0,"",[["가려져 있던 것을 보이게 하다.","어깨를 드러내는 옷차림."]],0,[]],["마치다","동사",0,"",[["어떤 일이나 과정, 절차 따위가 끝나다. 또는 그렇게 하다.","일이 마치면 식당으로 와라."]],1,[]],["부족하다(不足하다)","형용사",0,"아닐 부, 발 족",[["필요한 양이나 기준에 모자라거나 넉넉하지 않다.","부족한 공급."]],0,[]],["그러하다","형용사",0,"",[["상태, 모양, 성질 등이 그와 같다.","그러한 일.","كَذَلِكَ"],["‘그렇다「1」’의 본말.","의사 선생님께서 진료 시간은 끝났지만 상황이 그러하니 열이 나는 아이를 데리고 바로 병원으로 오라고 하셨다."],["‘그렇다「2」’의 본말.","별일 없는 그냥 그러한 일상."],["‘그렇다「3」’의 본말.","그 식당은 맛이며 분위기가 가격에 비해 좀 그러했다."]],1,[]],["달다","동사",0,"",[["쇠나 돌 등의 타지 않는 물체가 열을 받아 매우 뜨거워지다.","뜨겁게 단 쇳덩이.","يَسْخُنُ ، يُصْبِحُ حَارًّا"],["물건을 일정한 곳에 붙이다.","옷에 단추를 달다."]],1,[]],["견디다","동사",0,"",[["힘들거나 어려운 것을 참고 버티어 살아 나가다.","견디기 어렵다.","يَتَحَمَّلُ"],["사람이나 생물이 일정한 기간 동안 어려운 환경에 굴복하거나 죽지 않고 계속해서 버티면서 살아 나가는 상태가 되다.","이 돈이면 며칠은 견딜 수 있겠어."],["물건이 열이나 압력 따위와 같은 외부의 작용을 받으면서도 일정 기간 동안 원래의 상태나 형태를 유지하다.","이 구두는 오래 견디지 못한다."]],1,[]],["터지다","동사",0,"",[["둘러싸여 막혔던 것이 무너지거나 뚫리다.","둑이 터지다.","ينهدّ، يتدمّر"],["둘러싸여 막혔던 것이 갈라져서 무너지다. 또는 둘러싸여 막혔던 것이 뚫어지거나 찢어지다.","홍시가 터지다."]],1,[]],["함유하다(含有하다)","동사",0,"머금을 함, 있을 유",[["물질이 어떤 성분을 포함하고 있다.","철분을 함유한 물."]],1,[]],["활동하다(活動하다)","동사",0,"살 활, 움직일 동",[["몸을 움직이다.","활동하기 나쁘다.","اشتغل"],["몸을 움직여 행동하다.","활동하기 좋은 계절."]],1,[]],["일하다","동사",0,"",[["무엇을 이루려고 몸이나 정신을 사용하다.","일한 대가."]],0,[]],["겪다","동사",0,"",[["어렵거나 중요한 일을 당하여 경험하다.","갈등을 겪다.","يُجَرِّبُ"],["어렵거나 경험될 만한 일을 당하여 치르다.","고통을 겪다."]],1,[]],["의지하다(依支하다)","동사",0,"의지할 의, 지탱할 지",[["다른 것에 몸을 기대다.","지팡이에 몸을 의지하다."]],1,[]],["돌보다","동사",0,"",[["어떤 대상에 관심을 가지고 보호하며 살피다.","가축을 돌보다."]],0,[]],["뭉치다","동사",0,"",[["한 덩어리가 되다.","반죽이 뭉치다.","يَتَكَتَّلُ"],["한데 합쳐서 한 덩어리가 되다. 또는 그렇게 되게 하다.","물기가 있는지 솜이 뭉쳤다."]],1,[]],["열다","동사",0,"",[["닫히거나 잠긴 것을 트거나 벗기다.","문을 열다."]],1,[]],["연결되다(連結되다)","동사",0,"이을 연, 맺을 결",[["사물과 사물이 서로 이어지거나 현상과 현상이 관계가 맺어지다.","땅굴이 지하의 토광에 연결된다."]],1,[]],["새롭다","형용사",0,"",[["지금까지의 것과 다르거나 있은 적이 없다.","새로운 발견.","جديد"],["지금까지 있은 적이 없다.","새로운 소식."]],1,[]],["합하다(合하다)","동사",0,"합할 합",[["여럿이 한데 모이다. 또는 여럿을 한데 모으다.","그는 별거 중이던 아내와 다시 합했다."]],1,[]],["가꾸다","동사",0,"",[["식물이 잘 자라도록 보살피다.","나무를 가꾸다.","يَرْعَى ، يَعْتَنِي"],["식물이나 그것을 기르는 장소 따위를 손질하고 보살피다.","정원을 가꾸다."]],1,[]],["제외하다(除外하다)","동사",0,"덜 제, 바깥  징",[["추상적인 개념이나 사물을 구체적인 사물로 나타내다.","태극기는 우리나라를 상징하는 국기이다."]],1,[]],["넉넉하다","형용사",0,"",[["크기나 수 등이 적거나 부족하지 않고 충분하다.","넉넉한 공간.","كَافٍ"],["크기나 수량 따위가 기준에 차고도 남음이 있다.","시간이 넉넉하다."]],1,[]],["젖다","동사",0,"",[["액체가 스며들어 축축해지다.","머리카락이 젖다."]],0,[]],["관리하다(管理하다)","동사",0,"대롱 관, 다스릴 리",[["어떤 일을 책임지고 맡아 처리하다.","사무를 관리하다.","يُرَاعِي"],["시설이나 물건의 유지, 개량 따위의 일을 맡아 하다.","창고를 관리하다."],["사람을 통제하고 지휘하며 감독하다.","해외 근로자들을 관리하는 부서."]],1,[]],["두껍다","형용사",0,"",[["넓적한 물건의 한 면과 그에 평행한 맞은 면 사이의 길이가 길다.","두꺼운 고기.","سَمِيك"],["두께가 보통의 정도보다 크다.","두꺼운 이불."]],1,[]],["박다","동사",0,"",[["두들겨 치거나 돌려서 꽂히게 하다.","쐐기를 박다.","يَدُقُّ"],["두들겨 치거나 틀어서 꽂히게 하다.","벽에 못을 박다."]],1,[]],["신다","동사",0,"",[["신, 버선, 양말 따위를 발에 꿰다.","신을 신다."]],1,[]],["귀엽다","형용사",0,"",[["예쁘고 곱거나 또는 애교가 있어서 사랑스럽다.","나는 아기의 우는 모습조차도 귀여웠다."]],1,[]],["노래하다","동사",0,"",[["가사가 있는 음악을 소리 내어 부르다.","가수가 노래하다.","يُغَنِّي"],["가사에 곡조를 붙여 목소리로 부를 수 있게 만든 음악을 사람이 부르다.","가수가 노래하다."]],1,[]],["때리다","동사",0,"",[["손이나 손에 든 물건으로 아프게 치다.","따귀를 때리다.","يَضْرِبُ"],["손이나 손에 든 물건 따위로 아프게 치다.","회초리로 종아리를 때리다."]],1,[]],["투명하다(透明하다)","형용사",0,"사무칠 투, 밝을 명",[["어떤 물건의 속이 비치도록 맑다.","투명한 유리.","شَفَّاف"],["물 따위가 속까지 환히 비치도록 맑다.","차고 투명한 샘물."]],1,[]],["답답하다","형용사",0,"",[["근심이나 걱정으로 마음이 초조하고 속이 시원하지 않다.","답답한 가슴."],["숨이 막힐 듯하거나 숨쉬기가 어렵다.","답답한 증상."]],0,[]],["젊다","형용사",0,"",[["나이가 한창때에 있다.","한 쌍의 젊은 남녀."]],1,[]],["바라다","동사",0,"",[["생각이나 희망대로 어떤 일이 이루어지기를 기대하다.","바라는 마음.","يَرْغَبُ"],["생각이나 바람대로 어떤 일이나 상태가 이루어지거나 그렇게 되었으면 하고 생각하다.","요행을 바라다."],["어떤 것을 향하여 보다.","우리는 앞만 바라보며 죽을힘을 다해서 인왕산을 바라고 뛰었다.≪황석영, 어둠의 자식들≫"]],1,[]],["끓다","동사",0,"",[["액체가 몹시 뜨거워져서 거품이 솟아오르다.","국이 끓다.","يُزْبِدُ،يَنْفِطُ"],["액체가 몹시 뜨거워져서 소리를 내면서 거품이 솟아오르다.","물이 끓다."]],1,[]],["구성되다(構成되다)","동사",0,"얽을 구, 이룰 성",[["몇 가지의 부분 혹은 요소를 모아서 하나의 전체가 이루어지다.","국회가 구성되다.","يُنَظَّمُ"],["몇 가지 부분이나 요소들이 모여 일정한 전체가 짜여 이루어지다.","새 인물들로 이사진이 구성되다."]],1,[]],["가라앉다","동사",0,"",[["물 등에 떠 있거나 섞여 있는 것이 아래쪽으로 내려가다.","먼지가 가라앉다.","يَغْرَقُ"],["물 따위에 떠 있거나 섞여 있는 것이 밑바닥으로 내려앉다.","체 밑에 가라앉은 찌꺼기를 걷어 냈다."]],1,[]],["관계되다(關係되다)","동사",0,"관계할 관, 맬 계" َلُفُّ"],["어떤 일이나 행동을 하지 않거나 그만두다.","걱정을 말다."]],0,[]],["실시하다(實施하다)","동사",0,"열매 실, 베풀 시",[["실제로 시행하다.","파업에 대한 찬반 투표를 실시하다."]],1,[]],["부정하다(否定하다)","동사",0,"아닐 부, 정할 정",[["그렇지 아니하다고 단정하거나 옳지 아니하다고 반대하다.","신을 부정하다."]],1,[]],["살아가다","동사",0,"",[["목숨을 이어가다.","동물이 살아가다.","يعيش"],["목숨을 이어 가거나 생활을 해 나가다.","막노동으로 하루하루를 살아가다."]],1,[]],["커지다","동사",0,"",[["크게 되다.","규모가 커지다."]],1,[]],["구부러지다","동사",0,"",[["한쪽으로 구붓하게 휘어지다.","구부러진 가지."]],1,[]],["갚다","동사",0,"",[["빌린 것을 도로 돌려주다.","돈을 갚다."]],0,[]],["이해하다(理解하다)","동사",0,"다스릴 이, 풀 해",[["무엇을 깨달아 알다. 또는 잘 알아서 받아들이다.","개념을 이해하다.","يَفْهَمُ"],["깨달아 알다. 또는 잘 알아서 받아들이다.","독자들은 글의 내용을 이해하고 필자의 주장을 정확하게 파악해야 한다."]],1,[]],["분류하다(分類하다)","동사",0,"나눌 분, 무리 류",[["종류에 따라서 가르다.","자료를 세 종류로 분류하다."]],1,[]],["참가하다(參加하다)","동사",0,"참여할 참, 더할 가",[["모임이나 단체 또는 일에 관계하여 들어가다.","행사에 참가하다."]],1,[]],["알아듣다","동사",0,"",[["남의 말을 듣고 그 뜻을 이해하다.","알아듣게 설명하다.","يفهم عن طريق الاستماع"],["남의 말을 듣고 그 뜻을 알다.","말귀를 알아듣다."],["소리를 분간하여 듣다.","발자국 소리를 알아듣다."]],1,[]],["둔하다(鈍하다)","형용사",0,"둔할 둔",[["머리가 나쁘거나 일을 처리하는 능력이 부족하다.","둔한 사람.","غَبِيٌّ"],["기구나 날붙이 따위가 육중하고 무디다.","피해자의 머리에는 둔한 흉기로 얻어맞은 듯한 상처가 보였다."]],1,[]],["끝내다","동사",0,"",[["일을 마지막까지 이루다.","강의를 끝내다."]],0,[]],["맡기다","동사",0,"",[["어떤 일을 책임지고 처리하게 내주다.","맡긴 교육."]],0,[]],["굳세다","형용사",0,"",[["뜻한 바를 굽히지 않고 힘차게 밀고 나아감이 있다.","굳센 의지.","ثَابِت وَحَاسِم"],["힘차고 튼튼하다.","굳센 주먹."],["뜻한 바를 굽히지 않고 밀고 나아가는 힘이 있다.","굳센 의지."]],1,[]],["찌르다","동사",0,"",[["끝이 뾰족하거나 날카로운 것으로 어떤 것의 겉면이 뚫어지거나 쑥 들어가도록 세차게 들이밀다.","엉덩이를 찌르다.","يَطْعَنُ"],["끝이 뾰족하거나 날카로운 것으로 물체의 겉면이 뚫어지거나 쑥 들어가도록 세차게 들이밀다.","주사기를 엉덩이에 찌르다."]],1,[]],["간행되다(刊行되다)","동사",0,"새길 간, 다닐 행",[["책 따위가 인쇄·발행되어 나오다.","수필집이 간행되다."]],1,[]],["도와주다","동사",0,"",[["남을 위하여 애써 주다.","여러 가지로 도와주다."]],1,[]],["길쭉하다","형용사",0,"",[["조금 길다.","그의 다리는 길쭉하니 늘씬하다."]],1,[]],["구별하다(區別하다)","동사",0,"구분할 구, 다를 별",[["성질이나 종류에 따라 갈라놓다.","공과 사를 구별하다."]],1,[]],["편평하다(扁平하다)","형용사",0,"작을 편, 평평할 평",[["넓고 평평하다.","산 정상에 올라 보니 편평한 들판이 나왔다."]],1,[]],["생겨나다","동사",0,"",[["없던 것이 있게 되다.","각 분야에 새로운 직종이 생겨나다."]],1,[]],["따지다","동사",0,"",[["잘못이나 문제가 있는 일을 똑똑히 묻고 분명한 답을 요구하다.","따져 묻다.","يَطْلُبُ جَوَابًا"],["문제가 되는 일을 상대에게 캐묻고 분명한 답을 요구하다.","관계 당국에 사고의 원인을 따지다."],["계산, 득실, 관계 따위를 낱낱이 헤아리다.","비용을 따지다."]],1,[]],["생산하다(生産하다)","동사",0,"날 생, 낳을 산",[["인간이 생활하는 데 필요한 각종 물건을 만들어 내다.","수박을 생산하다."]],1,[]],["험하다(險하다)","형용사",0,"험할 험",[["땅이나 길 등이 다니기 어려울 만큼 사납고 가파르다.","험한 계곡.","مرهِق، وعر، قاسي"],["땅의 형세가 발을 디디기 어려울 만큼 사납고 가파르다.","험한 골짜기."]],1,[]],["특수하다(特殊하다)","형용사",0,"특별할 특, 다를 수",[["특별히 다르다.","방음을 위해 특수하게 만들어진 창문."],["평균 이상으로 뛰어나다.",""]],1,[]],["독특하다(獨特하다)","형용사",0,"홀로 독, 특별할 특",[["특별하게 다르다.","독특한 개성."],["다른 것과 견줄 수 없을 정도로 뛰어나다.","고려자기의 독특한 미."]],1,[]],["합치다(合치다)","동사",0,"합할 합",[["‘합하다’를 강조하여 이르는 말.","결혼한 남동생은 부모님과 합쳐서 살기로 결정했다."]],1,[]],["부서지다","동사",0,"",[["단단한 것이 깨어져 작은 조각들이 되다.","바위가 부서지다.","يَنْكَسِرُ"],["단단한 물체가 깨어져 여러 조각이 나다.","돌이 부서지다."]],1,[]],["진행되다(進行되다)","동사",0,"나아갈 진, 다닐 행",[["앞으로 나아가게 되다.","앞으로 진행되다.","يَجْرِي"],["앞으로 향하여 나아가게 되다.","차가 갑자기 앞으로 진행되었다."]],1,[]],["번갈다(番갈다)","동사",0,"차례 번",[["여럿이 어떤 일을 할 때, 일정한 시간 동안 한 사람씩 차례를 바꾸다.","번갈아 근무하다.","يَتَنَاوَب"],["일정한 시간 동안 한 사람씩 차례를 바꾸다.","콘서트가 시작되자 남자 가수와 여자 가수가 번갈아 나와 노래를 불렀다."]],1,[]],["조용하다","형용사",0,"",[["아무 소리도 들리지 않다.","조용한 교실.","سَاكِن"],["아무런 소리도 들리지 않고 고요하다.","사방이 쥐 죽은 듯이 조용하다."]],1,[]],["칠하다(漆하다)","동사",0,"옻 칠",[["면이 있는 사물에 기름이나 액체, 물감 따위를 바르다.","도화지에 크레용을 칠하다."]],1,[]],["채우다","동사",0,"",[["자물쇠 등으로 잠가서 문이나 서랍 등을 열지 못하게 하다.","방문을 채우다.","يُغلق"],["일정한 공간에 사람, 사물, 냄새 따위를 가득하게 하다. ‘차다01[1]’의 사동사.","빈자리를 채우다."]],1,[]],["증명하다(證明하다)","동사",0,"증거 증, 밝을 명",[["어떤 사건이나 내용이나 판단이 진실인지 아닌지를 증거를 들어서 밝히다.","증명한 사실.","يَثْبُتُ"],["어떤 사항이나 판단 따위에 대하여 그것이 진실인지 아닌지 증거를 들어서 밝히다.","자신의 결백을 증명하다."]],1,[]],["올려놓다","동사",0,"",[["어떤 물건을 무엇의 위쪽에 옮겨다 두다.","그릇을 올려놓다.","يضع على"],["어떤 물건을 무엇의 위에 옮겨 놓다.","큰 그릇들은 찬장에 넣지 못하니 위에 올려놓아라."]],1,[]],["적당하다(適當하다)","형용사",0,"맞을 적, 마땅 당",[["기준, 조건, 정도에 알맞다.","적당한 가격.","مُنَاسِب"],["정도에 알맞다.","주차에 적당한 공간."]],1,[]],["쑤다","동사",0,"",[["곡식의 알이나 가루를 물에 끓여 익혀서 죽이나 메주 따위를 만들다.","죽을 쑤다."]],1,[]],["시원스럽다","형용사",0,"",[["덥지도 춥지도 않고 적당하게 서늘한 듯하다.","시원스러운 공기.","مُعْتَدِل"],["덥거나 춥지 아니하고 알맞게 서늘한 듯하다.","산 정상에 오르자 시원스러운 바람이 불어왔다."]],1,[]],["내보내다","동사",0,"",[["밖이나 다른 곳으로 나가게 하다.","밖으로 내보내다."]],0,[]],["언짢다","형용사",0,"",[["마음에 들지 않거나 좋지 않다.","아버님은 아직도 어제 일이 언짢으신 모양이었다."]],1,[]],["찧다","동사",0,"",[["곡식 등을 빻기 위해 절구에 넣고 공이로 내리치다.","곡식을 찧다.","يَدُقُّ"],["곡식 따위를 잘게 만들려고 절구에 담고 공이로 내리치다.","보리쌀을 찧어서 죽을 쑤다."],["마주 부딪다.","전신주에 이마를 찧다."]],1,[]],["꾀하다","동사",0,"",[["어떤 일을 이루려고 뜻을 두거나 힘을 쓰다.","나라의 발전을 꾀하다."]],1,[]],["낫다","동사",0,"",[["병이나 상처 따위가 고쳐져 본래대로 되다.","병이 씻은 듯이 나았다."]],1,[]],["머무르다","동사",0,"",[["도중에 멈추거나 일시적으로 어떤 곳에 묵다.","버스가 정류장에 머무르다."]],1,[]],["가두다","동사",0,"",[["사람이나 동물을 어떤 장소에 넣고 밖으로 나오지 못하게 하다.","동물을 가두다.","يَحْبِسُ"],["사람이나 동물을 벽으로 둘러싸거나 울타리가 있는 일정한 장소에 넣고 밖으로 나오지 못하게 하다.","송아지를 우리에 가두었다."]],1,[]],["제창하다(齊唱하다)","동사",0,"가지런할 제, 부를 창",[["여러 사람이 다 같이 큰 소리로 외치다.","악을 쓰며 구호를 제창하고 노래를 부르고….≪홍성암, 큰물로 가는 큰 고기≫"]],1,[]],["형성하다(形成하다)","동사",0,"모양 형, 이룰 성",[["어떤 형상을 이루다.","가치관을 형성하다."]],1,[]],["늘어지다","동사",0,"",[["팽팽하게 있지 못하여 아래로 처지다.","가지가 늘어지다.","يَتَدَلَّى"],["물체가 당기는 힘으로 길어지다.","고무줄이 양쪽으로 늘어지다."]],1,[]],["희미하다(稀微하다)","형용사",0,"드물 희, 작을 미",[["분명하지 못하고 어렴풋하다.","희미하게 웃다."]],1,[]],["갈리다","동사",0,"",[["거칠고 맑지 않은 소리가 나다.","목이 갈리다.","يَخْشُنُ الصَّوْت"],["다른 물건에 문질러져 날카롭게 날이 서거나 표면이 매끄러워지다. ‘갈다02「1」’의 피동사.","칼이 잘 갈렸다."],["단단한 물건에 문질러져 잘게 부숴지거나 단단한 물건 사이에 넣어져 으깨지다. ‘갈다02「2」’의 피동사.","고기가 너무 잘게 갈렸다."]],1,[]],["화려하다(華麗하다)","형용사",0,"빛날 화, 고울 려",[["곱고 아름다우며 환하게 빛나 보기에 좋다.","화려한 보석."]],0,[]],["되풀이하다","동사",0,"",[["같은 말이나 일을 자꾸 하다. 또는 같은 사태를 자꾸 일으키다.","종래의 관습을 되풀이하다."]],1,[]],["능하다(能하다)","형용사",0,"능할 능",[["어떤 일 따위에 뛰어나다.","술수에 능하다."]],1,[]],["사고팔다","동사",0,"",[["물건 따위를 사기도 하고 팔기도 하다.","토지를 사고팔다."]],1,[]],["꾸짖다","동사",0,"",[["윗사람이 아랫사람의 잘못에 대하여 엄하게 나무라다.","그는 잘못을 저지른 아이를 호되게 꾸짖었다."]],1,[]],["내려가다","동사",0,"",[["위에서 아래로 가다.","아래로 내려가다.","يَنْزِلُ"],["높은 곳에서 낮은 곳으로 또는 위에서 아래로 가다.","아래층에 내려가다."]],1,[]],["독립하다(獨立하다)","동사",0,"홀로 독, 설 립",[["남에게 의존하거나 매여 있지 않다.","독립하여 생활하다.","يَعْتَمِدُ عَلَى النَّفْس"],["다른 것에 예속하거나 의존하지 아니하는 상태로 되다.","부모에게서 독립하다."]],1,[]],["멀다","형용사",0,"",[["두 곳 사이의 떨어진 거리가 길다.","먼 곳."]],0,[]],["날리다","동사",0,"",[["공중에서 바람을 타고 움직이게 되다.","깃발이 날리다.","يَطِيرُ"],["공중에 띄워서 어떤 위치에서 다른 위치로 움직이게 하다. ‘날다01「1」’의 사동사.","모형 비행기를 옥상에서 공중에 날렸다."]],1,[]],["정리하다(整理하다)","동사",0,"가지런할 정, 다스릴 리",[["흐트러지거나 어수선한 상태에 있는 것을 한곳에 모으거나 치우다.","방을 정리하다.","يُنَظِّمُ"],["흐트러지거나 혼란스러운 상태에 있는 것을 한데 모으거나 치워서 질서 있는 상태가 되게 하다.","방 안을 정리하다."]],1,[]],["너그럽다","형용사",0,"",[["마음이 넓고 아량이 있다.","너그러운 태도."]],1,[]],["원하다(願하다)","동사",0,"원할 원",[["무엇을 바라거나 하고자 하다.","사람들은 누구나 행복을 원한다."]],1,[]],["공경하다(恭敬하다)","동사",0,"공손할 공, 공경 경",[["공손히 받들어 모시다.","어른을 공경하다."]],1,[]],["주되다(主되다)","동사",0,"임금 주",[["주장이나 중심이 되다.","콩심이는 효원의 교전비이니, 효원에게 딸려서 잔심부름을 하는 것이 주된 일이었다.≪최명희, 혼불≫"]],1,[]],["바라보다","동사",0,"",[["바로 향해 보다.","바라보는 방향."]],0,[]],["어기다","동사",0,"",[["규칙, 명령, 약속, 시간 따위를 지키지 아니하고 거스르다.","약속을 어기다."]],1,[]],["넘어지다","동사",0,"",[["서 있던 사람이나 물체가 중심을 잃고 한쪽으로 기울어지며 쓰러지다.","가구가 넘어지다.","يَسْقُط"],["사람이나 물체가 한쪽으로 기울어지며 쓰러지다.","얼음판에 넘어지다."]],1,[]],["미루다","동사",0,"",[["일이나 정해진 때를 나중으로 넘기다.","숙제를 미루다.","يُؤَجِّلُ"],["정한 시간이나 기일을 나중으로 넘기다.","오늘 일을 내일로 미루지 말자."],["이미 알려진 것으로써 다른 것을 비추어 헤아리다.","여러 가지의 일로 미루어 재영이의 신상에 무슨 불길한 일이 생겼음은 분명하였다.≪김동인, 젊은 그들≫"]],1,[]],["문지르다","동사",0,"",[["무엇을 서로 눌러 대고 이리저리 밀거나 비비다.","손을 수건에 문지르다."]],1,[]],["가공하다(加工하다)","동사",0,"더할 가, 장인 공",[["원자재나 반제품을 인공적으로 처리하여 새로운 제품을 만들거나 제품의 질을 높이다.","복숭아를 가공해서 통조림으로 만들었다."]],1,[]],["안다","동사",0,"",[["두 팔을 벌려 가슴 쪽으로 끌어당기거나 품 안에 있게 하다.","갓난아기를 안다.","يُعَانِقُ"],["두 팔을 벌려 가슴 쪽으로 끌어당기거나 그렇게 하여 품 안에 있게 하다.","아기를 품에 안다."]],1,[]],["내세우다","동사",0,"",[["앞으로 나와 서게 하다.","앞에 내세우다.","يَبْرُزُ"],["나와 서게 하다.","반장을 맨 앞줄에 내세웠다."]],1,[]],["번역하다(飜譯하다/翻譯하다)","동사",0,"번역할 번, 번역할 역 / 번역할 번, 번역할 역",[["어떤 언어로 된 글을 다른 언어의 글로 옮기다.","외국어 원서를 국어로 번역하다."]],1,[]],["상하다(傷하다)","동사",0,"다칠 상",[["몸을 다치거나 건강하지 못한 상태가 되다.","눈이 상하다.","يَجْرَحُ"],["물건이 깨어지거나 헐다.","그릇들이 상하지 않게 조심스레 다루다."]],1,[]],["때가다","동사",0,"",[["(속되게) 죄지은 사람이 잡혀가다.","이놈아, 가짜 형사 행세를 하고도 안 때갈 줄 아니?"]],1,[]],["다양하다(多樣하다)","형용사",0,"많을 다, 모양 양",[["모양, 빛깔, 형태, 양식 따위가 여러 가지로 많다.","다양한 색깔."]],1,[]],["여리다","형용사",0,"",[["단단하거나 질기지 않아 부드럽거나 약하다.","살갗이 여리다."]],1,[]],["둘러싸이다","동사",0,"",[["전체가 감겨 싸이다.","비닐로 둘러싸이다.","يُحَاطُ"],["둘리어 감싸지다. ‘둘러싸다[1]’의 피동사.","포대기에 둘러싸인 아기."]],1,[]],["빌려주다","동사",0,"",[["물건이나 돈 등을 나중에 돌려받거나 대가를 받기로 하고 얼마 동안 쓰게 하다.","돈을 빌려주다.","يُقْرِضُ، يُعِيرُ"],["물건이나 돈을 나중에 도로 돌려받거나 대가를 받기로 하고 얼마 동안 내어주다.","안 입는 한복 있으면 하루만 나한테 빌려줄래?"]],1,[]],["잘나다","동사",0,"",[["외모가 예쁘거나 잘생기다.","잘난 얼굴."],["똑똑하고 뛰어나다.","잘난 친구."]],0,[]],["현존하다(現存하다)","동사",0,"나타날 현, 있을 존",[["현재 살아 있다.","현존하는 식물.","يُوجَد"],["현재에 있다.","현존하는 문화유산."]],1,[]],["오목하다","형용사",0,"",[["가운데가 동그스름하게 폭 패거나 들어가 있는 상태이다.","바람막이가 잘된 오목한 공지에는 늙수그레한 이발사가 간이 의자를 놓고 아이들의 머리를 깎아 주고 있었다.≪김원일, 불의 제전≫"]],1,[]],["깔다","동사",0,"",[["바닥에 펴 놓다.","담요를 깔다."]],0,[]],["이동하다(移動하다)","동사",0,"옮길 이, 움직일 동",[["움직여 옮기다. 또는 움직여 자리를 바꾸다.","마을 사람들은 회관으로 이동하였다."]],1,[]],["인쇄하다(印刷하다)","동사",0,"도장 인, 인쇄할 쇄",[["잉크를 사용하여 판면(版面)에 그려져 있는 글이나 그림 따위를 종이, 천 따위에 박아 내다.","책을 인쇄하다."]],1,[]],["참되다","형용사",0,"",[["진실하고 올바르다.","인간은 잘살기보다 참되게 살기가 더 어렵다."]],1,[]],["처지다","동사",0,"",[["위에서 아래로 늘어지다.","처진 가슴.","يَتَدَلَّى"],["위에서 아래로 축 늘어지다.","빨랫줄이 아래로 처져 있다."]],1,[]],["쓰러지다","동사",0,"",[["서 있던 것이 한쪽으로 쏠리어 넘어지다.","건물이 쓰러지다.","يَسْقُط"],["힘이 빠지거나 외부의 힘에 의하여 서 있던 상태에서 바닥에 눕는 상태가 되다.","술 취한 행인이 길에 쓰러졌다."]],1,[]],["거처하다(居處하다)","동사",0,"살 거, 곳 처",[["일정하게 자리를 잡고 살다.","그들은 비록 다섯 식구가 한 방에 거처할망정 오붓하게 지내고 있었다."]],1,[]],["들뜨다","동사",0,"",[["마음이나 분위기가 안정되지 않고 조금 흥분되다.","들뜨는 기분.","يَتَأَثَّرُ"],["단단한 데에 붙은 얇은 것이 떨어져 틈이 벌어지며 일어나다.","장판이 들뜨다."]],1,[]],["날아가다","동사",0,"",[["공중으로 날면서 가다.","그는 비행기로 고향에 날아가서 부모님께 모든 잘못을 빌기로 했다."]],1,[]],["요구하다(要求하다)","동사",0,"요긴할 요, 구할 구",[["받아야 할 것을 필요에 의하여 달라고 청하다.","부모에게 돈을 요구하다."]],1,[]],["부풀다","동사",0,"",[["종이나 헝겊의 겉에 부풀이 일어나다.","부푼 소매.","يَنْفُخ الْهَوَاء"],["물체가 늘어나면서 부피가 커지다.","순풍에 부푼 돛."]],1,[]],["형성되다(形成되다)","동사",0,"모양 형, 이룰 성",[["어떤 형상이 이루어지다.","도시가 형성되다."]],1,[]],["덧붙이다","동사",0,"",[["붙은 것 위에 겹쳐 붙이다. ‘덧붙다「1」’의 사동사.","제품에 설명서를 덧붙이다."]],1,[]],["검사하다(檢査하다)","동사",0,"검사할 검, 조사할 사",[["사실이나 일의 상태 또는 물질의 구성 성분 따위를 조사하여 옳고 그름과 낫고 못함을 판단하다.","시력을 검사하다."]],1,[]],["무겁다","형용사",0,"",[["무게가 많이 나가다.","무거운 가방.","ثَقِيل"],["무게가 나가는 정도가 크다.","무거운 짐."]],1,[]],["완성하다(完成하다)","동사",0,"완전할 완, 이룰 성",[["완전히 다 이루다.","보고서를 완성하다."]],1,[]],["풀리다","동사",0,"",[["묶이거나 감기거나 얽히거나 합쳐지거나 싸인 것 등이 도로 원래의 상태가 되다.","결박이 풀리다.","ينحلّ"],["묶이거나 감기거나 얽히거나 합쳐진 것 따위가 그렇지 아니한 상태로 되다. ‘풀다[1]「1」’의 피동사.","매듭이 풀리다."]],1,[]],["버티다","동사",0,"",[["오래 참고 견디다.","버티는 능력.","يَتَحَمَّلُ"],["어려운 일이나 외부의 압력을 참고 견디다.","그는 갖은 악조건에도 불구하고 오지에서 한 달 동안 버텨 냈다."],["쓰러지지 않거나 밀리지 않으려고 팔, 다리 따위로 몸을 지탱하다.","은주는 바람과 싸우며 뒤로 불려 가려는 몸을 억지로 버티고 한 걸음 두 걸음 내어 디디었다.≪현진건, 적도≫"]],1,[]],["저장하다(貯藏하다)","동사",0,"쌓을 저, 감출 장",[["물건이나 재화 따위를 모아서 간수하다.","냉장고에 식료품을 저장하다."]],1,[]],["늘어나다","동사",0,"",[["부피나 수량이나 정도가 원래보다 점점 커지거나 많아지다.","늘어난 개수.","يَزْدَادُ"],["부피나 분량 따위가 본디보다 커지거나 길어지거나 많아지다.","고무줄이 늘어나다."]],1,[]],["거느리다","동사",0,"",[["돌봐야 할 새끼 또는 가족이나 손아랫사람을 데리고 지내다.","가족을 거느리다.","يُعِيلُ"],["부양해야 할 손아랫사람을 데리고 있다.","식솔을 거느리다."]],1,[]],["발견되다(發見되다)","동사",0,"필 발, 볼 견",[["미처 찾아내지 못하였거나 아직 알려지지 아니한 사물이나 현상, 사실 따위가 찾아내지다.","신석기 시대의 유적은 특히 큰 강가나 바닷가에서 고고학자들에게 많이 발견되고 있다."]],1,[]],["계속되다(繼續되다)","동사",0,"이을 계, 이을 속",[["끊이지 않고 이어져 나가다.","계속되는 가뭄."]],1,[]],["청하다(請하다)","동사",0,"청할 청",[["어떤 일을 해 달라고 부탁하다.","노래를 청하다.","يلتمس، يطلب، يتوسّل"],["어떤 일을 이루기 위하여 남에게 부탁을 하다.","친구에게 도움을 청하다."]],1,[]],["해치다(害치다)","동사",0,"해할 해",[["어떤 상태에 손상을 입혀 망가지게 하다.","공익을 해치다."]],1,[]],["당기다","동사",0,"",[["관심이 쏠리거나 마음이 끌리다.","당기는 마음.","يُجْتَذَبُ"],["무엇을 잡아 자기 쪽으로 가까이 오게 하다.","의자를 당겨 앉다."]],0,[]],["섬기다","동사",0,"",[["윗사람을 따르고 받들어 모시다.","부모를 섬기다."]],0,[]],["뚫리다","동사",0,"",[["구멍이 생기다.","바람구멍이 뚫리다.","يُثْقَبُ"],["구멍이 나다. ‘뚫다[1]’의 피동사.","벽에 구멍이 뚫리다."]],1,[]],["확립하다(確立하다)","동사",0,"굳을 확, 설 립",[["체계나 견해, 조직 따위를 굳게 서게 하다.","교통질서를 확립하다."]],1,[]],["네모지다","형용사",0,"",[["모양이 네모꼴로 이루어져 있다.","네모진 벽돌."]],1,[]],["생활하다(生活하다)","동사",0,"날 생, 살 활",[["사람이나 동물이 일정한 곳에서 살아가다.","농촌에서 생활하다.","يَسْكُنُ"],["사람이나 동물이 일정한 환경에서 활동하며 살아가다.","그 사람들은 도시에서 생활한다."]],1,[]],["뽑아내다","동사",0,"",[["박히거나 꽂혀 있는 것을 잡아당겨 밖으로 나오게 하다.","잡초를 뽑아내다.","يُقْلِع"],["박힌 것을 잡아당기어 밖으로 뽑다.","벽에서 못을 뽑아내다."]],1,[]],["다치다","동사",0,"",[["부딪치거나 맞거나 하여 몸이나 몸의 일부에 상처가 생기다. 또는 상처가 생기게 하다.","다친 부위.","يَنْجَرِحُ"],["부딪치거나 맞거나 하여 신체에 상처가 생기다. 또는 상처를 입다.","사고로 많은 사람들이 다쳤다."],["남의 마음이나 체면, 명예에 손상을 입히다.","그는 마치 여인의 그 가지런한 분위기를 다치지 않으려는 듯 조심스럽게 몸을 부스럭거리기 시작했다.≪이청준, 이어도≫"]],1,[]],["싫다","형용사",0,"",[["마음에 들지 않다.","싫은 사람."]],0,[]],["해결하다(解決하다)","동사",0,"풀 해, 결단할 결",[["제기된 문제를 해명하거나 얽힌 일을 잘 처리하다.","문제를 해결하다."]],1,[]],["자질구레하다","형용사",0,"",[["모두가 잘고 시시하여 대수롭지 아니하다.","자질구레한 걱정."]],1,[]],["의논하다(議論▽하다)","동사",0,"의논할 의, 논할 론",[["어떤 일에 대하여 서로 의견을 주고받다.","부모님과 진학 문제를 의논했다."]],1,[]],["떨치다","동사",0,"",[["이름이나 영향력을 널리 미치거나 알리다.","명성을 떨치다.","يُشَهِّرُ بِـ"],["세게 흔들어서 떨어지게 하다.","소매를 떨치고 일어서다."]],1,[]],["위치하다(位置하다)","동사",0,"자리 위, 둘 치",[["일정한 곳에 자리를 차지하다.","그 건물은 시내 중심가에 위치하고 있다."]],1,[]],["굼뜨다","형용사",0,"",[["동작, 진행 과정 따위가 답답할 만큼 매우 느리다.","살이 많이 쪄서 동작이 굼뜨다."]],1,[]],["비교하다(比較하다)","동사",0,"견줄 비, 견줄 교",[["둘 이상의 사물을 견주어 서로 간의 유사점, 차이점, 일반 법칙 따위를 고찰하다.","아이의 성적을 더 잘하는 아이에 비교하여 잔소리하지 말아야 한다."]],1,[]],["드물다","형용사",0,"",[["일어나는 횟수가 많지 않다.","드문 일.","نَادِر"],["공간의 사이가 좁지 아니하고 어느 정도 떨어져 있다.","이 식물은 드물게 심어야 잘 자란다."],["흔하지 아니하다.","보기 드문 절세미인."]],1,[]],["늘어놓다","동사",0,"",[["물건 등을 줄지어 벌여 놓다.","늘어놓은 모양.","يَعْرِض"],["줄을 지어 벌여 놓다.","김 씨는 좌판에 여러 가지 물건을 늘어놓고 판다."],["여기저기에 어수선하게 두다.","그는 책상 위에 책을 늘어놓았다."]],1,[]],["칭찬하다(稱讚하다)","동사",0,"일컬을 칭, 기릴 찬",[["좋은 점이나 착하고 훌륭한 일을 높이 평가하다.","음식 솜씨를 예술이라고 칭찬하다."]],1,[]],["지휘하다(指揮하다/指麾하다)","동사",0,"가리킬 지, 휘두를 휘 / 가리킬 지, 기 휘",[["목적을 효과적으로 이루기 위하여 단체의 행동을 통솔하다.","장군은 진두에서 군사를 지휘하다 적의 유탄에 맞고 전사했다."]],1,[]],["보관하다(保管하다)","동사",0,"지킬 보, 대롱 관",[["물건을 맡아서 간직하고 관리하다.","사진을 앨범에 보관하다."]],1,[]],["편하다(便하다)","형용사",0,"편할 편",[["몸이나 마음이 괴롭지 않고 좋다.","편하게 놀다.","مُرِيح"],["몸이나 마음이 거북하거나 괴롭지 아니하여 좋다.","나는 요즘 몸과 마음이 모두 편하다."],["쉽고 편리하다.","막 신는 데는 이 신발이 편하다."]],1,[]],["감추다","동사",0,"",[["보거나 찾지 못하도록 가리거나 숨기다.","눈물을 감추다.","يُخَبِّئُ"],["남이 보거나 찾아내지 못하도록 가리거나 숨기다.","신발을 가방 속에 감추다."]],1,[]],["물리다","동사",0,"",[["다시 대하기 싫을 만큼 매우 싫증이 나다.","단것에 물리다.","يَسْأَمُ"],["사거나 바꾼 물건을 원래 임자에게 도로 주고 돈이나 물건을 되찾게 하다. ‘무르다02[1]「1」’의 사동사.","친구는 새로 구입한 책을 모두 물렸다."],["정해진 시기를 뒤로 늦추다.","약속 날짜를 이틀 뒤로 물리다."]],1,[]],["입히다","동사",0,"",[["사람이나 동물에게 옷을 걸치거나 몸에 두르게 하다.","바지를 입히다.",""],["옷을 몸에 꿰게 하거나 두르게 하다. ‘입다「1」’의 사동사.","엄마가 아이에게 옷을 입혔다."],["받거나 당하게 하다. ‘입다「2」’의 사동사.","그 사고는 인명과 재산에 막대한 손실을 입혔다."]],1,[]],["드리다","동사",0,"",[["(높임말로) 주다. 무엇을 다른 사람에게 건네어 가지게 하거나 사용하게 하다.","선물을 드리다.","يُعْطِي، يُأَثّرُ"],["‘주다01[Ⅰ]「1」’의 높임말.","아버님께 용돈을 드리다."],["여러 가닥의 실이나 끈을 하나로 땋거나 꼬다.","짚에다가 삼노를 드려 든든한 밧줄을 꼬다."]],1,[]],["바쁘다","형용사",0,"",[["할 일이 많거나 시간이 없어서 다른 것을 할 여유가 없다.","바쁜 생활.","مَشْغُول"],["일이 많거나 또는 서둘러서 해야 할 일로 인하여 딴 겨를이 없다.","눈코 뜰 새 없이 바쁘다."],["몹시 급하다.","뒷집에 사는 노인이 고의춤을 잔뜩 움켜잡고 바쁘게 걸어 내려온다."]],1,[]],["숨기다","동사",0,"",[["무엇을 다른 사람의 눈에 보이지 않게 하다.","숨기는 행동.","يُخَبِّئُ"],["감추어 보이지 않게 하다. ‘숨다「1」’의 사동사.","나무꾼은 토끼를 나뭇단 속에다 숨겨 주었다."]],1,[]],["담당하다(擔當하다)","동사",0,"멜 담, 마땅 당",[["어떤 일을 맡다.","안내를 담당하다."]],1,[]],["확인하다(確認하다)","동사",0,"굳을 확, 알 인",[["틀림없이 그러한가를 알아보거나 인정하다.","사실 여부를 확인해 보다."]],1,[]],["귀중하다(貴重하다)","형용사",0,"귀할 귀, 무거울 중",[["귀하고 중요하다.","일을 하는 데는 무엇보다 인화(人和)가 귀중하다."]],1,[]],["지급하다(支給하다)","동사",0,"지탱할 지, 줄 급",[["돈이나 물품 따위를 정하여진 몫만큼 내주다.","노동자들에게 수당을 지급하다."]],1,[]],["꺼리다","동사",0,"",[["자신에게 피해가 생길까 하여 어떤 일이나 사물을 싫어하거나 피하다.","가르쳐 주기를 꺼리다.","يَتَجَنَّبُ"],["사물이나 일 따위가 자신에게 해가 될까 하여 피하거나 싫어하다.","남 앞에 나서서 말하는 것을 꺼리다."]],1,[]],["옅다","형용사",0,"",[["물의 겉면이 밑바닥에 가깝다.","옅은 강.","ضحل"],["수면이 밑바닥에 가깝다.","그 갯벌밭에는 발등을 겨우 묻을 정도로 옅은 바닷물이 괴어 있었다.≪한승원, 해일≫"],["빛깔이 보통의 정도보다 흐릿하다.","옅은 분홍."]],1,[]],["못되다","형용사",0,"",[["성질이나 하는 행동이 도덕적으로 나쁘다.","못된 녀석.","سَيِّء"],["성질이나 품행 따위가 좋지 않거나 고약하다.","못된 심보."],["일이 뜻대로 되지 않은 상태에 있다.","그 일이 못된 게 남의 탓이겠어."]],1,[]],["긋다","동사",0,"",[["금이나 줄을 그리다.","금을 긋다.","يَحُكُّ"],["어떤 일정한 부분을 강조하거나 나타내기 위하여 금이나 줄을 그리다.","바닥에 금을 긋다."]],1,[]],["대접하다(待接하다)","동사",0,"기다릴 대, 이을 접",[["상대방이 마땅히 받아야 할 만한 예로 대하다.","귀빈으로 대접하다.","يُعَامِلُ"],["마땅한 예로써 대하다.","상대편을 손님으로 대접하다."]],1,[]],["돋다","동사",0,"",[["해, 달, 별 등이 하늘에 솟아오르다.","별이 돋다.","يَبْزُغُ"],["속에 생긴 것이 겉으로 나오거나 나타나다.","나뭇가지에 싹이 돋다."]],1,[]],["빽빽하다","형용사",0,"",[["사이가 촘촘하다.","전철 안에는 사람이 발 디딜 틈
