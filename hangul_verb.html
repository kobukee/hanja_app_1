 간에 붙었다 쓸개에 붙었다 한다."]],1,[]],["낮잡다","동사",0,"",[["실제 가격이나 가치보다 낮게 치다.","낮잡아 보다.","يَبْخَس"],["실제로 지닌 값보다 낮게 치다.","물건값을 낮잡아 부르다."]],1,[]],["어떻다","형용사",0,"",[["의견, 성질, 형편, 상태 따위가 어찌 되어 있다.","요즈음 어떻게 지내십니까?"]],1,[]],["짜내다","동사",0,"",[["액체나 물질 등이 들어 있는 물건을 누르거나 비틀어서 속에 든 것이 밖으로 나오게 하다.","짜낸 고름.","يعصر"],["액체나 물질 따위가 들어 있는 물건을 누르거나 비틀어서 내용물이 밖으로 나오게 하다.","우유를 짜내다."]],1,[]],["쏠리다","동사",0,"",[["무엇이 기울어져 한쪽으로 몰리다.","몸이 쏠리다.","يَمِيلُ"],["물체가 기울어져 한쪽으로 몰리다.","버스가 급정거하자 사람들이 와락 앞으로 쏠려 넘어졌다."]],1,[]],["시원하다","형용사",0,"",[["덥지도 춥지도 않고 적당하게 서늘하다.","시원한 날씨.","بارد ، منعش"],["덥거나 춥지 아니하고 알맞게 서늘하다.","시원한 바람."]],1,[]],["머물다","동사",0,"",[["도중에 멈추거나 일시적으로 어떤 곳에 묵다.","머물 예정.","يَنْزِلُ"],["‘머무르다「1」’의 준말.","그는 쫓기는 몸이라 한곳에 오래 머물 수 없었다."],["‘머무르다「2」’의 준말.","준우승에 머물다."]],1,[]],["버무리다","동사",0,"",[["여러 가지를 한데에 뒤섞다.","홍어를 초고추장에 버무려 먹다."]],1,[]],["발명하다(發明하다)","동사",0,"필 발, 밝을 명",[["아직까지 없던 기술이나 물건을 새로 생각하여 만들어 내다.","새로운 기계를 발명하다."]],1,[]],["산뜻하다","형용사",0,"",[["기분이나 느낌 등이 깨끗하고 시원하다.","산뜻한 느낌.","مُنْعِش"],["기분이나 느낌이 깨끗하고 시원하다. ‘산듯하다「1」’보다 센 느낌을 준다.","기분이 산뜻하다."],["보기에 시원스럽고 말쑥하다. ‘산듯하다「2」’보다 센 느낌을 준다.","산뜻한 차림새."]],1,[]],["높아지다","동사",0,"",[["위에서 아래까지의 길이가 길게 되다.","높이가 높아지다.","يَرْتَفِعُ"],["이전보다 더 높은 정도나 수준, 지위에 이르다.","가능성이 높아지다."]],0,[]],["묘사하다(描寫하다)","동사",0,"그릴 묘, 베낄 사",[["어떤 대상이나 사물, 현상 따위를 언어로 서술하거나 그림을 그려서 표현하다.","성격을 잘 묘사한 작품."]],1,[]],["결정되다(決定되다)","동사",0,"결단할 결, 정할 정",[["행동이나 태도가 분명하게 정해지다.","한국인이 결승전 경기의 주심으로 결정됐다."]],1,[]],["얽다","동사",0,"",[["얼굴에 움푹 파인 자국이 생기다.","얽은 자국.","يُجدَر"],["물건의 거죽에 우묵우묵한 흠이 많이 나다.","철이의 책상은 칼로 파고 망치로 두들겨서 심하게 얽었다."],["노끈이나 줄 따위로 이리저리 걸다.","그가 사는 곳은 판자를 얽어서 만든 초라한 집이었다."]],1,[]],["야무지다","형용사",0,"",[["사람의 성질이나 행동, 생김새 따위가 빈틈이 없이 꽤 단단하고 굳세다.","고 녀석 참 야무지게 생겼군."]],1,[]],["매달리다","동사",0,"",[["줄이나 실, 끈 등에 의해 어떤 곳에 달려 있게 되다.","매달린 등불.","يَتَدَلَّى"],["줄이나 끈, 실 따위에 잡아매여서 달리다. ‘매달다[1]「1」’의 피동사.","처마 끝에 매달린 등불이 바람에 흔들린다."]],1,[]],["뽑히다","동사",0,"",[["박혀 있던 것이 잡아당겨져 밖으로 빼내지다.","머리카락이 뽑히다.","يَنْسَحِبُ"],["박힌 것이 잡아당겨져 빼내지다. ‘뽑다[1]「1」’의 피동사.","벽에서 못이 뽑히다."]],1,[]],["누리다","형용사",0,"",[["짐승의 고기에서 나는 기름기 냄새나, 고기 또는 털 따위의 단백질이 타는 것처럼 냄새가 역겹다.","다른 고기보다 양고기를 구울 때, 특히 누린 냄새가 많이 난다."]],1,[]],["고정하다(固定하다)","동사",0,"굳을 고, 정할 정",[["한번 정한 내용을 변경하지 않다.","모임을 고정하다.","يَثْبُتُ"],["한곳에 꼭 붙어 있거나 붙어 있게 하다.","시선을 고정하다."]],1,[]],["잘못하다","동사",0,"",[["틀리거나 바르지 않게 하다.","잘못한 까닭.","يُخْطِئ"],["틀리거나 그릇되게 하다.","셈을 잘못하여 손해를 보다."]],1,[]],["담기다","동사",0,"",[["어떤 물건이 그릇 등에 넣어지다.","과일이 담기다.","يُوضَعُ"],["어떤 물건이 그릇 따위에 넣어지다. ‘담다「1」’의 피동사.","흙이 화분에 담기다."],["액체 속에 넣어지다. ‘담그다「1」’의 피동사.","시냇물에 담긴 발끝부터 시원한 기운이 올라왔다."]],1,[]],["꺾다","동사",0,"",[["물체를 구부려 펴지지 않게 하거나 부러뜨리다.","갈대를 꺾다.","يَقْطَعُ"],["길고 탄력이 있거나 단단한 물체를 구부려 다시 펴지지 않게 하거나 아주 끊어지게 하다.","꽃을 꺾다."]],1,[]],["제정하다(制定하다)","동사",0,"절제할 제, 정할 정",[["제도나 법률 따위를 만들어서 정하다.","특별법을 제정하다."]],1,[]],["평가하다(評價하다)","동사",0,"평할 평, 값 가",[["어떤 대상의 가치나 수준 따위를 헤아려 정하다.","실력을 우수한 것으로 평가하다."]],1,[]],["교묘하다(巧妙하다)","형용사",0,"공교할 교, 묘할 묘",[["어떤 일을 하는 방법이나 꾀가 아주 뛰어나고 빠르다.","교묘한 거짓말.","لَبِق"],["솜씨나 재주 따위가 재치 있게 약삭빠르고 묘하다.","교묘한 반칙."],["짜임새나 생김새 따위가 아기자기하게 묘하다.","교묘한 공예품."]],1,[]],["위험하다(危險하다)","형용사",0,"위태할 위, 험할 험",[["해로움이나 손실이 생길 우려가 있다.","신변이 위험하다."]],1,[]],["떨리다","동사",0,"",[["몸이나 몸의 일부가 반복해서 빠르게 흔들리다.","가슴이 떨리다.","يَهْتَزُّ"],["몹시 추워지거나 두려워지다. ‘떨다01[1]「3」’의 피동사.","감기로 몸이 떨리다."],["목청 따위의 울림이 심해지다. ‘떨다01[2]「2」’의 피동사.","떨리는 목소리로 노래했다."]],1,[]],["임명하다(任命하다)","동사",0,"맡길 임, 목숨 명",[["일정한 지위나 임무를 남에게 맡기다.","그는 아들을 사장에 임명하였다."]],1,[]],["조심하다(操心하다)","동사",0,"잡을 조, 마음 심",[["잘못이나 실수가 없도록 말이나 행동에 마음을 쓰다.","건강에 조심하다."]],1,[]],["토하다(吐하다)","동사",0,"토할 토",[["먹은 것을 도로 입 밖으로 쏟아 내다.","먹은 것을 토하다.","يَتَقَيَّأُ"],["먹은 것을 삭이지 못하고 도로 입 밖으로 내어놓다.","젖을 토하다."]],1,[]],["떠돌아다니다","동사",0,"",[["정한 곳 없이 이곳저곳을 옮겨 다니다.","여기저기를 떠돌아다니다.","يَتَرَحَّلُ"],["정처 없이 이곳저곳을 옮겨 다니다.","전국 방방곡곡을 떠돌아다니다."]],1,[]],["반대되다(反對되다)","동사",0,"돌이킬 반, 대할 대",[["어떤 것이 다른 것과 모양, 위치, 방향, 속성 등에서 완전히 다르게 되다.","반대되는 길.","يَعْكِسُ"],["두 사물이 모양, 위치, 방향, 순서 따위에서 등지거나 서로 맞서게 되다.","의정부에서 내린 둘이는 역 쪽과 반대되는 방향으로 거리를 벗어났다.≪황순원, 일월≫"]],1,[]],["외다","동사",0,"",[["말이나 글을 머릿속에 기억하다.","외다시피 하다.","يَحْفَظُ"],["같은 말을 되풀이하다.",""],["피하여 자리를 조금 옆으로 옮기다.",""]],1,[]],["창시하다(創始하다)","동사",0,"비롯할 창, 비로소 시",[["어떤 사상이나 학설 따위를 처음으로 시작하거나 내세우다.","특사로 일 년 만에 귀양이 풀린 나인영은 나철이라 개명하고 대종교를 창시하여 학도를 모았다.≪현기영, 변방에 우짖는 새≫"]],1,[]],["지저분하다","형용사",0,"",[["어떤 곳이 정리되어 있지 않아서 어수선하다.","지저분한 방.","وَسَخ"],["정돈이 되어 있지 아니하고 어수선하다.","지저분한 교실."],["보기 싫게 더럽다.","때가 껴 지저분한 옷."]],1,[]],["만하다","형용사",0,"",[["앞말이 나타내는 행동을 할 가치가 있음을 나타내는 말.","가 볼 만한 곳.","مُسْتَحِقّ"],["어떤 대상이 앞말이 뜻하는 행동을 할 타당한 이유를 가질 정도로 가치가 있음을 나타내는 말.","가 볼 만한 장소."],["앞말이 뜻하는 행동을 하는 것이 가능함을 나타내는 말.","그는 차를 살 만한 형편이 못 된다."]],1,[]],["빼앗기다","동사",0,"",[["가진 것이 강제로 없어지거나 다른 사람의 것으로 되다.","가방을 빼앗기다.","يَنْسَلَبُ"],["가진 것을 억지로 남에게 잃게 되다. ‘빼앗다[1]「1」’의 피동사.","불량배에게 돈을 빼앗기다."]],1,[]],["지도하다(指導하다)","동사",0,"가리킬 지, 인도할 도",[["어떤 목적이나 방향으로 남을 가르쳐 이끌다.","당원을 지도하다."]],1,[]],["접다","동사",0,"",[["천이나 종이 등을 꺾어서 겹치게 하다.","빨래를 접다.","يَطْوِي"],["천이나 종이 따위를 꺾어서 겹치다.","신문을 접다."]],1,[]],["보살피다","동사",0,"",[["정성껏 보호하며 돕다.","강아지를 보살피다.","يَعْتَنِي"],["정성을 기울여 보호하며 돕다.","환자를 보살피다."]],1,[]],["이름나다","동사",0,"",[["세상에 평판이나 명성이 널리 알려지다.","이름난 가수."]],1,[]],["서술하다(敍述하다)","동사",0,"펼 서, 펼 술",[["사건이나 생각 따위를 차례대로 말하거나 적다.","역사를 서술하다."]],1,[]],["매끄럽다","형용사",0,"",[["저절로 밀려 나갈 정도로 거친 데가 없이 보드랍다.","매끄러운 감촉.","نَاعِم"],["거침없이 저절로 밀리어 나갈 정도로 반드럽다.","매끄러운 감촉."]],1,[]],["기념하다(紀念하다/記念하다)","동사",0,"벼리 기, 생각 념 / 기록할 기, 생각 념",[["어떤 뜻깊은 일이나 훌륭한 인물 등을 오래도록 잊지 아니하고 마음에 간직하다.","3·1절을 기념하다."]],1,[]],["부수다","동사",0,"",[["단단한 물체를 두드려 여러 조각이 나게 깨뜨리다.","부숴 먹다.","يَكْسِرُ"],["단단한 물체를 여러 조각이 나게 두드려 깨뜨리다.","돌을 잘게 부수다."]],1,[]],["쑤시다","동사",0,"",[["몸이 바늘로 찌르는 것처럼 아프다.","골이 쑤시다.","يتألّم"],["가늘고 긴 꼬챙이 같은 것으로 다른 물체의 틈이나 구멍에 넣어 구멍을 뚫거나 속에 있는 물건을 밖으로 나오게 하다.","이를 쑤시다."]],1,[]],["두렵다","형용사",0,"",[["몹시 피하고 싶을 만큼 겁이 나고 무섭다.","두려운 존재.","مُخِيف"],["어떤 대상을 무서워하여 마음이 불안하다.","나는 그 여자가 두렵다."]],1,[]],["슬퍼하다","동사",0,"",[["마음에 슬픔을 느끼다.","너무 슬퍼하지 마. 내가 옆에 있잖아."]],1,[]],["실패하다(失敗하다)","동사",0,"잃을 실, 패할 패",[["일을 잘못하여 뜻한 대로 되지 않거나 망치다.","실패한 시도.","يَفْشَلُ"],["일을 잘못하여 뜻한 대로 되지 아니하거나 그르치다.","아버지 사업이 실패했다."]],1,[]],["지배하다(支配하다)","동사",0,"지탱할 지, 나눌 배",[["어떤 사람이나 집단을 자신의 뜻대로 복종하게 하여 다스리거나 차지하다.","지배한 민족.","يَحْكُمُ"],["어떤 사람이나 집단, 조직, 사물 등을 자기의 의사대로 복종하게 하여 다스리다.","무력으로 약소민족을 지배하다."]],1,[]],["장식하다(裝飾하다)","동사",0,"꾸밀 장, 꾸밀 식",[["아름답게 꾸미다.","장식한 옷장.","يزخرف"],["액세서리 따위로 치장하다.","대문을 꽃으로 장식하다."]],1,[]],["빻다","동사",0,"",[["물기가 없는 것을 짓찧어서 가루로 만들다.","고추를 빻다."]],1,[]],["맞서다","동사",0,"",[["서로 마주 보고 서다.","맞선 두 사람.","يَتَصَدَّى لِ"],["서로 마주 서다.","원수와 맞서다."]],1,[]],["침입하다(侵入하다)","동사",0,"침노할 침, 들 입",[["침범하여 들어가거나 들어오다.","경찰이 빈집에 침입하려던 도둑을 잡았다."]],1,[]],["처하다(處하다)","동사",0,"곳 처",[["어떤 형편이나 처지에 놓이다.","멸종 위기에 처한 야생 동물."]],1,[]],["깨어지다","동사",0,"",[["단단한 물건이 여러 조각이 나다.","유리가 깨어지다."]],1,[]],["떼다","동사",0,"",[["붙어 있거나 이어져 있는 것을 떨어지게 하다.","혹을 떼다.","يَنْزِعُ،يَفْصِلُ"],["붙어 있거나 잇닿은 것을 떨어지게 하다.","벽에서 벽보를 떼다."]],1,[]],["뻣뻣하다","형용사",0,"",[["어떤 물체가 부드럽지 않고 굳고 단단하다.","뻣뻣하게 경직되다.","صُلْب"],["물체가 굳고 꿋꿋하다.","빨래가 얼어서 뻣뻣하다."]],1,[]],["비뚤어지다","동사",0,"",[["모양이나 방향, 위치가 곧거나 바르지 않고 한쪽으로 기울어지거나 쏠리다.","글씨가 비뚤어지다.","يَنْحَرِفُ"],["바르지 아니하고 한쪽으로 기울어지거나 쏠리다.","줄이 비뚤어지다."]],1,[]],["데치다","동사",0,"",[["물에 넣어 살짝 익히다.","미나리를 데치다."]],1,[]],["줄다","동사",0,"",[["물체의 길이나 넓이, 부피 등이 원래보다 작아지다.","길이가 줄다.","ينكمش"],["물체의 길이나 넓이, 부피 따위가 본디보다 작아지다.","소매 길이가 줄다."]],1,[]],["날다","동사",0,"",[["공중에 뜬 상태로 어떤 위치에서 다른 위치로 움직이다.","눈송이가 날다.","يَطِيرُ"],["공중에 떠서 어떤 위치에서 다른 위치로 움직이다.","하늘에 기러기가 무리를 지어 난다."]],1,[]],["시들다","동사",0,"",[["꽃이나 풀 같은 식물이 물기가 말라 원래의 색이나 모양을 잃다.","시든 나뭇잎.","يَذْبُلُ"],["꽃이나 풀 따위가 말라 생기가 없어지다.","꽃이 시들다."]],1,[]],["타고나다","동사",0,"",[["어떤 성품이나 능력, 운명 따위를 선천적으로 가지고 태어나다.","타고난 재능."]],1,[]],["스며들다","동사",0,"",[["빛이나 기체, 액체 등이 틈새로 들어오거나 배어들어 퍼지다.","스며든 먹물."]],0,[]],["예쁘다","형용사",0,"",[["생긴 모양이 눈으로 보기에 좋을 만큼 아름답다.","예쁜 여자.","جَمِيل"],["생긴 모양이 아름다워 눈으로 보기에 좋다.","예쁜 여자."]],1,[]],["주무르다","동사",0,"",[["손으로 어떤 물건이나 몸을 쥐었다 놓았다 하면서 자꾸 만지다.","다리를 주무르다.","يَلْتَمِسُ"],["손으로 어떤 물건이나 몸뚱이 따위를 쥐었다 놓았다 하면서 자꾸 만지다.","그는 호주머니 속의 호두를 주물러 본다."]],1,[]],["추정되다(推定되다)","동사",0,"밀 추, 정할 정",[["미루어져 생각되어 판정되다.","이 일은 최소한 한 달은 걸릴 것으로 추정된다."]],1,[]],["눕다","동사",0,"",[["사람이나 동물이 등이나 옆구리가 어떤 곳에 닿도록 몸을 가로로 놓다.","마루에 눕다.","يَسْتَلْقَى"],["몸을 바닥 따위에 대고 수평 상태가 되게 하다.","이부자리에 눕다."]],1,[]],["설치되다(設置되다)","동사",0,"베풀 설, 둘 치",[["어떤 일을 하는 데 필요한 기관이나 설비 따위가 베풀어지다.","신호등이 횡단보도에 설치되다."]],1,[]],["이용되다(利用되다)","동사",0,"이할 이, 쓸 용",[["대상이 필요에 따라 이롭거나 쓸모가 있게 쓰이다.","주차장으로 이용되는 공터.","يَسْتَعْمِلُ"],["대상이 필요에 따라 이롭게 쓰이다.","식용 폐유는 천연 세제를 만드는 데에 이용된다."]],1,[]],["알아내다","동사",0,"",[["방법이나 수단을 써서 모르던 것을 알 수 있게 되다.","이름을 알아내다."]],1,[]],["모질다","형용사",0,"",[["마음씨나 말씨나 행동이 몹시 쌀쌀맞고 독하다.","모질게 거절하다.","قَاسٍ"],["마음씨가 몹시 매섭고 독하다.","성격이 모질다."]],1,[]],["대답하다(對答하다)","동사",0,"대할 대, 대답 답",[["부르는 말에 대해 어떤 말을 하다.","큰 소리로 대답하다.","يَرُدُّ"],["부르는 말에 응하여 어떤 말을 하다.","그는 나에게 화가 났는지 내가 부르는 것에는 대답하지 않았다."]],1,[]],["흐릿하다","형용사",0,"",[["뚜렷하지 않고 어렴풋하다.","흐릿한 모습."]],0,[]],["늘리다","동사",0,"",[["물체의 넓이, 부피 등을 원래보다 크게 하다.","규모를 늘리다.","يُمَدِّدُ"],["물체의 넓이, 부피 따위를 본디보다 커지게 하다.","주차장의 규모를 늘리다."]],1,[]],["지껄이다","동사",0,"",[["큰 소리로 시끄럽게 이야기하다.","지껄이는 소리.","يَزْعَقُ"],["약간 큰 소리로 떠들썩하게 이야기하다.","밖에서 웅성대며 지껄이는 소리가 들려왔다."]],1,[]],["끼우다","동사",0,"",[["벌어진 사이에 무엇을 넣고 죄어서 빠지지 않게 하다.","아기 겨드랑이에 체온계를 끼우다."]],1,[]],["불룩하다","동사",0,"",[["물체의 거죽이 크게 두드러지거나 쑥 내밀리다. 또는 그렇게 되게 하다.","그의 배가 한 번씩 불룩할 때마다 어김없이 긴 한숨이 새어 나왔다."]],1,[]],["점치다(占치다)","동사",0,"점칠 점",[["운수나 좋고 나쁜 일을 미리 점으로 알아보다.","길흉을 점치다.","يمارس التكهّن"],["길흉과 화복을 판단하기 위하여 점괘를 내어 보다.","미신 타파를 부르짖는 어엿한 인텔리도 한 번은 그해의 신수를 점치기 위해서 토정비결을 펼쳐 보는 것이 상례인 듯싶다.≪이어령, 흙 속에 저 바람 속에≫"]],1,[]],["달아나다","동사",0,"",[["쫓아오는 것에 잡히지 않게 빨리 가다.","달아나는 동물.","يَفِرُّ"],["빨리 내닫다.","우리 앞에 가던 차는 큰길 쪽으로 벌써 저만치 달아났다."]],1,[]],["진행하다(進行하다)","동사",0,"나아갈 진, 다닐 행",[["앞으로 나아가다.","자동차가 진행하다.","يتجّه"],["앞으로 향하여 나아가다.","중지 신호를 무시하고 진행하던 트럭이 교통사고를 내고 말았다."]],1,[]],["순조롭다(順調롭다)","형용사",0,"순할 순, 고를 조",[["일 따위가 아무 탈이나 말썽 없이 예정대로 잘되어 가는 상태에 있다.","순조로운 출발."]],1,[]],["촘촘하다","형용사",0,"",[["틈이나 간격이 매우 좁거나 작다.","땅굴은 양쪽으로 탄광의 갱도처럼 넓은 판자와 굵은 말뚝들이 촘촘하게 박혀 있었다.≪홍성원, 육이오≫"]],1,[]],["습하다(濕하다)","형용사",0,"젖을 습",[["메마르지 않고 물기가 많아 축축하다.","덥고 습한 공기."]],1,[]],["익숙하다","형용사",0,"",[["어떤 일을 여러 번 하여 서투르지 않다.","익숙한 손길.","مَاهِر"],["어떤 일을 여러 번 하여 서투르지 않은 상태에 있다.","익숙한 솜씨."],["어떤 대상을 자주 보거나 겪어서 처음 대하지 않는 느낌이 드는 상태에 있다.","직장 생활에 익숙하다."]],1,[]],["운반하다(運搬하다)","동사",0,"옮길 운, 옮길 반",[["물건 따위를 옮겨 나르다.","골재를 창고에 운반하다."]],1,[]],["엄격하다(嚴格하다)","형용사",0,"엄할 엄, 격식 격",[["말, 태도, 규칙 따위가 매우 엄하고 철저하다.","엄격한 규율."]],1,[]],["부끄럽다","형용사",0,"",[["쑥스럽거나 수줍다.","부끄러운 표정.","خَجْلَان"],["일을 잘 못하거나 양심에 거리끼어 볼 낯이 없거나 매우 떳떳하지 못하다.","나는 거짓말을 한 내 자신이 부끄럽다."],["스스러움을 느끼어 매우 수줍다.","부끄러우면 사람들 앞에서 노래 안 불러도 돼."]],1,[]],["유행하다(流行하다)","동사",0,"흐를 유, 다닐 행",[["전염병이 널리 퍼지다.","유행하는 전염병.","ينتشر الوباء"],["전염병이 널리 퍼져 돌아다니다.","언제부턴가 마을에는 괴질이 유행하기 시작하였다."]],1,[]],["들러붙다","동사",0,"",[["끈기 있게 붙어서 잘 떨어지지 않다.","거미줄이 들러붙다.","يَرْبِطُ"],["끈기 있게 철썩 붙다.","찰떡이 입에 들러붙다."]],1,[]],["봉하다(封하다)","동사",0,"봉할 봉",[["문이나 봉투, 그릇 등을 열지 못하게 단단히 붙이거나 꼭 싸다.","문을 봉하다.","يُغْلِقُ"],["문, 봉투, 그릇 따위를 열지 못하게 꼭 붙이거나 싸서 막다.","편지를 봉하다."]],1,[]],["작성하다(作成하다)","동사",0,"지을 작, 이룰 성",[["원고나 서류 등을 만들다.","계획서를 작성하다.","يَعُدُّ"],["서류, 원고 따위를 만들다.","보고서를 작성하다."]],1,[]],["쏟아지다","동사",0,"",[["담겨 있던 액체나 물질이 한꺼번에 바깥으로 나오다.","물이 쏟아지다.","يَتَدَفَّقُ"],["액체나 물질이 그것이 들어 있는 용기에서 한꺼번에 바깥으로 나오다.","물이 바닥에 쏟아지다."]],1,[]],["벗다","동사",0,"",[["사람이 몸에 지닌 물건이나 옷 등을 몸에서 떼어 내다.","구두를 벗다.","يَخْلَعُ"],["사람이 자기 몸 또는 몸의 일부에 착용한 물건을 몸에서 떼어 내다.","옷을 벗다."]],1,[]],["꾀다","동사",0,"",[["벌레나 사람이 한곳에 많이 모여 무질서하게 움직이다.","과일에 초파리가 꾀다.","يَحْتَشِدُ"],["벌레 따위가 한곳에 많이 모여들어 뒤끓다.","음식물에 구더기가 꾀다."],["그럴듯한 말이나 행동으로 남을 속이거나 부추겨서 자기 생각대로 끌다.","고등학교 때 친구를 꾀어 학교에 안 간 적이 있다."]],1,[]],["바로잡다","동사",0,"",[["굽거나 비뚤어지거나 흐트러진 것을 곧고 바르게 하다.","몸을 바로잡다.","يُعَدِّلُ"],["굽거나 비뚤어진 것을 곧게 하다.","앉은 자세를 바로잡다."]],1,[]],["튀기다","동사",0,"",[["힘을 모았다가 갑자기 탁 놓아서 뻗거나 튀게 하다.","고무줄을 튀기다.","ينقف"],["힘을 모았다가 갑자기 탁 놓아 내뻗치거나 튀게 하다.","물방울을 튀기다."]],1,[]],["장치하다(裝置하다)","동사",0,"꾸밀 장, 둘 치",[["어떤 목적에 따라 기능하도록 기계, 도구 따위를 그 장소에 장착하다.","차량에 도난 방지기를 장치하다."]],1,[]],["가로지르다","동사",0,"",[["양쪽 사이에 긴 물건을 가로로 놓거나 꽂다.","가로지른 띠."],["어떤 공간의 가운데를 지나서 가다.","들판을 가로지르다."]],0,[]],["좇다","동사",0,"",[["목표, 꿈, 행복 등을 추구하다.","가치를 좇다.","يَتْبَعُ"],["남의 말이나 뜻을 따르다.","아버지의 유언을 좇다."],["눈여겨보거나 눈길을 보내다.","시선은 서편 하늘로 멀어지는 까마귀 떼를 좇고 있었다.≪김원일, 어둠의 축제≫"]],1,[]],["편리하다(便利하다)","형용사",0,"편할 편, 이할 리",[["편하고 이로우며 이용하기 쉽다.","운반에 편리하다."]],1,[]],["구별되다(區別되다)","동사",0,"구분할 구, 다를 별",[["성질이나 종류에 따라 차이가 나다.","학생 깡패와 운동부원이 구별되지 않던 시절이라 더욱 그렇게 느껴졌는지도 모를 일이었다.≪이문열, 변경≫"]],1,[]],["약속하다(約束하다)","동사",0,"맺을 약, 묶을 속",[["다른 사람과 앞으로의 일을 어떻게 할 것인가를 미리 정하여 두다.","삼촌은 어린 조카와 대공원에 놀러 갈 것을 약속하였다."]],1,[]],["꺾이다","동사",0,"",[["물체가 구부려져 펴지지 않거나 부러지다.","깃대가 꺾이다.","يَنْقَطِعُ"],["길고 탄력이 있거나 단단한 물체가 구부려져 다시 펴지지 않게 되거나 아주 끊어지다. ‘꺾다[1]「1」’의 피동사.","사람들의 발길에 꺾인 꽃."]],1,[]],["분석하다(分析하다)","동사",0,"나눌 분, 쪼갤 석",[["얽혀 있거나 복잡한 것을 풀어서 개별적인 요소나 성질로 나누다.","물질의 성분을 분석하다."]],1,[]],["스치다","동사",0,"",[["가볍게 닿거나 닿을 듯이 가깝게 지나가다.","스치는 옷자락.","يَمَسُّ ، يُلَامِسُ"],["서로 살짝 닿으면서 지나가다.","칼날이 몸에 스치다."]],1,[]],["힘들이다","동사",0,"",[["기운을 발휘하다.","힘들여 끌다.","يَجْهَدُ"],["어떤 일에 마음이나 힘을 기울이다.","헛된 일에 너무 힘들이지 마라."]],1,[]],["이어받다","동사",0,"",[["이미 이루어진 일의 결과나, 해 오던 일 또는 그 정신 따위를 전하여 받다.","가업을 이어받다."]],1,[]],["깨뜨리다","동사",0,"",[["단단한 물건을 쳐서 조각이 나게 하다.","거울을 깨뜨리다."]],0,[]],["불규칙하다(不規則하다)","형용사",0,"아닐 불, 법 규, 법칙 칙",[["규칙에서 벗어나 있다. 또는 규칙이 없다.","불규칙한 소음."]],1,[]],["고요하다","형용사",0,"",[["시끄럽거나 어지럽지 않고 조용하다.","고요한 밤.","هَادِئ"],["조용하고 잠잠하다.","텅 빈 방 안이 고요하고 쓸쓸하다."]],1,[]],["관여하다(關與하다)","동사",0,"관계할 관, 더불 여",[["어떤 일에 관계하여 참여하다.","정치에 관여하다."]],1,[]],["가쁘다","형용사",0,"",[["숨이 몹시 차다.","그가 숨을 가쁘게 쉬면서 말을 이어 나갔다."]],1,[]],["개다","동사",0,"",[["눈, 비, 안개 등이 그치거나 사라져 흐리던 날씨가 맑아지다.","날이 개다.","يَصْفُو"],["흐리거나 궂은 날씨가 맑아지다.","날이 개다."],["옷이나 이부자리 따위를 겹치거나 접어서 단정하게 포개다.","이부자리를 개고 방을 청소하다."],["가루나 덩이진 것에 물이나 기름 따위를 쳐서 서로 섞이거나 풀어지도록 으깨거나 이기다.","떡밥을 개다."]],1,[]],["건조하다(乾燥하다)","형용사",0,"하늘 건, 마를 조",[["말라서 물기나 습기가 없다.","건조한 날.","جَافّ"],["말라서 습기가 없다.","건조한 바람."]],1,[]],["박히다","동사",0,"",[["무엇이 두들겨지거나 돌려져 어디에 꽂히다.","나사가 박히다.","يُدْخِلُ شَيْء مَا بِقُوَّة"],["두들겨 치이거나 틀려서 꽂히다. ‘박다01[1]「1」’의 피동사.","벽에 박힌 못을 빼내다."]],1,[]],["끈끈하다","형용사",0,"",[["끈기 있는 물질이 묻어 있어서 피부에 자꾸 들러붙는 느낌이 있다.","끈끈한 가래침.","لَزِجٌ"],["끈기가 많아 끈적끈적하다.","끈끈한 송진."]],1,[]],["파내다","동사",0,"",[["묻히거나 박힌 것을 파서 꺼내다.","속을 파내다."]],1,[]],["괴다","동사",0,"",[["우묵한 곳이나 좁은 넓이의 공간에 액체나 냄새, 기체 등이 모이다.","괸 빗물.","يَمْتَلِىءُ"],["기울어지거나 쓰러지지 않도록 아래를 받쳐 안정시키다.","턱을 괴다."],["의식이나 잔칫상에 쓰는 음식이나 장작, 꼴 따위를 차곡차곡 쌓아 올리다.","제기(祭器)에 과일을 괴다."]],1,[]],["중시하다(重視하다)","동사",0,"무거울 중, 볼 시",[["가볍게 여길 수 없을 만큼 매우 크고 중요하게 여기다.","개성을 중시하다."]],1,[]],["경영하다(經營하다)","동사",0,"지날 경, 경영할 영",[["기초를 닦고 계획을 세워 어떤 일을 해 나가다.","세상을 경영할 인재."]],1,[]],["수출하다(輸出하다)","동사",0,"보낼 수, 날 출",[["국내의 상품이나 기술을 외국으로 팔아 내보내다.","외국에 수출하는 컬러텔레비전."]],1,[]],["씹히다","동사",0,"",[["사람이나 동물이 입에 넣은 음식 등이 윗니와 아랫니를 움직여 잘게 잘리거나 부드럽게 갈리다.","땅콩이 씹히다.","يُمضغ"],["음식 따위가 입에 넣어져 윗니와 아랫니의 움직임에 잘게 잘리거나 부드럽게 갈리다. ‘씹다「1」’의 피동사.","김치가 사각사각 씹힌다."],["사람이나 동물에게 음식 따위를 입에 넣고 윗니와 아랫니를 움직여 잘게 자르게 하거나 부드럽게 갈게 하다. ‘씹다「1」’의 사동사.","아이에게 껌을 씹히다."]],1,[]],["소유하다(所有하다)","동사",0,"바 소, 있을 유",[["가지고 있다.","토지를 소유하다."]],1,[]],["춥다","형용사",0,"",[["대기의 온도가 낮다.","추운 겨울밤."]],1,[]],["삼가다","동사",0,"",[["말이나 행동을 조심해서 하다.","말을 삼가다.","يحذر"],["몸가짐이나 언행을 조심하다.","말을 삼가다."]],1,[]],["부과하다(賦課하다)","동사",0,"부세 부, 공부할 과",[["세금이나 벌금 등을 매겨서 내게 하다.","과태료를 부과하다.","يَفْرِضُ"],["세금이나 부담금 따위를 매기어 부담하게 하다.","경미한 죄를 범한 사람에게 과태료를 부과하다."]],1,[]],["나누어지다","동사",0,"",[["원래 하나였던 것이 둘 이상의 부분이나 조각이 되다.","음식이 나누어지다.","يَنْقَسِمُ"],["하나가 둘 이상으로 갈라지다.","한 시간은 60분으로 나누어지고, 일 분은 다시 60초로 나누어진다."]],1,[]],["성하다(盛하다)","동사",0,"성할 성",[["세력이 한창 일어나다.","이 세상에 죄악이 성하는 것을 그냥 두고 볼 수는 없습니다."]],1,[]],["패하다(敗하다)","동사",0,"패할 패",[["어떤 일을 실패하다. 또는 싸움이나 승부를 가리는 경기 등에서 지다.","싸움에 패하다."]],1,[]],["베끼다","동사",0,"",[["글이나 그림 따위를 원본 그대로 옮겨 쓰거나 그리다.","책을 한 권 베끼다."]],1,[]],["공급하다(供給하다)","동사",0,"이바지할 공, 줄 급",[["요구나 필요에 따라 물품 따위를 제공하다.","피부에 수분을 충분히 공급하다."]],1,[]],["회전하다(回轉하다/廻轉하다)","동사",0,"돌아올 회, 구를 전 / 돌 회, 구를 전",[["어떤 것을 축으로 물체 자체가 빙빙 돌다.","프로펠러가 회전하면서 바람을 일으켰다."],["투자한 자금이 모두 걷히다. 또는 구입한 상품이 모두 팔리다.",""]],1,[]],["살펴보다","동사",0,"",[["여기저기 빠짐없이 자세히 보다.","안팎을 살펴보다.","يفتش"],["두루두루 자세히 보다.","방 안을 이리저리 살펴보다."]],1,[]],["또렷하다","형용사",0,"",[["엉클어지거나 흐리지 아니하고 분명하다.","또렷한 목소리."]],1,[]],["하찮다","형용사",0,"",[["그렇게 대단하거나 훌륭하지 않다.","하찮은 낙서.","تافه، غير مهمّ، طفيف"],["그다지 훌륭하지 아니하다.","하찮은 솜씨."],["대수롭지 아니하다.","하찮은 일에 마음을 쓰다."]],1,[]],["생산되다(生産되다)","동사",0,"날 생, 낳을 산",[["인간이 생활하는 데 필요한 각종 물건이 만들어지다.","우리 고장에서 생산된 마늘."]],1,[]],["안전하다(安全하다)","형용사",0,"편안 안, 온전할 전",[["위험이 생기거나 사고가 날 염려가 없다.","안전한 장소."]],1,[]],["굳히다","동사",0,"",[["무르던 것을 단단하거나 딱딱하게 만들다.","석고를 굳히다.","يُصَلِّبُ"],["무른 물질을 단단하게 하다. ‘굳다[Ⅰ]「1」’의 사동사.","콘크리트를 굳히다."]],1,[]],["우묵하다","형용사",0,"",[["가운데가 둥그스름하게 푹 패거나 들어가 있는 상태이다.","우묵한 접시."]],1,[]],["무성하다(茂盛하다)","형용사",0,"무성할 무, 성할 성",[["풀이나 나무 등이 많이 자라서 공간을 빽빽하게 메우고 있다.","무성하게 나다.","كَثِيف"],["풀이나 나무 따위가 자라서 우거져 있다.","나무에 잎이 무성하다."]],1,[]],["맺히다","동사",0,"",[["열매나 꽃 등이 생겨나다.","꽃망울이 맺히다.","يُثْمِرُ"],["물방울이나 땀방울 따위가 생겨 매달리게 되다. ‘맺다[1]’의 피동사.","꽃잎에 이슬이 맺히다."],["마음속에 잊히지 않는 응어리가 되어 남아 있다.","가슴에 맺힌 한."]],1,[]],["덮이다","동사",0,"",[["겉에 다른 물건이 씌워지다.","보자기가 덮이다.","يُخْفَى"],["물건 따위가 드러나거나 보이지 않도록 넓은 천 따위가 얹혀 씌워지다. ‘덮다[1]「1」’의 피동사.","책상에 책상보가 덮여 있다."]],1,[]],["지정하다(指定하다)","동사",0,"가리킬 지, 정할 정",[["가리켜 분명하게 정하다.","구역을 지정하다.","يعيّن، يحدّد"],["가리키어 확실하게 정하다.","모일 장소를 지정하다."]],1,[]],["앞서다","동사",0,"",[["앞에 서다.","할아버지 산소 가는 길, 아버지가 앞서고 그 뒤를 아이들이 따라간다."]],1,[]],["눌리다","동사",0,"",[["다른 것의 무게나 힘이 가해지다.","발을 눌리다.","يَنْضَغِطُ"],["물체의 전체 면이나 부분에 힘이나 무게가 가해지다. ‘누르다01[1]「1」’의 피동사.","아이가 짐짝에 눌리다."],["누런빛이 나도록 조금 태우다. ‘눋다’의 사동사.","밥을 눌리다."]],1,[]],["매달다","동사",0,"",[["줄이나 실, 끈 등으로 어떤 곳에 달려 있게 하다.","돌을 매달다.","يُدَلّى"],["줄이나 끈, 실 따위로 잡아매어서 달려 있게 하다.","가로수에 연등을 매달다."]],1,[]],["폐지되다(廢止되다)","동사",0,"폐할 폐, 그칠 지",[["실시되어 오던 제도나 법규, 일 따위가 그만두어지거나 없어지다.","누이가 세상에 태어나기 일 년 전에 노비 세습제라는 것이 폐지되어, 이 나라의 모든 노비들이 풀려나게 된 것이란다.≪문순태, 타오르는 강≫"]],1,[]],["기울이다","동사",0,"",[["비스듬하게 한쪽이 낮아지거나 비뚤어지게 하다.","몸을 기울이다.","يُمَيِّلُ"],["비스듬하게 한쪽을 낮추거나 비뚤게 하다. ‘기울다[1]「1」’의 사동사.","상체를 앞으로 기울이다."]],1,[]],["주저앉다","동사",0,"",[["서 있던 자리에 힘없이 앉다.","땅바닥에 주저앉다.","يَنْهَارُ"],["서 있던 자리에 그대로 힘없이 앉다.","방바닥에 털썩 주저앉다."]],1,[]],["고기다","동사",0,"",[["종이나 천 따위의 얇은 물체가 비벼지거나 접혀져서 잔금이 생기다. 또는 그렇게 하다.","남은 벽지가 고기지 않게 잘 말아 두어라."]],1,[]],["대비하다(對備하다)","동사",0,"대할 대, 갖출 비",[["앞으로 일어날지도 모르는 어떠한 일에 대응하기 위하여 미리 준비하다.","만일의 사태에 대비하다."]],1,[]],["자극하다(刺戟하다)","동사",0,"찌를 자, 창 극",[["외부에서 몸에 작용을 주어 어떤 반응을 일으키게 하다.","뇌를 자극하다.","يحفز"],["외부에서 작용을 주어 감각이나 마음에 반응이 일어나게 하다.","신경을 자극하는 소리."]],1,[]],["생각되다","동사",0,"",[["어떤 일에 대한 의견이나 느낌을 갖게 되다.","그가 범인으로 생각되어 경찰에 신고했다."]],1,[]],["깨다","동사",0,"",[["취한 상태에서 벗어나 원래의 또렷한 정신 상태로 돌아오다.","마취가 깨다.","يُفِيقُ"],["단단한 물체를 쳐서 조각이 나게 하다.","그릇을 깨다."],["술기운 따위가 사라지고 온전한 정신 상태로 돌아오다.","마취에서 깨다."]],1,[]],["다지다","동사",0,"",[["들떠 있는 것을 누르거나 밟거나 쳐서 단단하게 하다.","땅을 다지다."],["고기나 채소 등을 여러 번 칼질하여 잘게 만들다.","다진 양념."]],0,[]],["축하하다(祝賀하다)","동사",0,"빌 축, 하례할 하",[["남의 좋은 일을 기뻐하고 즐거워한다는 뜻으로 인사하다.","생일을 축하하다."]],1,[]],["머뭇거리다","동사",0,"",[["말이나 행동 따위를 선뜻 결단하여 행하지 못하고 자꾸 망설이다.","거기서 머뭇거리지 말고 빨리 오너라."]],1,[]],["늘어서다","동사",0,"",[["길게 줄지어 서다.","길가에 늘어선 나무."]],1,[]],["분리하다(分離하다)","동사",0,"나눌 분, 떠날 리",[["서로 나누어 떨어지게 하다.","소유와 경영을 분리하다."]],1,[]],["지정되다(指定되다)","동사",0,"가리킬 지, 정할 정",[["가리켜져 분명하게 정해지다.","지정된 구역.","يُعيَّن ، يُحدَّد"],["가리켜져 확실하게 정해지다.","지정된 날짜에 원서를 내다."]],1,[]],["건드리다","동사",0,"",[["손으로 살짝 만지거나 무엇으로 대다.","몸을 건드리다.","يَلْمِسُ"],["조금 움직일 만큼 손으로 만지거나 무엇으로 대다.","남의 물건을 함부로 건드리다."]],1,[]],["짐작하다(斟酌하다)","동사",0,"짐작할 짐, 술부을 작",[["사정이나 형편 따위를 어림잡아 헤아리다.","우리는 그의 이야기를 듣고 사건의 진상을 거의 짐작할 수 있었다."]],1,[]],["인정되다(認定되다)","동사",0,"알 인, 정할 정",[["확실히 그렇다고 여겨지다.","그의 능력이 매우 우수한 것으로 인정되다."]],1,[]],["맞이하다","동사",0,"",[["오는 것을 맞다.","새해를 맞이하다."]],1,[]],["서투르다","형용사",0,"",[["일 따위에 익숙하지 못하여 다루기에 설다.","외국어에 서투르다."],["전에 만난 적이 없어 어색하다.","눈에 서투른 남정네."],["앞뒤를 재어 보는 세심함이 없이 섣부르다.","서투르게 수작을 부리다."]],1,[]],["가르다","동사",0,"",[["잘라서 열거나 여러 개가 되게 하다.","배를 가르다.","يُقَسِّمُ"],["쪼개거나 나누어 따로따로 되게 하다.","편을 셋으로 가르다."]],1,[]],["거스르다","동사",0,"",[["일이 진행되어 가는 상황이나 방향에 따르지 않고 반대되거나 어긋나게 행동하다.","거슬러 올라가다.","يُعَارِضُ"],["일이 돌아가는 상황이나 흐름과 반대되거나 어긋나는 태도를 취하다.","국민들은 시대를 거스르는 구시대의 법을 폐지할 것을 요구했다."],["셈할 돈을 빼고 나머지 돈을 도로 주거나 받다.","천 원짜리 지폐를 주고 백 원짜리 동전을 하나 거슬러 받았다."]],1,[]],["가라앉히다","동사",0,"",[["물 등에 떠 있거나 섞여 있는 것을 아래쪽으로 내려가게 하다.","부유물을 가라앉히다.","يُغْرِقُ"],["물 따위에 떠 있거나 섞여 있는 것을 밑바닥으로 내려앉게 하다. ‘가라앉다[1]「1」’의 사동사.","찌꺼기를 바닥에 가라앉히고 맑은 물만 떠냈다."]],1,[]],["노력하다(努力하다)","동사",0,"힘쓸 노, 힘 력",[["목적을 이루기 위하여 몸과 마음을 다하여 애를 쓰다.","많은 과학자들이 첨단 기술 개발에 노력하고 있다."]],1,[]],["부스러지다","동사",0,"",[["깨어져 잘게 조각이 나다.","연탄재가 부스러져 골목이 지저분하다."]],1,[]],["추구하다(追求하다)","동사",0,"쫓을 추, 구할 구",[["목적을 이룰 때까지 뒤좇아 구하다.","이상을 추구하다."]],1,[]],["시행하다(施行하다)","동사",0,"베풀 시, 다닐 행",[["실제로 행하다.","시행한 개혁.","يُنَفِّذُ"],["실지로 행하다.","작전을 시행하다."]],1,[]],["쪼개다","동사",0,"",[["둘 이상으로 나누다.","감을 쪼개다.","يُقَسِّمُ"],["물체나 공간 따위를 둘 이상으로 나누다.","사과를 반으로 쪼개다."]],1,[]],["왕성하다(旺盛하다)","형용사",0,"왕성할 왕, 성할 성",[["한창 성하다.","왕성한 생명력."]],1,[]],["관찰하다(觀察하다)","동사",0,"볼 관, 살필 찰",[["사물이나 현상을 주의하여 자세히 살펴보다.","동식물의 생태를 관찰하다."]],1,[]],["성숙하다(成熟하다)","동사",0,"이룰 성, 익을 숙",[["곡식이나 과일, 동물 등의 생물이 충분히 자라다.","과일이 성숙하다.","يَنْضَجُ"],["생물의 발육이 완전히 이루어지다.","가을은 오곡이 성숙하는 계절이다."]],1,[]],["억울하다(抑鬱하다)","형용사",0,"누를 억, 답답할 울",[["아무 잘못 없이 꾸중을 듣거나 벌을 받거나 하여 분하고 답답하다.","누명을 쓴 것이 너무 억울해서 잠을 잘 수가 없다."]],1,[]],["데리다","동사",0,"",[["아랫사람이나 동물 따위를 자기 몸 가까이 있게 하다.","개를 데리고 산책하다."]],1,[]],["메우다","동사",0,"",[["구멍이나 뚫린 곳을 다른 것으로 채우다.","공란을 메우다.","يَسُدُّ"],["통 따위의 둥근 물체에 테를 끼우다.","빌려 쓴 망건이 머리에 테를 메운 것 같아서 훌떡 벗어 버리고….≪홍명희, 임꺽정≫"]],1,[]],["닥치다","동사",0,"",[["어려운 시기나 일 등이 갑자기 가까이 다가오다.","고난이 닥치다.","يَدْنُو، يَقْتَرِبُ"],["어떤 일이나 대상 따위가 가까이 다다르다.","시련이 닥치다."],["입을 다물다.","하품 그만하고 입 닥쳐라."]],1,[]],["단순하다(單純하다)","형용사",0,"홑 단, 순수할 순",[["복잡하지 않고 간단하다.","단순한 구조."]],0,[]],["적용하다(適用하다)","동사",0,"맞을 적, 쓸 용",[["알맞게 이용하거나 맞추어 쓰다.","이론을 현실에 적용하다."]],1,[]],["뒤집히다","동사",0,"",[["안과 겉이 서로 바뀌다.","뒤집힌 우산.","يَنْقَلِبُ رَأْسًا عَلَى عَقِبٍ"],["안과 겉이 뒤바뀌다. ‘뒤집다「1」’의 피동사.","우산이 뒤집히다."]],1,[]],["존경하다(尊敬하다)","동사",0,"높을 존, 공경 경",[["남의 인격, 사상, 행위 따위를 받들어 공경하다.","아버지를 존경하다."]],1,[]],["도드라지다","동사",0,"",[["가운데가 볼록하게 나오다.","도드라진 이마.","يَنْتَأُ"],["가운데가 볼록하게 쏙 내밀다.","그는 화가 났는지 입술이 도드라져 있다."]],1,[]],["쫓다","동사",0,"",[["앞선 것을 잡으려고 서둘러 뒤를 따르거나 자취를 따라가다.","쫓아서 들어가다.","يَتْبَعُ"],["어떤 대상을 잡거나 만나기 위하여 뒤를 급히 따르다.","쫓고 쫓기는 숨 막히는 추격전을 벌이다."],["어떤 자리에서 떠나도록 몰다.","새를 쫓다."]],1,[]],["기이하다(奇異하다)","형용사",0,"기특할 기, 다를 이",[["기묘하고 이상하다.","기이한 생김새."]],1,[]],["배열하다(配列하다/排列하다)","동사",0,"나눌 배, 벌일 열 / 밀칠 배, 벌일 열",[["일정한 차례나 간격에 따라  임꺽정≫"]],1,[]],["아끼다","동사",0,"",[["무엇을 소중히 여겨 마구 쓰지 않고 조심히 다루어 쓰다.","아껴 쓰다.","يُوَفِّرُ"],["물건이나 돈, 시간 따위를 함부로 쓰지 아니하다.","시간을 아끼다."],["물건이나 사람을 소중하게 여겨 보살피거나 위하는 마음을 가지다.","아끼는 제자."]],1,[]],["인도하다(引導하다)","동사",0,"끌 인, 인도할 도",[["어떤 목적이나 방향으로 남을 이끌어 지도하다.","나쁜 길로 인도하다.","يَقُودُ"],["이끌어 지도하다.","그는 나를 훌륭한 선생님에게 인도해 주었다."]],1,[]],["소개하다(紹介하다)","동사",0,"이을 소, 낄 개",[["둘 사이에서 양쪽의 일이 잘 진행되게 힘쓰다.","직장을 소개하다.",""],["둘 사이에서 양편의 일이 진행되게 주선하다.","배고픈 사생들을 위해 암거래하는 떡집이나 기타 음식점에 소개하는 것도 그의 소임이었다.≪박경리, 토지≫"]],1,[]],["메마르다","형용사",0,"",[["땅이 물기나 양분이 없어 기름지지 않다.","메마른 농토.","جَافّ"],["땅이 물기가 없고 기름지지 아니하다.","논바닥이 메말라 쩍쩍 갈라진다."]],1,[]],["조직되다(組織되다)","동사",0,"짤 조, 짤 직",[["짜여서 이루어지거나 얽혀서 만들어지다.",""]],1,[]],["떨어뜨리다","동사",0,"",[["위에 있던 것을 아래로 내려가게 하다.","수저를 바닥에 떨어뜨리다."]],1,[]],["정밀하다(精密하다)","형용사",0,"정할 정, 빽빽할 밀",[["빈틈이나 오차가 없을 정도로 정교하고 치밀하다.","정밀한 도형."]],1,[]],["밭다","형용사",0,"",[["시간이나 공간이 다붙어 몹시 가깝다.","천장이 밭다."]],1,[]],["특이하다(特異하다)","형용사",0,"특별할 특, 다를 이",[["보통 것이나 보통 상태에 비하여 두드러지게 다르다.","특이한 성격."],["보통보다 훨씬 뛰어나다.","그는 손재주가 특이해서 온갖 용품을 손수 만든다."]],1,[]],["화합하다(和合하다)","동사",0,"화할 화, 합할 합",[["화목하게 어울리다.","이웃과 화합하다."]],1,[]],["틀다","동사",0,"",[["몸이나 몸 한 부분의 방향을 꼬아 돌리다.","몸을 틀다."]],0,[]],["근무하다(勤務하다)","동사",0,"부지런할 근, 힘쓸 무",[["직장에 적을 두고 직무에 종사하다.","이 객줏집은 김덕명의 친구가 내고 있었는데 은이라는 그 친구는 감영 포청에 근무하는 포졸이었다.≪유현종, 들불≫"]],1,[]],["품다","동사",0,"",[["품속에 넣거나 가슴에 대어 안다.","암탉이 알을 품다."]],1,[]],["권하다(勸하다)","동사",0,"권할 권",[["어떤 사람에게 좋다고 여겨지는 일을 하도록 하다.","검사를 권하다.","يُوصِي بِ"],["어떤 일을 하도록 부추기다.","아버지는 나에게 해외 유학을 권했지만 자신이 없어 받아들이지 못했다."]],1,[]],["부탁하다(付託하다)","동사",0,"줄 부, 부탁할 탁",[["어떤 일을 해 달라고 청하거나 맡기다.","유권자에게 지지를 부탁하다."]],1,[]],["새다","동사",0,"",[["틈이나 구멍으로 기체나 액체가 빠져나가다.","가스가 새다.","يسرب"],["기체, 액체 따위가 있던 곳에서 틈이나 구멍으로 조금씩 빠져나가거나 빠져나오다.","지붕에서 비가 샌다."]],1,[]],["날아다니다","동사",0,"",[["날아서 이리저리 다니다.","나비가 꽃밭에 날아다니다."]],1,[]],["해석하다(解釋하다)","동사",0,"풀 해, 풀 석",[["문장으로 표현된 내용을 이해하고 설명하다.","원문을 해석한 책.","يُحَلِّل"],["문장이나 사물 따위로 표현된 내용을 이해하고 설명하다.","여기서 주어로 쓰인 대명사를 주인공으로 해석하면 전체적인 의미가 달라진다."]],1,[]],["곤란하다(困難▽하다)","형용사",0,"곤할 곤, 어려울 난",[["사정이 몹시 딱하고 어렵다.","곤란한 형편."]],1,[]],["우러르다","동사",0,"",[["위를 향하여 고개를 정중히 들고 쳐다보다.","달을 우러르다.","ينظر لأعلى"],["위를 향하여 고개를 정중히 쳐들다.","선수들은 금메달을 목에 걸고 태극기를 우러러 경례를 하였다."]],1,[]],["분해되다(分解되다)","동사",0,"나눌 분, 풀 해",[["여러 부분으로 이루어진 것이 그 부분이나 성분으로 따로따로 나뉘다.","분해된 장난감.","يُفَكَّك"],["여러 부분이 결합되어 이루어진 것이 그 낱낱으로 나뉘다.","총이나 폭탄과 같은 무기들은 몇 가지 부품으로 분해될 수 있다."]],1,[]],["소속되다(所屬되다)","동사",0,"바 소, 붙일 속",[["일정한 단체나 기관에 딸리게 되다.","본부 중대에 소속되다."]],1,[]],["발전시키다(發展시키다)","동사",0,"필 발, 펼 전",[["더 좋은 상태나 더 높은 단계로 나아가게 하다.","경제를 발전시키다."],["일을 어떤 방향으로 전개되게 하다.","갈등을 싸움으로 발전시키다."]],0,[]],["혼인하다(婚姻하다)","동사",0,"혼인할 혼, 혼인 인",[["남자와 여자가 부부가 되다.","너도 어느덧 혼인할 나이가 되었구나."]],1,[]],["얽매이다","동사",0,"",[["끈이나 줄 등에 이리저리 걸려서 묶이다.","얽매인 발목.","يُربَط، يُحزَم"],["얽혀서 둘려 묶이다. ‘얽매다「1」’의 피동사.","그녀는 오랏줄에 상반신이 여러 겹 얽매여 있었고, 산발된 머리, 검정 몸뻬에 옥양목 적삼을 입곤 있었으나….≪이문구, 장한몽≫"]],1,[]],["반응하다(反應하다)","동사",0,"돌이킬 반, 응할 응",[["어떤 자극에 대하여 일정한 동작이나 태도를 보이다.","자극에 반응하다.","يَرُدُّ"],["자극에 대응하여 어떤 현상이 일어나다.","이번 호 잡지에 독자들이 긍정적으로 반응하고 있다."]],1,[]],["덜다","동사",0,"",[["일정한 수량이나 부피에서 일부를 떼어 내다.","몇 개를 덜다.","يُقَلِّلُ"],["일정한 수량이나 정도에서 얼마를 떼어 줄이거나 적게 하다.","다섯에서 둘을 덜다."]],1,[]],["우거지다","동사",0,"",[["풀, 나무 따위가 자라서 무성해지다.","숲이 우거지다."]],1,[]],["캐다","동사",0,"",[["땅속에 묻힌 것을 파서 꺼내다.","금을 캐다.","يَحْفِرُ"],["땅속에 묻힌 광물이나 식물 따위의 자연 생산물을 파서 꺼내다.","산에서 나물을 캐다."]],1,[]],["닳다","동사",0,"",[["오래 쓰거나 갈려서 어떤 물건이 낡거나 길이, 두께, 크기 등이 줄다.","가방이 닳다.","يَبْلَى"],["갈리거나 오래 쓰여서 어떤 물건이 낡아지거나, 그 물건의 길이, 두께, 크기 따위가 줄어들다.","바지가 닳다."]],1,[]],["네모나다","형용사",0,"",[["모양이 네모꼴로 되어 있다.","얼굴이 네모나 보이는 사내."]],1,[]],["경험하다(經驗하다)","동사",0,"지날 경, 시험 험",[["자신이 실제로 해 보거나 겪어 보다.","좌절을 경험하다."]],1,[]],["오므리다","동사",0,"",[["벌어져 있던 것의 끝부분을 한곳으로 모으다.","날개를 오므리다.","يطبق/ يضم"],["물건의 가장자리 끝을 한곳으로 모으다.","손을 오므리다."]],1,[]],["부치다","동사",0,"",[["어떤 일을 하기에 힘이나 능력 등이 부족하다.","기량이 부치다.","تَنْقُص الْقُوَّة"],["편지나 물건 따위를 일정한 수단이나 방법을 써서 상대에게로 보내다.","편지를 부치다."]],1,[]],["방해하다(妨害하다)","동사",0,"방해할 방, 해할 해",[["남의 일을 간섭하고 막아 해를 끼치다.","공부를 방해하지 마라."]],1,[]],["뜨이다","동사",0,"",[["감았던 눈이 떠지다.","아침에 눈이 뜨이다.","يَنْفَتِحُ"],["감았던 눈이 벌려지다. ‘뜨다05「1」’의 피동사.","간밤에 늦게 잤더니 아침 늦게야 눈이 뜨였다."]],1,[]],["셈하다","동사",0,"",[["수를 세다.","윤태는 벌써 한 달이 넘게 오르내린 층계건만 발을 옮길 때마다 번번이 그 숫자를 셈하게 되는 것이 싫었다.≪유주현, 하오의 연가≫"]],1,[]],["작곡하다(作曲하다)","동사",0,"지을 작, 굽을 곡",[["음악 작품을 창작하다. 또는 시(詩)나 가사에 가락을 붙이다.","노래를 작곡하다."]],1,[]],["일치하다(一致하다)","동사",0,"한 일, 이를 치",[["비교되는 대상들이 서로 어긋나지 아니하고 같거나 들어맞다.","우리는 다시 합쳐야 한다는 점에서는 그들과 의견이 일치했다."]],1,[]],["볼록하다","동사",0,"",[["물체의 거죽이 조금 도드라지거나 쏙 내밀리다. 또는 그렇게 되게 하다.","살짝 입술이 양편으로 열리어 볼록하며 입가의 살을 모으자….≪현진건, 지새는 안개≫"]],1,[]],["그릇되다","동사",0,"",[["어떤 일이 옳지 못하거나 사리에 맞지 아니하다.","그릇된 가치관.","يُخْطَئُ"],["어떤 일이 사리에 맞지 아니하다.","그릇된 가치관을 가지다."]],1,[]],["등장하다(登場하다)","동사",0,"오를 등, 마당 장",[["사람이 무대 등에 나타나다.","배우가 등장하다.","يَظْهَرُ"],["무대나 연단 따위에 나오다.","교장 선생님께서 연단에 등장하시자 주위가 조용해졌다."]],1,[]],["평범하다(平凡하다)","형용사",0,"평평할 평, 무릇 범",[["뛰어나거나 색다른 점이 없이 보통이다.","평범한 논리."]],1,[]],["더듬다","동사",0,"",[["무엇을 찾거나 알아보려고 이리저리 만져 보거나 헤매다.","서랍 속을 더듬다.","يَبْحَثُ"],["잘 보이지 않는 것을 손으로 이리저리 만져 보며 찾다.","나는 방구석을 더듬어 성냥을 찾아서 호롱에 불을 댕겼다."],["말을 하거나 글을 읽을 때 순조롭게 나오지 않고 자꾸 막히다.","그는 많은 사람 앞에 서면 긴장을 하여 말을 심하게 더듬곤 한다."]],1,[]],["깨물다","동사",0,"",[["아랫니와 윗니가 서로 닿을 정도로 세게 물다.","감자를 깨물다.","يَعَضُّ بِشِدَّةٍ"],["아랫니와 윗니가 맞닿을 정도로 세게 물다.","사탕을 깨물다."]],1,[]],["찾아오다","동사",0,"",[["사람을 만나거나 어떤 일을 하러 오다.","사람이 찾아오다.","يَأْتِي"],["볼일을 보거나 특정한 사람을 만나기 위하여 그와 관련된 곳에 오다.","친구는 나에게 찾아와서 책을 빌려 갔다."],["잃거나 맡기거나 빌려주었던 것을 돌려받아 가지고 오다.","경찰서에서 잃어버린 지갑을 찾아오다."]],1,[]],["식히다","동사",0,"",[["더운 기운을 없애다.","식히는 시간.","يُبرِّد"],["더운 기를 없애다. ‘식다「1」’의 사동사.","끓인 물을 식히다."]],1,[]],["고유하다(固有하다)","형용사",0,"굳을 고, 있을 유",[["본래부터 가지고 있어 특유하다.","우리나라의 고유한 전통문화."]],1,[]],["단정하다(斷定하다)","동사",0,"끊을 단, 정할 정",[["딱 잘라서 판단하고 결정하다.","한쪽의 진술만 듣고 그를 범인으로 단정하는 것은 부당하다."]],1,[]],["멎다","동사",0,"",[["소리나 행동 또는 움직이던 것이 멈추다.","기침이 멎다.","يَكُفُّ عَنْ"],["사물의 움직임이나 동작이 그치다.","심장이 멎다."]],1,[]],["짚다","동사",0,"",[["바닥이나 벽, 지팡이 등에 몸을 기대어 의지하다.","땅을 짚다.","ينكفئ"],["바닥이나 벽, 지팡이 따위에 몸을 의지하다.","지팡이를 짚은 노인."],["여럿 중에 하나를 꼭 집어 가리키다.","손가락으로 글자를 짚어 가며 가르치다."]],1,[]],["어질다","형용사",0,"",[["마음이 너그럽고 착하며 슬기롭고 덕이 높다.","그녀는 어딘지 위엄을 풍기면서도 조용하고 어질어 보였다."]],1,[]],["들어맞다","동사",0,"",[["미리 했던 생각이나 말 등이 정확히 맞다.","꿈이 들어맞다."]],0,[]],["성가시다","형용사",0,"",[["자꾸 들볶거나 번거롭게 굴어 괴롭고 귀찮다.","몸이 아프니까 만사가 귀찮고 성가시다."]],1,[]],["곱하다","동사",0,"",[["둘 이상의 수 또는 식을 두 번이나 그 이상 몇 번 되짚어 합치다.","7에 3을 곱하면 21이 된다."]],1,[]],["기억하다(記憶하다)","동사",0,"기록할 기, 생각할 억",[["이전의 인상이나 경험을 의식 속에 간직하거나 도로 생각해 내다.","나를 기억하겠니?"]],1,[]],["분비되다(分泌되다)","동사",0,"나눌 분, 분비할 비",[["샘세포의 작용에 의하여 만들어진 액즙이 배출관으로 보내지다. 외분비가 되는 일과 내분비가 되는 일이 있다.",""]],1,[]],["우수하다(優秀하다)","형용사",0,"넉넉할 우, 빼어날 수",[["여럿 가운데 뛰어나다.","우수한 문화."]],1,[]],["합격하다(合格하다)","동사",0,"합할 합, 격식 격",[["시험, 검사, 심사 등을 통과하다.","검사에 합격하다.","ينجح في امتحان"],["시험, 검사, 심사 따위에서 일정한 조건을 갖추어 어떠한 자격이나 지위 따위를 얻다.","품질 기준에 합격한 제품."]],1,[]],["누다","동사",0,"",[["배설물을 몸 밖으로 내보내다.","오줌을 누다."]],1,[]],["게으르다","형용사",0,"",[["행동이 느리고 움직이거나 일하기를 싫어하는 성미나 버릇이 있다.","게으른 사람이 성공하는 것 봤어?"]],1,[]],["거듭되다","동사",0,"",[["어떤 일이나 상황이 계속 생겨나거나 되풀이되다.","거듭되는 사업의 실패로 집안이 몰락했다."]],1,[]],["빠져나가다","동사",0,"",[["제한된 환경이나 경계의 밖으로 나가다.","동네 처녀들은 이 시골구석에서 빠져나가기를 원하고 있었다."]],1,[]],["인식하다(認識하다)","동사",0,"알 인, 알 식",[["사물을 분별하고 판단하여 알다.","현실을 인식하다."]],1,[]],["식다","동사",0,"",[["더운 기운이 없어지다.","식은 국.","يبرد"],["더운 기가 없어지다.","국이 식다."]],1,[]],["건강하다(健康하다)","형용사",0,"굳셀 건, 편안 강",[["정신적으로나 육체적으로 아무 탈이 없고 튼튼하다.","밝고 건강한 꿈."]],1,[]],["애쓰다","동사",0,"",[["마음과 힘을 다하여 무엇을 이루려고 힘쓰다.","그는 요즘 새로 맡은 일의 준비 작업에 무척 애쓰고 있다."]],1,[]],["절하다","동사",0,"",[["공경하는 뜻으로 몸을 굽히다.","장인어른께 넙죽 절하다."]],1,[]],["경계하다(警戒하다)","동사",0,"깨우칠 경, 경계할 계",[["뜻밖의 사고나 위험이 생기지 않도록 살피고 조심하다.","경계하는 눈빛.","يَحْتَرِسُ"],["뜻밖의 사고가 생기지 않도록 조심하여 단속하다.","경계하는 눈빛."],["옳지 않은 일이나 잘못된 일들을 하지 않도록 타일러서 주의하게 하다.","사람은 자신의 이익을 너무 챙기려고 하는 욕망을 경계해야 한다."]],1,[]],["지치다","동사",0,"",[["힘든 일을 하거나 어떤 일에 시달려서 힘이 없다.","몸이 지치다.","يَتْعَبُ"],["힘든 일을 하거나 어떤 일에 시달려서 기운이 빠지다.","종일 이삿짐을 나르느라 너무 지쳐서 입맛도 없다."]],1,[]],["가정하다(假定하다)","동사",0,"거짓 가, 정할 정",[["사실이 아니거나 또는 사실인지 아닌지 분명하지 않은 것을 임시로 인정하다.","최악의 상황을 가정하고 대책을 세우자."]],1,[]],["허락하다(許諾▽하다)","동사",0,"허락할 허, 허락할 낙",[["청하는 일을 하도록 들어주다.","기자들의 출입을 허락하다."]],1,[]],["외치다","동사",0,"",[["큰 소리를 지르다.","사람이 외치다.","يَصْرُخ"],["남의 주의를 끌거나 다른 사람에게 어떤 행동을 하도록 하기 위하여 큰 소리를 지르다.","“불이야!” 하고 큰 소리로 외쳤다."]],1,[]],["자다","동사",0,"",[["눈을 감고 몸과 정신의 활동을 멈추고 한동안 쉬는 상태가 되다.","낮잠을 자다.","ينام"],["생리적인 요구에 따라 눈이 감기면서 한동안 의식 활동이 쉬는 상태가 되다.","단잠을 자다."]],1,[]],["분리되다(分離되다)","동사",0,"나눌 분, 떠날 리",[["서로 나뉘어 떨어지다.","현실과 분리된 느낌."]],1,[]],["고안하다(考案하다)","동사",0,"생각할 고, 책상 안",[["연구하여 새로운 안을 생각해 내다.","새로 고안한 기구."]],1,[]],["삼키다","동사",0,"",[["무엇을 입에 넣어서 목구멍으로 넘기다.","알약을 삼키다."]],1,[]],["두툼하다","형용사",0,"",[["꽤 두껍다.","두툼한 편지."]],1,[]],["구경하다","동사",0,"",[["흥미나 관심을 가지고 보다.","경기를 구경하다."]],0,[]],["반사되다(反射되다)","동사",0,"돌이킬 반, 쏠 사",[["일정한 방향으로 나아가던 파동이 다른 물체의 표면에 부딪쳐서 나아가던 방향이 반대로 바뀌다.","수면에 반사되는 불빛."]],1,[]],["잃어버리다","동사",0,"",[["가졌던 물건을 흘리거나 놓쳐서 더 이상 갖지 않게 되다.","잃어버리기 쉽다.","يَضِيع"],["가졌던 물건이 자신도 모르게 없어져 그것을 아주 갖지 아니하게 되다.","길에서 돈을 잃어버리다."]],1,[]],["아득하다","형용사",0,"",[["보이거나 들리는 것이 희미하고 매우 멀다.","아득한 꿈속.","بَعِيد"],["보이는 것이나 들리는 것이 희미하고 매우 멀다.","아득한 수평선."]],1,[]],["편성하다(編成하다)","동사",0,"엮을 편, 이룰 성",[["방송 프로그램의 시간표를 짜다.","시간표를 편성하다.","ينظّم، يرتّب، يشكّل، يخطّط"],["엮어 모아서 책·신문·영화 따위를 만들다.","특집 프로를 편성하다."],["예산·조직·대오 따위를 짜서 이루다.","학급을 편성하다."]],1,[]],["고상하다(高尙하다)","형용사",0,"높을 고, 오히려 상",[["품위나 몸가짐의 수준이 높고 훌륭하다.","고상한 인격."]],1,[]],["띄우다","동사",0,"",[["편지나 소식 등을 부치거나 보내다.","전보를 띄우다.","يُرْسِلُ"],["물 위나 공중에 있게 하거나 위쪽으로 솟아오르게 하다. ‘뜨다01[1]「15」’의 사동사.","강물 위에 배를 띄우다."],["공간적으로 거리를 꽤 멀게 하다. ‘뜨다13「7」’의 사동사.","나무를 심을 때는 간격을 좀 띄워서 심어야 한다."]],1,[]],["배치하다(配置하다)","동사",0,"나눌 배, 둘 치",[["사람이나 물자 따위를 일정한 자리에 알맞게 나누어 두다.","인재를 적재적소에 배치하다."]],1,[]],["떳떳하다","형용사",0,"",[["굽힐 것이 없이 당당하다.","무엇 하나 잘못한 것 없는 떳떳한 사람."]],1,[]],["뽐내다","동사",0,"",[["자신감에 차서 우쭐거리다.","뽐내는 태도.","يَتَكَبَّرُ"],["의기가 양양하여 우쭐거리다.","금의환향하여 뽐내 보고 싶다."]],1,[]],["재미있다","형용사",0,"",[["아기자기하게 즐겁고 유쾌한 기분이나 느낌이 있다.","그 영화는 참 재미있다."]],1,[]],["흥분하다(興奮하다)","동사",0,"일 흥, 떨칠 분",[["어떤 자극을 받아 감정이 북받쳐 일어나다.","그는 좀처럼 흥분하는 일이 없다."]],1,[]],["시다","형용사",0,"",[["맛이 식초와 같다.","신 레몬.","حامض"],["맛이 식초나 설익은 살구와 같다.","포도가 시다."]],1,[]],["오르내리다","동사",0,"",[["올라갔다 내려갔다 하다.","짐을 옮기는데 승강기가 고장 나서 걸어서 오 층까지 오르내리느라고 혼났다."]],1,[]],["벼르다","동사",0,"",[["어떤 일을 이루려고 마음속으로 준비를 단단히 하고 기회를 엿보다.","결전을 벼르다."],["일정한 비례에 맞추어서 여러 몫으로 나누다.","그들은 적은 돈이지만 잘 별러 쓰기로 했다."]],1,[]],["짜이다","동사",0,"",[["가구나 상자 등의 틀이나 구조물이 만들어지다.","짜인 문짝.","يُؤسَّس، يتشكّل"],["부분이 맞추어져 전체가 만들어지다. ‘짜다01[1]「6」’의 피동사.",""]],1,[]],["제작하다(製作하다)","동사",0,"지을 제, 지을 작",[["재료를 가지고 기능과 내용을 가진 새로운 물건이나 예술 작품을 만들다.","사람은 도구를 제작하고 사용할 줄 아는 동물이다."]],1,[]],["흘러들다","동사",0,"",[["물 등이 흘러서 들어가거나 들어오다.","흘러든 바닷물.","يسيل إلى"],["액체 따위가 흘러서 들어가거나 들어오다.","이 강에 흘러드는 공장 폐수가 수질 오염의 주범이다."]],1,[]],["낮아지다","동사",0,"",[["아래에서 위까지의 길이가 짧아지다.","건물이 낮아지다."]],0,[]],["들추다","동사",0,"",[["속이 드러나도록 들어 올리거나 헤집다.","돌을 들추다.","يَرْفَعُ"],["속이 드러나게 들어 올리다.","이불을 들추다."]],1,[]],["비스듬하다","형용사",0,"",[["수평이나 수직이 되지 아니하고 한쪽으로 기운 듯하다.","책들이 비스듬하게 꽂혀 있다."]],1,[]],["결합되다(結合되다)","동사",0,"맺을 결, 합할 합",[["둘 이상의 사물이나 사람이 서로 관계를 맺어 하나가 되다.","꿈이 이렇게 사실과 결합되는 일이 세상에 어디 있으랴?≪나도향, 뇌≫"]],1,[]],["침범하다(侵犯하다)","동사",0,"침노할 침, 범할 범",[["남의 영토나 권리, 재산, 신분 따위를 침노하여 범하거나 해를 끼치다.","사생활을 침범하다."]],1,[]],["행사하다(行使하다)","동사",0,"다닐 행, 하여금 사",[["부려서 쓰다.","영향력을 행사하다."]],1,[]],["반복하다(反復하다)","동사",0,"돌이킬 반, 회복할 복",[["같은 일을 되풀이하다.","같은 질문을 반복하다."]],1,[]],["깨지다","동사",0,"",[["단단한 물건이 여러 조각이 나다.","깨진 조각.","يَنْكَسِرُ"],["‘깨어지다[1]「1」’의 준말.","그릇이 깨지다."]],1,[]],["엄하다(嚴하다)","형용사",0,"엄할 엄",[["규칙을 적용하거나 예절을 가르치는 일 등이 매우 철저하고 바르다.","엄하게 가르치다.","صَارِم"],["규율이나 규칙을 적용하거나 예절을 가르치는 것이 매우 철저하고 바르다.","군대는 계급의 상하 구별이 엄하다."]],1,[]],["느슨하다","형용사",0,"",[["잡아매거나 묶은 끈, 매듭 등이 살짝 풀어져 헐겁다.","느슨하게 걸다."]],0,[]],["변화시키다(變化시키다)","동사",0,"변할 변, 될 화",[["무엇의 모양이나 상태, 성질 등을 달라지게 하다.","구조를 변화시키다."]],0,[]],["튀어나오다","동사",0,"",[["겉으로 툭 내밀어져 나오다.","눈이 튀어나오다.","يَبْرُزُ"],["겉으로 툭 비어져 나오다.","이마가 툭 튀어나오다."]],1,[]],["첨가하다(添加하다)","동사",0,"더할 첨, 더할 가",[["이미 있는 것에 덧붙이거나 보태다.","식품에 방부제를 첨가하다."]],1,[]],["신기하다(神奇하다)","형용사",0,"귀신 신, 기특할 기",[["믿을 수 없을 정도로 색다르고 놀랍다.","신기한 일."]],1,[]],["도달하다(到達하다)","동사",0,"이를 도, 통달할 달",[["목적한 곳이나 수준에 다다르다.","최고의 경지에 도달하다."]],1,[]],["온화하다(溫和하다)","형용사",0,"따뜻할 온, 화할 화",[["날씨가 맑고 따뜻하며 바람이 부드럽다.","사월은 날씨가 참 온화하지요."]],1,[]],["까다롭다","형용사",0,"",[["조건이나 방법이 복잡하고 엄격하여 다루기가 쉽지 않다.","까다로운 글.","مُعَقَّد"],["조건 따위가 복잡하거나 엄격하여 다루기에 순탄하지 않다.","조건이 까다롭다."]],1,[]],["앞장서다","동사",0,"",[["무리의 맨 앞에 서다.","앞장서 가는 골목대장."]],1,[]],["진실하다(眞實하다)","형용사",0,"참 진, 열매 실",[["마음에 거짓이 없이 순수하고 바르다.","진실한 벗."]],1,[]],["분하다(憤하다/忿하다)","형용사",0,"분할 분 / 성낼 분",[["억울한 일을 당하여 화나고 원통하다.","그는 믿었던 사람에게 배신당한 것이 무엇보다 분했다."],["될 듯한 일이 되지 않아 섭섭하고 아깝다.","경기에 진 것이 못내 분하다."]],1,[]],["요란스럽다(搖亂스럽다)","형용사",0,"흔들 요, 어지러울 란",[["어수선하고 시끄러운 데가 있다.","요란스러운 울음.","صاخب"],["시끄럽고 떠들썩한 데가 있다.","요란스러운 웃음소리."]],1,[]],["간략하다(簡略하다)","형용사",0,"대쪽 간, 간략할 략",[["간단하고 짤막하다.","간략한 내용."]],1,[]],["여위다","동사",0,"",[["살이 많이 빠져 몸이 마르고 얼굴에 핏기가 없게 되다.","여윈 뺨.","يصبح هزيلا"],["몸의 살이 빠져 파리하게 되다.","여윈 손."]],1,[]],["도입하다(導入하다)","동사",0,"인도할 도, 들 입",[["기술, 방법, 물자 따위를 끌어 들이다.","새로운 공법을 건축에 도입하다."]],1,[]],["한가하다(閑暇하다)","형용사",0,"한가할 한, 틈 가",[["겨를이 생겨 여유가 있다.","일이 없어 한가하다."]],1,[]],["적히다","동사",0,"",[["글로 쓰이다.","낙서가 적히다.","يدوَّن"],["어떤 내용이 글로 쓰이다. ‘적다01「1」’의 피동사.","그녀의 일기장에 적힌 사연들은 정말 눈물 없이는 읽을 수 없는 것들이었다."]],1,[]],["보고하다(報告하다)","동사",0,"갚을 보, 고할 고",[["일에 관한 내용이나 결과를 말이나 글로 알리다.","논문을 정리해서 학계에 보고하였다."]],1,[]],["떠들썩하다","형용사",0,"",[["여러 사람이 떠들어서 시끄럽다.","떠들썩한 교실.","صَخَب"],["여러 사람이 큰 소리로 마구 떠들어 몹시 시끄럽다.","모처럼 모인 식구들로 집 안이 떠들썩하다."]],1,[]],["해하다(害하다)","동사",0,"해할 해",[["이롭지 아니하게 하거나 손상을 입히다.","아버지는 건강을 해할 정도로 열심히 일을 하셨다."]],1,[]],["준비하다(準備하다)","동사",0,"준할 준, 갖출 비",[["미리 마련하여 갖추다.","식사를 준비하다."]],1,[]],["증류하다(蒸溜하다/烝溜하다)","동사",0,"찔 증, 낙숫물 류 / 찔 증, 낙숫물 류",[["액체를 가열하여 생긴 기체를 냉각하여 다시 액체로 만들다. 여러 성분이 섞인 혼합 용액으로부터 끓는점의 차이를 이용하여 각 성분을 분리할 수 있다.","술도 집에서 증류한 독한 소주에다 인삼을 담아 해를 묵힌 극상품으로 내갔다.≪박완서, 미망≫"]],1,[]],["꼽히다","동사",0,"",[["어떤 범위나 순위 안에 들다.","다섯 손가락에 꼽히다."]],1,[]],["제시하다(提示하다)","동사",0,"끌 제, 보일 시",[["무엇을 하고자 하는 생각을 말이나 글로 나타내어 보이다.","제시한 대안.","يُقَدِّمُ"],["어떠한 의사를 말이나 글로 나타내어 보이게 하다.","국민들에게 대안을 제시하다."],["검사나 검열 따위를 위하여 물품을 내어 보이게 하다.","범행에 사용된 칼을 법정에 증거로 제시하다."]],1,[]],["흘러내리다","동사",0,"",[["물 등이 높은 곳에서 낮은 곳으로 흐르거나 떨어지다.","흘러내리는 눈물.","يَنْزِلُ"],["물 따위가 높은 곳에서 낮은 곳으로 흐르거나 떨어지다.","온몸에서 땀이 비 오듯 흘러내린다."]],1,[]],["위로하다(慰勞하다)","동사",0,"위로할 위, 일할 로",[["따뜻한 말이나 행동으로 괴로움을 덜어 주거나 슬픔을 달래 주다.","시험에 떨어진 친구를 위로하였다."]],1,[]],["찢어지다","동사",0,"",[["도구에 의해서나 잡아당겨져 갈라지다.","찢어진 사진."]],0,[]],["대단하다","형용사",0,"",[["아주 심하다.","대단한 더위.","عَظِيم"],["매우 심하다.","추위가 대단하다."]],1,[]],["함유되다(含有되다)","동사",0,"머금을 함, 있을 유",[["물질에 어떤 성분이 포함되어 있다.","카페인이 많이 함유된 음료는 건강에 좋지 않다."]],1,[]],["견주다","동사",0,"",[["둘 이상의 사물을 질(質)이나 양(量) 따위에서 어떠한 차이가 있는지 알기 위하여 서로 대어 보다.","나는 그와 실력을 견주기에는 부족함이 있다."]],1,[]],["차지다","형용사",0,"",[["반죽이나 밥, 떡 등이 끈기가 많다.","차진 면발.","لَزِجٌ"],["반죽이나 밥, 떡 따위가 끈기가 많다.","차진 흙."]],1,[]],["노랗다","형용사",0,"",[["색이 바나나나 레몬과 같다.","노란 병아리.","أَصْفَر"],["병아리나 개나리꽃과 같이 밝고 선명하게 노르다.","가을이면 은행잎이 노랗게 물든다."]],1,[]],["금하다(禁하다)","동사",0,"금할 금",[["어떤 일을 하지 못하게 하다.","교역을 금하다.","يَمْنَعُ"],["어떤 일을 하지 못하게 말리다.","기업인에게 사치품의 수입을 금하다."]],1,[]],["디디다","동사",0,"",[["발을 올려놓고 서다.","계단을 디디다.","يَقِفُ عَلَى الْأَقْدَام"],["발을 올려놓고 서거나 발로 내리누르다.","가볍게 계단을 디뎌도 삐걱거리는 소리가 났다."]],1,[]],["복종하다(服從하다)","동사",0,"옷 복, 좇을 종",[["남의 명령이나 의사를 그대로 따라서 좇다.","명령에 복종하다."]],1,[]],["끓어오르다","동사",0,"",[["액체가 끓어서 위로 솟아오르다.","국물이 끓어오르다.","يَنْفَجِرُ، يَتَفَجَّرُ"],["그릇의 물이 끓어서 넘으려고 올라오다.","주전자 물이 끓어올라 넘치고 있다."]],1,[]],["까불다","동사",0,"",[["잘난 체하고 분수에 맞지 않게 행동하다.","까부는 성격.","يَتَصَرَّفُ عَابِثًا (أَوْ طَائِشًا)"],["위아래로 흔들리다. 또는 그렇게 하다.","아기는 손을 까불면서 엄마를 오라고 한다."]],1,[]],["덥다","형용사",0,"",[["몸으로 느끼기에 기온이 높다.","더운 곳.","حَارّ"],["대기의 온도가 높다.","날씨가 덥다."]],1,[]],["똑똑하다","형용사",0,"",[["분명하고 확실하다.","똑똑한 목소리.","وَاضِحٌ"],["또렷하고 분명하다.","발음이 똑똑하다."]],1,[]],["캐내다","동사",0,"",[["땅속에 묻혀 있는 것을 파서 꺼내다.","감자를 캐내다.","تنقيب"],["땅속에 묻힌 광물이나 식물 따위의 자연 생산물을 파서 끄집어내다.","밭에서 감자를 캐내다."]],1,[]],["제출하다(提出하다)","동사",0,"끌 제, 날 출",[["문안(文案)이나 의견, 법안(法案) 따위를 내다.","보고서를 교수에게 제출하다."]],1,[]],["통일하다(統一하다)","동사",0,"거느릴 통, 한 일",[["나누어지거나 갈라진 것들을 합쳐서 하나가 되게 하다.","남북을 통일하다.","يُوَحِّدُ"],["나누어진 것들을 합쳐서 하나의 조직·체계 아래로 모이게 하다.","분단된 조국을 통일하다."],["여러 요소를 서로 같거나 일치되게 맞추다.","국론을 하나로 통일하다."]],1,[]],["개발하다(開發하다)","동사",0,"열 개, 필 발",[["토지나 천연자원 등을 이용하기 쉽거나 쓸모 있게 만들다.","관광 자원을 개발하다.","يُطَوِّرُ"],["토지나 천연자원 따위를 유용하게 만들다.","광산을 개발하다."],["새로운 물건을 만들거나 새로운 생각을 내어놓다.","세계 최초로 개발한 제품."]],1,[]],["꼼꼼하다","형용사",0,"",[["빈틈이 없이 차분하고 조심스럽다.","그는 매사를 꼼꼼하게 처리한다."]],1,[]],["작아지다","동사",0,"",[["작은 상태로 되다.","내가 들어가자 두 사람의 목소리는 갑자기 작아졌다."]],1,[]],["그을다","동사",0,"",[["햇볕이나 불, 연기 따위를 오래 쬐어 검게 되다.","햇볕에 얼굴이 검게 그을었다."]],1,[]],["춤추다","동사",0,"",[["음악이나 규칙적인 박자에 맞추어 몸을 움직이다.","춤추는 동작.","يَرْقُصُ"],["장단에 맞추거나 흥에 겨워 팔다리와 몸을 율동적으로 움직여 뛰놀다.","음악에 맞추어 춤추다."]],1,[]],["헐다","동사",0,"",[["몸에 상처 등이 나서 짓무르다.","입술이 헐다.","يَلْتَهِب"],["집 따위의 축조물이나 쌓아 놓은 물건을 무너뜨리다.","울타리를 헐다."],["저장하여 둔 물건을 꺼내거나 쓰기 시작하다.","며칠 전에 담근 동치미 독을 새로 헐었다."],["몸에 부스럼이나 상처 따위가 나서 짓무르다.","피곤하면 입안이 금방 헌다."]],1,[]],["통솔하다(統率하다)","동사",0,"거느릴 통, 비율 솔",[["무리를 거느려 다스리다.","김 선생이 학생들을 소풍 장소까지 통솔하기로 하였다."]],1,[]],["집중하다(集中하다)","동사",0,"모을 집, 가운데 중",[["한곳을 중심으로 하여 모이다. 또는 그렇게 모으다.","별장이 강가에 집중해 있다."]],1,[]],["딱하다","형용사",0,"",[["처해 있는 상황이나 형편이 불쌍하다.","딱한 처지.","مِسْكِين"],["사정이나 처지가 애처롭고 가엾다.","딱한 사정을 듣다."],["일을 처리하기가 난처하다.","두 사람 사이에서 그만 딱하게 되었다."]],1,[]],["공양하다(供養하다)","동사",0,"이바지할 공, 기를 양",[["어른에게 좋은 음식을 대접하며 잘 모시다.","부모를 공양하다.","يُرَاعِي"],["웃어른을 모시어 음식 이바지를 하다.","그 집 며느리는 늘 따뜻한 음식으로 시부모를 공양하였다."]],1,[]],["움츠리다","동사",0,"",[["몸이나 몸의 일부를 오그려 작아지게 하다.","움츠린 모습.","ينكمش"],["몸이나 몸의 일부를 몹시 오그리어 작아지게 하다.","철새들이 움츠렸던 날개를 펴고 날아올랐다."]],1,[]],["닮다","동사",0,"",[["둘 이상의 사람 또는 사물이 서로 비슷한 생김새나 성질을 지니다.","닮은 곳.","يُشْبِهُ"],["사람 또는 사물이 서로 비슷한 생김새나 성질을 지니다.","큰아버지는 할아버지와 많이 닮았다."]],1,[]],["업신여기다","동사",0,"",[["교만한 마음에서 남을 낮추어 보거나 하찮게 여기다.","함부로 남을 업신여기지 마라."]],1,[]],["야단스럽다(惹端스럽다)","형용사",0,"이끌 야, 끝 단",[["보기에 매우 떠들썩하게 일을 벌이거나 부산하게 법석거리는 데가 있다.","동생들이 야단스럽게 구는 통에 공부를 할 수가 없다."]],1,[]],["그리워하다","동사",0,"",[["사랑하여 몹시 보고 싶어 하다.","고향을 그리워하다."]],1,[]],["띄다","동사",0,"",[["눈에 보이다.","배려가 눈에 띄다.","يُوجَدُ"],["‘뜨이다02[1]「1」’의 준말.","합격했다는 소리를 듣고 눈이 번쩍 띄었다."],["‘뜨이다02[2]「1」’의 준말.","원고에 가끔 오자가 눈에 띈다."]],1,[]],["늘어뜨리다","동사",0,"",[["사물의 한쪽 끝을 아래로 처지게 하다.","꼬리를 길게 늘어뜨린 연."]],1,[]],["목적하다(目的하다)","동사",0,"눈 목, 과녁 적",[["어떤 것을 목적으로 삼다.","그들은 마침내 목적하였던 집에 다다랐다."]],1,[]],["틀리다","동사",0,"",[["계산이나 답, 사실 등이 맞지 않다.","틀린 말.","يرتكب خطأً، يُخطئ"],["셈이나 사실 따위가 그르게 되거나 어긋나다.","답이 틀리다."],["방향이 꼬이게 돌려지다. ‘틀다[1]「1」’의 피동사.","몸이 틀리다."]],1,[]],["감싸다","동사",0,"",[["둘러서 덮다.","감싸 주다.","تَلَفُّف"],["전체를 둘러서 싸다.","그는 상처에 붕대를 감쌌다."]],1,[]],["발달되다(發達되다)","동사",0,"필 발, 통달할 달",[["신체, 정서, 지능 등이 성장되거나 성숙되다.","감수성이 발달되다.","يَتَطَوَّرُ"],["학문, 기술, 문명, 사회 따위의 현상이 보다 높은 수준에 이르게 되다.","고도로 발달된 가공 기술."]],1,[]],["많아지다","동사",0,"",[["많게 되다.","나이가 많아져 힘든 일을 할 수가 없다."]],1,[]],["잡아당기다","동사",0,"",[["잡아서 끌어당기다.","방아쇠를 잡아당기다."]],1,[]],["돌려나다","동사",0,"",[["식물 줄기의 한 마디에 세 개 이상의 잎이 바퀴 모양으로 나다.",""]],1,[]],["빼내다","동사",0,"",[["박혀 있거나 끼워져 있는 것을 밖으로 나오게 하다.","벽에서 커다란 못을 빼내다.","يَنْزِعُ"],["박혀 있거나 끼워져 있는 것을 뽑다.","손바닥에서 가시를 빼내다."]],1,[]],["파악하다(把握하다)","동사",0,"잡을 파, 쥘 악",[["어떤 대상의 내용이나 본질을 확실하게 이해하여 알다.","주요 내용을 파악하다."]],1,[]],["미끄럽다","형용사",0,"",[["거침없이 저절로 밀려 나갈 정도로 번드럽다.","바닥이 미끄럽다."]],1,[]],["범하다(犯하다)","동사",0,"범할 범",[["법이나 규칙 등을 어기다.","계율을 범하다.","يُخَالِفُ"],["법률, 도덕, 규칙 따위를 어기다.","계율을 범하다."]],1,[]],["엎드리다","동사",0,"",[["배가 아래로 향하게 하여 몸 전체를 바닥에 대다.","엎드려 읽다.","ينبطح على بطنه"],["배를 바닥에 붙이거나 팔다리를 짚고 몸 전체를 길게 뻗다.","나는 날아오는 총탄을 피해 땅 위에 납작 엎드렸다."]],1,[]],["묘하다(妙하다)","형용사",0,"묘할 묘",[["모양이나 동작 등이 색다르고 신기하다.","묘한 모습.","غَرِيب"],["모양이나 동작이 색다르다.","묘하게 생기다."],["수완이나 재주 따위가 남달리 뛰어나거나 약빠르다.","묘한 수."]],1,[]],["가져오다","동사",0,"",[["어떤 물건을 한 곳에서 다른 곳으로 옮겨 오다.","돈을 가져오다."]],0,[]],["창건하다(創建하다)","동사",0,"비롯할 창, 세울 건",[["건물이나 조직체 따위를 처음으로 세우거나 만들다.","회사를 창건하다."]],1,[]],["평행하다(平行하다)","동사",0,"평평할 평, 다닐 행",[["서로 줄지어 나란히 가다.","평행하는 모습.","يصطف، يذهب جنبا إلى جنب"],["나란히 가다.","읍 길과 밤까싯길은 갈라져 가지고도 한 오 리 동안은 평행하는 길이다.≪이태준, 촌뜨기≫"]],1,[]],["이롭다(利롭다)","형용사",0,"이할 이",[["이익이 있다.","신상에 이롭다."],["끝이 뾰족하거나 날이 서서 날카롭다.","이로운 비수."]],1,[]],["용서하다(容恕하다)","동사",0,"얼굴 용, 용서할 서",[["지은 죄나 잘못한 일에 대하여 꾸짖거나 벌하지 아니하고 덮어 주다.","잘못을 용서하다."]],1,[]],["교화하다(敎化하다)","동사",0,"가르칠 교, 될 화",[["가르치고 이끌어서 좋은 방향으로 나아가게 하다.","죄수를 교화하다."]],1,[]],["여행하다(旅行하다)","동사",0,"나그네 여, 다닐 행",[["일이나 유람을 목적으로 다른 고장이나 외국에 가다.","기차를 타고 유럽을 여행하다."]],1,[]],["기뻐하다","동사",0,"",[["마음에 기쁨을 느끼다.","선물을 받은 아이가 뛸 듯이 기뻐했다."]],1,[]],["가엾다","형용사",0,"",[["마음이 아플 만큼 안되고 처연하다.","한꺼번에 부모와 형제를 모두 잃은 그 애가 가엾어 보인다."]],1,[]],["사소하다(些少하다)","형용사",0,"적을 사, 적을 소",[["보잘것없이 작거나 적다.","사소한 문제."]],1,[]],["대수롭다","형용사",0,"",[["중요하게 여길 만하다.","그게 뭐 그리 대수로운 일이라고 고민을 하니?"]],1,[]],["통합하다(統合하다)","동사",0,"거느릴 통, 합할 합",[["둘 이상의 조직이나 기구 따위를 하나로 합치다.","회장은 여러 계열사를 본사에 통합하고 싶어 했다."]],1,[]],["흐려지다","동사",0,"",[["기억력이나 판단력 등이 분명하지 않은 상태가 되다.","흐려진 판단력.","يلتبس"],["잡것이 섞여 깨끗하지 못하거나 잘 보이지 않게 되다.","흐려진 눈."]],0,[]],["부추기다","동사",0,"",[["다른 사람을 북돋아 어떤 행동을 하게 하다.","부추기는 행동.","يُحَرِّض"],["남의 마음을 일으켜 어떤 일을 하게 만들다.","그는 가만히 있는 사람들을 부추겨 분란을 일으켰다."]],1,[]],["계획하다(計劃하다/計畫하다)","동사",0,"셀 계, 그을 획 / 셀 계, 그림 획",[["앞으로 할 일의 절차, 방법, 규모 따위를 미리 헤아려 작정하다.","거사를 치밀하게 계획하다."]],1,[]],["병들다(病들다)","동사",0,"병 병",[["몸에 병이 생기다.","병든 몸."]],1,[]],["임명되다(任命되다)","동사",0,"맡길 임, 목숨 명",[["일정한 지위나 임무가 맡겨지다.","장관에 임명되다."]],1,[]],["날쌔다","형용사",0,"",[["동작이 날래고 재빠르다.","날쌘 솜씨."]],1,[]],["축축하다","형용사",0,"",[["물기가 있어 젖은 듯하다.","비를 맞아서 머리가 축축하다."]],1,[]],["따라가다","동사",0,"",[["앞에서 가는 것을 뒤에서 그대로 쫓아가다.","뒤를 따라가다.","يُلَاحِقُ"],["다른 사람이나 동물의 뒤에서, 그가 가는 대로 가다.","형의 뒤를 따라가다."]],1,[]],["돌아보다","동사",0,"",[["고개를 뒤쪽으로 돌려서 보다.","뒤를 돌아보다."]],0,[]],["흡수되다(吸收되다)","동사",0,"마실 흡, 거둘 수",[["안이나 속으로 빨려 들어가다.","흡수된 물.","يُمتصّ"],["빨려서 거두어지다.","옷에 흡수된 땀은 해롭기 때문에 옷을 자주 갈아입는 것이 좋다."]],1,[]],["변변하다","형용사",0,"",[["사람의 생김새나 됨됨이 등이 보통을 넘는 상태이다.","변변한 사람.","جَيِّد"],["됨됨이나 생김새 따위가 흠이 없고 어지간하다.","변변한 얼굴."]],1,[]],["여닫다","동사",0,"",[["문 따위를 열고 닫고 하다.","문을 여닫다."]],1,[]],["뜨겁다","형용사",0,"",[["어떤 것의 온도가 높다.","뜨거운 국물.","حَارّ"],["손이나 몸에 상당한 자극을 느낄 정도로 온도가 높다.","뜨거운 물."]],1,[]],["기대다","동사",0,"",[["몸이나 물건을 무엇에 의지하여 비스듬히 대다.","머리를 기대다.","يَسْتَنِد"],["몸이나 물건을 무엇에 의지하면서 비스듬히 대다.","난간에 몸을 기대는 것은 위험하다."]],1,[]],["설법하다(說法하다)","동사",0,"말씀 설, 법 법",[["불교의 교의를 풀어 밝히다.","그는 부처의 가르침을 사람들에게 설법하기 위하여 그 지역에 머무르고 있었다."]],1,[]],["진하다(津하다)","형용사",0,"나루 진",[["액체가 묽지 않고 농도가 짙다.","진한 국물.","كَثِيف"],["액체의 농도가 짙다.","진한 고깃국."]],1,[]],["구제하다(救濟하다)","동사",0,"구원할 구, 건널 제",[["자연적인 재해나 사회적인 피해를 당하여 어려운 처지에 있는 사람을 도와주다.","많은 사람들을 실직에서 구제하다."]],1,[]],["무시하다(無視하다)","동사",0,"없을 무, 볼 시",[["중요하게 생각하지 않다.","경고를 무시하다.","يُهْمِلُ"],["사물의 존재 의의나 가치를 알아주지 아니하다.","신호등을 무시하고 길을 건너다."]],1,[]],["넘어뜨리다","동사",0,"",[["바로 선 사람이나 사물을 쓰러지게 하다.","나무를 넘어뜨리다.","يُسَقِّط"],["바로 선 것을 넘어지게 하다.","의자를 바닥에 넘어뜨리다."]],1,[]],["밀리다","동사",0,"",[["처리하지 못한 일이나 물건이 쌓이다.","방세가 밀리다.","يُؤَخِّرُ"],["일정한 방향으로 움직이도록 반대쪽에서 힘이 가해지다. ‘밀다01[1]「1」’의 피동사.","사람들에게 밀려 넘어지다."],["바닥이나 거죽의 지저분한 것이 문질려 깎이거나 닦이다. ‘밀다01[1]「2」’의 피동사.","때가 물에 불어 겹으로 밀렸다."]],1,[]],["망명하다(亡命하다)","동사",0,"망할 망, 목숨 명",[["혁명 또는 그 밖의 정치적인 이유로 자기 나라에서 박해를 받고 있거나 박해를 받을 위험이 있는 사람이 이를 피하기 위하여 외국으로 몸을 옮기다.","일제의 탄압이 격심해짐에 따라 이를 피하여 해외로 망명하는 사람들이 늘어났다."],["죽을죄를 지은 사람이 몸을 숨겨 멀리 도망하다.",""]],1,[]],["통제하다(統制하다)","동사",0,"거느릴 통, 절제할 제",[["어떤 방침이나 목적에 따라 행위를 하지 못하게 막다.","통제하는 방법.","يسيطر، يراقب"],["일정한 방침이나 목적에 따라 행위를 제한하거나 제약하다.","출입을 통제하다."]],1,[]],["흐트러지다","동사",0,"",[["따로따로 흩어져 이리저리 얽히다.","흐트러진 머리카락.","يتشعّث"],["여러 가닥으로 흩어져 이리저리 얽히다.","흐트러진 머리칼을 가다듬다."]],1,[]],["헤어지다","동사",0,"",[["같이 있던 사람과 떨어지다.","헤어진 곳.","يُفارق ، يفترق"],["모여 있던 사람들이 따로따로 흩어지다.","나는 일행과 헤어져 집으로 왔다."],["뭉치거나 붙어 있는 물체가 따로따로 흩어지거나 떨어지다.","줄이 끊어지면서 구슬들이 바닥에 헤어져 버렸다."]],1,[]],["나무라다","동사",0,"",[["잘못을 꾸짖어 잘 알아듣게 말하다.","무례함을 나무라다.","يُؤَنِّبُ"],["상대방의 잘못이나 부족한 점을 꼬집어 말하다.","아이의 잘못을 호되게 나무라다."]],1,[]],["금지하다(禁止하다)","동사",0,"금할 금, 그칠 지",[["법이나 규칙이나 명령 따위로 어떤 행위를 하지 못하도록 하다.","입산을 금지하다."]],1,[]],["성립되다(成立되다)","동사",0,"이룰 성, 설 립",[["일이나 관계 따위가 제대로 이루어지다.","매매 계약이 성립되다."]],1,[]],["거슬리다","동사",0,"",[["순순히 받아들여지지 않고 언짢은 느낌이 들며 기분이 상하다.","그의 말이 귀에 거슬렸다."]],1,[]],["중대하다(重大하다)","형용사",0,"무거울 중, 클 대",[["가볍게 여길 수 없을 만큼 매우 중요하고 크다.","중대한 결정."]],1,[]],["일어서다","동사",0,"",[["앉았다가 서다.","자리에서 일어서다."]],1,[]],["꾸다","동사",0,"",[["잠을 자는 동안에 꿈속에서 실제처럼 보고 듣고 느끼고 하다.","길몽을 꾸다.","يَحْلُم"],["꿈을 보다.","꿈을 꾸다."]],1,[]],["관측하다(觀測하다)","동사",0,"볼 관, 헤아릴 측",[["자연 현상을 기계를 이용하거나 눈으로 자세히 살펴보아 어떤 사실을 짐작하거나 알아 내다.","관측한 결과.","يُرَاقِب"],["육안이나 기계로 자연 현상 특히 천체나 기상의 상태, 추이, 변화 따위를 관찰하여 측정하다.","새로 쏘아 올린 인공위성은 우주에서 지구 표면의 상태를 관측하게 될 것이다."]],1,[]],["배열되다(配列되다/排列되다)","동사",0,"나눌 배, 벌일 열 / 밀칠 배, 벌일 열",[["일정한 차례나 간격에 따라 벌여져 놓이다.","질서 정연하게 배열되어 있는 물건."]],1,[]],["돌이키다","동사",0,"",[["원래의 방향에서 반대로 방향을 바꾸다.","고개를 돌이키다.","يَنْعَطِفُ"],["원래 향하고 있던 방향에서 반대쪽으로 돌리다.","발길을 돌이키다."]],1,[]],["처형되다(處刑되다)","동사",0,"곳 처, 형벌 형",[["형벌에 처하여지다.",""]],1,[]],["따라다니다","동사",0,"",[["남의 뒤를 쫓아서 다니다.","그녀에게는 늘 경호원들이 그림자처럼 따라다닌다."]],1,[]],["천하다(賤하다)","형용사",0,"천할 천",[["사회적 위치나 신분 등이 낮다.","천한 사람.","حقير، وضيع"],["지체, 지위 따위가 낮다.","천한 가문에 태어나다."],["너무 흔하여 귀하지 아니하다.","그는 길거리의 천해 빠진 시계를 나에게 선물하였다."]],1,[]],["젓다","동사",0,"",[["액체나 가루 등이 고르게 퍼지거나 섞이도록 손이나 기구 등으로 이리저리 돌리다.","커피를 젓다.","يمزج بالتحريك"],["팔이나 어깨 따위 신체의 일부를 일정한 방향으로 계속해서 움직이다.","그는 팔을 힘차게 저으며 걸었다."]],1,[]],["뒤지다","동사",0,"",[["앞사람과 거리가 떨어져 뒤에 있다.","병사들은 훈련용 장갑차에서 일 미터쯤 뒤져 걷고 있었다.","يَتَلَكّأُ"],["걸음이 남에게 뒤떨어지다.","그는 선생님보다 서너 걸음 뒤져 걸었다."],["무엇을 찾으려고 샅샅이 들추거나 헤치다.","가방을 뒤지다."]],1,[]],["위태롭다(危殆롭다)","형용사",0,"위태할 위, 거의 태",[["어떤 형세가 마음을 놓을 수 없을 만큼 위험한 듯하다.","병이 위독하여 목숨이 위태롭다."]],1,[]],["구분되다(區分되다)","동사",0,"구분할 구, 나눌 분",[["일정한 기준에 따라 전체가 몇 개로 갈리어 나뉘다.","현대 종교의 내세관은 선과 악에 의한 천국과 지옥으로 구분된다."]],1,[]],["만지다","동사",0,"",[["어떤 곳에 손을 대어 움직이다.","만지는 손.","يَلْمِسُ"],["손을 대어 여기저기 주무르거나 쥐다.","몸을 만지다."]],1,[]],["가누다","동사",0,"",[["몸이나 몸의 일부를 바르게 하다.","고개를 가누다.","يَحْفَظُ التَّوَازُن"],["몸을 바른 자세로 가지다.","아기는 아직 목을 가누지 못한다."]],1,[]],["통달하다(通達하다)","동사",0,"통할 통, 통달할 달",[["말이나 글로 알리다.","통달한 내용.","ينقل، يعلم، يسلّم"],["말이나 문서로써 기별하여 알리다.","이 법령에 관한 경고를 각 지주에게 통달한 줄 아는데 당신은 아직 그 통고문을 못 보셨습니까?≪현진건, 조국≫"],["사물의 이치나 지식, 기술 따위를 훤히 알거나 아주 능란하게 하다.","한문과 불경에 통달하다."]],1,[]],["어그러지다","동사",0,"",[["잘 맞물려 있는 물체가 틀어져서 맞지 아니하다.","이사를 하면서 장롱의 문짝이 어그러져서 잘 닫히지 않는다."]],1,[]],["지지하다(支持하다)","동사",0,"지탱할 지, 가질 지",[["어떤 사람이나 단체 등이 내세우는 주의나 의견 등에 찬성하고 따르다.","확고하게 지지하다.","يُؤَيّدُ"],["무거운 물건을 받치거나 버티다.","허물어진 담을 버팀목으로 지지하다."]],1,[]],["주창하다(主唱하다)","동사",0,"임금 주, 부를 창",[["사상, 이론, 주의 등을 앞장서서 주장하다.","민주주의를 주창하다.","يدعو إلى"],["주의나 사상을 앞장서서 주장하다.","입헌 군주제를 주창하다."],["노래나 시 따위를 앞장서서 부르다.","음악 수업은 한 학생이 노래를 주창하면 다른 학생들이 따라 부르는 식으로 진행되었다."]],1,[]],["팽팽하다","형용사",0,"",[["물체가 늘어지지 않고 힘 있게 곧게 펴져 있다.","팽팽한 밧줄.","مَشْدُود، متماسك"],["줄 따위가 늘어지지 않고 힘 있게 곧게 펴져서 튀기는 힘이 있다.","말고삐를 팽팽하게 잡아당기다."]],1,[]],["내려앉다","동사",0,"",[["아래로 내려와 앉다.","나비가 내려앉다.","يَجْلِس نَازِلًا"],["먼지, 새, 비행기 따위가 아래로 내려와 앉다.","참새가 나뭇가지에 내려앉다."]],1,[]],["정제하다(整齊하다)","동사",0,"가지런할 정, 가지런할 제",[["정돈하여 가지런히 하다.","모든 장수들은 황망히 술자리를 치운 뒤에 단정히 입고 군사들을 정제하여 엄숙히 진문에 나아가 봉명한 선전관을 맞아들인다.≪박종화, 임진왜란≫"]],1,[]],["용감하다(勇敢하다)","형용사",0,"날랠 용, 감히 감",[["용기가 있으며 씩씩하고 기운차다.","용감한 군사."]],1,[]],["검푸르다","형용사",0,"",[["검은빛을 띠면서 푸르다.","풀들은 푸른색이 지나쳐서 검푸르게 변해 갔고, 나무들은 솜을 펼쳐 놓은 듯이 완만한 곡선을 그리며 숲을 이루었다.≪한수산, 유민≫"]],1,[]],["기름지다","형용사",0,"",[["음식물이 기름기가 많다.","기름진 고기.","دُهْنِيّ"],["음식물 따위에 기름기가 많다.","기름진 음식."]],1,[]],["키우다","동사",0,"",[["동식물을 보살펴 자라게 하다.","꽃을 키우다.","يُرَبِّي"],["동식물을 돌보아 기르다. ‘크다[Ⅱ]「1」’의 사동사.","정성 들여 키운 작물."]],1,[]],["숙이다","동사",0,"",[["머리나 몸을 앞으로 기울어지게 하다.","고개를 숙이다.","يَنْحَنِي"],["앞으로나 한쪽으로 기울게 하다. ‘숙다「1」’의 사동사.","머리를 숙여 인사하다."]],1,[]],["걱정하다","동사",0,"",[["안심이 되지 않아 속을 태우다.","가족들은 서로를 걱정해 준다."]],1,[]],["가지런하다","형용사",0,"",[["여럿이 층이 나지 않고 고르게 되어 있다.","알이 총총 들어박힌 옥수수를 연상케 하는 가지런한 이를 내보이며….≪윤흥길, 장마≫"]],1,[]],["충분하다(充分하다)","형용사",0,"채울 충, 나눌 분",[["모자람이 없이 넉넉하다.","그 문제를 푸는 데 10분이면 충분하겠지?"]],1,[]],["가다듬다","동사",0,"",[["마음이나 정신 등을 바로잡다.","마음을 가다듬다.","يَضْبِطُ"],["정신, 생각, 마음 따위를 바로 차리거나 다잡다.","정신을 가다듬고 다시 한번 해 봐."]],1,[]],["다음가다","동사",0,"",[["표준으로 삼는 등급이나 차례의 바로 뒤에 가다.","이 옷감은 품질이 비단에 다음가는 좋은 것이다."]],1,[]],["생성되다(生成되다)","동사",0,"날 생, 이룰 성",[["사물이 생겨나다.","유독성 물질이 생성되다."]],1,[]],["운영하다(運營하다)","동사",0,"옮길 운, 경영할 영",[["조직이나 기구, 사업체 따위를 관리하고 운용하다.","대기업에서 운영하는 대형마트."]],1,[]],["주관하다(主管하다)","동사",0,"임금 주, 대롱 관",[["어떤 일을 책임을 지고 맡아 관리하다.","해당 업무를 주관하는 관청."]],1,[]],["출발하다(出發하다)","동사",0,"날 출, 필 발",[["어떤 곳을 향하여 길을 떠나다.","출발한 기차.","يَنْطَلِق"],["목적지를 향하여 나아가다.","지금 곧 서울로 출발하겠습니다."]],1,[]],["휘두르다","동사",0,"",[["이리저리 마구 흔들다.","휘두른 주먹.","يُلَوِّح"],["이리저리 마구 내두르다.","칼을 휘두르다."]],1,[]],["뛰어넘다","동사",0,"",[["몸을 솟구쳐서 어떤 물건이나 장소를 넘다.","담을 뛰어넘다.","يَثِبُ (فَوْقَ)"],["몸을 솟구쳐서 높거나 넓은 물건이나 장소를 넘다.","장애물을 뛰어넘다."]],1,[]],["분별하다(分別하다)","동사",0,"나눌 분, 다를 별",[["종류나 성질이 다른 것을 구별하여 가르다.","분별한 물질.","يُمَيِّزُ"],["서로 다른 일이나 사물을 구별하여 가르다.","주위가 어두워 형체를 분별할 수 없다."]],1,[]],["만족하다(滿足하다)","형용사",0,"찰 만, 발 족",[["마음에 흡족하다.","만족한 얼굴."],["모자람이 없이 넉넉하다.","만족한 생활을 즐기다."]],1,[]],["밝혀지다","동사",0,"",[["빛을 내는 물건이 환하게 되다.","불이 대낮처럼 밝혀져 있는데도 집 안은 인기척 하나 없이 동굴 속처럼 괴괴하다.≪홍성원, 육이오≫"]],1,[]],["온전하다(穩全하다)","형용사",0,"편안할 온, 온전할 전",[["본래의 모습이 그대로 고스란히 있다.","온전한 상태.","على حاله"],["본바탕 그대로 고스란하다.","싸움에 진 자가 어찌 그 터전이 온전하길 바라겠소?≪이문열, 황제를 위하여≫"]],1,[]],["팔리다","동사",0,"",[["값을 받고 물건이나 권리가 다른 사람에게 넘겨지거나 노력 등이 제공되다.","물건이 팔리다.","يُبَاع"],["값을 받고 물건이나 권리 따위가 남에게 넘겨지거나 노력 따위가 제공되다. ‘팔다[1]「1」’의 피동사.","외국인에게 잘 팔리는 상품."]],1,[]],["다시다","동사",0,"",[["음식을 먹을 때처럼 침을 삼키며 입을 놀리다.","아저씨는 아쉬운 듯 입맛만 쩍쩍 다셨다."]],1,[]],["치밀다","동사",0,"",[["아래에서 위로 세차게 솟아오르다.","치미는 기운.","يَرْتَفِعُ"],["아래에서 위로 힘차게 솟아오르다.","뜨거운 열기가 위로 치밀다."],["아래에서 위로 힘차게 밀어 올리다.","내리막길로 굴러 내려가려는 차를 힘껏 치밀어 보았지만 혼자서는 감당할 수가 없었다."]],1,[]],["싱겁다","형용사",0,"",[["음식의 짠 맛이 적다.","싱거운 맛.","غير مالح"],["음식의 간이 보통 정도에 이르지 못하고 약하다.","물을 많이 넣어 국이 싱겁다."]],1,[]],["불쾌하다(不快하다)","형용사",0,"아닐 불, 쾌할 쾌",[["못마땅하여 기분이 좋지 아니하다.","불쾌한 감정."],["몸이 찌뿌드드하고 좋지 않다.","감기 몸살로 몸이 불쾌하다."]],1,[]],["자그마하다","형용사",0,"",[["조금 작다.","자그마한 집."]],1,[]],["동그랗다","형용사",0,"",[["또렷하게 동글다.","동그란 안경."]],1,[]],["곁들이다","동사",0,"",[["한 음식에 어울리는 다른 음식을 함께 내어 놓다.","과일을 곁들이다.","يُقَدِّمُ الطَّعَامَ مَعَ الطَّعَامِ المُلَائِم"],["남이 하는 일이나 말을 좀 거들어 주게 하다. ‘곁들다[2]「2」’의 사동사.",""],["주로 하는 일 외에 다른 일을 겸하여 하다.","노래에 춤을 곁들이다."]],1,[]],["여물다","동사",0,"",[["과실이나 곡식 등이 알이 들어 딴딴하게 잘 익다.","여문 곡식.","يَنْضَجُ"],["과실이나 곡식 따위가 알이 들어 딴딴하게 잘 익다.","알이 잘 여문 옥수수."]],1,[]],["흔하다","형용사",0,"",[["보통보다 더 자주 있거나 일어나서 쉽게 접할 수 있다.","흔한 이름."]],1,[]],["근심하다","동사",0,"",[["해결되지 않은 일 때문에 속을 태우거나 우울해하다.","아버님은 틀림없이 내 처신을 근심하고 계셔….≪박경리, 토지≫"]],1,[]],["관계하다(關係하다)","동사",0,"관계할 관, 맬 계",[["어떤 방면이나 영역에 관련을 맺고 있다.","이번 일에 관계하고 있는 분들은 대체로 어느 부서에 소속된 분들입니까?"]],1,[]],["끼어들다","동사",0,"",[["자기 순서나 자리가 아닌 틈 사이를 비집고 들어서다.","남의 사이에 끼어들다."]],1,[]],["고이다","동사",0,"",[["우묵한 곳이나 좁은 넓이의 공간에 액체나 냄새, 기체 등이 모이다.","고인 물.","تَجَمُّع"],["기울어지거나 쓰러지지 않도록 아래를 받쳐 안정시키다.","손으로 턱을 고이다."],["물 따위의 액체나 가스, 냄새 따위가 우묵한 곳에 모이다.","웅덩이에 물이 고이다."]],1,[]],["대항하다(對抗하다)","동사",0,"대할 대, 겨룰 항",[["굽히거나 지지 않으려고 맞서서 버티거나 항거하다.","외세의 침략에 무력으로 대항하는 의병."]],1,[]],["채취하다(採取하다)","동사",0,"캘 채, 가질 취",[["자연에서 나는 것을 베거나 캐거나 하여 얻다.","골재를 채취하다.","يجمع، يحصد"],["풀, 나무, 광석 따위를 찾아 베거나 캐거나 하여 얻어 내다.","사금을 채취하다."]],1,[]],["원망하다(怨望하다)","동사",0,"원망할 원, 바랄 망",[["못마땅하게 여기어 탓하거나 불평을 품고 미워하다.","친구를 원망하다."]],1,[]],["격렬하다(激烈하다)","형용사",0,"격할 격, 매울 렬",[["말이나 행동이 세차고 사납다.","격렬한 논쟁."]],1,[]],["손질하다","동사",0,"",[["어떤 것을 손으로 매만져서 잘 다듬다.","가구를 손질하다.",""],["손을 대어 잘 매만지다.","법을 손질하다."]],1,[]],["가입하다(加入하다)","동사",0,"더할 가, 들 입",[["조직이나 단체 따위에 들어가거나, 서비스를 제공하는 상품 따위를 신청하다.","노조에 가입하다."]],1,[]],["흉악하다(凶惡하다/兇惡하다)","형용사",0,"흉할 흉, 악할 악 / 흉악할 흉, 악할 악",[["성질이나 언행이 악하고 모질다.","우리는 하늘을 대신해서 흉악한 탐관과 인도에서 어긋난 천륜을 바로잡기 위해 하늘의 명으로 일어서게 된 것이오.≪유현종, 들불≫"]],1,[]],["괴롭히다","동사",0,"",[["몸이나 마음이 편하지 않고 고통스럽게 하다. ‘괴롭다’의 사동사.","날 좀 그만 괴롭히고 가만 내버려둬."]],1,[]],["모여들다","동사",0,"",[["여럿이 어떤 범위 안을 향하여 오다.","군중이 광장에 모여든다."]],1,[]],["서두르다","동사",0,"",[["일을 빨리 하려고 침착하지 못하고 급하게 행동하다.","서두르는 기색.","يَتَسَرَّعُ فِي"],["일을 빨리 해치우려고 급하게 바삐 움직이다.","서둘러 떠나자."]],1,[]],["비탈지다","형용사",0,"",[["땅이 경사가 급하게 기울어져 있다.","비탈진 언덕."]],1,[]],["규정되다(規定되다)","동사",0,"법 규, 정할 정",[["규칙으로 정해지다.","학칙에 규정되어 있는 대로 수업 일수를 준수하다."]],1,[]],["응용하다(應用하다)","동사",0,"응할 응, 쓸 용",[["어떤 이론이나 이미 얻은 지식을 구체적인 개개의 사례나 다른 분야의 일에 적용하여 이용하다.","과학 지식을 실생활에 응용하다."]],1,[]],["찾아내다","동사",0,"",[["찾기 어려운 사람이나 물건을 찾아서 드러내다.","매장지를 찾아내다.","يكتشف، يجد"],["찾기 어려운 사람이나 사물을 찾아서 드러내다.","감춰 둔 보물을 찾아내다."]],1,[]],["조리다","동사",0,"",[["고기, 생선, 채소 등을 양념해서 국물이 거의 남지 않게 바짝 끓이다.","감자를 조리다.","يَغْلِي"],["양념을 한 고기나 생선, 채소 따위를 국물에 넣고 바짝 끓여서 양념이 배어들게 하다.","생선을 조리다."]],1,[]],["수선스럽다","형용사",0,"",[["정신이 어지럽게 떠들어 대는 듯하다.","싸늘한 저녁 바람이 대숲을 훑을 때마다 댓잎 서걱대는 소리가 수선스러웠고….≪김원일, 불의 제전≫"]],1,[]],["흘겨보다","동사",0,"",[["흘기는 눈으로 보다.","어머니는 음식에 먼저 손을 대는 나를 흘겨보시며 작은 소리로 꾸짖으셨다."]],1,[]],["친근하다(親近하다)","형용사",0,"친할 친, 가까울 근",[["사이가 매우 가깝다.","친근한 사이.","ودّي، حميم"],["사귀어 지내는 사이가 아주 가깝다.","그는 이웃과 친근하게 지내 왔다."]],1,[]],["꺼내다","동사",0,"",[["안에 있는 물건을 밖으로 나오게 하다.","담배를 꺼내다.","يَسْحَبُ"],["속이나 안에 들어 있는 물건 따위를 손이나 도구를 이용하여 밖으로 나오게 하다.","호주머니에서 동전을 꺼내다."]],1,[]],["꿰뚫다","동사",0,"",[["이쪽에서 저쪽으로 구멍을 뚫다.","화살이 꿰뚫다.","يَخْرِقُ"],["이쪽에서 저쪽까지 꿰어서 뚫다.","총알이 심장을 꿰뚫다."]],1,[]],["혼합하다(混合하다)","동사",0,"섞을 혼, 합할 합",[["뒤섞어서 한데 합하다.","여인숙과 민박을 혼합한 것 같은 더러운 여관방을 꼬박꼬박 호텔이라 부르는 아우에게….≪박완서, 우황청심환≫"]],1,[]],["실행하다(實行하다)","동사",0,"열매 실, 다닐 행",[["실제로 행하다.","약속을 실행하다."]],1,[]],["설정하다(設定하다)","동사",0,"베풀 설, 정할 정",[["새로 만들어 정해 두다.","마음속에 목표를 설정하다."]],1,[]],["빨아들이다","동사",0,"",[["액체나 기체 등을 안으로 끌어당기거나 흡수하다.","공기를 빨아들이다.","يَمْتَصُّ"],["수분, 양분, 기체 따위를 끌어들이거나 흡수하다.","담배 연기를 빨아들이다."]],1,[]],["중얼거리다","동사",0,"",[["남이 알아듣지 못할 정도의 작고 낮은 목소리로 혼잣말을 자꾸 하다.","혼잣말을 들릴 듯 말 듯 중얼거리다."]],1,[]],["불편하다(不便하다)","형용사",0,"아닐 불, 편할 편",[["이용하기에 편리하지 않다.","불편한 의자.","مُضَايِق"],["몸이나 마음이 편하지 아니하고 괴롭다.","저는 다리가 불편해서 좀 앉겠습니다."]],1,[]],["참석하다(參席하다)","동사",0,"참여할 참, 자리 석",[["모임이나 회의 따위의 자리에 참여하다.","회식에 참석하다."]],1,[]],["젖히다","동사",0,"",[["뒤로 기울게 하다.","가지를 젖히다.","يسحب إلى الخلف ، يحني للوراء"],["뒤로 기울게 하다. ‘젖다02’의 사동사.","나뭇가지를 잡아 뒤로 젖히다."],["안쪽이 겉으로 나오게 하다.","코트 자락을 젖히고 앉다."]],1,[]],["관련하다(關聯하다/關連하다)","동사",0,"관계할 관, 연이을 련 / 관계할 관, 이을 련",[["둘 이상의 사람, 사물, 현상 따위가 서로 관계를 맺어 매여 있다.","교육 개혁안과 관련한 논평."]],1,[]],["등지다","동사",0,"",[["서로 사이가 나빠지다.","등진 관계.","يَقْطَعُ عَلَاقَات"],["등 뒤에 두다.","벽을 등지고 서다."]],1,[]],["이웃하다","동사",0,"",[["나란히 또는 가까이 있어 경계가 서로 붙어 있다.","지리산과 이웃한 도시."]],1,[]],["파괴되다(破壞되다)","동사",0,"깨뜨릴 파, 무너질 괴",[["부서지거나 깨뜨려져 무너지다.","파괴된 건물.","يَتَدَمَّرُ"],["부서지거나 깨뜨려져 헐리다.","건물이 파괴되다."]],1,[]],["엄숙하다(嚴肅하다)","형용사",0,"엄할 엄, 엄숙할 숙",[["의식이나 분위기 등이 무겁고 조용하다.","엄숙한 기도.","رصين، مَهيب"],["분위기나 의식 따위가 장엄하고 정숙하다.","현충일 기념 의식이 엄숙하게 거행되었다."],["말이나 태도 따위가 위엄이 있고 정중하다.","그렇게 소탈하던 사람이 어디에서 그런 엄숙하고 무거운 것이 생겨났는지 알 수가 없었다."]],1,[]],["검질기다","형용사",0,"",[["성질이나 행동이 몹시 끈덕지고 질기다.","검질기게 달라붙다."]],1,[]],["탄식하다(歎息하다/嘆息하다)","동사",0,"탄식할 탄, 쉴 식 / 탄식할 탄, 쉴 식",[["한탄하여 한숨을 쉬다.","어지러운 세상을 탄식하다."]],1,[]],["돋아나다","동사",0,"",[["해, 달, 별 등이 하늘에 또렷하게 솟아오르다.","샛별이 돋아나다.","يَبْزُغُ"],["속에 생긴 것이 겉으로 또렷이 나오거나 나타나다.","양지에 파릇파릇한 새싹이 돋아나기 시작했다."]],1,[]],["돌아가시다","동사",0,"",[["(높임말로) 생명을 잃다.","어머니께서 돌아가시다."]],0,[]],["퇴화하다(退化하다)","동사",0,"물러날 퇴, 될 화",[["발전하기 이전의 상태로 되돌아가다.","능력이 퇴화하다.","ينحطّ، يتراجع"],["진보 이전의 상태로 되돌아가다.","경제 논리로 학문을 평가한다면 일부 순수 학문은 퇴화할 것이다."]],1,[]],["똑같다","형용사",0,"",[["사물의 모양, 분량, 성질 등이 서로 조금도 다른 데가 없다.","간격이 똑같다.","مُتَسَاوٍ"],["모양, 성질, 분량 따위가 조금도 다른 데가 없다.","양쪽에 똑같은 수를 더하다."]],1,[]],["추천하다(推薦하다)","동사",0,"밀 추, 천거할 천",[["어떤 조건에 적합한 대상을 책임지고 소개하다.","선생님께서 나를 이 회사에 추천하셨다."]],1,[]],["적합하다(適合하다)","형용사",0,"맞을 적, 합할 합",[["일이나 조건 따위에 꼭 알맞다.","벼농사에 적합한 기후."]],1,[]],["즉위하다(卽位하다)","동사",0,"곧 즉, 자리 위",[["임금이 될 사람이 예식을 치른 뒤 임금의 자리에 오르다.","선왕이 돌아가시고 세자가 왕으로 즉위하였다."]],1,[]],["조심스럽다(操心스럽다)","형용사",0,"잡을 조, 마음 심",[["잘못이나 실수가 없도록 말이나 행동에 마음을 쓰는 태도가 있다.","조심스러운 태도."]],1,[]],["아첨하다(阿諂하다)","동사",0,"언덕 아, 아첨할 첨",[["남의 환심을 사거나 잘 보이려고 알랑거리다.","집권 세력에 아첨하는 무리."]],1,[]],["가파르다","형용사",0,"",[["경사가 심하게 기울어져 있다.","가파른 비탈길."]],0,[]],["완곡하다(婉曲하다)","형용사",0,"순할 완, 굽을 곡",[["말하는 투가, 듣는 사람의 감정이 상하지 않도록 모나지 않고 부드럽다.","완곡한 표현."]],1,[]],["같이하다","동사",0,"",[["다른 사람과 어떤 일을 함께 하면서 시간을 보내다.","생사를 같이하다.","يَقْضِي مَعًا"],["경험이나 생활 따위를 얼마 동안 더불어 하다.","나와 일생을 같이할 사람."],["어떤 뜻이나 행동 또는 때 따위를 서로 동일하게 취하다.","그와 의견을 같이하다."]],1,[]],["제기하다(提起하다)","동사",0,"끌 제, 일어날 기",[["의견이나 문제를 내놓다.","문제를 제기하다.","يُقَدِّمُ"],["의견이나 문제를 내어놓다.","의문을 제기하다."]],1,[]],["오가다","동사",0,"",[["무엇을 주고받기를 되풀이하다.","대화가 오가다.",""],["거리나 길을 오거니 가거니 하다.","거리에는 수많은 사람이 오가고 있다."]],1,[]],["제한하다(制限하다)","동사",0,"절제할 제, 한할 한",[["일정한 한도를 정하거나 그 한도를 넘지 못하게 막다.","차량 통행을 제한하다."]],1,[]],["안정되다(安定되다)","동사",0,"편안 안, 정할 정",[["바뀌어 달라지지 아니하고 일정한 상태가 유지되다.","안정된 생활."]],1,[]],["쬐다","동사",0,"",[["햇볕이 들어 비치다.","볕이 쬐다.","يشمّس"],["볕이 들어 비치다.","내 방에는 햇볕이 잘 쬐지 않는다."],["볕이나 불기운 따위를 몸에 받다.","모닥불을 쬐다."]],1,[]],["전사하다(轉寫하다)","동사",0,"구를 전, 베낄 사",[["글이나 그림 등을 옮겨 베끼다.","전사한 내용.","يَنْسَخُ"],["글이나 그림 따위를 옮기어 베끼다.",""]],1,[]],["계승하다(繼承하다)","동사",0,"이을 계, 이을 승",[["조상의 전통이나 문화, 업적 등을 물려받아 계속 이어 나가다.","가업을 계승하다.","يَرِثُ"],["조상의 전통이나 문화유산, 업적 따위를 물려받아 이어 나가다.","우리가 계승해야 할 민족 문화의 전통."]],1,[]],["의심하다(疑心하다)","동사",0,"의심할 의, 마음 심",[["확실히 알 수 없어서 믿지 못하다.","함부로 남을 의심하는 것은 좋지 않다."]],1,[]],["빨갛다","형용사",0,"",[["피나 익은 고추와 같이 밝고 짙게 붉다.","빨간 노을."]],1,[]],["맵다","형용사",0,"",[["고추나 겨자처럼 맛이 화끈하고 혀끝을 쏘는 느낌이 있다.","매운 요리.","حَارّ"],["고추나 겨자와 같이 맛이 알알하다.","매운 김치."]],1,[]],["안타깝다","형용사",0,"",[["뜻대로 되지 아니하거나 보기에 딱하여 가슴 아프고 답답하다.","이번 시합에서 우승을 놓친 것이 안타깝다."]],1,[]],["흐뭇하다","형용사",0,"",[["마음에 흡족하여 매우 만족스럽다.","흐뭇한 기분."]],1,[]],["수많다(數많다)","형용사",0,"셈 수",[["수효가 매우 많다.","그 가수는 수많은 관객을 열광시켰다."]],1,[]],["예스럽다","형용사",0,"",[["옛것과 같은 맛이나 멋이 있다.","예스러운 한문 투."]],1,[]],["상쾌하다(爽快하다)","형용사",0,"시원할 상, 쾌할 쾌",[["느낌이 시원하고 산뜻하다.","상쾌한 아침."]],1,[]],["펼치다","동사",0,"",[["펴서 드러내다.","책을 펼치다."]],1,[]],["폭발하다(暴發하다)","동사",0,"사나울 폭, 필 발",[["속에 쌓여 있던 감정 등이 한꺼번에 거세게 쏟아져 나오다.","분노가 폭발하다.","يَنْفَجِر"],["힘이나 열기 따위가 갑작스럽게 퍼지거나 일어나다.","수요가 폭발하다."]],1,[]],["기초하다(基礎하다)","동사",0,"터 기, 주춧돌 초",[["근거를 두다.","정의에 기초한 새 질서의 확립."]],1,[]],["수놓다(繡놓다)","동사",0,"수놓을 수",[["바늘에 색실을 꿰어 헝겊에 무늬나 그림, 글자를 떠서 놓다.","꽃무늬를 수놓다.","يُطَرِّزُ"],["여러 가지 색실을 바늘에 꿰어 피륙에 그림, 글씨, 무늬 따위를 떠서 놓다.","꽃과 나비를 수놓은 치마."]],1,[]],["휘어지다","동사",0,"",[["곧은 물체가 어떤 힘을 받아서 구부러지다.","철근이 더위에 휘어져 쓸 수가 없었다."]],1,[]],["헤치다","동사",0,"",[["속에 든 것이 겉으로 드러나도록 덮인 부분을 파거나 젖히다.","헤친 구덩이.","يَقْلِبُ"],["속에 든 물건을 드러나게 하려고 덮인 것을 파거나 젖히다.","그는 상의 단추를 끄르고 가슴을 풀어 헤쳤다."],["모인 것을 제각기 흩어지게 하다.","여기 모인 사람들을 헤쳐 제각기 음식을 사 먹게 농가나 근처의 마을로 보내시는 게 좋겠습니다.≪이문열, 사람의 아들≫"]],1,[]],["원만하다(圓滿하다)","형용사",0,"둥글 원, 찰 만",[["성격이 부드럽고 너그럽다.","원만한 분위기.","ودودي"],["성격이 모난 데가 없이 부드럽고 너그럽다.","원만한 성품."],["일의 진행이 순조롭다.","일을 원만하게 처리하다."]],1,[]],["치환되다(置換되다)","동사",0,"둘 치, 바꿀 환",[["바뀌어 놓이다.","타인의 이야기가 나의 이야기로 치환될 때 공감이 시작된다."]],1,[]],["벗겨지다","동사",0,"",[["덮이거나 씌워진 것 등이 외부의 힘에 의하여 걷히거나 젖혀지다.","모자가 벗겨지다.","يَنْتَزِعُ"],["덮이거나 씌워진 물건이 외부의 힘에 의하여 떼어지거나 떨어지다.","신발이 꽉 끼어 잘 벗겨지지 않는다."]],1,[]],["편집하다(編輯하다)","동사",0,"엮을 편, 모을 집",[["일정한 방침 아래 여러 가지 재료를 모아 신문, 잡지, 책 따위를 만들다. 또는 영화 필름이나 녹음테이프, 문서 따위를 하나의 작품으로 완성하다.","그가 맡은 일은 교내 신문을 편집하는 것이었다."]],1,[]],["싱싱하다","형용사",0,"",[["시들거나 상하지 않고 생기가 있다.","싱싱한 굴.","طري، طازج"],["시들거나 상하지 아니하고 생기가 있다.","생선이 싱싱하다."]],1,[]],["쏟다","동사",0,"",[["그릇 등에 담겨 있는 액체나 물질이 밖으로 나오게 하다.","기름을 쏟다.","يَصُبُّ"],["액체나 물질을 그것이 들어 있는 용기에서 바깥으로 나오게 하다.","바닥에 물을 쏟다."]],1,[]],["제한되다(制限되다)","동사",0,"절제할 제, 한할 한",[["일정한 한도가 정하여지거나 그 한도가 초과되지 못하게 막히다.","제한된 범위 안에서 활동하다."]],1,[]],["도망하다(逃亡하다)","동사",0,"도망할 도, 망할 망",[["피하거나 쫓기어 달아나다.","그에게서 도망할 틈을 엿봤다."]],1,[]],["터뜨리다","동사",0,"",[["무엇을 둘러싸고 있는 표면을 눌러서 터지게 하다.","물집을 터뜨리다."]],0,[]],["펴지다","동사",0,"",[["접히거나 말려 있는 것이 젖혀져 벌어지게 되다.","날개가 펴지다.","يَنْتَشِرُ"],["접히거나 개킨 것이 젖혀져 벌어지게 되다.","우산이 펴지다."]],1,[]],["끌어당기다","동사",0,"",[["끌어서 가까이 오게 하다.","금속을 끌어당기다."]],0,[]],["쓸다","동사",0,"",[["밀어 내어 한데 모아 치우다.","쓸어 담다.","يَكْنُسُ"],["비로 쓰레기 따위를 밀어 내거나 한데 모아서 버리다.","방을 쓸다."]],1,[]],["찾아가다","동사",0,"",[["사람을 만나거나 어떤 일을 하러 가다.","선생님을 찾아가다.","يَزُور"],["볼일을 보거나 특정한 사람을 만나기 위하여 그와 관련된 곳으로 가다.","설날에 선생님 댁에 찾아가서 세배를 드렸다."],["잃거나 맡기거나 빌려주었던 것을 돌려받아 가지고 가다.","물품 보관소에서 가방을 찾아가다."]],1,[]],["가늘어지다","동사",0,"",[["가늘게 되다.","산록을 돌면서 곧장 뻗어 온 넓은 길은 여기서는 실낱처럼 가늘어져 가지고 그대로 산허리를 감싸며 기어오르고 있었다.≪강신재, 해방촌 가는 길≫"]],1,[]],["뒤떨어지다","동사",0,"",[["앞사람과 거리가 떨어져 뒤에 있다.","뒤떨어져 걷다.","يَتَخَلَّفُ"],["어떤 것의 뒤에 떨어져 거리를 두다.","다른 사람보다 뒤떨어져서 걸어갔다."]],1,[]],["비싸다","형용사",0,"",[["물건값이나 어떤 일을 하는 데 드는 비용이 보통보다 높다.","비싼 값.","غَالٍ"],["물건값이나 사람 또는 물건을 쓰는 데 드는 비용이 보통보다 높다.","값이 비싸다."]],1,[]],["기리다","동사",0,"",[["뛰어난 업적이나 바람직한 정신, 위대한 사람 따위를 칭찬하고 기억하다.","선열의 뜻을 기리다."]],1,[]],["발사하다(發射하다)","동사",0,"필 발, 쏠 사",[["활·총포·로켓이나 광선·음파 따위를 쏘다.","최루탄을 학생들에게 발사하다."]],1,[]],["평정하다(平定하다)","동사",0,"평평할 평, 정할 정",[["반란이나 폭동 등을 누르고 조용하고 편안한 상태로 만들다.","나라를 평정하다.","يَقمع، يخمد"],["반란이나 소요를 누르고 평온하게 진정하다.","반란을 평정하다."],["적을 쳐서 자기에게 예속되게 하다.","우리가 무사히 삼한을 평정하고 요동의 옛 땅을 회복한들 저 아득한 우주에 비해 무엇이겠소?≪이문열, 황제를 위하여≫"]],1,[]],["게우다","동사",0,"",[["삼킨 것을 입 밖으로 도로 내놓다.","게워 내다.","يَتَيَّأُ"],["먹은 것을 삭이지 못하고 도로 입 밖으로 내어놓다.","갓난아이가 젖을 게우다."]],1,[]],["경솔하다(輕率하다)","형용사",0,"가벼울 경, 비율 솔",[["말이나 행동이 조심성 없이 가볍다.","경솔한 말."]],1,[]],["절다","동사",0,"",[["재료에 소금, 식초, 설탕 등이 배어들다.","전 음식.","يتبَّل"],["푸성귀나 생선 따위에 소금기나 식초, 설탕 따위가 배어들다.","배추가 소금에 절다."],["한쪽 다리가 짧거나 다쳐서 걸을 때에 몸을 한쪽으로 기우뚱거리다.","다리를 절뚝절뚝 절며 걸어가다."]],1,[]],["몰리다","동사",0,"",[["어떤 것이 어떤 방향이나 장소로 움직여 가게 되다.","구석으로 몰리다.","يَنْدَفِعُ إِلَى"],["원하지 않는 처지나 방향으로 떠밀리다. ‘몰다[1]’의 피동사.","구석으로 몰리다."],["여럿이 한곳으로 모여들다.","입구로만 몰리는 청중들."]],1,[]],["깃다","동사",0,"",[["논밭에 잡풀이 많이 나다.","풀만 수북이 깃은 다랑논마다 마른갈이와 헛삶이를 하였다.≪이문구, 산 너머 남촌≫"]],1,[]],["접촉하다(接觸하다)","동사",0,"이을 접, 닿을 촉",[["서로 맞닿다.","자동차가 급정거하는 바람에 앞에 서 있던 아가씨와 불가피하게 접촉하게 된 적이 있었다."]],1,[]],["작동하다(作動하다)","동사",0,"지을 작, 움직일 동",[["기계 따위가 작용을 받아 움직이다. 또는 기계 따위를 움직이게 하다.","화재 감지기가 작동하다."]],1,[]],["표현되다(表現되다)","동사",0,"겉 표, 나타날 현",[["생각이나 느낌 따위가 언어나 몸짓 따위의 형상으로 드러나 나타내어지다.","자신이 성실하지 못하다는 식으로 표현되는 것을 좋아할 사람은 아무도 없다."]],1,[]],["능숙하다(能熟하다)","형용사",0,"능할 능, 익을 숙",[["능하고 익숙하다.","외국어에 능숙하다."]],1,[]],["맺어지다","동사",0,"",[["관계나 인연 따위가 이루어지거나 만들어지다.","그와는 끈끈한 의리로 맺어져 있다."]],1,[]],["물들이다","동사",0,"",[["빛깔이 서서히 퍼지거나 옮아서 묻게 하다.","머리카락을 물들이다.","يَصْبُغُ"],["빛깔이 스미게 하거나 옮아서 묻게 하다. ‘물들다「1」’의 사동사.","평소 대낮에는 불을 켜지 않던 가게도 오늘은 날씨가 흐린 탓인지 불을 밝혀 놓고 가게 안의 물건들을 따뜻한 빛으로 물들여 놓고 있었다.≪정연희, 소리가 짓는 둥지≫"]],1,[]],["기술하다(記述하다)","동사",0,"기록할 기, 펼 술",[["대상이나 과정의 내용과 특징을 있는 그대로 열거하거나 기록하여 서술하다.","언어를 기술하다."]],1,[]],["선택하다(選擇하다)","동사",0,"가릴 선, 가릴 택",[["여럿 가운데서 필요한 것을 골라 뽑다.","글을 쓸 때에는 목적에 맞는 글감을 잘 선택하고, 이를 효과적으로 표현하는 것이 중요하다."]],1,[]],["시집가다(媤집가다)","동사",0,"시집 시",[["여자가 결혼하여 남의 아내가 되다.","평강 공주는 바보 온달에게 시집갔다."]],1,[]],["트이다","동사",0,"",[["막혀 있던 것이 치워지고 통하게 되다.","트인 경치.","يفتتح، يُبدأ"],["막혀 있던 것이 치워지고 통하게 되다. ‘트다02[1]「1」’의 피동사.","시야가 확 트인 집."]],1,[]],["집행하다(執行하다)","동사",0,"잡을 집, 다닐 행",[["실제로 시행하다.","각종 사업을 집행하다."]],1,[]],["원통하다(冤痛하다)","형용사",0,"원통할 원, 아플 통",[["분하고 억울하다.","나는 뜻을 이루지 못하고 죽는 것이 원통하였다."]],1,[]],["떠돌다","동사",0,"",[["한곳에 오래 머물지 않고 이곳저곳을 옮겨 다니다.","거리를 떠돌다.","يَتَرَحَّلُ"],["정한 곳 없이 이곳저곳을 옮겨 다니다.","배를 타고 바다를 떠돌다."]],1,[]],["묵직하다","형용사",0,"",[["다소 큰 물건이 보기보다 꽤 무겁다.","묵직한 호주머니.","يَثْقُلُ"],["다소 큰 물건이 보기보다 제법 무겁다.","묵직한 바구니."]],1,[]],["건설하다(建設하다)","동사",0,"세울 건, 베풀 설",[["건물이나 시설을 새로 짓다.","고속 도로를 건설하다.","يُنْشِئُ"],["건물, 설비, 시설 따위를 새로 만들어 세우다.","강 상류에 댐을 건설하다."]],1,[]],["밀접하다(密接하다)","형용사",0,"빽빽할 밀, 이을 접",[["아주 가깝게 맞닿아 있다. 또는 그런 관계에 있다.","글을 읽는 과정은 글을 쓰는 과정과 밀접한 관련이 있다."]],1,[]],["통합되다(統合되다)","동사",0,"거느릴 통, 합할 합",[["여러 요소들이 조직되어 하나의 전체가 이루어지다.",""]],1,[]],["내디디다","동사",0,"",[["서 있다가 앞쪽으로 발을 옮기다.","걸음을 내디디다.","يَخْطِي خُطْوَة إِلَى الْأَمَام"],["밖이나 앞쪽으로 발을 옮겨 현재의 위치에서 다른 장소로 이동하다.","그는 그 자리에서 몸이 굳어 한 발자국도 내디디지 못했다."]],1,[]],["차분하다","형용사",0,"",[["마음이 가라앉아 조용하다.","차분한 성격."]],1,[]],["마땅하다","형용사",0,"",[["어떤 조건에 잘 어울리거나 적당하다.","마땅한 사람.","مُنَاسِب"],["행동이나 대상 따위가 일정한 조건에 어울리게 알맞다.","이 일을 처리할 마땅한 사람이 없다."],["그렇게 하거나 되는 것이 이치로 보아 옳다.","죄를 지은 사람은 벌을 받아 마땅하다."]],1,[]],["사냥하다","동사",0,"",[["사람이 산이나 들에 나가 총이나 활 등으로 짐승을 잡다.","곰을 사냥하다.","يَصْطَاد"],["총이나 활 또는 길들인 매나 올가미 따위로 산이나 들의 짐승을 잡다.","사냥꾼이 동물을 사냥하다."]],1,[]],["밝아지다","동사",0,"",[["밝게 되다.","표정이 밝아지다."]],1,[]],["트다","동사",0,"",[["너무 마르거나 추워서 틈이 생기고 갈라지다.","논바닥이 트다.","يتشقّق الجلد"],["막혀 있던 것을 치우고 통하게 하다.","길을 트다."]],1,[]],["예상하다(豫想하다)","동사",0,"미리 예, 생각 상",[["어떤 일을 직접 당하기 전에 미리 생각하여 두다.","비가 올 것을 예상하고는 우산을 들고 나갔다."]],1,[]],["지시하다(指示하다)","동사",0,"가리킬 지, 보일 시",[["어떤 것을 가리켜서 보게 하다.","지시한 방향.","يُعَلِّمُ"],["가리켜 보게 하다.","그는 내가 걸어갈 길을 지시하여 주었다."],["일러서 시키다.","관계 기관에 대책 마련을 지시하다."]],1,[]],["표시되다(標示되다)","동사",0,"표할 표, 보일 시",[["표가 되어 외부에 드러나 보이다.","상품의 한 면에는 수입품이라는 것이 표시되어 있었다."]],1,[]],["거북하다","형용사",0,"",[["움직임이나 몸의 기능이 자연스럽지 못하거나 불편한 느낌이 있다.","배가 거북하다.","مُنْزَعِج"],["몸이 찌뿌드드하고 괴로워 움직임이 자연스럽지 못하거나 자유롭지 못하다.","나는 속이 거북해서 점심을 걸렀다."],["마음이 어색하고 겸연쩍어 편하지 않다.","나는 지금 입장이 매우 거북하다."]],1,[]],["짤막하다","형용사",0,"",[["조금 짧은 듯하다.","짤막한 인사말."]],1,[]],["미세하다(微細하다)","형용사",0,"작을 미, 가늘 세",[["분간하기 어려울 정도로 아주 작다.","미세한 분말."]],1,[]],["공손하다(恭遜하다)","형용사",0,"공손할 공, 겸손할 손",[["말이나 행동이 겸손하고 예의 바르다.","공손한 말씨."]],1,[]],["걸어가다","동사",0,"",[["목적지를 향하여 다리를 움직여 나아가다.","그쪽으로 걸어가다.","يَمْشِي"],["목적지를 향하여 발로 걸어서 나아가다.","학교에 걸어가다."]],1,[]],["틀어지다","동사",0,"",[["어떤 것이 휘거나 꼬여서 반듯하고 곧바르지 않게 되다.","나무가 틀어지다.","يَلْتَوِي"],["어떤 물체가 반듯하고 곧바르지 아니하고 옆으로 굽거나 꼬이다.","줄이 틀어지다."]],1,[]],["치환하다(置換하다)","동사",0,"둘 치, 바꿀 환",[["바꾸어 놓다.","정치적인 의미의 억압은 내게 있어서는 그런 여러 일부에 지나지 않습니다. 그런데 그 일부를 전부로 치환하라고 강요하면 짜증이 나지요.≪이문열, 시대와의 불화≫"]],1,[]],["드리우다","동사",0,"",[["천이나 줄 등이 아래로 늘어지다. 또는 그렇게 되게 하다.","가지가 드리우다.","يُدَلّى"],["한쪽이 위에 고정된 천이나 줄 따위가 아래로 늘어지다. 또는 그렇게 되게 하다.","창가에 커튼이 드리우다."]],1,[]],["개량하다(改良하다)","동사",0,"고칠 개, 어질 량",[["나쁜 점을 보완하여 더 좋게 고치다.","벼의 종자를 다품종 종자로 개량하다."]],1,[]],["냄새나다","동사",0,"",[["신선하지 않은 생선이나 더러운 옷, 몸 따위에서 좋지 않은 기운이 나오다.","오래됐는지 생선에서 냄새난다."]],1,[]],["다물다","동사",0,"",[["입술이나 그처럼 두 쪽으로 마주 보는 물건을 꼭 맞대다.","입을 꼭 다물다."]],1,[]],["고정되다(固定되다)","동사",0,"굳을 고, 정할 정",[["한번 정한 내용이 변경되지 않다.","고정된 수입.","يَثْبَتُ"],["한곳에 꼭 붙어 있거나 붙어 있게 되다.","벽에 고정된 액자가 흔들릴 정도의 지진이 발생했다."]],1,[]],["따다","동사",0,"",[["달려 있거나 붙어 있는 것을 잡아서 뜯거나 떼다.","꽃을 따다.","يَجْنِي،يَقْطِفُ"],["붙어 있는 것을 잡아떼다.","사과나무에서 사과를 따다."]],1,[]],["이상하다(異常하다)","형용사",0,"다를 이, 떳떳할 상",[["정상적인 것과 다르다.","날씨가 이상하다.","غَرِيب"],["정상적인 상태와 다르다.","이상한 일."]],1,[]],["강력하다(強力하다)","형용사",0,"강할 강, 힘 력",[["힘이나 영향이 강하다.","강력한 군대."]],0,[]],["나부끼다","동사",0,"",[["천, 종이, 머리카락 따위의 가벼운 물체가 바람을 받아서 가볍게 흔들리다. 또는 그렇게 하다.","깃발이 나부끼다."]],1,[]],["소중하다(所重하다)","형용사",0,"바 소, 무거울 중",[["매우 귀중하다.","나는 무엇보다 가족이 소중하다."]],1,[]],["검붉다","형용사",0,"",[["검은빛을 띠면서 붉다.","검붉은 노을."]],1,[]],["어쩌다","동사",0,"",[["무엇을 어떻게 하다.","이거, 미안해서 어쩌나.","يفعل شيئًا"],["‘어찌하다「2」’의 준말.","미안해서 어쩌나."],["‘무슨’, ‘웬’의 뜻을 나타낸다.","어쩐 일로 전화하셨소?"]],1,[]],["둥글넓적하다","형용사",0,"",[["생김새가 둥글면서 넓적하다.","둥글넓적한 접시."]],1,[]],["불어오다","동사",0,"",[["바람이 이쪽으로 불다.","태풍은 대만을 거쳐 우리나라에도 불어왔다."]],1,[]],["닫히다","동사",0,"",[["열린 문이나 뚜껑, 서랍 등이 다시 제자리로 가게 되다.","금고가 닫히다."]],0,[]],["갇히다","동사",0,"",[["사람이나 동물이 벽으로 둘러싸이거나 울타리가 있는 일정한 장소에 넣어져 밖으로 나오지 못하게 되다. ‘가두다「1」’의 피동사.","감옥에 갇히다."]],1,[]],["의거하다(依據하다)","동사",0,"의지할 의, 근거 거",[["어떤 사실이나 원리 등에 근거하다.","경험에 의거하다.","يَقُومُ عَلَى"],["어떤 사실이나 원리 따위에 근거하다.","관습에 의거하다."],["어떤 힘을 빌려 의지하다.","폭력적 수단에 의거하다."]],1,[]],["끌리다","동사",0,"",[["바닥에 댄 채로 잡아당겨져 움직여지다.","바지가 끌리다.","يَنْجَرُّ"],["다른 힘에 의해 잡아당겨지다.","끌려서 가다."]],0,[]],["달래다","동사",0,"",[["다른 사람을 어르거나 타일러 힘든 감정이나 기분을 가라앉게 하다.","달래서 재우다.","يُرَوِّحُ عَنْ"],["슬퍼하거나 고통스러워하거나 흥분한 사람을 어르거나 타일러 기분을 가라앉히다.","우는 아이를 달래다."],["좋고 옳은 말로 잘 이끌어 꾀다.","이언방 처를 불러 감언이설로 달래 보겠소만, 보나 마나 헛수고일 게 틀림없소.≪현기영, 변방에 우짖는 새≫"]],1,[]],["반투명하다(半透明하다)","형용사",0,"반 반, 사무칠 투, 밝을 명",[["빛이 또렷하게 통하지 않아 반대쪽이 흐릿하게 보이는 성질이 있다.","반투명한 그릇.","نِصْف شَفَّاف"],["어떤 물체를 통하여 볼 때에 그 반대쪽이 흐릿하게 보이는 성질이 있다.",""],["한쪽에서 보면 다른 쪽이 환히 보이지만 반대쪽에서 보면 이쪽이 전혀 보이지 않는 성질이 있다.",""]],1,[]],["결성하다(結成하다)","동사",0,"맺을 결, 이룰 성",[["조직이나 단체 따위를 짜서 만들다.","노동조합을 결성하다."]],1,[]],["하십시오하다","동사",0,"",[["하십시오체의 말씨를 쓰다.",""]],1,[]],["적절하다(適切하다)","형용사",0,"맞을 적, 끊을 절",[["꼭 알맞다.","적절하지 못한 행동."]],1,[]],["고약하다","형용사",0,"",[["맛, 냄새 등이 역하거나 매우 좋지 않다.","고약한 냄새.","كَرِيه"],["맛, 냄새 따위가 비위에 거슬리게 나쁘다.","생선이 썩는 고약한 냄새."],["성미, 언행 따위가 사납다.","고약한 심보."]],1,[]],["내쉬다","동사",0,"",[["숨을 밖으로 내보내다.","한숨을 푹 내쉬다."]],1,[]],["들여오다","동사",0,"",[["밖에서 안으로 가져오다.","그가 직접 밥상을 방 안에 들여왔다."]],1,[]],["굴러가다","동사",0,"",[["굴러서 가다.","굴러가는 돌멩이.","يَتَدَحْرَجُ"],["어떤 곳을 굴러서 가다.","공이 운동장으로 굴러가다."]],1,[]],["창설하다(創設하다)","동사",0,"비롯할 창, 베풀 설",[["기관이나 단체 따위를 처음으로 베풀다.","해군을 창설하다."]],1,[]],["체포되다(逮捕되다)","동사",0,"잡을 체, 잡을 포",[["형법에서, 사람의 신체에 대하여 직접적이고 현실적인 구속이 가하여져 행동의 자유를 빼앗기다.","지하철에서 소매치기를 하던 소매치기 일당이 경찰에게 현행범으로 체포되었다."]],1,[]],["간편하다(簡便하다)","형용사",0,"대쪽 간, 편할 편",[["간단하고 편리하다.","이 물건은 접을 수 있어서 가지고 다니는 데 간편하다."]],1,[]],["평안하다(平安하다)","형용사",0,"평평할 평, 편안 안",[["걱정이나 탈이 없다. 또는 무사히 잘 있다.","집안이 평안하다."]],1,[]],["반복되다(反復되다)","동사",0,"돌이킬 반, 회복할 복",[["같은 일이 되풀이되다.","똑같은 일이 여러 차례 반복되다."]],1,[]],["매만지다","동사",0,"",[["손으로 만져 모양을 다듬다.","매만진 머리.","يُشَذِّبُ"],["잘 가다듬어 손질하다.","머리를 매만지다."],["부드럽게 어루만지다.","강아지를 매만지다."]],1,[]],["그러다","동사",0,"",[["앞에서 일어난 일이나 말한 것과 같이 그렇게 하다.","설거지는 내가 할 테니까 우선 좀 쉬라는데도 그러네.",""],["그렇게 말하다.","그가 바빠서 가지 못하겠다고 그러거든 나에게 전화해 달라고 해라."]],1,[]],["풍기다","동사",0,"",[["냄새가 나다. 또는 냄새를 퍼뜨리다.","악취가 풍기다."]],1,[]],["나빠지다","동사",0,"",[["나쁘게 되다.","사정이 더욱 나빠졌다."]],1,[]],["쳐다보다","동사",0,"",[["아래에서 위를 올려 보다.","나무를 쳐다보다.","يطمح بصرَهُ إليه"],["위를 향하여 올려보다.","밤하늘의 별을 쳐다보다."]],1,[]],["실리다","동사",0,"",[["무엇이 운반되기 위하여 차, 배, 비행기 등에 올려져 놓이다.","실린 화물.","يَشْحَنُ"],["옮겨지기 위하여 탈것, 수레, 비행기, 짐승의 등 따위에 올려지다. ‘싣다「1」’의 피동사.","달구지에 실린 관은 아무도 울며 붙들지 않았기 때문에….≪박완서, 도시의 흉년≫"]],1,[]],["불행하다(不幸하다)","형용사",0,"아닐 불, 다행 행",[["행복하지 아니하다.","불행한 사람."]],1,[]],["타이르다","동사",0,"",[["잘 깨닫도록 일의 이치를 밝혀 말해 주다.","떼를 쓰는 아이를 아무리 타이르고 가르쳐도 말짱 헛수고다."]],1,[]],["파괴하다(破壞하다)","동사",0,"깨뜨릴 파, 무너질 괴",[["때려 부수거나 깨뜨려 무너뜨리다.","건물을 파괴하다.","يُدَمِّرُ"],["때려 부수거나 깨뜨려 헐어 버리다.","기물을 파괴하다."]],1,[]],["유지되다(維持되다)","동사",0,"벼리 유, 가질 지",[["어떤 상태나 상황이 그대로 보존되거나 변함없이 계속되어 지탱되다.","질서가 유지되다."]],1,[]],["잔인하다(殘忍하다)","형용사",0,"남을 잔, 참을 인",[["인정이 없고 아주 모질다.","잔인하게 짓밟히다."]],1,[]],["올라오다","동사",0,"",[["낮은 곳에서 높은 곳으로 오다.","꼭대기로 올라오다."]],0,[]],["내밀리다","동사",0,"",[["몸이나 물체의 일부분이 밖이나 앞으로 나가게 되다.","고개가 내밀리다.","يَبْرُزُ"],["신체나 물체의 일부분이 밖이나 앞으로 나가게 되다. ‘내밀다[1]「1」’의 피동사.","그 연장 망태기는 톱과 장도리 따위들이 찢겨진 틈 사이로 비죽이 내밀려 있었다."],["돈이나 물건이 건네지다. ‘내밀다[2]「1」’의 피동사.","우리들에게 내밀린 것은 언뜻 보기에도 돈봉투였다."]],1,[]],["두텁다","형용사",0,"",[["신의, 믿음, 관계, 인정 따위가 굳고 깊다.","두터운 은혜."]],1,[]],["어색하다(語塞하다)","형용사",0,"말씀 어, 막힐 색",[["잘 모르거나 별로 만나고 싶지 않았던 사람과 마주 대하여 불편하고 자연스럽지 못하다.","어색한 관계.","غَيْر مُلَائِم"],["잘 모르거나 아니면 별로 만나고 싶지 않았던 사람과 마주 대하여 자연스럽지 못하다.","나는 낯모르는 여자와 단둘이 앉아 있는 게 아무래도 어색하였다."],["격식이나 규범, 관습 따위에 맞지 아니하여 자연스럽지 아니하다.","어색한 문장."]],1,[]],["잘록하다","형용사",0,"",[["기다란 물건의 한 군데가 패어 들어가 오목하다.","모가지가 잘록한 망태기."]],1,[]],["공통되다(共通되다)","동사",0,"한가지 공, 통할 통",[["둘 또는 그 이상의 여럿 사이에 두루 통하고 관계되다.","모든 물체에 공통된 성질은 과연 있을까?"]],1,[]],["내뿜다","동사",0,"",[["속에 있는 기체나 액체 등을 밖으로 세차게 밀어 내다.","분수가 내뿜다.","يَبْصُق، يَلْفِظ"],["속에 있는 것을 밖으로 향하여 세차게 밀어 내다.","담배 연기를 내뿜다."]],1,[]],["도착하다(到着하다)","동사",0,"이를 도, 붙을 착",[["목적한 곳에 다다르다.","목적지에 도착하다."]],1,[]],["착하다","형용사",0,"",[["언행이나 마음씨가 곱고 바르며 상냥하다.","착한 일."]],1,[]],["기여하다(寄與하다)","동사",0,"부칠 기, 더불 여",[["도움이 되도록 이바지하다.","국가와 사회의 발전에 기여하다."]],1,[]],["거둥하다(擧動▽하다)","동사",0,"들 거, 움직일 동",[["임금이 나들이하다.","왕이 사찰에 거둥하여 등을 밝혔다."]],1,[]],["들어서다","동사",0,"",[["어떤 장소 안으로 이제 막 옮겨 서다.","고속 도로로 들어서다.","يَدْخُلُ"],["밖에서 안쪽으로 옮겨 서다.","마을 어귀에 들어서다."]],1,[]],["추리다","동사",0,"",[["섞여 있는 것에서 여럿을 뽑아내거나 골라내다.","버려진 것 중에서 쓸 만한 것을 추렸다."]],1,[]],["찾아다니다","동사",0,"",[["어떤 목적을 이루기 위해 사람을 만나고 다니거나, 특정한 장소를 보러 여기저기 다니다.","가게를 찾아다니다.","يجد ويذهب"],["어떤 사람을 만나거나 어떤 곳을 보러 여기저기로 옮겨 다니다.","그는 전국을 돌며 딸을 찾아다녔지만 모두 허사였다."],["무엇을 얻기 위하여 여기저기로 옮겨 다니다.","그때까지도 장례는 키를 넘는 수숫대의 숲속에 묻힌 채 익은 수수 모가지를 찾아다니고 있었다.≪한승원, 앞산도 첩첩하고≫"]],1,[]],["악독하다(惡毒하다)","형용사",0,"악할 악, 독 독",[["마음이 흉악하고 독하다.","악독한 성격."]],1,[]],["움츠러들다","동사",0,"",[["몸이나 몸의 일부가 오그라져 들어가거나 작아지다.","움츠러드는 손발.","ينكمش"],["몸이나 몸의 일부가 몹시 오그라져 들어가거나 작아지다.","소년은 불안감에 저절로 목덜미가 움츠러들었다."]],1,[]],["타오르다","동사",0,"",[["불이 붙어 타기 시작하다.","타오르는 불길.","يشتعل، يحترق"],["불이 붙어 거세게 타기 시작하다.","불길이 타오르기 시작했다."]],1,[]],["찍히다","동사",0,"",[["날이 있는 연장 등으로 내리쳐지거나 끝이 뾰족한 것으로 찔러지다.","곡괭이에 찍히다.","يُطعن"],["바닥에 대고 눌려서 자국이 생기다. ‘찍다02[1]「1」’의 피동사.","그 계약서에 찍힌 도장은 내 것이다."]],1,[]],["골라내다","동사",0,"",[["여럿 가운데서 어떤 것을 골라서 따로 집어내다.","모래에서 사금을 골라내다."]],1,[]],["묶이다","동사",0,"",[["끈, 줄 등이 매듭지어지다.","끈이 묶이다.","يُرْبَطُ"],["사람이나 물건이 기둥, 나무 따위에 붙들려 매이다. ‘묶다[2]「1」’의 피동사.","다른 사람이 훔쳐 가지 못하게 자전거가 나무에 묶여 있었다."]],1,[]],["거만하다(倨慢하다)","형용사",0,"거만할 거, 거만할 만",[["잘난 체하며 남을 업신여기는 데가 있다.","거만한 표정."]],1,[]],["비난하다(非難하다)","동사",0,"아닐 비, 어려울 난",[["남의 잘못이나 결점을 책잡아서 나쁘게 말하다.","월숙은 모친에게서 그전부터 부친의 점잖지 못한 행위를 비난하는 말을 들어 왔다.≪이기영, 신개지≫"]],1,[]],["번지다","동사",0,"",[["액체가 묻어서 점점 더 넓게 젖어 퍼지다.","그림이 번지다.","يَنْتَشِرُ"],["액체가 묻어서 차차 넓게 젖어 퍼지다.","종이에 잉크가 번지다."]],1,[]],["지탱하다(支撐하다)","동사",0,"지탱할 지, 버틸 탱",[["오래 버티거나 배겨 내다.","생명을 지탱하다."]],1,[]],["완성되다(完成되다)","동사",0,"완전할 완, 이룰 성",[["완전히 다 이루어지다.","원고가 완성되다."]],1,[]],["억세다","형용사",0,"",[["마음먹은 것을 이루려는 뜻이나 행동이 굳고 세차다.","억센 성격.","قَوِيّ"],["마음먹은 바를 이루려는 뜻이나 행동이 억척스럽고 세차다.","수양의 성격이 본시 억센지라 형 되는 동궁을 떠밀어 가면서 일을 꾸며 나아가는….≪김동인, 대수양≫"],["생선의 뼈나 식물의 줄기·잎, 풀 먹인 천 따위가 아주 딱딱하고 뻣뻣하다.","잎들도 이제는 연초록빛에서 억세고 빳빳한 진초록빛으로 변해 있었다.≪홍성원, 육이오≫"]],1,[]],["성실하다(誠實하다)","형용사",0,"정성 성, 열매 실",[["정성스럽고 참되다.","성실한 태도."]],1,[]],["사모하다(思慕하다)","동사",0,"생각 사, 그릴 모",[["매우 간절히 생각하고 그리워하다.","사모하는 마음.","يَشْتَاقُ إِلَى"],["애틋하게 생각하고 그리워하다.","사모하는 사람."],["우러러 받들고 마음속 깊이 따르다.","그는 선생님을 학문적으로 사모하고 존경하는 정이 깊었다."]],1,[]],["저술하다(著述하다)","동사",0,"나타날 저, 펼 술",[["글이나 책 따위를 쓰다.","책을 저술하다."]],1,[]],["당당하다(堂堂하다)","형용사",0,"집 당, 집 당",[["모습이나 태도가 자신 있고 거리낌이 없이 떳떳하다.","당당한 태도.","جَلَالَة"],["남 앞에 내세울 만큼 모습이나 태도가 떳떳하다.","당당한 풍채."],["힘이나 세력이 크다.","세도가 당당하다."]],1,[]],["맛있다","형용사",0,"",[["음식의 맛이 좋다.","맛있는 과자."]],1,[]],["든든하다","형용사",0,"",[["어떤 것에 대한 믿음이 있어 마음이 힘차다.","마음이 든든하다.","مَوْثُوق"],["어떤 것에 대한 믿음으로 마음이 허전하거나 두렵지 않고 굳세다.","아이를 든든하게 키우다."],["물건이나 몸이 실하다.","든든한 밧줄로 묶어 두어라."]],1,[]],["무릅쓰다","동사",0,"",[["힘들고 어려운 일을 참고 견디다.","부끄러움을 무릅쓰다."]],1,[]],["불안하다(不安하다)","형용사",0,"아닐 불, 편안 안",[["마음이 편하지 않고 걱정되다.","불안한 기색.","يَقْلَقُ"],["마음이 편하지 아니하다.","서동수는 이쪽이 다섯밖에 안 되는 것이 갑자기 좀 불안했으나 천연스럽게 다가갔다.≪송기숙, 암태도≫"]],1,[]],["논다","동사",0,"",[["‘노느다’의 준말.","형제들과 땅을 논다."]],1,[]],["만족스럽다(滿足스럽다)","형용사",0,"찰 만, 발 족",[["매우 만족할 만한 데가 있다.","나는 그 결과가 매우 만족스럽다."]],1,[]],["배척하다(排斥하다)","동사",0,"밀칠 배, 물리칠 척",[["따돌리거나 거부하여 밀어 내치다.","외세를 배척하다."]],1,[]],["사들이다","동사",0,"",[["물건 따위를 사서 들여오다.","그는 농민들한테서 주변의 토지를 헐값으로 사들여 대농장을 만들었다."]],1,[]],["부임하다(赴任하다)","동사",0,"다다를 부, 맡길 임",[["임명이나 발령을 받아 근무할 곳으로 가다.","나는 김 선생보다 1년 먼저 이 학교에 부임하였다."]],1,[]],["경망스럽다(輕妄스럽다)","형용사",0,"가벼울 경, 망령될 망",[["행동이나 말이 가볍고 조심성 없는 데가 있다.","경망스러운 태도."]],1,[]],["바스러지다","동사",0,"",[["깨어져 조금 잘게 조각이 나다.","푸석한 흙덩이를 손에 쥐니 힘없이 바스러진다."]],1,[]],["되풀이되다","동사",0,"",[["같은 말이나 일이 자꾸 반복되다. 또는 같은 사태가 자꾸 일어나다.","매일 되풀이되는 일."]],1,[]],["조르다","동사",0,"",[["둘러 묶거나 감은 것을 단단히 조이다.","목을 조르다.","يَشُدُّ"],["동이거나 감은 것을 단단히 죄다.","허리띠를 조르다."]],1,[]],["개이다","동사",0,"",[["→ 개다01.",""]],1,[]],["살해되다(殺害되다)","동사",0,"죽일 살, 해할 해",[["사람이 해를 당해 죽다.","원수의 칼에 살해되다."]],1,[]],["행복하다(幸福하다)","형용사",0,"다행 행, 복 복",[["생활에서 충분한 만족과 기쁨을 느끼어 흐뭇하다.","행복한 사람."]],1,[]],["외롭다","형용사",0,"",[["홀로 되거나 의지할 곳이 없어 쓸쓸하다.","너마저 떠나면 나 혼자 외로워서 어쩌니."]],1,[]],["무찌르다","동사",0,"",[["적을 쳐서 이기거나 없애다.","아군은 수적 열세에도 불구하고 적군을 무찔렀다."]],1,[]],["치우다","동사",0,"",[["물건을 다른 데로 옮기다.","위험한 물건들은 아이들의 손이 닿지 않는 곳으로 치워라."]],1,[]],["금지되다(禁止되다)","동사",0,"금할 금, 그칠 지",[["법이나 규칙이나 명령 따위로 어떤 행위가 이루어지지 못하게 되다.","개발이 원천적으로 금지되는 자연 보호 지역."]],1,[]],["전달되다(傳達되다)","동사",0,"전할 전, 통달할 달",[["사물이 어떤 대상에게 전해져 받게 되다.","전달되는 경로.","يُسَلَّمُ"],["지시, 명령, 물품 따위가 다른 사람이나 기관에 전하여져 이르게 되다.","엄연히 보급 정량이 규정되어 있는데도 실제로 예하대에 전달되는 보급은 한 번도 제 정량대로 전달된 일이 없다.≪홍성원, 육이오≫"]],1,[]],["재배되다(栽培되다)","동사",0,"심을 재, 북돋울 배",[["식물이 심기어 가꾸어지다.","이 화초는 온실에서 재배되었다."]],1,[]],["유리하다(遊離하다)","동사",0,"놀 유, 떠날 리",[["따로 떨어지다.","인간의 꿈이 현실과 유리하게 되면 그 꿈은 망상이다."]],1,[]],["유배되다(流配되다)","동사",0,"흐를 유, 나눌 배",[["죄인이 귀양 보내지다. 오형(五刑)의 하나로, 그 죄의 가볍고 무거움에 따라 원근(遠近)의 등급이 있었다.","추운 곳에 유배된 죄수들."]],1,[]],["농사짓다(農事짓다)","동사",0,"농사 농, 일 사",[["농사를 직업으로 삼다.","나는 시골에서 농사짓는 사람이오."]],1,[]],["통일되다(統一되다)","동사",0,"거느릴 통, 한 일",[["나누어지거나 갈라진 것들이 합쳐져 하나가 되다.","계파가 통일되다.","يَتَوَحَّدُ"],["나누어진 것들이 합쳐져서 하나의 조직·체계 아래로 모이게 되다.","남북이 통일되다."]],1,[]],["적응하다(適應하다)","동사",0,"맞을 적, 응할 응",[["일정한 조건이나 환경 따위에 맞추어 응하거나 알맞게 되다.","새로운 직장에 잘 적응하다."]],1,[]],["물들다","동사",0,"",[["빛깔이 서서히 퍼지거나 옮아서 묻다.","검게 물들다.","يَصْطَبِغُ"],["빛깔이 스미거나 옮아서 묻다.","꽃다지, 질경이, 민들레……가지가지 풋나물을 뜯어 먹으면 몸이 초록으로 물들 것 같다.≪이효석, 들≫"]],1,[]],["걸쭉하다","형용사",0,"",[["액체가 묽지 않고 내용물이 많고 진하다.","걸쭉한 가래."]],0,[]],["위급하다(危急하다)","형용사",0,"위태할 위, 급할 급",[["몹시 위태롭고 급하다.","병세가 위급하다."]],1,[]],["갸름하다","형용사",0,"",[["보기 좋을 정도로 조금 가늘고 긴 듯하다.","갸름하게 생기다."]],1,[]],["산란하다(散亂하다)","형용사",0,"흩을 산, 어지러울 란",[["물건 등이 흐트러져 있어 어지럽다.","산란하게 흐트려뜨리다.","مُضْطَرِب، غَيْر مُرَتَّب"],["흩어져 어지럽다.","조카들이 놀다가 둔 장난감들 때문에 방이 너무 산란했다."]],1,[]],["불쌍하다","형용사",0,"",[["처지가 안되고 애처롭다.","관객들은 영화 속 비련의 여주인공이 불쌍하여 눈물을 흘렸다."]],1,[]],["풍자하다(諷刺하다)","동사",0,"풍자할 풍, 찌를 자",[["남의 부족한 점을 다른 것에 빗대어 비웃으면서 폭로하고 공격하다.","남을 풍자하다.","يهجو"],["남의 결점을 다른 것에 빗대어 비웃으면서 폭로하고 공격하다.","양반을 풍자하고 조롱하는 가면극."]],1,[]],["정중하다(鄭重하다)","형용사",0,"나라 정, 무거울 중",[["태도나 분위기가 점잖고 엄숙하다.","정중한 태도."]],1,[]],["잡다하다(雜多하다)","형용사",0,"섞일 잡, 많을 다",[["잡스러운 여러 가지가 뒤섞여 너저분하다.","잡다한 생각에 빠지다."]],1,[]],["차갑다","형용사",0,"",[["피부에 닿는 느낌이 차다.","차갑게 굳다.","بارد، قرّ، قارس"],["촉감이 서늘하고 썩 찬 느낌이 있다.","차갑게 식은 커피."]],1,[]],["정통하다(精通하다)","동사",0,"정할 정, 통할 통",[["어떤 사물을 깊고 자세하게 알다.","정통한 소식통."]],1,[]],["허가하다(許可하다)","동사",0,"허락할 허, 옳을 가",[["행동이나 일을 할 수 있게 허락하다.","등록을 허가하다.","يسمح، يأذن"],["행동이나 일을 하도록 허용하다.","외국인에게 취업을 허가하다."]],1,[]],["넘겨주다","동사",0,"",[["물건, 권리, 책임, 일 따위를 남에게 주거나 맡기다.","회사를 후계자에게 넘겨주다."]],1,[]],["화장하다(化粧하다)","동사",0,"될 화, 단장할 장",[["화장품을 바르거나 문질러 얼굴을 곱게 꾸미다.","화장한 얼굴."]],1,[]],["허약하다(虛弱하다)","형용사",0,"빌 허, 약할 약",[["힘이나 기운이 없고 약하다.","허약한 체질."]],1,[]],["비롯되다","동사",0,"",[["처음으로 시작되다.","그들의 싸움은 아주 사소한 오해에서 비롯된 것이었다."]],1,[]],["내주다","동사",0,"",[["넣어 두었던 물건 등을 꺼내서 주다.","거스름돈을 내주다.","يُقَدِّم"],["가지고 있던 것을 남에게 넘겨주다.","외국 선수에게 챔피언 벨트를 내주고 말았다."],["마련하여 주다.","사위의 덕을 볼 수 있다면, 큰 거리에 가게나 하나 내주는 사람이 없을까 하는 것이 소원이었다.≪박용구, 점잖은 신 선생≫"]],1,[]],["둥그스름하다","형용사",0,"",[["약간 둥글다.","얼굴이 둥그스름하다."]],1,[]],["무디다","형용사",0,"",[["칼이나 가위 등의 날이나 끝이 날카롭지 못하다.","무딘 날.","كَلِيل"],["칼이나 송곳 따위의 끝이나 날이 날카롭지 못하다.","펜촉이 무디다."]],1,[]],["거절하다(拒絕하다)","동사",0,"막을 거, 끊을 절",[["상대편의 요구, 제안, 선물, 부탁 따위를 받아들이지 않고 물리치다.","제의를 거절하다."]],1,[]],["운동하다(運動하다)","동사",0,"옮길 운, 움직일 동",[["몸을 단련하거나 건강을 위해 몸을 움직이다.","운동하는 습관.","يتمرّن على"],["사람이 몸을 단련하거나 건강을 위하여 몸을 움직이다.","규칙적으로 조금씩 운동하는 습관을 들이시면 건강에 도움이 될 겁니다."],["어떤 목적을 이루려고 힘쓰다.","그와는 과거에 학생 운동의 선봉에서 함께 운동했던 친구 사이입니다."],["물체가 시간의 경과에 따라 그 공간적 위치를 바꾸다.","지구 궤도에서 운동하는 달."]],1,[]],["쓸모없다","형용사",0,"",[["쓸 만한 가치가 없다.","오랫동안 이런 일에 종사해 온 그의 육감으로는 이런 형편없는 시계는 맡아 줄 만한 가치가 전혀 없는 쓸모없는 고물딱지 시계라는 것을 식별할 수 있었다.≪최인호, 지구인≫"]],1,[]],["깨우치다","동사",0,"",[["깨달아 알게 하다.","동생의 잘못을 깨우쳐 주다."]],1,[]],["깎이다","동사",0,"",[["칼과 같은 도구로 물건의 표면이나 과일 등의 껍질이 얇게 벗겨지다.","감자가 깎이다.","يَتَقَشَّرُ"],["칼 따위로 물건의 거죽이나 표면이 얇게 벗겨지다. ‘깎다「1」’의 피동사.","연필이 잘 깎이다."]],1,[]],["장려하다(奬勵하다)","동사",0,"장려할 장, 힘쓸 려",[["좋은 일에 힘쓰도록 북돋아 주다.","저축을 장려하다."]],1,[]],["연달다(連달다)","동사",0,"이을 연",[["어떤 물체가 다른 물체의 뒤를 이어서 따르다. 또는 다른 물체에 이어지다.","연달아 부딪치다.","يتوالى"],["어떤 물체가 다른 물체의 뒤를 이어 따르다. 또는 다른 물체에 이어지다.","차가 연달아 온다."]],1,[]],["초월하다(超越하다)","동사",0,"뛰어넘을 초, 넘을 월",[["어떠한 한계나 표준을 뛰어넘다.","상상을 초월하다."]],1,[]],["자연스럽다(自然스럽다)","형용사",0,"스스로 자, 그럴 연",[["억지로 꾸미지 않아 이상함이 없다.","자연스러운 모습.","طبيعي"],["억지로 꾸미지 아니하여 이상함이 없다.","자연스러워 보이는 행동."]],1,[]],["판매하다(販賣하다)","동사",0,"팔 판, 팔 매",[["상품 따위를 팔다.","소비자에게 상품을 판매하다."]
