<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3864">
<title>우리말 단어장</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1a1d24; --sub:#6b7280; --line:#e5e7eb;
  --brand:#1F3864; --brand2:#2d4f8a; --accent:#c8873a; --ok:#2e7d4f; --no:#b3423a;
  --chip:#eef1f6; --shadow:0 1px 3px rgba(15,25,50,.08),0 4px 14px rgba(15,25,50,.06);
  --bm:#2d7d6e; --bm-bg:#e7f3f0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c; --card:#1c212b; --ink:#e8eaf0; --sub:#98a0ae; --line:#2a3140;
        --brand:#7d9bd4; --brand2:#5b7cb8; --accent:#d9a05c; --ok:#5cb883; --no:#d97b73; --chip:#252b38;
        --shadow:0 1px 3px rgba(0,0,0,.4); --bm:#5fb39f; --bm-bg:#1c2b28}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top)}
header{padding:14px 18px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
header .htitle{display:flex;align-items:baseline;gap:10px;min-width:0}
header h1{font-size:19px;margin:0;color:var(--brand);letter-spacing:-.3px}
header .cnt{font-size:12px;color:var(--sub)}
.hdrBmBtn{border:none;background:var(--bm-bg);color:var(--bm);width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:0 0 auto}
.hdrBmBtn svg{width:16px;height:16px}
.hdrBmBtn .dot{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--accent);
  border:1.5px solid var(--bg)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 20px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 0 9px;border:0;background:none;color:var(--sub);
  font-size:12.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brand)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;
  padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.searchbox{position:sticky;top:0;background:var(--bg);padding:6px 0 4px;z-index:5}
.searchbox input{width:100%;padding:12px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none;box-shadow:var(--shadow)}
.searchbox input:focus{border-color:var(--brand2)}
.entry{background:var(--card);border-radius:14px;padding:14px 16px;margin:9px 0;box-shadow:var(--shadow)}
.entry.bmHighlight{outline:2px solid var(--bm);outline-offset:2px}
.entryHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.entry .w{font-size:17px;font-weight:700}
.bmBtn{border:none;background:none;padding:3px;cursor:pointer;flex:0 0 auto;color:var(--sub);line-height:0;border-radius:6px}
.bmBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.bmBtn.on{color:var(--bm)}
.bmBtn.on svg{fill:var(--bm-bg);stroke:var(--bm)}
.bmBtn:active{transform:scale(.85)}
.entry .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;color:var(--sub)}
.tag.g3{color:var(--ok)} .tag.g2{color:var(--accent)} .tag.g1{color:var(--no)}
.hm{color:var(--accent);font-size:13px;margin-top:5px;font-weight:600}
.sense{margin-top:8px;font-size:14.5px;line-height:1.55}
.sense .n{color:var(--brand);font-weight:700;margin-right:4px;font-size:13px}
.sense .ex{display:block;color:var(--sub);font-size:13px;margin-top:2px;font-style:normal}
.sense .ex::before{content:"예) "}
.sense .arw{display:inline-block;direction:rtl;unicode-bidi:isolate;color:var(--brand2);
  font-size:15px;font-weight:600;margin-left:6px}
.syn{color:var(--brand2);font-size:12.5px;margin-top:8px;line-height:1.5}
.syn b{font-weight:700;color:var(--sub);margin-right:2px}
.more{color:var(--brand);font-size:13px;font-weight:600;margin-top:8px;cursor:pointer;background:none;border:none;padding:0}
.empty{text-align:center;color:var(--sub);padding:50px 0;font-size:14px}
/* 카드 */
.cardwrap{max-width:520px;margin:0 auto}
.flash{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 22px;cursor:pointer;position:relative;margin-top:8px}
.flash .w{font-size:34px;font-weight:800;letter-spacing:-.5px}
.flash .hm{font-size:15px;margin-top:10px}
.flash .p{position:absolute;top:14px;left:16px}
.flash .prog{position:absolute;top:14px;right:16px;font-size:12px;color:var(--sub)}
.flash .hint{position:absolute;bottom:12px;font-size:12px;color:var(--sub)}
.flash .def{font-size:16.5px;line-height:1.6;text-align:left}
.flash .def .ex{color:var(--sub);font-size:13.5px}
.flash .syn{text-align:left;margin-top:4px}
.answers{display:flex;gap:10px;margin-top:14px}
.answers button{flex:1;padding:15px 0;border-radius:14px;border:0;font-size:15.5px;font-weight:700;cursor:pointer;color:#fff}
.answers .no{background:var(--no)} .answers .ok{background:var(--ok)}
.bigbtn{width:100%;padding:15px 0;border-radius:14px;border:0;font-size:15.5px;font-weight:700;
  cursor:pointer;background:var(--brand);color:#fff;margin-top:14px}
.statline{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:13px;color:var(--sub)}
.statline b{color:var(--ink)}
/* 퀴즈 */
.q{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:8px}
.q .prompt{font-size:17px;line-height:1.55;font-weight:600;min-height:60px}
.q .prompt .small{font-size:13px;color:var(--sub);font-weight:400}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.choices button{padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);
  color:var(--ink);font-size:15px;text-align:left;cursor:pointer;line-height:1.45}
.choices button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg));font-weight:700}
.choices button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--bg))}
.choices button:disabled{cursor:default;opacity:.92}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
.score{font-weight:700;color:var(--brand)}
.note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
/* 별표 (뜻 단위) */
.sense{position:relative;padding-right:26px}
.starBtn{position:absolute;top:-1px;right:-3px;background:none;border:0;padding:4px;cursor:pointer;line-height:0}
.starBtn svg{width:18px;height:18px;fill:none;stroke:var(--sub);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.starBtn.on svg{fill:var(--accent);stroke:var(--accent)}
.starBtn:active{transform:scale(.85)}
.flash .def .sense{padding-right:28px}
.flash .starBtn svg{width:20px;height:20px}
.starhead{display:flex;justify-content:space-between;align-items:center;
  margin:10px 2px 2px;font-size:12.5px;color:var(--sub)}
.starhead .more{margin-top:0}
/* ---------- 책갈피 ---------- */
.bmOverlay{position:fixed;inset:0;background:rgba(20,20,15,.32);display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;z-index:90}
.bmOverlay.show{opacity:1;pointer-events:auto}
.bmSheet{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;max-height:76%;
  display:flex;flex-direction:column;transform:translateY(14px);transition:transform .18s;
  box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.bmOverlay.show .bmSheet{transform:translateY(0)}
.bmHead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.bmHead h3{margin:0;font-size:15px;flex:1;color:var(--ink)}
.bmHead .closeX{border:none;background:none;color:var(--sub);width:26px;height:26px;border-radius:7px;
  cursor:pointer;font-size:16px}
.bmHead .closeX:hover{background:var(--chip)}
#bmList{overflow-y:auto;padding:6px 8px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.bmRow{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:10px;cursor:pointer}
.bmRow:active{background:var(--bg)}
.bmRow .bmw{font-size:14px;font-weight:700;flex:1;min-width:0;color:var(--ink)}
.bmRow .bmw .p{font-size:11px;color:var(--sub);font-weight:500;margin-left:6px}
.bmRow .bmw .bmsnip{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmRow .go{color:var(--bm);font-size:11px;font-weight:700;flex:0 0 auto}
.bmRow .rm{border:none;background:none;color:var(--sub);font-size:16px;padding:3px 6px;border-radius:6px;cursor:pointer;flex:0 0 auto}
.bmRow .rm:hover{color:var(--no);background:var(--chip)}
.hidden{display:none!important}
#boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#boot .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--brand);animation:sp 0.85s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#boot .msg{color:var(--sub);font-size:13.5px;line-height:1.6;max-width:280px}
#boot .err{display:none;color:var(--no);font-size:13.5px;line-height:1.6;max-width:300px}
#boot .err button{margin-top:12px;padding:10px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
/* ---------- 단어집 ---------- */
#tab-words .wbWrap{max-width:560px;margin:0 auto}
.wbBar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:12px}
.wbBar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .25s}
.wbSum{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--sub);margin-top:8px}
.wbSum b{color:var(--ink)}
.wbTools{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 0;font-size:12.5px;color:var(--sub)}
.wbTools .more{margin-top:0}
.wbRow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 14px;
  margin:8px 0;box-shadow:var(--shadow);cursor:pointer}
.wbRow:active{opacity:.85}
.wbRow.next{outline:2px solid var(--brand2);outline-offset:1px}
.wbInfo{flex:1;min-width:0}
.wbT{font-size:15px;font-weight:700}
.wbS{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbDate{font-size:12px;color:var(--ok);font-weight:700;flex:0 0 auto}
.wbGo{color:var(--sub);font-size:18px;flex:0 0 auto}
.wbChk{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;padding:0}
.wbChk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wbRow.done .wbChk,.wbDetChk.done .wbChk{background:var(--ok);border-color:var(--ok);color:#fff}
.wbRow.done .wbT{color:var(--sub)}
.wbHead{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin:8px 0}
.wbHeadTop{display:flex;align-items:center;gap:8px}
.wbHeadTop h2{margin:0;font-size:18px;flex:1;color:var(--brand)}
.wbHead .wbS{white-space:normal;margin-top:4px}
.wbDetChk{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:14.5px;font-weight:700;color:var(--ink);width:100%;text-align:left}
.wbDetChk.done{border-color:var(--ok)}
.wbDetChk .wbChk{pointer-events:none}
.wbDateRow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--sub)}
.wbDateRow input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 9px;font-size:14px;font-family:inherit}
.wbNav{display:flex;gap:10px;margin:14px 0 6px}
.wbNav button{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--brand);font-size:14px;font-weight:700;cursor:pointer}
.wbNav button:disabled{opacity:.35;cursor:default}
.wbBack{border:none;background:none;color:var(--brand);font-size:14px;font-weight:700;cursor:pointer;padding:6px 2px}
</style>
</head>
<body>
<div id="boot">
  <div class="spin" id="bootSpin"></div>
  <div class="msg" id="bootMsg">사전을 불러오는 중입니다…<br>단어 수가 많아 몇 초 걸릴 수 있어요.</div>
  <div class="err" id="bootErr">불러오는 데 문제가 생겼습니다.<br>기기 메모리가 부족하거나 파일이 온전히 전달되지 않았을 수 있어요.
    <br><button onclick="location.reload()">다시 시도</button></div>
</div>
<header>
  <div class="htitle"><h1>우리말 단어장</h1><span class="cnt" id="cnt"></span></div>
  <button class="hdrBmBtn" id="hdrBmBtn" title="책갈피 목록"><span class="dot hidden" id="hdrBmDot"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.2L5 21V4.5a1 1 0 0 1 1-1z"/></svg>
  </button>
</header>
<main id="main">
  <!-- 사전 -->
  <section id="tab-dict">
    <div class="searchbox"><input id="q" type="search" placeholder="단어·뜻·훈음 검색" autocomplete="off"></div>
    <div id="list"></div>
    <button class="more hidden" id="moreBtn">더 보기</button>
  </section>
  <!-- 카드 -->
  <section id="tab-card" class="hidden">
    <div class="cardwrap">
      <div class="seg" id="cardMode">
        <button data-m="all" class="on">전체 단어</button><button data-m="unknown">모르는 단어만</button><button data-m="star">별표</button>
      </div>
      <div class="flash" id="flash"></div>
      <div class="answers">
        <button class="no" id="btnNo">모르겠어요</button>
        <button class="ok" id="btnOk">알아요</button>
      </div>
      <div class="statline" id="cardStat"></div>
      <p class="note">카드를 누르면 뜻이 나옵니다. ‘알아요’ 3번이면 학습 완료로 표시됩니다. 진행 상황은 이 기기에 저장됩니다.</p>
    </div>
  </section>
  <!-- 퀴즈 -->
  <section id="tab-quiz" class="hidden">
    <div class="cardwrap">
      <div class="seg" id="quizDir">
        <button data-d="d2w" class="on">뜻 → 단어</button><button data-d="w2d">단어 → 뜻</button>
      </div>
      <div class="q">
        <div class="prompt" id="qPrompt"></div>
        <div class="choices" id="qChoices"></div>
        <div class="qfoot">
          <span class="score" id="qScore">0 / 0</span>
          <button class="more" id="qNext">다음 문제 →</button>
        </div>
      </div>
    </div>
  </section>
  <!-- 별표 -->
  <section id="tab-star" class="hidden">
    <div class="starhead"><span id="starCnt"></span><button class="more" id="starClear">전체 지우기</button></div>
    <div id="starList"></div>
  </section>
  <!-- 단어집 -->
  <section id="tab-words" class="hidden"><div class="wbWrap" id="wbBody"></div></section>
</main>
<nav>
  <button id="nav-dict" class="on"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>사전</button>
  <button id="nav-card"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="15" height="13" rx="2"/><path d="M7 9h7M7 13h4M21 8v9a2 2 0 0 1-2 2H8"/></svg>카드</button>
  <button id="nav-quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.7 2.4c-.8.4-1.2 1-1.2 1.8v.3"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>퀴즈</button>
  <button id="nav-star"><svg viewBox="0 0 24 24"><path d="M12 3.4l2.65 5.37 5.93.86-4.29 4.18 1.01 5.9L12 16.92l-5.3 2.79 1.01-5.9-4.29-4.18 5.93-.86z"/></svg>별표</button>
  <button id="nav-words"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v13H5.5A1.5 1.5 0 0 0 4 18.5z"/><path d="M4 18.5A1.5 1.5 0 0 0 5.5 20H20v-3"/><path d="M9 8.5h7M9 12h4.5"/></svg>단어집</button>
</nav>
<div id="bmOverlay" class="bmOverlay">
  <div class="bmSheet">
    <div class="bmHead"><h3 id="bmTitle">책갈피</h3><button class="closeX" id="bmClose">×</button></div>
    <div id="bmList"></div>
  </div>
</div>
<script type="application/json" id="DATA">[["말","명사",0,"",[["생각이나 느낌을 표현하고 전달하는 사람의 소리.","말과 글.","كَلَام"],["사람의 생각이나 느낌 따위를 표현하고 전달하는 데 쓰는 음성 기호. 곧 사람의 생각이나 느낌 따위를 목구멍을 통하여 조직적으로 나타내는 소리를 가리킨다.","말과 글."]],1,[]],["사람","명사",0,"",[["생각할 수 있으며 언어와 도구를 만들어 사용하고 사회를 이루어 사는 존재.","사람이 살다.","إِنْسَان"],["생각을 하고 언어를 사용하며, 도구를 만들어 쓰고 사회를 이루어 사는 동물.","사람으로서 지켜야 할 도리."]],1,[]],["일","명사",0,"",[["무엇을 이루려고 몸이나 정신을 사용하는 활동. 또는 그 활동의 대상.","일이 많다.","عَمَل"],["무엇을 이루거나 적절한 대가를 받기 위하여 어떤 장소에서 일정한 시간 동안 몸을 움직이거나 머리를 쓰는 활동. 또는 그 활동의 대상.","일을 마치다."],["어떤 내용을 가진 상황이나 장면.","지난 일을 돌이켜 보다."]],1,[]],["때","명사",0,"",[["시간의 어떤 순간이나 부분.","때를 알리다."]],1,[]],["모양(模樣)","명사",0,"본뜰 모, 모양 양",[["겉으로 나타나는 생김새나 모습.","여학생들의 머리 모양이 다양해졌다."]],1,[]],["소리","명사",0,"",[["물체가 진동하여 생긴 음파가 귀에 들리는 것.","라디오 소리.","صَوْت"],["물체의 진동에 의하여 생긴 음파가 귀청을 울리어 귀에 들리는 것.","피리 소리."]],1,[]],["하나","명사",0,"",[["뜻, 마음, 생각 등이 일치하거나 모아지는 것.","하나의 뜻.","وَاحِد"],["뜻, 마음, 생각 따위가 한결같거나 일치한 상태.","뜻을 하나로 모으다."],["여러 가지로 구분한 것들 가운데 어떤 것을 가리키는 말.","인생에서 돈보다 중요한 것이 있는데, 하나는 건강이고 하나는 가족이다."]],1,[]],["몸","명사",0,"",[["사람이나 동물의 모습을 이루는 머리부터 발까지의 전체. 또는 그것의 상태.","날씬한 몸.","جِسْم"],["사람이나 동물의 형상을 이루는 전체. 또는 그것의 활동 기능이나 상태.","건강한 몸."]],1,[]],["수(數)","명사",0,"셈 수",[["셀 수 있는 사물을 세어서 나타낸 값.","사람 수가 모자란다."]],1,[]],["뜻","명사",0,"",[["마음에 있는 생각이나 의견.","커다란 뜻.","إِرَادَة"],["무엇을 하겠다고 속으로 먹는 마음.","벼슬에 뜻이 없어 초야에 묻혀 살다."],["말이나 글, 또는 어떠한 행동 따위로 나타내는 속내.","모르는 낱말의 뜻을 알려면 사전을 찾아야 한다."]],1,[]],["물건(物件)","명사",0,"물건 물, 물건 건",[["일정한 모양을 갖춘 어떤 물질.","물건을 두다.","بِضَاعَة"],["일정한 형체를 갖춘 모든 물질적 대상.","물건을 맡기다."]],1,[]],["조선(朝鮮)","명사",0,"아침 조, 고울 선",[["1392년 이성계가 고려를 무너뜨리고 세운 나라. 한양에 도읍하였으며, 불교를 배척하고 성리학을 사회의 지도 이념으로 삼아 중앙 집권적인 양반 관료 체제를 이루었다. 15세기에 전성기를 이루었으며, 16세기에서 17세기에 걸쳐 내외적 혼란을 극복하고 18세기 이후 새로운 전성기를 맞이하였다. 1897년에 대한 제국으로 국호를 개칭하였고, 19세기에 구미 열강과 일본의 압력을 받다가 1910년 일본에 국권을 강탈당하였다.",""]],1,[]],["시대(時代)","명사",0,"때 시, 대신할 대",[["역사적으로 어떤 특징을 기준으로 나눈 일정한 기간.","시대 구분.","عَصْر"],["역사적으로 어떤 표준에 의하여 구분한 일정한 기간.","봉건적 시대."]],1,[]],["중국(中國)","명사",0,"가운데 중, 나라 국",[["아시아 동부에 있는 나라. 황허강(黃河江)을 중심으로 고대 문명이 일어난 곳으로, 전설적인 삼황오제 시대를 시작으로 하나라·은나라·주나라·춘추 전국 시대·진(秦)나라·한나라·삼국 시대·진(晉)나라·남북조 시대·수나라·당나라·오대(五代)·송나라·원나라·명나라·청나라를 거쳐 1912년에 중화민국이 성립되었다. 그 뒤 1949년에 중국 공산당이 대륙을 장악하여 중국 본토에 중화 인민 공화국을 세우고, 국민 정부는 타이완으로 옮겼다. 광대한 영토에 농산물, 지하자원 따위의 각종 자원이 풍부하다.",""]],1,[]],["느낌","명사",0,"",[["몸의 감각이나 마음으로 깨달아 아는 기운이나 감정.","차가운 느낌."]],1,[]],["정도(程度)","명사",0,"한도 정, 법도 도",[["사물의 성질이나 가치를 좋고 나쁨이나 더하고 덜한 정도로 나타내는 분량이나 수준.","피해 정도.","دَرَجَةٌ"],["사물의 성질이나 가치를 양부(良否), 우열 따위에서 본 분량이나 수준.","정도의 차이."]],1,[]],["곳","명사",0,"",[["일정한 자리나 지역.","낯선 곳."]],0,[]],["잎","명사",0,"",[["줄기 끝이나 둘레에 붙어 있으며 녹색의 납작한 모양을 한, 식물의 영양 기관.","초록색 잎.","ورق"],["식물의 영양 기관의 하나. 줄기의 끝이나 둘레에 붙어 호흡 작용과 탄소 동화 작용을 한다. 대개 녹색으로 모양은 넓적하고 잎몸, 잎자루, 턱잎 따위로 이루어진다.","잎이 우거진 푸른 숲."]],1,[]],["어근(語根)","명사",0,"말씀 어, 뿌리 근",[["단어를 분석할 때, 실질적 의미를 나타내는 중심이 되는 부분. ‘덮개’의 ‘덮-’, ‘어른스럽다’의 ‘어른’ 따위이다.",""]],1,[]],["가지","명사",0,"",[["나무나 풀의 큰 줄기에서 갈라져 나간 작은 줄기.","마른 가지.","غُصْن"],["나무나 풀의 원줄기에서 뻗어 나온 줄기.","마른 가지."],["가짓과의 한해살이풀. 높이는 60~100cm이며, 온몸에 털이 나 있고, 잎은 어긋난다. 줄기와 잎은 검은 자주색이고 6~9월에 흰색이나 엷은 자주색 따위의 통꽃이 핀다. 열매는 식용한다. 인도가 원산지로 세계 각지에 150여 종이 분포한다.",""]],1,[]],["마음","명사",0,"",[["사람이 태어날 때부터 지닌 성질.","인간의 마음.","قَلْب"],["사람이 본래부터 지닌 성격이나 품성.","마음이 좋다."],["사람이 다른 사람이나 사물에 대하여 감정이나 의지, 생각 따위를 느끼거나 일으키는 작용이나 태도.","몸은 멀리 있어 마음으로나마 입학을 축하한다."]],1,[]],["물","명사",0,"",[["강, 호수, 바다, 지하수 등에 있으며 순수한 것은 빛깔, 냄새, 맛이 없고 투명한 액체.","깨끗한 물.","مَاء"],["자연계에 강, 호수, 바다, 지하수 따위의 형태로 널리 분포하는 액체. 순수한 것은 빛깔, 냄새, 맛이 없고 투명하다. 산소와 수소의 화학적 결합물로, 어는점 이하에서는 얼음이 되고 끓는점 이상에서는 수증기가 된다. 공기와 더불어 생물이 살아가는 데 없어서는 안 될 중요한 물질이다.","물 한 모금."]],1,[]],["길이","명사",0,"",[["무엇의 한쪽 끝에서 다른 쪽 끝까지의 거리.","일 미터 길이.","طُول"],["한끝에서 다른 한끝까지의 거리.","치마의 길이."]],1,[]],["서로","명사",0,"",[["짝을 이루거나 관계를 맺고 있는 상대.","서로의 행복."]],1,[]],["꽃","명사",0,"",[["특유의 모양과 빛깔, 향기가 있으며 줄기 끝에 달려 있는 식물의 한 부분. 또는 그것이 피는 식물.","고운 꽃.","زَهْرَةٌ، وَرْدَةٌ"],["종자식물의 번식 기관. 모양과 색이 다양하며, 꽃받침과 꽃잎, 암술과 수술로 이루어져 있다. 분류 기준에 따라 갖춘꽃과 안갖춘꽃, 단성화와 양성화, 통꽃과 갈래꽃, 풍매화와 충매화 따위로 나눈다.","꽃이 아름답게 피다."]],1,[]],["한국(韓國)","명사",0,"한국 한, 나라 국",[["아시아 대륙 동쪽에 있는 한반도와 그 부속 도서(島嶼)로 이루어진 공화국. 아르오케이(ROK:Republic of Korea) 또는 코리아(Korea)라고도 불린다. 기원전 2333년에 성립된 고조선에서부터 고구려·백제·신라의 삼국 시대를 거쳐 통일 신라·고려·조선으로 이어져 오다가 1910년에 일제의 침략으로 강제 합병 되었으나, 1945년에 제이 차 세계 대전이 끝나면서 독립하였다. 1948년에 남쪽 지역만의 총선으로 민주 공화국이 수립되었다. 1950년에 북한이 6·25 전쟁을 일으킴으로써 휴전선을 사이에 두고 국토 분단이 고착화되었다. 주민의 대부분은 황색 인종인 한민족(韓民族)이며, 언어는 알타이어계에 속하는 한국어이고 문자는 한글을 쓴다. 수도는 서울, 면적은 22만 1336㎢, 남한은 9만 9313㎢.",""]],1,[]],["끝","명사",0,"",[["시간에서의 마지막 때.","시작과 끝.","نِهَايَة"],["긴 모양으로 생긴 사물이나 몸의 마지막 부분.","꼬리 끝."]],0,[]],["일본(日本)","명사",0,"날 일, 근본 본",[["아시아 동쪽 끝에 있는 입헌 군주국. 일본 열도를 이루는 홋카이도(北海道)·혼슈(本州)·시코쿠(四國)·규슈(九州) 및 그 부속 도서(島嶼)로 이루어진 섬나라로, 1867년 메이지 유신(明治維新) 이후 자본주의적 군주 국가로서 급속히 발전하였다. 농업과 공업, 전자 산업이 발달하여 경제 수준이 높으며, 일본어를 사용하고 한자와 가나를 쓴다. 수도는 도쿄, 면적은 37만 7800㎢.",""]],1,[]],["남","명사",0,"",[["내가 아닌 다른 사람.","남의 눈치.","آخَر"],["자기 이외의 다른 사람.","남의 일에 참견하다."]],1,[]],["가운데","명사",0,"",[["한 공간이나 사물의 모든 끝에서 거의 같은 거리로 떨어져 있는 부분.","강 가운데.","وَسَط"],["일정한 공간이나 길이를 갖는 사물에서, 한쪽으로 치우치지 않고 양 끝에서 거의 같은 거리가 떨어져 있는 부분.","강 가운데 배가 떠 있다."]],1,[]],["사이","명사",0,"",[["한 물체에서 다른 물체까지 또는 한곳에서 다른 곳까지의 거리나 공간.","두 나라 사이.","بَيْنَ"],["한곳에서 다른 곳까지, 또는 한 물체에서 다른 물체까지의 거리나 공간.","서울과 인천 사이."]],1,[]],["열매","명사",0,"",[["사과, 배 등과 같이 나무의 꽃이 지고 난 뒤에 그 자리에 생기는 것.","열매가 열리다."]],0,[]],["상태(狀態)","명사",0,"형상 상, 모습 태",[["사물·현상이 놓여 있는 모양이나 형편.","무방비 상태."]],1,[]],["뒤","명사",0,"",[["향하고 있는 방향의 반대쪽.","뒤를 보다.","خَلْف، وَرَاء"],["향하고 있는 방향과 반대되는 쪽이나 곳.","내 뒤에 앉아 있는 사람."]],1,[]],["나라","명사",0,"",[["일정한 영토와 주권을 가지고 있는 사람들의 사회적인 조직.","이웃 나라.","بَلَد، دَوْلَة"],["일정한 영토와 거기에 사는 사람들로 구성되고, 주권(主權)에 의한 하나의 통치 조직을 가지고 있는 사회 집단. 국민·영토·주권의 삼요소를 필요로 한다.","나라를 다스리다."]],1,[]],["비유적(比喩的/譬喩的)","명사",0,"견줄 비, 깨우칠 유, 과녁 적 / 비유할 비, 깨우칠 유, 과녁 적",[["어떤 현상이나 사물을 직접 설명하지 아니하고 다른 비슷한 현상이나 사물에 빗대어서 설명하는 것.","비유적인 설명."]],1,[]],["조금","명사",0,"",[["적은 분량이나 적은 정도.","어머니는 속이 안 좋으시다며 식사를 조금만 하셨다.","قَلِيل"],["적은 정도나 분량.","아버지께 받은 용돈은 조금이었다."]],1,[]],["위","명사",0,"",[["어떤 기준보다 더 높은 쪽. 또는 중간보다 더 높은 쪽.","허리 위.","الجزء الأعلى"],["어떤 것의 겉면이나 평평한 표면.","땅 위."]],0,[]],["부분(部分)","명사",0,"떼 부, 나눌 분",[["전체를 이루는 작은 범위. 또는 전체를 몇 개로 나눈 것의 하나.","썩은 부분을 잘라 내다."]],1,[]],["개","명사",0,"",[["냄새를 잘 맡고 귀가 매우 밝으며 영리하고 사람을 잘 따라 사냥이나 애완 등의 목적으로 기르는 동물.","동네 개.","كَلْب"],["갯과의 포유류. 가축으로 사람을 잘 따르고 영리하다. 일반적으로 늑대 따위와 비슷하게 생겼으며 날카로운 이빨이 있다. 냄새를 잘 맡으며 귀가 밝아 사냥이나 군용, 맹인 선도와 마약 및 폭약 탐지에 쓰인다. 전 세계에 걸쳐 모양, 크기, 색깔이 다양한 300여 품종이 있다.","개가 짖다."]],1,[]],["자기(自己)","명사",0,"스스로 자, 몸 기",[["그 사람 자신.","자기 방치."]],1,[]],["속","명사",0,"",[["거죽이나 껍질로 싸인 물체의 안쪽 부분.","수박 속."]],1,[]],["이름","명사",0,"",[["다른 것과 구별하기 위해 동물, 사물, 현상 등에 붙여서 부르는 말.","물건의 이름.","اِسْم"],["다른 것과 구별하기 위하여 사물, 단체, 현상 따위에 붙여서 부르는 말.","이름을 붙이다."]],1,[]],["안","명사",0,"",[["어떤 물체나 공간의 둘레에서 가운데로 향한 쪽. 또는 그러한 부분.","강당 안.","دَاخِل"],["어떤 물체나 공간의 둘러싸인 가에서 가운데로 향한 쪽. 또는 그런 곳이나 부분.","건물 안."]],1,[]],["물체(物體)","명사",0,"물건 물, 몸 체",[["구체적인 형태를 가지고 있는 것.","무거운 물체."]],1,[]],["임금(賃金)","명사",0,"품삯 임, 쇠 금",[["근로자가 노동의 대가로 사용자에게 받는 보수. 급료, 봉급, 수당, 상여금 따위가 있으며 현물 급여도 포함된다.","한 달 치 임금."]],1,[]],["눈","명사",0,"",[["사람이나 동물의 얼굴에 있으며 빛의 자극을 받아 물체를 볼 수 있는 감각 기관.","아름다운 눈.","عَيْن"],["빛의 자극을 받아 물체를 볼 수 있는 감각 기관. 척추동물의 경우 안구·시각 신경 따위로 되어 있어, 외계에서 들어온 빛은 각막·눈동자·수정체를 지나 유리체를 거쳐 망막에 이르는데, 그 사이에 굴광체(屈光體)에 의하여 굴절되어 망막에 상을 맺는다.","눈이 맑다."]],1,[]],["힘","명사",0,"",[["사람이나 동물이 스스로 움직이거나 다른 사물을 움직이게 하는 근육 작용.","다리 힘."]],0,[]],["고려(高麗)","명사",0,"높을 고, 고울 려",[["918년에 왕건이 궁예를 내쫓고 개성에 도읍하여 세운 나라. 후삼국을 통일한 왕조로 불교와 유학을 숭상하였고, 문종 때 문물이 가장 발달하였으나 무신의 난 이후 외부의 침입에 시달리다가 1392년에 이성계에 의하여 망하였다.",""]],1,[]],["행동(行動)","명사",0,"다닐 행, 움직일 동",[["몸을 움직여 동작을 하거나 어떤 일을 함.","행동 양식."]],1,[]],["피고(被告)","명사",0,"입을 피, 고할 고",[["민사 소송에서, 소송을 당한 측의 당사자.","피고가 손해액을 원고에게 배상했다."]],1,[]],["성질(性質)","명사",0,"성품 성, 바탕 질",[["사람이 가지고 있는 마음의 본래 바탕.","성질이 고약하다.","طبيعة، فطرة"],["사람이 지닌 마음의 본바탕.","성질 사나운 사람."],["사물이나 현상이 가지고 있는 고유의 특성.","화학적 성질."]],1,[]],["줄기","명사",0,"",[["식물을 받치고 뿌리에서 빨아들인 수분이나 양분을 나르며, 잎이나 가지, 열매 등이 붙는 부분.","녹색 줄기.","جذع، ساق"],["고등 식물에 있어서 기본 기관의 하나. 식물체를 받치고 뿌리로부터 흡수한 수분이나 양분을 체관부, 물관부를 통하여 각 부에 나르는 역할을 한다. 표피계, 기본 조직계, 관다발계로 되어 있다.","줄기가 굵다."]],1,[]],["배","명사",0,"",[["사람이나 동물의 몸에서, 가슴 아래에서 다리 위까지의 부분.","배가 나오다.","بَطْنٌ"],["사람이나 동물의 몸에서 위장, 창자, 콩팥 따위의 내장이 들어 있는 곳으로 가슴과 엉덩이 사이의 부위.","배가 나오다."]],1,[]],["벼슬","명사",0,"",[["(옛날에) 나랏일을 하는 관리의 직분이나 자리.","높은 벼슬.","وَظِيفَة حُكُومِيَّة"],["관아에 나가서 나랏일을 맡아 다스리는 자리. 또는 그런 일. 구실보다 높은 직이다.","높은 벼슬과 후한 봉록."]],1,[]],["전(前)","명사",0,"앞 전",[["과거의 어느 때.","전과 다름없다.","سَابِق"],["‘앞’의 뜻을 나타내는 말.","사흘 전."],["막연한 과거의 어느 때를 가리키는 말.","그 사람을 전에 한 번 본 적이 있다."]],1,[]],["머리","명사",0,"",[["사람이나 동물의 몸에서 얼굴과 머리털이 있는 부분을 모두 포함한 목 위의 부분.","머리가 크다.","رَأْس"],["사람이나 동물의 목 위의 부분. 눈, 코, 입 따위가 있는 얼굴을 포함하며 머리털이 있는 부분을 이른다. 뇌와 중추 신경 따위가 들어 있다.","머리를 긁다."]],1,[]],["자리","명사",0,"",[["사람이나 물건이 차지하고 있는 공간.","자리가 남다.","مَوْقِع"],["사람이나 물체가 차지하고 있는 공간.","학교가 있던 자리."]],1,[]],["지방(地方)","명사",0,"땅 지, 모 방",[["행정 구획이나 어떤 특징 등에 의해 나누어지는 지역.","남쪽 지방.","مِنْطَقَة"],["어느 방면의 땅.","낯선 지방으로 여행하다."]],1,[]],["앞","명사",0,"",[["향하고 있는 쪽이나 곳.","책상 앞으로 나가다."]],1,[]],["나무","명사",0,"",[["단단한 줄기에 가지와 잎이 달린, 여러 해 동안 자라는 식물.","나무 세 그루.","شَجَرَة"],["줄기나 가지가 목질로 된 여러해살이 식물.","나무 세 그루."]],1,[]],["이상(以上)","명사",0,"써 이, 윗 상",[["수량이나 정도가 일정한 기준을 포함하여 그보다 많거나 나은 것.","기대 이상.","أَكْثَر"],["수량이나 정도가 일정한 기준보다 더 많거나 나음. 기준이 수량으로 제시될 경우에는, 그 수량이 범위에 포함되면서 그 위인 경우를 가리킨다.","키 158cm 이상."]],1,[]],["음식(飮食)","명사",0,"마실 음, 밥 식",[["밥이나 국 등과 같이 사람이 끼니때 먹는 것.","음식이 맛있다.","طعام"],["사람이 먹을 수 있도록 만든, 밥이나 국 따위의 물건.","음식을 장만하다."]],1,[]],["준말","명사",0,"",[["단어의 일부분이 줄어든 것. ‘사이’가 ‘새’로, ‘잘가닥’이 ‘잘각’으로 된 것 따위이다.",""]],1,[]],["대한(大寒)","명사",0,"클 대, 찰 한",[["이십사절기의 하나. 소한(小寒)과 입춘(立春) 사이에 들며, 태양의 황경(黃經)이 300도에 이른 때로 한 해의 가장 추운 때이다. 1월 20일경이다.",""]],1,[]],["병(病)","명사",0,"병 병",[["생물체의 몸에 이상이 생겨 생물체가 정상적인 활동을 하지 못하고 괴로움을 느끼게 되는 현상.","병이 나다.","مَرَض"],["생물체의 전신이나 일부분에 이상이 생겨 정상적 활동이 이루어지지 않아 괴로움을 느끼게 되는 현상.","병이 낫다."]],1,[]],["책(冊)","명사",0,"책 책",[["글이나 그림 등을 인쇄하여 묶어 놓은 것.","책 한 권.","كتاب، مجلّد"],["종이를 여러 장 묶어 맨 물건.","백지로 책을 매어 낙서를 하거나 삽화를 그리거나 화보를 붙여 놓았다."]],1,[]],["작품(作品)","명사",0,"지을 작, 물건 품",[["만든 물건.","작품 발표.","نِتاج"],["만든 물품.",""],["예술 창작 활동으로 얻어지는 제작물.","문학 작품."]],1,[]],["갈색(褐色)","명사",0,"갈색 갈, 빛 색",[["검은빛을 띤 주홍색.","갈색 머리."]],1,[]],["세(貰)","명사",0,"세낼 세",[["남의 물건이나 건물 등을 빌려 쓰는 대가로 내는 돈.","세가 낮다.","أجرة السكن"],["남의 건물이나 물건 따위를 빌려 쓰고 그 값으로 내는 돈.","세를 올리다."]],1,[]],["돈","명사",0,"",[["물건을 사고팔 때나 일한 값으로 주고받는 동전이나 지폐.","많은 돈.","نُقُود"],["사물의 가치를 나타내며, 상품의 교환을 매개하고, 재산 축적의 대상으로도 사용하는 물건. 예전에는 조가비, 짐승의 가죽, 보석, 옷감, 농산물 따위를 이용하였으나 요즈음은 금, 은, 동 따위의 금속이나 종이를 이용하여 만들며 그 크기나 모양, 액수 따위는 일정한 법률에 의하여 정한다.","돈을 모으다."]],1,[]],["집","명사",0,"",[["사람이나 동물이 추위나 더위 등을 막고 그 속에 들어 살기 위해 지은 건물.","집을 구하다.","منزل، بيت"],["사람이나 동물이 추위, 더위, 비바람 따위를 막고 그 속에 들어 살기 위하여 지은 건물.","집을 짓다."]],1,[]],["우리나라","명사",0,"",[["우리 한민족이 세운 나라를 스스로 이르는 말.","우리나라 사람."]],1,[]],["땅","명사",0,"",[["지구에서 물로 된 부분이 아닌 흙이나 돌로 된 부분.","하늘과 땅."]],0,[]],["사물(事物)","명사",0,"일 사, 물건 물",[["일과 물건을 아울러 이르는 말.","사물 인지 능력."],["물질세계에 있는 모든 구체적이며 개별적인 존재를 통틀어 이르는 말.","세상의 본질과 사물의 이치를 연구하다."]],1,[]],["내용(內容)","명사",0,"안 내, 얼굴 용",[["그릇이나 상자 등의 안에 든 것.","가방의 내용.","مُحْتَوَيَات"],["그릇이나 포장 따위의 안에 든 것.","상자의 내용."]],1,[]],["방법(方法)","명사",0,"모 방, 법 법",[["어떤 일을 해 나가거나 목적을 이루기 위하여 취하는 수단이나 방식.","극복 방법."]],1,[]],["함(函)","명사",0,"함 함",[["옷이나 물건 등을 넣을 수 있게 만든 네모난 모양의 상자.","함을 꺼내다.","صندوق، صحّارة"],["옷이나 물건 따위를 넣을 수 있도록 네모지게 만든 통.","어머니는 패물이 들어 있는 함을 내 앞에 내놓으셨다."]],1,[]],["가장(假裝)","명사",0,"거짓 가, 꾸밀 장",[["태도를 거짓으로 꾸밈.","가장 매매.","تَكَلُّف، تَظَاهُر ، إِرْتِدَاء قِنَاع"],["얼굴이나 몸차림 따위를 알아보지 못하게 바꾸어 꾸밈.",""]],1,[]],["산(山)","명사",0,"메 산",[["평지보다 높이 솟아 있는 땅의 부분.","산에 오르다."]],1,[]],["기관(機關)","명사",0,"틀 기, 관계할 관",[["화력, 수력, 전력 등의 에너지를 기계적 에너지로 바꾸는 기계 장치.","동력 기관.","مُحَرِّكٌ"],["사회생활의 영역에서 일정한 역할과 목적을 위하여 설치한 기구나 조직.","여권 발급 기관."]],1,[]],["글","명사",0,"",[["생각이나 일 등의 내용을 글자로 나타낸 것.","긴 글.","كِتَابَةٌ"],["생각이나 일 따위의 내용을 글자로 나타낸 기록.","글을 읽다."],["말을 적는 일정한 체계의 부호.","글을 못 배워 자기 이름 석 자도 못 쓴다."]],1,[]],["물질(物質)","명사",0,"물건 물, 바탕 질",[["인간의 정신과 반대되는 개념으로 객관적으로 존재하는 실체.","물질의 세계.","مَادَّة"],["물체의 본바탕.",""]],1,[]],["여러해살이풀","명사",0,"",[["겨울에는 땅 위의 부분이 죽어도 봄이 되면 다시 움이 돋아나는 풀.",""]],1,[]],["해","명사",0,"",[["태양계의 중심에 있으며 온도가 매우 높고 스스로 빛을 내는 항성.","해가 기울다.","شمس"],["‘태양01「1」’을 일상적으로 이르는 말.","해가 지다."]],1,[]],["줄","명사",0,"",[["무엇을 묶거나 매는 데 쓰는 가늘고 긴 물건.","긴 줄.","حَبْلٌ"],["노, 새끼 따위와 같이 무엇을 묶거나 동이는 데에 쓸 수 있는 가늘고 긴 물건을 통틀어 이르는 말.","줄로 묶다."]],1,[]],["예전","명사",0,"",[["꽤 오래된 지난날.","우리 예전처럼 친하게 지내자."]],1,[]],["털","명사",0,"",[["사람이나 동물의 피부에 나는 가느다란 실 모양의 물질.","털이 길다.","شعر، ريشة، فرو"],["사람이나 동물의 피부에 나는 가느다란 실 모양의 것.","털을 갈다."]],1,[]],["현상(現象)","명사",0,"나타날 현, 코끼리 상",[["인간이 지각할 수 있는, 사물의 모양과 상태.","핵가족화 현상."]],1,[]],["종이","명사",0,"",[["식물성 섬유를 원료로 하여 만든 얇은 물건. 주로 글을 쓰거나 그림을 그리거나 인쇄를 하는 데 쓴다.","종이 꾸러미."]],1,[]],["세계(世界)","명사",0,"인간 세, 지경 계",[["지구 위에 있는 모든 나라.","세계 각국.","عَالِم"],["지구상의 모든 나라. 또는 인류 사회 전체.","세계 10대 문화 유적."]],1,[]],["쪽","명사",0,"",[["시집간 여자가 뒤통수에 땋아서 틀어 올려 비녀를 꽂아 뭉친 머리.","쪽을 뜨다.","ضفائر شعر"],["쪼개진 물건의 한 부분.","유리 쪽이 많으니 조심해라."]],1,[]],["도시(都市)","명사",0,"도읍 도, 저자 시",[["일정한 지역의 정치·경제·문화의 중심이 되는, 사람이 많이 사는 지역.","도시 생활."]],1,[]],["단위(單位)","명사",0,"홑 단, 자리 위",[["미터, 리터, 그램과 같이 길이, 양, 무게 등을 수로 나타낼 때 기초가 되는 기준.","화폐 단위.","وَحْدَة"],["길이, 무게, 수효, 시간 따위의 수량을 수치로 나타낼 때 기초가 되는 일정한 기준.","화폐 단위."]],1,[]],["다","명사",0,"",[["남거나 빠진 것이 없는 모든 것.","이것이 지금 내가 가진 돈의 다이다.","كُلّ، كَافَّة"],["남거나 빠짐없는 모든 것.","내가 네게 줄 수 있는 것은 이것이 다이다."]],1,[]],["양(量)","명사",0,"헤아릴 양",[["세거나 잴 수 있는 분량이나 수량.","양이 많다."]],1,[]],["빛","명사",0,"",[["해, 달, 전등, 불 등에서 나와 사물을 밝게 비추는 것.","강렬한 빛.","ضَوْء"],["시각 신경을 자극하여 물체를 볼 수 있게 하는 일종의 전자기파. 태양이나 고온의 물질에서 발한다.","빛 한 줄기."]],1,[]],["아래","명사",0,"",[["일정한 기준보다 낮은 위치.","다리 아래.","تحت ، أسفل"],["어떤 기준보다 낮은 위치.","언덕 아래."]],1,[]],["각(角)","명사",0,"뿔 각",[["면과 면이 만나 이루는 모서리.","각이 나다.","زَاوِيَة"],["면과 면이 만나 이루어지는 모서리.","얼굴이 각이 지다."]],1,[]],["관계(關係)","명사",0,"관계할 관, 맬 계",[["둘 이상의 사람, 사물, 현상 등이 서로 관련을 맺음. 또는 그런 관련.","국제 관계.","عَلَاقَة ، صِلَة ، رَابِطَة"],["둘 이상의 사람, 사물, 현상 따위가 서로 관련을 맺거나 관련이 있음. 또는 그런 관련.","남녀 관계."]],1,[]],["액체(液體)","명사",0,"진 액, 몸 체",[["일정한 부피는 가졌으나 일정한 형태를 가지지 못한 물질. 구성하는 분자나 원자의 간격이 기체의 경우보다 좁고, 고체에 비하여 응집력이 약하다. 상당히 강한 작용을 서로에게 미치고 있으며, 서로 위치가 끊임없이 바뀌고 결정처럼 정하여진 배열을 하고 있지 않다.",""]],1,[]],["사실(事實)","명사",0,"일 사, 열매 실",[["실제로 있었던 일이나 현재 일어나고 있는 일.","사실과 다르다.","وَاقِع"],["실제로 있었던 일이나 현재에 있는 일.","사실을 밝히다."]],1,[]],["술","명사",0,"",[["맥주나 소주 등과 같이 알코올 성분이 들어 있어서 마시면 취하는 음료.","독한 술.","الْكُحُول، خَمْر"],["알코올 성분이 들어 있어 마시면 취하는 음료. 적당히 마시면 물질대사를 높이는 효과가 있다. 맥주, 청주, 막걸리 따위의 발효주와 소주, 고량주, 위스키 따위의 증류주가 있으며, 과실이나 약제를 알코올과 혼합하여 만드는 혼성주도 있다.","술을 담그다."]],1,[]],["날","명사",0,"",[["밤 열두 시에서 다음 밤 열두 시까지의 이십사 시간 동안.","마지막 날.","يَوْم"],["지구가 한 번 자전하는 동안. 자정에서 다음 자정까지의 동안으로 24시간이다.","어느 날."]],1,[]],["처음","명사",0,"",[["시간적으로나 순서상으로 맨 앞.","처음과 나중."]],1,[]],["미국(美國)","명사",0,"아름다울 미, 나라 국",[["북아메리카 대륙의 가운데를 차지하는 연방 공화국. 영국의 식민지였으나 1776년 13주가 독립을 선언하고 독립 전쟁에 승리하여 1783년 각국의 승인을 받았다. 이후 영토를 확장하면서 급속한 경제 성장을 이루어 국제 정치·경제상의 중요한 위치를 차지하고 있다. 50개의 주와 하나의 특별구로 이루어져 있으며, 주민은 대부분이 백인이고 인구의 약 10%가 흑인이며 주요 언어는 영어이다. 수도는 워싱턴, 면적은 937만 5720㎢.",""]],1,[]],["운동(運動)","명사",0,"옮길 운, 움직일 동",[["몸을 단련하거나 건강을 위해 몸을 움직이는 일.","아침 운동.","رياضة"],["사람이 몸을 단련하거나 건강을 위하여 몸을 움직이는 일.","운동 시설."],["물체가 시간의 경과에 따라 그 공간적 위치를 바꾸는 일.","우주의 규칙적인 운동."]],1,[]],["지역(地域)","명사",0,"땅 지, 지경 역",[["일정하게 구획된 어느 범위의 토지.","한반도 지역."]],1,[]],["중심(中心)","명사",0,"가운데 중, 마음 심",[["어떤 것의 한가운데.","중심을 꿰뚫다.","قَلْب"],["사물의 한가운데.","중심에 서다."]],1,[]],["높이","명사",0,"",[["높은 정도.","산의 높이."]],1,[]],["무늬","명사",0,"",[["물건의 겉면에 나타난 모양.","나무의 무늬.","نَمَط"],["물건의 거죽에 어룽져 나타난 어떤 모양.","무늬 고운 호랑나비."]],1,[]],["보통(普通)","명사",0,"넓을 보, 통할 통",[["특별하지 아니하고 흔히 볼 수 있음. 또는 뛰어나지도 열등하지도 아니한 중간 정도.","보통 실력."]],1,[]],["곤충(昆蟲)","명사",0,"맏 곤, 벌레 충",[["곤충강에 속한 동물을 통틀어 이르는 말.","장수풍뎅이는 야행성 곤충이어서 낮에 보기 어렵다."]],1,[]],["날개","명사",0,"",[["새나 곤충의 몸 양쪽에 붙어서 날 때 쓰는 기관.","날개가 달리다.","جَنَاح"],["새나 곤충의 몸 양쪽에 붙어서 날아다니는 데 쓰는 기관.","날개가 달리다."]],1,[]],["점(點)","명사",0,"점 점",[["작고 둥글게 찍은 표시.","작은 점.","نُقْطَة"],["작고 둥글게 찍은 표.","종이에 작은 점을 찍다."]],1,[]],["어미","명사",0,"",[["(낮춤말로) 자녀를 둔 여자. 또는 그 사람을 부르는 말.","승규 어미.","أمّ، والدة"],["‘어머니01「1」’의 낮춤말.","친정 어미."]],1,[]],["바람","명사",0,"",[["기압의 변화 또는 사람이나 기계에 의해 일어나는 공기의 움직임.","바람 한 점.","رِيحٌ"],["기압의 변화 또는 사람이나 기계에 의하여 일어나는 공기의 움직임.","바람이 불다."]],1,[]],["동안","명사",0,"",[["어느 한때에서 다른 한때까지 시간의 길이.","3시간 동안."]],1,[]],["저서(著書)","명사",0,"나타날 저, 글 서",[["책을 지음. 또는 그 책.","저서를 남기다."]],1,[]],["태도(態度)","명사",0,"모습 태, 법도 도",[["몸을 움직이거나 어떤 일을 대하는 마음이 드러난 자세.","근무 태도.","موقف، سلوك"],["몸의 동작이나 몸을 가누는 모양새.","상사 앞에서 그의 태도는 꽤 당당했다."]],1,[]],["불","명사",0,"",[["물질이 빛과 열을 내며 타는 것.","꺼진 불.","نَار"],["물질이 산소와 화합하여 높은 온도로 빛과 열을 내면서 타는 것.","가랑잎이 불에 타다."]],1,[]],["동물(動物)","명사",0,"움직일 동, 물건 물",[["생물계의 두 갈래 가운데 먹이로 영양분을 얻고 자유롭게 몸을 움직일 수 있는 생물.","동물로 분류하다.","حَيَوَان"],["사람을 제외한 길짐승, 날짐승, 물짐승 따위를 통틀어 이르는 말.","동물에게 먹이를 주다."]],1,[]],["대상(對象)","명사",0,"대할 대, 코끼리 상",[["어떤 일의 상대 또는 목표나 목적이 되는 것.","연구 대상."]],1,[]],["길","명사",0,"",[["사람이나 차 등이 지나다닐 수 있게 땅 위에 일정한 너비로 길게 이어져 있는 공간.","가로수 길.","طَرِيق"],["사람이나 동물 또는 자동차 따위가 지나갈 수 있게 땅 위에 낸 일정한 너비의 공간.","한적한 길."]],1,[]],["여자(女子)","명사",0,"계집 여, 아들 자",[["여성으로 태어난 사람.","여자 친구."]],1,[]],["시간(時間)","명사",0,"때 시, 사이 간",[["어떤 때에서 다른 때까지의 동안.","긴 시간.","وَقْت"],["어떤 시각에서 어떤 시각까지의 사이.","시간 낭비."]],1,[]],["흰색(흰色)","명사",0,"빛 색",[["눈이나 우유의 빛깔과 같이 밝고 선명한 색.","흰색 와이셔츠."]],1,[]],["식물(植物)","명사",0,"심을 식, 물건 물",[["생물계의 두 갈래 가운데 하나. 대체로 이동력이 없고 체제가 비교적 간단하여 신경과 감각이 없고 셀룰로스를 포함한 세포벽과 세포막이 있다. 세균식물이나 균류를 제외하고는 일반적으로 엽록소를 가지고 있어 광합성으로 영양을 보충하고 꽃과 홀씨주머니 따위의 생식 기관이 있다. 종자식물, 양치식물, 선태식물, 균류, 조류(藻類), 세균식물 따위로 분류한다.","식물을 키우다."]],1,[]],["방향(方向)","명사",0,"모 방, 향할 향",[["어떤 곳을 향하는 쪽.","가로 방향.","الاِتِّجَاهُ"],["어떤 방위(方位)를 향한 쪽.","동쪽 방향."]],1,[]],["관아(官衙)","명사",0,"벼슬 관, 마을 아",[["예전에, 벼슬아치들이 모여 나랏일을 처리하던 곳.","주세를 내지 않으면 관아로 끌고 가서 물고를 내겠다고 으름장을 놓는 것이었다.≪문순태, 타오르는 강≫"]],1,[]],["생각","명사",0,"",[["사람이 머리를 써서 판단하거나 인식하는 것.","나름의 생각.","فِكْرَة"],["사물을 헤아리고 판단하는 작용.","올바른 생각."]],1,[]],["모두","명사",0,"",[["일정한 수효나 양을 기준으로 하여 빠짐이나 넘침이 없는 전체.","식구 모두가 여행을 떠났다."]],1,[]],["새","명사",0,"",[["한 물체에서 다른 물체까지 또는 한곳에서 다른 곳까지의 거리나 공간.","새가 넓다.","فَجْوَة"],["몸에 깃털이 있고 다리가 둘이며, 하늘을 자유로이 날 수 있는 짐승을 통틀어 이르는 말.","새가 지저귀다."]],1,[]],["다리","명사",0,"",[["사람이나 동물의 몸통 아래에 붙어, 서고 걷고 뛰는 일을 하는 신체 부위.","다리가 굵다.","رِجْل"],["사람이나 동물의 몸통 아래 붙어 있는 신체의 부분. 서고 걷고 뛰는 일 따위를 맡아 한다.","다리가 굵다."],["물을 건너거나 또는 한편의 높은 곳에서 다른 편의 높은 곳으로 건너다닐 수 있도록 만든 시설물.","다리를 건너다."]],1,[]],["기계(機械)","명사",0,"틀 기, 기계 계",[["일정한 일을 하는 도구나 장치.","복사 기계.","أَدَاةٌ، آلَةٌ"],["동력을 써서 움직이거나 일을 하는 장치. 단위로 대, 조, 틀 따위가 있다.","기계 제조."]],1,[]],["돌","명사",0,"",[["아기가 태어난 날로부터 한 해가 되는 날.","조카 돌.","عِيد الْمِيلَاد الْأَوَّل"],["흙 따위가 굳어서 된 광물질의 단단한 덩어리. 바위보다는 작고 모래보다는 큰 것을 이른다.","돌을 던지다."]],1,[]],["프랑스(France)","명사",0,"",[["유럽 서부에 있는 공화국. 민족 대이동의 결과 5세기에 프랑크 왕국이 성립하여 백 년 전쟁 이후 왕권이 신장되었고, 17~18세기에는 유럽의 지도적인 위치에 군림하였다. 1789년의 혁명으로 공화정이 성립되었으며 1958년 이후 드골에 의한 제오 공화정을 거쳐 지금에 이른다. 기계·귀금속·섬유·화학·건축 공업이 발달하였고 유럽 굴지의 농업국이며, 주민은 라틴계로 대부분이 가톨릭교도이다. 수도는 파리, 면적은 55만 1458㎢.",""]],1,[]],["열(熱)","명사",0,"더울 열",[["아플 때 몸에 생기는 더운 기운.","가벼운 열.","حُمَّى"],["병으로 인하여 오르는 몸의 열.","열이 있다."],["계(系)를 뜨겁게 해주는 것. 계에 열이 가해지면 계를 구성하는 원자와 분자들의 무질서한 열 운동이 활발하게 되어 온도가 올라간다.",""]],1,[]],["기구(器具)","명사",0,"그릇 기, 갖출 구",[["세간, 도구, 기계 따위를 통틀어 이르는 말.","부엌 기구."]],1,[]],["장치(裝置)","명사",0,"꾸밀 장, 둘 치",[["어떤 목적에 따라 일을 해낼 수 있도록 기계나 도구 등을 설치함. 또는 그 기계나 도구.","기계 장치.","جهاز ، أجهزة، مُعدَّات"],["어떤 목적에 따라 기능하도록 기계, 도구 따위를 그 장소에 장착함. 또는 그 기계, 도구, 설비.","도청 장치."]],1,[]],["목적(目的)","명사",0,"눈 목, 과녁 적",[["실현하려고 하는 일이나 나아가는 방향.","목적을 달성하다."]],1,[]],["신라(新羅)","명사",0,"새 신, 벌릴 라",[["우리나라 삼국 시대의 삼국 가운데 하나로, 기원전 57년에 박혁거세가 경주에 도읍하여 세운 나라. 한반도의 동남부를 중심으로 세력을 펼쳤으며, 진흥왕 때에 가야를 병합하였다. 태종 무열왕 때에 백제를, 문무왕 때에 고구려를 멸하여 삼국을 통일하였다. 935년에 고려에 의해 멸망하였다.",""]],1,[]],["빛깔","명사",0,"",[["물체가 빛을 받을 때 빛의 파장에 따라 그 거죽에 나타나는 특유한 빛.","바다의 푸른 빛깔."]],1,[]],["손","명사",0,"",[["팔목 끝에 있으며 무엇을 만지거나 잡을 때 쓰는 몸의 부분.","손과 발.","يَدٌ"],["사람의 팔목 끝에 달린 부분. 손등, 손바닥, 손목으로 나뉘며 그 끝에 다섯 개의 손가락이 있어, 무엇을 만지거나 잡거나 한다.","손으로 잡다."]],1,[]],["영국(英國)","명사",0,"꽃부리 영, 나라 국",[["유럽 서부 대서양 가운데 있는 입헌 군주국. 그레이트브리튼섬과 북아일랜드 및 부근 900여 개의 섬으로 이루어진 국가로, 석탄과 철광을 이용한 중공업 및 원료 수입에 의한 각종 공업이 발달하였다. 주민은 대부분이 앵글로·색슨으로 신교를 신봉하고 주요 언어는 영어이다. 수도는 런던, 면적은 24만 4820㎢.",""]],1,[]],["경기(競技)","명사",0,"다툴 경, 재주 기",[["일정한 규칙 아래 기량과 기술을 겨룸. 또는 그런 일.","경기 규칙."]],1,[]],["표현(表現)","명사",0,"겉 표, 나타날 현",[["생각이나 느낌 따위를 언어나 몸짓 따위의 형상으로 드러내어 나타냄.","예술적 표현."]],1,[]],["다음","명사",0,"",[["어떤 차례에서 바로 뒤.","다음 날.","مَا يَلِي"],["어떤 차례의 바로 뒤.","친구의 당번 순서는 내 다음이다."]],1,[]],["약(藥)","명사",0,"약 약",[["병이나 상처 등을 낫게 하거나 예방하기 위하여 먹거나 바르거나 주사하는 물질.","신통한 약.","دواء"],["병이나 상처 따위를 고치거나 예방하기 위하여 먹거나 바르거나 주사하는 물질.","약을 먹다."]],1,[]],["밖","명사",0,"",[["선이나 경계를 넘어선 쪽.","교실 밖.","الْخَارِجُ"],["어떤 선이나 금을 넘어선 쪽.","밖을 내다보다."]],1,[]],["알","명사",0,"",[["새, 물고기, 곤충 등의 암컷이 낳으며 일정한 시간이 지나면 새끼나 애벌레가 나오는 둥근 모양의 물질.","개미의 알.","بَيْض"],["조류, 파충류, 어류, 곤충 따위의 암컷이 낳는, 둥근 모양의 물질. 일정한 시간이 지나면 새끼나 애벌레로 부화한다.","타조의 알."]],1,[]],["옷","명사",0,"",[["사람의 몸을 가리고 더위나 추위 등으로부터 보호하며 멋을 내기 위하여 입는 것.","새 옷."]],0,[]],["말로(末路)","명사",0,"끝 말, 길 로",[["인생의 마지막 무렵.","독재자의 말로.","آخِر وَقْت"],["사람의 일생 가운데에서 마지막 무렵.","망국의 왕으로서 의자왕은 말로가 너무도 비통스러웠고….≪이청준, 춤추는 사제≫"]],1,[]],["자신(自身)","명사",0,"스스로 자, 몸 신",[["바로 그 사람.","자신의 노력.","نفسه، ذاته"],["그 사람의 몸 또는 바로 그 사람을 이르는 말.","자신의 노력."]],1,[]],["면적(面積)","명사",0,"낯 면, 쌓을 적",[["면이 이차원의 공간을 차지하는 넓이의 크기.","면적이 넓다."]],1,[]],["그림","명사",0,"",[["선이나 색채로 사물의 모양이나 이미지 등을 평면 위에 나타낸 것.","꽃 그림.","رَسْمٌ"],["선이나 색채를 써서 사물의 형상이나 이미지를 평면 위에 나타낸 것.","그림을 그리다."]],1,[]],["위해(危害)","명사",0,"위태할 위, 해할 해",[["위험과 재해를 아울러 이르는 말.","위해를 방지하다."]],1,[]],["얼굴","명사",0,"",[["눈, 코, 입이 있는 머리의 앞쪽 부분.","시커먼 얼굴.","وَجْه"],["눈, 코, 입이 있는 머리의 앞면.","얼굴을 씻다."]],1,[]],["한쪽","명사",0,"",[["어느 하나의 편이나 방향.","방의 한쪽 구석."]],1,[]],["달걀","명사",0,"",[["닭이 낳은 알. 알껍데기, 노른자, 흰자 따위로 이루어져 있다.","달걀 꾸러미."]],1,[]],["사회(社會)","명사",0,"모일 사, 모일 회",[["계층, 직업, 신분 등이 비슷한 사람들이 모여 이루는 집단.","공직 사회.","مُجْتَمَع"],["같은 무리끼리 모여 이루는 집단.","상류 사회."]],1,[]],["작용(作用)","명사",0,"지을 작, 쓸 용",[["어떠한 현상을 일으키거나 영향을 미침.","예술의 사회적 작용."]],1,[]],["전기(前期)","명사",0,"앞 전, 기약할 기",[["일정 기간을 몇 개로 나눈 첫 시기.","프로 야구 전기 리그."]],1,[]],["인도(引導)","명사",0,"끌 인, 인도할 도",[["어떤 목적이나 방향으로 남을 이끌어 지도함.","인도가 되다.","إِرْشَاد"],["이끌어 지도함.","선생님의 인도에 따라 기본부터 차근히 수업을 따라가고 있다."]],1,[]],["구멍","명사",0,"",[["뚫어지거나 파낸 자리.","구멍 난 양말."]],1,[]],["정신(精神)","명사",0,"정할 정, 귀신 신",[["육체나 물질과 반대되는 영혼이나 마음.","정신 세계.","روح، عقل"],["육체나 물질에 대립되는 영혼이나 마음.","육체와 정신."]],1,[]],["달","명사",0,"",[["밤이 되면 하늘에 뜨는 동그랗고 밝은 빛이 나는 천체.","밝은 달.","قَمَر"],["지구의 위성(衛星). 햇빛을 반사하여 밤에 밝은 빛을 낸다. 표면에 많은 분화구가 있으며 대기는 없다. 공전 주기는 27.32일, 반지름은 1,738km이다.","달이 뜨다."]],1,[]],["공(空)","명사",0,"빌 공",[["숫자 영.","서울의 지역 번호는 02(공이)다.","صِفْر"],["값이 없는 수. ‘0’으로 표기한다.",""]],1,[]],["국가(國家)","명사",0,"나라 국, 집 가",[["일정한 영토와 거기에 사는 사람들로 구성되고, 주권에 의한 통치 조직을 가지는 사회 집단. 국민·영토·주권의 3요소를 필요로 한다.",""]],1,[]],["독일(獨逸)","명사",0,"홀로 독, 편안할 일",[["유럽 중부에 있는 나라. 843년에 동프랑크 왕국을 세워 962년에 신성 로마 제국으로 발전하였고, 1871년에 프로이센에 의하여 통일되어 게르만족을 중심으로 하는 독일 제국이 완성되었다. 그 후 제일 차·제이 차 세계 대전의 패배로 1949년에 동서로 분단되었다가 1990년 10월에 독일 연방 공화국으로 통일되었다. 주민은 대부분 튜턴족(Teuton族)이며, 주요 언어는 독일어이다. 수도는 베를린, 면적은 35만 6734㎢.",""]],1,[]],["바다","명사",0,"",[["지구에서 육지 이외의 부분으로 짠물이 차 있는 곳.","겨울 바다.","بَحْرٌ"],["지구 위에서 육지를 제외한 부분으로 짠물이 괴어 하나로 이어진 넓고 큰 부분. 지구 표면적의 약 70.8%를 차지하는데, 이는 육지 면적의 2.43배이다.","넓고 푸른 바다."]],1,[]],["여럿","명사",0,"",[["여러 사람.","여럿이 같이."],["여러 개.","여럿 가운데."]],0,[]],["들","명사",0,"",[["탁 트여 넓고 평평한 땅.","광활한 들.","حَقْل ، سَهْل ، مَرْج"],["편평하고 넓게 트인 땅.","끝없이 펼쳐진 들."]],1,[]],["기간(期間)","명사",0,"기약할 기, 사이 간",[["어느 일정한 시기부터 다른 어느 일정한 시기까지의 사이.","공백 기간."]],1,[]],["조직(組織)","명사",0,"짤 조, 짤 직",[["어떤 목표를 이루기 위해 여럿이 모여 체계 있는 집단을 이룸. 또는 그 집단.","판매 조직.","تَنْظِيم"],["특정한 목적을 달성하기 위하여 여러 개체나 요소를 모아서 체계 있는 집단을 이룸. 또는 그 집단.","조직 사업."]],1,[]],["작고(作故)","명사",0,"지을 작, 연고 고",[["고인이 되었다는 뜻으로, 사람의 죽음을 높여 이르는 말.","원로 소설가의 작고 소식이 알려지자 후배 작가들 사이에서 추모의 물결이 일었다."]],1,[]],["기름","명사",0,"",[["불에 잘 타고 물에 잘 섞이지 않는 미끈미끈한 액체.","동물성 기름.","زَيْت"],["물보다 가볍고 불을 붙이면 잘 타는 액체. 약간 끈기가 있고 미끈미끈하며 물에 잘 풀리지 않는다. 동물의 살, 뼈, 가죽에 엉기어 있기도 하고 식물의 씨앗에서 짜내기도 하는데, 원료에 따라서 빛깔과 성질이 다르고 쓰임새가 매우 다양하다.","식물성 기름."]],1,[]],["단체(團體)","명사",0,"둥글 단, 몸 체",[["같은 목적을 이루기 위해 모인 사람들의 조직.","이익 단체.","جَمَاعَة"],["같은 목적을 달성하기 위하여 모인 사람들의 일정한 조직체.","이익 단체."]],1,[]],["제도(制度)","명사",0,"절제할 제, 법도 도",[["관습이나 도덕, 법률 따위의 규범이나 사회 구조의 체계.","결혼 제도."]],1,[]],["목","명사",0,"",[["사람이나 동물의 머리와 몸통을 잇는 잘록한 부분.","갸름한 목.","رَقَبَة"],["척추동물의 머리와 몸통을 잇는 잘록한 부분.","목이 긴 여자."]],1,[]],["볼","명사",0,"",[["얼굴의 양쪽 부분으로 귀와 입 사이에 있는 부분.","볼이 빨개지다.","خَدّ"],["뺨의 한복판.","볼을 만지다."]],1,[]],["밑","명사",0,"",[["사물의 아래쪽.","눈 밑.","سُفْلٌ"],["물체의 아래나 아래쪽.","지붕 밑."]],1,[]],["전체(全體)","명사",0,"온전할 전, 몸 체",[["개개 또는 부분의 집합으로 구성된 것을 몰아서 하나의 대상으로 삼는 경우에 바로 그 대상.","국가 전체."]],1,[]],["하늘","명사",0,"",[["땅 위로 펼쳐진 무한히 넓은 공간.","가을 하늘.","سماء"],["지평선이나 수평선 위로 보이는 무한대의 넓은 공간.","높고 푸른 가을 하늘."]],1,[]],["유럽(Europe)","명사",0,"",[["동쪽은 우랄산맥·아랄해·카스피해·흑해 따위를 경계로 하여 아시아 대륙과 접하고 있으며, 남쪽은 아프리카 대륙과 지중해를 사이에 두고 있는 대륙. 육대주의 하나이다.",""]],1,[]],["스스로","명사",0,"",[["자기 자신.","그는 스스로를 속이고 있다."]],1,[]],["경우(境遇)","명사",0,"지경 경, 만날 우",[["당연히 행하여야 할 바른 이치.","경우가 바르다.",""],["사리나 도리.","경우가 아니다."],["놓여 있는 조건이나 놓이게 된 형편이나 사정.","만일의 경우."]],1,[]],["비(比)","명사",0,"견줄 비",[["전체를 이루는 부분들 사이의 비율 관계.","인체의 비.","نِسْبَةٌ"],["표현된 물상의 각 부분 상호 간 또는 전체와 부분 간이 양적으로 일정한 관계가 됨. 또는 그런 관계.","구도를 잡으려면 가로와 세로의 비를 잘 맞추어야 한다."]],1,[]],["학문(學問)","명사",0,"배울 학, 물을 문",[["어떤 분야를 체계적으로 배워서 익힘. 또는 그런 지식.","학문이 깊다."]],1,[]],["선(線)","명사",0,"줄 선",[["가로나 세로로 그은 금이나 줄.","선이 교차하다.","خَطّ ، حَبْل"],["그어 놓은 금이나 줄.","선을 긋다."]],1,[]],["중(中)","명사",0,"가운데 중",[["등급, 수준, 차례 등에서 가운데.","난이도가 중이다.","متوسّط"],["등급, 수준, 차례 따위에서 가운데.","성적이 중은 된다."]],1,[]],["재료(材料)","명사",0,"재목 재, 헤아릴 료",[["물건을 만드는 데 쓰이는 것.","건축 재료.","مَادَّة"],["물건을 만드는 데 들어가는 감.","음식 재료."]],1,[]],["증상(症狀)","명사",0,"증세 증, 형상 상",[["병을 앓을 때 나타나는 여러 가지 상태나 모양.","증상이 심하다."]],1,[]],["기운","명사",0,"",[["생물이 몸을 움직이고 활동하는 힘.","기운이 나다.","قُوَّة، طَاقَة"],["생물이 살아 움직이는 힘.","기운이 세다."]],1,[]],["하지(夏至)","명사",0,"여름 하, 이를 지",[["이십사절기의 하나. 망종과 소서 사이에 들며, 양력 6월 21일경으로, 북반구에서는 낮이 가장 길고 밤이 가장 짧다.","계절은 하지를 지나 소서로 접어들었다. 가는 곳마다 수풀이 무성하고 벼도 쑥 커 올랐다.≪오유권, 대지의 학대≫"]],1,[]],["부처","명사",0,"",[["불교의 창시자인 석가모니.","부처의 가르침.","بُوذَا"],["‘석가모니’의 다른 이름.",""]],1,[]],["생활(生活)","명사",0,"날 생, 살 활",[["사람이나 동물이 일정한 곳에서 살아감.","각박한 생활.","عِيشَة"],["사람이나 동물이 일정한 환경에서 활동하며 살아감.","생활 방식이 다르다."]],1,[]],["음악(音樂)","명사",0,"소리 음, 즐길 악",[["박자, 가락, 음성 따위를 갖가지 형식으로 조화하고 결합하여, 목소리나 악기를 통하여 사상 또는 감정을 나타내는 예술.","음악 감상실."]],1,[]],["문장(文章)","명사",0,"글월 문, 글 장",[["생각이나 감정을 말과 글로 표현할 때 완결된 내용을 나타내는 최소의 단위. 주어와 서술어를 갖추고 있는 것이 원칙이나 때로 이런 것이 생략될 수도 있다. 글의 경우, 문장의 끝에 ‘.’, ‘?’, ‘!’ 따위의 문장 부호를 찍는다. ‘철수는 몇 살이니?’, ‘세 살.’, ‘정말?’ 따위이다.","서툰 문장."],["글을 짓는 실력이 뛰어난 사람.","최고의 문장.","أَدِيب"]],1,[]],["제사(祭祀)","명사",0,"제사 제, 제사 사",[["신령이나 죽은 사람의 넋에게 음식을 바치어 정성을 나타냄. 또는 그런 의식.","제사를 드리다."]],1,[]],["맛","명사",0,"",[["음식 등을 혀에 댈 때 느껴지는 감각.","좋은 맛.","طُعْم"],["음식 따위를 혀에 댈 때에 느끼는 감각.","맛이 달콤하다."]],1,[]],["난(欄)","명사",0,"난간 난",[["신문, 책, 서류 등에서 글이나 그림 등을 채워 넣기 위한 자리.","광고를 싣는 난.",""],["책, 신문, 잡지 따위의 지면에 글이나 그림 따위를 싣기 위하여 마련한 자리.","독자의 소리를 싣는 난."]],1,[]],["절(節)","명사",0,"마디 절",[["글의 내용을 여러 단락으로 서술할 때의 한 단락.","창세기 1장 1절."],["신념, 신의 따위를 굽히지 아니하고 굳게 지키는 꿋꿋한 태도.",""]],1,[]],["봄","명사",0,"",[["네 계절 중의 하나로 겨울과 여름 사이의 계절.","꽃 피는 봄.","رَبِيع"],["한 해의 네 철 가운데 첫째 철. 겨울과 여름 사이이며, 달로는 3~5월, 절기(節氣)로는 입춘부터 입하 전까지를 이른다.","겨울이 가고, 봄이 왔다."]],1,[]],["죄(罪)","명사",0,"허물 죄",[["양심이나 도리에 벗어난 행위.","죄를 범하다."]],1,[]],["성(性)","명사",0,"성품 성",[["사람이 타고난 성질.","사람만의 성.","نَوْع"],["사람이나 사물 따위의 본성이나 본바탕.",""],["남성과 여성, 수컷과 암컷의 구별. 또는 그 생물학적 특징.","병아리의 성을 감별하다."],["남녀의 육체적 관계. 또는 그에 관련된 일.","성을 금기시하다."]],1,[]],["하기(下記)","명사",0,"아래 하, 기록할 기",[["어떤 사실을 알리기 위하여 본문 아래 적는 일. 또는 그런 기록.","하기 사항을 참조하시기 바람."]],1,[]],["약간(若干)","명사",0,"같을 약, 방패 간",[["얼마 되지 않음.","그는 약간의 돈이 필요한 모양이었다."]],1,[]],["소","명사",0,"",[["송편이나 만두 등을 만들 때, 속에 넣는 여러 가지 재료.","돼지고기 소.","حشوة"],["송편이나 만두 따위를 만들 때, 맛을 내기 위하여 익히기 전에 속에 넣는 여러 가지 재료. 송편에는 팥이나 콩·대추·밤 따위를 사용하고, 만두에는 고기·두부·채소 따위를 사용한다.","만두에 소를 적게 넣으면 맛이 없다."],["솟과의 포유류. 몸의 높이는 1.2~1.5미터이며 검은색, 흰색, 갈색 따위의 짧은 털이 나 있다. 뿔은 없거나 한 쌍이 있고 발굽은 둘로 갈라져 있다. 꼬리는 가늘고 긴데 끝에는 술 모양의 털이 있다. 풀 따위를 먹고 한 번 삼킨 것을 되새김한다. 옛날부터 기른 유용한 가축으로 운반, 경작 따위에 쓰인다. 고기나 젖은 식용하며 가죽, 뿔 따위도 여러 가지로 이용한다. 세계 각지에서 기르는데 홀스타인, 에어셔, 한우 따위의 품종이 있다.","소 네 필."]],1,[]],["발","명사",0,"",[["사람이나 동물의 다리 맨 끝부분.","발을 디디다."]],1,[]],["직접(直接)","명사",0,"곧을 직, 이을 접",[["중간에 제삼자나 매개물이 없이 바로 연결되는 관계.","직접 거명."]],1,[]],["가슴","명사",0,"",[["인간이나 동물의 목과 배 사이에 있는 몸의 앞 부분.","가슴이 넓다.","صَدْر"],["배와 목 사이의 앞부분.","가슴이 넓다."]],1,[]],["흙","명사",0,"",[["지구의 표면을 덮고 있는, 바위가 부스러져 생긴 가루인 무기물과 동식물에서 생긴 유기물이 섞여 이루어진 물질.","흙 한 줌."]],1,[]],["공업(工業)","명사",0,"장인 공, 업 업",[["원료를 인력이나 기계력으로 가공하여 유용한 물자를 만드는 산업. 예전에는 주로 가내 공업이었으나 기계의 발달에 따라 대규모로 되었다. 제조업, 건설업 따위의 제이차 산업을 이르는 말이다.","한마디로 말해 이제 우리 집의 경제 형태도 세상의 추세에 따라 농업에서 공업으로 바뀌게 되는 셈이지.≪김원일, 불의 제전≫"]],1,[]],["그대로","명사",0,"",[["그 자체.","있는 그대로의 모습."]],1,[]],["낙엽(落葉)","명사",0,"떨어질 낙, 잎 엽",[["주로 가을에 나무에서 잎이 떨어지는 것.","이른 낙엽.","أَوْرَاق سَاقِطَة"],["말라서 떨어진 나뭇잎.","낙엽이 지다."]],1,[]],["상대편(相對便)","명사",0,"서로 상, 대할 대, 편할 편",[["어떤 일이나 말을 할 때 짝을 이루는 사람.","그는 항상 상대편의 눈을 보면서 말을 한다."]],1,[]],["밤","명사",0,"",[["해가 진 후부터 다음 날 해가 뜨기 전까지의 어두운 동안.","여름 밤.","لَيْلَة"],["해가 져서 어두워진 때부터 다음 날 해가 떠서 밝아지기 전까지의 동안.","밤 열 시."],["밤나무의 열매. 가시가 많이 난 송이에 싸여 있고 갈색 겉껍질 안에 얇고 맛이 떫은 속껍질이 있으며, 날것으로 먹거나 굽거나 삶아서 먹는다.","밤 한 톨."]],1,[]],["바탕","명사",0,"",[["사물이나 현상을 이루는 근본.","바탕이 되다.","أَسَاسٌ"],["물체의 뼈대나 틀을 이루는 부분.","서림이가 승교 바탕이 오기를 기다리고 조바심을 하는 중에….≪홍명희, 임꺽정≫"]],1,[]],["신(神)","명사",0,"귀신 신",[["종교의 대상으로 초인간적, 초자연적 위력을 가지고 인간에게 화복을 내린다고 믿어지는 존재.","신의 조화."]],1,[]],["나이","명사",0,"",[["사람이나 동·식물 따위가 세상에 나서 살아온 햇수.","나이가 젊다."]],1,[]],["노래","명사",0,"",[["가사가 있는 음악. 또는 그런 음악을 소리 내어 부름.","가수의 노래.","أُغْنِيَة"],["가사에 곡조를 붙여 목소리로 부를 수 있게 만든 음악. 또는 그 음악을 목소리로 부름.","노래를 부르다."]],1,[]],["겉","명사",0,"",[["안팎이 있는 물건에서 물건의 바깥쪽 부분.","봉투의 겉.","خَارِج"],["물체의 바깥 부분.","봉투 겉에 주소를 쓰다."]],1,[]],["연한(年限)","명사",0,"해 연, 한할 한",[["정하여지거나 경과한 햇수.","근무 연한."]],1,[]],["뿌리","명사",0,"",[["땅속으로 뻗어서 물과 양분을 빨아올리고 줄기를 지탱하는 식물의 한 부분.","나무의 뿌리.","جِذْرٌ"],["식물의 밑동으로서 보통 땅속에 묻히거나 다른 물체에 박혀 수분과 양분을 빨아올리고 줄기를 지탱하는 작용을 하는 기관. 양치류 이상의 고등 식물에 있는데 주근(主根)과 측근(側根)의 구별이 있으며 땅위뿌리, 물뿌리, 저장뿌리, 공기뿌리, 기생뿌리, 호흡뿌리 따위의 여러 종류가 있다.","뿌리를 캐다."]],1,[]],["벼슬아치","명사",0,"",[["관청에 나가서 나랏일을 맡아보는 사람.","벼슬아치들이 자기 이익만 생각하면 나라가 망한다."]],1,[]],["승려(僧侶)","명사",0,"중 승, 짝 려",[["불교의 출가 수행자.","속세와 인연을 끊고 승려가 되었다."]],1,[]],["용어(用語)","명사",0,"쓸 용, 말씀 어",[["일정한 분야에서 주로 사용하는 말.","경제 용어."]],1,[]],["종류(種類)","명사",0,"씨 종, 무리 류",[["어떤 기준에 따라 여러 가지로 나눈 갈래.","여러 종류."]],0,[]],["세상(世上)","명사",0,"인간 세, 윗 상",[["지구 위 전체.","넓은 세상.","عَالِم"],["사람이 살고 있는 모든 사회를 통틀어 이르는 말.","세상 사는 이치."]],1,[]],["원자(原子)","명사",0,"언덕 원, 아들 자",[["물질의 기본적 구성단위. 하나의 핵과 이를 둘러싼 여러 개의 전자로 구성되어 있고, 크기는 반지름이 10^(－7)~10^(－8)cm이며 한 개 또는 여러 개가 모여 분자를 이룬다.",""]],1,[]],["상황(狀況)","명사",0,"형상 상, 상황 황",[["일이 되어 가는 과정이나 형편.","상황이 유리하다."]],1,[]],["화학식(化學式)","명사",0,"될 화, 배울 학, 법 식",[["화합물을 표시하기 위하여 원소 기호를 조합한 식. 실험식, 분자식, 시성식(示性式), 구조식 따위가 있다.",""]],1,[]],["옆","명사",0,"",[["무엇의 왼쪽이나 오른쪽의 면.","도로 옆."]],0,[]],["기술(技術)","명사",0,"재주 기, 재주 술",[["과학 이론을 실제로 적용하여 인간 생활에 쓸모가 있게 하는 수단.","가공 기술.","تِكْنُولُوجِيَا، تِقْنِيَّة"],["과학 이론을 실제로 적용하여 사물을 인간 생활에 유용하도록 가공하는 수단.","건축 기술."],["사물을 잘 다룰 수 있는 방법이나 능력.","운전 기술."]],1,[]],["가루","명사",0,"",[["딱딱한 물건을 보드라울 정도로 잘게 부수거나 갈아서 만든 것.","분필 가루."]],1,[]],["군대(軍隊)","명사",0,"군사 군, 무리 대",[["일정한 규율과 질서를 가지고 조직된 군인의 집단.","군대 생활."]],1,[]],["계속(繼續)","명사",0,"이을 계, 이을 속",[["끊이지 않고 이어 나감.",""]],1,[]],["일부(一部)","명사",0,"한 일, 떼 부",[["한 부분. 또는 전체를 여럿으로 나눈 얼마.","일부 지역."]],1,[]],["의식(意識)","명사",0,"뜻 의, 알 식",[["정신이 깨어 있는 상태에서 무엇을 지각하거나 인식할 수 있는 기능.","의식이 깨어나다.","وعي"],["깨어 있는 상태에서 자기 자신이나 사물에 대하여 인식하는 작용.","의식을 잃다."]],1,[]],["남자(男子)","명사",0,"사내 남, 아들 자",[["남성으로 태어난 사람.","독신 남자."]],0,[]],["깊이","명사",0,"",[["위에서 밑바닥까지 또는 겉에서 속까지의 거리.","평균 깊이.","عُمْق"],["위에서 밑바닥까지, 또는 겉에서 속까지의 거리.","바다의 깊이."]],1,[]],["형태(形態)","명사",0,"모양 형, 모습 태",[["사물의 생긴 모양.","건물의 형태.","شكل, هيكل"],["사물의 생김새나 모양.","산의 형태."]],1,[]],["물고기","명사",0,"",[["어류의 척추동물을 통틀어 이르는 말.","물고기 두 마리."]],1,[]],["법(法)","명사",0,"법 법",[["국가의 강제력을 수반하는 사회 규범. 국가 및 공공 기관이 제정한 법률, 명령, 규칙, 조례 따위이다.","법을 어기다."]],1,[]],["장(場)","명사",0,"마당 장",[["정기적으로 많은 사람이 모여 여러 가지 물건을 사고파는 곳.","마을의 장.","سوق"],["어떤 일이 행하여지는 곳.","문제의 해결을 위하여 대화의 장이 마련되었다."]],1,[]],["언어(言語)","명사",0,"말씀 언, 말씀 어",[["생각, 느낌 따위를 나타내거나 전달하는 데에 쓰는 음성, 문자 따위의 수단. 또는 그 음성이나 문자 따위의 사회 관습적인 체계.","언어 감각."]],1,[]],["사상(思想)","명사",0,"생각 사, 생각 상",[["사회나 정치 등에 대한 일정한 견해.","사상의 자유.","فِكْرَة ، أَيْدِيُولُوجِيَّة"],["어떠한 사물에 대하여 가지고 있는 구체적인 사고나 생각.","사상의 자유."]],1,[]],["여름","명사",0,"",[["한 해의 네 철 가운데 둘째 철. 봄과 가을 사이이며, 낮이 길고 더운 계절로, 달로는 6~8월, 절기(節氣)로는 입하부터 입추 전까지를 이른다.","무더운 여름."]],1,[]],["차례(次例)","명사",0,"버금 차, 법식 례",[["어떤 일을 하거나 어떤 일이 일어나는 순서.","다음 차례."]],0,[]],["크기","명사",0,"",[["사물의 넓이, 부피, 양 따위의 큰 정도.","어린아이 크기만 한 인형."]],1,[]],["글자(글字)","명사",0,"글자 자",[["말을 적는 일정한 체계의 부호.","칠판에 적은 글자가 잘 안 보인다."]],1,[]],["곡식(穀食)","명사",0,"곡식 곡, 밥 식",[["사람의 식량이 되는 쌀, 보리, 콩, 조, 기장, 수수, 밀, 옥수수 따위를 통틀어 이르는 말.","곡식이 잘 여물었다."]],1,[]],["그릇","명사",0,"",[["음식을 담는 도구.","국수 그릇.","وِعَاءٌ"],["음식이나 물건 따위를 담는 기구를 통틀어 이르는 말. 세는 단위는 개, 벌, 죽 따위가 있다.","반찬 그릇."]],1,[]],["실","명사",0,"",[["고치, 털, 솜, 삼 따위나 화학 원료를 써서 가늘고 길게 뽑아 만든 것. 옷감을 짜고 바느질을 하는 데 쓴다. 단위로 타래, 퉁구리, 꾸리, 토리, 올, 님, 테, 가락, 오리, 바람 따위를 쓴다.","실 꿴 바늘."]],1,[]],["살","명사",0,"",[["사람이나 동물의 몸에서 뼈를 둘러싸고 있는 부드러운 부분.","살이 붙다.","لَحْم"],["창문이나 연(鳶), 부채, 바퀴 따위의 뼈대가 되는 부분.","살이 촘촘한 부채."]],1,[]],["공기(空器)","명사",0,"빌 공, 그릇 기",[["밥을 담아 먹는 데 쓰이는 밑이 좁은 위로 갈수록 벌어지는 그릇.","빈 공기.","زُبْدِيَّة"],["아무것도 담겨 있지 않은 그릇.","찌개를 공기에 덜어 먹다."]],1,[]],["씨","명사",0,"",[["식물의 열매 속에 있는, 앞으로 싹이 터서 자라게 될 단단한 물질.","참외의 씨.","بذر"],["식물의 열매 속에 있는, 장차 싹이 터서 새로운 개체가 될 단단한 물질.","땅에 씨를 심다."]],1,[]],["금속(金屬)","명사",0,"쇠 금, 붙일 속",[["열이나 전기를 잘 전도하고, 펴지고 늘어나는 성질이 풍부하며, 특수한 광택을 가진 물질을 통틀어 이르는 말. 수은을 제외하고는 모두 상온에서 고체이다. 비중이 4 내지 5 이하인 것을 경금속, 4 내지 5 이상인 것을 중금속이라고 한다.","무릎까지 파헤쳐 나가자 부삽 밑에 금속이 닿는 경쾌한 감촉이 있었다.≪최인호, 지구인≫"]],1,[]],["행위(行爲)","명사",0,"다닐 행, 할 위",[["사람이 의지를 가지고 하는 짓.","폭력 행위."]],1,[]],["고대(古代)","명사",0,"예 고, 대신할 대",[["원시 시대와 중세 사이의 아주 옛 시대.","고대 소설.","الْعُصُور الْقَدِيمَة"],["옛 시대.","고대와 현대."]],1,[]],["검은색(검은色)","명사",0,"빛 색",[["숯이나 먹의 빛깔과 같이 어둡고 짙은 색.","검은색 승용차."]],1,[]],["능력(能力)","명사",0,"능할 능, 힘 력",[["일을 감당해 낼 수 있는 힘.","문제 해결의 능력."]],1,[]],["감정(感情)","명사",0,"느낄 감, 뜻 정",[["어떤 현상이나 일에 대하여 일어나는 마음이나 느끼는 기분.",""]],1,[]],["양쪽(兩쪽)","명사",0,"두 양",[["두 쪽.","비행기의 양쪽 날개."]],1,[]],["보기","명사",0,"",[["어떤 사실을 설명하거나 증명하기 위하여 내세워 보이는 대표적인 것.","학생들이 어려워하자 선생님은 보기를 들어 다시 설명해 주셨다."]],1,[]],["표면(表面)","명사",0,"겉 표, 낯 면",[["사물의 가장 바깥쪽. 또는 가장 윗부분.","지구의 표면."]],1,[]],["면(面)","명사",0,"낯 면",[["시나 군에 속하고 몇 개의 리로 구성되는 지방의 행정 구역 단위.","면 단위.","مِيُون"],["사물의 겉으로 드러난 쪽의 평평한 바닥.","면이 고르지 않은 땅."]],1,[]],["삭과(削科)","명사",0,"깎을 삭, 과목 과",[["과거를 볼 때에, 규칙을 위반한 사람의 급제를 취소하던 일.",""]],1,[]],["못","명사",0,"",[["가늘고 끝이 뾰족해 두 사물을 이어 붙여 고정하거나 벽에 박아 어떤 물건을 거는 데 쓰는 쇠로 만든 물건.","가는 못.","مِسْمَار"],["넓고 오목하게 팬 땅에 물이 괴어 있는 곳. 늪보다 작다.","못을 파다."],["목재 따위의 접합이나 고정에 쓰는 물건. 쇠, 대, 나무 따위로 가늘고 끝이 뾰족하게 만든다.","벽에 못을 박다."]],1,[]],["타원형(楕圓形)","명사",0,"길고둥글 타, 둥글 원, 모양 형",[["길쭉하게 둥근 타원으로 된 평면 도형. 또는 그런 모양.",""]],1,[]],["바닥","명사",0,"",[["어떤 공간에서 아래쪽의 평평하고 넓은 부분.","마루 바닥.","أَرْض"],["평평하게 넓이를 이룬 부분.","책상 바닥."]],1,[]],["기준(基準)","명사",0,"터 기, 준할 준",[["기본이 되는 표준.","심사 기준."]],1,[]],["무리","명사",0,"",[["사람이나 짐승, 사물 따위가 모여서 뭉친 한 동아리.","반란군의 무리."]],1,[]],["문제(問題)","명사",0,"물을 문, 제목 제",[["답을 요구하는 물음.","연습 문제.","سُؤَال"],["해답을 요구하는 물음.","문제 풀이."]],1,[]],["가을","명사",0,"",[["한 해의 네 철 가운데 셋째 철. 여름과 겨울의 사이이며, 달로는 9~11월, 절기(節氣)로는 입추부터 입동 전까지를 이른다.","높디높은 가을 하늘."]],1,[]],["중간(中間)","명사",0,"가운데 중, 사이 간",[["두 사물의 사이.","학교와 집의 중간."]],1,[]],["물품(物品)","명사",0,"물건 물, 물건 품",[["일정하게 쓸 만한 값어치가 있는 물건.","수업에 필요한 물품."]],1,[]],["입","명사",0,"",[["음식을 먹고 소리를 내는 기관으로 입술에서 목구멍까지의 부분.","입 냄새.","فم"],["입술에서 후두(喉頭)까지의 부분. 음식이나 먹이를 섭취하며, 소리를 내는 기관이다.","입이 크다."]],1,[]],["가장자리","명사",0,"",[["둘레나 끝에 해당되는 부분.","아기는 손등으로 눈물을 닦아서 눈 가장자리가 빨갛게 되었다."]],1,[]],["명령(命令)","명사",0,"목숨 명, 하여금 령",[["윗사람이 아랫사람에게 무엇을 시킴. 또는 그런 내용.","상사의 명령.","أَمْر"],["윗사람이나 상위 조직이 아랫사람이나 하위 조직에 무엇을 하게 함. 또는 그런 내용.","이 로봇은 주인의 명령에 따라 움직입니다."]],1,[]],["화합물(化合物)","명사",0,"될 화, 합할 합, 물건 물",[["둘 이상의 원소의 원자를 가진 동일한 분자로 이루어진 물질.",""]],1,[]],["과거(過去)","명사",0,"지날 과, 갈 거",[["지나간 때.","먼 과거.","مَاضِي"],["이미 지나간 때.","과거의 습관."]],1,[]],["인간(人間)","명사",0,"사람 인, 사이 간",[["생각할 수 있으며 언어와 도구를 만들어 사용하고 사회를 이루어 사는 존재.","인간 사회.","إِنْسَان"],["생각을 하고 언어를 사용하며, 도구를 만들어 쓰고 사회를 이루어 사는 동물.","인간의 본성은 선하다."]],1,[]],["뼈","명사",0,"",[["동물이나 사람의 살 속에서 그 몸을 지탱하는 단단한 물질.","뼈가 가늘다.","عَظْم (أَوْ عِظَام)"],["척추동물의 살 속에서 그 몸을 지탱하는 단단한 물질. 표면은 뼈막으로 덮여 있고, 속에는 혈구를 만드는 골수로 채워져 있다.","뼈가 부러지다."]],1,[]],["진(津)","명사",0,"나루 진",[["풀이나 나무의 껍질 등에서 나오는 끈끈한 물질.","소나무의 진.","صمغ، علك"],["풀이나 나무의 껍질 따위에서 분비되는 끈끈한 물질.","송진은 소나무의 진이다."],["김이나 연기 또는 눅눅한 기운이 서려서 생기는 끈끈한 물질.","담뱃대에 진이 가득 찼다."]],1,[]],["잘못","명사",0,"",[["잘하지 못하여 그릇되게 한 일. 또는 옳지 못하게 한 일.","잘못을 고치다."]],1,[]],["왕(王)","명사",0,"임금 왕",[["왕위가 이어지는 나라에서 나라를 다스리는 사람.","슬기로운 왕.","مَلِك"],["군주 국가에서 나라를 다스리는 우두머리.","왕을 세우다."]],1,[]],["쌀","명사",0,"",[["벼에서 껍질을 벗겨 낸 알맹이.","쌀이 많이 나는 고장."]],1,[]],["형식(形式)","명사",0,"모양 형, 법 식",[["겉으로 나타나 보이는 모양.","비슷한 형식.","شكل, مظهر"],["사물이 외부로 나타나 보이는 모양.","형식을 갖추다."]],1,[]],["남쪽(南쪽)","명사",0,"남녘 남",[["동서남북 네 방위 중의 하나로, 나침반의 에스(S) 극이 가리키는 쪽.","남쪽 방향.","جَنُوب"],["네 방위의 하나. 나침반의 에스(S) 극이 가리키는 방위이다.","낮에는 남쪽으로 난 창으로 햇빛이 들어와 춥지는 않습니다."]],1,[]],["꼬리","명사",0,"",[["동물의 몸뚱이의 뒤 끝에 달려 있거나 나와 있는 부분.","강아지 꼬리.","ذَيْلٌ"],["동물의 꽁무니나 몸뚱이의 뒤 끝에 붙어서 조금 나와 있는 부분. 짐승에 따라 조금씩 모양이 다르다.","꼬리가 짧다."]],1,[]],["활동(活動)","명사",0,"살 활, 움직일 동",[["몸을 움직여 행동함.","다리를 다쳐서 활동이 어렵다."]],1,[]],["조사(調査)","명사",0,"고를 조, 조사할 사",[["사물의 내용을 명확히 알기 위하여 자세히 살펴보거나 찾아봄.","사고 경위 조사."]],1,[]],["지금(只今)","명사",0,"다만 지, 이제 금",[["말을 하고 있는 바로 이때.","바로 지금."]],0,[]],["영향(影響)","명사",0,"그림자 영, 울릴 향",[["어떤 사물의 효과나 작용이 다른 것에 미치는 일.","부정적 영향."]],1,[]],["소설(小說)","명사",0,"작을 소, 말씀 설",[["작가가 지어내어 쓴, 이야기 형식으로 된 문학 작품.","고전 소설.","رواية، قصة"],["사실 또는 작가의 상상력에 바탕을 두고 허구적으로 이야기를 꾸며 나간 산문체의 문학 양식. 일정한 구조 속에서 배경과 등장인물의 행동, 사상, 심리 따위를 통하여 인간의 모습이나 사회상을 드러낸다. 분량에 따라 장편·중편·단편으로, 내용에 따라 과학 소설·역사 소설·추리 소설 따위로 구분할 수 있으며, 옛날의 설화나 서사시 따위의 전통을 이어받아 근대에 와서 발달한 문학 양식이다.","1950년대 소설의 특징."]],1,[]],["모습","명사",0,"",[["사람이나 사물의 생김새.","어머니의 모습.","مَشْهَد، صُورَة"],["사람의 생긴 모양.","웃는 모습."]],1,[]],["이익(利益)","명사",0,"이할 이, 더할 익",[["물질적으로나 정신적으로 보탬이나 도움이 되는 것.","눈앞의 이익.","فائدة"],["물질적으로나 정신적으로 보탬이 되는 것.","이익을 내다."]],1,[]],["음(音)","명사",0,"소리 음",[["글자의 소리.","한자의 음.","صَوْت"],["물체의 진동에 의하여 생긴 음파가 귀청을 울리어 귀에 들리는 것.",""],["글자의 음. 흔히 한자의 음을 이른다.",""]],1,[]],["문서(文書)","명사",0,"글월 문, 글 서",[["글이나 기호 따위로 일정한 의사나 관념 또는 사상을 나타낸 것.","예부터의 구전을 훨씬 뒷날에 와서 문자로 정착시킨 위경 형태의 문서들이었다.≪이문열, 사람의 아들≫"]],1,[]],["후(後)","명사",0,"뒤 후",[["뒤나 다음.","며칠 후에 다시 만납시다."]],1,[]],["짐승","명사",0,"",[["몸에 털이 나고 네 발을 가진, 사람이 아닌 동물.","사나운 짐승.","حَيَوَان"],["몸에 털이 나고 발이 네 개인 동물.","커다란 짐승 한 마리."]],1,[]],["북부(北部)","명사",0,"북녘 북, 떼 부",[["어떤 지역의 북쪽 부분.","북부 지방."]],1,[]],["지위(地位)","명사",0,"땅 지, 자리 위",[["사회적 신분에 따른 계급이나 위치.","경제적 지위.","مَنْصِب"],["개인의 사회적 신분에 따르는 위치나 자리.","지위 향상."]],1,[]],["활엽(闊葉)","명사",0,"넓을 활, 잎 엽",[["넓고 큰 잎사귀.",""]],1,[]],["직업(職業)","명사",0,"직분 직, 업 업",[["생계를 유지하기 위하여 자신의 적성과 능력에 따라 일정한 기간 동안 계속하여 종사하는 일.","직업 소개."]],1,[]],["녹색(綠色)","명사",0,"푸를 녹, 빛 색",[["노란색과 파란색의 중간색으로, 짙은 풀과 같은 색.","짙은 녹색.","أَخْضَر"],["파랑과 노랑의 중간색. 또는 그런 색의 물감.","짙은 녹색."]],1,[]],["각각(各各)","명사",0,"각각 각, 각각 각",[["사람이나 물건의 하나하나.","회의 참석자들은 각각의 의견을 자유롭게 이야기했다."]],1,[]],["시기(時機)","명사",0,"때 시, 틀 기",[["적당한 때나 기회.","시기가 나쁘다."]],1,[]],["불교(佛敎)","명사",0,"부처 불, 가르칠 교",[["기원전 6세기경 인도의 석가모니가 창시한 후 동양 여러 나라에 전파된 종교. 이 세상의 고통과 번뇌를 벗어나 그로부터 해탈하여 부처가 되는 것을 궁극적인 이상으로 삼는다. 교리에 따라 대승인 북방 불교와 소승인 남방 불교로 나누는데, 동양의 문화에 절대적인 영향을 끼쳤다.","그는 불교를 믿는 집안에서 자라 자연스럽게 절에 다니게 되었다."]],1,[]],["행정(行政)","명사",0,"다닐 행, 정사 정",[["규정이나 규칙에 의하여 공적인 일들을 처리함.","기관 행정.","إدارة، تنظيم"],["정치나 사무를 행함.","행정 경험."]],1,[]],["전쟁(戰爭)","명사",0,"싸움 전, 다툴 쟁",[["대립하는 나라나 민족이 군대와 무기를 사용하여 서로 싸움.","남북 전쟁.","حَرْب"],["국가와 국가, 또는 교전(交戰) 단체 사이에 무력을 사용하여 싸움.","전쟁 도발."]],1,[]],["사건(事件)","명사",0,"일 사, 물건 건",[["사회적으로 문제를 일으키거나 주목을 받을 만한 뜻밖의 일.","역사적인 사건."]],1,[]],["남부(南部)","명사",0,"남녘 남, 떼 부",[["어떤 지역의 남쪽 부분.","남부 지방."]],1,[]],["학교(學校)","명사",0,"배울 학, 학교 교",[["일정한 목적·교과 과정·설비·제도 및 법규에 의하여 계속적으로 학생에게 교육을 실시하는 기관.","학교에 다니다."]],1,[]],["상(像)","명사",0,"모양 상",[["‘조각’이나 ‘그림’의 뜻을 나타내는 말.","독수리상.","عَمَل"],["눈에 보이거나 마음에 그려지는 사물의 형체.","그가 어떤 분인지 남들이 전하는 말만 듣고서는 도무지 그 상을 잡을 수 없었다.≪법정, 무소유≫"]],1,[]],["값","명사",0,"",[["사고파는 물건에 일정하게 매겨진 돈의 액수.","값이 내리다."]],0,[]],["음력(陰曆)","명사",0,"그늘 음, 책력 력",[["우리나라의 전통 역법. 1896년에 양력으로 역법이 고쳐지기 전까지 우리나라에서 공식적으로 사용하였다. 현재에도 설, 추석과 같은 명절 등의 날짜를 정할 때 사용한다. 역법 분류상 태음 태양력에 해당하며, 약 19년에 일곱 번의 비율로 윤달을 둔다.","음력 생일."]],1,[]],["장소(場所)","명사",0,"마당 장, 바 소",[["어떤 일이 이루어지거나 일어나는 곳.","약속 장소."]],1,[]],["냄새","명사",0,"",[["코로 맡을 수 있는 기운.","고기 냄새.","رَائِحَة"],["코로 맡을 수 있는 온갖 기운.","구수한 냄새."]],1,[]],["자주색(紫朱色)","명사",0,"자줏빛 자, 붉을 주, 빛 색",[["짙은 남빛을 띤 붉은색. 또는 그런 색의 물감.","겨울의 저녁놀이란…먼 산 위 보랏빛 서편 하늘이 자주색 띠를 두른다 싶으면 희미한 박명마저 곧 잿빛으로 죽어 들었다.≪김원일, 불의 제전≫"]],1,[]],["정치(政治)","명사",0,"정사 정, 다스릴 치",[["나라를 다스리는 일. 국가의 권력을 획득하고 유지하며 행사하는 활동으로, 국민들이 인간다운 삶을 영위하게 하고 상호 간의 이해를 조정하며, 사회 질서를 바로잡는 따위의 역할을 한다.","정치 세력."]],1,[]],["춤","명사",0,"",[["장단에 맞추거나 흥에 겨워 팔다리와 몸을 율동적으로 움직여 뛰노는 동작.","춤을 추다."]],1,[]],["권리(權利)","명사",0,"권세 권, 이할 리",[["어떤 일을 행하거나 타인에 대하여 당연히 요구할 수 있는 힘이나 자격. 공권, 사권, 사회권이 있다.","권리를 누리다."]],1,[]],["당나라(唐나라)","명사",0,"당나라 당",[["618년에 중국의 이연(李淵)이 수나라 공제(恭帝)의 양위를 받아 세운 통일 왕조. 도읍은 장안(長安)이며, 중앙 집권 체제를 확립하고 문화가 크게 융성하였으나, 안사(安史)의 난 이후 쇠퇴하여 907년에 주전충(朱全忠)에게 망하였다.",""]],1,[]],["조각","명사",0,"",[["한 물건에서 따로 떼어 내거나 떨어져 나온 작은 부분.","과일 조각."]],1,[]],["고기","명사",0,"",[["음식으로 먹는 동물의 살.","맛있는 고기.","لَحْم"],["식용하는 온갖 동물의 살.","고기 두 근."]],1,[]],["온도(溫度)","명사",0,"따뜻할 온, 법도 도",[["따뜻함과 차가움의 정도. 또는 그것을 나타내는 수치. 물리적으로는 열평형을 특징짓고 열이 이동하는 경향을 나타내는 양이며, 미시적으로는 계(系)를 구성하는 입자가 가지는 에너지의 분포를 정하고 그 평균값의 표준이 되는 양이다.","실내 온도."]],1,[]],["과정(過程)","명사",0,"지날 과, 한도 정",[["일이 되어 가는 경로.",""]],1,[]],["등급(等級)","명사",0,"무리 등, 등급 급",[["높고 낮음이나 좋고 나쁨 따위의 차이를 여러 층으로 구분한 단계.","신체 등급."]],1,[]],["밥","명사",0,"",[["쌀과 다른 곡식에 물을 붓고 물이 없어질 때까지 끓여서 익힌 음식.","밥이 되다.","أَرُزٌّ مَسْلُوقٌ, بَابٌ"],["쌀, 보리 따위의 곡식을 씻어서 솥 따위의 용기에 넣고 물을 알맞게 부어, 낟알이 풀어지지 않고 물기가 잦아들게 끓여 익힌 음식.","밥을 안치다."]],1,[]],["기능(機能)","명사",0,"틀 기, 능할 능",[["어떤 역할이나 작용을 함. 또는 그런 역할이나 작용.","심장의 기능.","وَظِيفَة ، عَمَل ، عَمَلِيَّة"],["하는 구실이나 작용을 함. 또는 그런 것.","언어의 사회적 기능."]],1,[]],["세포(細胞)","명사",0,"가늘 세, 세포 포",[["생물체를 이루는 기본 단위. 핵막의 유무에 따라 진핵 세포와 원핵 세포로 나뉜다.","사람은 수없이 많은 세포로 구성된 유기체이다."]],1,[]],["쇠붙이","명사",0,"",[["열이나 전기를 잘 전도하고, 펴지고 늘어나는 성질이 풍부하며, 특수한 광택을 가진 물질을 통틀어 이르는 말. 수은을 제외하고는 모두 상온에서 고체이다. 비중이 4 내지 5 이하인 것을 경금속, 4 내지 5 이상인 것을 중금속이라고 한다.","쇠붙이를 녹이다."]],1,[]],["방식(方式)","명사",0,"모 방, 법 식",[["일정한 방법이나 형식.","행동 방식."]],1,[]],["한데","명사",0,"",[["같은 곳이나 하나로 정해진 곳.","한데 묶다.","نفس المكان أو مكان محدود"],["한곳이나 한군데.","한데 모이다."],["사방, 상하를 덮거나 가리지 아니한 곳. 곧 집채의 바깥을 이른다.","몸도 안 좋은데 한데 너무 오래 있지 마라."]],1,[]],["후기(後期)","명사",0,"뒤 후, 기약할 기",[["일정 기간을 둘이나 셋으로 나누었을 때의 맨 뒤 기간.","조선 후기에 이르러서는 실학사상이 한층 더 고조되었다."]],1,[]],["중앙(中央)","명사",0,"가운데 중, 가운데 앙",[["어떤 장소나 물체의 중심이 되는 한가운데.","무대 중앙.","قَلْب"],["사방의 중심이 되는 한가운데.","벽 중앙에 액자를 걸다."]],1,[]],["껍질","명사",0,"",[["물체의 겉을 싸고 있는 단단하지 않은 것.","과일 껍질.","قِشْرَة"],["물체의 겉을 싸고 있는 단단하지 않은 물질.","귤의 껍질을 까다."]],1,[]],["위치(位置)","명사",0,"자리 위, 둘 치",[["일정한 곳에 자리를 차지함. 또는 그 자리.","위치를 잡다."]],1,[]],["동작(動作)","명사",0,"움직일 동, 지을 작",[["몸이나 손발 등을 움직임. 또는 그런 모양.","반복 동작.","حَرَكَة"],["몸이나 손발 따위를 움직임. 또는 그런 모양.","세련된 동작."]],1,[]],["기호(記號)","명사",0,"기록할 기, 이름 호",[["어떠한 뜻을 나타내기 위하여 쓰이는 부호, 문자, 표지 따위를 통틀어 이르는 말.","기호를 붙이다."]],1,[]],["대신(代身)","명사",0,"대신할 대, 몸 신",[["어떤 대상이 맡던 구실을 다른 대상이 새로 맡음. 또는 그렇게 새로 맡은 대상.","지수는 동생에게 자기 대신 모임에 나갈 수 없겠냐고 물었다.","تَبْدِيل"],["어떤 대상의 자리나 구실을 바꾸어서 새로 맡음. 또는 그렇게 새로 맡은 대상.","모유 대신에 우유를 먹이다."]],1,[]],["종결(終結)","명사",0,"마칠 종, 맺을 결",[["일을 끝냄.","전쟁의 종결."]],1,[]],["붉은색(붉은色)","명사",0,"빛 색",[["사람의 입술이나 피의 빛깔과 같이 짙고 선명한 색.","붉은색의 천."]],1,[]],["원료(原料)","명사",0,"언덕 원, 헤아릴 료",[["어떤 물건을 만드는 데 들어가는 재료.","공업 원료."]],1,[]],["피동사(被動詞)","명사",0,"입을 피, 움직일 동, 말씀 사",[["남의 행동을 입어서 행하여지는 동작을 나타내는 동사. ‘보이다’, ‘물리다’, ‘잡히다’, ‘안기다’, ‘업히다’ 따위가 있다.",""]],1,[]],["시인(詩人)","명사",0,"시 시, 사람 인",[["시를 전문적으로 짓는 사람.","원로 시인."]],1,[]],["군사(軍士)","명사",0,"군사 군, 선비 사",[["예전에, 군인이나 군대를 이르던 말.","조선의 군사."]],1,[]],["판(板)","명사",0,"널 판",[["평평하고 넓게 만든 나뭇조각.","두꺼운 판.","لَوْح خَشَبِيّ"],["판판하고 얇은 물체.",""]],1,[]],["접미사(接尾辭)","명사",0,"이을 접, 꼬리 미, 말씀 사",[["파생어를 만드는 접사로, 어근이나 단어의 뒤에 붙어 새로운 단어가 되게 하는 말. ‘선생님’의 ‘-님’, ‘먹보’의 ‘-보’, ‘지우개’의 ‘-개’, ‘먹히다’의 ‘-히-’ 따위가 있다.",""]],1,[]],["섬","명사",0,"",[["주로 곡식을 담는 데 쓰는, 짚을 엮어 만든 큰 자루.","빈 섬.","كِيس مِنَ الْقَشِّ"],["주위가 수역으로 완전히 둘러싸인 육지의 일부. 분포 상태에 따라 제도(諸島)·군도(群島)·열도(列島)·고도(孤島)로 나누며, 생겨난 원인에 따라서는 육도(陸島)와 해도(海島)로 나눈다.","바다 한가운데에 외로이 떠 있는 섬."],["곡식 따위를 담기 위하여 짚으로 엮어 만든 그릇.","보리를 섬에 담다."]],1,[]],["먼저","명사",0,"",[["시간적으로나 순서상으로 앞선 때.","먼저의 일은 네가 이해해라."]],1,[]],["현재(現在)","명사",0,"나타날 현, 있을 재",[["지금 이때.","힘든 현재.","الْآن"],["지금의 시간.","현재와 미래."]],1,[]],["아내","명사",0,"",[["혼인하여 남자의 짝이 된 여자.","그녀는 한 남자의 아내가 되었다."]],1,[]],["위로(慰勞)","명사",0,"위로할 위, 일할 로",[["따뜻한 말이나 행동으로 괴로움을 덜어 주거나 슬픔을 달래 줌.","위로를 받다."]],1,[]],["수컷","명사",0,"",[["암수의 구별이 있는 동물에서 새끼를 배지 아니하는 쪽.","면양 수컷 한 마리."]],1,[]],["이론(理論)","명사",0,"다스릴 이, 논할 론",[["어떤 이치나 지식을 논리적으로 일반화한 명제의 체계.","경제 이론.","نظرية"],["사물의 이치나 지식 따위를 해명하기 위하여 논리적으로 정연하게 일반화한 명제의 체계.","경제 이론."]],1,[]],["아이","명사",0,"",[["나이가 어린 사람.","아니, 먹는 것을 가지고 어른이 아이를 울리면 어떻게 해요?"]],1,[]],["풀","명사",0,"",[["쌀이나 밀가루 등에서 빼낸, 천이나 옷 등을 빳빳하게 만들거나 무엇을 붙일 때 쓰는 끈끈한 물질.","풀이 마르다.","غراء"],["초본 식물을 통틀어 이르는 말. 목질(木質)이 아니어 줄기가 연하고, 대개 한 해를 지내고 죽는다.","풀이 나다."],["쌀이나 밀가루 따위의 전분질에서 빼낸 끈끈한 물질. 무엇을 붙이거나 피륙 따위를 빳빳하게 만드는 데 쓴다.","풀을 바르다."]],1,[]],["범위(範圍)","명사",0,"법 범, 에워쌀 위",[["일정하게 한정된 영역.","시험 범위."]],1,[]],["고종(姑從)","명사",0,"시어미 고, 좇을 종",[["고모의 자녀를 이르는 말.",""]],1,[]],["북쪽(北쪽)","명사",0,"북녘 북",[["동서남북 네 방위의 하나로, 나침반의 엔(N) 극이 가리키는 쪽.","나침반의 북쪽.","شَمَال"],["네 방위의 하나. 나침반의 엔(N) 극이 가리키는 방위이다.","북쪽 국경 지대."]],1,[]],["바닷물고기","명사",0,"",[["바다에서 사는 물고기.",""]],1,[]],["배가(倍加)","명사",0,"곱 배, 더할 가",[["갑절 또는 몇 배로 늘어남. 또는 그렇게 늘림.","노력 배가."]],1,[]],["금(金)","명사",0,"쇠 금",[["월요일을 기준으로 한 주의 다섯째 날.","학원 수업은 월, 수, 금으로 일주일에 세 번 있다.","الْجُمُعَةُ"],["황색의 광택이 있는 금속 원소. 금속 가운데 퍼지는 성질과 늘어나는 성질이 가장 크다. 화학적으로 매우 안정되고, 공기 중에서도 산화되지 않는다. 원자 번호는 79, 원소 기호는 Au, 원자량은 196.967.","금을 캐다."]],1,[]],["이야기","명사",0,"",[["어떠한 사실이나 상태, 현상, 경험, 생각 등에 관해 누군가에게 하는 말이나 글.","전쟁 이야기.",""],["어떤 사물이나 사실, 현상에 대하여 일정한 줄거리를 가지고 하는 말이나 글.","혼사 이야기."]],1,[]],["변화(變化)","명사",0,"변할 변, 될 화",[["사물의 성질, 모양, 상태 따위가 바뀌어 달라짐.","정국의 변화."]],1,[]],["시설(施設)","명사",0,"베풀 시, 베풀 설",[["도구, 기계, 장치 따위를 베풀어 설비함. 또는 그런 설비.","교육 시설."]],1,[]],["공간(空間)","명사",0,"빌 공, 사이 간",[["아무것도 없는 빈 곳.","좁은 공간."]],1,[]],["임시(臨時)","명사",0,"임할 임, 때 시",[["미리 정하지 않고 그때그때 필요에 따라 정한 것.","임시 국회.","مُؤَقَّت"],["미리 정하지 아니하고 그때그때 필요에 따라 정한 것.","비변사는 본래 왜구와 여진족의 침입에 대비하여 16세기 초에 설치된 임시 기구였다."]],1,[]],["시베리아(Siberia)","명사",0,"",[["러시아의 우랄산맥에서 태평양 연안에 이르는 북아시아 지역. 석유, 천연가스, 철, 금 따위의 지하자원이 풍부하다. 16세기 말기에 우즈베크계의 시비르한국(Sibir汗國)이 멸망한 후 모두 러시아령이 되었다. 러시아 혁명 이후 풍부한 자원이 개발되어 세계적으로 주목의 대상이 되었다. 면적은 1295만 ㎢.",""]],1,[]],["건물(建物)","명사",0,"세울 건, 물건 물",[["사람이 들어 살거나, 일을 하거나, 물건을 넣어 두기 위하여 지은 집을 통틀어 이르는 말.","콘크리트 건물."]],1,[]],["화학(化學)","명사",0,"될 화, 배울 학",[["자연 과학의 한 분야. 물질의 조성과 구조, 성질 및 변화, 제법, 응용 따위를 연구한다. 무기 화학, 유기 화학, 생물 화학, 물리 화학, 분석 화학, 이론 화학, 응용 화학 따위의 갈래가 있다.","화학 실험."]],1,[]],["보고(報告)","명사",0,"갚을 보, 고할 고",[["연구하거나 조사한 것의 내용이나 결과를 말이나 글로 알림.","결과 보고.","إِبْلَاغ"],["일에 관한 내용이나 결과를 말이나 글로 알림.","상황 보고."]],1,[]],["문(門)","명사",0,"문 문",[["사람이 안과 밖을 드나들거나 물건을 넣고 꺼낼 수 있게 하기 위해 열고 닫을 수 있도록 만든 시설.","가게 문.","بَاب"],["드나들거나 물건을 넣었다 꺼냈다 하기 위하여 틔워 놓은 곳. 또는 그곳에 달아 놓고 여닫게 만든 시설.","집을 비울 때는 문을 꼭 잠가야 한다."]],1,[]],["거의","명사",0,"",[["어느 한도에 매우 가까운 정도.","회원들은 거의가 왔다."]],1,[]],["궁중(宮中)","명사",0,"집 궁, 가운데 중",[["대궐 안.","궁중 요리."]],1,[]],["겨울","명사",0,"",[["한 해의 네 철 가운데 넷째 철. 가을과 봄 사이이며, 낮이 짧고 추운 계절로, 달로는 12~2월, 절기(節氣)로는 입동부터 입춘 전까지를 이른다.","겨울로 접어들다."]],1,[]],["아들","명사",0,"",[["남자로 태어난 자식.","아들 내외."]],1,[]],["그리스(Greece)","명사",0,"",[["유럽 동남부 발칸반도의 남쪽 끝에 위치한 공화국. 1829년 오스만 제국에서 독립하여 왕국이 되었으며, 1974년에 공화국이 되었다. 수도는 아테네, 면적은 13만 1945㎢.",""]],1,[]],["대만(臺灣)","명사",0,"대 대, 물굽이 만",[["‘타이완’을 우리 한자음으로 읽은 이름.",""]],1,[]],["분야(分野)","명사",0,"나눌 분, 들 야",[["여러 갈래로 나누어진 범위나 부분.","외교 분야."]],1,[]],["안쪽","명사",0,"",[["안으로 향하는 쪽. 또는 안에 있는 부분.","골짜기 안쪽.","جزء داخلي"],["안으로 향한 부분이나 안에 있는 부분.","주머니 안쪽."]],1,[]],["의견(意見)","명사",0,"뜻 의, 볼 견",[["어떤 대상에 대하여 가지는 생각.","의견 교환."]],1,[]],["세력(勢力)","명사",0,"형세 세, 힘 력",[["권력이나 기세로 가지게 되는 힘.","세력 교체.","سلطة"],["권력이나 기세의 힘.","정치 세력."]],1,[]],["글씨","명사",0,"",[["써 놓은 글자의 모양.","깔끔한 글씨.","خَطٌّ"],["쓴 글자의 모양.","예쁘게 쓴 글씨."]],1,[]],["관리(管理)","명사",0,"대롱 관, 다스릴 리",[["어떤 일을 책임지고 맡아 처리함.","선거 관리.","إِدَارَة"],["어떤 일의 사무를 맡아 처리함.","선거 관리."]],1,[]],["결정(結晶)","명사",0,"맺을 결, 맑을 정",[["화학에서, 원자, 이온, 분자 등이 규칙적으로 배열되어 일정한 모양을 이룬 것. 또는 그런 물질.","결정 구조.","تَبَلْوُر"],["원자, 이온, 분자 따위가 규칙적으로 일정한 법칙에 따라 배열되고, 외형도 대칭 관계에 있는 몇 개의 평면으로 둘러싸여 규칙 바른 형체를 이룸. 또는 그런 물질.",""]],1,[]],["문신(文身)","명사",0,"글월 문, 몸 신",[["살갗을 바늘로 찔러 먹물이나 물감으로 글씨, 그림, 무늬 따위를 새김. 또는 그렇게 새긴 것. 보통, 맹세의 표시나 치레 따위를 하느라고 새기며 미개 사회에서는 주술이나 장식의 의도로 행하였다.","몸에 문신을 새기다."]],1,[]],["기둥","명사",0,"",[["건축물에서 천장이나 지붕처럼 윗부분에 올리는 구조물을 떠받치는 긴 구조물.","기둥이 견디다.","عَمُود"],["건축물에서, 주춧돌 위에 세워 보·도리 따위를 받치는 나무. 또는 돌·쇠·벽돌·콘크리트 따위로 모나거나 둥글게 만들어 곧추 높이 세운 것.","건물의 기둥을 세우다."]],1,[]],["러시아(Russia)","명사",0,"",[["유럽 대륙의 동부에서 시베리아에 걸쳐 있는 나라. 862년에 노브고로드(Novgorod) 공국(公國)에서 시작하여, 차르(tsar)의 전제 정치가 계속되다가 1917년의 2월 혁명으로 소비에트 사회주의 공화국 연방이 되었다. 1990년대에 들어 소비에트 사회주의 공화국 연방이 해체되면서 독립국이 되었다. 주민의 대부분은 슬라브 민족이고 주요 언어는 슬라브어이다. 수도는 모스크바, 면적은 1707만 5383㎢.",""]],1,[]],["개인(個人)","명사",0,"낱 개, 사람 인",[["국가나 사회, 단체 등을 구성하는 낱낱의 사람.","개인 자격으로 참가하다."]],1,[]],["쇠","명사",0,"",[["자동차나 배를 만들 때 사용되는 등 일반적으로 널리 쓰이며 자성을 가지고 있는 은백색의 고체 물질.","녹슨 쇠.","حَدِيدٌ"],["‘철05「1」’을 일상적으로 이르는 말.","쇠를 녹여 연장을 만들다."]],1,[]],["서울","명사",0,"",[["한 나라의 중앙 정부가 있는 곳.","옛날에는 왕조가 바뀌면 서울이 바뀌는 것이 관례였다."]],1,[]],["범죄(犯罪)","명사",0,"범할 범, 허물 죄",[["법규를 어기고 저지른 잘못.","강력 범죄."]],1,[]],["연구(硏究)","명사",0,"갈 연, 연구할 구",[["어떤 일이나 사물에 대하여서 깊이 있게 조사하고 생각하여 진리를 따져 보는 일.","연구 대상."]],1,[]],["결과(結果)","명사",0,"맺을 결, 실과 과",[["어떤 원인으로 결말이 생김. 또는 그런 결말의 상태.","연구 결과."]],1,[]],["피침(被侵)","명사",0,"입을 피, 침노할 침",[["침략이나 침범을 당함.",""]],1,[]],["놀이","명사",0,"",[["즐겁게 노는 일.","인형 놀이.","لَعِب"],["여러 사람이 모여서 즐겁게 노는 일. 또는 그런 활동.","놀이 공간."]],1,[]],["교육(敎育)","명사",0,"가르칠 교, 기를 육",[["지식과 기술 따위를 가르치며 인격을 길러 줌.","교육을 받다."]],1,[]],["이전(以前)","명사",0,"써 이, 앞 전",[["지금보다 앞.","이전 내용.","سَابِق"],["이제보다 전.","이전부터 그래 온 관습이었다."]],1,[]],["색(色)","명사",0,"빛 색",[["빛을 받아 물체가 나타내는 밝고 어두움이나 빨강, 노랑, 파랑 등의 빛깔.","붉은 색.","لَوْن"],["빛을 흡수하고 반사하는 결과로 나타나는 사물의 밝고 어두움이나 빨강, 파랑, 노랑 따위의 물리적 현상. 또는 그것을 나타내는 물감 따위의 안료.","화려한 색."],["색정이나 여색, 색사(色事) 따위를 뜻하는 말.","색에 빠지다."]],1,[]],["만주(滿洲)","명사",0,"찰 만, 물가 주",[["중국 둥베이(東北) 지방을 이르는 말. 랴오닝(遼寧), 지린(吉林), 헤이룽장(黑龍江)의 둥베이 삼성(東北三省)으로 구성되어 있다. 동쪽과 북쪽은 러시아와 접해 있고, 남쪽은 압록강과 두만강을 경계로 한반도와 접해 있다. 젠다오(間島)를 중심으로 우리 동포가 많이 산다.",""]],1,[]],["구조(構造)","명사",0,"얽을 구, 지을 조",[["여러 부분이나 요소들이 서로 어울려 전체를 이룸. 또는 그 짜임새.","가옥 구조.","تَرْكِيب ، بِنْيَة ، بُنْيَان"],["부분이나 요소가 어떤 전체를 짜 이룸. 또는 그렇게 이루어진 얼개.","가옥 구조."]],1,[]],["초기(初期)","명사",0,"처음 초, 기약할 기",[["정해진 기간이나 일의 처음이 되는 때나 시기.","초기 단계."]],1,[]],["인(人)","명사",0,"사람 인",[["한자어로 ‘사람’을 이르는 말.","우리나라는 예로부터 사람, 즉 인을 중시했다.","إِنْسَان"],["한문 투에서, ‘사람’을 이르는 말.","인의 바다."]],1,[]],["서쪽(西쪽)","명사",0,"서녘 서",[["네 방위의 하나. 해가 지는 쪽이다.","서쪽으로 5리만 가면 마을이 나온다."]],1,[]],["벽(壁)","명사",0,"벽 벽",[["집이나 방의 둘레를 단단하게 막고 있는 부분.","거실 벽.","حَائِط ، جِدَار"],["집이나 방 따위의 둘레를 막은 수직 건조물.","벽에 기대다."]],1,[]],["말기(末期)","명사",0,"끝 말, 기약할 기",[["정해진 기간이나 일의 끝이 되는 때나 시기.","정권 말기."]],1,[]],["칼","명사",0,"",[["물건을 베거나 썰거나 깎는 데 쓰는 도구. 날과 자루로 이루어져 있다.","칼 한 자루."]],1,[]],["원인(原因)","명사",0,"언덕 원, 인할 인",[["어떤 사물이나 상태를 변화시키거나 일으키게 하는 근본이 된 일이나 사건.","원인 분석."]],1,[]],["화가(畫家)","명사",0,"그림 화, 집 가",[["그림 그리는 것을 직업으로 하는 사람.","유명한 화가가 그린 그림."]],1,[]],["암컷","명사",0,"",[["암수의 구별이 있는 동물에서 새끼를 배는 쪽.","암컷이 새끼를 낳았다."]],1,[]],["광물(鑛物)","명사",0,"쇳돌 광, 물건 물",[["천연으로 나며 질이 고르고 화학적 조성(組成)이 일정한 물질. 대부분 결정체 상태의 무기질이나 석탄 같은 유기질도 있으며, 상온에서 고체이지만 수은이나 가스처럼 액체나 기체인 것도 있다. 철, 금, 은 따위 약 3,800종류 이상이 알려져 있다.",""]],1,[]],["법률(法律)","명사",0,"법 법, 법칙 률",[["국가의 강제력을 수반하는 사회 규범. 국가 및 공공 기관이 제정한 법률, 명령, 규칙, 조례 따위이다.","법률 무료 상담."]],1,[]],["조건(條件)","명사",0,"가지 조, 물건 건",[["어떤 일을 이루게 하기 위하여 미리 갖추어야 할 상태나 요소.","성공 조건.","شَرْط"],["어떤 일이 이루어지려면 갖추어져야 할 상태나 요소.","지리적 조건을 갖추다."]],1,[]],["동쪽(東쪽)","명사",0,"동녘 동",[["네 방위의 하나. 해가 떠오르는 쪽이다.","동쪽 하늘."]],1,[]],["관목(灌木)","명사",0,"물댈 관, 나무 목",[["키가 작고 원줄기와 가지의 구별이 분명하지 않으며 밑동에서 가지를 많이 치는 나무. 무궁화, 진달래, 앵두나무 따위이다.","그들이 앉은 나무 벤치 뒤 관목 수풀 사이로 유리창이 환한 카페가 올려다보였다.≪박영한, 인간의 새벽≫"]],1,[]],["이후(以後)","명사",0,"써 이, 뒤 후",[["지금부터 뒤.","이후의 사회.","مُنْذُ"],["이제부터 뒤.","이후 벌어진 어떤 일에도 나는 신경 쓰지 않겠다."]],1,[]],["수도(水道)","명사",0,"물 수, 길 도",[["마시거나 사용할 물을 관을 통해 보내 주는 시설.","수도가 끊기다.","محطة توزيع المياه"],["먹는 물이나 공업, 방화(防火) 따위에 쓰는 물을 관을 통하여 보내 주는 설비.","수도를 놓다."]],1,[]],["문화(文化)","명사",0,"글월 문, 될 화",[["자연 상태에서 벗어나 일정한 목적 또는 생활 이상을 실현하고자 사회 구성원에 의하여 습득, 공유, 전달되는 행동 양식이나 생활 양식의 과정 및 그 과정에서 이룩하여 낸 물질적·정신적 소득을 통틀어 이르는 말. 의식주를 비롯하여 언어, 풍습, 종교, 학문, 예술, 제도 따위를 모두 포함한다.","구석기 문화."]],1,[]],["채","명사",0,"",[["팽이나 공 등을 치는 데에 쓰는 도구.","배드민턴 채.","عصا، مضرب، سوط، جلد"],["팽이, 공 따위의 대상을 치는 데에 쓰는 기구.",""],["발구, 달구지, 수레 따위의 앞쪽 양옆에 댄 긴 나무.","참나무 발구 채."]],1,[]],["자연(自然)","명사",0,"스스로 자, 그럴 연",[["사람의 힘에 의한 것이 아닌, 세상에 원래부터 있거나 저절로 이루어지는 모든 현상이나 존재.","자연 현상.","طَبِيعَةٌ"],["사람의 힘이 더해지지 아니하고 세상에 스스로 존재하거나 우주에 저절로 이루어지는 모든 존재나 상태.","자연 자원."]],1,[]],["집단(集團)","명사",0,"모을 집, 둥글 단",[["여럿이 모여 이룬 모임.","예술가 집단."]],1,[]],["성분(成分)","명사",0,"이룰 성, 나눌 분",[["통일된 하나의 조직체를 구성하는 한 부분.","필수적인 성분.","مكوّن"],["유기적인 통일체를 이루고 있는 것의 한 부분.","수입 농산물에서 농약 성분이 검출되었다."]],1,[]],["교목(喬木)","명사",0,"높을 교, 나무 목",[["줄기가 곧고 굵으며 높이가 8미터를 넘는 나무. 수간(樹幹)과 가지의 구별이 뚜렷하고, 수간은 1개이며, 가지 밑부분까지의 수간 길이가 길다. 소나무, 향나무, 감나무 따위가 있다.","이 개천은 아름드리 교목들이 들어차서 웬만한 가뭄쯤에는 끄덕도 않는 것 같다.≪홍성원, 육이오≫"]],1,[]],["피부(皮膚)","명사",0,"가죽 피, 살갗 부",[["척추동물의 몸을 싸고 있는 조직. 신체 보호, 체온 조절, 배설, 피부 호흡 따위의 기능을 한다.","건성 피부."]],1,[]],["잎겨드랑이","명사",0,"",[["식물의 가지나 줄기에 잎이 붙은 부분의 위쪽.",""]],1,[]],["띠","명사",0,"",[["옷 위로 허리를 둘러서 매는 끈.","흰 띠.","شَرِيط"],["옷 위로 허리를 둘러매는 끈.","허리에 띠를 매다."],["사람이 태어난 해를 열두 지지(地支)를 상징하는 동물들의 이름으로 이르는 말.","“너는 무슨 띠니?” “토끼띠예요.”"]],1,[]],["이탈리아(Italia)","명사",0,"",[["유럽 남부의 지중해에 돌출한 반도와 그 부근의 섬으로 이루어진 공화국. 북쪽에 알프스산맥이 있으며, 지중해식 기후로 온화하다. 로마 시대 이래로 그리스와 더불어 서양 문명의 원천이었던 국가로, 1861년에 왕국이 성립되고 1870년에 이탈리아반도를 통일하였으며, 1946년에 공화제가 되었다. 밀, 쌀, 낙농 제품을 많이 생산하고 석유, 천연가스도 난다. 문학, 미술, 음악 따위의 예술이 특히 잘 발달되어 있고, 주민의 99%가 가톨릭교를 신봉한다. 수도는 로마, 면적은 30만 1251㎢.",""]],1,[]],["톱니","명사",0,"",[["톱 따위의 가장자리에 있는 뾰족뾰족한 이.","그 칼은 끝이 아랍식으로 치켜 올라가고 칼등이 톱니로 된 특수 부대용입니다.≪황석영, 무기의 그늘≫"]],1,[]],["싸움","명사",0,"",[["말이나 힘 등으로 이기려고 다투는 일.","법정 싸움."]],0,[]],["종교(宗敎)","명사",0,"마루 종, 가르칠 교",[["신이나 초자연적인 절대자 또는 힘에 대한 믿음을 통하여 인간 생활의 고뇌를 해결하고 삶의 궁극적인 의미를 추구하는 문화 체계. 그 대상·교리·행사의 차이에 따라 여러 가지가 있는데, 애니미즘·토테미즘·물신 숭배 따위의 초기적 신앙 형태를 비롯하여 샤머니즘이나 다신교·불교·기독교·이슬람교 따위의 세계 종교에 이르기까지 비제도적인 것과 제도적인 것이 있다.","종교를 믿다."]],1,[]],["백성(百姓)","명사",0,"일백 백, 성 성",[["나라의 근본을 이루는 일반 국민을 예스럽게 이르는 말.","나라 잃은 백성."]],1,[]],["재주","명사",0,"",[["무엇을 잘하는 타고난 능력.","재주가 뛰어나다.","مَوْهِبَة"],["무엇을 잘할 수 있는 타고난 능력과 슬기.","재주가 뛰어나다."]],1,[]],["가까이","명사",0,"",[["멀지 않고 가까운 곳.","가까이로 가다."]],0,[]],["아버지","명사",0,"",[["자기를 낳아 준 남자. 또는 그 사람을 부르는 말.","아버지의 고향.","أب، والد، بابا"],["자기를 낳아 준 남자를 이르거나 부르는 말.","아버지를 찾다."]],1,[]],["집안","명사",0,"",[["가족을 구성원으로 하여 살림을 꾸려 나가는 공동체. 또는 가까운 일가.","집안 어른."]],1,[]],["가치(價値)","명사",0,"값 가, 값 치",[["값이나 귀중한 정도.","교환 가치.","قِيمَة"],["사물이 지니고 있는 쓸모.","상품 가치."]],1,[]],["사무(事務)","명사",0,"일 사, 힘쓸 무",[["자신이 맡은 직책에 관련된 여러 가지 일을 처리하는 일. 주로 책상에서 문서 따위를 다루는 일을 이른다.","사무 처리."]],1,[]],["광택(光澤)","명사",0,"빛 광, 못 택",[["빛의 반사로 물체의 표면에서 반짝거리는 빛.","광택이 없다."]],1,[]],["생물(生物)","명사",0,"날 생, 물건 물",[["생명이 있는 동물과 식물.","야생 생물.","كَائِن حَيّ"],["생명을 가지고 스스로 생활 현상을 유지하여 나가는 물체. 영양·운동·생장·증식을 하며, 동물·식물·미생물로 나뉜다.","바다의 생물."]],1,[]],["어린아이","명사",0,"",[["나이가 적은 아이.","이제 달포를 지난 어린아이는 얼굴에 젖살이 포동포동 몰려 볼수록 귀여웠다."]],1,[]],["마음속","명사",0,"",[["마음의 속.","마음속 깊이 사무치다."]],1,[]],["사동사(使動詞)","명사",0,"하여금 사, 움직일 동, 말씀 사",[["문장의 주체가 자기 스스로 행하지 않고 남에게 그 행동이나 동작을 하게 함을 나타내는 동사. 대개 대응하는 주동문의 동사에 사동 접미사 ‘-이-, -히-, -리-, -기-’ 따위가 결합되어 나타난다. 하지만 특수한 의미를 가지게 되어 대응하는 주동사를 설정하기 어려운 경우도 있다.",""]],1,[]],["속도(速度)","명사",0,"빠를 속, 법도 도",[["물체가 나아가거나 일이 진행되는 빠르기.","성장 속도."]],1,[]],["피","명사",0,"",[["사람이나 동물의 몸 안의 혈관을 돌며 산소와 영양분을 공급하고, 노폐물을 운반하는 붉은색의 액체.","칼에 손을 베여 피가 뚝뚝 떨어진다."]],1,[]],["청나라(淸나라)","명사",0,"맑을 청",[["중국의 마지막 왕조(1616~1912). 여진족의 누르하치가 여러 부족을 통일하여 후금국을 세우고, 그 아들 태종이 국호를 이것으로 고쳤으나 신해혁명으로 멸망하였다.",""]],1,[]],["민족(民族)","명사",0,"백성 민, 겨레 족",[["일정한 지역에서 오랜 세월 동안 공동생활을 하면서 언어와 문화상의 공통성에 기초하여 역사적으로 형성된 사회 집단. 인종이나 국가 단위인 국민과 반드시 일치하는 것은 아니다.","민족의 영웅."]],1,[]],["죄인(罪人)","명사",0,"허물 죄, 사람 인",[["죄를 지은 사람.","저 같은 죄인이 무슨 할 말이 있겠습니까."]],1,[]],["잿빛","명사",0,"",[["재의 빛깔과 같이 흰빛을 띤 검은빛.","잿빛 먹구름."]],1,[]],["총상(銃傷)","명사",0,"총 총, 다칠 상",[["총에 맞아 생긴 상처.","총상을 입다."]],1,[]],["재산(財産)","명사",0,"재물 재, 낳을 산",[["개인이나 단체가 가지고 있는 돈이나 돈으로 바꿀 수 있는 것.","많은 재산.","ثَرْوَة"],["재화와 자산을 통틀어 이르는 말. 개인, 단체, 국가가 소유하는 토지, 가옥, 가구, 금전, 귀금속 따위의 금전적 가치가 있는 것을 이른다.","재산을 몰수하다."]],1,[]],["섬유(纖維)","명사",0,"가늘 섬, 벼리 유",[["가늘고 긴 실 모양의 물질. 또는 그것으로 만든 직물. 천연 섬유와 합성 섬유가 있다.","섬유를 가공하다."]],1,[]],["중생(衆生)","명사",0,"무리 중, 날 생",[["모든 살아 있는 무리.","대승 불교는 중생 구제를 위해 적극적인 태도를 보인다."]],1,[]],["중부(中部)","명사",0,"가운데 중, 떼 부",[["어떤 지역의 가운데 부분.","중부 전선."]],1,[]],["항구(港口)","명사",0,"항구 항, 입 구",[["배가 안전하게 드나들도록 강가나 바닷가에 부두 따위를 설비한 곳. 보통 기능에 따라 상항·군항·어항·공업항, 위치에 따라 해항·연안항·호항, 법제상으로 개항·자유항·중계항 따위로 나눈다.","항구에 정박하다."]],1,[]],["단(段)","명사",0,"층계 단",[["인쇄물에서 지면을 가로나 세로로 나눈 구역.","첫째 단.","عَمُود"],["인쇄물의 지면을 가로나 세로로 나눈 구획.","이 책은 단을 나누지 말고 조판(組版)을 합시다."],["바둑, 장기, 태권도, 유도, 검도 따위의 실력에 따라서 매기는 등급. ‘급(級)’보다 위이며, 초단부터 9단까지 있다.","단을 따다."],["사다리, 계단 따위의 하나하나의 층(層).","단이 높다."]],1,[]],["한자(漢字)","명사",0,"한수 한, 글자 자",[["고대 중국에서 만들어져 오늘날에도 쓰이고 있는 표의 문자. 은허에서 출토된 기원전 15세기경의 갑골 문자가 현존하는 가장 오래된 것이며, 현재 알려져 있는 글자 수는 약 5만에 이르는데 실제로 쓰이는 것은 5,000자 정도이다. 우리나라와 일본에서도 사용한다.","‘인간’은 한자로 ‘人間’이라고 쓴다."]],1,[]],["모임","명사",0,"",[["어떤 일을 하기 위해 여러 사람이 모이는 일.","가족 모임."]],0,[]],["종(種)","명사",0,"씨 종",[["식물에서 나온 씨 또는 씨앗.",""]],1,[]],["코","명사",0,"",[["숨을 쉬고 냄새를 맡는 몸의 한 부분.","날카로운 코.","أنف"],["포유류의 얼굴 중앙에 튀어나온 부분. 호흡을 하며 냄새를 맡는 구실을 하고, 발성(發聲)을 돕는다.","오뚝한 코."]],1,[]],["반응(反應)","명사",0,"돌이킬 반, 응할 응",[["어떤 자극에 대하여 일정한 동작이나 태도를 보임. 또는 그런 동작이나 태도.","뜨거운 반응.","رَدّ"],["자극에 대응하여 어떤 현상이 일어남. 또는 그 현상.","반응이 빠르다."]],1,[]],["제국(帝國)","명사",0,"임금 제, 나라 국",[["황제가 다스리는 나라.","광대한 제국을 건설하다."]],1,[]],["자동차(自動車)","명사",0,"스스로 자, 움직일 동, 수레 차",[["원동기를 장치하여 그 동력으로 바퀴를 굴려서 철길이나 가설된 선에 의하지 아니하고 땅 위를 움직이도록 만든 차. 승용차, 승합자동차, 화물 자동차, 특수 자동차 및 이륜자동차가 있다.","자동차 번호판."]],1,[]],["원래(元來/原來)","명사",0,"으뜸 원, 올 래 / 언덕 원, 올 래",[["사물이 전하여 내려온 그 처음.","원래의 가격보다 훨씬 싸다."]],1,[]],["고체(固體)","명사",0,"굳을 고, 몸 체",[["일정한 모양과 부피가 있으며 쉽게 변형되지 않는 물질의 상태. 나무, 돌, 쇠, 얼음 따위의 상태이다.",""]],1,[]],["편지(便紙/片紙)","명사",0,"편할 편, 종이 지 / 조각 편, 종이 지",[["안부, 소식, 용무 따위를 적어 보내는 글.","격려 편지."]],1,[]],["무색(無色)","명사",0,"없을 무, 빛 색",[["아무 빛깔이 없음.","무색의 기체."]],1,[]],["한곳","명사",0,"",[["일정한 곳. 또는 같은 곳.","한곳에 오래 머무르다."]],1,[]],["한해살이풀","명사",0,"",[["일 년 이내에 씨를 뿌려서 싹이 나서 자라 꽃이 피고 열매를 맺으며 시들어 죽는 풀. 나팔꽃, 벼, 호박 따위가 있다.",""]],1,[]],["짓","명사",0,"",[["몸을 놀려 움직이는 동작.","나쁜 짓."]],1,[]],["시험(試驗)","명사",0,"시험 시, 시험 험",[["문제, 질문, 실제의 행동 등의 일정한 절차에 따라 지식이나 능력을 검사하고 평가하는 일.","국어 시험.","امْتِحَان"],["재능이나 실력 따위를 일정한 절차에 따라 검사하고 평가하는 일.","시험 과목."]],1,[]],["가죽","명사",0,"",[["사람이나 동물의 몸을 싸고 있는 껍질.","짐승 가죽.","جِلْد"],["동물의 몸을 감싸고 있는 질긴 껍질.","호랑이 가죽."]],1,[]],["정치가(政治家)","명사",0,"정사 정, 다스릴 치, 집 가",[["정치를 맡아서 하는 사람. 또는 정치에 관한 학식과 경험이 풍부한 사람.","그는 어려서부터 지금까지 정치가가 되겠다는 꿈을 키워 왔다."]],1,[]],["잠","명사",0,"",[["눈을 감고 몸과 정신의 활동을 멈추고 한동안 쉬는 상태.","깊은 잠.","نَوْمٌ"],["눈이 감긴 채 의식 활동이 쉬는 상태.","깊은 잠."]],1,[]],["소금","명사",0,"",[["짠맛을 내는 하얀 가루.","구운 소금.","ملح"],["짠맛이 나는 백색의 결정체. 대표적인 조미료로, 주성분은 염화 나트륨이다. 천연으로는 바닷물에 약 2.8% 들어 있으며, 암염으로도 산출된다. 인체의 혈액이나 세포 안에 약 0.71% 들어 있고, 어른의 하루 소요량은 10~20그램이다. 양념, 식품의 저장, 화학 공업의 원료 따위로 쓴다.","소금 닷 되."]],1,[]],["목소리","명사",0,"",[["사람의 목구멍에서 나는 소리.","고운 목소리.","صَوْت"],["목구멍에서 나는 소리.","고운 목소리."]],1,[]],["의사(醫師)","명사",0,"의원 의, 스승 사",[["일정한 자격을 가지고 병을 고치는 것을 직업으로 하는 사람.","담당 의사."]],1,[]],["무덤","명사",0,"",[["송장이나 유골을 땅에 묻어 놓은 곳. 흙으로 둥글게 쌓아 올리기도 하고 돌로 평평하게 만들기도 하는데, 대개 묘석을 세워 누구의 것인지 표시한다.","무덤에 묻히다."]],1,[]],["원소(元素)","명사",0,"으뜸 원, 본디 소",[["수학에서, 집합을 이루는 낱낱의 요소.","각각의 원소.","عُنْصُر"],["집합을 이루는 낱낱의 요소.","무리수 집합의 원소."],["모든 물질을 구성하는 기본적 요소. 원자핵 내의 양성자 수와 원자 번호가 같다. 현재까지는 118종이 알려져 있다.","원소의 화학적 성질."]],1,[]],["회색(灰色)","명사",0,"재 회, 빛 색",[["검은색과 흰색의 중간색으로, 재의 빛깔과 같은 색.","옅은 회색.","لون رمادي"],["재의 빛깔과 같이 흰빛을 띤 검정.","회색 구름."]],1,[]],["물기(물氣)","명사",0,"기운 기",[["축축한 물의 기운.","물기가 마르다."]],1,[]],["아프리카(Africa)","명사",0,"",[["아시아 대륙에 이어 세계에서 두 번째로 큰 대륙. 동쪽은 인도양, 서쪽은 대서양, 북쪽은 지중해에 면해 있으며, 육대주의 하나이다. 적도가 중앙부에 걸쳐 있어 열대·아열대 기후를 나타낸다. 16세기부터 유럽 제국의 식민지로 전락되어 ‘검은 대륙’이라고 불렸으나 제이 차 세계 대전 이후 독립 운동이 가속되어 대부분의 나라가 독립하였다.",""]],1,[]],["지대(地帶)","명사",0,"땅 지, 띠 대",[["자연적, 또는 인위적으로 한정된 일정 구역.","평야 지대."]],1,[]],["도리(道理)","명사",0,"길 도, 다스릴 리",[["사람이 마땅히 지켜야 할 바른 마음가짐이나 몸가짐.","부모의 도리.","وَاجِب"],["사람이 어떤 입장에서 마땅히 행하여야 할 바른길.","도리에 어긋나다."]],1,[]],["한방(한房)","명사",0,"방 방",[["같은 방.","한방을 쓰다."]],1,[]],["기초(基礎)","명사",0,"터 기, 주춧돌 초",[["사물이나 일 등의 기본이 되는 바탕.","기초 공부.","أَسَاس، قَاعِدَة"],["사물이나 일 따위의 기본이 되는 것.","기초 실력."]],1,[]],["역사(歷史)","명사",0,"지날 역, 사기 사",[["인간 사회가 시간이 지남에 따라 흥하고 망하면서 변해 온 과정. 또는 그 기록.","고난의 역사.","تَارِيخ"],["인류 사회의 변천과 흥망의 과정. 또는 그 기록.","역사를 기록하다."]],1,[]],["가로","명사",0,"",[["왼쪽에서 오른쪽으로 나 있는 방향. 또는 그 길이.","줄을 가로로 긋다."]],1,[]],["성격(性格)","명사",0,"성품 성, 격식 격",[["개인이 가지고 있는 고유한 성질이나 품성.","긍정적인 성격.","شَخْصِيَّة"],["개인이 가지고 있는 고유의 성질이나 품성.","낙천적 성격."]],1,[]],["좌우(左右)","명사",0,"왼 좌, 오를 우",[["왼쪽과 오른쪽.","좌우 날개.","يمين ويسار"],["왼쪽과 오른쪽을 아울러 이르는 말.","좌우 날개."]],1,[]],["연결(連結)","명사",0,"이을 연, 맺을 결",[["사물과 사물을 서로 잇거나 현상과 현상이 관계를 맺게 함.","연결 관계."]],1,[]],["심장(心臟)","명사",0,"마음 심, 오장 장",[["피를 온몸에 내보내는 기관.","심장 질환.","قَلْب"],["주기적인 수축에 의하여 혈액을 몸 전체로 보내는, 순환 계통의 중심적인 근육 기관. 어류는 1심방 1심실, 양서류는 2심방 1심실, 조류와 포유류는 2심방 2심실이다. 사람의 경우에는 가슴안에서 중앙보다 왼쪽에 있고, 주먹보다 약간 큰 근육질 덩어리로 원뿔형의 주머니 모양을 하고 있다.","심장이 멈추다."]],1,[]],["악기(樂器)","명사",0,"즐길 악, 그릇 기",[["음악을 연주하는 데 쓰는 기구를 통틀어 이르는 말. 종류가 많으나 보통 음악 형식의 성질에 따라 절주(節奏) 악기·선율(旋律) 악기·화성(和聲) 악기로 나누고, 그 주법에 따라 현악기·관악기·타악기로 나눈다.","악기를 연주하다."]],1,[]],["아시아(Asia)","명사",0,"",[["육대주의 하나. 동반구의 북부를 차지하는데, 세계 육지의 약 3분의 1에 해당하며 유럽주와 함께 유라시아 대륙을 이룬다. 남북은 인도네시아에서 시베리아, 동서는 일본에서 튀르키예 및 아라비아에 걸치는 지역이다. 우랄산맥, 카스피해, 캅카스산맥, 보스포루스 해협에 의하여 유럽과 갈라져 있고, 수에즈 지협으로 아프리카 대륙에 접해 있다. 인구는 세계 인구의 2분의 1 이상을 차지한다. 면적은 4,439만 1,162㎢.",""]],1,[]],["비율(比率)","명사",0,"견줄 비, 비율 율",[["다른 수나 양에 대한 어떤 수나 양의 비(比).","비율이 낮다."]],1,[]],["구름","명사",0,"",[["공기 중의 수분이 엉기어서 미세한 물방울이나 얼음 결정의 덩어리가 되어 공중에 떠 있는 것.","구름이 끼다."]],1,[]],["주요(主要)","명사",0,"임금 주, 요긴할 요",[["주되고 중요함.","올해의 주요 사건."]],1,[]],["산지(産地)","명사",0,"낳을 산, 땅 지",[["생산되어 나오는 곳.","산지 가격."]],1,[]],["회사(會社)","명사",0,"모일 회, 모일 사",[["상행위 또는 그 밖의 영리 행위를 목적으로 하는 사단 법인. 주식회사, 유한 회사, 합자 회사, 합명 회사의 네 가지가 있다.","계열 회사."]],1,[]],["영화(映畫)","명사",0,"비칠 영, 그림 화",[["일정한 의미를 갖고 움직이는 대상을 촬영하여 영사기로 영사막에 재현하는 종합 예술.","영화 관람."]],1,[]],["죽음","명사",0,"",[["죽는 일. 생물의 생명이 없어지는 현상을 이른다.","삶과 죽음."]],1,[]],["품계(品階)","명사",0,"물건 품, 섬돌 계",[["여러 벼슬자리에 대하여 매기던 등급. 제일 높은 정일품에서 제일 낮은 종구품까지 18단계로 나뉘어 있다.","품계를 받다."]],1,[]],["수소(水素)","명사",0,"물 수, 본디 소",[["모든 물질 가운데 가장 가벼운 기체 원소. 빛깔과 냄새와 맛이 없고 불에 타기 쉽다. 환원 작용을 일으키며 금속에 대하여 친화력이 적다. 원자 기호는 H, 원자 번호는 1, 원자량은 1
