["죽은 사람의 위패. 대개 밤나무로 만드는데, 길이는 여덟 치, 폭은 두 치가량이고, 위는 둥글고 아래는 모지게 생겼다.","신주를 모시다."]],1,[]],["경찰(警察)","명사",0,"깨우칠 경, 살필 찰",[["사회의 질서를 지키고 국민의 안전과 재산을 보호하는 일. 또는 그러한 일을 맡은 국가 기관.","경찰 조사.","شُرْطَة"],["경계하여 살핌.",""]],1,[]],["적음(積陰)","명사",0,"쌓을 적, 그늘 음",[["쌓이고 쌓인 음기(陰氣)라는 뜻으로, 한기(寒氣)나 겨울철을 이르는 말.",""],["계속하여 날이 흐림.",""]],1,[]],["특수(特殊)","명사",0,"특별할 특, 다를 수",[["특별히 다름.","특수 기능."]],1,[]],["부정(不淨)","명사",0,"아닐 부, 깨끗할 정",[["깨끗하지 않음. 또는 그런 것.","마음의 부정","عَدَم طَهَارَة"],["깨끗하지 못함. 또는 더러운 것.",""]],1,[]],["협(劦)","명사",0,"힘합할 협",[["백제의 팔대 성(姓) 가운데 하나.",""]],1,[]],["병조(兵曹)","명사",0,"병사 병, 무리 조",[["조선 시대에, 육조(六曹) 가운데 군사와 우역(郵驛)에 관한 일을 맡아보던 관아.",""]],1,[]],["발달(發達)","명사",0,"필 발, 통달할 달",[["신체, 정서, 지능 등이 성장하거나 성숙함.","시각 발달.","تَطَوُّر"],["신체, 정서, 지능 따위가 성장하거나 성숙함.","신체의 발달."]],1,[]],["곡물(穀物)","명사",0,"곡식 곡, 물건 물",[["사람의 식량이 되는 쌀, 보리, 콩, 조, 기장, 수수, 밀, 옥수수 따위를 통틀어 이르는 말.","곡물을 재배하다."]],1,[]],["혹","명사",0,"",[["병적으로 튀어나온 살덩어리.","커다란 혹.","ورم"],["병적으로 불거져 나온 살덩어리.","그의 목덜미에는 커다란 혹이 나 있다."]],1,[]],["유도(誘導)","명사",0,"꾈 유, 인도할 도",[["사람이나 물건을 원하는 방향이나 장소로 이끎.","대화 유도.","استدراج، جلب"],["사람이나 물건을 목적한 장소나 방향으로 이끎.","차량 유도."]],1,[]],["유생(儒生)","명사",0,"선비 유, 날 생",[["유학(儒學)을 공부하는 선비.","성균관 유생."]],1,[]],["감자","명사",0,"",[["가짓과의 여러해살이풀. 높이는 60~100cm이며, 잎은 겹잎이고 어긋난다. 초여름에 흰색 또는 자주색의 통꽃이 줄기 끝에 핀다. 비교적 찬 기후에서 잘 자라고 성장 기간이 짧다. 남아메리카 칠레가 원산지로 온대, 한대에서 널리 재배된다.","여름이 되자 밭에 심은 감자가 잘 자라 녹색 잎이 무성해졌다."]],1,[]],["지게","명사",0,"",[["짐을 얹어 사람이 등에 지는 우리나라 고유의 운반 기구. 두 개의 가지 돋친 장나무를, 위는 좁고 아래는 벌어지게 나란히 세우고 그 사이를 세장으로 가로질러 맞추고 아래위로 밀삐를 걸었다.","지게를 벗다."]],1,[]],["풍경(風景)","명사",0,"바람 풍, 볕 경",[["자연이나 지역의 아름다운 모습.","가을 풍경.","مَنْظَر"],["산이나 들, 강, 바다 따위의 자연이나 지역의 모습.","풍경이 아름답다."]],1,[]],["원자량(原子量)","명사",0,"언덕 원, 아들 자, 헤아릴 량",[["원자의 상대적인 질량. 질량수 12의 탄소 원자 ¹²C를 기준으로 하고 이것과의 비율에 따라 각 원자의 질량을 나타낸다.",""]],1,[]],["생기(生氣)","명사",0,"날 생, 기운 기",[["싱싱하고 힘찬 기운.","생기가 돌다."]],1,[]],["주파수(周波數)","명사",0,"두루 주, 물결 파, 셈 수",[["전파나 음파가 1초 동안에 진동하는 횟수.","주파수를 20헤르츠로 맞추다."]],1,[]],["입맛","명사",0,"",[["음식을 먹을 때 입에서 느끼는 맛. 또는 음식을 먹고 싶은 욕구.","입맛이 나다.","شهية للأكل"],["음식을 먹을 때 입에서 느끼는 맛에 대한 감각.","입맛이 당기다."]],1,[]],["참고(參考)","명사",0,"참여할 참, 생각할 고",[["살펴서 생각함.",""]],1,[]],["본질(本質)","명사",0,"근본 본, 바탕 질",[["본디부터 가지고 있는 사물 자체의 성질이나 모습.","생명의 본질."]],1,[]],["알림","명사",0,"",[["알게 하는 일. 또는 그 내용.","기다리던 사람이 도착했다는 반가운 알림이 집 안으로 전해졌다."]],1,[]],["종교적(宗敎的)","명사",0,"마루 종, 가르칠 교, 과녁 적",[["종교에 딸리거나 종교와 관련되는 것.","종교적인 행사."]],1,[]],["용(龍)","명사",0,"용 용",[["상상의 동물 가운데 하나. 몸은 거대한 뱀과 비슷한데 비늘과 네 개의 발을 가지며 뿔은 사슴에, 귀는 소에 가깝다고 한다. 깊은 못이나 늪, 호수, 바다 등 물속에서 사는데 때로는 하늘로 올라가 풍운을 일으킨다고 한다. 중국에서는 상서로운 동물로 기린·봉황·거북과 함께 사령(四靈)의 하나로서 천자에 견주며, 인도에서는 불법을 수호하는 사천왕의 하나로 생각하고 있다.",""]],1,[]],["초여름(初여름)","명사",0,"처음 초",[["이른 여름. 주로 음력 4월을 이른다.","바람기도 없이 정수리에서 쏟아져 붓는 햇살이 초여름 같게 따가웠다.≪김원일, 불의 제전≫"]],1,[]],["놋쇠","명사",0,"",[["구리에 아연을 10~45% 넣어 만든 합금. 가공하기 쉽고 녹슬지 않아 공업 재료로 널리 쓴다.","놋쇠 그릇."]],1,[]],["지음(知音)","명사",0,"알 지, 소리 음",[["음악의 곡조를 잘 앎.",""]],1,[]],["뱃속","명사",0,"",[["배의 속.",""]],1,[]],["청색(靑色)","명사",0,"푸를 청, 빛 색",[["맑은 가을 하늘과 같이 밝고 선명한 푸른색.","청색 치마."]],1,[]],["이란(Iran)","명사",0,"",[["서아시아 서남부에 있는 공화국. 옛날에는 페르시아라 불리었으나 1935년에 지금의 이름으로 바뀌었으며, 1979년에 혁명에 의하여 왕제(王制)가 폐지되었다. 주산업이 농업과 목축이며, 석유 자원이 풍부하고 특산으로 페르시아 융단이 있다. 주민은 대부분이 이란인으로 이슬람교도이고 주요 언어는 페르시아어이다. 수도는 테헤란, 면적은 164만 7064㎢.",""]],1,[]],["함북(咸北)","명사",0,"다 함, 북녘 북",[["우리나라 북동부에 있는 도. 옥저의 땅이었으며, 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 청진이다. 면적은 약 20,345㎢.",""]],1,[]],["지킴","명사",0,"",[["한 집이나 일정한 곳을 지키고 있다는 신령한 동물이나 물건.",""]],1,[]],["등불(燈불)","명사",0,"등 등",[["어두운 데를 밝히려고 등에 켠 불.","노란 등불.","ضَوْء الْمِصْبَاح"],["등에 켠 불.","등불을 켜다."]],1,[]],["하인(下人)","명사",0,"아래 하, 사람 인",[["남의 집에 매여 일을 하는 사람.","하인을 두다."]],1,[]],["수나라(隋나라)","명사",0,"수나라 수",[["581년에 중국 북주(北周)의 양견(楊堅)이 정제(靜帝)의 선양(禪讓)을 받아 세운 왕조. 581년에 개국하였으며, 589년에 진(陳)나라를 합쳐 중국을 통일하였으나, 618년에 당나라 고조 이연(李淵)에게 망하였다.","당나라에서는 고구려가 수나라를 이긴 동방의 강국이라 하여 어느 정도의 겁을 집어먹고….≪홍효민, 신라 통일≫"]],1,[]],["친척(親戚)","명사",0,"친할 친, 친척 척",[["친족과 외척을 아울러 이르는 말.","우리는 설 때마다 친척 어른께 두루 세배를 하러 다닌다."]],1,[]],["재배(再拜)","명사",0,"두 재, 절 배",[["두 번 절함. 또는 그 절.","재배를 올리다."]],1,[]],["경서(經書)","명사",0,"지날 경, 글 서",[["옛 성현들이 유교의 사상과 교리를 써 놓은 책. ≪역경≫·≪서경≫·≪시경≫·≪예기≫·≪춘추≫·≪대학≫·≪논어≫·≪맹자≫·≪중용≫ 따위를 통틀어 이른다.","그 속은 깊이 모르겠습니다마는 경서를 읽은 식자들 가운데서 백성들 고통에 그 사람만큼 번민한 사람은 없었던 것 같습디다.≪송기숙, 녹두 장군≫"]],1,[]],["상류(上流)","명사",0,"윗 상, 흐를 류",[["흐르는 강이나 냇물의 윗부분.","강의 상류.","أعلى النهر"],["강이나 내의 발원지에 가까운 부분.","한강 상류 지역."]],1,[]],["노비(奴婢)","명사",0,"종 노, 계집종 비",[["사내종과 계집종을 아울러 이르는 말.","노비 문서."]],1,[]],["점무늬(點무늬)","명사",0,"점 점",[["점 모양의 무늬.","전망대에 올라가면 밑에 있는 사람들이 작은 점무늬처럼 보인다."]],1,[]],["귀양","명사",0,"",[["고려·조선 시대에, 죄인을 먼 시골이나 섬으로 보내어 일정한 기간 동안 제한된 곳에서만 살게 하던 형벌. 초기에는 방축향리의 뜻으로 쓰다가 후세에 와서는 도배(徒配), 유배(流配), 정배(定配)의 뜻으로 쓰게 되었다.","귀양을 보내다."]],1,[]],["상공업(商工業)","명사",0,"장사 상, 장인 공, 업 업",[["상업과 공업을 아울러 이르는 말.","지주의 재산은 산업체에 투자됨으로써 상공업의 눈부신 발전을 가져올 것이다.≪김원일, 불의 제전≫"]],1,[]],["깃발(旗발)","명사",0,"기 깃",[["긴 장대에 달린 천이나 종이로 된 것.","깃발이 나부끼다.","عِلْم"],["깃대에 달린 천이나 종이로 된 부분.","깃발이 바람에 날리다."]],1,[]],["단성화(單性花)","명사",0,"홑 단, 성품 성, 꽃 화",[["한 꽃 안에 수술 또는 암술만 있는 꽃. 암꽃과 수꽃이 다른 그루에서 피는 것과 같은 그루에서 피는 것이 있다. 밤나무의 꽃, 뽕나무의 꽃, 소나무의 꽃, 은행나무의 꽃, 호박의 꽃 따위이다.",""]],1,[]],["알갱이","명사",0,"",[["열매나 곡식 등의 낱알.","곡식 알갱이.","حبّة"],["열매나 곡식 따위의 낱알.","보리 알갱이."]],1,[]],["앎","명사",0,"",[["아는 일.","앎은 힘이다."]],1,[]],["방면(方面)","명사",0,"모 방, 낯 면",[["어떤 장소나 지역이 있는 방향.","동쪽 방면.","جِهَة"],["어떤 장소나 지역이 있는 방향. 또는 그 일대.","시청 방면."]],1,[]],["필름(film)","명사",0,"",[["셀로판과 같은 엷은 막.","인테리어 필름."]],1,[]],["고등(高等)","명사",0,"높을 고, 무리 등",[["등급이나 수준, 정도 따위가 높음. 또는 그런 정도.","고등 지식."]],1,[]],["팀(team)","명사",0,"",[["같은 일을 함께하는 한 무리.","구조 팀.","فريق، فرقة،"],["같은 일에 종사하는 한동아리의 사람.","국가대표 팀."]],1,[]],["초록색(草綠色)","명사",0,"풀 초, 푸를 록, 빛 색",[["파랑과 노랑의 중간색. 또는 그런 색의 물감.","길 양쪽으로는 유월의 폭양 밑에 초록색 논들이 질펀하게 뻗어 있었다.≪홍성원, 육이오≫"]],1,[]],["기원(紀元)","명사",0,"벼리 기, 으뜸 원",[["역사에서 연대를 세는 시작점이 되는 해.","기원 이전.","تَارِيخ تَقْوِيم، عَصْر، عَهْد"],["연대를 계산하는 데에 기준이 되는 해. 우리나라는 정부 수립과 동시에 단군왕검이 즉위한 해인 기원전 2333년을 원년으로 하는 단군기원을 쓰다가 5·16 군사 정변 후에 이것을 폐기하고 예수가 태어난 해를 원년으로 하는 서력기원을 쓰게 되었는데, 이는 현재 세계적으로 사용되는 것이다.",""]],1,[]],["함경북도(咸鏡北道)","명사",0,"다 함, 거울 경, 북녘 북, 길 도",[["우리나라 북동부에 있는 도. 옥저의 땅이었으며, 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 청진이다. 면적은 약 20,345㎢.",""]],1,[]],["속성(屬性)","명사",0,"붙일 속, 성품 성",[["사물의 특징이나 성질.","여러 가지 물건의 속성을 살펴보자."]],1,[]],["주인공(主人公)","명사",0,"임금 주, 사람 인, 공평할 공",[["연극, 영화, 소설 등에서 이야기의 중심이 되는 인물.","남자 주인공.","بطل"],["연극, 영화, 소설 따위에서 사건의 중심이 되는 인물.","비운의 주인공."]],1,[]],["원한(怨恨)","명사",0,"원망할 원, 한 한",[["억울하고 원통한 일을 당하여 응어리진 마음.","원한이 맺히다."]],1,[]],["동식물(動植物)","명사",0,"움직일 동, 심을 식, 물건 물",[["동물과 식물을 아울러 이르는 말.","바다에는 많은 종류의 동식물이 서식하고 있다."]],1,[]],["항문(肛門)","명사",0,"항문 항, 문 문",[["위창자관의 가장 아래쪽에 있는 구멍.","변비에 걸린 동생의 항문이 찢어지지 않게 보호하기 위해서 항문 주위 부분을 손가락으로 넓게 압박하여 딱딱히 굳은 배설물을 눌러 주던 기억이 있다.≪최인호, 두레박을 올려라≫"]],1,[]],["공신(功臣)","명사",0,"공 공, 신하 신",[["나라를 위하여 특별한 공을 세운 신하.","건국의 일등 공신."]],1,[]],["소매","명사",0,"",[["윗옷의 좌우에 있는 두 팔을 꿰는 부분.","짧은 소매."]],1,[]],["조리(調理)","명사",0,"고를 조, 다스릴 리",[["건강을 되찾도록 몸을 보살피거나 병을 낫게 함.","조리 기간.","عِنَايَةٌ"],["건강이 회복되도록 몸을 보살피고 병을 다스림.","의사는 몸이 다 나을 때까지 조리에만 집중하라고 했다."],["요리를 만듦. 또는 그 방법이나 과정.","위생적으로 조리를 하다."]],1,[]],["서까래","명사",0,"",[["마룻대에서 도리 또는 보에 걸쳐 지른 나무. 그 위에 산자를 얹는다.",""]],1,[]],["수로(水路)","명사",0,"물 수, 길 로",[["물이 흐르거나 물을 흘려 보내는 통로.","수로가 넓다.","مَسْلَكٌ مَائِيٌّ"],["물이 흐르거나 물을 보내는 통로.","수로를 내다."]],1,[]],["빙하(氷河)","명사",0,"얼음 빙, 물 하",[["수백수천 년 동안 쌓인 눈이 얼음덩어리로 변하여 그 자체의 무게로 압력을 받아 이동하는 현상. 또는 그 얼음덩어리. 중력에 따라 지형이 낮은 곳으로 서서히 이동한다. 남극 대륙이나 그린란드를 덮은 대륙 빙하와 알프스산맥이나 히말라야산맥처럼 폭이 좁은 리본 형태로 산 계곡을 흘러내리는 산악 빙하가 있다. 빙하의 상태는 기후의 장기적 변동을 추정하는 데 중요한 지표가 된다.","지구 온난화로 극지의 빙하가 녹고 있다."]],1,[]],["습관(習慣)","명사",0,"익힐 습, 익숙할 관",[["어떤 행위를 오랫동안 되풀이하는 과정에서 저절로 익혀진 행동 방식.","일찍 일어나는 습관을 가지다."]],1,[]],["먹지(먹紙)","명사",0,"종이 지",[["한쪽 또는 양쪽 면에 검은 칠을 한 얇은 종이. 종이 사이에 끼우고 골필이나 철필로 눌러써서 한꺼번에 여러 벌을 복사한다.","몇 부를 필요로 할지 모르니 먹지를 이용해서 여러 벌을 한꺼번에 쓰면 어떻겠습니까?≪이병주, 지리산≫"]],1,[]],["시중(市中)","명사",0,"저자 시, 가운데 중",[["도시의 안.",""]],1,[]],["실력(實力)","명사",0,"열매 실, 힘 력",[["어떤 일을 해낼 수 있는 능력.","노래 실력.","قدرة، مقدرة"],["실제로 갖추고 있는 힘이나 능력.","수학 실력."]],1,[]],["인공(人工)","명사",0,"사람 인, 장인 공",[["사람이 하는 일.",""]],1,[]],["사태(沙汰/砂汰)","명사",0,"모래 사, 일 태 / 모래 사, 일 태",[["산이나 언덕의 흙 또는 쌓인 눈 등이 비바람 같은 충격을 받아 한꺼번에 무너져 내리는 일.","사태가 나다.","اِنْهِيَارٌ"],["산비탈이나 언덕 또는 쌓인 눈 따위가 비바람이나 충격 따위로 무너져 내려앉는 일.","사태가 나다."]],1,[]],["상인(商人)","명사",0,"장사 상, 사람 인",[["장사를 직업으로 하는 사람.","시장 안은 손님을 부르는 상인들로 몹시 시끄러웠다."]],1,[]],["왕후(王后)","명사",0,"임금 왕, 임금 후",[["임금의 아내.","왕후 민씨의 언변은 왕후답게 엄숙하고 여걸답게 능숙했다.≪유주현, 대한 제국≫"]],1,[]],["이슬람교(Islam敎)","명사",0,"가르칠 교",[["610년에 아라비아의 예언자 마호메트가 창시한 세계 3대 종교의 하나. 정교일치(政敎一致)의 일신교로 유일신 알라가 마호메트를 통하여 계시한 코란을 경전으로 한다. 교주권은 마호메트가 죽은 뒤 후계자인 칼리프가 계승하였으나 후계자를 둘러싼 대립이 생겨 수니파와 시아파, 그 외의 여러 파로 분열되었다. 성지 메카를 중심으로 아시아, 아프리카, 유럽 등지에 널리 퍼져 신도의 수는 4억 이상을 헤아린다.",""]],1,[]],["모서리","명사",0,"",[["물건의 모가 진 가장자리.","건물 모서리.","زَاوِيَة، حَافَّة"],["물체의 모가 진 가장자리.","팔각기둥의 여덟 모서리."]],1,[]],["지배(支配)","명사",0,"지탱할 지, 나눌 배",[["어떤 사람이나 집단을 자신의 뜻대로 복종하게 하여 다스리거나 차지함.","식민지 지배.","حُكْم"],["어떤 사람이나 집단, 조직, 사물 등을 자기의 의사대로 복종하게 하여 다스림.","지배 세력에 대항하다."]],1,[]],["명성(名聲)","명사",0,"이름 명, 소리 성",[["세상에 널리 퍼져 평판 높은 이름.","명성을 날리다."]],1,[]],["혼합물(混合物)","명사",0,"섞을 혼, 합할 합, 물건 물",[["여러 가지가 뒤섞여서 이루어진 물건.",""]],1,[]],["지질(地質)","명사",0,"땅 지, 바탕 질",[["지각을 이루는 여러 가지 암석이나 지층의 성질 또는 상태.","백악기 말에 일어난 지질의 큰 변동."]],1,[]],["창자","명사",0,"",[["큰창자와 작은창자를 통틀어 이르는 말.","창자가 꼬이다."]],1,[]],["뜰","명사",0,"",[["집 안의 앞뒤나 좌우로 가까이 딸려 있는 빈터. 화초나 나무를 가꾸기도 하고, 푸성귀 따위를 심기도 한다.","뜰을 가꾸다."]],1,[]],["정서(情緖)","명사",0,"뜻 정, 실마리 서",[["사람의 마음에 일어나는 여러 가지 감정. 또는 감정을 불러일으키는 기분이나 분위기.","정서의 함양."]],1,[]],["일가(一家)","명사",0,"한 일, 집 가",[["한집에 사는 가족.","화목한 일가.","عَائِلَة"],["한집에서 사는 가족.","화목한 일가."]],1,[]],["빨래","명사",0,"",[["더러운 옷이나 천 등을 물에 빠는 일.","설거지와 빨래.","غَسْلٌ"],["더러운 옷이나 피륙 따위를 물에 빠는 일.","빨래가 힘들다."],["더러운 옷이나 피륙 따위. 또는 빨아진 옷이나 피륙 따위.","빨래가 밀리다."]],1,[]],["샘","명사",0,"",[["남의 것을 탐내거나, 자기보다 형편이 나은 사람을 부러워하거나 싫어하는 일. 또는 그런 마음.","샘이 나다.","حسد، غيره"],["물이 땅에서 솟아 나오는 곳. 또는 그 물.","샘을 파다."],["남의 처지나 물건을 탐내거나, 자기보다 나은 처지에 있는 사람이나 적수를 미워함. 또는 그런 마음.","샘이 많은 동생."]],1,[]],["천구(天狗)","명사",0,"하늘 천, 개 구",[["재해(災害)의 징조로 나타난다고 하는 별. 혜성이나 큰 유성을 이른다.",""]],1,[]],["동네(洞네)","명사",0,"골 동",[["사람들이 생활하는 여러 집이 모여 있는 곳.","친구네 동네."]],1,[]],["단맛","명사",0,"",[["설탕이나 꿀을 먹었을 때 느껴지는 달콤한 맛.","단맛이 강하다."]],0,[]],["토끼","명사",0,"",[["토낏과의 포유류를 통틀어 이르는 말. 귀가 길고 뒷다리가 앞다리보다 발달하였으며 꼬리는 짧다. 초식성으로 번식력이 강하다. 여러 종류가 있으며 아프리카, 아메리카, 아시아, 유럽 등지에 분포한다.","긴장하는 모습이 놀란 토끼와 같다."]],1,[]],["내림","명사",0,"",[["부모나 조상으로부터 내려오는 유전적인 특성.","술을 잘 마시지 못하는 것은 우리 집 남자들의 내림이다."]],1,[]],["수정(修正)","명사",0,"닦을 수, 바를 정",[["바로잡아 고침.","궤도의 수정."]],1,[]],["벗","명사",0,"",[["비슷한 나이에 서로 친하게 지내는 사람.","오래된 벗.","صَدِيقٌ"],["비슷한 또래로서 서로 친하게 사귀는 사람.","벗을 사귀다."]],1,[]],["씨름","명사",0,"",[["두 사람이 서로 상대의 샅바를 잡고 기술이나 힘을 겨루어 먼저 넘어뜨리는 쪽이 이기는 한국의 민속 운동 경기.","씨름 한 판.","لعبة سيروم"],["두 사람이 샅바를 잡고 힘과 재주를 부리어 먼저 넘어뜨리는 것으로 승부를 겨루는 우리 고유의 운동.","씨름 한 판을 벌이다."]],1,[]],["어업(漁業)","명사",0,"고기잡을 어, 업 업",[["영리를 목적으로 물고기, 조개, 김, 미역 따위를 잡거나 기르는 산업. 또는 그런 직업.","어업에 종사하다."]],1,[]],["지각(知覺)","명사",0,"알 지, 깨달을 각",[["사물의 이치를 깨닫는 능력.","상실한 지각.","إِدْرَاك"],["알아서 깨달음. 또는 그런 능력.","이미 더위를 먹을 대로 먹어 버린 우리의 지각은 일단 받아들인 명령을 다리에까지 전달하는 일에 몹시 게으르고 불성실했다.≪윤흥길, 제식 훈련 변천 약사≫"],["감각 기관을 통하여 대상을 인식함. 또는 그런 작용. 그 작용의 결과로 지각체가 형성된다.",""]],1,[]],["잔꽃","명사",0,"",[["풀과 나무의 작은 꽃.",""]],1,[]],["군함(軍艦)","명사",0,"군사 군, 큰배 함",[["해군에 소속되어 있는 배. 흔히 전투에 참여하는 모든 배를 이르며, 전함·순양함·항공 모함·구축함 따위가 있다.","적의 함대는 군함 12척을 이끌고 진격해 왔다."]],1,[]],["서리","명사",0,"",[["무리를 지어 남의 땅에서 난 과일이나 곡식 등을 훔쳐 먹는 장난.","감자 서리.","سَرِقَةُ الْمُزَاحِ"],["떼를 지어 남의 과일, 곡식, 가축 따위를 훔쳐 먹는 장난.","수박 서리."],["대기 중의 수증기가 지상의 물체 표면에 얼어붙은 것. 땅 위의 표면이 복사 냉각으로 차가워지고, 그 위에서 수증기가 승화하여 생긴다.","지난밤에 서리가 많이 내렸다."]],1,[]],["범인(犯人)","명사",0,"범할 범, 사람 인",[["범죄를 저지른 사람.","범인을 검거하다."]],1,[]],["산속(山속)","명사",0,"메 산",[["산의 속.","산속 깊이 들어가다."]],1,[]],["작자(作者)","명사",0,"지을 작, 놈 자",[["글이나 곡을 지은 사람.","작자 미상.","مؤلّف"],["글을 쓰거나 문학 작품, 악곡 따위의 작품을 지은 사람.","이 소설은 작자와 창작 연대가 미상이다."],["나 아닌 다른 사람을 낮잡아 이르는 말.","저 사람, 뭐 하는 작자야?"]],1,[]],["저고리","명사",0,"",[["한복 윗옷의 하나. 길, 소매, 섶, 깃, 동정, 고름, 끝동, 회장 따위가 갖추어져 있다. 겹저고리와 핫저고리가 있다.","검정 치마에 흰 저고리."]],1,[]],["밀도(密度)","명사",0,"빽빽할 밀, 법도 도",[["물질의 부피당 질량.","밀도가 낮다.","كَثَافَة"],["빽빽이 들어선 정도.","밀도가 높다."]],1,[]],["흉내","명사",0,"",[["남이 하는 말이나 행동을 그대로 옮기는 짓.","목소리 흉내."]],1,[]],["가톨릭(Catholic)","명사",0,"",[["가톨릭교회나 가톨릭교도를 이르는 말.",""],["그리스도의 정통 교의(敎義)를 믿는 종교. 크게 로마 가톨릭교와 그리스 정교회로 나눈다.",""]],1,[]],["교법(敎法)","명사",0,"가르칠 교, 법 법",[["가르치는 방법.",""]],1,[]],["희망(希望)","명사",0,"바랄 희, 바랄 망",[["앞일에 대하여 기대를 가지고 바람.","간절한 희망.","أَمَلٌ"],["어떤 일을 이루거나 하기를 바람.","희망 사항."]],1,[]],["고원(高原)","명사",0,"높을 고, 언덕 원",[["보통 해발 고도 600미터 이상에 있는 넓은 벌판.","가파른 숲속 길을 몇 시간 올라가니 넓은 고원이 펼쳐졌다."]],1,[]],["장면(場面)","명사",0,"마당 장, 낯 면",[["어떤 곳에서 무슨 일이 벌어지는 광경.","경기 장면.","مَشْهَد"],["어떤 장소에서 겉으로 드러난 면이나 벌어진 광경.","추억 속의 한 장면."]],1,[]],["두께","명사",0,"",[["두꺼운 정도.","판자의 두께."]],1,[]],["표정(表情)","명사",0,"겉 표, 뜻 정",[["마음속에 품은 감정이나 정서 따위의 심리 상태가 겉으로 드러남. 또는 그런 모습.","밝은 표정."]],1,[]],["한때","명사",0,"",[["어느 한 시기.","즐거운 휴일 한때를 보내다."],["같은 때.","두 사람이 한때에 들이닥쳤다."]],1,[]],["함경도(咸鏡道)","명사",0,"다 함, 거울 경, 길 도",[["함경남도와 함경북도를 아울러 이르는 말. 함흥과 경성(鏡城)의 머리글자에서 따온 말이다.",""]],1,[]],["신발","명사",0,"",[["땅을 딛고 서거나 걸을 때 발에 신는 물건을 통틀어 이르는 말. 가죽·고무·비닐·헝겊·나무·짚·삼 따위로 만들며, 모양과 용도에 따라 여러 가지가 있다.","신발 두 켤레."]],1,[]],["파도(波濤)","명사",0,"물결 파, 물결 도",[["바다에 이는 물결.","높은 파도."]],1,[]],["내의(內衣)","명사",0,"안 내, 옷 의",[["겉옷이 살에 직접 닿지 않도록 속에 입는 옷.","면 내의.","مَلَابِس دَاخِلِيَّة"],["겉옷의 안쪽에 몸에 직접 닿게 입는 옷.","내의 몇 벌과 세면도구를 챙겨 여행을 떠났다."]],1,[]],["음절(音節)","명사",0,"소리 음, 마디 절",[["하나의 종합된 음의 느낌을 주는 말소리의 단위. 몇 개의 음소로 이루어지며, 모음은 단독으로 한 음절이 되기도 한다. ‘아침’의 ‘아’와 ‘침’ 따위이다.","그가 첫 음절을 말하는 순간 답을 알아차렸다."]],1,[]],["장비(裝備)","명사",0,"꾸밀 장, 갖출 비",[["갖추어 차림. 또는 그 장치와 설비.","등산 장비."]],1,[]],["권세(權勢)","명사",0,"권세 권, 형세 세",[["권력과 세력을 아울러 이르는 말.","권세 높은 고관대작."]],1,[]],["상하(上下)","명사",0,"윗 상, 아래 하",[["위와 아래.","상하 교체.","أعلى وأسفل ، فوق وتحت"],["위와 아래를 아울러 이르는 말.","상하 간격."]],1,[]],["여러해살이","명사",0,"",[["식물이 2년 이상 생존하는 일. 또는 그런 식물.",""]],1,[]],["축구(蹴球)","명사",0,"찰 축, 공 구",[["주로 발로 공을 차서 상대편의 골에 공을 많이 넣는 것으로 승부를 겨루는 경기. 11명이 팀을 이루며, 골키퍼 이외에는 손을 쓰면 안 되고 주로 머리와 발을 사용한다.","축구 경기를 관람하다."]],1,[]],["대승(大勝)","명사",0,"클 대, 이길 승",[["싸움이나 경기에서 크게 이김.","대승을 거두다."]],1,[]],["부스럼","명사",0,"",[["피부에 나는 종기를 통틀어 이르는 말.","부스럼 딱지."]],1,[]],["방사선(放射線)","명사",0,"놓을 방, 쏠 사, 줄 선",[["방사성 원소의 붕괴에 따라 물체에서 방출되는 입자나 전자기파. 프랑스의 물리학자 베크렐이 우라늄 화합물에서 처음 발견한 것으로, 알파선·베타선·감마선이 있다.",""]],1,[]],["극락(極樂)","명사",0,"극진할 극, 즐길 락",[["매우 편안하여 아무 걱정이 없는 상태나 그러한 장소.","극락이 따로 없다.","فِرْدَوْسٌ"],["더없이 안락해서 아무 걱정이 없는 경우와 처지. 또는 그런 장소.","참말로 내가, 내 일생을, 그때 그 집에 있었을 때가 극락이었어요.≪최명희, 혼불≫"]],1,[]],["분포(分布)","명사",0,"나눌 분, 베 포",[["일정한 범위에 흩어져 퍼져 있음.","버스, 지하철 노선의 분포."]],1,[]],["몸무게","명사",0,"",[["몸의 무게.","몸무게가 늘다."]],1,[]],["수면(水面)","명사",0,"물 수, 낯 면",[["물의 겉면.","잔잔한 수면에 얼굴을 비추다."]],1,[]],["귀가(歸家)","명사",0,"돌아갈 귀, 집 가",[["집으로 돌아가거나 돌아옴.","귀가 시간이 늦다."]],1,[]],["투수(投手)","명사",0,"던질 투, 손 수",[["야구에서, 내야의 중앙에 위치한 마운드에서 상대편의 타자가 칠 공을 포수를 향하여 던지는 선수.","투수 엔트리를 공개하다."]],1,[]],["하류(下流)","명사",0,"아래 하, 흐를 류",[["강이나 내의 아래쪽 부분.","하류 지역."]],1,[]],["일인칭(一人稱)","명사",0,"한 일, 사람 인, 일컬을 칭",[["말하는 사람이 자기 또는 자기의 동아리를 이르는 인칭. 예를 들어 ‘나는 학생이다.’에서 ‘나’, ‘우리는 소풍을 간다.’에서 ‘우리’ 따위이다.","독재자는 일인칭을 많이 사용한다.≪이어령, 흙 속에 저 바람 속에≫"]],1,[]],["노(櫓)","명사",0,"노 노",[["물을 헤쳐 배를 나아가게 하는 기구. 나무나 합성수지로 만드는데 물속에 들어가는 부분은 납작하고 손잡이 부분은 가늘다.","노를 젓다."]],1,[]],["역사적(歷史的)","명사",0,"지날 역, 사기 사, 과녁 적",[["인간 사회가 시간이 지남에 따라 흥하고 망하면서 변해 온 과정에 관한 것. 또는 그러한 기록에 관한 것.","역사적인 기록.","تاريخيّ"],["역사에 관한 것.","역사적인 사실."]],1,[]],["증서(證書)","명사",0,"증거 증, 글 서",[["권리나 의무, 사실 따위를 증명하는 문서.","증서 외엔 따로 담보물 제도가 없었음에도 꾼 돈을 갚지 않는 일은 전혀 없었다.≪박완서, 미망≫"]],1,[]],["묘(妙)","명사",0,"묘할 묘",[["말할 수 없이 빼어나고 훌륭함. 또는 매우 교묘함.","구상의 묘."]],1,[]],["사회주의(社會主義)","명사",0,"모일 사, 모일 회, 임금 주, 옳을 의",[["생산 수단을 사회화하여 자본주의 제도의 사회적·경제적 모순을 극복한 사회 제도를 실현하려는 사상. 또는 그 운동. 공산주의, 무정부주의, 사회 민주주의 따위를 포함하는 넓은 개념이다.",""]],1,[]],["신령(神靈)","명사",0,"귀신 신, 신령 령",[["신으로 받들어지는 영혼 또는 자연물.","신령을 모신 사당."]],1,[]],["브라질(Brazil)","명사",0,"",[["남아메리카 동부에 있는 연방 공화국. 1822년에 포르투갈에서 독립한 국가로 남아메리카에서 가장 넓으며, 커피·목화 따위의 농산물과 광산 자원이 풍부하고 목축업이 활발하다. 주민은 대부분이 백인으로 가톨릭교도이고 주요 언어는 포르투갈어이다. 수도는 브라질리아, 면적은 850만 6663㎢.",""]],1,[]],["꼴","명사",0,"",[["사물의 모양.","네모난 꼴.","شَكْلٌ"],["겉으로 보이는 사물의 모양.","조각품이 서서히 꼴을 갖추어 간다."],["말이나 소에게 먹이는 풀.","꼴을 먹이다."]],1,[]],["이불","명사",0,"",[["잘 때 몸을 덮기 위하여 피륙 같은 것으로 만든 침구의 하나. 솜을 넣기도 한다. 솜이불, 겹이불, 홑이불 따위가 있다.","이불을 개다."]],1,[]],["변(邊)","명사",0,"가 변",[["장소나 물체 등의 가장자리.","거리 변.","جَانِب"],["물체나 장소 따위의 가장자리.","한강 변에 아파트를 짓다."]],1,[]],["고장(故障)","명사",0,"연고 고, 막을 장",[["기계나 장치 등이 제대로 작동하지 않음.","기계 고장.","تَعَطُّل"],["기구나 기계가 제대로 움직이지 못하게 되는 기능상의 장애.","라디오가 고장이 났는지 소리가 나지 않는다."]],1,[]],["기차(汽車)","명사",0,"물끓는김 기, 수레 차",[["여객차나 화차를 끌고 다니는 철도 차량. 증기 기관차, 디젤 기관차, 전기 기관차 따위가 있다.",""]],1,[]],["세로줄","명사",0,"",[["위에서 아래로 그은 줄.","세로줄 무늬.","خط عموديّ، خط رأسي"],["위에서 아래로 내려 그은 줄.","소녀는 노란 바탕에 초록색 세로줄 무늬가 있는 셔츠를 입고 있었다."]],1,[]],["전라도(全羅道)","명사",0,"온전할 전, 벌릴 라, 길 도",[["전라남도와 전라북도를 아울러 이르는 말. 전주와 나주의 머리글자에서 따온 말이다.",""]],1,[]],["왕위(王位)","명사",0,"임금 왕, 자리 위",[["임금의 자리.","왕위 계승."]],1,[]],["생리(生理)","명사",0,"날 생, 다스릴 리",[["생물의 목숨을 이어 나가기 위해 몸이 기능하거나 작용하는 원리.","식물의 생리.","وَظَائِفُ الْأَعْضَاءِ"],["생물체의 생물학적 기능과 작용. 또는 그 원리.","한 발의 탄환이면 쓰러져 버리는 육체의 생리로서 무슨 초인이냐 말이다.≪이병주, 행복어 사전≫"]],1,[]],["등(等)","의존명사",0,"무리 등",[["앞에서 말한 것 외에도 같은 종류의 것이 더 있음을 나타내는 말.","농구, 야구 등의 구기 종목.","إِلَى آخِرِهِ، وَغَيْرِهِ"]],1,[]],["것","의존명사",0,"",[["정확히 가리키는 대상이 정해지지 않은 사물이나 사실.","낡은 것.","شَيْء"]],1,[]],["따위","의존명사",0,"",[["앞에서 말한 것 외에도 같은 종류의 것이 더 있음을 나타내는 말.","가재, 새우, 게 따위의 갑각류.","وَنَحْوُهُ ، وَغَيْرُهُ ، إِلَى آخِرِهِ ، وَمَا إِلَى ذَلِكَ"]],1,[]]]</script>
<script>
'use strict';
// D[i] = [단어, 품사, 등급(미사용), 훈음, [[뜻,용례],...], 출처(0기초 1표준), 비슷한말(대표어인 경우만)]
let D = [];
const store = (()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}
  catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();

// ---------- 공용 ----------
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function synHTML(e){
  const syn = e[6];
  return (syn&&syn.length) ? `<div class="syn"><b>비슷한 말</b>${esc(syn.join(', '))}</div>` : '';
}
function entryHTML(e, maxSenses, onlyIdx){
  const [w,p,g,h,ss,src]=e;
  const idxs = onlyIdx || ss.map((_,i)=>i).slice(0, maxSenses||ss.length);
  const senses = idxs.map(i=>{const s=ss[i];
    return `<div class="sense">${starBtnHTML(e,i)}${ss.length>1?`<span class="n">${i+1}.</span>`:''}${esc(s[0])}`+
    (s[2]?`<span class="arw">${esc(s[2])}</span>`:'')+
    (s[1]?`<span class="ex">${esc(s[1])}</span>`:'')+`</div>`}).join('');
  const hidden = (!onlyIdx && ss.length>(maxSenses||ss.length)) ? `<button class="more" data-all="1">뜻 ${ss.length}개 모두 보기</button>` : '';
  return `<div class="entry"><div class="entryHead"><div class="w">${esc(w)}</div>${bmBtnHTML(e)}</div>
    <div class="meta"><span class="tag">${esc(p)}</span>${src?'<span class="tag">표준국어대사전</span>':'<span class="tag">기초사전</span>'}</div>
    ${h?`<div class="hm">${esc(h)}</div>`:''}${senses}${hidden}${synHTML(e)}</div>`;
}

// ---------- 별표 (뜻풀이 단위) ----------
// 저장 키: 단어|품사|뜻번호
let starArr=[];
try{starArr=JSON.parse(store.getItem('krw_star')||'[]')}catch(e){starArr=[]}
if(!Array.isArray(starArr))starArr=[];
starArr=starArr.filter(x=>typeof x==='string')
  .map(k=>k.split('|').length===2?k+'|0':k);   // 예전 '단어 단위' 별표는 첫 번째 뜻으로 옮김
let starSet=new Set(starArr);
function saveStar(){try{store.setItem('krw_star',JSON.stringify(starArr))}catch(e){}}
const wkeyOf=e=>e[0]+'|'+e[1];
const skeyOf=(e,i)=>e[0]+'|'+e[1]+'|'+i;
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}
const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 3.4l2.65 5.37 5.93.86-4.29 4.18 1.01 5.9L12 16.92l-5.3 2.79 1.01-5.9-4.29-4.18 5.93-.86z"/></svg>';
function starBtnHTML(e,i){
  const k=skeyOf(e,i);
  return `<button class="starBtn${starSet.has(k)?' on':''}" data-star="${escAttr(k)}" `+
         `aria-label="이 뜻 별표" title="이 뜻을 별표에 담기/빼기">${STAR_SVG}</button>`;
}
function syncStarBtns(){
  document.querySelectorAll('.starBtn').forEach(b=>
    b.classList.toggle('on',starSet.has(b.dataset.star)));
}
function toggleStar(k){
  if(starSet.has(k)){starSet.delete(k);starArr=starArr.filter(x=>x!==k)}
  else{starSet.add(k);starArr.unshift(k)}
  saveStar();starByIdx=null;syncStarBtns();updateStarCnt();
  if(curTab==='card'&&cMode==='star')updateCardStat();
  if(curTab==='star')renderStars();
}
// 캡처 단계에서 가로채 카드 뒤집기 등 상위 클릭과 겹치지 않게 한다
document.addEventListener('click',ev=>{
  const t=ev.target, b=(t&&t.closest)?t.closest('.starBtn'):null;
  if(!b)return;
  ev.preventDefault();ev.stopPropagation();
  toggleStar(b.dataset.star);
},true);

let keyIndex=null;
function buildKeyIndex(){
  keyIndex=new Map();
  for(let i=0;i<D.length;i++){const k=wkeyOf(D[i]);if(!keyIndex.has(k))keyIndex.set(k,i)}
}
function updateStarCnt(){
  const c=document.getElementById('starCnt');
  if(c)c.textContent=starArr.length?`뜻 ${starArr.length.toLocaleString()}개`:'';
  const cl=document.getElementById('starClear');
  if(cl)cl.classList.toggle('hidden',!starArr.length);
}
function renderStars(){
  const box=document.getElementById('starList');
  if(!box)return;
  if(!keyIndex)buildKeyIndex();

    if(!D[i][4][0]||!D[i][4][0][0])continue;

function pick(arr,n,skip){
  const out=new Set();
  let guard=0;
  while(out.size<n&&guard++<500){
    const c=arr[Math.floor(Math.random()*arr.length)];
    if(c!==skip&&D[c][0].split('(')[0]!==D[skip][0].split('(')[0])out.add(c);
  }
  return [...out];
}

<script>
// ---------- 단어집: 하루 200개 단어장 (차례대로 / 임의대로) + 학습 완료 날짜 ----------
(function(){
'use strict';
const SIZE=200, CHUNK=50;
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const body=document.getElementById('wbBody');
const mainEl=document.getElementById('main');
let wb=null, KEY='', view=0, listScroll=0, permCache=null, permKey='', reshuffleArmed=false;

function hash(){
  let h=2166136261>>>0; const n=D.length;
  const add=s=>{for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}};
  add(String(n));
  const step=Math.max(1,Math.floor(n/300));
  for(let i=0;i<n;i+=step)add(D[i][0]+'|'+D[i][1]);
  add(D[n-1][0]);
  return h.toString(36);
}
function newSeed(){return (Math.random()*4294967296)>>>0}
function load(){
  KEY='krw_wb_'+hash();
  let o=null; try{o=JSON.parse(store.getItem(KEY)||'null')}catch(e){}
  if(!o||typeof o!=='object')o={};
  wb={mode:o.mode==='rnd'?'rnd':'seq', seed:Number.isFinite(o.seed)?o.seed:newSeed(), done:{seq:{},rnd:{}}};
  if(o.done)for(const m of ['seq','rnd'])if(o.done[m]&&typeof o.done[m]==='object')wb.done[m]=o.done[m];
}
function save(){try{store.setItem(KEY,JSON.stringify(wb))}catch(e){}}

// 시드 기반 섞기 — 순서를 저장하지 않고 시드만 저장해도 같은 순서가 다시 만들어진다
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function perm(){
  const k=wb.seed+'_'+D.length;
  if(permCache&&permKey===k)return permCache;
  const n=D.length,a=new Uint32Array(n);
  for(let i=0;i<n;i++)a[i]=i;
  const r=rng(wb.seed);
  for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
  permCache=a;permKey=k;return a;
}
const totalDays=()=>Math.ceil(D.length/SIZE);
function setIdx(day){
  const s=(day-1)*SIZE,e=Math.min(s+SIZE,D.length),out=[];
  if(wb.mode==='seq'){for(let i=s;i<e;i++)out.push(i)}
  else{const p=perm();for(let i=s;i<e;i++)out.push(p[i])}
  return out;
}
const head=i=>D[i][0].split('(')[0];
function today(){const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?`${m[1]}.${+m[2]}.${+m[3]}`:''}
const doneMap=()=>wb.done[wb.mode];
function firstUndone(){const m=doneMap(),n=totalDays();for(let d=1;d<=n;d++)if(!m[d])return d;return 0}
function subOf(d){
  const s=(d-1)*SIZE,e=Math.min(s+SIZE,D.length);
  if(wb.mode==='seq')return `${s+1}–${e}번째 · ${esc(head(s))} ~ ${esc(head(e-1))}`;
  return `임의 ${e-s}개`;
}
function toggleDone(d){const m=doneMap(); if(m[d])delete m[d]; else m[d]=today(); save()}

// ---------- 목록 ----------
function renderOverview(){
  const n=totalDays(),m=doneMap(),nx=firstUndone();
  let cnt=0,last='';
  for(let d=1;d<=n;d++)if(m[d]){cnt++;if(m[d]>last)last=m[d]}
  let rows='';
  for(let d=1;d<=n;d++){
    rows+=`<div class="wbRow${m[d]?' done':''}${d===nx?' next':''}" data-d="${d}">
      <button class="wbChk" data-chk="${d}" aria-label="Day ${d} 학습 완료 체크">${CHECK}</button>
      <div class="wbInfo"><div class="wbT">Day ${d}</div><div class="wbS">${subOf(d)}</div></div>
      <div class="wbDate">${m[d]?fmt(m[d]):''}</div><span class="wbGo">›</span></div>`;
  }
  body.innerHTML=`
    <div class="seg" id="wbMode">
      <button data-m="seq"${wb.mode==='seq'?' class="on"':''}>차례대로</button>
      <button data-m="rnd"${wb.mode==='rnd'?' class="on"':''}>임의대로</button>
    </div>
    <div class="wbBar"><i style="width:${n?(cnt/n*100):0}%"></i></div>
    <div class="wbSum"><span>완료 <b>${cnt.toLocaleString()}</b> / ${n.toLocaleString()}일치 · 단어 ${D.length.toLocaleString()}개</span>
      <span>${last?'최근 '+fmt(last):''}</span></div>
    ${nx?`<button class="bigbtn" id="wbNext">Day ${nx} 학습하기</button>`:'<div class="empty" style="padding:22px 0">모든 단어집을 완료했습니다 🎉</div>'}
    <div class="wbTools"><span class="note" style="margin:8px 0">${wb.mode==='seq'
      ? '사전의 표제어 순서대로 200개씩 나눕니다.'
      : '사전 표제어 전체를 무작위로 섞어 200개씩 나눕니다. 순서는 저장되어 유지됩니다.'}</span>
      ${wb.mode==='rnd'?'<button class="more" id="wbShuffle">다시 섞기</button>':''}</div>
    <div id="wbRows">${rows}</div>`;
}

// ---------- 하루치 단어장 ----------
let curIdx=[],shown=0;
function renderDetail(d){
  const n=totalDays(),m=doneMap(),done=!!m[d];
  curIdx=setIdx(d);shown=0;
  body.innerHTML=`
    <button class="wbBack" id="wbBack">‹ 목록</button>
    <div class="wbHead">
      <div class="wbHeadTop"><h2>Day ${d}</h2><span class="tag">${wb.mode==='seq'?'차례대로':'임의대로'}</span></div>
      <div class="wbS">${subOf(d)} · ${curIdx.length}단어</div>
      <button class="wbDetChk${done?' done':''}" id="wbDetChk"><span class="wbChk">${CHECK}</span>${done?'학습 완료':'학습 완료로 체크하기'}</button>
      ${done?`<div class="wbDateRow">완료한 날 <input type="date" id="wbDate" value="${m[d]}"></div>`:''}
    </div>
    <div id="wbList"></div>
    <button class="more hidden" id="wbMore">더 보기</button>
    <div class="wbNav"><button id="wbPrev"${d<=1?' disabled':''}>‹ Day ${d-1}</button>
      <button id="wbNextDay"${d>=n?' disabled':''}>Day ${d+1} ›</button></div>`;
  renderMore();
  mainEl.scrollTop=0;
}
function renderMore(){
  const list=document.getElementById('wbList'),end=Math.min(shown+CHUNK,curIdx.length);
  const frag=document.createDocumentFragment();
  for(let k=shown;k<end;k++){
    const e=D[curIdx[k]],node=el(entryHTML(e,3));
    const btn=node.querySelector('[data-all]');
    if(btn)btn.onclick=()=>{node.outerHTML=entryHTML(e)};
    frag.append(node);
  }
  list.append(frag);shown=end;
  const mb=document.getElementById('wbMore');
  mb.textContent=`더 보기 (${shown} / ${curIdx.length})`;
  mb.classList.toggle('hidden',shown>=curIdx.length);
}

function render(){ view?renderDetail(view):renderOverview() }
function rerenderKeepScroll(){const y=mainEl.scrollTop;render();mainEl.scrollTop=y}
function openDay(d){listScroll=mainEl.scrollTop;view=d;renderDetail(d)}
function backToList(){view=0;renderOverview();mainEl.scrollTop=listScroll}

body.addEventListener('click',ev=>{
  const t=ev.target;
  let b;
  if((b=t.closest('#wbMode button'))){
    if(wb.mode!==b.dataset.m){wb.mode=b.dataset.m;save();listScroll=0;renderOverview()}
    return;
  }
  if((b=t.closest('.wbChk[data-chk]'))){
    ev.stopPropagation();toggleDone(+b.dataset.chk);rerenderKeepScroll();return;
  }
  if((b=t.closest('.wbRow'))){openDay(+b.dataset.d);return}
  if(t.closest('#wbNext')){openDay(firstUndone());return}
  if((b=t.closest('#wbShuffle'))){
    if(!reshuffleArmed){reshuffleArmed=true;b.textContent='완료 기록도 지워집니다. 다시 누르면 섞기';
      setTimeout(()=>{reshuffleArmed=false;const x=document.getElementById('wbShuffle');if(x)x.textContent='다시 섞기'},3500);return}
    reshuffleArmed=false;wb.seed=newSeed();wb.done.rnd={};permCache=null;save();renderOverview();return;
  }
  if(t.closest('#wbBack')){backToList();return}
  if(t.closest('#wbDetChk')){toggleDone(view);renderDetailHeadOnly();return}
  if(t.closest('#wbMore')){renderMore();return}
  if(t.closest('#wbPrev')){view=Math.max(1,view-1);renderDetail(view);return}
  if(t.closest('#wbNextDay')){view=Math.min(totalDays(),view+1);renderDetail(view);return}
});
body.addEventListener('change',ev=>{
  if(ev.target.id==='wbDate'&&/^\d{4}-\d{2}-\d{2}$/.test(ev.target.value)){
    doneMap()[view]=ev.target.value;save();
  }
});
// 체크 토글 때 단어 목록 위치를 잃지 않도록 머리 부분만 갈아 끼운다
function renderDetailHeadOnly(){
  const m=doneMap(),done=!!m[view];
  const btn=document.getElementById('wbDetChk');
  btn.classList.toggle('done',done);
  btn.lastChild.textContent=done?'학습 완료':'학습 완료로 체크하기';
  const old=document.querySelector('.wbDateRow');
  if(old)old.remove();
  if(done)btn.insertAdjacentHTML('afterend',`<div class="wbDateRow">완료한 날 <input type="date" id="wbDate" value="${m[view]}"></div>`);
}

// ---------- 탭 연결 ----------
tabs.words='tab-words';
document.getElementById('nav-words').onclick=()=>showTab('words');
const origShowTab=showTab;
showTab=function(k,save_){
  if(k==='words'&&D.length&&!wb){ load(); render(); }
  return origShowTab(k,save_);
};
})();
</script>
<script>
// 카드 탭에서 방향키 ↑ : 카드 앞면/뒷면 전환 (카드를 누르는 것과 같음)
document.addEventListener('keydown',function(e){
  if(e.key!=='ArrowUp'||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  var a=document.activeElement,tg=a&&a.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||(a&&a.isContentEditable))return;
  var sec=document.getElementById('tab-card'),fl=document.getElementById('flash');
  if(!sec||!fl||sec.classList.contains('hidden'))return;
  e.preventDefault();fl.click();
});
</script>
</body>
</html>
