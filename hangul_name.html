.0079.","물은 수소와 산소로 이루어져 있다."]],1,[]],["구역(區域)","명사",0,"구분할 구, 지경 역",[["갈라놓은 지역.","출입 금지 구역."]],1,[]],["상록(常綠)","명사",0,"떳떳할 상, 푸를 록",[["나뭇잎이 사철 내내 푸름.","겨우내 눈보라를 맞으며 파랗게 질려 있던 상록의 나무들이 싱그러운 가지를 기지개 켜듯 한껏 펼치게 되었고….≪이동하, 우울한 귀향≫"]],1,[]],["근육(筋肉)","명사",0,"힘줄 근, 고기 육",[["힘줄과 살을 통틀어 이르는 말. 동물의 운동을 맡은 기관으로, 단백질·지방·탄수화물·무기 염류를 포함하고 있는데, 수분이 70%를 차지한다. 기능적으로 보아 수의근인 골격근과 불수의근인 내장근이 있으며, 구조적으로 보아 가로무늬근과 민무늬근이 있다.","근육이 생기다."]],1,[]],["작가(作家)","명사",0,"지을 작, 집 가",[["문학 작품, 사진, 그림, 조각 따위의 예술품을 창작하는 사람.","작가 지망생."]],1,[]],["가사(家事)","명사",0,"집 가, 일 사",[["살림살이에 관한 일.","가사를 돌보다."]],1,[]],["탈(頉)","명사",0,"탈날 탈",[["전혀 예상하지 못했던 사고.","탈이 생기다.","مصيبة، حادث مفاجئ"],["뜻밖에 일어난 걱정할 만한 사고.","별 탈 없이 여행을 마치게 되어 다행이다."]],1,[]],["활","명사",0,"",[["나무나 쇠 등을 휘어서 반달 모양으로 만든 뒤 양끝에 줄을 걸고 화살을 쏘는 무기.","활과 화살.","قَوْس"],["화살을 메겨서 쏘는 기구. 또는 그 몸체. 댓개비나 단단한 나무나 쇠, 뼈 따위를 휘어서 반달 모양의 몸체를 만들고, 두 끝에 시위를 건 다음 화살을 줄에 메워 함께 당겼다 놓으면 줄의 탄력으로 화살이 튀어 나간다.","활을 쏘다."]],1,[]],["경제(經濟)","명사",0,"지날 경, 건널 제",[["생산이나 소비 등과 관련된 사람들의 활동. 또는 한 사회나 국가에서 돈, 자원, 산업, 생산, 소비, 무역 등과 관련된 모든 활동.","가정 경제.","اِقْتِصَاد"],["인간의 생활에 필요한 재화나 용역을 생산·분배·소비하는 모든 활동. 또는 그것을 통하여 이루어지는 사회적 관계.","경제가 발전하다."]],1,[]],["애벌레","명사",0,"",[["알에서 나온 후 아직 다 자라지 아니한 벌레.",""]],1,[]],["상대(相對)","명사",0,"서로 상, 대할 대",[["서로 마주 대함. 또는 그런 대상.","저런 애들하고는 상대도 하지 마라."]],1,[]],["허리","명사",0,"",[["사람이나 동물의 신체에서 갈비뼈 아래에서 엉덩이뼈까지의 부분.","개미 허리.","خصر"],["사람이나 동물의 갈빗대 아래에서부터 엉덩이까지의 잘록한 부분.","날씬한 허리."]],1,[]],["짐","명사",0,"",[["다른 곳으로 옮기기 위해 꾸려 놓은 물건.","짐을 나르다.","حَمْلٌ"],["다른 곳으로 옮기기 위하여 챙기거나 꾸려 놓은 물건.","짐을 꾸리다."]],1,[]],["상품(上品)","명사",0,"윗 상, 물건 품",[["질이 좋은 물품.","소반 중에는 은행나무로 만든 행자반을 상품으로 친다."]],1,[]],["은어(隱語)","명사",0,"숨을 은, 말씀 어",[["어떤 계층이나 부류의 사람들이 다른 사람들이 알아듣지 못하도록 자기네 구성원들끼리만 빈번하게 사용하는 말. 상인·학생·군인·노름꾼·부랑배 따위의 각종 집단에 따라 다른데, 의태어·의성어·전도어(顚倒語)·생략어·수식어 따위로 그 발생을 나눌 수 있다.","요즈음 청소년들의 은어는 나이 든 세대에서는 이해하기 어려운 경우가 많다."]],1,[]],["유리(遊離)","명사",0,"놀 유, 떠날 리",[["따로 떨어짐.","현실과의 유리."]],1,[]],["일반(一般)","명사",0,"한 일, 가지 반",[["마찬가지의 상태.","지수나 유민이나 예쁘기는 일반이지만 지수가 마음씨는 더 곱다.",""],["한모양이나 마찬가지의 상태.","사람 마음은 다 일반이다."]],1,[]],["고구려(高句麗)","명사",0,"높을 고, 글귀 구, 고울 려",[["우리나라 삼국 시대의 삼국 가운데 하나로, 기원전 37년에 동명왕 주몽이 졸본에 도읍하여 세운 나라. 한반도의 북부를 중심으로 세력을 펼쳤으며, 광개토 대왕 때에는 한반도 남부에서 요동 지방까지 영역을 넓혔다. 668년에 신라와 중국 당나라의 연합군에게 패하여 멸망하였다.",""]],1,[]],["새끼","명사",0,"",[["낳은 지 얼마 안 되는 어린 짐승.","토끼 새끼."],["짚으로 꼬아 줄처럼 만든 것.","새끼 한 타래."]],1,[]],["원산지(原産地)","명사",0,"언덕 원, 낳을 산, 땅 지",[["어떤 물건이 생산된 곳.","원산지 가격.","مكان منشأ البضائع"],["물건의 생산지.","수입 식품에는 원산지를 표시해야 한다."]],1,[]],["귀","명사",0,"",[["사람이나 동물의 머리 양옆에 있어 소리를 듣는 몸의 한 부분.","귀가 먹다.","أُذُن"],["사람이나 동물의 머리 양옆에서 듣는 기능을 하는 감각 기관. 바깥귀, 가운데귀, 속귀의 세 부분으로 나뉜다.","두 손가락으로 귀를 막다."]],1,[]],["로마(Roma)","명사",0,"",[["이탈리아반도의 중서부에 있는 도시. 테베레강 하류에 면한 일곱 개의 언덕을 중심으로 건설되었으며, 중세기부터 로마 교황청이 자리 잡은 곳이다. 유적이 많은 세계적인 관광 도시이며, 시내에는 바티칸 시국이 있다. 이탈리아의 수도이며, 라치오주의 주도(州都)이다. 면적은 1,508㎢.",""]],1,[]],["특성(特性)","명사",0,"특별할 특, 성품 성",[["일정한 사물에만 있는 특수한 성질.","특성을 살리다."]],1,[]],["멀리","명사",0,"",[["먼 곳.","저 멀리서 그 사람이 보였다."]],1,[]],["남편(男便)","명사",0,"사내 남, 편할 편",[["혼인하여 여자의 짝이 된 남자.","남편을 얻다."]],1,[]],["마지막","명사",0,"",[["시간상이나 순서상의 맨 끝.","마지막 열차."]],1,[]],["줌","명사",0,"",[["손가락을 모두 모아 쥔 손.","줌을 쥐다.","كف"],["활의 한가운데 손으로 쥐는 부분.",""]],1,[]],["군(軍)","명사",0,"군사 군",[["일정한 지휘 계통과 규율에 따라 조직된 군인들의 집단.","군 생활.","جَيْش ، قُوَّة عَسْكَرِيَّة ، القُوَّات المُسَلَّحَة ، جُنْد ، رِجَال الجَيْش"],["일정한 규율과 질서를 가지고 조직된 군인의 집단.","군에 입대하다."]],1,[]],["자극(刺戟)","명사",0,"찌를 자, 창 극",[["어떠한 작용을 주어 감각이나 마음에 반응을 일으키게 함. 또는 그런 사물.","강렬한 자극.","حفز، حافز"],["어떠한 작용을 주어 감각이나 마음에 반응이 일어나게 함. 또는 그런 작용을 하는 사물.","어떠한 자극도 없는 무료한 일상."]],1,[]],["재물(財物)","명사",0,"재물 재, 물건 물",[["돈이나 그 밖의 값나가는 모든 물건.","재물을 탐내다."]],1,[]],["대부분(大部分)","명사",0,"클 대, 떼 부, 나눌 분",[["절반이 훨씬 넘어 전체량에 거의 가까운 정도의 수효나 분량.","그는 수입의 대부분을 저축한다."]],1,[]],["마을","명사",0,"",[["주로 시골에서, 여러 집이 모여 사는 곳.","고향 마을."]],1,[]],["노란색(노란色)","명사",0,"빛 색",[["병아리나 개나리꽃의 빛깔과 같이 매우 밝고 선명한 색.","노란색 개나리."]],1,[]],["탄소(炭素)","명사",0,"숯 탄, 본디 소",[["주기율표 제14족에 속하는 비금속 원소의 하나. 유기 화합물의 주요 구성 원소로, 숯·석탄·금강석 따위로 산출된다. 보통 온도에서는 공기나 물의 작용을 받지 않으나 높은 온도에서는 산소와 쉽게 화합한다. 산화물의 환원, 금속 정련 따위에 쓴다. 원자 기호는 C, 원자 번호는 6, 원자량은 12.011.","탄소 배출을 줄이기 위한 노력."]],1,[]],["학자(學者)","명사",0,"배울 학, 놈 자",[["학문에 능통한 사람. 또는 학문을 연구하는 사람.","권위 있는 학자."]],1,[]],["어깨","명사",0,"",[["목의 아래 끝에서 팔의 위 끝에 이르는 몸의 부분.","양 어깨.","كتف"],["사람의 몸에서, 목의 아래 끝에서 팔의 위 끝에 이르는 부분.","어깨가 쑤시다."]],1,[]],["소설가(小說家)","명사",0,"작을 소, 말씀 설, 집 가",[["소설 쓰는 일을 전문적으로 하는 사람.","그는 소설가가 되겠다는 의지를 갖고 신문사에 계속 투고를 하고 있다."]],1,[]],["순서(順序)","명사",0,"순할 순, 차례 서",[["정해진 기준에 따라 앞뒤, 좌우, 위아래 등으로 이루어진 관계.","순서가 바뀌다.","بِتَرْتِيب"],["정하여진 기준에서 말하는 전후, 좌우, 상하 따위의 차례 관계.","순서를 바로잡다."]],1,[]],["동부(東部)","명사",0,"동녘 동, 떼 부",[["어떤 지역의 동쪽 부분.","동부 지방."]],1,[]],["주위(周圍)","명사",0,"두루 주, 에워쌀 위",[["어떤 곳을 둘러싸고 있는 테두리.","볼 주위.","مُحِيط"],["어떤 곳의 바깥 둘레.","말뚝 주위를 맴도는 잠자리."]],1,[]],["문학(文學)","명사",0,"글월 문, 배울 학",[["사상이나 감정을 언어로 표현한 예술. 또는 그런 작품. 시, 소설, 희곡, 수필, 평론 따위가 있다.","문학 동인."]],1,[]],["대개(大槪)","명사",0,"클 대, 대개 개",[["절반이 훨씬 넘어 전체량에 거의 가까운 정도의 수효나 분량.","이 병은 말기에 발견되는 경우가 대개라 예전에는 사망률이 높았다."],["자세하지 않은, 기본적인 부분만을 따 낸 줄거리.",""]],1,[]],["교통(交通)","명사",0,"사귈 교, 통할 통",[["자동차, 기차, 배, 비행기 등의 탈것을 이용하여 사람이나 짐이 오고 가는 일.","도로 교통.","حَرَكَة الْمُرُور"],["자동차·기차·배·비행기 따위를 이용하여 사람이 오고 가거나, 짐을 실어 나르는 일.","교통의 중심지."],["서로 오고 감. 또는 소식이나 정보를 주고받음.","서신의 교통이라도 이루어졌으면 좋겠다."]],1,[]],["마디","명사",0,"",[["갈대나 나무 등의 줄기에서 가지나 잎이 나는, 가운데가 오목하거나 볼록한 부분.","나무 마디.","وَصْلَة"],["대, 갈대, 나무 따위의 줄기에서 가지나 잎이 나는 부분. 잘록하거나 도드라져 있다.","마디 사이가 긴 대나무."]],1,[]],["사업(事業)","명사",0,"일 사, 업 업",[["경제적 이익을 얻기 위해 어떤 조직을 경영하는 일.","문화 사업."],["돈이 아닌 다른 목적을 가지고 조직적으로 하는 사회 활동.","공공 사업."]],0,[]],["이치(理致)","명사",0,"다스릴 이, 이를 치",[["사물의 정당한 조리(條理). 또는 도리에 맞는 취지.","자연의 이치."]],1,[]],["가게","명사",0,"",[["작은 규모로 물건을 파는 집.","담배 가게."]],1,[]],["본디(本디)","명사",0,"근본 본",[["사물이 전하여 내려온 그 처음.","본디부터 타고난 성품."]],1,[]],["비행기(飛行機)","명사",0,"날 비, 다닐 행, 틀 기",[["동력으로 프로펠러를 돌리거나 연소 가스를 내뿜는 힘에 의하여 생기는 양력(揚力)을 이용하여 공중으로 떠서 날아다니는 항공기. 1903년에 미국의 라이트 형제가 육상 비행을 한 것이 동력 비행의 맨 처음이며, 추진의 종류에 따라 프로펠러식과 분사식으로 나눈다.","하늘을 날아오르는 비행기."]],1,[]],["온몸","명사",0,"",[["몸 전체.","온몸을 동여매다."]],1,[]],["꼭","명사",0,"",[["북청 사자놀음에 나오는 양반의 하인. 또는 그 하인이 쓰는 분홍 바탕에 수염이 달린 탈.",""]],1,[]],["신경(神經)","명사",0,"귀신 신, 지날 경",[["동물이나 사람의 몸에서 외부의 자극을 감지하고 이에 대처하는 가는 실 모양의 기관.","신경 마비.","عصب"],["신경 세포의 돌기가 모여 결합 조직으로 된 막에 싸여 끈처럼 된 구조. 뇌와 척수 그리고 우리 몸 각 부분 사이에 필요한 정보를 서로 전달하는 구실을 한다.","신경을 자극하다."]],1,[]],["국민(國民)","명사",0,"나라 국, 백성 민",[["국가를 구성하는 사람. 또는 그 나라의 국적을 가진 사람.","나라의 경제 발전을 위하여 국민 각자가 열심히 일해야 할 때이다."]],1,[]],["층(層)","명사",0,"층 층",[["서로 다른 물질이나 물체가 옆으로 넓게 퍼져 쌓여 있는 것 중의 하나. 또는 그렇게 쌓여 있는 상태.","기름 층.","طبقة أرضية"],["물체가 거듭 포개져 생긴 켜.","서가에 쌓인 먼지의 층을 뚫고 흘러간 시간들의 저쪽….≪김인배, 방울뱀≫"]],1,[]],["이","명사",0,"",[["몸의 길이는 1~4mm로 편평한 모양이며, 사람의 몸에 붙어 살면서 피를 빨아 먹는 곤충.","이가 기어 다니다.","قمل الجسم"],["척추동물의 입안에 있으며 무엇을 물거나 음식물을 씹는 역할을 하는 기관.","이가 나다."]],1,[]],["둘레","명사",0,"",[["사물의 테두리나 주변 부분.","운동장 둘레.","مُحِيط"],["사물의 테두리나 바깥 언저리.","접시 둘레를 장식하다."]],1,[]],["비용(費用)","명사",0,"쓸 비, 쓸 용",[["어떤 일을 하는 데 드는 돈.","비용이 들다."]],1,[]],["지구(地區)","명사",0,"땅 지, 구분할 구",[["일정한 기준에 따라 여럿으로 나눈 땅의 한 구역.","남부 지구.","حيّ، مقاطعة"],["일정한 기준에 따라 여럿으로 나눈 땅의 한 구획.","북부 지구."]],1,[]],["노란(虜亂)","명사",0,"사로잡을 노, 어지러울 란",[["호인(胡人)들이 일으킨 난리.","안주 사인(士人) 임지환(林之煥)은 곧 정묘년 노란 때 순절했던 사람의 후손입니다.≪번역 순조실록≫"]],1,[]],["단계(段階)","명사",0,"층계 단, 섬돌 계",[["일의 차례를 따라 나아가는 과정.","마무리 단계."]],1,[]],["오른쪽","명사",0,"",[["북쪽을 향하였을 때의 동쪽과 같은 쪽.","오른쪽 귀."]],1,[]],["정부(政府)","명사",0,"정사 정, 마을 부",[["입법, 사법, 행정의 삼권을 포함하는 통치 기구.","군사 정부.","حكومة"],["입법, 사법, 행정의 삼권을 포함하는 통치 기구를 통틀어 이르는 말.",""]],1,[]],["신하(臣下)","명사",0,"신하 신, 아래 하",[["임금을 섬기어 벼슬하는 사람.","왕의 뜻을 잘 받드는 것이 신하의 도리이다."]],1,[]],["관청(官廳)","명사",0,"벼슬 관, 관청 청",[["국가의 사무를 집행하는 국가 기관. 또는 그런 곳. 사무의 성격에 따라 행정 관청·사법 관청, 관할 구역에 따라 중앙 관청·지방 관청 따위로 나뉜다.","관청 출입구."]],1,[]],["이외(以外)","명사",0,"써 이, 바깥 외",[["일정한 범위나 한도의 밖.","몇 끼를 굶었더니 먹을 것 이외에는 눈에 보이는 것이 없었다."]],1,[]],["앞말","명사",0,"",[["앞에서 한 말.","그 문제는 앞말에서 이미 이야기된 바다."],["바로 앞에 오는 말.","조사는 앞말에 붙여 쓴다."]],1,[]],["명나라(明나라)","명사",0,"밝을 명",[["1368년에 주원장이 강남(江南)에서 일어나 원(元)을 북쪽으로 몰아내고 세운 중국의 통일 왕조. 영락제 때 난징(南京)에서 베이징으로 도읍을 옮기고 몽고와 남해에 원정하여 전성기를 이루었으나, 뒤에 북로남왜에 시달리고 환관의 전횡과 당쟁, 농민의 반란이 끊이지 않아 1644년에 이자성(李自成)에게 망하였다.",""]],1,[]],["표(標)","명사",0,"표할 표",[["준거가 될 만한 흔적.","확실한 표.","عَلَامَة"],["같은 종류의 다른 사물과 분간할 수 있도록 하는 그 사물만의 두드러진 특징.","표를 내다."]],1,[]],["왼쪽","명사",0,"",[["북쪽을 향하였을 때의 서쪽과 같은 쪽.","왼쪽 가슴."]],1,[]],["수준(水準)","명사",0,"물 수, 준할 준",[["사물의 가치나 질 등을 판단하는 기준이 되는 정도.","교육 수준.","مُسْتَوًى"],["사물의 가치나 질 따위의 기준이 되는 일정한 표준이나 정도.","수준 이하."]],1,[]],["토지(土地)","명사",0,"흙 토, 땅 지",[["경지나 주거지 따위의 사람의 생활과 활동에 이용하는 땅.","토지가 비옥하다."]],1,[]],["곡(曲)","명사",0,"굽을 곡",[["작곡된 음악의 작품.","사랑을 주제로 한 곡.","قِطْعَة مُوسِيقِيَّة"],["음악적 통일을 이루는 음의 연속.","곡이 어려워 따라 부르기가 힘들다."]],1,[]],["주(株)","명사",0,"그루 주",[["주식회사의 자본을 구성하는 단위.",""]],1,[]],["분자(分子)","명사",0,"나눌 분, 아들 자",[["어떤 물질의 화학적 형태와 성질을 띠고 있는 가장 작은 알갱이.","물 분자.","جُزَيْء"],["물질에서 화학적 형태와 성질을 잃지 않고 분리될 수 있는 최소의 입자. 희유기체와 같이 1원자의 분자도 있지만, 보통은 두 개 이상의 원자가 공유 결합에 의하여 결합되어 이루어진, 전기적으로 중성인 입자이다. 원자 수가 수천, 수만인 것을 고분자라고 한다.","원자와 분자."],["분수 또는 분수식에서, 가로줄 위에 있는 수나 식.",""]],1,[]],["기체(氣體)","명사",0,"기운 기, 몸 체",[["물질이 나타내는 상태의 하나. 공기, 수소, 산소 따위와 같이 분자의 간격이 멀고 응집력이 없어 각 분자가 자유로이 유동하므로, 일정한 모양과 부피를 갖지 않고 용기를 채우려는 성질이 있다. 액체나 고체에 비하여 밀도가 훨씬 작고, 압력의 증감으로 부피가 쉽게 변하며, 압축이나 열팽창이 쉽다.",""],["몸과 마음의 형편.","승규는 할머니께 기체가 안녕하신지 여쭸다.",""]],1,[]],["양식(樣式)","명사",0,"모양 양, 법 식",[["어떤 일을 하는 데에 필요한, 일정한 형식이나 방식.","보고서 양식.","أُسْلُوب"],["일정한 모양이나 형식.","서류를 양식에 맞게 꾸며라."]],1,[]],["규모(規模)","명사",0,"법 규, 본뜰 모",[["물건이나 현상의 크기나 범위.","건물 규모.","حَجْم، نِطَاق"],["본보기가 될 만한 틀이나 제도.","북부 동해랑에 있는 그의 집 사랑채는 윗사랑, 아랫사랑, 행랑채의 규모를 고루 갖춘 것이었으나 야트막하고 지붕은 이엉을 인 초가였다.≪박완서, 미망≫"],["사물이나 현상의 크기나 범위.","규모가 크다."]],1,[]],["국제(國際)","명사",0,"나라 국, 즈음 제",[["나라 사이에 관계됨.","국제 경쟁."]],1,[]],["파(派)","명사",0,"갈래 파",[["이념, 주의, 사상, 행동 등의 차이에 따라 갈라진 사람들의 집단.","파가 갈리다.","جماعة، مجموعة، حزب، زمرة، فئة منشقّة"],["잔물결과 큰 물결.",""],["바람 따위로 일어나는 수면의 고저 운동.",""]],1,[]],["사진(寫眞)","명사",0,"베낄 사, 참 진",[["물체의 형상을 감광막 위에 나타나도록 찍어 오랫동안 보존할 수 있게 만든 영상. 물체로부터 오는 광선을 사진기 렌즈로 모아 필름, 건판 따위에 결상(結像)을 시킨 뒤에, 이것을 현상액으로 처리하여 음화(陰畫)를 만들고 다시 인화지로 양화(陽畫)를 만든다.","졸업 사진."],["물체를 있는 모양 그대로 그려 냄. 또는 그렇게 그려 낸 형상.",""]],1,[]],["쌍(雙)","명사",0,"두 쌍",[["둘이 짝을 이룬 것.","쌍을 이루다.","زَوْج"],["둘씩 짝을 이룬 것.","이번 모임에는 남녀가 쌍을 지어 나오라는 연락이 왔다."]],1,[]],["철학(哲學)","명사",0,"밝을 철, 배울 학",[["세계와 인간에 대한 근본 원리를 탐구하는 학문.","동양 철학.","فلسفة"],["인간과 세계에 대한 근본 원리와 삶의 본질 따위를 연구하는 학문. 흔히 인식, 존재, 가치의 세 기준에 따라 하위 분야를 나눌 수 있다.","계몽주의 철학."]],1,[]],["별","명사",0,"",[["밤하늘에 반짝이는 달이 아닌 천체.","반짝이는 별.","كَوْكَب"],["빛을 관측할 수 있는 천체 가운데 성운처럼 퍼지는 모양을 가진 천체를 제외한 모든 천체. 천문학적으로는 태양이 포함되나 일상적으로는 포함되지 않는다. 밝기는 등급으로 표시한다.","별이 반짝이다."]],1,[]],["도구(道具)","명사",0,"길 도, 갖출 구",[["어떤 일을 할 때 쓰이는 기구. 또는 연장.","실험 도구.","آلَة، أَدَاة"],["일을 할 때 쓰는 연장을 통틀어 이르는 말.","청소 도구."]],1,[]],["논밭","명사",0,"",[["논과 밭을 아울러 이르는 말.","논밭 문서."]],1,[]],["어린잎","명사",0,"",[["새로 나온 연한 잎.",""]],1,[]],["무게","명사",0,"",[["물건의 무거운 정도.","무게가 나가다."]],1,[]],["정(情)","명사",0,"뜻 정",[["사랑하는 마음이나 친근한 마음.",""]],1,[]],["형편(形便)","명사",0,"모양 형, 편할 편",[["일이 되어 가는 상황.","돌아가는 형편.","حَالَة"],["일이 되어 가는 상태나 경로 또는 결과.","그는 세상 돌아가는 형편을 잘 안다."]],1,[]],["남아(男兒)","명사",0,"사내 남, 아이 아",[["남자인 아이.","남아를 선호하다."]],1,[]],["손님","명사",0,"",[["(높임말로) 다른 곳에서 찾아온 사람.","초대 손님.","زَائِر"],["‘손02「1」’의 높임말.","초대 손님."],["‘손02「2」’의 높임말.","손님을 받다."]],1,[]],["기원전(紀元前)","명사",0,"벼리 기, 으뜸 원, 앞 전",[["기원 원년 이전. 주로 예수가 태어난 해를 원년으로 하는 서력기원을 기준으로 하여 이른다.","진(秦)나라는 기원전 3세기 말에 전국 시대의 혼란을 수습하고 최초로 중국을 하나의 나라로 통일하였다."]],1,[]],["인물(人物)","명사",0,"사람 인, 물건 물",[["사람 그 자체.","인물 묘사.","شَخْص"],["생김새나 됨됨이로 본 사람.","인물 묘사."]],1,[]],["부모(父母)","명사",0,"아비 부, 어미 모",[["아버지와 어머니를 아울러 이르는 말.","부모를 공경하다."]],1,[]],["위쪽","명사",0,"",[["위가 되는 쪽.","고개를 위쪽으로 쳐들다."]],1,[]],["차이(差異)","명사",0,"다를 차, 다를 이",[["서로 같지 아니하고 다름. 또는 그런 정도나 상태.","성격 차이."]],1,[]],["감","명사",0,"",[["둥글거나 둥글넓적하며 익기 전에는 떫지만 익으면 단맛이 나는 주황색 과일.","감이 떨어지다.","بِيرْسِيمُون"],["옷이나 이불 따위를 만드는 바탕이 되는 피륙. 주로 옷감의 뜻으로 쓴다.","구김이 잘 가는 감."]],1,[]],["예술(藝術)","명사",0,"재주 예, 재주 술",[["학문과 기술.","예술 가치.","فنّ"],["특별한 재료, 기교, 양식 따위로 감상의 대상이 되는 아름다움을 표현하려는 인간의 활동 및 그 작품. 공간 예술, 시간 예술, 종합 예술 따위로 나눌 수 있다.","예술 창작 활동."]],1,[]],["사정(事情)","명사",0,"일 사, 뜻 정",[["일의 형편이나 이유.","피치 못한 사정.","وَضْع"],["일의 형편이나 까닭.","피치 못할 사정."]],1,[]],["누런색(누런色)","명사",0,"빛 색",[["익은 벼의 빛깔과 같이 다소 어둡고 탁한 색.","출판사 직원은 누런색 봉투에서 두꺼운 책을 꺼내었다."]],1,[]],["비늘","명사",0,"",[["물고기나 뱀 따위의 표피를 덮고 있는 얇고 단단하게 생긴 작은 조각.","어물전에 생선들이 비늘을 번득이며 진열되어 있었다."]],1,[]],["농사(農事)","명사",0,"농사 농, 일 사",[["곡식이나 채소 등을 심고 기르고 거두는 일.","고추 농사.","زِرَاعَة"],["곡류, 과채류 따위의 씨나 모종을 심어 기르고 거두는 따위의 일.","배추 농사."]],1,[]],["그물","명사",0,"",[["물고기나 짐승을 잡기 위해 끈이나 실, 철사 등으로 짠 도구.","그물을 걷다.","شَبَكَةٌ"],["노끈이나 실, 쇠줄 따위로 여러 코의 구멍이 나게 얽은 물건. 날짐승이나 물고기 따위를 잡는 데 쓴다.","그물을 치다."]],1,[]],["열대(熱帶)","명사",0,"더울 열, 띠 대",[["적도를 중심으로 남북 회귀선 사이에 있는 지대. 연평균 기온이 20℃ 이상 또는 최한월 평균 기온이 18℃ 이상인 지역으로, 연중 기온이 높고 강우량이 많은 것이 특징이다.",""]],1,[]],["사랑","명사",0,"",[["상대에게 성적으로 매력을 느껴 열렬히 좋아하는 마음.","남녀 간의 사랑.","عِشْق"],["어떤 사람이나 존재를 몹시 아끼고 귀중히 여기는 마음. 또는 그런 일.","어머니의 사랑."]],1,[]],["경계(警戒)","명사",0,"깨우칠 경, 경계할 계",[["뜻밖의 사고나 위험이 생기지 않도록 살피고 조심함.","경찰의 경계.","اِحْتِرَاس"],["뜻밖의 사고가 생기지 않도록 조심하여 단속함.","경계를 늦추다."]],1,[]],["막기","명사",0,"",[["상대편의 타격을 직접 막는 일.",""]],1,[]],["밭","명사",0,"",[["물을 담아 두지 않고 곡식이나 채소를 심어 농사를 짓는 땅.","옥수수 밭.","حَقْل"],["물을 대지 아니하거나 필요한 때에만 물을 대어서 야채나 곡류를 심어 농사를 짓는 땅.","밭 한 뙈기."]],1,[]],["체계(體系)","명사",0,"몸 체, 이어맬 계",[["일정한 원리에 따라서 낱낱의 부분이 짜임새 있게 조직되어 통일된 전체.","명령 체계."]],1,[]],["등과(登科)","명사",0,"오를 등, 과목 과",[["과거에 급제하던 일.","삼대조가 미관말직에 있어 본 후로는 집안에서 한 번도 등과의 영예를 갖지 못하였던 향반 김 훈장은….≪박경리, 토지≫"]],1,[]],["본래(本來)","명사",0,"근본 본, 올 래",[["사물이나 사실이 전하여 내려온 그 처음.","본래의 모습."]],1,[]],["형벌(刑罰)","명사",0,"형벌 형, 벌할 벌",[["범죄에 대한 법률의 효과로서 국가 따위가 범죄자에게 제재를 가함. 또는 그 제재.","형벌에 처하다."]],1,[]],["물속","명사",0,"",[["물의 가운데.","이윽고 고기 떼가 물속 깊이 자취를 감추고 나니까 수면은 도로 잔잔해졌다.≪윤흥길, 완장≫"]],1,[]],["철","명사",0,"",[["일 년을 자연 현상에 따라 봄, 여름, 가을, 겨울로 나눈 것의 한 때.","철이 늦다.","فَصْل"],["규칙적으로 되풀이되는 자연 현상에 따라서 일 년을 구분한 것. 일반적으로 온대 지방은 기온의 차이를 기준으로 하여 봄, 여름, 가을, 겨울의 네 계절로 나누고, 열대 지방에서는 강우량을 기준으로 하여 건기와 우기로 나눈다. 천문학적으로는 춘분, 하지, 추분, 동지로 나눈다.","철에 따라 피는 꽃."]],1,[]],["덕(德)","명사",0,"큰 덕",[["남을 이해하고 받아들이는 너그럽고 도덕적인 인격.","덕이 높다.","فَضِيلَة"],["도덕적·윤리적 이상을 실현해 나가는 인격적 능력.","덕이 높다."]],1,[]],["내부(內部)","명사",0,"안 내, 떼 부",[["사물의 안쪽 공간.","건물 내부.","الدَّاخِل"],["안쪽의 부분.","내부 수리."]],1,[]],["벌","명사",0,"",[["옷이나 그릇 등이 두 개 이상 모여 갖추어진 한 덩이.","벌로 갖추다.","مَجْمُوعَة ، طَاقَم"],["옷이나 그릇 따위가 두 개 또는 여러 개 모여 갖추는 덩어리.","옷을 벌로 맞추다."],["벌목의 곤충 가운데 개미류를 제외한 곤충을 통틀어 이르는 말. 몸의 길이는 0.1~2cm이며, 몸은 머리·가슴·배의 세 부분으로 되어 있다. 머리에는 한 쌍의 겹눈과 더듬이, 세 개의 홑눈이 있고 가슴에는 두 쌍의 막성 날개와 세 쌍의 다리가 있으며 배는 많은 환절로 되어 있다. 입은 씹거나 꿀 따위를 빨기에 알맞고 대개는 몸 끝에 산란관의 독침이 있어 적을 쏜다. 곤충 중에서 가장 큰 무리로 전 세계에 12만 종 이상이 분포하는데 꿀벌과, 송곳벌과, 호박벌과, 맵시벌과, 말벌과 따위가 있다.","벌에 쏘인 자리가 부어오른다."],["넓고 평평하게 생긴 땅.","황량한 벌."]],1,[]],["연극(演劇)","명사",0,"펼 연, 심할 극",[["배우가 대본에 따라 사건이나 인물을 말과 동작으로 무대에서 연기해 보여주는 예술.","어린이 연극.","مَسْرَحِيَّةٌ"],["배우가 각본에 따라 어떤 사건이나 인물을 말과 동작으로 관객에게 보여 주는 무대 예술.","연극 단체."]],1,[]],["지식(知識)","명사",0,"알 지, 알 식",[["어떤 대상에 대하여 배우거나 실천을 통하여 알게 된 명확한 인식이나 이해.","지식을 쌓다."]],1,[]],["고리","명사",0,"",[["긴 쇠붙이나 줄, 끈을 둥글게 이어서 만든 물건.","방문 고리.","عُقْدَة"],["긴 쇠붙이나 줄, 끈 따위를 구부리고 양 끝을 맞붙여 둥글거나 모나게 만든 물건.","방문 고리."]],1,[]],["연안(沿岸)","명사",0,"물따라갈 연, 언덕 안",[["바다, 강, 호수 등과 닿아 있는 땅.","연안 도시.","ساحل"],["강이나 호수, 바다를 따라 잇닿아 있는 육지.","낙동강 중류 연안."]],1,[]],["손가락","명사",0,"",[["손끝의 다섯 개로 갈라진 부분. 또는 그것 하나하나.","다섯 손가락."]],1,[]],["외부(外部)","명사",0,"바깥 외, 떼 부",[["밖이 되는 부분.","외부 감각.","خَارِج"],["바깥 부분.","외부 공사."]],1,[]],["뒤쪽","명사",0,"",[["향하고 있는 방향과 반대되는 쪽.","뒤쪽 언덕."]],1,[]],["풍속(風俗)","명사",0,"바람 풍, 풍속 속",[["사회에 속한 사람들에게 옛날부터 전해 오는 생활 습관.","세시 풍속.","عادات، أخلاق عامة"],["옛날부터 그 사회에 전해 오는 생활 전반에 걸친 습관 따위를 이르는 말.","풍속이 다르다."]],1,[]],["대전(大殿)","명사",0,"클 대, 전각 전",[["임금이 거처하는 궁전.",""]],1,[]],["한글","명사",0,"",[["우리나라 고유의 글자. 음소 문자인데 그보다 더 발전된 자질 문자로 분류되기도 한다. 세종 대왕이 우리말을 표기하기 위하여 창제한 훈민정음을 20세기 이후 달리 이르는 명칭이다. 1446년 반포될 당시에는 28자모(字母)였지만, 현행 한글 맞춤법에서는 24자모만 쓴다.","한글 강습."]],1,[]],["컴퓨터(computer)","명사",0,"",[["전자 회로를 이용한 고속의 자동 계산기. 숫자 계산, 자동 제어, 데이터 처리, 사무 관리, 언어나 영상 정보 처리 따위에 광범위하게 이용된다.","컴퓨터를 켜다."]],1,[]],["색깔(色깔)","명사",0,"빛 색",[["빛을 받아 물체가 나타내는 빛이나 색.","고운 색깔.","لَوْن"],["물체가 빛을 받을 때 빛의 파장에 따라 그 거죽에 나타나는 특유한 빛.","선명한 색깔."]],1,[]],["담배","명사",0,"",[["잎을 말려서 피우는, 담배를 만드는 식물.","담배 농사.","تَبْغ، نَبَاتُ السَّجَائِر"],["가짓과의 한해살이 식물. 높이는 1.5~2미터이며, 40여 개의 넓고 길쭉한 잎은 어긋나고 줄기에 촘촘히 난다. 여름에 깔때기 모양의 연분홍 꽃이 줄기 끝에 원추(圓錐) 화서로 피고, 열매는 달걀 모양의 삭과(蒴果)로 10월에 맺는다. 공예 작물로 재배하는데 잎을 건조시켜 담배를 만든다. 남아메리카가 원산지이다.","담배 농사."],["담뱃잎을 말려서 가공한 기호품. 살담배, 잎담배, 궐련 따위가 있다.","담배 한 대."]],1,[]],["압력(壓力)","명사",0,"누를 압, 힘 력",[["누르는 힘.","허용 압력.","ضغط"],["두 물체가 접촉면을 경계로 하여 서로 그 면에 수직으로 누르는 단위 면적에서의 힘의 단위. 그 크기의 단위로는 dyn/㎠ 외에 공학에서는 kgW/㎠를 사용하고, 기상학에서는 밀리바, 헥토파스칼 따위를 사용한다.","고층 건물의 압력에도 견딜 수 있는 벽돌."]],1,[]],["으뜸","명사",0,"",[["여럿 가운데 가장 뛰어나거나 순서에서 첫째가 되는 것.","천하의 으뜸.","أفضل"],["많은 것 가운데 가장 뛰어난 것. 또는 첫째가는 것.","으뜸이 되다."]],1,[]],["잎자루","명사",0,"",[["잎몸을 줄기나 가지에 붙게 하는 꼭지 부분. 잎을 햇빛의 방향으로 향하게 한다.",""]],1,[]],["계통(系統)","명사",0,"이어맬 계, 거느릴 통",[["일정한 체계에 따라 서로 다른 여러 부분들이 관련되어 조직을 이룬 것.","생식기 계통.","جِهَاز"],["일정한 체계에 따라 서로 관련되어 있는 부분들의 통일적 조직.","소화 기관 계통."]],1,[]],["효과(效果)","명사",0,"본받을 효, 실과 과",[["어떠한 것을 하여 얻어지는 좋은 결과.","예방 효과.","فَعَالِيَّة"],["어떤 목적을 지닌 행위에 의하여 드러나는 보람이나 좋은 결과.","일석이조의 효과를 거두다."]],1,[]],["기록(記錄)","명사",0,"기록할 기, 기록할 록",[["주로 후일에 남길 목적으로 어떤 사실이나 생각을 적거나 영상으로 남김. 또는 그런 글이나 영상.","생활 기록.","تَسْجِيل، سِجِلّ"],["주로 후일에 남길 목적으로 어떤 사실을 적음. 또는 그런 글.","신상 기록 카드."]],1,[]],["윗사람","명사",0,"",[["가족 관계에서 자신보다 나이나 위치가 많거나 위인 사람.","윗사람이 되다.","شخص كبير"],["나이나 항렬 따위가 자기보다 위이거나 높은 사람.","윗사람을 섬기다."],["자기보다 지위나 신분이 높은 사람.","윗사람 노릇 하기도 힘들다."]],1,[]],["껍데기","명사",0,"",[["달걀이나 조개 등의 겉을 싸고 있는 단단한 물질.","굴 껍데기.","قِشْرَةٌ، غِلَافٌ"],["달걀이나 조개 따위의 겉을 싸고 있는 단단한 물질.","달걀 껍데기를 깨뜨리다."]],1,[]],["거짓","명사",0,"",[["사실과 어긋난 것. 또는 사실이 아닌 것을 사실처럼 꾸민 것.","거짓 고백."]],1,[]],["기본(基本)","명사",0,"터 기, 근본 본",[["무엇을 하기 전에 가장 먼저 해야 하는 것이나 꼭 있어야 하는 것.","기본 기술."]],0,[]],["모래","명사",0,"",[["자연히 잘게 부스러진 돌 부스러기.","강가에는 희고 깨끗한 모래가 깔려 있다."]],1,[]],["세금(稅金)","명사",0,"세금 세, 쇠 금",[["국가 또는 지방 공공 단체가 필요한 경비로 사용하기 위하여 국민이나 주민으로부터 강제로 거두어들이는 금전. 국세와 지방세가 있다.","세금 계산서."]],1,[]],["어머니","명사",0,"",[["자기를 낳아준 여자. 또는 그 사람을 부르는 말.","우리 어머니.","أمّ، والِدَة"],["자기를 낳아 준 여자를 이르거나 부르는 말.","우리 어머니께서 주무신다."]],1,[]],["실제(實際)","명사",0,"열매 실, 즈음 제",[["사실의 경우나 형편.","실제 모습."]],1,[]],["아래쪽","명사",0,"",[["아래가 되는 쪽.","이 길 아래쪽으로 내려가면 구멍가게가 나옵니다."]],1,[]],["정보(情報)","명사",0,"뜻 정, 갚을 보",[["어떤 사실이나 현상을 관찰하거나 측정하여 모은 자료를 정리한 지식. 또는 그 자료.","관광 정보.","معلومات"],["관찰이나 측정을 통하여 수집한 자료를 실제 문제에 도움이 될 수 있도록 정리한 지식. 또는 그 자료.","관광 정보."]],1,[]],["폭(幅)","명사",0,"폭 폭",[["평면이나 넓은 물체의 가로 길이.","도로의 폭.","عَرْض، اِتِّسَاع"],["평면이나 넓은 물체의 가로로 건너지른 거리.","폭이 좁다."]],1,[]],["호(號)","명사",0,"이름 호",[["본래의 이름 외에, 친근하게 부르기 위해서 지은 이름.","호를 따다.","لَقَب"],["본명이나 자 이외에 쓰는 이름. 허물없이 쓰기 위하여 지은 이름이다.","호를 짓다."]],1,[]],["황제(皇帝)","명사",0,"임금 황, 임금 제",[["왕이나 제후를 거느리고 나라를 다스리는 임금.","황제 폐하.","إِمْبرَاطُور"],["왕이나 제후를 거느리고 나라를 통치하는 임금을 왕이나 제후와 구별하여 이르는 말.","황제 폐하."]],1,[]],["가시","명사",0,"",[["바늘처럼 뾰족하게 돋친 것.","고슴도치 등에는 뾰족한 가시가 돋쳐 있다."]],1,[]],["바늘","명사",0,"",[["옷 등을 꿰매거나 만드는 데 쓰는, 쇠로 된 가늘고 끝이 뾰족한 물건.","날카로운 바늘.","إِبْرَةٌ"],["옷 따위를 짓거나 꿰매는 데 쓰는, 가늘고 끝이 뾰족한 쇠로 된 물건. 한쪽 끝에 있는 작은 구멍에 실을 꿰어서 쓴다.","바늘 한 쌈."]],1,[]],["옛날","명사",0,"",[["아주 오래된 지난 날.","먼 옛날.","الْمَاضِي"],["지난 지 꽤 오래된 시기를 막연히 이르는 말.","아주 먼 옛날 호랑이 담배 피우던 시절."],["이미 지나간 어떤 날.","옛날 버릇."]],1,[]],["바퀴","명사",0,"",[["돌리거나 굴리려고 둥글게 만든 물건.","자동차 바퀴.","عَجَلَة"],["돌리거나 굴리려고 테 모양으로 둥글게 만든 물건.","자동차 바퀴."]],1,[]],["요소(要素)","명사",0,"요긴할 요, 본디 소",[["무엇을 이루는 데 반드시 있어야 할 중요한 성분이나 조건.","구성 요소.","عنصر، عامل"],["사물의 성립이나 효력 발생 따위에 꼭 필요한 성분. 또는 근본 조건.","핵심적 요소."]],1,[]],["농업(農業)","명사",0,"농사 농, 업 업",[["땅을 이용하여 인간 생활에 필요한 식물을 가꾸거나, 유용한 동물을 기르거나 하는 산업. 또는 그런 직업. 특히 농경을 가리키는 경우가 많고, 넓은 뜻으로는 낙농업과 임업 따위도 포함한다.","농업 기술의 혁신."]],1,[]],["바위","명사",0,"",[["아주 큰 돌.","넓적한 바위.","صَخْرَة"],["부피가 매우 큰 돌.","넓적한 바위."]],1,[]],["물결","명사",0,"",[["물이 움직여 그 표면이 올라갔다 내려왔다 하는 모양이나 그 움직임.","물결 무늬.","مَوْجَة"],["물이 움직여 그 표면이 올라갔다 내려왔다 하는 운동. 또는 그 모양.","물결에 휩쓸리다."]],1,[]],["화살","명사",0,"",[["활시위에 메겨서 당겼다가 놓으면 그 반동으로 멀리 날아가도록 만든 물건. 가는 대로 줄기를 삼고, 아래 끝에는 쇠로 만든 촉을 꽂으며 위쪽에는 세 줄로 새의 깃을 붙인다.","화살이 날아가다."]],1,[]],["태양(太陽)","명사",0,"클 태, 볕 양",[["태양계의 중심에 있으며 온도가 매우 높고 스스로 빛을 내는 항성.","밝은 태양.","شمس"],["태양계의 중심이 되는 항성. 지구에서 가장 가까운 거리에 있으며, 자전 주기는 약 25일이며 막대한 에너지를 방출하는 중심핵, 그 바깥쪽에 있는 복사층과 대류층, 그리고 빛을 직접 바깥으로 방출하는 광구·채층·코로나를 포함하는 대기층으로 이루어져 있다.","태양 광선."]],1,[]],["목재(木材)","명사",0,"나무 목, 재목 재",[["건축이나 가구 따위에 쓰는, 나무로 된 재료.","목재 사다리."]],1,[]],["통","명사",0,"",[["속이 꽉 차게 자란 배추나 수박, 호박 등의 몸통.","통이 들다.","تونع"],["바짓가랑이나 소매 따위의 속의 넓이.","바지의 통이 넓다."],["허리나 다리 따위의 굵기나 둘레.","통이 굵은 다리."]],1,[]],["산소(山所)","명사",0,"메 산, 바 소",[["(높이는 말로) 사람의 무덤.","부모님 산소.","مَقْبَرَة"],["‘뫼01’를 높여 이르는 말.","한식에는 조상의 산소를 찾아 성묘를 한다."]],1,[]],["문자(文字)","명사",0,"글월 문, 글자 자",[["언어의 소리나 뜻을 눈으로 볼 수 있도록 적은 기호 체계.","문자 기록.","حَرْفٌ"],["인간의 언어를 적는 데 사용하는 시각적인 기호 체계. 한자 따위의 표의 문자와 로마자, 한글 따위의 표음 문자로 대별된다.","언어와 문자."]],1,[]],["장사","명사",0,"",[["이익을 얻으려고 물건을 사서 팖. 또는 그런 일.","장사 밑천."]],1,[]],["품종(品種)","명사",0,"물건 품, 씨 종",[["물품의 종류.","우리 가게에서 취급하는 물건의 품종이 많이 늘어났다."],["농작물, 가축 따위를 분류하는 최종 단계의 이름. 외부적으로 형질 또는 특성이 같고, 유전 형질의 조성이 같은 개체의 집단이다.","우리나라에서 많이 키우는 돼지 품종은 요크셔이다."]],1,[]],["부대(部隊)","명사",0,"떼 부, 무리 대",[["조직을 이루고 있는 군인 집단. 또는 군인 집단이 머물러 있는 시설.","공군 부대.","وَحْدَة عَسْكَرِيَّة"],["일정한 규모로 편성된 군대 조직을 일반적으로 이르는 말.","보병 부대."]],1,[]],["전류(電流)","명사",0,"번개 전, 흐를 류",[["전하가 연속적으로 이동하는 현상. 도체 내부의 전위가 높은 곳에서 낮은 곳으로 흐르며 이는 양전기가 흐르는 방향이다. 크기는 단위 시간당 통과하는 전기량으로 표시한다. 단위는 암페어(A).","철조망에 고압 전류가 흐르고 있었다."]],1,[]],["서양(西洋)","명사",0,"서녘 서, 큰바다 양",[["유럽과 남북아메리카의 여러 나라를 통틀어 이르는 말.","서양 속담."]],1,[]],["도움","명사",0,"",[["남을 돕는 일.","도움을 구하다."]],1,[]],["소송(訴訟)","명사",0,"호소할 소, 송사할 송",[["재판에 의하여 원고와 피고 사이의 권리나 의무 따위의 법률관계를 확정하여 줄 것을 법원에 요구함. 또는 그런 절차. 민사 소송, 형사 소송, 행정 소송, 선거 소송 따위가 있다.","소송에 걸리다."]],1,[]],["더듬이","명사",0,"",[["절지동물의 머리 부분에 있는 감각 기관. 후각, 촉각 따위를 맡아보고 먹이를 찾고 적을 막는 역할을 한다.",""]],1,[]],["주어(主語)","명사",0,"임금 주, 말씀 어",[["주요 문장 성분의 하나로, 술어가 나타내는 동작이나 상태의 주체가 되는 말. ‘철수가 운동을 한다.’에서 ‘철수가’ 따위이다.","한국어는 인구어에 비해 주어의 생략이 자유롭다."]],1,[]],["깃","명사",0,"",[["새의 몸을 덮고 있는 털.","닭의 깃.","رِيش"],["조류의 몸 표면을 덮고 있는 털.","깃을 갈다."],["저고리나 두루마기의 목에 둘러대어 앞에서 여밀 수 있도록 된 부분. 위의 가장자리는 동정으로 싼다.","고대를 바로 하여 깃을 단정하게 여민 저고리의 초록빛은 치마의 선연한 붉은빛을 받아 여염, 요요하게 보였다.≪최명희, 혼불≫"]],1,[]],["여기저기","명사",0,"",[["여러 장소를 통틀어 이르는 말.","책상 위에 서류들이 여기저기에 흩어져 있었다."]],1,[]],["야구(野球)","명사",0,"들 야, 공 구",[["9명씩으로 이루어진 두 팀이 9회씩 공격과 수비를 번갈아 하며 승패를 겨루는 구기 경기. 공격하는 쪽은 상대편 투수가 던진 공을 배트(bat)로 치고 1, 2, 3루를 돌아 본루로 돌아오면 1점을 얻는다.","야구 경기."]],1,[]],["치료(治療)","명사",0,"다스릴 치, 병고칠 료",[["병이나 상처 따위를 잘 다스려 낫게 함.","종기 치료."]],1,[]],["가스(gas)","명사",0,"",[["기체 상태인 물질.","검은색 가스.","غَاز"],["기체 물질을 통틀어 이르는 말.","질소 가스."]],1,[]],["구리","명사",0,"",[["붉은색을 띤 금속 원소. 자연에서 순수한 금속으로 존재하며 연성(延性)과 전성(展性)이 우수하고, 전기와 열의 전도성이 뛰어나다. 원자 기호는 Cu, 원자 번호는 29, 원자량은 63.54.",""]],1,[]],["각지(各地)","명사",0,"각각 각, 땅 지",[["각 지방. 또는 여러 곳.","각지를 돌다."]],1,[]],["콩","명사",0,"",[["콩과의 한해살이풀. 높이는 60~100cm이며, 잎은 어긋나고 세 쪽 겹잎인데 털이 있다. 7~8월에 잎겨드랑이의 짧은 가지에 흰색, 붉은색, 보라색의 작은 나비 모양 꽃이 총상(總狀) 화서로 피고, 그 가운데 몇 개의 꽃이 결실하여 꼬투리가 된다. 꼬투리 속에는 1~3개의 긴 타원형의 씨가 들어 있다. 씨는 식용하거나 기름을 짜서 쓴다. 중국이 원산지로 한국, 만주, 아메리카, 아프리카 등지에 분포한다.",""]],1,[]],["지혜(智慧/知慧)","명사",0,"슬기 지, 슬기로울 혜 / 알 지, 슬기로울 혜",[["사물의 이치를 빨리 깨닫고 사물을 정확하게 처리하는 정신적 능력.","삶의 지혜."]],1,[]],["틈","명사",0,"",[["벌어져서 사이가 생긴 자리.","벽 틈.","صدع، شقّ، فجوة"],["벌어져 사이가 난 자리.","갈라진 틈으로 물이 샌다."]],1,[]],["역할(役割)","명사",0,"부릴 역, 벨 할",[["맡은 일 또는 해야 하는 일.","역할 분담."]],0,[]],["수단(手段)","명사",0,"손 수, 층계 단",[["어떤 목적을 이루기 위하여 쓰는 방법이나 도구.","결제 수단.","وَسِيلَة"],["어떤 목적을 이루기 위한 방법. 또는 그 도구.","생계 수단."]],1,[]],["송나라(宋나라)","명사",0,"성씨 송",[["중국에서 조광윤(趙匡胤)이 오대(五代) 후주(後周)의 공제(恭帝)로부터 선양을 받아서 세운 왕조. 960년에 변경에 도읍하였고, 1127년에 금나라의 침입으로 강남(江南)으로 옮겨 임안(臨安)에 도읍하였는데, 그 이전을 북송, 그 이후부터 1279년에 원나라에 망할 때까지를 남송이라 한다.",""]],1,[]],["최고(最高)","명사",0,"가장 최, 높을 고",[["정도가 가장 높음.","사상 최고.","الأعلى، الأقصى"],["가장 높음.","최고 높이."]],1,[]],["자격(資格)","명사",0,"재물 자, 격식 격",[["일정한 신분이나 지위.","참관인 자격으로 회의에 참석하였다."]],1,[]],["주장(主張)","명사",0,"임금 주, 베풀 장",[["자기의 의견이나 주의를 굳게 내세움. 또는 그런 의견이나 주의.","정당한 주장."]],1,[]],["부근(附近)","명사",0,"붙을 부, 가까울 근",[["어떤 곳을 중심으로 하여 가까운 곳.","동창과 학교 부근에 있는 찻집에서 만났다."]],1,[]],["존재(存在)","명사",0,"있을 존, 있을 재",[["실제로 있음. 또는 그런 대상.","신의 존재.","وجود"],["현실에 실제로 있음. 또는 그런 대상.","신의 존재를 부인하다."]],1,[]],["질(質)","명사",0,"바탕 질",[["속성, 가치, 쓸모, 등급 등과 같은 사물의 근본 성질.","물건의 질.","جودة"],["사물의 속성, 가치, 유용성, 등급 따위의 총체.","질이 나쁜 종이."]],1,[]],["부피","명사",0,"",[["넓이와 높이를 가진 물건이 공간에서 차지하는 크기.","부피를 재다."]],1,[]],["침","명사",0,"",[["입속의 침샘에서 분비되는 무색의 끈기 있는 소화액. 녹말을 맥아당으로, 맥아당을 포도당으로 만드는 작용을 한다.","침이 나오다."]],1,[]],["보리","명사",0,"",[["볏과의 두해살이풀. 줄기는 높이가 1미터 정도이고 곧고 속이 비었으며, 마디가 길다. 잎은 어긋나고 긴 선 모양으로 겉이 매끄러우며 나란히맥이 있다. 꽃은 5월에 수상(穗狀) 화서로 달리는데 이삭에는 까끄라기가 있다. 알이 껍질에서 잘 떨어지는지에 따라 쌀보리와 겉보리로, 파종 시기에 따라 가을보리와 봄보리로 나눈다. 보리쌀은 보리밥·맥주·된장·빵 따위의 원료이고, 줄기는 여름 모자·공예품·제지용·퇴비 따위에 쓴다. 서남아시아, 이집트가 원산지로 전 세계 온대 지방에서 재배한다.","보리 두 말."]],1,[]],["에너지(energy)","명사",0,"",[["사람이 육체적, 정신적 활동을 하는 데 필요한 힘.","삶의 에너지.","طَاقَة"],["인간이 활동하는 근원이 되는 힘.","선생님의 형님은 그 에너지가 어디에서 근원했건 자기를 주장해 왔고 자기의 여자를 위해서 뭔가 싸워 왔어요.≪이청준, 병신과 머저리≫"],["기본적인 물리량의 하나. 물체나 물체계가 가지고 있는 일을 하는 능력을 통틀어 이르는 말로, 역학적 일을 기준으로 하여 이와 동등하다고 생각되는 것, 또는 이것으로 환산할 수 있는 것을 이른다. 에너지의 형태에 따라 운동, 위치, 열, 전기 따위의 에너지로 구분한다.","물체에 힘을 작용하여 일을 하면 일을 한 만큼 물체의 에너지가 증가하거나 그 에너지가 다른 형태의 에너지로 전환된다."]],1,[]],["외국(外國)","명사",0,"바깥 외, 나라 국",[["자기 나라가 아닌 다른 나라.","외국 사람."]],1,[]],["접두사(接頭辭)","명사",0,"이을 접, 머리 두, 말씀 사",[["파생어를 만드는 접사로, 어근이나 단어의 앞에 붙어 새로운 단어가 되게 하는 말. ‘맨손’의 ‘맨-’, ‘들볶다’의 ‘들-’, ‘시퍼렇다’의 ‘시-’ 따위가 있다.",""]],1,[]],["별자리","명사",0,"",[["별의 위치를 정하기 위하여 밝은 별을 중심으로 천구(天球)를 몇 부분으로 나눈 것. 동물, 물건, 신화에 나오는 인물의 이름이 붙여져 있다. 고대 중국에서는 이십팔수로 나누었으나 오늘날에는 88개의 별자리로 통일되어 있다. 큰곰자리, 오리온자리 따위가 있다.","오밤중에 문득 잠이 깨어 눈을 뜨면 하늘의 별자리들이 그새 위치를 옮겨 앉아 있곤 했다.≪이동하, 장난감 도시≫"]],1,[]],["우두머리","명사",0,"",[["어떤 일이나 단체에서 으뜸인 사람.",""]],1,[]],["북(北)","명사",0,"북녘 북",[["네 방위의 하나. 나침반의 엔(N) 극이 가리키는 방위이다.","이 강은 북에서 남으로 흐른다."]],1,[]],["신화(神話)","명사",0,"귀신 신, 말씀 화",[["신이나 신 같은 존재에 대한 신비스러운 이야기.","신화 속 영웅.","أُسْطُورَة"],["고대인의 사유나 표상이 반영된 신성한 이야기. 우주의 기원, 신이나 영웅의 사적(事績), 민족의 태고 때의 역사나 설화 따위가 주된 내용이다. 내용에 따라 자연 신화와 인문(人文) 신화로 나눈다.","날짐승과 물짐승을 합쳐 놓은 듯한 그것은 신화 속에서 방금 뛰쳐나온 모습으로….≪윤후명, 별보다 멀리≫"]],1,[]],["갈래","명사",0,"",[["하나에서 둘 이상으로 갈라져 나간 부분이나 가닥.","하위 갈래.","جُزْء"],["하나에서 둘 이상으로 갈라져 나간 낱낱의 부분이나 계통.","한국 문학의 갈래."]],1,[]],["뿔","명사",0,"",[["소나 사슴과 같은 동물의 머리에 난 단단하고 뾰족한 것.","사슴의 뿔.","قَرْن"],["소, 염소, 사슴 따위의 머리에 솟은 단단하고 뾰족한 구조. 동물이 자위(自衛)와 투쟁에 쓰는 중요한 무기인데 여러 가지 공예재나 약재로도 쓴다.","뿔이 돋다."]],1,[]],["감각(感覺)","명사",0,"느낄 감, 깨달을 각",[["눈, 코, 귀, 혀, 피부를 통하여 자극을 느낌.","감각이 둔하다.","إِحْسَاس"],["눈, 코, 귀, 혀, 살갗을 통하여 바깥의 어떤 자극을 알아차림.","감각이 둔하다."]],1,[]],["신분(身分)","명사",0,"몸 신, 나눌 분",[["개인이 사회에서 가지는 역할이나 지위.","학생 신분.","مقام، رتبة"],["개인의 사회적인 위치나 계급. 봉건 사회에서는, 사회관계를 구성하는 서열로, 제도상 등급에 따라 권리와 의무가 다르고 세습되는 것이 원칙이었다.","신분을 감추다."]],1,[]],["계급(階級)","명사",0,"섬돌 계, 등급 급",[["군대나 경찰과 같은 조직 내에서의 지위나 관직 등의 등급.","계급이 낮다.","دَرَجَة، مَرْتَبَة"],["사회나 일정한 조직 내에서의 지위, 관직 따위의 단계.","한 계급 승진하다."],["일정한 사회에서 신분, 재산, 직업 따위가 비슷한 사람들로 형성되는 집단. 또는 그렇게 나뉜 사회적 지위.","계급 간의 대립."]],1,[]],["앞뒤","명사",0,"",[["앞과 뒤.","마을 앞뒤.","الأمام والوراء"],["앞과 뒤를 아울러 이르는 말.","마을 앞뒤로 맑은 개울이 흐른다."]],1,[]],["덩어리","명사",0,"",[["양이나 수가 많이 뭉쳐서 이루어진 것.","고기 덩어리.","كُتْلَة"],["크게 뭉쳐서 이루어진 것.","진흙 덩어리."]],1,[]],["생산(生産)","명사",0,"날 생, 낳을 산",[["인간이 생활하는 데 필요한 각종 물건을 만들어 냄.","상품의 생산 시기와 소비 시기."]],1,[]],["신호(信號)","명사",0,"믿을 신, 이름 호",[["어떤 내용의 전달을 위해 서로 약속하여 사용하는 일정한 소리, 색깔, 빛, 몸짓 등의 부호.","대기 신호.","إِشَارَة"],["일정한 부호, 표지, 소리, 몸짓 따위로 특정한 내용 또는 정보를 전달하거나 지시를 함. 또는 그렇게 하는 데 쓰는 부호.","그는 고개를 끄덕거리며 철조망을 넘어가도 좋다는 신호를 보내왔다."]],1,[]],["근거(根據)","명사",0,"뿌리 근, 근거 거",[["생활이나 활동 등의 근본이 되는 곳.","생활의 근거.","أَسَاسٌ"],["근본이 되는 거점.","활동의 근거로 삼다."]],1,[]],["관상용(觀賞用)","명사",0,"볼 관, 상줄 상, 쓸 용",[["두고 보면서 즐기는 데 씀. 또는 그런 물건.","관상용 식물."]],1,[]],["건축(建築)","명사",0,"세울 건, 쌓을 축",[["집이나 성, 다리 따위의 구조물을 그 목적에 따라 설계하여 흙이나 나무, 돌, 벽돌, 쇠 따위를 써서 세우거나 쌓아 만드는 일.","건축 공사."]],1,[]],["규칙(規則)","명사",0,"법 규, 법칙 칙",[["여러 사람이 지키도록 정해 놓은 법칙.","경기 규칙.","قَاعِدَة"],["여러 사람이 다 같이 지키기로 작정한 법칙. 또는 제정된 질서.","규칙 위반."]],1,[]],["자루","명사",0,"",[["속에 물건을 담을 수 있게 헝겊 등으로 만든 큰 주머니.","곡식 자루.","جوال"],["손으로 다루게 되어 있는 연장이나 기구 따위의 끝에 달린 손잡이.","곡괭이 자루를 쥐다."],["속에 물건을 담을 수 있도록 헝겊 따위로 길고 크게 만든 주머니.","곡식 자루."]],1,[]],["경향(傾向)","명사",0,"기울 경, 향할 향",[["현상이나 사상, 행동 따위가 어떤 방향으로 기울어짐.","새로운 경향."]],1,[]],["무관(武官)","명사",0,"호반 무, 벼슬 관",[["군에 적을 두고 군사 일을 맡아보는 관리.",""]],1,[]],["연기(演技)","명사",0,"펼 연, 재주 기",[["배우가 배역의 인물, 성격, 행동 따위를 표현해 내는 일.","연기 지도."]],1,[]],["구실","명사",0,"",[["자기가 마땅히 해야 할 맡은 바 책임.","사람 구실."]],1,[]],["용액(溶液)","명사",0,"녹을 용, 진 액",[["두 가지 이상의 물질이 균일하게 혼합된 액체. 보통 액체상일 때를 이르지만, 혼합체가 고체상인 고체 용액을 이르기도 한다.",""]],1,[]],["영조(嶺調)","명사",0,"고개 영, 고를 조",[["경상도에서 부르는 시조의 창법.",""]],1,[]],["분량(分量)","명사",0,"나눌 분, 헤아릴 량",[["수효, 무게 따위의 많고 적음이나 부피의 크고 작은 정도.","트럭 두 대 분량."]],1,[]],["정식(定食)","명사",0,"정할 정, 밥 식",[["식당에서 일정한 반찬을 배정해 놓고 기본으로 파는 음식. 제공되는 반찬의 수와 종류에 따라 가격에 차이가 있다.","백반 정식."],["식당이나 여관 따위에서 때를 정하여 놓고 먹는 끼니때의 음식.","이 여관에서 한 달간 정식을 먹는 데에 30만 원이 든다."]],1,[]],["논","명사",0,"",[["물을 대어 주로 벼를 심어 가꾸는 땅.","기름진 논."]],1,[]],["직위(職位)","명사",0,"직분 직, 자리 위",[["직무에 따라 규정되는 사회적·행정적 위치.","직위가 높다."]],1,[]],["임무(任務)","명사",0,"맡길 임, 힘쓸 무",[["맡은 일. 또는 맡겨진 일.","국회의 임무."]],1,[]],["조상(祖上)","명사",0,"할아비 조, 윗 상",[["한 집안에서 먼저 태어나 살다가 돌아가신 어른.","가까운 조상.","سلف، أجداد"],["돌아간 어버이 위로 대대의 어른.","조상을 섬기다."]],1,[]],["흐름","명사",0,"",[["흐르는 것.","강물의 흐름."]],1,[]],["굿","명사",0,"",[["무당이 음식을 차려 놓고 노래를 하고 춤을 추며 귀신에게 복을 빌거나 나쁜 것을 물리쳐 달라고 비는 의식.","굿이 벌어지다.","طُقُوس شَامَانِيَّة"],["무속의 종교 제의. 무당이 음식을 차려 놓고 노래를 하고 춤을 추며 귀신에게 인간의 길흉화복을 조절하여 달라고 비는 의식이다.","액땜 굿."]],1,[]],["철도(鐵道)","명사",0,"쇠 철, 길 도",[["침목 위에 철제의 궤도를 설치하고, 그 위로 차량을 운전하여 여객과 화물을 운송하는 시설.","철도를 놓다."]],1,[]],["움직임","명사",0,"",[["자세나 자리 등이 바뀜.","사람의 움직임.","تحرّك"],["멈추어 있던 자세나 자리가 바뀜. 또는 자세나 자리를 바꿈.","선수들이 지쳐서인지 몸의 움직임이 점차 둔해지고 있다."]],1,[]],["주머니","명사",0,"",[["돈이나 물건 등을 넣어 가지고 다닐 수 있도록 천이나 가죽 등으로 만든 물건.","가죽 주머니.","جراب"],["자질구레한 물품 따위를 넣어 허리에 차거나 들고 다니도록 만든 물건. 천이나 가죽 따위로 만든다.","수판 주머니."]],1,[]],["의미(意味)","명사",0,"뜻 의, 맛 미",[["말이나 글, 기호 등이 나타내는 뜻.","단어의 의미.","مَضْمُون"],["말이나 글의 뜻.","단어의 사전적 의미."]],1,[]],["아침","명사",0,"",[["날이 밝아올 때부터 해가 떠올라 하루의 일이 시작될 때쯤까지의 시간.","오늘 아침.","صباح"],["날이 새면서 오전 반나절쯤까지의 동안.","그는 아침 일찍 일어나는 편이다."]],1,[]],["선조(先祖)","명사",0,"먼저 선, 할아비 조",[["먼 윗대의 조상.","선조를 모신 사당."]],1,[]],["분위기(雰圍氣)","명사",0,"안개 분, 에워쌀 위, 기운 기",[["어떤 자리나 장면에서 느껴지는 기분.","딱딱한 분위기.","جَوّ"],["지구를 둘러싸고 있는 기체.",""]],1,[]],["가르침","명사",0,"",[["도리나 지식, 사상, 기술 따위를 알게 함. 또는 그 내용.","스승의 가르침."]],1,[]],["석가모니(釋迦牟尼)","명사",0,"풀 석, 부처이름 가, 소우는소리 모, 여승 니",[["불교의 개조. 과거칠불의 일곱째 부처로, 세계 4대 성인의 한 사람이다. 기원전 624년에 지금의 네팔 지방의 카필라바스투성에서 슈도다나와 마야 부인의 아들로 태어났으며, 29세 때에 출가하여 35세에 득도하였다. 그 후 녹야원에서 다섯 수행자를 교화하는 것을 시작으로 교단을 성립하였다. 45년 동안 인도 각지를 다니며 포교하다가 80세에 입적하였다.",""]],1,[]],["지붕","명사",0,"",[["집의 윗부분을 덮는 덮개.","기와 지붕.","سقف"],["집의 맨 꼭대기 부분을 덮어 씌우는 덮개.","지붕에 올라가다."]],1,[]],["호수(號數)","명사",0,"이름 호, 셈 수",[["차례대로 매긴 번호.","방의 호수.","رقم مسلسل"],["차례로 매겨진 번호의 수효.","병실의 호수를 확인하다."]],1,[]],["유기(遺棄)","명사",0,"남길 유, 버릴 기",[["내다 버림.","최근 반려동물 유기가 늘었다."]],1,[]],["평면(平面)","명사",0,"평평할 평, 낯 면",[["평평한 표면.","이 건물은 배수 시설을 하면서 바닥을 평면으로 처리해 물이 괸다."]],1,[]],["적의(敵意)","명사",0,"대적할 적, 뜻 의",[["적으로 대하는 마음.","적의가 없다.","عداوة"],["적대하는 마음.","적의를 품다."]],1,[]],["잡지(雜誌)","명사",0,"섞일 잡, 기록할 지",[["일정한 이름을 가지고 호를 거듭하며 정기적으로 간행하는 출판물. 책의 성격에 따라 다양한 내용의 글이 실리며, 간행 주기에 따라 주간·순간·월간·계간으로 나눈다.","잡지를 발행하다."]],1,[]],["기세(氣勢)","명사",0,"기운 기, 형세 세",[["힘차게 뻗치는 기운이나 세력.","당당한 기세.","نَشَاط، حَيَوِيَّة، حَمَاس، جُرْأَة، شَجَاعَة، حَمِيَّة، هِمَّة"],["기운차게 뻗치는 모양이나 상태.","당당한 기세."]],1,[]],["남녀(男女)","명사",0,"사내 남, 계집 녀",[["남자와 여자를 아울러 이르는 말.","청춘 남녀."]],1,[]],["장애(障礙)","명사",0,"막을 장, 거리낄 애",[["가로막아서 어떤 일을 하는 데 거슬리거나 방해가 됨. 또는 그런 일이나 물건.","커다란 장애.","عَقَبَة"],["어떤 사물의 진행을 가로막아 거치적거리게 하거나 충분한 기능을 하지 못하게 함. 또는 그런 일.","의사소통의 장애."]],1,[]],["무당","명사",0,"",[["귀신을 섬겨 길흉을 점치고 굿을 하는 것을 직업으로 하는 사람. 주로 여자를 이른다. 한자를 빌려 ‘巫堂’으로 적기도 한다.","무당을 불러 굿을 하다."]],1,[]],["물감","명사",0,"",[["물을 들이는 물질이나 안료 따위를 통틀어 이르는 말.","물감으로 색칠하다."]],1,[]],["핵(核)","명사",0,"씨 핵",[["어떤 것의 가장 중심이 되는 것.","팀의 핵.","قلب، مركز"],["사물이나 현상의 중심.","핵으로 삼다."]],1,[]],["계획(計劃/計畫)","명사",0,"셀 계, 그을 획 / 셀 계, 그림 획",[["앞으로 할 일의 절차, 방법, 규모 따위를 미리 헤아려 작정함. 또는 그 내용.","작업 계획."]],1,[]],["본말(本末)","명사",0,"근본 본, 끝 말",[["사건이나 일의 처음과 끝.","사건의 본말.","الْعِلَّةُ وَالْمَعْلُولُ"],["사물이나 일의 처음과 끝.","너무 흥분하지 말고 그 사건의 본말을 차근하게 이야기해 보아라."],["사물이나 일의 중요한 부분과 중요하지 않은 부분.",""]],1,[]],["수가(酬價)","명사",0,"갚을 수, 값 가",[["보수로 주는 대가.","의료 보험 수가."]],1,[]],["알코올(alcohol)","명사",0,"",[["상온에서 액체 상태로 존재하며 불에 잘 타는 화합물.","알코올 램프.","كحول"],["사슬 또는 지방족 고리 탄화수소의 수소를 하이드록시기로 치환한 화합물을 통틀어 이르는 말.",""]],1,[]],["주의(注意)","명사",0,"부을 주, 뜻 의",[["마음에 새겨 두고 조심함.","주의 사항."],["어떤 한곳이나 일에 관심을 집중하여 기울임.","주의가 산만하다."]],1,[]],["사방(四方)","명사",0,"넉 사, 모 방",[["동, 서, 남, 북의 네 가지 방향.","동서남북 사방.","أَرْبَعَة اتِّجَاهَات"],["동, 서, 남, 북 네 방위를 통틀어 이르는 말.","사방이 산으로 막혔다."]],1,[]],["업무(業務)","명사",0,"업 업, 힘쓸 무",[["직장 같은 곳에서 맡아서 하는 일.","처리해야 할 업무가 산더미 같다."]],1,[]],["도자기(陶瓷器)","명사",0,"질그릇 도, 사기그릇 자, 그릇 기",[["도기(陶器), 자기(瓷器), 사기(沙器), 질그릇 따위를 통틀어 이르는 말. 점토에 장석, 석영 따위의 가루를 섞어 성형, 건조, 소성(燒成)한 제품으로, 소지(素地)의 상태, 소성 온도 따위에 따라 토기, 도기, 석기(炻器), 자기로 나눈다.","도자기 공장."]],1,[]],["땅속","명사",0,"",[["땅 밑.","땅속에 사는 두더지."]],1,[]],["반(班)","명사",0,"나눌 반",[["일정한 목적으로 조직한 사람들의 집단.","꽃꽂이 반.","جَمَاعَة"],["일정한 목적을 위하여 조직한 사람들의 작은 집단.","반을 편성하다."]],1,[]],["공중(公衆)","명사",0,"공평할 공, 무리 중",[["사회의 대부분 사람들.","공중의 여론."]],0,[]],["꽃줄기","명사",0,"",[["꽃이 달리는 줄기. 땅속줄기나 비늘줄기에서 직접 갈라져 나와 잎을 달지 않고 꽃이나 화서만 피우는 것으로, 민들레·수선화·제비꽃 따위에서 볼 수 있다.",""]],1,[]],["빈(Wien)","명사",0,"",[["중부 유럽, 다뉴브강 연안에 있는 도시. 숲에 둘러싸인 아름다운 고도(古都)로, 중부 유럽의 경제·교통·문화의 중심지이다. 오스트리아의 수도이다. 면적은 415㎢.",""]],1,[]],["창","명사",0,"",[["신발의 밑바닥 부분.","고무신 창.","نعل، نعل حذاء"],["신의 밑바닥 부분.","고무신 창이 떨어져 나가다."]],1,[]],["공화국(共和國)","명사",0,"한가지 공, 화할 화, 나라 국",[["공화 정치를 하는 나라. 주권이 국민에게 있는 나라를 이른다.","우리는 합법 정부인 공화국 정부로부터 파병 요청을 받고 온 거야. 궤변 늘어놓지 말고 기습하게 된 배경이나 말해.≪이원규, 훈장과 굴레≫"]],1,[]],["근본(根本)","명사",0,"뿌리 근, 근본 본",[["어떤 것의 본질이나 바탕.","나라의 근본.","أَسَاسٌ"],["초목의 뿌리.",""],["사물의 본질이나 본바탕.","근본 원칙."]],1,[]],["회의(懷疑)","명사",0,"품을 회, 의심할 의",[["의심을 품음. 또는 마음속에 품고 있는 의심.","회의가 생기다."]],1,[]],["대가(大家)","명사",0,"클 대, 집 가",[["전문 분야에서 능력이 뛰어나 권위를 인정받는 사람.","국학의 대가.","شَخْصِيَّة كَبِيرَة"],["전문 분야에서 뛰어나 권위를 인정받는 사람.","국학의 대가."]],1,[]],["전자(前者)","명사",0,"앞 전, 놈 자",[["말하고 있는 때 이전의 지나간 차례나 때.","전자의 방식.",""],["두 가지 사물이나 사람을 들어 말할 때, 먼저 든 사물이나 사람.","우선 그 두 상황이 외관상 너무나 흡사하다. 전자는 남편을 죽인 무서운 폭격이었고 후자는 고아 두 명을 소사시킨 역시 끔찍한 화재 사건이다.≪홍성원, 육이오≫"]],1,[]],["신문(新聞)","명사",0,"새 신, 들을 문",[["정기적으로 세상에서 일어나는 새로운 일들을 알려 주는 간행물.","신문 한 부.","جريدة"],["새로운 소식이나 견문.",""]],1,[]],["국화과(菊花科)","명사",0,"국화 국, 꽃 화, 과목 과",[["쌍떡잎식물 국화목의 한 과. 쌍떡잎식물 가운데 가장 진화한 식물로 세계에 2000여 속 2만여 종이 분포하며, 우리나라에는 290여 종이 있다. 과꽃, 국화, 해바라기 따위가 있다.",""]],1,[]],["원추(圓錐)","명사",0,"둥글 원, 송곳 추",[["‘원뿔’의 전 용어.",""]],1,[]],["오랫동안","명사",0,"",[["시간상으로 썩 긴 동안.","나는 오랫동안 망설인 끝에 드디어 결심했다.≪최인호, 잠자는 신화≫"]],1,[]],["학생(學生)","명사",0,"배울 학, 날 생",[["학예를 배우는 사람.","그의 도장에는 태권도를 배우려는 학생들로 항상 만원이다."]],1,[]],["세종(世宗)","명사",0,"인간 세, 마루 종",[["덕망이 높은 제왕에게 붙이던 묘호.",""]],1,[]],["가격(價格)","명사",0,"값 가, 격식 격",[["물건이 지니고 있는 가치를 돈으로 나타낸 것.","가격 인상."]],1,[]],["끈","명사",0,"",[["물건을 매거나 꿰거나 하는 데 쓰는 가늘고 긴 물건.","머리 끈."]],0,[]],["석탄(石炭)","명사",0,"돌 석, 숯 탄",[["태고 때의 식물질이 땅속 깊이 묻히어 오랫동안 지압과 지열을 받아 차츰 분해하여 생긴, 타기 쉬운 퇴적암. 검은색 또는 검은 갈색을 띠며 탄소·산소·수소를 주성분으로 하는데 약간의 유황과 많은 양의 회분(灰分)과 수분이 들어 있다. 탄화 정도에 따라 토탄, 갈탄, 역청탄, 무연탄 따위로 나뉘며 연료 또는 화학 공업 재료로 널리 쓰인다.","광산에서 석탄을 캐는 광부."]],1,[]],["목숨","명사",0,"",[["사람이나 동물이 숨을 쉬며 살아 있는 힘.","목숨이 길다."]],1,[]],["옥(玉)","명사",0,"구슬 옥",[["연한 녹색이나 회색을 띠며, 빛이 곱고 모양이 아름다운 보석.","푸른 옥.","يَشُمُّ"],["경옥(硬玉)과 연옥(軟玉) 따위를 통틀어 이르는 말. 엷은 녹색이나 회색 따위를 띠며, 빛이 곱고 모양이 아름다우므로 갈아서 보석으로 쓴다.","옥같이 흰 얼굴."]],1,[]],["강제(強制)","명사",0,"강할 강, 절제할 제",[["권력이나 위력(威力)으로 남의 자유의사를 억눌러 원하지 않는 일을 억지로 시킴.","강제 노동."]],1,[]],["채소(菜蔬)","명사",0,"나물 채, 나물 소",[["밭에서 기르는 농작물. 주로 그 잎이나 줄기, 열매 따위를 식용한다. 보리나 밀 따위의 곡류는 제외한다.","무공해 채소."]],1,[]],["좀","명사",0,"",[["좀목의 빈대좀, 나무좀, 서양좀, 작은좀, 돌벼룩좀, 수시렁좀 따위를 통틀어 이르는 말.",""]],1,[]],["일반적(一般的)","명사",0,"한 일, 가지 반, 과녁 적",[["일부가 아닌 전체에 두루 해당될 수 있는 것.","일반적인 가격.","عامّ ، كلّي ، شائع"],["일부에 한정되지 아니하고 전체에 걸치는 것.","일반적인 성격."]],1,[]],["자식(子息)","명사",0,"아들 자, 쉴 식",[["아들과 딸, 또는 아들이나 딸.","남의 자식.","نسل، ولد"],["부모가 낳은 아이를, 그 부모에 상대하여 이르는 말.","자식을 기르다."]],1,[]],["군인(軍人)","명사",0,"군사 군, 사람 인",[["군대에서 복무하는 사람. 육해공군의 장교, 부사관, 병사를 통틀어 이르는 말이다.","군인 부대."]],1,[]],["앞쪽","명사",0,"",[["향하고 있는 방향과 일치하는 쪽.","그는 상앗대를 물속에 쑤셔 박아 뗏목을 앞쪽으로 밀었다.≪윤흥길, 완장≫"]],1,[]],["얼음","명사",0,"",[["물이 얼어서 굳은 것.","두꺼운 얼음."]],0,[]],["보살(菩薩)","명사",0,"보리 보, 보살 살",[["불교에서, 위로는 부처를 따르고 아래로는 중생을 이끄는, 부처의 다음가는 성인.","자비로운 보살.","بُودِيسَاتْفَا"],["위로 보리를 구하고 아래로 중생을 제도하는, 대승 불교의 이상적 수행자상.","보살이 될 수 있으리라는 믿음을 가지고 수행을 했다."]],1,[]],["숨","명사",0,"",[["사람이나 동물이 코 또는 입으로 공기를 들이마시고 내쉬는 것.","가쁜 숨.","تَنَفُّس"],["사람이나 동물이 코 또는 입으로 공기를 들이마시고 내쉬는 기운. 또는 그렇게 하는 일.","숨을 쉬다."]],1,[]],["벌레","명사",0,"",[["곤충이나 기생충 등 몸 구조가 간단한 동물.","작은 벌레.","حَشَرَة"],["곤충을 비롯하여 기생충과 같은 하등 동물을 통틀어 이르는 말.","벌레 한 마리."]],1,[]],["죽","명사",0,"",[["옷, 그릇 등의 열 벌을 묶어 이르는 말.","죽을 채우다.","لفة"],["옷, 그릇 따위의 열 벌을 묶어 이르는 말.","접시는 죽을 채워 보내라."]],1,[]],["책임(責任)","명사",0,"꾸짖을 책, 맡길 임",[["맡은 일이나 의무.","도의적 책임.","مَسْؤُولِيَّة"],["맡아서 해야 할 임무나 의무.","연락 책임."]],1,[]],["포유류(哺乳類)","명사",0,"먹일 포, 젖 유, 무리 류",[["포유강의 동물을 일상적으로 통틀어 이르는 말.","우리나라에 서식하는 포유류의 분포 현황."]],1,[]],["우상(偶像)","명사",0,"짝 우, 모양 상",[["믿음이나 의미를 담아 나무, 돌, 흙 등으로 만든 형상.","돌로 만든 우상.","وثن"],["특정한 믿음이나 의미를 부여하여 나무, 돌, 쇠붙이, 흙 따위로 만든 형상.","나무로 깎아 만든 우상."]],1,[]],["사회적(社會的)","명사",0,"모일 사, 모일 회, 과녁 적",[["사회에 관계되거나 사회성을 지닌 것.","사회적인 여건."]],1,[]],["제일(第一)","명사",0,"차례 제, 한 일",[["여럿 가운데서 첫째가는 것.","제일의 목표."]],1,[]],["키(key)","명사",0,"",[["문이나 자물쇠를 잠그거나 여는 도구.","비상용 키.","مِفْتَاح"],["자물쇠를 잠그거나 여는 데 사용하는 물건.","자동차 키."]],1,[]],["하루","명사",0,"",[["밤 열두 시부터 다음 날 밤 열두 시까지의 스물네 시간.","만 하루.","يَوْم"],["한 낮과 한 밤이 지나는 동안. 대개 자정(子正)에서 다음 날 자정까지를 이른다.","시골 할머니 댁에서 하루를 보냈다."]],1,[]],["서(西)","명사",0,"서녘 서",[["네 방위의 하나. 해가 지는 쪽이다.",""]],1,[]],["법원(法院)","명사",0,"법 법, 집 원",[["사법권을 행사하는 국가 기관. 소송 사건에 대하여 법률적 판단을 하는 권한을 가지며, 대법원·고등 법원·지방 법원·가정 법원 따위가 있다.","법원에서 영장을 발부하다."]],1,[]],["수레","명사",0,"",[["바퀴를 달아서 굴러가게 만든 기구. 사람이 타거나 짐을 싣는다.","수레를 끌다."]],1,[]],["세로","명사",0,"",[["위에서 아래로 나 있는 방향. 또는 그 길이.","세로로 쓴 글씨."]],1,[]],["외","명사",0,"",[["한글 자모 ‘ㅚ「1」’의 이름.",""]],1,[]],["주둥이","명사",0,"",[["(속된 말로) 사람의 입.","주둥이를 나불거리다.","فم"],["사람의 입을 속되게 이르는 말.","입이라고도 좀 해 보시오. 밤낮 주둥이라니 주둥이가 무어요.≪홍명희, 임꺽정≫"],["일부 짐승이나 물고기 따위의 머리에서, 뾰족하게 나온 코나 입 주위의 부분.","미스 민은 열대어 주둥이 모양으로 입을 괴상하게 벌렸다.≪윤흥길, 꿈꾸는 자의 나성≫"]],1,[]],["가축(家畜)","명사",0,"집 가, 짐승 축",[["집에서 기르는 짐승. 소, 말, 돼지, 닭, 개 따위를 통틀어 이른다.","가축을 기르다."]],1,[]],["최초(最初)","명사",0,"가장 최, 처음 초",[["맨 처음.","세계 최초."]],1,[]],["입술","명사",0,"",[["포유류의 입 가장자리 위아래에 도도록이 붙어 있는 얇고 부드러운 살.","앵두 같은 입술."]],1,[]],["짝","명사",0,"",[["함께 어울려 한 쌍이나 한 벌을 이루는 것. 또는 그중의 하나.","맞는 짝.","زوج ، قرين"],["둘 또는 그 이상이 서로 어울려 한 벌이나 한 쌍을 이루는 것. 또는 그중의 하나.","짝을 이루다."]],1,[]],["음식물(飮食物)","명사",0,"마실 음, 밥 식, 물건 물",[["사람이 먹고 마시는 것을 통틀어 이르는 말.","음식물이 상하다."]],1,[]],["대륙(大陸)","명사",0,"클 대, 뭍 륙",[["넓은 면적을 가지고 해양의 영향이 내륙부에까지 직접적으로 미치지 않는 육지. 일반적으로 유럽, 아시아, 아프리카, 북아메리카, 남아메리카, 오스트레일리아, 남극 등을 이른다.","대륙 간에 행해지는 무역."]],1,[]],["장식(裝飾)","명사",0,"꾸밀 장, 꾸밀 식",[["액세서리 따위로 치장함. 또는 그 꾸밈새.","그 배는 크고 견고한 구조와 화려한 장식, 완전한 설비가 극히 장엄하고 주밀하였다.≪한용운, 흑풍≫"]],1,[]],["걸음","명사",0,"",[["다리를 움직여 두 발을 번갈아 옮겨 놓는 동작.","급한 걸음.","مَوْطِئ، خُطْوَة"],["두 발을 번갈아 옮겨 놓는 동작.","급한 걸음."]],1,[]],["수량(數量)","명사",0,"셈 수, 헤아릴 량",[["수효와 분량을 아울러 이르는 말.","수량이 모자라다."]],1,[]],["간장(肝腸)","명사",0,"간 간, 창자 장",[["간과 창자.",""]],1,[]],["동시(同時)","명사",0,"한가지 동, 때 시",[["같은 때.","동시에 말하다.","آن وَاحِد"],["같은 때나 시기.","동시에 일어난 사건."]],1,[]],["백제(百濟)","명사",0,"일백 백, 건널 제",[["우리나라 삼국 시대의 삼국 가운데 하나로, 기원전 18년에 온조왕이 위례성에 도읍하여 세운 나라. 한강 유역을 중심으로 발전하여 한반도의 서남부에 세력을 펼쳤으며, 고이왕 때 고대 국가의 면모를 갖추었다. 중국의 남조(南朝), 일본 등과 우호 관계를 유지하였으며 일본 문화에 큰 영향을 끼쳤다. 660년에 신라와 중국 당나라의 연합군에게 패하여 멸망하였다.",""]],1,[]],["닭","명사",0,"",[["꿩과의 새. 머리에 붉은 볏이 있고 날개는 퇴화하여 잘 날지 못하며 다리는 튼튼하다. 육용과 난용으로 육종된 수많은 품종이 있으며, 가금으로 가장 많이 사육한다. 원종은 인도, 말레이시아 등지의 들꿩이다.","뒤뜰에서 닭 몇 마리가 모이를 쪼아 먹고 있었다."]],1,[]],["발전(發展)","명사",0,"필 발, 펼 전",[["더 좋은 상태나 더 높은 단계로 나아감.","경제 발전.","تَقَدُّم"],["더 낫고 좋은 상태나 더 높은 단계로 나아감.","과학의 발전에 기여하다."]],1,[]],["형상(形象/形像)","명사",0,"모양 형, 코끼리 상 / 모양 형, 모양 상",[["사물의 생긴 모양이나 상태.","조각으로 풍만하게 표현된 인간의 형상."]],1,[]],["혀","명사",0,"",[["동물의 입안 아래쪽에 있는 길고 둥근 살덩어리. 맛을 느끼며 소리를 내는 구실을 한다.","혀를 깨물다."]],1,[]],["찬(饌)","명사",0,"반찬 찬",[["밥에 곁들여 먹는 음식을 통틀어 이르는 말.","찬은 없지만 많이 드세요."]],1,[]],["대해(大海)","명사",0,"클 대, 바다 해",[["넓고 큰 바다.","망망한 대해를 항해하다."]],1,[]],["절차(節次)","명사",0,"마디 절, 버금 차",[["일을 치르는 데 거쳐야 하는 순서나 방법.","수속 절차."]],1,[]],["성적(成績)","명사",0,"이룰 성, 길쌈 적",[["일이나 경기 등의 결과로 얻은 실적.","근무 성적.","نَتِيجَة"],["하여 온 일의 결과로 얻은 실적.","판매 성적."]],1,[]],["제주(濟州)","명사",0,"건널 제, 고을 주",[["우리나라 가장 남쪽에 있는, 섬으로 이루어진 도. 삼국 시대에 탐라국이었으며 고려 시대에 지금의 이름이 되었다. 2006년 ‘제주특별자치도 설치 및 국제 자유 도시 조성을 위한 특별법’에 의하여 특별자치도로 승격하였다. 도청 소재지는 제주이다. 면적은 약 1,850㎢.",""]],1,[]],["형(兄)","명사",0,"형 형",[["남자가 형제나 친척 형제들 중에서 자기보다 나이가 많은 남자를 이르거나 부르는 말.","사촌 형.","أخ أكبر"],["같은 부모에게서 태어난 사이이거나 일가친척 가운데 항렬이 같은 남자들 사이에서 손윗사람을 이르거나 부르는 말. 주로 남자 형제 사이에 많이 쓴다.","형은 다른 사람에게는 관대했으나 나에게는 까탈스럽게 행동했다"]],1,[]],["악보(樂譜)","명사",0,"즐길 악, 족보 보",[["음악의 곡조를 일정한 기호를 써서 기록한 것. 표음(表音) 보표식과 주법(奏法) 보표식이 있는데, 주로 오선식(五線式) 보표가 사용된다.","악보를 읽다."]],1,[]],["떡","명사",0,"",[["인절미, 송편 등과 같이 곡식 가루를 찌거나 삶아서 익힌 것을 빚어서 만든 음식.","잔치 떡.","طُوك, كَعْكَة أَرُزّ"],["곡식 가루를 찌거나, 그 찐 것을 치거나 빚어서 만든 음식을 통틀어 이르는 말.","떡을 먹다."]],1,[]],["시장(市場)","명사",0,"저자 시, 마당 장",[["여러 가지 상품을 사고파는 곳.","농산물 시장.","سوق"],["여러 가지 상품을 사고파는 일정한 장소.","수산물 시장."]],1,[]],["명(命)","명사",0,"목숨 명",[["사람이나 동물이 숨을 쉬며 살아 있는 상태. 또는 그런 힘.","명이 길다.","حَيَاة"],["사람이나 동물이 숨을 쉬며 살아 있는 힘.","명이 다하다."],["윗사람이나 상위 조직이 아랫사람이나 하위 조직에 무엇을 하게 함. 또는 그런 내용.","명을 받들다."]],1,[]],["대명사(代名詞)","명사",0,"대신할 대, 이름 명, 말씀 사",[["다른 명사를 대신하여 사람, 장소, 사물 등을 가리키는 낱말.","남성 대명사.","ضَمِير"],["사람이나 사물의 이름을 대신 나타내는 말. 또는 그런 말들을 지칭하는 품사. 인칭 대명사와 지시 대명사로 나뉘는데, 인칭 대명사는 ‘저’, ‘너’, ‘우리’, ‘너희’, ‘자네’, ‘누구’ 따위이고, 지시 대명사는 ‘거기’, ‘무엇’, ‘그것’, ‘이것’, ‘저기’ 따위이다.",""]],1,[]],["수상(首相)","명사",0,"머리 수, 서로 상",[["고려 시대와 조선 시대의 가장 높은 자리의 신하.","수상 나리.","وَزِير"],["내각의 우두머리. 의원 내각제에서는 다수당의 우두머리가 수상이 되는 것이 일반적이다.",""]],1,[]],["제품(製品)","명사",0,"지을 제, 물건 품",[["원료를 써서 물건을 만듦. 또는 그렇게 만들어 낸 물품.","유리 제품."]],1,[]],["태조(太祖)","명사",0,"클 태, 할아비 조",[["조선의 제1대 왕(1335~1408). 성은 이(李). 왕위에 오르기 전의 이름은 성계(成桂)이고 왕위에 오른 후의 이름은 단(旦). 자는 중결(仲潔). 호는 송헌(松軒). 고려 말기의 무신으로서 왜구를 물리쳐 공을 세웠고, 위화도 회군을 계기로 정권을 장악하여 조선 왕조를 세웠다. 재위 기간은 1392~1398년이다.",""],["고려의 제1대 왕(877~?). 성은 왕(王). 이름은 건(建). 자는 약천(若天). 궁예의 부하로 있다가 부하들이 옹립하여 송도에 도읍하고 왕위에 올랐다. 재위 기간은 918~943년이다.",""]],1,[]],["충렬왕(忠烈王)","명사",0,"충성 충, 매울 렬, 임금 왕",[["고려 제25대 왕(1236~1308). 이름은 거(昛). 초명은 심(諶)·춘(賰). 원나라에 굴복하여 세조의 공주를 아내로 맞이하였으며, 그 풍습과 문물제도를 받아들이고 원나라의 간섭을 심하게 받았다. 1298년 정치에 염증을 느껴 상왕(上王)이 되었으나, 물러난 지 7개월 만에 다시 왕위에 올랐다. 재위 기간은 1274~1308년이다.",""]],1,[]],["반대(反對)","명사",0,"돌이킬 반, 대할 대",[["어떤 것이 다른 것과 모양, 위치, 방향, 속성 등에서 완전히 다름.","반대 방향.","عَكْس"],["두 사물이 모양, 위치, 방향, 순서 따위에서 등지거나 서로 맞섬. 또는 그런 상태.","반대 방향."]],1,[]],["부위(部位)","명사",0,"떼 부, 자리 위",[["전체에 대하여 어떤 특정한 부분이 차지하는 위치.","다친 부위를 소독하다."]],1,[]],["이삭","명사",0,"",[["벼나 보리 등의 곡식에서, 꽃이 피고 열매가 열리는 부분.","벼 이삭.","سنبلة"],["벼, 보리 따위 곡식에서, 꽃이 피고 꽃대의 끝에 열매가 더부룩하게 많이 열리는 부분.","벼 이삭."]],1,[]],["은혜(恩惠)","명사",0,"은혜 은, 은혜 혜",[["자연이나 사람이 기꺼이 베풀어 주는 도움.","부모의 은혜.","فَضْل"],["고마움을 느끼도록 베풀어 주는 도움.","스승의 은혜."]],1,[]],["습지(濕地)","명사",0,"젖을 습, 땅 지",[["습기가 많은 축축한 땅.","강변에 습지가 발달하다."]],1,[]],["품질(品質)","명사",0,"물건 품, 바탕 질",[["물건의 성질과 바탕.","품질이 뛰어나다."]],1,[]],["시조(始祖)","명사",0,"비로소 시, 할아비 조",[["민족, 왕조, 가계 등의 맨 처음이 되는 조상.","민족의 시조.","مؤسِّس، سلف"],["한 겨레나 가계의 맨 처음이 되는 조상.","고구려의 시조 동명 성왕."]],1,[]],["딸","명사",0,"",[["여자로 태어난 자식.","딸을 낳다."]],1,[]],["진리(眞理)","명사",0,"참 진, 다스릴 리",[["참된 이치. 또는 참된 도리.","만고불변의 진리."]],1,[]],["본(本)","명사",0,"근본 본",[["옷 등을 만들 때 쓰기 위해 본보기로 만든 실물 크기의 물건.","신발 본.","نَمُوذَجٌ لِلصُّنْعِ"],["옷 따위를 지을 때에 재료를 그대로 마를 수 있도록 실물 크기로 만든 물건.","바지의 본을 뜨다."]],1,[]],["밀가루","명사",0,"",[["밀을 빻아 만든 가루.","밀가루 반죽을 주무르다."]],1,[]],["중기(中期)","명사",0,"가운데 중, 기약할 기",[["어떤 기간의 중간이 되는 시기.","고구려 중기.","فترة وسطى"],["처음과 끝의 가운데 시기.","고려 중기."]],1,[]],["재위(在位)","명사",0,"있을 재, 자리 위",[["임금의 자리에 있음. 또는 그런 동안.","재위 기간."]],1,[]],["대학(大學)","명사",0,"클 대, 배울 학",[["고등학교를 마치고 진학하는 고등 교육 기관.","국립 대학.","جَامِعَة"],["고등 교육을 베푸는 교육 기관. 국가와 인류 사회 발전에 필요한 학술 이론과 응용 방법을 교수하고 연구하며, 지도적 인격을 도야한다. 고등학교 졸업자 또는 이와 동등한 학력이 있다고 인정된 사람이 입학하며 수업 연한은 2년에서 6년까지이다.","대학 입학시험."]],1,[]],["틀","명사",0,"",[["똑같이 생긴 물건을 여러 개 찍어 내거나 굳혀 내는 데 쓰는 도구.","틀로 찍다.","إِطَار"],["골이나 판처럼 물건을 만드는 데 본이 되는 물건.","틀로 찍다."]],1,[]],["주기(週期)","명사",0,"주일 주, 기약할 기",[["같은 현상이나 특징이 한 번 나타나고 다음에 다시 나타나기까지의 기간.","한 달 주기.","دَوْرَةٌ"],["같은 현상이나 특징이 한 번 나타나고부터 다음번 되풀이되기까지의 기간.","주기가 단축되다."]],1,[]],["우주(宇宙)","명사",0,"집 우, 집 주",[["무한한 시간과 만물을 포함하는 끝없는 공간.","무한한 우주.","فَضَاء"],["무한한 시간과 만물을 포함하고 있는 끝없는 공간의 총체.","우주 만물."]],1,[]],["둘째","명사",0,"",[["처음부터 세어 모두 두 개가 됨.","우리 큰며느리는 벌써 아이를 둘째 낳았다.","الثَّانِي"],["맨 앞에서부터 세어 모두 두 개가 됨을 이르는 말.","새치를 벌써 둘째 뽑는다."]],1,[]],["산업(産業)","명사",0,"낳을 산, 업 업",[["인간의 생활을 경제적으로 풍요롭게 하기 위하여 재화나 서비스를 생산하는 사업. 농업·목축업·임업·광업·공업을 비롯한 유형물(有形物)의 생산 이외에 상업·금융업·운수업·서비스업 따위와 같이 생산에 직접 결부되지 않으나 국민 경제에 불가결한 사업도 포함하며, 좁은 뜻으로는 공업만을 가리키기도 한다.","새로운 산업에 종사하다."]],1,[]],["원리(原理)","명사",0,"언덕 원, 다스릴 리",[["사물의 본질이나 바탕이 되는 이치.","우주의 원리.","أساس ،قواعد، مبدأ"],["사물의 근본이 되는 이치.","냉장고의 원리."]],1,[]],["주도(主導)","명사",0,"임금 주, 인도할 도",[["앞장서서 조직이나 무리를 이끎.","주도 세력."]],1,[]],["귀신(鬼神)","명사",0,"귀신 귀, 귀신 신",[["사람이 죽은 뒤에 남는다고 하는 영혼.","귀신 이야기.","شَبَح"],["사람이 죽은 뒤에 남는다는 넋.","귀신 들린 사람."],["사람에게 화(禍)와 복(福)을 내려 준다는 신령(神靈).","정성껏 빌면 귀신도 감복하여 너의 소원을 들어줄 것이다."]],1,[]],["상처(傷處)","명사",0,"다칠 상, 곳 처",[["몸을 다쳐서 상한 자리.","상처 부위.","جروح"],["몸을 다쳐서 부상을 입은 자리.","상처를 입다."]],1,[]],["내","명사",0,"",[["시내보다는 크고 강보다는 작은 물줄기.","작은 내.","تَيَّار"],["시내보다는 크지만 강보다는 작은 물줄기.","내가 흐르다."],["코로 맡을 수 있는 온갖 기운.","고소한 내를 맡다."]],1,[]],["경치(景致)","명사",0,"볕 경, 이를 치",[["산이나 들, 강, 바다 따위의 자연이나 지역의 모습.","경치가 좋다."]],1,[]],["통신(通信)","명사",0,"통할 통, 믿을 신",[["우편이나 전신, 전화 등으로 정보나 소식 등을 전달함.","통신 사업.","تواصل، اتصالات"],["소식을 전함.","교통이 불편한 나라였다. 따라서 통신도 대단히 곤란하였다.≪이희승, 소경의 잠꼬대≫"]],1,[]],["설탕(雪糖▽/屑糖▽)","명사",0,"눈 설, 엿 당 / 가루 설, 엿 당",[["맛이 달고 물에 잘 녹는 결정체. 사탕수수, 사탕무 따위를 원료로 하여 만든다.","설탕이 듬뿍 묻은 도넛."]],1,[]],["서류(書類)","명사",0,"글 서, 무리 류",[["글자로 기록한 문서를 통틀어 이르는 말.","기밀 서류."]],1,[]],["혁명(革命)","명사",0,"가죽 혁, 목숨 명",[["국가나 사회의 제도와 조직 등을 근본부터 새롭게 고치는 일.","계급 혁명.","ثَوْرَة"],["헌법의 범위를 벗어나 국가 기초, 사회 제도, 경제 제도, 조직 따위를 근본적으로 고치는 일.","혁명 세력."]],1,[]],["대나무","명사",0,"",[["‘대02’를 일상적으로 이르는 말. ‘대’의 줄기가 단단하고 긴 것을 나무로 보아 이르는 말이다.","대나무로 만든 갈퀴."]],1,[]],["숲","명사",0,"",[["‘수풀「1」’의 준말.","울창한 숲."]],1,[]],["가락","명사",0,"",[["물레로 실을 만들 때 실이 감기는 쇠로 된 꼬챙이. 또는 그 꼬챙이에 감긴 실의 뭉치.","물레의 가락.","مِغْزَل"],["물레로 실을 자을 때 실이 감기는 쇠꼬챙이.",""],["가늘고 길게 토막이 난 물건의 낱개.","가락이 굵다."],["목소리의 높낮이나 길이를 통해 느껴지는 말의 기운.","그의 음성은 약간 처량한 가락을 띠었다."]],1,[]],["향기(香氣)","명사",0,"향기 향, 기운 기",[["꽃, 향, 향수 따위에서 나는 좋은 냄새.","진한 커피 향기."]],1,[]],["정조(貞操)","명사",0,"곧을 정, 잡을 조",[["여자의 곧은 절개.","지아비가 있어 정조를 지켜야 할 처지도 아니다.≪박경리, 토지≫"]],1,[]],["잠깐","명사",0,"",[["얼마 되지 않는 매우 짧은 동안.","잠깐의 여유."]],1,[]],["공격(攻擊)","명사",0,"칠 공, 칠 격",[["전쟁에서 적을 침.","공격 대상.","هُجُوم"],["나아가 적을 침.","공격 목표."]],1,[]],["법칙(法則)","명사",0,"법 법, 법칙 칙",[["반드시 지켜야 하는 규범.","엄격한 법칙.","الْقَانُون"],["반드시 지켜야만 하는 규범.","법칙을 따르다."],["모든 사물과 현상의 원인과 결과 사이에 내재하는 보편적·필연적인 불변의 관계.","이 우주의 순환 법칙은 사람이나 만물이나 다 같아서, 오면 가고 가면 오고, 자꾸 변하는 것 아닌가.≪최명희, 혼불≫"]],1,[]],["지점(地點)","명사",0,"땅 지, 점 점",[["땅 위의 일정한 점.","고속 도로 이 지점에서 사고가 났다."]],1,[]],["북아메리카(北America)","명사",0,"북녘 북",[["아메리카 대륙의 북부.",""]],1,[]],["단백질(蛋白質)","명사",0,"새알 단, 흰 백, 바탕 질",[["아미노산이 펩타이드 결합을 하여 생긴 여러 개의 아미노산으로 이루어진 고분자 화합물. 세포를 구성하고 생체 내 물질대사의 촉매 작용을 하여 생명 현상을 유지하는 물질로서, 사람의 3대 영양소 가운데 하나이다.","단백질을 보충하다."]],1,[]],["정월(正月)","명사",0,"바를 정, 달 월",[["음력으로 한 해의 첫째 달.","정월 초하루."]],1,[]],["개념(槪念)","명사",0,"대개 개, 생각 념",[["어떤 사물이나 현상에 대한 일반적인 지식.","정보화라는 개념을 이해하다."]],1,[]],["신체(身體)","명사",0,"몸 신, 몸 체",[["사람의 몸.","신체의 자유."]],1,[]],["태생(胎生)","명사",0,"아이밸 태, 날 생",[["어떠한 곳에 태어남.","농촌 태생."],["모체 안에서 어느 정도의 발육을 한 후에 태어나는 일. 단공류(單孔類)를 제외한 포유류에서만 볼 수 있다.",""]],1,[]],["경험(經驗)","명사",0,"지날 경, 시험 험",[["자신이 실제로 해 보거나 겪어 봄. 또는 거기서 얻은 지식이나 기능.","산 경험."]],1,[]],["축(軸)","명사",0,"굴대 축",[["돌아가게 되어 있는 물건의 가운데에 끼는 막대.","축이 빠지다.","مِحْوَر"],["활동이나 회전의 중심.","박 선생은 발꿈치를 축으로 하여 빙그르르 반원을 그리며 돌아섰다.≪윤흥길, 묵시의 바다≫"],["수레바퀴의 한가운데에 뚫린 구멍에 끼우는 긴 나무 막대나 쇠막대.",""]],1,[]],["구성(構成)","명사",0,"얽을 구, 이룰 성",[["몇 가지의 부분 혹은 요소를 모아서 하나의 전체를 이룸. 또는 그렇게 해서 이루어진 것.","인구 구성.","تَكْوِين"],["몇 가지 부분이나 요소들을 모아서 일정한 전체를 짜 이룸. 또는 그 이룬 결과.","구성 성분."]],1,[]],["생식(生殖)","명사",0,"날 생, 불릴 식",[["낳아서 불림.","우리 조상들이 모든 것의 생식이나 생성을 원했던 건 분명해.≪황순원, 움직이는 성≫"]],1,[]],["사항(事項)","명사",0,"일 사, 항목 항",[["일의 항목이나 내용.","참고 사항."]],1,[]],["전투(戰鬪)","명사",0,"싸움 전, 싸움 투",[["두 편의 군대가 조직적으로 무장하여 싸움.","전투가 벌어지다."]],1,[]],["갓","명사",0,"",[["예전에, 어른이 된 남자가 머리에 쓰던 의관의 하나. 가는 대오리로 갓양태와 갓모자를 만들어 붙인 위에 갓싸개를 바르고 먹칠과 옻칠을 한 것인데 갓끈을 달아서 쓴다.","갓을 벗다."],["십자화과의 두해살이풀. 높이는 1미터 정도이며, 근생엽은 넓은 타원형이고 경엽은 피침 모양이다. 봄부터 여름에 걸쳐 누런 꽃이 총상(總狀) 화서로 핀다. 채소로 재배하며 잎과 줄기는 식용한다.",""]],1,[]],["의무(義務)","명사",0,"옳을 의, 힘쓸 무",[["마땅히 해야 할 일.","당연한 의무.","وَاجِب"],["사람으로서 마땅히 하여야 할 일. 곧 맡은 직분.","아버지의 의무."]],1,[]],["특징(特徵)","명사",0,"특별할 특, 부를 징",[["다른 것에 비하여 특별히 눈에 뜨이는 점.","특징을 보이다."]],1,[]],["필요(必要)","명사",0,"반드시 필, 요긴할 요",[["반드시 요구되는 바가 있음.","필요 물품."]],1,[]],["세조(世祖)","명사",0,"인간 세, 할아비 조",[["공이 큰 제왕에게 붙이던 묘호. 중국에서는 태조, 고조, 태종에 이어 조정(朝廷)의 기초를 닦은 천자에게 이를 붙였다.",""]],1,[]],["헝겊","명사",0,"",[["피륙의 조각.","헝겊 조각."]],1,[]],["일정(日程)","명사",0,"날 일, 한도 정",[["일정한 기간 동안 해야 할 일. 또는 그 일을 하기 위해 짜 놓은 계획.","공사 일정.","جدول أعمال"],["일정한 기간 동안 해야 할 일의 계획을 날짜별로 짜 놓은 것. 또는 그 계획.","수학여행 일정."]],1,[]],["계(計)","명사",0,"셀 계",[["한데 합하여 계산함. 또는 그런 수효.","계를 내다."]],1,[]],["얼마","명사",0,"",[["잘 모르는 수량, 값, 정도.","이 가방 얼마예요?","كم ، بكم ، كم ثمن ، بعض"],["잘 모르는 수량이나 정도.","이 구두의 값이 얼마요?"]],1,[]],["어려움","명사",0,"",[["어려운 것.","어려움이 많다."]],1,[]],["떼","명사",0,"",[["사람이나 동물이 한데 많이 모여 있는 것.","양 떼.","سِرْب، حَشْد"],["목적이나 행동을 같이하는 무리.","양 떼."],["부당한 요구나 청을 들어달라고 고집하는 짓.","떼를 쓰다."]],1,[]],["시체(屍體)","명사",0,"주검 시, 몸 체",[["죽은 사람의 몸을 이르는 말.","시체를 화장하다."]],1,[]],["입자(粒子)","명사",0,"낟알 입, 아들 자",[["물질을 이루는 아주 작은 크기의 물체.","입자 배열.","جُسيْم"],["물질을 구성하는 미세한 크기의 물체. 소립자, 원자, 분자, 콜로이드 따위를 이른다.","전기를 띠고 있는 입자를 대전 입자라고 한다."]],1,[]],["기(氣)","명사",0,"기운 기",[["활동의 바탕이 되는 힘.","기가 나다.","قُوَّةٌ ، طَاقَةٌ ، حَيَوِيَّةٌ"],["활동하는 힘.","기가 죽다."]],1,[]],["꿀","명사",0,"",[["꿀벌이 꽃에서 빨아들여 벌집 속에 모아 두는, 달콤하고 끈끈한 액체. 그 성분은 대부분 당분(糖分)이며 식용하거나 약으로 쓴다.","벌통에서 꿀을 따다."]],1,[]],["경전(經典)","명사",0,"지날 경, 법 전",[["옛 성현의 가르침을 적은 책.","경전을 공부하다.","الكِتَاب المُقَدَّس"],["성현이 지은, 또는 성현의 말이나 행실을 적은 책.","서재에 앉아서 성현들의 경전과 정주의 서(書), 퇴계의 문(文)을 정독하였다."]],1,[]],["사리","명사",0,"",[["국수나 새끼, 실 등을 동그랗게 포개어 감은 뭉치.","낚시줄 사리.","كُتْلَة"],["국수, 새끼, 실 따위를 동그랗게 포개어 감은 뭉치.","사리 추가."]],1,[]],["바깥","명사",0,"",[["밖이 되는 곳.","따스한 바깥 날씨."]],1,[]],["부호(符號)","명사",0,"부호 부, 이름 호",[["어떤 뜻을 나타내려고 따로 정하여 쓰는 기호.","부호 표기.","إِشَارَة"],["일정한 뜻을 나타내기 위하여 따로 정하여 쓰는 기호.","부호를 넣다."]],1,[]],["석유(石油)","명사",0,"돌 석, 기름 유",[["땅속에서 천연으로 나는, 탄화수소를 주성분으로 하는 가연성 기름. 검은 갈색을 띤 액체인 천연 그대로의 것을 원유라 하는데 이것을 증류하여 휘발유, 등유, 경유, 중유, 석유 피치, 아스팔트 따위를 얻는다. 동력의 연료와 공업용으로 널리 쓴다.","석유 제품."]],1,[]],["돌기(突起)","명사",0,"갑자기 돌, 일어날 기",[["뾰족하게 내밀거나 도드라짐. 또는 그런 부분.","가시 돌기."]],1,[]],["공사(公私)","명사",0,"공평할 공, 사사 사",[["공공의 일과 사사로운 일을 아울러 이르는 말.","공사를 엄격히 구분하다."]],1,[]],["반찬(飯饌)","명사",0,"밥 반, 반찬 찬",[["밥에 곁들여 먹는 음식을 통틀어 이르는 말.","반찬 투정."]],1,[]],["직무(職務)","명사",0,"직분 직, 힘쓸 무",[["직책이나 직업상에서 책임을 지고 담당하여 맡은 사무.","직무 수행."]],1,[]],["경기도(京畿道)","명사",0,"서울 경, 경기 기, 길 도",[["우리나라 중서부에 있는 도. 마한의 땅이었다가 뒤에 신라의 땅이 되었고, 고려 시대에 지금의 이름이 되었다. 도청 소재지는 수원(水原)이다. 면적은 약 10,185㎢.",""]],1,[]],["원년(元年)","명사",0,"으뜸 원, 해 년",[["새로운 임금이 자리에 오른 해. 또는 임금이 자리에 오른 다음 해.","세종 원년.","السنة الأولى من الحكم"],["임금이 즉위한 해. 또는 임금이 즉위한 이듬해.","중종 원년."]],1,[]],["장기(將棋/將碁)","명사",0,"장수 장, 바둑 기 / 장수 장, 바둑 기",[["나무로 만든 32짝의 말을 붉은 글자와 푸른 글자의 두 종류로 나누어 판 위에 벌여 놓고 서로 번갈아 가며 공격과 수비를 교대로 하여 승부를 가리는 놀이. 또는 그런 놀이를 하는 데 쓰는 기구.","장기를 두다."]],1,[]],["쓰기","명사",0,"",[["국어 학습에서, 글 쓰는 사람의 생각이나 느낌을 글로 정확하게 표현하는 일.","말하기 능력과 쓰기 능력."]],1,[]],["방위(方位)","명사",0,"모 방, 자리 위",[["공간의 어떤 점이나 방향이 한 기준의 방향에 대하여 나타내는 어떠한 쪽의 위치. 동서남북의 네 방향을 기준으로 하여 8방향, 16방향, 32방향으로 세분한다.","방위를 보다."]],1,[]],["태종(太宗)","명사",0,"클 태, 마루 종",[["한 왕조에서 공덕이 태조에 버금가는 임금에게 붙이던 묘호.",""]],1,[]],["학설(學說)","명사",0,"배울 학, 말씀 설",[["학술적 문제에 대하여 주장하는 이론 체계.","새 학설을 정립하다."]],1,[]],["화폐(貨幣)","명사",0,"재물 화, 화폐 폐",[["상품 교환 가치의 척도가 되며 그것의 교환을 매개하는 일반화된 수단. 주화, 지폐, 은행권 따위가 있다.","화폐의 가치."]],1,[]],["사고(事故)","명사",0,"일 사, 연고 고",[["예상하지 못하게 일어난 좋지 않은 일.","불의의 사고.","حَادِثَة"],["뜻밖에 일어난 불행한 일.","자동차 사고."],["어떤 일이 일어난 까닭.","그가 결근한 사고를 알아보아라."]],1,[]],["숙종(肅宗)","명사",0,"엄숙할 숙, 마루 종",[["조선 제19대 왕(1661~1720). 이름은 순(焞). 자는 명보(明普). 대동법을 확대 실시 하고, 백두산에 정계비를 세워 국경을 확대하였다. 재위 기간은 1674~1720년이다.",""]],1,[]],["돼지","명사",0,"",[["몸이 뚱뚱하고 다리와 꼬리가 짧고 눈이 작은, 고기를 먹기 위해 기르는 짐승.","돼지 한 마리.","خِنْزِير"],["멧돼짓과의 포유류. 몸무게는 200~250kg이며, 다리와 꼬리가 짧고 주둥이가 삐죽하다. 잡식성으로 온순하며 건강하다. 임신 4개월 만에 8~15마리의 새끼를 낳는다. 멧돼지를 길들여 가축으로 만든 것인데, 중요한 축산 동물의 하나로 모양과 색깔이 다른 여러 품종이 있다.","돼지를 도축하다."]],1,[]],["비교적(比較的)","명사",0,"견줄 비, 견줄 교, 과녁 적",[["다른 것과 견주어서 판단하는 것.","비교적인 관점."]],1,[]],["서부(西部)","명사",0,"서녘 서, 떼 부",[["어떤 지역의 서쪽 부분.","대보름에는 동네별로 동부와 서부로 편을 나누어 줄다리기를 하였다."]],1,[]],["계약(契約)","명사",0,"맺을 계, 맺을 약",[["관련되는 사람이나 조직체 사이에서 서로 지켜야 할 의무에 대하여 글이나 말로 정하여 둠. 또는 그런 약속.","우리는 서로의 비밀을 다른 사람에게 말하지 않기로 계약을 맺었어요."]],1,[]],["수행(修行)","명사",0,"닦을 수, 다닐 행",[["몸과 마음을 바르게 갈고 닦음.","오랜 수행.","مُمَارَسَةُ الزُّهْد"],["행실, 학문, 기예 따위를 닦음.","수행을 쌓다."]],1,[]],["부부(夫婦)","명사",0,"지아비 부, 며느리 부",[["남편과 아내를 아울러 이르는 말.","부부 관계."]],1,[]],["나중","명사",0,"",[["일정한 시간이 지난 뒤.","나중에 가다.","بَعْدَ"],["얼마의 시간이 지난 뒤.","나중에 만납시다."]],1,[]],["여성(女性)","명사",0,"계집 여, 성품 성",[["어른이 되어 아이를 낳을 수 있는 여자.","십대 여성.","اِمْرَأَة"],["성(性)의 측면에서 여자를 이르는 말. 특히, 성년(成年)이 된 여자를 이른다.","여성 고객."]],1,[]],["정책(政策)","명사",0,"정사 정, 꾀 책",[["정치적 목적을 실현하기 위한 방책.","정책 수립."]],1,[]],["교회(敎會)","명사",0,"가르칠 교, 모일 회",[["예수 그리스도를 주(主)로 고백하고 따르는 신자들의 공동체. 또는 그 장소.","그는 일요일마다 교회에 나간다."]],1,[]],["뿌리줄기","명사",0,"",[["수평으로 자라는 땅속줄기의 한 형태. 대부분 땅속으로 뻗어 자라나 드물게는 지표를 옆으로 타고 올라 뿌리·줄기·잎을 내며, 뿌리처럼 보인다. 연꽃, 둥굴레, 대나무, 고사리 따위에서 볼 수 있다.",""]],1,[]],["병사(兵士)","명사",0,"병사 병, 선비 사",[["예전에, 군인이나 군대를 이르던 말.",""]],1,[]],["물의(物議)","명사",0,"물건 물, 의논할 의",[["(대개 부정적인 뜻으로 쓰여) 어떤 사람 또는 단체의 처사에 대하여 많은 사람이 이러쿵저러쿵 논평하는 상태.","물의를 빚다."]],1,[]],["공공(公共)","명사",0,"공평할 공, 한가지 공",[["국가나 사회의 구성원에게 두루 관계되는 것.","공공 기관."]],1,[]],["국","명사",0,"",[["고기나 생선, 채소 등에 물을 많이 붓고 끓인 음식.","뜨거운 국.","شُورْبَة, حَسَاء"],["고기, 생선, 채소 따위에 물을 많이 붓고 간을 맞추어 끓인 음식.","국 한 그릇."]],1,[]],["밀","명사",0,"",[["볏과의 한해살이풀 또는 두해살이풀. 높이는 0.9~1.5미터로 마디가 있고 속은 비어 있다. 꽃이삭은 6~12cm이고 줄기 끝에 달리는데 방추형이다. 중요한 농산물의 하나로 기원전 3~4천 년부터 재배하여 왔으며, 현재 세계의 농작물 가운데 가장 넓은 재배 면적을 차지하고 있다. 간장, 된장, 빵, 과자 따위의 원료로 쓴다. 아프가니스탄에서 카스피해 지역이 원산지이다.",""]],1,[]],["지름","명사",0,"",[["원이나 구 따위에서, 중심을 지나는 직선으로 그 둘레 위의 두 점을 이은 선분. 또는 그 선분의 길이.",""]],1,[]],["머리털","명사",0,"",[["머리에 난 털.","그녀의 긴 머리털은 윤이 나고 탐스러웠다."]],1,[]],["해안(海岸)","명사",0,"바다 해, 언덕 안",[["바다와 육지가 맞닿은 부분.","해안 경비."]],1,[]],["질서(秩序)","명사",0,"차례 질, 차례 서",[["많은 사람들이 모인 곳에서 혼란스럽지 않도록 지키는 순서나 차례.","질서가 무너지다.","نِظَام"],["사람들이나 물건들이 혼란스럽지 않게 정돈되어 있는 모습. 또는 그러기 위해 지켜야 하는 규칙.","도덕 질서."]],0,[]],["붉은빛","명사",0,"",[["사람의 입술이나 피의 빛깔과 같이 짙고 선명한 빛.","붉은빛을 띠다."]],1,[]],["동북부(東北部)","명사",0,"동녘 동, 북녘 북, 떼 부",[["동북쪽에 있는 지역.","천안은 충청남도의 동북부에 있는 도시이다."]],1,[]],["눈물","명사",0,"",[["눈알 바깥면의 위에 있는 눈물샘에서 나오는 분비물. 늘 조금씩 나와서 눈을 축이거나 이물질을 씻어 내는데, 자극이나 감동을 받으면 더 많이 나온다.","눈물을 글썽이다."]],1,[]],["누에","명사",0,"",[["누에나방의 애벌레. 13개의 마디로 이루어졌으며 몸에는 검은 무늬가 있다. 알에서 나올 때에는 검은 털이 있다가 뒤에 털을 벗고 잿빛이 된다. 네 번 잠을 잘 때마다 꺼풀을 벗고 25여 일 동안 8cm 정도 자란 다음 실을 토하여 고치를 짓는다. 고치 안에서 번데기가 되었다가 다시 나방이 되어 나온다.","누에를 올리다."]],1,[]],["권력(權力)","명사",0,"권세 권, 힘 력",[["남을 복종시키거나 지배할 수 있는 공인된 권리와 힘. 특히 국가나 정부가 국민에 대하여 가지고 있는 강제력을 이른다.","권력 강화."]],1,[]],["기분(氣分)","명사",0,"기운 기, 나눌 분",[["불쾌, 유쾌, 우울, 분노 등의 감정 상태.","개운한 기분.","مَشَاعِر، مِزَاج"],["대상·환경 따위에 따라 마음에 절로 생기며 한동안 지속되는, 유쾌함이나 불쾌함 따위의 감정.","기분이 좋다."]],1,[]],["광석(鑛石)","명사",0,"쇳돌 광, 돌 석",[["경제적 가치가 있고 채광할 수 있는 광물. 또는 그런 광물의 집합체.","알루미늄 광석."]],1,[]],["거문고","명사",0,"",[["우리나라 현악기의 하나. 오동나무와 밤나무를 붙여 만든 장방형의 통 위에 명주실을 꼬아 만든 여섯 개의 줄이 걸쳐 있다. 술대로 줄을 뜯어서 연주하는데, 관현악에 반드시 편성되며 독주 악기로도 널리 사용한다.","거문고를 뜯다."]],1,[]],["거래(去來)","명사",0,"갈 거, 올 래",[["돈이나 물건을 주고받거나 사고팖.","대량 거래.","تَعَامُلٌ تِجَارِيٌّ"],["주고받음. 또는 사고팖.","거래가 이루어지다."]],1,[]],["혼인(婚姻)","명사",0,"혼인할 혼, 혼인 인",[["남자와 여자가 부부가 되는 일.","혼인 서약."]],1,[]],["먹이","명사",0,"",[["동물이 살아가기 위하여 먹어야 할 거리. 또는 사육하는 가축에게 주는 먹을거리.","소에게 먹이로 여물을 주다."]],1,[]],["대사(大事)","명사",0,"클 대, 일 사",[["다루는 데 힘이 많이 들고 중요한 일.","국가의 대사.","عَمَل مُهِمّ"],["다루는 데 힘이 많이 들고 범위가 넓은 일. 또는 중대한 일.","대사를 치르다."]],1,[]],["의지(意志)","명사",0,"뜻 의, 뜻 지",[["어떠한 일을 이루고자 하는 마음.","굳은 의지."]],1,[]],["관직(官職)","명사",0,"벼슬 관, 직분 직",[["직무의 일반적 종류를 뜻하는 관(官)과 구체적 범위를 뜻하는 직(職)을 통틀어 이르는 말.","조선의 관직 체계."]],1,[]],["각종(各種)","명사",0,"각각 각, 씨 종",[["온갖 종류. 또는 여러 종류.","각종 참고서."]],1,[]],["자료(資料)","명사",0,"재물 자, 헤아릴 료",[["연구나 조사 따위의 바탕이 되는 재료.","자료 검색."],["만들거나 이루는 데 바탕이 되는 물자나 재료.","건축용 자료."]],1,[]],["원나라(元나라)","명사",0,"으뜸 원",[["1271년에 몽고 제국의 제5대 황제 쿠빌라이가 대도(大都)에 도읍하고 세운 나라. 1279년에 남송을 멸망시키고, 중국 본토를 중심으로 몽고, 티베트를 영유하여 몽고 지상주의 입장에서 민족적 신분제를 세웠으나 1368년에 주원장을 중심으로 한 한족의 봉기로 망하였다.",""]],1,[]],["대어(大魚)","명사",0,"클 대, 물고기 어",[["큰 물고기.","대어 낚시."]],1,[]],["고무","명사",0,"",[["고무나무의 껍질에서 분비하는 액체를 응고시켜 만든 생고무를 주원료로 하는 물질. 탄력성이 강하고 신축성이 좋으며 전기나 물, 가스를 통과시키지 않아 공업용품이나 생활용품으로 널리 쓰인다.","이 부분은 고무로 만들어서 탄력성이 좋다."]],1,[]],["예수(←Jesus)","명사",0,"",[["기독교의 창시자(B.C.4?~A.D.30?). 처녀 마리아에게 성령으로 잉태되어 베들레헴에서 태어나 30세쯤에 세례 요한에게 세례를 받고 복음을 전파하다가 바리새인들에 의하여 십자가에 못 박혀 죽었다. 그의 예언대로 죽은 지 사흘 만에 부활하고 40일 후 승천하였다고 한다.",""]],1,[]],["농작물(農作物)","명사",0,"농사 농, 지을 작, 물건 물",[["논밭에 심어 가꾸는 곡식이나 채소.","농작물 수확."]],1,[]],["부서(部署)","명사",0,"떼 부, 마을 서",[["기관, 기업, 조직 따위에서 일이나 사업의 체계에 따라 나뉘어 있는, 사무의 각 부문.","생산 부서."]],1,[]],["적(敵)","명사",0,"대적할 적",[["서로 싸우거나 해치려고 하는 상대.","적의 전술.","عدوّ"],["서로 싸우거나 해치고자 하는 상대.","적과 싸우다."]],1,[]],["기독교(基督敎)","명사",0,"터 기, 감독할 독, 가르칠 교",[["예수 그리스도의 인격과 교훈을 중심으로 하는 종교. 천지 만물을 창조한 유일신을 섬기고, 그 독생자 예수 그리스도를 구세주로 믿는다. 팔레스타인에서 일어나 로마 제국의 국교가 되었고, 다시 페르시아·인도·중국 등지에 전해졌다. 11세기에 그리스 정교회가 갈려 나갔고, 16세기 종교 개혁으로 로마 가톨릭교회는 구교인 가톨릭교와 신교로 분리되어 현재 세 교회로 나뉘어 있다.","근현대사 책을 통해 기독교가 한국에 전파된 과정을 배웠다."]],1,[]],["저녁","명사",0,"",[["해가 지기 시작할 때부터 밤이 될 때까지의 동안.","늦은 저녁.","مساء، عشية"],["해가 질 무렵부터 밤이 되기까지의 사이.","입추가 지나니 저녁에는 제법 선선하다."]],1,[]],["노벨(Nobel, Alfred Bernhard)","명사",0,"",[["스웨덴의 공업 기술자·화학자(1833~1896). 다이너마이트, 무연 화약 따위를 발명하였고 노벨상을 창설하였다.",""]],1,[]],["증권(證券)","명사",0,"증거 증, 문서 권",[["증거가 되는 문서나 서류.",""]],1,[]],["통일(統一)","명사",0,"거느릴 통, 한 일",[["나누어지거나 갈라진 것들을 합쳐서 하나가 되게 함.","삼국 통일.","تَوْحِيد"],["나누어진 것들을 합쳐서 하나의 조직·체계 아래로 모이게 함.","통일 방안."]],1,[]],["땀","명사",0,"",[["덥거나 몸이 아프거나 긴장을 했을 때 피부를 통해 나오는 짭짤한 맑은 액체.","땀이 나다.","عَرَق"],["사람의 피부나 동물의 살가죽에서 나오는 찝찔한 액체. 염분·지방산·요소 따위가 있어 특유한 냄새가 나는데, 주로 날씨가 덥거나 운동을 하거나 긴장을 하거나 병으로 몸에서 열이 날 때 분비된다.","땀이 나다."]],1,[]],["바둑","명사",0,"",[["두 사람이 검은 돌과 흰 돌을 나누어 가지고 바둑판 위에 번갈아 하나씩 두어 가며 승부를 겨루는 놀이. 두 집 이상이 있어야 살며, 서로 에워싼 집을 많이 차지하면 이긴다.","바둑 급수."],["바둑을 둘 때에 쓰는 둥글납작한 돌. 흰 돌과 검은 돌의 두 가지이며 상수(上手)가 흰 돌을 차지한다.",""]],1,[]],["천체(天體)","명사",0,"하늘 천, 몸 체",[["우주에 존재하는 모든 물체. 항성, 행성, 위성, 혜성, 성단, 성운, 성간 물질, 인공위성 따위를 통틀어 이르는 말이다.",""]],1,[]],["번뇌(煩惱)","명사",0,"번거로울 번, 번뇌할 뇌",[["마음이 시달려서 괴로워함. 또는 그런 괴로움.","사실 초봉이는 승재를 못 잊어 하는 번뇌가 있기는 있으면서 그러나 이 새로운 생활 환경이 불만인 것은 아니다.≪채만식, 탁류≫"]],1,[]],["이하(以下)","명사",0,"써 이, 아래 하",[["수량이나 정도가 일정한 기준을 포함하여 그보다 적거나 모자란 것.","19세 이하.","أقلّ من ، تحت"],["수량이나 정도가 일정한 기준보다 더 적거나 모자람. 기준이 수량으로 제시될 경우에는, 그 수량이 범위에 포함되면서 그 아래인 경우를 가리킨다.","수준 이하."]],1,[]],["첫째","명사",0,"",[["무엇보다도 앞서는 것. 제일.","첫째로 꼽다.","الأَوَّل"],["무엇보다도 앞서는 것.","신발은 첫째로 발이 편안해야 한다."]],1,[]],["산화(散花/散華)","명사",0,"흩을 산, 꽃 화 / 흩을 산, 빛날 화",[["어떤 대상이나 목적을 위하여 목숨을 바침.",""]],1,[]],["잔치","명사",0,"",[["기쁜 일이 있을 때에 음식을 차려 놓고 여러 사람이 모여 즐기는 일.","축하 잔치."]],1,[]],["깨달음","명사",0,"",[["생각하고 궁리하다 알게 되는 것.","깨달음을 구하다."]],1,[]],["무기(武器)","명사",0,"호반 무, 그릇 기",[["싸움을 할 때 적을 다치게 하거나 죽이기 위해 쓰는 도구.","살상 무기.","سِلَاح"],["전쟁이나 싸움에 사용되는 기구를 통틀어 이르는 말.","무기를 소지하다."]],1,[]],["환경(環境)","명사",0,"고리 환, 지경 경",[["생물이 살아가는 데 영향을 주는 자연 상태나 조건.","자연 환경.","بيئة"],["인간이 생활하는 주위의 상태.","가난한 환경."]],0,[]],["양념","명사",0,"",[["음식의 맛을 좋게 하려고 쓰는 재료.","고춧가루 양념.","توابِل، بُهار، بُهارات"],["음식의 맛을 돋우기 위하여 쓰는 재료를 통틀어 이르는 말. 기름, 깨소금, 파, 마늘, 간장, 된장, 소금, 설탕 따위를 이른다.","양념 그릇."]],1,[]],["직선(直線)","명사",0,"곧을 직, 줄 선",[["굽지 않은 곧은 선.","직선 거리.","خَطّ مُسْتَقِيم"],["꺾이거나 굽은 데가 없는 곧은 선.","직선 도로."]],1,[]],["개가(凱歌)","명사",0,"개선할 개, 노래 가",[["싸움에서 이기고 돌아올 때에 부르는 노래.",""]],1,[]],["성종(成宗)","명사",0,"이룰 성, 마루 종",[["대종가에서 갈려 나와 4대가 지난 새 종가.",""]],1,[]],["도장(道場)","명사",0,"길 도, 마당 장",[["무예를 닦는 곳.","태권도 도장."]],1,[]],["주변(周邊)","명사",0,"두루 주, 가 변",[["어떤 대상의 둘레.","주변 정세."]],1,[]],["시집(媤집)","명사",0,"시집 시",[["남편의 부모가 사는 집. 또는 그 부모의 집안.","시집 식구."]],1,[]],["전국(全國)","명사",0,"온전할 전, 나라 국",[["온 나라.","전국 순회공연."]],1,[]],["김","명사",0,"",[["액체가 열을 받아 기체로 변한 것.","김이 나다.","بُخَار"],["액체가 열을 받아서 기체로 변한 것.","김이 나다."]],1,[]],["격(格)","명사",0,"격식 격",[["주위 환경이나 사회에 어울리는 수준이나 품위.","격이 낮다.","مَكَانَة ، مَنْزِلَة ، مَرْتَبَة"],["주위 환경이나 형편에 자연스럽게 어울리는 분수나 품위.","격에 맞다."]],1,[]],["똥","명사",0,"",[["사람이나 동물이 먹은 음식물이 소화되어 몸 밖으로 나오는 냄새 나는 찌꺼기.","더러운 똥.","بُرَاز، رَوْث"],["사람이나 동물이 먹은 음식물을 소화하여 항문으로 내보내는 찌꺼기.","똥을 누다."]],1,[]],["벼","명사",0,"",[["볏과의 한해살이풀. 줄기는 높이가 1~1.5미터이고 속이 비었으며, 마디가 있다. 잎은 어긋나고 긴 선 모양에 평행맥이 있고 엽초(葉鞘)와 잎사귀로 구분된다. 꽃은 첫가을에 원추(圓錐) 화서로 줄기 끝에 피는데 암술은 한 개, 수술은 세 개, 밑씨는 한 개 있다. 꽃잎은 없고 꽃술을 싸 주는, 포엽의 일종인 안 껍질과 속껍질의 영(穎)이 있고 가시랭이가 있는 것과 없는 것이 있다. 동인도가 원산지로 각지의 논이나 밭에 심는다.","가을에 벼를 베다."]],1,[]],["무릎","명사",0,"",[["넙다리와 정강이의 사이에 앞쪽으로 둥글게 튀어나온 부분.","무릎 꿇고 기도하다."]],1,[]],["전문(專門/顓門)","명사",0,"오로지 전, 문 문 / 오로지 전, 문 문",[["어떤 분야에 상당한 지식과 경험을 가지고 오직 그 분야만 연구하거나 맡음. 또는 그 분야.","전문 경영인."]],1,[]],["농산물(農産物)","명사",0,"농사 농, 낳을 산, 물건 물",[["농업에 의하여 생산된 물자. 곡식, 채소, 과일, 달걀, 특용 작물, 화훼 따위가 있다.","농산물 가공."]],1,[]],["항공기(航空機)","명사",0,"배 항, 빌 공, 틀 기",[["사람이나 물건을 싣고 공중을 비행할 수 있는 탈것을 통틀어 이르는 말. 미사일이나 우주 로켓 따위는 포함하지 않는다.","항공기 운항."]],1,[]],["사할린(Sakhalin)","명사",0,"",[["러시아 동부, 오호츠크해에 있는 섬. 하바롭스크 지방의 한 주(州)를 이루며, 북부에서는 석유가 나고 남부에서는 석탄이 난다. 러일 전쟁 후 남반부는 일본 영토로 되었다가 제이 차 세계 대전 후에 러시아가 점령하였다. 면적은 7만 4066㎢.",""]],1,[]],["겹","명사",0,"",[["면과 면 또는 선과 선이 포개진 상태. 또는 그러한 상태로 된 것.","겹으로 된 창문.","طَيّ"],["물체의 면과 면 또는 선과 선이 포개진 상태. 또는 그러한 상태로 된 것.","겹으로 된 창문."]],1,[]],["복(福)","명사",0,"복 복",[["살면서 누리는 행운.","복이 많다.","نِعْمَة"],["어떤 대상으로 인해 얻게 되는 행복.","남자 복."]],0,[]],["모음(母音)","명사",0,"어미 모, 소리 음",[["성대의 진동을 받은 소리가 목, 입, 코를 거쳐 나오면서, 그 통로가 좁아지거나 완전히 막히거나 하는 따위의 장애를 받지 않고 나는 소리. ‘ㅏ’, ‘ㅑ’, ‘ㅓ’, ‘ㅕ’, ‘ㅗ’, ‘ㅛ’, ‘ㅜ’, ‘ㅠ’, ‘ㅡ’, ‘ㅣ’ 따위가 있다.",""]],1,[]],["선수(先手)","명사",0,"먼저 선, 손 수",[["남이 하기 전에 먼저 하는 행동.","선수를 놓다.","اِسْتِبَاق"],["남이 하기 전에 앞질러 하는 행동.","선수를 빼앗기다."]],1,[]],["암석(巖石)","명사",0,"바위 암, 돌 석",[["지각을 구성하고 있는 단단한 물질. 화성암, 퇴적암, 변성암으로 크게 나눈다.","풍화 작용으로 암석이 깎이다."]],1,[]],["에스파냐(España)","명사",0,"",[["유럽 서남부 이베리아반도 대부분을 차지하는 입헌 군주국. 15세기 말 왕국이 성립되어 번영하였으며, 1931년에 공화국이 되었다가 1975년에 왕정(王政)이 복고되었다. 농업이 주산업이고, 관광 수입도 중요한 수입원의 하나이다. 주민은 라틴계로, 대부분 가톨릭교도이고 주요 언어는 에스파냐어이다. 수도는 마드리드, 면적은 50만 4742㎢.",""]],1,[]],["놀림조(놀림調)","명사",0,"고를 조",[["놀리는 것과 같은 말투나 태도.",""]],1,[]],["재목(材木)","명사",0,"재목 재, 나무 목",[["나무로 된 건축물이나 가구, 악기, 예술품 등을 만드는 데 쓰는 나무.","고급 재목.","خشب"],["목조의 건축물·기구 따위를 만드는 데 쓰는 나무.","집 지을 재목을 마련하다."]],1,[]],["표준(標準)","명사",0,"표할 표, 준할 준",[["사물의 성격이나 정도 등을 알기 위한 근거나 기준.","표준 시간.","مِعْيَار"],["사물의 정도나 성격 따위를 알기 위한 근거나 기준.","표준 시간."]],1,[]],["시각(時刻)","명사",0,"때 시, 새길 각",[["연속되는 시간의 어느 한 지점.","일몰 시각.","وقت ، ساعة"],["시간의 어느 한 시점.","해 뜨는 시각."]],1,[]],["먼지","명사",0,"",[["가늘고 보드라운 티끌.","먼지가 날리다."]],1,[]],["단어(單語)","명사",0,"홑 단, 말씀 어",[["분리하여 자립적으로 쓸 수 있는 말이나 이에 준하는 말. 또는 그 말의 뒤에 붙어서 문법적 기능을 나타내는 말. “철수가 영희의 일기를 읽은 것 같다.”에서 자립적으로 쓸 수 있는 ‘철수’, ‘영희’, ‘일기’, ‘읽은’, ‘같다’와 조사 ‘가’, ‘의’, ‘를’, 의존 명사 ‘것’ 따위이다.","단어의 형성 방법."]],1,[]],["조정(調停)","명사",0,"고를 조, 머무를 정",[["분쟁을 중간에서 화해하게 하거나 서로 타협점을 찾아 합의하도록 함.","의견 조정."]],1,[]],["과일","명사",0,"",[["나무 따위를 가꾸어 얻는, 사람이 먹을 수 있는 열매. 대개 수분이 많고 단맛 또는 신맛이 난다. 사과, 배, 포도, 귤, 감, 밤 따위가 있다.","과일로 술을 빚다."]],1,[]],["정계(政界)","명사",0,"정사 정, 지경 계",[["정치에 관련된 일에 종사하는 조직체나 개인의 활동 분야.","정계와 재계."]],1,[]],["행사(行使)","명사",0,"다닐 행, 하여금 사",[["부려서 씀.","권력 행사."]],1,[]],["장수","명사",0,"",[["장사하는 사람.","사과 장수."]],1,[]],["장미과(薔薇果)","명사",0,"장미 장, 장미 미, 실과 과",[["다수의 수과(瘦果)를 갖는 헛열매의 일종.",""]],1,[]],["독립(獨立)","명사",0,"홀로 독, 설 립",[["남에게 의존하거나 매여 있지 않음.","경제적 독립.","اِعْتِمَاد عَلَى النَّفْس"],["다른 것에 예속하거나 의존하지 아니하는 상태로 됨.","아이의 수면 독립 시기."]],1,[]],["세균(細菌)","명사",0,"가늘 세, 버섯 균",[["생물체 가운데 가장 미세하고 가장 하등에 속하는 단세포 생활체. 다른 생물체에 기생하여 병을 일으키기도 하고 발효나 부패 작용을 하기도 하여 생태계의 물질 순환에 중요한 역할을 한다. 구조는 엽록체와 미토콘드리아가 없이 세포막과 원형질만으로 간단하게 이루어져 있으며, 육안으로는 볼 수 없다. 공 모양, 막대 모양, 나선 모양 따위가 있다.","세균 감염."]],1,[]],["결합(結合)","명사",0,"맺을 결, 합할 합",[["둘 이상의 사물이나 사람이 서로 관계를 맺어 하나가 됨.","물은 산소와 수소의 결합으로 이루어진다."]],1,[]],["끈기(끈氣)","명사",0,"기운 기",[["끈끈한 성질.","끈기가 덜하다.","لُزُوجَةٌ"],["물건의 끈끈한 기운.","멥쌀이 찹쌀보다 끈기가 덜하다."]],1,[]],["살림","명사",0,"",[["한 가정을 이루어 살아가는 일.","살림을 꾸리다.","التدبير المنزلي"],["한집안을 이루어 살아가는 일.","따로 살림을 내다."]],1,[]],["식품(食品)","명사",0,"밥 식, 물건 품",[["사람이 일상적으로 섭취하는 음식물을 통틀어 이르는 말.","식품 가공."]],1,[]],["오줌","명사",0,"",[["혈액 속의 노폐물과 수분이 신장에서 걸러져서 방광 속에 괴어 있다가 요도를 통하여 몸 밖으로 배출되는 액체. 빛깔은 누렇고 지린내가 난다.","오줌을 누다."]],1,[]],["널빤지","명사",0,"",[["나무를 켜서 넓고 얇게 만든 판.","널빤지 한 장."]],1,[]],["바깥쪽","명사",0,"",[["바깥으로 향하는 쪽.","초인종 소리에 문 바깥쪽을 내다보았다."]],1,[]],["판단(判斷)","명사",0,"판단할 판, 끊을 단",[["사물을 인식하여 논리나 기준 등에 따라 판정을 내림.","상황 판단."]],1,[]],["기슭","명사",0,"",[["비탈진 산이나 언덕의 아랫부분.","언덕 기슭.","سَفْح"],["산이나 처마 따위에서 비탈진 곳의 아랫부분.","북한산 기슭의 양지바른 곳에 묘소를 잡아 장례를 지냈다."],["바다나 강 따위의 물과 닿아 있는 땅.","아이들은 학교에서 돌아갈 때는 언제나 개울 기슭에서 물장난을 했다."]],1,[]],["바닷가","명사",0,"",[["바닷물과 땅이 서로 닿은 곳이나 그 근처.","흰 물결이 밀려오는 바닷가."]],1,[]],["수의(囚衣)","명사",0,"가둘 수, 옷 의",[["죄수가 입는 옷.","그는 수의를 입고 증인석에 앉았다."]],1,[]],["자유(自由)","명사",0,"스스로 자, 말미암을 유",[["외부적인 구속이나 무엇에 얽매이지 아니하고 자기 마음대로 할 수 있는 상태.","자유를 누리다."]],1,[]],["조세(租稅)","명사",0,"조세 조, 세금 세",[["국가 또는 지방 공공 단체가 필요한 경비로 사용하기 위하여 국민이나 주민으로부터 강제로 거두어들이는 금전. 국세와 지방세가 있다.","조세 납부."]],1,[]],["욕심(欲心/慾心)","명사",0,"하고자할 욕, 마음 심 / 욕심 욕, 마음 심",[["분수에 넘치게 무엇을 탐내거나 누리고자 하는 마음.","욕심이 나다."]],1,[]],["제주도(濟州島)","명사",0,"건널 제, 고을 주, 섬 도",[["우리나라 남쪽에 있는 가장 큰 화산섬. 목축업, 농업, 임업, 수산업, 관광 사업이 발달하였다. 명승지로 백록담, 삼성혈, 용두암, 만장굴, 천지연 폭포 따위가 있다. 면적은 1832.95㎢.",""]],1,[]],["취산(聚散)","명사",0,"모을 취, 흩을 산",[["모임과 흩어짐.","화목한 가족이, 친한 벗들이 얼마나 장구한 세월을 함께 보낼 수가 있을까. 취산의 인과가 바람에 불려 날아가는 콩깍지처럼 스스로의 뜻이 아니다.≪황석영, 장길산≫"]],1,[]],["제이(J / j)","명사",0,"",[["영어 알파벳의 열 번째 자모 이름.",""]],1,[]],["뒷면(뒷面)","명사",0,"낯 면",[["뒤쪽 면.","봉투 뒷면.","جَانِب خَلْفِيّ"],["물체의 뒤쪽 면.","수표 뒷면."]],1,[]],["소식(消息)","명사",0,"사라질 소, 쉴 식",[["멀리 떨어져 있는 사람의 사정을 알리는 말이나 글.","고향 소식."]],1,[]],["고을","명사",0,"",[["조선 시대에, 주(州)·부(府)·군(郡)·현(縣) 등을 두루 이르던 말.",""]],1,[]],["장단","명사",0,"",[["춤이나 노래의 빠르기를 조절하는 박자.","기본 장단.","إِيقَاع"],["춤, 노래 따위의 빠르기나 가락을 주도하는 박자. 한자를 빌려 ‘長短’으로 적기도 한다.","그는 장단에 맞추어 학춤을 추었다."]],1,[]],["염증(炎症)","명사",0,"불꽃 염, 증세 증",[["생체 조직이 손상을 입었을 때에 체내에서 일어나는 방어적 반응. 예를 들어 외상이나 화상, 세균 침입 따위에 대하여 몸의 일부에 충혈, 부종, 발열, 통증을 일으키는 증상이다.","염증을 일으키다."]],1,[]],["왕조(王朝)","명사",0,"임금 왕, 아침 조",[["같은 왕가에 속하는 통치자의 계열. 또는 그 왕가가 다스리는 시대.","세습 왕조."]],1,[]],["중심지(中心地)","명사",0,"가운데 중, 마음 심, 땅 지",[["어떤 일이나 활동의 중심이 되는 곳.","교통의 중심지."]],1,[]],["형제(兄弟)","명사",0,"형 형, 아우 제",[["형과 남동생.","아들 형제.","إخوة"],["형과 아우를 아울러 이르는 말.","그는 슬하에 아들 형제만 두었다."]],1,[]],["혼자","명사",0,"",[["다른 사람과 어울리거나 함께 있지 아니하고 그 사람 한 명만 있는 상태.","나 혼자라는 생각."]],1,[]],["공동(共同)","명사",0,"한가지 공, 한가지 동",[["둘 이상의 사람이나 단체가 함께 일을 하거나, 같은 자격으로 관계를 가짐.","공동 1위."]],1,[]],["정성(精誠)","명사",0,"정할 정, 정성 성",[["온갖 힘을 다하려는 참되고 성실한 마음.","정성 어린 선물."]],1,[]],["당시(當時)","명사",0,"마땅 당, 때 시",[["일이 있었던 바로 그때. 또는 이야기하고 있는 그 시기.","구한말 당시의 국제 정세."]],1,[]],["입안(立案)","명사",0,"설 입, 책상 안",[["어떤 안(案)을 세움. 또는 그 안건.","정책 입안."]],1,[]],["주인(主人)","명사",0,"임금 주, 사람 인",[["대상이나 물건을 자기의 것으로 가진 사람.","음식점 주인.","صاحب، مالك"],["대상이나 물건 따위를 소유한 사람.","가게 주인."]],1,[]],["입장(立場)","명사",0,"설 입, 마당 장",[["당면하고 있는 상황.","입장이 난처하다."]],1,[]],["합성(合成)","명사",0,"합할 합, 이룰 성",[["둘 이상의 것을 합쳐서 하나를 이룸.","사진의 합성."]],1,[]],["연(緣)","명사",0,"인연 연",[["서로 관계를 맺게 되는 인연.","연이 닿으면 또 만납시다."]],1,[]],["장부(丈夫)","명사",0,"어른 장, 지아비 부",[["다 자란 씩씩한 남자.","그놈들이 살아 있었으면 지금쯤 늠름한 장부가 되었을 것을.≪박경리, 토지≫"]],1,[]],["공민왕(恭愍王)","명사",0,"공손할 공, 근심할 민, 임금 왕",[["고려 제31대 왕(1330~1374). 이름은 전(顓). 호는 이재(怡齋)·익당(益當). 왕위에 오른 뒤 중국 원나라를 배척하고 친원파(親元派)인 기씨(奇氏) 일족을 제거하였다. 쌍성총관부를 폐지하였으며, 빼앗긴 영토를 수복하여 국위를 떨쳤으나 나중에는 정치를 그르치고 마침내 최만생(崔萬生)과 홍윤(洪倫)에게 살해되었다. 재위 기간은 1351~1374년이다.",""]],1,[]],["얼룩무늬","명사",0,"",[["본바탕에 다른 빛깔의 점이나 줄 따위가 뚜렷하게 섞인 무늬.","얼룩무늬로 위장된 초소는 국도를 가로지르는 야트막한 구릉 밑에 자리 잡고 있었다.≪김성동, 만다라≫"]],1,[]],["불법(佛法)","명사",0,"부처 불, 법 법",[["‘불교’를 달리 이르는 말.",""]],1,[]],["재판(再版)","명사",0,"두 재, 판목 판",[["한 번 출판했던 책을 다시 출판함. 또는 그렇게 출판한 책.","재판이 되다.","طبعة ثانية لكتاب، إعادة طبع كتاب"],["이미 간행된 책을 다시 출판함. 또는 그런 출판물.","그 작품은 독자들에게 대단한 반향을 불러일으켜 책이 처음 나오자마자 곧 재판에 들어갔다."]],1,[]],["환자(患者)","명사",0,"근심 환, 놈 자",[["병들거나 다쳐서 치료를 받아야 할 사람.","환자를 보살피다."]],1,[]],["상업(商業)","명사",0,"장사 상, 업 업",[["상품을 사고파는 행위를 통하여 이익을 얻는 일.","상업 활동."]],1,[]],["거죽","명사",0,"",[["물체의 겉 부분.","그 아이는 새로 산 책 거죽에 큰 글씨로 자기 이름을 썼다."]],1,[]],["시골","명사",0,"",[["도시에서 떨어져 있는 지역. 주로 도시보다 인구가 적고 개발이 덜 되어 자연을 접하기 쉽다.","공기 좋은 시골.","قرية، الريف"],["도시에서 떨어져 있는 지역. 주로 도시보다 인구수가 적고 인공적인 개발이 덜 돼 자연을 접하기가 쉬운 곳을 이른다.","시골 사람."]],1,[]],["액수(額數)","명사",0,"이마 액, 셈 수",[["돈의 머릿수.","배상 액수."]],1,[]],["전문적(專門的/顓門的)","명사",0,"오로지 전, 문 문, 과녁 적 / 오로지 전, 문 문, 과녁 적",[["어떤 분야에 상당한 지식과 경험을 가지고 그 일을 잘하는 것.","전문적인 지식."]],1,[]],["오스트레일리아(Australia)","명사",0,"",[["오스트레일리아 대륙의 대부분을 차지하는, 영연방의 자치국. 1788년 이래 영국의 유형(流刑) 식민지였으나 1901년에 여섯 주로써 연방을 결성하였으며, 1926년에 사실상의 독립국이 되었다. 세계에서 양모가 가장 많이 나고 밀·설탕·낙농 제품과 철·금·은·석탄 따위가 많이 나며, 주민은 대부분이 영국계 백인이고 주요 언어는 영어이다. 수도는 캔버라, 면적은 768만 6884㎢.",""]],1,[]],["임진왜란(壬辰倭亂)","명사",0,"북방 임, 별 진, 왜나라 왜, 어지러울 란",[["조선 선조 25년(1592)에 일본이 침입한 전쟁. 선조 31년(1598)까지 7년 동안 두 차례에 걸쳐 침입하였으며, 1597년에 재침략한 것을 정유재란으로 달리 부르기도 한다.","임진왜란이 발발하다."]],1,[]],["잠시(暫時)","명사",0,"잠깐 잠, 때 시",[["짧은 시간.","잠시 동안 쉬다."]],1,[]],["과학(科學)","명사",0,"과목 과, 배울 학",[["자연에서 일어나는 현상을 연구하는 학문.","첨단 과학."]],0,[]],["자손(子孫)","명사",0,"아들 자, 손자 손",[["자식과 손자.","직계 자손.","نسل"],["자식과 손자를 아울러 이르는 말.","그분은 자손이 많으시다."]],1,[]],["솜","명사",0,"",[["목화씨에 달라붙은 털 모양의 흰 섬유질. 부드럽고 가벼우며 탄력이 풍부하고 흡습성, 보온성이 있다. 가공하여 직물 따위로 널리 쓴다.","솜 누비옷."]],1,[]],["주민(住民)","명사",0,"살 주, 백성 민",[["일정한 지역에 살고 있는 사람.","아파트 주민."]],1,[]],["이성(理性)","명사",0,"다스릴 이, 성품 성",[["개념적으로 사유하는 능력을 감각적 능력에 상대하여 이르는 말. 인간을 다른 동물과 구별시켜 주는 인간의 본질적 특성이다.","이성에 호소하다."]],1,[]],["처지(處地)","명사",0,"곳 처, 땅 지",[["처하여 있는 사정이나 형편.","처지가 딱하다."]],1,[]],["두해살이풀","명사",0,"",[["그해에 싹이 터서 그 이듬해 자라서 꽃이 피고 열매를 맺은 뒤 죽는 풀. 보리, 무, 유채, 완두 따위가 있다.",""]],1,[]],["광산(鑛山)","명사",0,"쇳돌 광, 메 산",[["광물을 캐내는 곳. 캐내는 광물에 따라 금산(金山), 은산(銀山), 동산(銅山), 철산(鐵山), 탄산(炭山) 따위로 나뉜다.","광산 도시."]],1,[]],["분해(分解)","명사",0,"나눌 분, 풀 해",[["여러 부분이 결합되어 이루어진 것을 그 낱낱으로 나눔.","이 집은 조립식이라 필요에 따라 조립과 분해가 가능하다."]],1,[]],["셋째","명사",0,"",[["처음부터 세어 모두 세 개가 됨.","지수가 오늘 먹은 아이스크림만 해도 이것으로 셋째이다.","الثالث"],["맨 앞에서부터 세어 모두 세 개가 됨을 이르는 말.","그 녀석이 깬 유리창이 이걸로 셋째다."]],1,[]],["가족(家族)","명사",0,"집 가, 겨레 족",[["주로 부부를 중심으로 한, 친족 관계에 있는 사람들의 집단. 또는 그 구성원. 혼인, 혈연, 입양 등으로 이루어진다.","가족을 부양하다."]],1,[]],["날씨","명사",0,"",[["그날그날의 비, 구름, 바람, 기온 따위가 나타나는 기상 상태.","맑은 날씨."]],1,[]],["번호(番號)","명사",0,"차례 번, 이름 호",[["차례를 나타내거나 식별하기 위해 붙이는 숫자.","수험 번호."]],1,[]],["회로(回路)","명사",0,"돌아올 회, 길 로",[["어디를 갔다가 돌아오는 길.","회로에 들르다."],["여러 개의 회로 소자를 서로 접속하여 구성한 전류가 흐르는 통로. 저항, 콘덴서, 유도자 등의 수동 회로 소자와 전압원, 전류원의 전원으로 구성된다.","과학반 학생들은 전기의 특성을 알기 위해 회로 실험을 설계했다."]],1,[]],["스승","명사",0,"",[["자기를 가르쳐서 인도하는 사람.","스승의 가르침."]],1,[]],["운수(運數)","명사",0,"옮길 운, 셈 수",[["이미 정하여져 있어 인간의 힘으로는 어쩔 수 없는 천운(天運)과 기수(氣數).","운수가 좋은 날."]],1,[]],["목표(目標)","명사",0,"눈 목, 표할 표",[["어떤 목적을 이루기 위하여 도달해야 할 구체적인 대상.","정확한 목표.","مَقْصِد"],["어떤 목적을 이루려고 지향하는 실제적 대상으로 삼음. 또는 그 대상.","목표를 달성하다."]],1,[]],["일상적(日常的)","명사",0,"날 일, 떳떳할 상, 과녁 적",[["날마다 볼 수 있는 것.","일상적인 행동."]],1,[]],["삶","명사",0,"",[["사는 일. 또는 살아 있음.","삶의 지혜."]],1,[]],["황색(黃色)","명사",0,"누를 황, 빛 색",[["익은 벼의 빛깔과 같이 다소 어둡고 탁한 색.","차는 이미 먼 길을 달려온 듯 건조한 황색 먼지를 떡가루처럼 부옇게 쓰고 있었다.≪홍성원, 육이오≫"]],1,[]],["시문(詩文)","명사",0,"시 시, 글월 문",[["시가와 산문을 아울러 이르는 말.","당시에 그의 시문을 따를 자가 없었다."]],1,[]],["주름","명사",0,"",[["피부가 노화되어 생긴 줄. 또는 잔금.","주름이 늘다.","جَعْدَة"],["피부가 쇠하여 생긴 잔줄.","나이가 들수록 얼굴에 주름이 늘어 간다."]],1,[]],["철학자(哲學者)","명사",0,"밝을 철, 배울 학, 놈 자",[["철학을 전문적으로 연구하는 사람.","철학은 예술을 절대자의 표현으로 파악하기 때문에 철학자는 예술의 본질을 예술가 자신보다도 더 깊이 통찰하려 한다."]],1,[]],["화(火)","명사",0,"불 화",[["몹시 못마땅하거나 노여워하는 감정.","화가 나다.","غَضَب"],["불에서 느껴지는 뜨거운 기운.",""]],1,[]],["기업(企業)","명사",0,"꾀할 기, 업 업",[["영리(營利)를 얻기 위하여 재화나 용역을 생산하고 판매하는 조직체. 출자(出資) 형태에 따라 사기업(私企業), 공기업(公企業), 공사 합동 기업(公私合同企業)으로 나눈다.","기업을 운영하다."]],1,[]],["목화(木花)","명사",0,"나무 목, 꽃 화",[["아욱과 목화속의 한해살이풀이나 여러해살이풀을 통틀어 이르는 말. 재배 지역에 따라 여러 품종이 있는데 북아메리카의 육지면(陸地綿), 남아메리카의 해도면, 아시아의 재래면 따위가 있다.","목화는 기후에 따라 다양한 품종으로 나뉜다."]],1,[]],["진흙","명사",0,"",[["빛깔이 붉고 물기가 있어 잘 들러붙는 흙.","진흙 구덩이.","طين"],["빛깔이 붉고 차진 흙.","진흙 팩을 얼굴에 바르다."],["질척질척하게 짓이겨진 흙.","진흙을 개다."]],1,[]],["이유(理由)","명사",0,"다스릴 이, 말미암을 유",[["어떠한 결과가 생기게 된 까닭이나 근거.","합리적인 이유.","سَبَب"],["어떠한 결론이나 결과에 이른 까닭이나 근거.","정당한 이유."]],1,[]],["높임말","명사",0,"",[["사람이나 사물을 높여서 이르는 말. ‘아버님’, ‘선생님’ 따위의 직접 높임말, ‘진지’, ‘따님’, ‘아드님’ 따위의 간접 높임말, ‘뵙다’, ‘여쭙다’, ‘드리다’ 따위의 객체 높임말이 있다.","높임말을 쓰다."]],1,[]],["한문(漢文)","명사",0,"한수 한, 글월 문",[["옛날 중국의 문장.","훌륭한 한문.","كتابة صينيّة ، الآداب الصينيّة الكلاسيكيّة"],["중국 고전(古典)의 문장.","서당에서 한문을 배우다."]],1,[]],["특정(特定)","명사",0,"특별할 특, 정할 정",[["특별히 지정함.","특정 계층."]],1,[]],["사기(士氣)","명사",0,"선비 사, 기운 기",[["의욕이나 자신감 따위로 충만하여 굽힐 줄 모르는 기세.","사기가 높다."]],1,[]],["선박(船舶)","명사",0,"배 선, 배 박",[["사람이나 짐 따위를 싣고 물 위로 떠다니도록 나무나 쇠 따위로 만든 물건. 모양과 쓰임에 따라 보트, 나룻배, 기선(汽船), 군함(軍艦), 화물선, 여객선, 유조선 따위로 나눈다.","선박 두 척."]],1,[]],["명칭(名稱)","명사",0,"이름 명, 일컬을 칭",[["사람이나 사물 따위의 이름. 또는 그것을 일컫는 이름.","명칭을 붙이다."]],1,[]],["인조(人造)","명사",0,"사람 인, 지을 조",[["사람이 만듦. 또는 그런 물건.","인조 모피."]],1,[]],["걱정","명사",0,"",[["좋지 않은 일이 있을까 봐 두렵고 불안함.","건강 걱정.","قَلَق"],["안심이 되지 않아 속을 태움.","걱정을 끼치다."]],1,[]],["특산종(特産種)","명사",0,"특별할 특, 낳을 산, 씨 종",[["어떤 지역에서 특별히 나는 품종.","이 산에는 10여 종의 한국 특산종이 자라고 있다."]],1,[]],["손바닥","명사",0,"",[["손의 안쪽. 곧 손금이 새겨진 쪽.","두 손바닥을 비비다."]],1,[]],["하천(河川)","명사",0,"물 하, 내 천",[["강과 시내를 아울러 이르는 말.","하천 유역."]],1,[]],["방송(放送)","명사",0,"놓을 방, 보낼 송",[["라디오나 텔레비전 따위를 통하여 널리 듣고 볼 수 있도록 음성이나 영상을 전파로 내보내는 일. 특정 지역을 대상으로 유선(有線)으로 행하는 것을 포함하기도 한다.","교내 방송."]],1,[]],["무","명사",0,"",[["십자화과의 한해살이풀 또는 두해살이풀. 줄기는 높이가 60~100cm이며, 잎은 깃 모양으로 뿌리에서 뭉쳐나고 뿌리는 둥글고 길다. 뿌리는 잎과 함께 식용하며 비타민, 단백질의 함유량이 많아 약용하기도 한다. 중앙아시아가 원산지로 아시아, 유럽 등지의 온대에서 많은 품종이 재배된다.","김장에 쓸 무를 심었다."]],1,[]],["꾀","명사",0,"",[["일을 잘 꾸며 내거나 해결해 내거나 하는, 묘한 생각이나 수단.","꾀가 많은 사람."]],1,[]],["이온(ion)","명사",0,"",[["전하를 띠는 원자 또는 원자단. 전기적으로 중성인 원자가 전자를 잃으면 양전하를, 전자를 얻게 되면 음전하를 가진 이온이 된다.",""]],1,[]],["경상북도(慶尙北道)","명사",0,"경사 경, 오히려 상, 북녘 북, 길 도",[["우리나라 남동부에 있는 도. 삼한(三韓) 때에는 진한(辰韓), 삼국 시대에는 신라의 땅이었으며, 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 안동이다. 면적은 약 18,420㎢.",""]],1,[]],["나머지","명사",0,"",[["어떤 양을 채우고 남은 부분.","나머지 돈.","بَقَايَا"],["어떤 한도에 차고 남은 부분.","이 돈으로 먼저 등록금을 내고 나머지로는 책을 사라."]],1,[]],["사신(使臣)","명사",0,"하여금 사, 신하 신",[["임금이나 국가의 명령을 받고 외국에 사절로 가는 신하.","사신을 보내다."]],1,[]],["지진(地震)","명사",0,"땅 지, 우레 진",[["오랫동안 누적된 변형 에너지가 갑자기 방출되면서 지각이 흔들리는 일. 지학(地學)에서는, 지구 내부의 한곳에서 급격한 움직임이 일어나 그곳에서 지진파가 시작되어 지표(地表)까지 전하여지는 일을 이른다.","큰 지진."]],1,[]],["강철(鋼鐵)","명사",0,"강철 강, 쇠 철",[["열과 압력을 이용해 단단하게 만든 쇠.","구조용 강철.","فُولَاذ"],["탄소의 함유량이 0.035~1.7%인 철. 열처리에 따라 성질을 크게 변화시킬 수 있어 여러 가지 기계, 기구의 재료로 쓴다.","강철을 제련하다."]],1,[]],["작곡가(作曲家)","명사",0,"지을 작, 굽을 곡, 집 가",[["작곡에 정통하여 전문적인 기술을 가지고 음악 창작에 종사하는 사람.","유명한 작곡가에게 받은 곡에 가수가 직접 노랫말을 붙였다."]],1,[]],["포(包)","명사",0,"쌀 포",[["일정한 양으로 싼 인삼을 세는 단위.","인삼 한 포.","حُزْمَةٌ"],["종이, 피륙, 가죽 따위로 만든 큰 자루.","밀가루 다섯 포."]],1,[]],["소나무","명사",0,"",[["소나뭇과의 상록 침엽 교목. 높이는 35미터 정도이며, 잎은 두 잎이 뭉쳐나고 피침 모양이다. 꽃은 5월에 피고 열매는 구과(毬果)로 다음 해 가을에 맺는다. 건축재, 침목, 도구재 따위의 여러 가지 용도로 쓴다. 한국, 일본, 우수리강, 만주 등지에 분포한다.",""]],1,[]],["부리","명사",0,"",[["새나 일부 짐승의 주둥이. 길고 뾰족하며 보통 뿔의 재질과 같은 딱딱한 물질로 되어 있다.","부리로 쪼다."]],1,[]],["사적(史跡/史蹟)","명사",0,"사기 사, 발자취 적 / 사기 사, 자취 적",[["역사적으로 중요한 사건이나 시설의 흔적.","사적 답사.","مُقَوِّمَات تَارِيخِيَّة"],["역사적으로 중요한 사건이나 시설의 자취.","사적 답사."]],1,[]],["피해(被害)","명사",0,"입을 피, 해할 해",[["생명이나 신체, 재산, 명예 따위에 손해를 입음. 또는 그 손해.","피해를 당하다."]],1,[]],["소련(蘇聯)","명사",0,"되살아날 소, 연이을 련",[["유럽 동부와 아시아 북부에 있었던 연방 공화국. 1917년의 10월 혁명이 성공하여 생긴 최초의 사회주의 국가이다. 옛 제정 러시아의 대부분과 우크라이나를 비롯한 15개 공화국으로 이루어진 다민족 국가였으나 1991년 사회주의가 붕괴되고 연방이 해체되었다. 수도는 모스크바, 면적은 2240만 ㎢.",""]],1,[]],["지도(指導)","명사",0,"가리킬 지, 인도할 도",[["어떤 목적이나 방향으로 다른 사람을 가르쳐 이끎.","엄격한 지도.","إِرْشَاد"],["어떤 목적이나 방향으로 남을 가르쳐 이끎.","지도 편달."]],1,[]],["윗부분(윗部分)","명사",0,"떼 부, 나눌 분",[["전체 가운데 위에 해당되는 범위.","얼굴 윗부분이 아버지를 쏙 빼닮았다."]],1,[]],["주식(株式)","명사",0,"그루 주, 법 식",[["주식회사의 자본을 구성하는 단위.","주식 매각 절차."],["주주의 출자에 대하여 교부하는 유가 증권.",""]],1,[]],["고개","명사",0,"",[["목을 포함한 머리 부분.","고개가 뻣뻣하다.",""],["산이나 언덕을 넘어 다니도록 길이 나 있는 비탈진 곳.","고개를 넘다."],["사람이나 동물의, 목을 포함한 머리 부분.","고개를 젓다."]],1,[]],["함경남도(咸鏡南道)","명사",0,"다 함, 거울 경, 남녘 남, 길 도",[["우리나라 북동부에 있는 도. 옥저·동예·부여의 땅이었으며, 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 함흥이다. 면적은 약 31,977㎢.",""]],1,[]],["연료(燃料)","명사",0,"탈 연, 헤아릴 료",[["연소하여 열, 빛, 동력의 에너지를 얻을 수 있는 물질을 통틀어 이르는 말. 상태에 따라 석탄·코르크·연탄·장작·숯 따위의 고체 연료, 휘발유·경유·타르·알코올 따위의 액체 연료, 도시가스·석탄 가스·천연가스·수성 가스·아세틸렌·수소 따위의 기체 연료가 있다.","연료를 절약하다."]],1,[]],["군청(郡廳)","명사",0,"고을 군, 관청 청",[["군(郡)의 행정 사무를 맡아보는 관청.",""]],1,[]],["인사(人事)","명사",0,"사람 인, 일 사",[["만나거나 헤어질 때에 예의를 나타냄. 또는 그런 말이나 행동.","인사를 나누다.","تحية"],["사람의 일. 또는 사람으로서 해야 할 일.","옛말에 이르되 인사를 다하고 천명을 기다린다 했는데 일이 이 지경이 된 후에도 하늘만 바라보고 있을 것이오?≪이문열, 황제를 위하여≫"],["마주 대하거나 헤어질 때에 예를 표함. 또는 그런 말이나 행동.","인사를 나누다."]],1,[]],["막대기","명사",0,"",[["가늘고 기다라며 단단한 물건.","아버지께서 막대기로 동생의 손바닥을 때리셨다."]],1,[]],["누런빛","명사",0,"",[["익은 벼의 빛깔과 같이 다소 어둡고 탁한 빛.","누런빛의 재래종 황소."]],1,[]],["규정(規定)","명사",0,"법 규, 정할 정",[["규칙으로 정함. 또는 그렇게 정해 놓은 것.","경기 규정.","تَحْدِيد"],["규칙으로 정함. 또는 그 정하여 놓은 것.","맞춤법 규정."]],1,[]],["생명(生命)","명사",0,"날 생, 목숨 명",[["생물이 살 수 있도록 하는 힘.","생명 존중.","حَيَاة"],["사람이 살아서 숨 쉬고 활동할 수 있게 하는 힘.","환자의 생명."],["동물과 식물의, 생물로서 살아 있게 하는 힘.","생명의 기원."]],1,[]],["이남(以南)","명사",0,"써 이, 남녘 남",[["기준이 되는 지점에서부터 그 남쪽.","이남 지방.","جَنُوب"],["어떤 지점을 기준으로 하여 그 남쪽.","낙동강 이남 지역."]],1,[]],["판서(板書)","명사",0,"널 판, 글 서",[["칠판에 분필로 글을 씀. 또는 그 글.","그 강의는 주로 선생님의 판서와 설명으로 진행되었다."]],1,[]],["문인(文人)","명사",0,"글월 문, 사람 인",[["소설가, 시인, 평론가 등과 같이 문학에 종사하는 사람.","당대의 문인.","أَدِيب"],["문필에 종사하는 사람.","문인 출신."]],1,[]],["계기(契機)","명사",0,"맺을 계, 틀 기",[["어떤 일이 일어나거나 변화하도록 만드는 결정적인 원인이나 기회.","사건의 계기."]],1,[]],["관심(關心)","명사",0,"관계할 관, 마음 심",[["어떤 것에 마음이 끌려 주의를 기울임. 또는 그런 마음이나 주의.","관심이 있다."]],1,[]],["현실(現實)","명사",0,"나타날 현, 열매 실",[["현재 실제로 존재하는 사실이나 상태.","분단 현실."]],1,[]],["경지(境地)","명사",0,"지경 경, 땅 지",[["학문이나 예술 등에서 일정한 특성과 체계를 갖춘 독자적인 범주나 부분.","예술의 경지.","مَجَال، حَقْل"],["일정한 경계 안의 땅.",""]],1,[]],["베","명사",0,"",[["삼실, 무명실, 명주실 따위로 짠 피륙.","베를 짜다."]],1,[]],["텔레비전(television)","명사",0,"",[["사물의 광학적인 상을 전파에 실어 보내어 수신 장치에 재현하는 전기 통신 방식. 또는 그 영상을 받는 수상기.","그가 대문 밖으로 나갈 때까지 안방에서 텔레비전 소리만 났을 뿐, 건넌방에서는 아무 기척이 없었다.≪서정인, 뒷개≫"]],1,[]],["골짜기","명사",0,"",[["산과 산 사이에 움푹 패어 들어간 곳.","골짜기에 흐르는 시냇물."]],1,[]],["몽골(←Mongolia)","명사",0,"",[["만주의 서쪽이자 시베리아의 남쪽에 있는 지역. 칭기즈 칸이 13세기 초 중국 본토의 북쪽에 세운 몽골 제국이 있던 곳으로 청나라 때 외몽골과 내몽골로 나누어졌다. 북쪽으로는 러시아, 남쪽으로는 중국과 맞닿아 있다.","","مُنْغُولِيَا"],["중국 본토의 북쪽, 만주의 서쪽, 시베리아의 남쪽, 신장성(新疆省) 동쪽에 있는 지역. 북쪽은 러시아, 남쪽은 중국에 면해 있으며, 내몽골과 외몽골로 나눈다.",""],["유라시아 대륙 중앙부, 몽골고원의 북쪽에 있는 공화국. 13세기 칭기즈 칸의 통솔 아래 세력이 커지기 시작하여, 중국 대륙과 주위 여러 지역을 평정하여 원(元) 제국을 이루었으나, 그 후 세력이 약화되어 중국의 지배를 받아 오다가 1921년 소련의 원조로 혁명을 일으켜 독립하고 1924년 공화국이 되었다. 집단 경영에 의한 농목업이 발달하였고, 양모·피혁 따위를 주로 생산하며, 주민은 몽골인이고 주요 언어는 몽골어이다. 수도는 울란바타르, 면적은 156만 5000㎢.",""]],1,[]],["제자(弟子)","명사",0,"아우 제, 아들 자",[["스승으로부터 가르침을 받거나 받은 사람.","제자로 삼다."]],1,[]],["동남부(東南部)","명사",0,"동녘 동, 남녘 남, 떼 부",[["어떤 지역의 동남쪽 부분.","동남부 일대."]],0,[]],["추위","명사",0,"",[["추운 정도.","혹독한 추위."]],1,[]],["내기","명사",0,"",[["금품을 거는 등 일정한 약속 아래에서 승부를 다툼. 이긴 사람이 걸어 놓은 물품이나 돈을 차지한다.","내기 시합."]],1,[]],["볏과(볏科)","명사",0,"과목 과",[["외떡잎식물 벼목의 한 과. 대개 초본이나 목본도 있다. 잎은 그물맥이며, 꽃잎은 인피(鱗被)로 퇴화되었다. 전 세계에 500속 4,500종이 분포한다. 개밀, 겨이삭, 쇠풀, 새, 귀리 따위가 있다.",""]],1,[]],["공장(工場)","명사",0,"장인 공, 마당 장",[["원료나 재료를 가공하여 물건을 만들어 내는 설비를 갖춘 곳.","자동차 공장."]],1,[]],["발로(發露)","명사",0,"필 발, 이슬 로",[["숨은 것이 겉으로 드러나거나 숨은 것을 겉으로 드러냄. 또는 그런 것.","사상의 발로."]],1,[]],["자세(姿勢)","명사",0,"모양 자, 형세 세",[["어떤 동작이나 행동을 할 때의 몸의 모양.","수평 자세.","وضع الجسم"],["몸을 움직이거나 가누는 모양.","자세를 가다듬다."]],1,[]],["근대(近代)","명사",0,"가까울 근, 대신할 대",[["현대의 특징이 나타나기 시작한 가까운 과거의 시대.","근대의 사고.","مُعَاصِرٌ"],["얼마 지나가지 않은 가까운 시대.","근대의 풍조."]],1,[]],["꼭대기","명사",0,"",[["서 있는 것의 가장 위쪽.","건물 꼭대기.","قِمَّةٌ، ذُرْوَةٌ"],["높이가 있는 사물의 맨 위쪽.","건물 꼭대기."]],1,[]],["가닥","명사",0,"",[["하나의 덩어리나 묶음에서 풀리거나 갈라져 나온 긴 줄.","국수 가닥.","خَيْط"],["한군데서 갈려 나온 낱낱의 줄.","명주실 가닥."]],1,[]],["혈액(血液)","명사",0,"피 혈, 진 액",[["사람이나 동물의 몸 안의 혈관을 돌며 산소와 영양분을 공급하고, 노폐물을 운반하는 붉은색의 액체.","혈액이고 변이고 검사 결과는 물론 정상이었다.≪법정, 무소유≫"]],1,[]],["최대(最大)","명사",0,"가장 최, 클 대",[["수나 양, 정도 따위가 가장 큼.","야외 공연에서는 날씨가 최대 변수이다."]],1,[]],["기억(記憶)","명사",0,"기록할 기, 생각할 억",[["이전의 인상이나 경험을 의식 속에 간직하거나 도로 생각해 냄.","기억에 오래 남다."]],1,[]],["호흡(呼吸)","명사",0,"부를 호, 마실 흡",[["숨을 쉼. 또는 그 숨.","호흡을 가다듬다."]],1,[]],["내지(內地)","명사",0,"안 내, 땅 지",[["해안이나 변두리로부터 안쪽으로 깊이 들어간 지역.","깊숙한 내지.","الْمِنْطَقَة الدَّاخِلِيَّة"],["해안이나 변두리로부터 깊숙이 들어간 안쪽 지역.","침입하는 세력에 밀려 해안에 살던 원주민들은 산속 깊숙이 내지로 쫓겨 갔다."]],1,[]],["무대(舞臺)","명사",0,"춤출 무, 대 대",[["연극, 무용, 음악 등을 공연하기 위해 객석 앞에 좀 높게 만들어 놓은 넓은 자리.","무대 공연.","مَسْرَح"],["노래, 춤, 연극 따위를 하기 위하여 객석 정면에 만들어 놓은 단.","텅 빈 무대."]],1,[]],["부수(部數)","명사",0,"떼 부, 셈 수",[["책, 신문 따위의 출판물을 세는 단위인 부(部)의 수효.","판매 부수."],["부류의 수.",""]],1,[]],["간격(間隔)","명사",0,"사이 간, 사이뜰 격",[["거리나 시간이 벌어진 정도.","두 시간 간격.","بُعْد فِي الوَقْت أَوْ فِي المَسَافَة"],["공간적으로 벌어진 사이.","간격을 좁혀 앉다."]],1,[]],["육지(陸地)","명사",0,"뭍 육, 땅 지",[["지구에서 물로 된 부분이 아닌 흙이나 돌로 된 부분.","육지 동물.","بَرّ"],["강이나 바다와 같이 물이 있는 곳을 제외한 지구의 겉면.","바다와 육지."]],1,[]],["현대(現代)","명사",0,"나타날 현, 대신할 대",[["오늘날의 시대.","현대 과학.","العصر الحديث"],["지금의 시대.","현대 문명."]],1,[]],["문관(文官)","명사",0,"글
