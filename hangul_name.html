월 문, 벼슬 관",[["군인이 아니면서, 군대에서 사무를 보는 관리.","문관으로 복무하다.","مُوَظَّف مَدَنِيّ"],["군인의 위계(位階)나 군적(軍籍)을 가지지 않은 관리.","소속은 이 사람과 같습니다. 다만 군인은 아닙니다. 제대했지요. 연합군 행정 부서의 문관인 셈이죠.≪황석영, 무기의 그늘≫"]],1,[]],["고통(苦痛)","명사",0,"쓸 고, 아플 통",[["몸이나 마음의 괴로움과 아픔.","심한 고통."]],1,[]],["생김새","명사",0,"",[["생긴 모양새.","얼굴 생김새."]],1,[]],["창고(倉庫)","명사",0,"곳집 창, 곳집 고",[["물건이나 자재를 저장하거나 보관하는 건물.","창고에 곡식이 산더미처럼 쌓여 있었다."]],1,[]],["비위(脾胃)","명사",0,"지라 비, 밥통 위",[["어떤 음식을 먹고 싶어 하는 마음.","비위가 당기다.","شَهْوَةُ الْبَطْنِ ؛ رَغْبَةٌ"],["지라와 위를 통틀어 이르는 말.",""]],1,[]],["가수(歌手)","명사",0,"노래 가, 손 수",[["노래 부르는 것이 직업인 사람.","가수 지망생."]],1,[]],["물가(物價)","명사",0,"물건 물, 값 가",[["물건의 값. 여러 가지 상품이나 서비스의 가치를 종합적이고 평균적으로 본 개념이다.","물가가 내리다."]],1,[]],["전라남도(全羅南道)","명사",0,"온전할 전, 벌릴 라, 남녘 남, 길 도",[["우리나라 남서부에 있는 도. 고려 현종 때 전라도가 되었고 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 무안군이다. 면적은 약 12,360㎢.",""]],1,[]],["전화(電話)","명사",0,"번개 전, 말씀 화",[["전화기를 통해 사람들끼리 말을 주고받음. 또는 그렇게 하여 전달되는 내용.","안부 전화.","مكالمة هاتفية"],["전화기를 이용하여 말을 주고받음.","전화를 걸다."]],1,[]],["괴로움","명사",0,"",[["몸이나 마음이 편하지 않고 고통스러운 상태. 또는 그런 느낌.","괴로움을 술로 달래다."]],1,[]],["가마","명사",0,"",[["요리하는 데 쓰는 크고 우묵한 솥.","무쇠 가마.","كَامَا"],["곡식이나 소금 따위를 담기 위하여 짚을 돗자리 치듯이 쳐서 만든 용기. 요즈음에는 비닐이나 종이 따위로 만든 큰 부대를 이르기도 한다.","추수철이 되자 텅 비었던 광에 곡식 가마가 쌓였다."],["아주 크고 우묵한 솥.","가마를 걸고 불을 때서 밥을 지었다."],["숯이나 도자기·기와·벽돌 따위를 구워 내는 시설. 예전에는 주로 장작으로 불을 때는 아궁이와 굴뚝 따위로 이루어져 있었으나, 요즘은 전기를 이용한 것 등 다양한 형태가 있다.","독을 지어 유약을 바른 다음 가마에 넣고 구워 냈다."]],1,[]],["피륙","명사",0,"",[["아직 끊지 아니한 베, 무명, 비단 따위의 천을 통틀어 이르는 말.","피륙 열 필."]],1,[]],["물리학자(物理學者)","명사",0,"물건 물, 다스릴 리, 배울 학, 놈 자",[["물리학을 연구하는 사람.","이론 물리학자."]],1,[]],["조(組)","명사",0,"짤 조",[["어떤 목적을 위해서 모인, 비교적 적은 수의 사람들로 이루어진 집단.","조를 만들다.","فريق"],["일정한 목적을 위하여 조직된, 적은 사람들의 집단.","조를 짜다."]],1,[]],["올","명사",0,"",[["실이나 줄의 가닥.","올이 가늘다."],["지금 지나가고 있는 이해.","올 삼월."]],1,[]],["전통(傳統)","명사",0,"전할 전, 거느릴 통",[["어떤 집단이나 공동체에서, 지난 시대에 이미 이루어져 계통을 이루며 전하여 내려오는 사상·관습·행동 따위의 양식.","전통 계승."]],1,[]],["설비(設備)","명사",0,"베풀 설, 갖출 비",[["필요한 것을 베풀어서 갖춤. 또는 그런 시설.","전기 설비."]],1,[]],["고향(故鄕)","명사",0,"연고 고, 시골 향",[["태어나서 자란 곳.","우리 고향.","مَسْقَط الرَّأْس"],["자기가 태어나서 자란 곳.","내가 살던 고향."]],1,[]],["중세(中世)","명사",0,"가운데 중, 인간 세",[["역사의 시대 구분의 하나로, 고대에 이어 근대에 선행(先行)하는 시기. 일반적으로 우리나라에서는 고려 건국 초기부터 망하기까지의 시기를, 중국에서는 당나라의 멸망으로부터 명나라 말기까지의 시기를, 서양에서는 5세기의 게르만 민족의 대이동에서 15세기 중엽 동로마 제국의 멸망에 이르는 시기를 가리킨다.","중세의 영주가 상업 자본가로 변신하여 여전히 위세를 유지하며 살아남고 상업 자본가는 또 산업 자본가로 변신해 그 시대의 혜택을 독점하며 살아남았듯….≪이문열, 영웅시대≫"]],1,[]],["자오선(子午線)","명사",0,"아들 자, 낮 오, 줄 선",[["천구(天球)의 두 극과 천정(天頂)을 지나 적도와 수직으로 만나는 큰 원. 시각의 기준이 된다.",""]],1,[]],["인연(因緣)","명사",0,"인할 인, 인연 연",[["사람들 사이에 맺어지는 관계.","기이한 인연."]],1,[]],["원말(原말)","명사",0,"언덕 원",[["변하기 전의 본디의 말.",""]],1,[]],["제조(製造)","명사",0,"지을 제, 지을 조",[["공장에서 큰 규모로 물건을 만듦.","자동차 제조."]],1,[]],["영역(領域)","명사",0,"거느릴 영, 지경 역",[["영토, 영해, 영공 등 한 나라의 주권이 미치는 범위.","영역의 경계.","نِطَاق"],["한 나라의 주권이 미치는 범위. 영토, 영해, 영공으로 구성된다.","우리의 영역을 침범한 적."]],1,[]],["바닷물","명사",0,"",[["바다에 괴어 있는 짠물.","바닷물이 뱃전에 출렁인다."]],1,[]],["온대(溫帶)","명사",0,"따뜻할 온, 띠 대",[["열대와 한대 사이의 지역. 위도상으로는 남북 회귀선인 23.5도와 남북 극권 사이의 지역이며, 등온선에 의한 구분으로는 연평균 기온이 0~20℃ 또는 최한월(最寒月) 평균 기온이 영하 18~3℃의 지역이다.",""]],1,[]],["살갗","명사",0,"",[["살가죽의 겉면. 주로 사람의 것만 지칭한다.","살갗이 부드럽다."]],1,[]],["매","명사",0,"",[["사람이나 짐승을 때리는 막대기. 또는 그것으로 때리는 일.","맞는 매.","عَصَا"],["곡식 섬이나 곡식 단 따위를 묶을 때 쓰는 새끼나 끈.",""],["맷과의 새를 통틀어 이르는 말. 매, 바다매, 쇠황조롱이, 황조롱이 따위가 있다.",""],["곡식을 가는 데 쓰는 기구. 둥글넓적한 돌 두 짝을 포개고 윗돌 아가리에 갈 곡식을 넣으면서 손잡이를 돌려서 간다.",""]],1,[]],["납","명사",0,"",[["가장 무겁고 열에 잘 녹는 잿빛의 금속.","납 농도.","الرَّصَاص"],["푸르스름한 잿빛의 금속 원소. 금속 가운데 가장 무겁고 연하며, 전성(展性)은 크나 연성(延性)은 작다. 공기 중에서는 표면에 튼튼한 산화 피막을 만들어 안정하며, 불에 잘 녹는다. 연판, 연관, 활자 합금 따위로 쓴다. 원자 기호는 Pb, 원자 번호는 82, 원자량은 207.19.","화장품에서 납 성분이 검출되어 모두 폐기되었다."]],1,[]],["승부(勝負)","명사",0,"이길 승, 질 부",[["이김과 짐.","승부가 나다."]],1,[]],["대중(大衆)","명사",0,"클 대, 무리 중",[["많은 사람들의 무리.","무수한 대중.","جُمْهُور"],["수많은 사람의 무리.","대중을 위한 문화 시설."]],1,[]],["프로그램(program)","명사",0,"",[["어떤 행사의 진행 계획이나 순서를 적은 목록. 또는 그 행사의 세부 항목.","교육 프로그램.","برنامج"],["진행 계획이나 순서.","프로그램을 짜다."]],1,[]],["민간(民間)","명사",0,"백성 민, 사이 간",[["일반 사람들 사이.","민간 신앙.","بَيْنَ النَّاسِ"],["일반 백성들 사이.","민간에 전승되다."]],1,[]],["꿈","명사",0,"",[["잠자는 동안에 깨어 있을 때처럼 보고 듣고 느끼는 정신 현상.","나쁜 꿈.","حُلْمٌ"],["잠자는 동안에 깨어 있을 때와 마찬가지로 여러 가지 사물을 보고 듣는 정신 현상.","무시무시한 꿈."]],1,[]],["일과(日課)","명사",0,"날 일, 공부할 과",[["정해 놓고 날마다 하는 일.","하루 일과.","روتين يوميّ"],["날마다 규칙적으로 하는 일정한 일.","운동을 일과로 삼다."]],1,[]],["극작가(劇作家)","명사",0,"심할 극, 지을 작, 집 가",[["연극의 극본을 쓰는 것을 직업으로 하는 사람.","단막극이 지상에 소개되었을 뿐만 아니라 공연까지 되기도 한 이력의 극작가였다.≪김원우, 짐승의 시간≫"]],1,[]],["영업(營業)","명사",0,"경영할 영, 업 업",[["영리를 목적으로 하는 사업. 또는 그런 행위.","영업 사원."]],1,[]],["홈","명사",0,"",[["물체에 오목하고 길게 팬 줄.","홈이 패다."]],1,[]],["도덕(道德)","명사",0,"길 도, 큰 덕",[["한 사회의 사람들이 말, 행동, 믿음의 좋고 나쁨을 판단하는 정신적 기준이나 가치 체계.","도덕이 땅에 떨어지다.","أَخْلَاق"],["사회의 구성원들이 양심, 사회적 여론, 관습 따위에 비추어 스스로 마땅히 지켜야 할 행동 준칙이나 규범의 총체. 외적 강제력을 갖는 법률과 달리 각자의 내면적 원리로서 작용하며, 또 종교와 달리 초월자와의 관계가 아닌 인간 상호 관계를 규정한다.","도덕을 지키다."]],1,[]],["죽임","명사",0,"",[["모서리의 날카로운 부분을 없애는 일.",""]],1,[]],["은(銀)","명사",0,"은 은",[["귀금속이나 그릇 등을 만드는 데 쓰는, 흰 광택이 나고 무른 성질이 있는 금속.","금과 은과 동.","فِضَّة"],["금속 원소의 하나. 흰 광택이 있고 무르며 늘어나고 펴지는 성질이 금 다음으로 강하고, 전기 전도율과 열전도율은 금속 가운데 가장 높다. 공기 중에서는 산화하지 않으나 유황 화합물에 닿으면 검은색으로 변한다. 멕시코·미국·캐나다·페루 등지에서 나며, 화학용 기구나 화폐·장식품 따위로 쓴다. 원자 기호는 Ag, 원자 번호는 47, 원자량은 107.868.",""]],1,[]],["전부(全部)","명사",0,"온전할 전, 떼 부",[["어떤 대상을 이루는 낱낱을 모두 합친 것.","재산 전부를 대학의 장학금으로 내놓다."]],1,[]],["나무껍질","명사",0,"",[["나무의 껍질.","막노동으로 나무껍질처럼 거칠어진 손."]],1,[]],["시가(市街)","명사",0,"저자 시, 거리 가",[["도시의 큰 거리.","시가 한복판.","شارع المدينة"],["도시의 큰 길거리.","버스는 어느새 시가를 빠져나와 국도를 향해 달렸다."]],1,[]],["전파(傳播)","명사",0,"전할 전, 뿌릴 파",[["전하여 널리 퍼뜨림.","사상의 전파."]],1,[]],["음역어(音譯語)","명사",0,"소리 음, 번역할 역, 말씀 어",[["한자음을 가지고 외국어의 음을 나타낸 말.",""]],1,[]],["도중(途中)","명사",0,"길 도, 가운데 중",[["길을 가는 중간.","나는 학교를 가는 도중에 친구를 만났다."]],1,[]],["대강(大綱)","명사",0,"클 대, 벼리 강",[["자세하지 않은, 기본적인 부분만을 따 낸 줄거리.","시간이 없어 사건의 대강만을 설명했다."]],1,[]],["금액(金額)","명사",0,"쇠 금, 이마 액",[["돈의 액수.","그가 은행으로부터 대출받은 금액은 모두 1억 5천만 원이었다."]],1,[]],["명승지(名勝地)","명사",0,"이름 명, 이길 승, 땅 지",[["경치가 좋기로 이름난 곳.","우리 고장처럼 산자수명하고 볼만한 고적이 많은 명승지는 없다고 여기고….≪박완서, 미망≫"]],1,[]],["탑(塔)","명사",0,"탑 탑",[["여러 층으로 또는 높고 뾰족하게 세운 건축물.","탑 꼭대기.","برج"],["여러 층으로 또는 높고 뾰족하게 세운 건축물을 통틀어 이르는 말.","탑을 쌓다."]],1,[]],["주제(主題)","명사",0,"임금 주, 제목 제",[["대화나 연구 등에서 중심이 되는 문제.","논문 주제.","مَوْضُوع"],["대화나 연구 따위에서 중심이 되는 문제.","논문의 주제."]],1,[]],["기회(機會)","명사",0,"틀 기, 모일 회",[["어떤 일을 하기에 알맞은 시기나 경우.","다음 기회.","فُرْصَة"],["어떠한 일을 하는 데 적절한 시기나 경우.","절호의 기회."]],1,[]],["선거(選擧)","명사",0,"가릴 선, 들 거",[["일정한 조직이나 집단이 대표자나 임원을 뽑는 일.","반장 선거."]],1,[]],["효소(酵素)","명사",0,"삭힐 효, 본디 소",[["생물의 세포 안에서 합성되어 생체 속에서 행하여지는 거의 모든 화학 반응의 촉매 구실을 하는 고분자 화합물을 통틀어 이르는 말. 화학적으로는 단순 단백질 또는 복합 단백질에 속하며, 술·간장·치즈 따위의 식품 및 소화제 따위의 의약품을 만드는 데 쓴다.",""]],1,[]],["서북부(西北部)","명사",0,"서녘 서, 북녘 북, 떼 부",[["서쪽과 북쪽의 중간이 되는 지역.","서북부 지방."]],0,[]],["관련(關聯/關連)","명사",0,"관계할 관, 연이을 련 / 관계할 관, 이을 련",[["둘 이상의 사람, 사물, 현상 따위가 서로 관계를 맺어 매여 있음. 또는 그 관계.","관련 기사."]],1,[]],["황해도(黃海道)","명사",0,"누를 황, 바다 해, 길 도",[["우리나라 중서부에 있는 도. 삼국 시대에는 고구려의 땅이었으며, 조선 태종 때 지금의 이름이 되었다. 황주와 해주의 머리글자에서 따온 말이다. 북한에서는 현재 황해남도와 황해북도로 나뉘어 있다. 면적은 약 16,447㎢.",""]],1,[]],["신앙(信仰)","명사",0,"믿을 신, 우러를 앙",[["믿고 받드는 일.","신앙을 가지다."]],1,[]],["은행(銀行)","명사",0,"은 은, 다닐 행",[["사람들의 돈을 맡아 관리하고 필요한 사람에게 돈을 빌려주는 기관.","은행 계좌.","بنك"],["예금을 받아 그 돈을 자금으로 하여 대출, 어음 거래, 증권의 인수 따위를 업무로 하는 금융 기관. 크게 중앙은행, 일반 은행, 특수 은행으로 구분한다.","은행 창구."]],1,[]],["세월(歲月)","명사",0,"해 세, 달 월",[["흘러가는 시간.","기나긴 세월."]],1,[]],["형세(形勢)","명사",0,"모양 형, 형세 세",[["살림살이의 형편.","좋아진 형세.","وضع, حالة"],["일이 되어 가는 형편.","형세가 불리하다."],["기운차게 뻗치는 모양이나 상태.","인부들이 무서운 형세로 연장들을 들고 서 있다."]],1,[]],["물음","명사",0,"",[["묻는 일. 또는 묻는 말.","물음에 답하다."]],1,[]],["악곡(樂曲)","명사",0,"즐길 악, 굽을 곡",[["음악의 곡조.","궁중 악곡.","لحن موسيقي"],["음악의 곡조. 곧 성악곡, 기악곡, 관현악곡 따위를 통틀어 이르는 말이다.","전통 악곡."]],1,[]],["소화(消化)","명사",0,"사라질 소, 될 화",[["먹은 음식물을 뱃속에서 분해하여 영양분으로 흡수함.","소화 불량.","هَضْمٌ"],["섭취한 음식물을 분해하여 영양분을 흡수하기 쉬운 형태로 변화시키는 일. 또는 그런 작용. 음식물을 씹는 작용에 의한 기계적 소화와 소화 효소에 의한 화학적 소화가 있다.","소화가 진행되다."]],1,[]],["우리","명사",0,"",[["짐승을 가두어 기르는 곳.","우리에 갇힌 호랑이 신세."]],1,[]],["모자(帽子)","명사",0,"모자 모, 아들 자",[["머리에 쓰는 물건의 하나. 예의를 차리거나 추위, 더위, 먼지 따위를 막기 위한 것이다.","제복을 입고 모자를 쓴 군인."]],1,[]],["노동(勞動)","명사",0,"일할 노, 움직일 동",[["사람이 필요한 음식이나 물자를 얻기 위하여 육체적으로나 정신적으로 하는 일.","신체적 노동.","عَمَل"],["몸을 움직여 일을 함.","그는 노동으로 생계를 꾸린다."]],1,[]],["몸빛","명사",0,"",[["몸의 표면에 나타나는 빛깔.",""]],1,[]],["제정(制定)","명사",0,"절제할 제, 정할 정",[["제도나 법률 따위를 만들어서 정함.","법 제정."]],1,[]],["아무것","명사",0,"",[["정확하게 정해지지 않은 어떤 것.","아무것이나 먹다."],["어떤 것의 조금이나 일부분.","아무것도 모르다."]],0,[]],["집합(集合)","명사",0,"모을 집, 합할 합",[["사람들을 한곳으로 모음. 또는 사람들이 한곳으로 모임.","급한 집합.","تجميع"],["사람들이 한곳으로 모임.","집합 문화."]],1,[]],["권한(權限)","명사",0,"권세 권, 한할 한",[["어떤 사람이나 기관의 권리나 권력이 미치는 범위.","권한을 부여하다."]],1,[]],["업적(業績)","명사",0,"업 업, 길쌈 적",[["어떤 사업이나 연구 따위에서 세운 공적.","위대한 업적을 남긴 위인."]],1,[]],["화학적(化學的)","명사",0,"될 화, 배울 학, 과녁 적",[["화학 현상의 특징을 띠거나 화학 현상과 관련된 것.","이 물질은 화학적으로 특별한 반응을 일으키지는 않는다."]],1,[]],["대기(待機)","명사",0,"기다릴 대, 틀 기",[["어떤 때나 기회를 기다림.","호출 대기.","اِنْتِظَار"],["때나 기회를 기다림.","대기 태세."]],1,[]],["패(牌)","명사",0,"패 패",[["어떤 사물의 이름, 성분, 특징 등을 표시해 놓은 종이나 나무 등의 작은 조각.","패를 달다.","علامة مميزة، لصاقة، لصقية"],["어떤 사물의 이름, 성분, 특징 따위를 알리기 위하여 그림을 그리거나 글씨를 쓰거나 새긴 종이나 나무, 쇠붙이 따위의 조그마한 조각.","패를 달다."],["같이 어울려 다니는 사람의 무리.","패를 갈라놓다."]],1,[]],["작업(作業)","명사",0,"지을 작, 업 업",[["일을 함. 또는 그 일.","작업 시간."]],1,[]],["실속(實속)","명사",0,"열매 실",[["군더더기 없이 실제로 핵심이 되는 내용.","대단한 실속.","فائدة، مضمون"],["군더더기가 없는, 실지의 알맹이가 되는 내용.","실속이 없는 이야기."]],1,[]],["손해(損害)","명사",0,"덜 손, 해할 해",[["돈, 재산 등을 잃거나 정신적으로 해를 입음.","손해가 나다.","خَسَارَة"],["물질적으로나 정신적으로 밑짐.","손해 가다."]],1,[]],["옆구리","명사",0,"",[["가슴과 등 사이의 갈빗대가 있는 부분.","옆구리에 책을 끼다."]],1,[]],["목구멍","명사",0,"",[["식도와 기도로 통하는 입안의 깊숙한 곳.","목구멍이 막히다."]],1,[]],["국물","명사",0,"",[["국이나 찌개 등의 음식에서 건더기를 빼고 남은 물.","찌개 국물.","مَاء الْحَسَاء"],["국, 찌개 따위의 음식에서 건더기를 제외한 물.","찌개 국물."]],1,[]],["황산(黃酸)","명사",0,"누를 황, 실 산",[["무색무취의 끈끈한 불휘발성 액체. 강한 산성으로, 금과 백금을 제외한 대부분의 금속을 녹인다. 유기물을 분해하고, 물에 섞으면 많은 열을 내면서 습기를 빨아들인다. 여러 가지 약품을 만드는 기초 원료로서 화학 공업에 널리 쓴다. 화학식은 H₂SO₄.",""]],1,[]],["손잡이","명사",0,"",[["손으로 어떤 것을 열거나 들거나 붙잡을 수 있도록 덧붙여 놓은 부분.","손잡이가 달린 컵."]],1,[]],["넓이","명사",0,"",[["일정한 평면에 걸쳐 있는 공간이나 범위의 크기.","한 평 넓이의 땅."]],1,[]],["푸른빛","명사",0,"",[["맑은 가을 하늘이나 깊은 바다, 풀의 빛깔과 같이 맑고 선명한 빛.","가을이 되니 산들의 푸른빛이 단풍으로 붉게 물들어 간다."]],1,[]],["재앙(災殃)","명사",0,"재앙 재, 재앙 앙",[["뜻하지 아니하게 생긴 불행한 변고. 또는 천재지변으로 인한 불행한 사고.","재앙을 당하다."]],1,[]],["증세(症勢)","명사",0,"증세 증, 형세 세",[["병을 앓을 때 나타나는 여러 가지 상태나 모양.","독감 증세."]],1,[]],["대통령(大統領)","명사",0,"클 대, 거느릴 통, 거느릴 령",[["외국에 대하여 국가를 대표하는 국가의 원수. 행정부의 실질적인 권한을 갖는 경우와 형식적인 권한만을 가지는 경우가 있는데 우리나라는 전자에 속한다.","대통령 후보."]],1,[]],["삼국(三國)","명사",0,"석 삼, 나라 국",[["세 나라.","한중일 삼국."]],1,[]],["처리(處理)","명사",0,"곳 처, 다스릴 리",[["일이나 사무, 사건을 절차에 따라 정리해 마무리함.","사고 처리.","تناوُل، معالجة"],["사무나 사건 따위를 절차에 따라 정리하여 치르거나 마무리를 지음.","행정 처리."]],1,[]],["덩이","명사",0,"",[["작게 뭉쳐져서 이루어진 것.","작은 덩이.","كُتْلَة"],["작게 뭉쳐서 이루어진 것.","덩이 모양."]],1,[]],["팔다리","명사",0,"",[["팔과 다리를 아울러 이르는 말.","팔다리가 쑤시다."]],1,[]],["나뭇가지","명사",0,"",[["나무의 줄기에서 뻗어 나는 가지.","나뭇가지가 부러지다."]],1,[]],["버릇","명사",0,"",[["오랫동안 자꾸 반복하여 몸에 익숙해진 성질이나 행동.","나쁜 버릇.","عَادَة"],["오랫동안 자꾸 반복하여 몸에 익어 버린 행동.","코를 벌름거리는 버릇."],["윗사람에 대하여 지켜야 할 예의.","버릇이 없다."]],1,[]],["재","명사",0,"",[["길이 나 있어서 넘어 다닐 수 있는, 높은 산의 고개.","재를 넘다."]],1,[]],["거울","명사",0,"",[["물체의 모양을 비추어 보는 얇고 평평한 물건.","대형 거울.","مِرْآة"],["빛의 반사를 이용하여 물체의 모양을 비추어 보는 물건. 옛날에는 구리나 돌을 매끄럽게 갈아서 만들었는데, 지금은 보통 유리 뒤쪽에 아말감을 발라 만든다.","거울 속에 비친 얼굴."]],1,[]],["신부(神父)","명사",0,"귀신 신, 아비 부",[["주교 다음가는 성직자. 성사를 집행하고 미사를 드리며 강론을 한다.","신부에게 고해성사를 하다."]],1,[]],["맥(脈)","명사",0,"줄기 맥",[["기운이나 힘.","맥이 있다."],["심장의 박동으로 심장에서 나오는 피가 얇은 피부에 분포되어 있는 동맥의 벽에 닿아서 생기는 주기적인 파동. 맥박의 빠르기나 강하고 약함 따위로 심장의 상태를 알 수 있다.","맥이 뛰다."]],1,[]],["희곡(戲曲)","명사",0,"놀이 희, 굽을 곡",[["연극의 대본.","재미있는 희곡.","مَسْرَحِيَّةٌ"],["공연을 목적으로 하는 연극의 대본.",""]],1,[]],["굴(窟)","명사",0,"굴 굴",[["땅이나 바위가 안으로 깊고 길게 파인 장소.","캄캄한 굴.","نَفَق، كَهْف"],["자연적으로 땅이나 바위가 안으로 깊숙이 패어 들어간 곳.","원시 시대에는 특정한 주거 형태 없이 굴에서 살았다."]],1,[]],["증거(證據)","명사",0,"증거 증, 근거 거",[["어떤 사건이나 사실을 확인할 수 있는 근거.","객관적 증거.","دليل، برهان"],["어떤 사실을 증명할 수 있는 근거.","확실한 증거를 찾아내다."]],1,[]],["화물(貨物)","명사",0,"재물 화, 물건 물",[["운반할 수 있는 유형(有形)의 재화나 물품을 통틀어 이르는 말.","화차에 화물을 싣다."]],1,[]],["아름다움","명사",0,"",[["아름다운 모습.","영원한 아름다움."]],0,[]],["나물","명사",0,"",[["고사리, 도라지 등의 사람이 먹을 수 있는 풀이나 나뭇잎.","나물이 나다.","عُشْبُ الطَّعَامِ"],["사람이 먹을 수 있는 풀이나 나뭇잎 따위를 통틀어 이르는 말. 고사리, 도라지, 두릅, 냉이 따위가 있다.","나물을 캐러 가다."]],1,[]],["본관(本館)","명사",0,"근본 본, 집 관",[["주가 되는 기관이나 건물을 별관(別館)이나 분관(分館)에 상대하여 이르는 말.","회의는 본관 건물 12층 회의실에서 열립니다."]],1,[]],["궁전(宮殿)","명사",0,"집 궁, 전각 전",[["임금이 거처하는 집.","이 궁전은 바로크 양식의 대표적인 건물로 손꼽힌다."]],1,[]],["훈련(訓鍊/訓練)","명사",0,"가르칠 훈, 쇠불릴 련 / 가르칠 훈, 익힐 련",[["기본자세나 동작 등을 되풀이하여 익힘.","동계 훈련.","تمرين، تدريب"],["기본자세나 동작 따위를 되풀이하여 익힘.","총검술 훈련."]],1,[]],["어족(魚族)","명사",0,"물고기 어, 겨레 족",[["척추동물문의 연골어강, 경골어강, 먹장어강, 두갑강, 조기강을 통틀어 이르는 말. 몸은 거의 유선형이며 비늘로 덮여 있다. 지느러미와 부레가 있어 물속을 헤엄쳐 다니고 아가미로 호흡한다. 대부분은 난생인데 난태생도 있다.","망망대해 푸른 물결 속에는 어족의 떼가 무진장으로 살아서 다시 이 겨레의 영양을 살찌게 한다.≪박종화, 임진왜란≫"]],1,[]],["정삼품(正三品)","명사",0,"바를 정, 석 삼, 물건 품",[["고려 시대의 18품계 가운데 다섯째 등급. 문산계의 은청광록대부·정의대부(正議大夫), 무산계의 관군대장군 따위가 있다.",""],["조선 시대의 18품계 가운데 다섯째 등급. 문관의 통정대부·통훈대부, 무관의 절충장군, 종친의 명선대부·창선대부, 의빈(儀賓)의 봉순대부 따위가 있다.",""]],1,[]],["겁(怯)","명사",0,"겁낼 겁",[["무서워하는 마음. 또는 그런 심리적 경향.","겁이 나다."]],1,[]],["앞날개","명사",0,"",[["비행기 따위의 앞쪽에 있는 날개.",""],["곤충류의 날개 가운데 앞에 있는 한 쌍의 날개.",""]],1,[]],["구성원(構成員)","명사",0,"얽을 구, 이룰 성, 인원 원",[["어떤 조직이나 단체를 이루고 있는 사람.","가족 구성원."]],1,[]],["진동(振動)","명사",0,"떨칠 진, 움직일 동",[["흔들려 움직임.","시계추의 진동."]],1,[]],["인류(人類)","명사",0,"사람 인, 무리 류",[["전 세계의 모든 사람.","모든 인류.","جنس بشري"],["세계의 모든 사람.","세계 평화와 인류 공영에 이바지하다."]],1,[]],["질병(疾病)","명사",0,"병 질, 병 병",[["몸의 온갖 병.","질병에 걸리다."]],1,[]],["뱀","명사",0,"",[["파충강 뱀과의 동물을 통틀어 이르는 말. 몸은 원통형으로 가늘고 길며, 다리와 눈꺼풀, 귓구멍이 없다. 피부는 비늘로 덮여 있고 오래되면 탈피한다. 현재 2,700여 종이 알려져 있고, 열대 지방에 많은 종류가 분포한다.","뱀에게 다리를 물리다."]],1,[]],["무역(貿易)","명사",0,"무역할 무, 바꿀 역",[["지방과 지방 사이에 서로 물건을 사고파는 일.","국내 무역.","تِجَارَة"],["지방과 지방 사이에 서로 물건을 사고팔거나 교환하는 일.",""]],1,[]],["산기슭(山기슭)","명사",0,"메 산",[["산의 비탈이 끝나는 아랫부분.","산기슭과 골짜기를 뒤지던 나는 어느새 산등성이에 올라 있었다.≪유재용, 성역≫"]],1,[]],["웃음","명사",0,"",[["웃는 일. 또는 그런 소리나 표정.","어린아이의 해맑은 웃음."]],1,[]],["숲속","명사",0,"",[["숲의 안쪽.","오랜만에 숲속 공기를 마시니 머리가 시원해지는 기분이 들었다."]],1,[]],["조류(潮流)","명사",0,"밀물 조, 흐를 류",[["밀물과 썰물 때문에 생기는 바닷물의 흐름.","조류의 변화.","حركة المدّ والجزر"],["밀물과 썰물 때문에 일어나는 바닷물의 흐름.","물과 뭍으로 협공하는 것은 가장 좋은 방법이나 바다 장사들은 육지 군사들과 달라 반드시 조류를 살펴야만 하는 것이니….≪박종화, 임진왜란≫"]],1,[]],["부채","명사",0,"",[["손으로 흔들어 바람을 일으키는 물건. 대오리로 살을 하고 종이나 헝겊 따위를 발라서 자루를 붙여 만든다. 태극선, 미선, 합죽선, 부들부채, 까치선 따위가 있다.","부채를 부치다."]],1,[]],["싹","명사",0,"",[["씨나 줄기에서 처음 나오는 어린잎이나 줄기.","싹이 나다.","بُرْعُم"],["씨, 줄기, 뿌리 따위에서 처음 돋아나는 어린잎이나 줄기.","싹이 나다."]],1,[]],["증기(蒸氣/烝氣)","명사",0,"찔 증, 기운 기 / 찔 증, 기운 기",[["기체 상태로 되어 있는 물.","증기 소독."]],1,[]],["판소리","명사",0,"",[["광대 한 사람이 고수(鼓手)의 북장단에 맞추어 서사적(敍事的)인 이야기를 소리와 아니리로 엮어 발림을 곁들이며 구연(口演)하는 우리 고유의 민속악. 조선 숙종 말기에서 영조 초기에 걸쳐 충청도, 전라도를 중심으로 발달하여 왔으며, 지역에 따라 동편제, 서편제, 중고제로 나뉜다. 2003년에 유네스코 세계 무형유산으로 지정되었다. 우리나라 국가 무형유산이다.",""]],1,[]],["애","명사",0,"",[["초조한 마음속.","애를 태우다."]],1,[]],["재능(才能)","명사",0,"재주 재, 능할 능",[["어떤 일을 하는 데 필요한 재주와 능력. 개인이 타고난 능력과 훈련에 의하여 획득된 능력을 아울러 이른다.","지적 재능."]],1,[]],["쇠고기","명사",0,"",[["소의 고기.","쇠고기 반찬."]],1,[]],["구슬","명사",0,"",[["보석이나 유리 등으로 둥글게 만든 물건.","수정 구슬.","خَرَزَة"],["보석이나 진주 따위로 둥글게 만든 물건. 흔히 장신구로 쓴다.","구슬 한 꿰미."]],1,[]],["하나하나","명사",0,"",[["어떠한 것을 이루는 낱낱의 대상.","그는 전시장에 걸린 그림 하나하나를 유심히 보았다."]],1,[]],["남아메리카(南America)","명사",0,"남녘 남",[["아메리카 대륙의 남부.",""]],1,[]],["수염(鬚髥)","명사",0,"수염 수, 구레나룻 염",[["남자 어른의 입 주변이나 턱, 뺨에 나는 털.","긴 수염.","شَارِب"],["성숙한 남자의 입 주변이나 턱 또는 뺨에 나는 털.","수염이 나다."]],1,[]],["화산(火山)","명사",0,"불 화, 메 산",[["땅속에 있는 가스, 마그마 따위가 지각의 터진 틈을 통하여 지표로 분출하는 지점. 또는 그 결과로 생기는 구조. 분출물이 쌓여 생겨난 화산체(火山體), 폭발이나 함몰에 의하여 생기는 오목한 땅, 균열 따위의 지형을 만든다. 활화산, 휴화산, 사화산으로 나눈다.","화산 폭발."]],1,[]],["각도(角度)","명사",0,"뿔 각, 법도 도",[["한 점에서 시작된 두 직선이 벌어진 정도.","각도가 벌어지다.","زَاوِيَة"],["생각의 방향이나 관점.","여러 각도로 문제를 검토하다."],["한 점에서 갈리어 나간 두 직선의 벌어진 정도. 원의 중심에서 원의 둘레를 360으로 등분한 것을 1도로 나타내고 이를 단위로 측정한다.","각도 큰 변화구."]],1,[]],["요리(料理)","명사",0,"헤아릴 요, 다스릴 리",[["음식을 만듦.","요리 방법.","طبخ"],["재료를 잘 갖추어 만든 음식.","각종 요리."]],0,[]],["근처(近處)","명사",0,"가까울 근, 곳 처",[["가까운 곳.","학교 근처도 못 가 보다."]],1,[]],["자모(字母)","명사",0,"글자 자, 어미 모",[["음소 문자 체계에 쓰이는 낱낱의 글자.",""]],1,[]],["실험(實驗)","명사",0,"열매 실, 시험 험",[["어떤 일을 하기 전에 이론이나 생각에 따라 실제로 해 봄.","실험 삼아 해 보다.","تجربة"],["실제로 해 봄. 또는 그렇게 하는 일.",""]],1,[]],["상자(箱子)","명사",0,"상자 상, 아들 자",[["물건을 넣어 둘 수 있도록 나무나 종이 등으로 만든 네모난 통.","나무 상자.","صُنْدُوق"],["물건을 넣어 두기 위하여 나무, 대나무, 두꺼운 종이 같은 것으로 만든 네모난 그릇.","케이크 상자."]],1,[]],["턱","명사",0,"",[["사람의 얼굴에서 입 아래의 뾰족하게 나온 부분.","턱이 뾰족하다.","ذقن"],["사람의 입 아래에 있는 뾰족하게 나온 부분.","턱이 뾰족하다."]],1,[]],["건강(健康)","명사",0,"굳셀 건, 편안 강",[["정신적으로나 육체적으로 아무 탈이 없고 튼튼함. 또는 그런 상태.","건강을 돌보다."]],1,[]],["차량(車輛)","명사",0,"수레 차, 수레 량",[["도로나 선로 위를 달리는 모든 차.","도난 차량.","سيارت، ناقلات"],["도로나 선로 위를 달리는 모든 차를 통틀어 이르는 말.","차량 번호."]],1,[]],["기후(氣候)","명사",0,"기운 기, 기후 후",[["기온, 비, 눈, 바람 등의 대기 상태.","기후 변화.","مُنَاخ، جَوّ، طَقْس"],["기온, 비, 눈, 바람 따위의 대기(大氣) 상태.","서늘한 기후."]],1,[]],["강원(江原)","명사",0,"강 강, 언덕 원",[["우리나라 중동부, 남한 지역에 속한 도. 고구려의 땅이었으며 조선 태조 때 지금의 이름이 되었다. 강릉과 원주의 머리글자에서 따온 말이다. 2023년 ‘강원특별자치도 설치 및 미래 산업 글로벌 도시 조성을 위한 특별법’에 의하여 특별자치도로 승격하였다. 도청 소재지는 춘천이다. 면적은 약 16,875㎢.",""]],1,[]],["인쇄(印刷)","명사",0,"도장 인, 인쇄할 쇄",[["잉크를 사용하여 판면(版面)에 그려져 있는 글이나 그림 따위를 종이, 천 따위에 박아 냄.","인쇄 기술의 발달."]],1,[]],["콩과(콩科)","명사",0,"과목 과",[["쌍떡잎식물 갈래꽃류의 한 과. 목본 또는 초본으로 전 세계에 1,400여 종이 분포하는데 우리나라에는 강낭콩·녹두·도둑놈의갈고리·완두·자운영·콩·팥 따위의 초본과, 골담초·다릅나무·등나무·아까시나무 따위의 목본 130여 종이 자란다.",""]],1,[]],["독성(毒性)","명사",0,"독 독, 성품 성",[["독이 있는 성분.","독성이 강한 물질."],["독한 성질.",""]],1,[]],["조약(條約)","명사",0,"가지 조, 맺을 약",[["세부적인 항목을 세워 맺은 약속.","조약의 내용.","اتفاقية"],["조목을 세워 맺은 언약.","계약 기간을 삼 년에서 일 년으로 고친다는 것은…소작권마저 한 해마다 마음대로 빼앗거나 소작 조약을 갱신하겠다는 악랄한 조치였다.≪김원일, 불의 제전≫"]],1,[]],["곡선(曲線)","명사",0,"굽을 곡, 줄 선",[["모나지 아니하고 부드럽게 굽은 선.","곡선을 그리다."]],1,[]],["태평양(太平洋)","명사",0,"클 태, 평평할 평, 큰바다 양",[["오대양의 하나. 유라시아, 남북아메리카, 오스트레일리아 따위의 대륙에 둘러싸인 바다. 세계 바다 면적의 반을 차지한다. 면적은 1억 6525만 ㎢.",""]],1,[]],["명예(名譽)","명사",0,"이름 명, 기릴 예",[["세상으로부터 훌륭하다고 평가되고 인정되는 이름.","가문의 명예.","شَرَف، مَجْد، شُهْرَة، سُمْعَة"],["세상에서 훌륭하다고 인정되는 이름이나 자랑. 또는 그런 존엄이나 품위.","명예를 높이다."]],1,[]],["도형(圖形)","명사",0,"그림 도, 모양 형",[["그림의 모양이나 형태.","별 모양 도형."]],1,[]],["아랫사람","명사",0,"",[["가족 관계에서 나이나 위치가 자기보다 적거나 아래인 사람.","아랫사람의 도리.","شخص في علاقة عائلية أصغر سنًا أو مكانةً من المتحدث"],["나이나 항렬 따위가 자기보다 아래이거나 낮은 사람.","아랫사람과 겸상하여 먹다."],["자기보다 지위나 신분이 낮은 사람.","거만하고 지체 높은 사람일수록 아랫사람들한테 말을 걸 때는 백이면 백 모두가 말을 코끝이나 턱끝으로 튕겨 내듯 하는 것이었다.≪문순태, 타오르는 강≫"]],1,[]],["탄력(彈力)","명사",0,"탄알 탄, 힘 력",[["용수철처럼 튀거나 팽팽하게 버티는 힘.","운동화 바닥이 누군가 밀어주는 듯한 느낌이 들 정도로 탄력이 뛰어났다."]],1,[]],["기한(期限)","명사",0,"기약할 기, 한할 한",[["미리 한정하여 놓은 시기.","납품 기한."]],1,[]],["주성분(主成分)","명사",0,"임금 주, 이룰 성, 나눌 분",[["어떤 물질을 이루는 가장 중심이 되는 성분.","담배의 주성분.","عنصر التركيب الأصلي"],["어떤 물질을 이루는 주된 성분.",""]],1,[]],["원고(原稿)","명사",0,"언덕 원, 원고 고",[["인쇄하거나 발표하기 위하여 쓴 글이나 그림.","마지막 원고.","كتابة، نص مكتوب"],["인쇄하거나 발표하기 위하여 쓴 글이나 그림 따위.","원고 청탁."]],1,[]],["장군(將軍)","명사",0,"장수 장, 군사 군",[["군의 우두머리로 군을 지휘하고 통솔하는 무관.","을지문덕 장군."]],1,[]],["햇빛","명사",0,"",[["해의 빛.","햇빛이 비치다."]],1,[]],["위험(危險)","명사",0,"위태할 위, 험할 험",[["해로움이나 손실이 생길 우려가 있음. 또는 그런 상태.","위험이 따르다."]],1,[]],["방울","명사",0,"",[["작고 둥글게 맺힌 액체 덩어리.","옷에 향수 방울을 떨어뜨리다."],["얇은 쇠붙이를 속이 비도록 동그랗게 만들어 그 속에 단단한 물건을 넣어서 흔들면 소리가 나는 물건.","방울 소리."]],1,[]],["대궐(大闕)","명사",0,"클 대, 대궐 궐",[["임금이 거처하는 집.","대궐 같은 집."]],1,[]],["칼슘(calcium)","명사",0,"",[["주기율표의 2족 원소인 알칼리 토류 금속의 하나. 대리석·석회석·방해석·형석·석고·백운석·인산염 따위에 많이 들어 있는 은백색의 연한 금속으로, 연성(延性)과 전성(展性)이 있고 산소·염소와 잘 화합하며 주황색의 불꽃 반응을 보인다. 동물의 뼈와 이의 주성분이며, 이온은 조절 기능에 관여한다. 원자 기호는 Ca, 원자 번호는 20, 원자량은 40.08.",""]],1,[]],["분석(分析)","명사",0,"나눌 분, 쪼갤 석",[["얽혀 있거나 복잡한 것을 풀어서 개별적인 요소나 성질로 나눔.","심리 분석."]],1,[]],["활자(活字)","명사",0,"살 활, 글자 자",[["인쇄를 하기 위해 네모난 기둥 모양의 금속 윗면에 문자나 기호를 볼록 튀어나오게 새긴 것.","금속 활자.","حرف مطبعي"],["네모기둥 모양의 금속 윗면에 문자나 기호를 볼록 튀어나오게 새긴 것.","아버지가 매일 몇 개씩 가져온 이 활자가 문제였던 거예요. 문선공인 아버지가 인쇄소의 활자를 훔쳐 냈기 때문이죠.≪전상국, 음지의 눈≫"]],1,[]],["이마","명사",0,"",[["얼굴의 눈썹 위부터 머리카락이 난 아래까지의 부분.","동그란 이마.","جبهة"],["얼굴의 눈썹 위로부터 머리털이 난 아래까지의 부분.","이마가 넓다."]],1,[]],["지구의(地球儀)","명사",0,"땅 지, 공 구, 거동 의",[["지구를 본떠 만든 모형. 남북의 축을 23.5도로 기울여 자유롭게 회전할 수 있도록 장치한 둥근 통 위에 지구 표면의 해륙과 산천, 경선과 위선, 지명 따위를 그려 넣었다.","학교의 지리 시간에 지구의를 놓고 만다라가 섬이란 것을 배운 아이들도 그 호칭을 유감으로 생각하고 있었다.≪김민숙, 이민선≫"]],1,[]],["겉면(겉面)","명사",0,"낯 면",[["겉에 있거나 보이는 면.","겉면을 코팅한 광고지."]],1,[]],["합금(合金)","명사",0,"합할 합, 쇠 금",[["하나의 금속에 성질이 다른 하나 이상의 금속이나 비금속을 섞어서 녹여 새로운 성질의 금속을 만듦. 또는 그렇게 만든 금속.","구리와 주석의 합금으로 청동을 만들어 냈다."]],1,[]],["성인(聖人)","명사",0,"성인 성, 사람 인",[["지혜와 인격이 뛰어나 많은 사람들이 본받을 만한 사람.","위대한 성인.",""],["지혜와 덕이 매우 뛰어나 길이 우러러 본받을 만한 사람.","공맹(孔孟)이나 노장(老莊)이 성인이라면 우리 석존(釋尊) 또한 성인이시오.≪이문열, 황제를 위하여≫"]],1,[]],["천자(賤子)","명사",0,"천할 천, 아들 자",[["스스로 자기를 낮추어 이르는 말.",""]],1,[]],["인정(人情)","명사",0,"사람 인, 뜻 정",[["사람이 본래 가지고 있는 마음.","사람의 인정.","رحمة"],["사람이 본래 가지고 있는 감정이나 심정.","돈을 보면 욕심이 나는 것이 인정이다."]],1,[]],["꽁지","명사",0,"",[["새의 꽁무니 부분.","새의 꽁지.","ذَيْلٌ"],["새의 꽁무니에 붙은 깃.","공작이 꽁지를 폈다."]],1,[]],["평균(平均)","명사",0,"평평할 평, 고를 균",[["여러 사물의 질이나 양 따위를 통일적으로 고르게 한 것.","평균 성적."],["여러 수나 같은 종류의 양의 중간값을 갖는 수. 산술 평균, 기하 평균, 조화 평균 따위가 있는데 일반적으로 산술 평균을 이른다.",""]],1,[]],["곡조(曲調)","명사",0,"굽을 곡, 고를 조",[["음악이나 노래의 흐름.","경쾌한 곡조.","لَحْن"],["음악적 통일을 이루는 음의 연속.","곡조가 아름답다."]],1,[]],["생선(生鮮)","명사",0,"날 생, 고울 선",[["먹기 위해 잡은 신선한 물고기.","오실 때 생선 두 마리만 사 오세요."]],1,[]],["소재지(所在地)","명사",0,"바 소, 있을 재, 땅 지",[["주요 건물이나 기관 따위가 자리 잡고 있는 곳.","도청 소재지."]],1,[]],["수술(手術)","명사",0,"손 수, 재주 술",[["병을 고치기 위하여 몸의 한 부분을 째고 자르거나 붙이고 꿰매는 일.","맹장 수술.","عَمَلِيَّة جِرَاحِيَّة"],["피부나 점막, 기타의 조직을 의료 기계를 사용하여 자르거나 째거나 꿰매거나 하는 일.","맹장 수술."]],1,[]],["밀어(蜜語)","명사",0,"꿀 밀, 말씀 어",[["남녀 사이의 달콤하고 정다운 이야기.","사랑의 밀어."]],1,[]],["화면(畫面)","명사",0,"그림 화, 낯 면",[["한 폭의 그림이나 사진이 채우고 있는 면.","그림의 화면.","شاشة, مشهد, منظر"],["그림 따위를 그린 면.","이 작품의 화면은 색상이 좀 어두운 편이다."]],1,[]],["알루미늄(aluminium)","명사",0,"",[["은백색의 가볍고 부드러운 금속 원소. 가공하기 쉽고 가벼우며 내식성이 있다. 인체에 해가 없으므로 건축, 화학, 가정용 제품 따위에 널리 쓴다. 녹는점은 660℃, 끓는점은 2,327℃, 원자 기호는 Al, 원자 번호는 13, 원자량은 26.9815.",""]],1,[]],["외교(外交)","명사",0,"바깥 외, 사귈 교",[["다른 나라와 정치적, 경제적, 문화적 관계를 맺는 일.","외교를 맺다."]],1,[]],["파리","명사",0,"",[["파리목 털파리하목의 곤충을 통틀어 이르는 말. 몸의 길이는 1cm 정도이며 검은색 또는 청록색이고 강모가 많이 나 있다. 잘 발달된 한 쌍의 날개가 있고 더듬이는 세 마디이고 짧으며, 아래로 뾰족하게 나온 주둥이는 쏘거나 핥기에 알맞다. 완전 변태를 하며, 여름에 많이 발생하는데 장티푸스·콜레라·소아마비 따위의 병원균을 옮긴다. 전 세계에 많은 종류가 분포하는데 광대파릿과, 초파릿과, 벼룩파릿과, 집파릿과 따위가 있다.","소는 꼬리를 치며 엉덩이의 파리를 쫓는다."]],1,[]],["수치(數値)","명사",0,"셈 수, 값 치",[["계산하여 얻은 값.","위의 표에 제시된 수치는 표본 조사를 통해 산출한 것이므로 어느 정도 오차가 발생할 수 있다."]],1,[]],["솜씨","명사",0,"",[["손으로 무엇을 만들거나 다루는 재주.","그림 솜씨.","مَهَارَةٌ ، حَذَاقَةٌ ، حِذْقٌ"],["손을 놀려 무엇을 만들거나 어떤 일을 하는 재주.","요리 솜씨."]],1,[]],["혈관(血管)","명사",0,"피 혈, 대롱 관",[["혈액이 흐르는 관(管). 동맥, 정맥, 모세 혈관으로 나눈다.","바늘이 성한 왼쪽 팔의 혈관에 들어가자 튜브 속으로 피가 흘러나왔다.≪김성일, 비워 둔 자리≫"]],1,[]],["신의(信義)","명사",0,"믿을 신, 옳을 의",[["믿음과 의리를 아울러 이르는 말.","신의를 저버리다."]],1,[]],["개체(個體)","명사",0,"낱 개, 몸 체",[["전체를 이루는 낱낱의 존재.","독립적 개체.","فَرْد"],["전체나 집단에 상대하여 하나하나의 낱개를 이르는 말.","우리는 정반대로 법칙에서 자유를, 전체에서 개체를 그리고 격식에서 어떤 혼돈을 희구하려고 했던 것이 아닐까?≪이어령, 흙 속에 저 바람 속에≫"]],1,[]],["삼각형(三角形)","명사",0,"석 삼, 뿔 각, 모양 형",[["세 개의 선분으로 둘러싸인 평면 도형.","이 문제는 삼각형의 넓이를 구하는 것이다."]],1,[]],["농도(濃度)","명사",0,"짙을 농, 법도 도",[["기체나 액체에 들어 있는 성분의 진한 정도.","산소 농도.","كَثَافَة"],["용액 따위의 진함과 묽음의 정도.","농도 짙은 액체."]],1,[]],["독(毒)","명사",0,"독 독",[["건강이나 생명에 해가 되는 물질.","강력한 독.","سُمّ"],["건강이나 생명에 해가 되는 성분.","독이 온몸에 퍼지다."]],1,[]],["몸통","명사",0,"",[["사람이나 동물의 몸에서 머리, 팔, 다리 등을 뺀 중심 부분.","동물의 몸통."]],0,[]],["질환(疾患)","명사",0,"병 질, 근심 환",[["몸의 온갖 병.","유전성 질환."]],1,[]],["농민(農民)","명사",0,"농사 농, 백성 민",[["농사짓는 일을 생업으로 삼는 사람.","자영 농민."]],1,[]],["끝부분(끝部分)","명사",0,"떼 부, 나눌 분",[["물체의 끝 쪽에 있는 부분.","너무 바짝 철조망 곁으로 붙어 걸어서 바깥쪽으로 휜 철조망의 끝부분이 그만큼 시야를 가려 버린 탓이었다.≪이문열, 변경≫"]],1,[]],["수효(數爻)","명사",0,"셈 수, 사귈 효",[["낱낱의 수.","가축의 수효."]],1,[]],["윤기(潤氣)","명사",0,"불을 윤, 기운 기",[["반질반질하고 매끄러운 기운.","윤기가 흐르는 머리."]],1,[]],["구조물(構造物)","명사",0,"얽을 구, 지을 조, 물건 물",[["일정한 설계에 따라 여러 가지 재료를 얽어서 만든 물건. 건물, 다리, 축대, 터널 따위가 있다.","지상 구조물."]],1,[]],["녹지(綠地)","명사",0,"푸를 녹, 땅 지",[["천연적으로 풀이나 나무가 우거진 곳.",""]],1,[]],["일제(日帝)","명사",0,"날 일, 임금 제",[["‘일본 제국주의’를 줄여 이르는 말.",""]],1,[]],["검사(檢査)","명사",0,"검사할 검, 조사할 사",[["사실이나 일의 상태 또는 물질의 구성 성분 따위를 조사하여 옳고 그름과 낫고 못함을 판단하는 일.","검사 절차."]],1,[]],["약품(藥品)","명사",0,"약 약, 물건 품",[["병이나 상처 등을 고치거나 예방하기 위하여 먹거나 바르거나 주사하는 물질.","약품 개발.","مادة طبية"],["병이나 상처 따위를 고치거나 예방하기 위하여 먹거나 바르거나 주사하는 물질.","약품 이름."]],1,[]],["뇌(腦)","명사",0,"골 뇌",[["중추 신경 계통 가운데 머리뼈안에 있는 부분. 대뇌, 사이뇌, 소뇌, 중간뇌, 다리뇌, 숨뇌로 나뉜다. 근육의 운동을 조절하고 감각을 인식하며, 말하고 기억하며 생각하고 감정을 일으키는 중추가 있다.","뇌 기능."]],1,[]],["가구(家口)","명사",0,"집 가, 입 구",[["한 집에서 함께 사는 사람들의 집단.","도시 가구.","سُكَّانُ الْبَيْت"],["집안 식구.",""]],1,[]],["한가운데","명사",0,"",[["공간이나 시간, 상황 따위의 바로 가운데.","방 한가운데에 놓인 화로."]],1,[]],["가능성(可能性)","명사",0,"옳을 가, 능할 능, 성품 성",[["어떤 일이 앞으로 이루어질 수 있는 성질.","발병 가능성.","اِحْتِمَال، إِمْكَانِيَّة"],["앞으로 실현될 수 있는 성질이나 정도.","가능성을 점치다."]],1,[]],["수분(水分)","명사",0,"물 수, 나눌 분",[["축축한 물의 기운.","수분을 섭취하다."]],1,[]],["영토(領土)","명사",0,"거느릴 영, 흙 토",[["국제법에서, 국가의 통치권이 미치는 구역. 흔히 토지로 이루어진 국가의 영역을 이르나 영해와 영공을 포함하는 경우도 있다.","영토 분쟁."]],1,[]],["교리(敎理)","명사",0,"가르칠 교, 다스릴 리",[["종교적인 원리나 이치. 각 종교의 종파가 진리라고 규정한 신앙의 체계를 이른다.","우리 동학의 교리는 인내천(人乃天)이다. 사람이 곧 하늘이요, 하늘이 곧 사람이라는 것이다.≪유현종, 들불≫"]],1,[]],["역(役)","명사",0,"부릴 역",[["영화나 연극 등에서 배우가 맡아서 하는 인물.","나쁜 남자 역.","دَوْر"],["특별히 맡은 소임.","상담하는 역을 맡다."]],1,[]],["점수(點數)","명사",0,"점 점, 셈 수",[["성적을 나타내는 숫자.","좋은 점수."]],1,[]],["의학(醫學)","명사",0,"의원 의, 배울 학",[["인체의 구조와 기능을 조사하여 인체의 보건, 질병이나 상해의 치료 및 예방에 관한 방법과 기술을 연구하는 학문. 기초 의학, 임상 의학, 사회 의학 따위가 있다.","건강에 관심이 많은 그는 의학 지식이 매우 풍부하다."]],1,[]],["밑바닥","명사",0,"",[["어떤 것의 바닥 또는 아래가 되는 부분.","구두가 오래되어 밑바닥에 구멍이 뚫렸다."]],1,[]],["분수(分數)","명사",0,"나눌 분, 셈 수",[["사물이나 현상을 분별하는 지혜.","문명인의 분수.","سَلَامَة التَّفْكِير"],["사물을 분별하는 지혜.","무쇠솥에 화식(火食) 먹는 인간이 무슨 분수를 아오리까.≪현기영, 변방에 우짖는 새≫"],["정수 a를 0이 아닌 정수 b로 나눈 몫을 a/b로 표시한 것. a, b가 양의 정수일 때에, 분수 a/b는 1을 b등분 한 것이 a개 모인 것으로 생각할 수도 있고, a의 b에 대한 비 a:b의 값으로 볼 수도 있다.",""]],1,[]],["견해(見解)","명사",0,"볼 견, 풀 해",[["어떤 사물이나 현상에 대한 자기의 의견이나 생각.","견해 차이."]],1,[]],["선비","명사",0,"",[["(옛날에) 학문을 배우고 익힌 사람.","선비 가문.",""],["예전에, 학식은 있으나 벼슬하지 않은 사람을 이르던 말.","그는 벼슬에 나아가지 않고 평생 선비로 살아간 분이다."]],1,[]],["공덕(功德)","명사",0,"공 공, 큰 덕",[["좋은 일을 하여 쌓은 업적과 훌륭한 인품.","공덕이 높다.","إِحْسَان"],["착한 일을 하여 쌓은 업적과 어진 덕.","공덕이 높다."]],1,[]],["기생(寄生)","명사",0,"부칠 기, 날 생",[["다른 동물이나 식물에 붙어서 영양분을 빼앗아 먹으며 살아감.","기생 관계.","طُفَيْلِيَّة"],["서로 다른 종류의 생물이 함께 생활하며, 한쪽이 이익을 얻고 다른 쪽이 해를 입고 있는 일. 또는 그런 생활 형태.",""]],1,[]],["국경(國境)","명사",0,"나라 국, 지경 경",[["나라와 나라의 영역을 가르는 경계.","국경을 초월한 사랑."]],1,[]],["근원(根源)","명사",0,"뿌리 근, 근원 원",[["물줄기가 처음 생겨서 흐르기 시작하는 곳.","강의 근원.","مَصْدَرٌ"],["물줄기가 나오기 시작하는 곳.","압록강의 근원은 백두산이다."]],1,[]],["낼","명사",0,"",[["‘’의 준말.","오늘도 해결 못 한 일이 낼이라고 해결될 리 없다."]],1,[]],["간의(懇意)","명사",0,"간절할 간, 뜻 의",[["간절한 뜻.",""]],1,[]],["고운(孤雲)","명사",0,"외로울 고, 구름 운",[["외로이 혼자 떠 있는 구름.","그리운 임을 떠나보낸 나의 마음은 저 하늘의 고운과 같다."]],1,[]],["기침","명사",0,"",[["폐에서 목구멍을 통해 공기가 거친 소리를 내며 갑자기 터져 나오는 일.","심한 기침.","سُعَال"],["기도의 점막이 자극을 받아 갑자기 숨소리를 터트려 내는 일. 목감기의 주된 증상 가운데 하나로, 마른기침과 젖은기침의 두 가지가 있다.","심한 기침."]],1,[]],["강원도(江原道)","명사",0,"강 강, 언덕 원, 길 도",[["한국의 행정 구역 단위인 도의 하나. 중동부에 위치한 산악 지대로 동쪽으로 동해를 접하고 있으며 감자, 옥수수, 오징어, 명태 등이 많이 난다. 주요 도시로는 평창, 춘천, 강릉 등이 있다.","","مُحَافَظَةُ كَانْغْوُون"],["우리나라 중동부, 남한 지역에 속한 도. 고구려의 땅이었으며 조선 태조 때 지금의 이름이 되었다. 강릉과 원주의 머리글자에서 따온 말이다. 2023년 ‘강원특별자치도 설치 및 미래 산업 글로벌 도시 조성을 위한 특별법’에 의하여 특별자치도로 승격하였다. 도청 소재지는 춘천이다. 면적은 약 16,875㎢.",""]],1,[]],["함수(函數)","명사",0,"함 함, 셈 수",[["두 개의 변수 x, y 사이에서, x가 일정한 범위 내에서 값이 변하는 데 따라서 y의 값이 종속적으로 정해질 때, x에 대하여 y를 이르는 말. y가 x의 함수라는 것은 y=f(x)로 표시한다.",""]],1,[]],["성균관(成均館)","명사",0,"이룰 성, 고를 균, 집 관",[["고려 시대 유학을 가르치던 최고의 교육 기관.","","سونغكيونكوان"],["조선 시대에, 유학의 교육을 맡아보던 관아. 공자를 제사하는 문묘와 유학을 강론하는 명륜당 따위로 이루어지며, 태조 7년(1398)에 설치하여 고종 24년(1887)에 경학원으로 고쳤다가 융희 4년(1910)에 없앴다.",""]],1,[]],["정신적(精神的)","명사",0,"정할 정, 귀신 신, 과녁 적",[["정신에 관계되는 것.","정신적인 사랑."]],1,[]],["국악(國樂)","명사",0,"나라 국, 즐길 악",[["나라의 고유한 음악.",""]],1,[]],["필리핀(Philippines)","명사",0,"",[["서태평양 서쪽에 있는 7,100여 개의 섬으로 이루어진 공화국. 대부분의 섬은 이름 없는 암초이거나 산호초이고 사람이 정착하고 있는 섬은 880개 정도로 루손섬이 가장 크고, 민다나오섬이 뒤를 잇는다. 엠덴 해연이 있다. 1946년 미국에서 독립하였으며, 농업이 주산업으로 설탕·파인애플·마닐라삼·코프라·연초가 5대 수출품이다. 주민은 말레이계로 대부분이 가톨릭교도이고 주요 언어는 필리피노어와 영어이다. 수도는 마닐라, 면적은 29만 9536㎢.",""]],1,[]],["모","명사",0,"",[["논에 옮겨 심기 위하여 기른 벼의 싹.","모 한 포기.","بُرْعُم الْأَرُزّ"],["물건의 거죽으로 쑥 나온 귀퉁이.","모가 없는 동글동글한 자갈돌."]],1,[]],["숫자(數字)","명사",0,"셈 숫, 글자 자",[["수를 나타내는 글자.","아라비아 숫자.","عَدَد"],["수를 나타내는 글자. 1, 2, 3 …… 또는 一, 二, 三 …… 따위이다.","숫자를 세다."]],1,[]],["고유(固有)","명사",0,"굳을 고, 있을 유",[["본래부터 가지고 있는 특유한 것.","고유 의상."]],1,[]],["그해","명사",0,"",[["말하는 이와 듣는 이가 알고 있거나 말하는 이만 알고 있는 과거의 어느 해.","윤씨 부인이 절에서 돌아온 그해 동짓달. 나이 열세 살에 치수는 성례를 치르었다.≪박경리, 토지≫"]],1,[]],["풍물놀이(風物놀이)","명사",0,"바람 풍, 물건 물",[["농촌에서 농부들 사이에 행해지는 우리나라 고유의 음악. 나발, 태평소, 소고, 꽹과리, 북, 장구, 징 따위를 불거나 치면서 노래하고 춤추며 때로는 곡예를 곁들이기도 한다.","대보름 달맞이를 가거나 달집 태우는 풍물놀이를 구경 가거나….≪최명희, 혼불≫"]],1,[]],["오스트리아(Austria)","명사",0,"",[["유럽 중부에 있는 공화국. 1938년에 독일에 병합되었다가 1955년에 주권을 회복하여 영세 중립국이 되었다. 암염, 흑연 따위가 많이 나고 임업이 특히 발달하였다. 주민은 게르만계로 대부분이 가톨릭교도이고 주요 언어는 독일어이다. 수도는 빈, 면적은 8만 3855㎢.",""]],1,[]],["막대","명사",0,"",[["‘막대기’의 준말.","막대로 손바닥을 때리다."]],1,[]],["주석(主席)","명사",0,"임금 주, 자리 석",[["가장 중심이 되는 자리.","주석을 노리다.","مقعد رئيسيّ"],["주가 되는 자리.","이순신 장군이 주석에 앉고 곽재우·김덕령·선거이 모든 육전 대장들이 차례로 앉았다.≪박종화, 임진왜란≫"]],1,[]],["문종(文宗)","명사",0,"글월 문, 마루 종",[["문장이나 문학에 뛰어나 한 파(派)의 시조(始祖)로 일컬어지는 사람.",""]],1,[]],["한나라","명사",0,"",[["큰 나라라는 뜻으로, 우리나라를 달리 이르는 말.",""]],1,[]],["이북(以北)","명사",0,"써 이, 북녘 북",[["기준이 되는 지점에서부터 그 북쪽.","강 이북.","شَمَال"],["어떤 지점을 기준으로 하여 그 북쪽.","경기 이북 지방."]],1,[]],["식사(食事)","명사",0,"밥 식, 일 사",[["끼니로 음식을 먹음. 또는 그 음식.","식사가 끝나다."]],1,[]],["윤(潤)","명사",0,"불을 윤",[["반질반질하고 매끄러운 기운.","가구에 윤을 내다."]],1,[]],["진행(進行)","명사",0,"나아갈 진, 다닐 행",[["앞으로 나아감.","진행 방향.","إِجْرَاءٌ"],["앞으로 향하여 나아감.","흘러가는 소나무 숲 그림자들만이 그런대로 일정하게 차의 진행을 느끼게 해 왔다.≪이청준, 살아 있는 늪≫"]],1,[]],["관원(官員)","명사",0,"벼슬 관, 인원 원",[["관청에 나가서 나랏일을 맡아보는 사람.","당나라에서 당태종 이하 모든 관원과 백성들이 신라를 동경하여 많은 물자를 주었다.≪홍효민, 신라 통일≫"]],1,[]],["기와","명사",0,"",[["지붕을 이는 데에 쓰기 위하여 흙을 굽거나 시멘트 따위를 굳혀서 만든 건축 자재. 우리나라에는 수키와와 암키와의 구별이 있다.","기와 한 장."]],1,[]],["두루낮춤","명사",0,"",[["상대 높임법에서, ‘해라체’와 ‘하게체’에 대신할 수 있는 낮춤. “철수가 벌써 그 연구를 시작했어.”의 ‘시작했어’ 따위와 같은 ‘해체’의 표현을 이른다.",""]],1,[]],["어른","명사",0,"",[["다 자란 사람.","어엿한 어른.","رَجُل"],["다 자란 사람. 또는 다 자라서 자기 일에 책임을 질 수 있는 사람.","아이 같은 어른."]],1,[]],["웃어른","명사",0,"",[["나이나 지위, 신분, 항렬 따위가 자기보다 높아 직접 또는 간접으로 모시는 어른.","웃어른으로 대접하다."]],1,[]],["체제(體制)","명사",0,"몸 체, 절제할 제",[["생기거나 이루어진 모양이나 형식.","체제가 다르다.","نِظَام"],["생기거나 이루어진 틀. 또는 그런 됨됨이.","공동 대표 체제."]],1,[]],["민물고기","명사",0,"",[["민물에서 사는 물고기.",""]],1,[]],["안개","명사",0,"",[["지표면 가까이에 아주 작은 물방울이 부옇게 떠 있는 현상.","안개가 걷히다."]],1,[]],["이집트(Egypt)","명사",0,"",[["아프리카 동북부 나일강 유역 중심부에 있는 공화국. 인류 문명 발상지 가운데 하나로 고대에는 농경 문명이 번영하였고, 기원전 3000년경에 이미 통일 국가를 형성하였다. 1922년 영국에서 독립하였으며, 1953년에 공화제가 되었다. 석유·목화·쌀 따위가 많이 난다. 주민은 대부분 아랍인이다. 수도는 카이로, 면적은 100만 2071㎢.",""]],1,[]],["사초과(莎草科)","명사",0,"사초 사, 풀 초, 과목 과",[["외떡잎식물의 한 과. 전 세계에 85속 3,000여 종이 있으며, 우리나라에는 까락골, 네모골, 곱슬사초, 하늘지기 따위의 13속 233종이 분포한다.",""]],1,[]],["수직(垂直)","명사",0,"드리울 수, 곧을 직",[["사물이 아래로 곧게 내려가거나 떨어지는 상태.","수직의 낭떠러지.","عَمُودِيًّا ، رَأْسِيًّا"],["똑바로 드리우는 상태.","수직의 낭떠러지."]],1,[]],["표지(表紙)","명사",0,"겉 표, 종이 지",[["책의 맨 앞뒤의 겉장.","표지가 바래고 낡은 책."],["읽던 곳이나 필요한 곳을 찾기 쉽도록 책갈피에 끼워 두는 종이쪽지나 끈.","도서관에서 빌린 책에 아름다운 글귀가 적힌 표지가 꽂혀 있었다."]],1,[]],["극(極)","명사",0,"극진할 극",[["더 이상 그 상태를 유지할 수 없는 마지막 단계.","극에 다다르다.","قُطْبٌ"],["어떤 정도가 더할 수 없을 만큼 막다른 지경.","횡포가 극에 달하다."]],1,[]],["예의(禮儀)","명사",0,"예도 예, 거동 의",[["존경의 뜻을 표하기 위하여 예로써 나타내는 말투나 몸가짐.","예의 바른 행동."]],1,[]],["경사(傾斜)","명사",0,"기울 경, 비낄 사",[["비스듬히 기울어짐. 또는 그런 상태나 정도.","완만한 경사를 이룬 언덕."]],1,[]],["전설(傳說)","명사",0,"전할 전, 말씀 설",[["옛날부터 민간에서 전하여 내려오는 이야기. 주로 구전되며 어떤 공동체의 내력이나 자연물의 유래, 이상한 체험 따위를 소재로 한다.","장자못 전설."]],1,[]],["장관(壯觀)","명사",0,"장할 장, 볼 관",[["훌륭하고 대단한 광경.","장관이 펼쳐지다.","مشهد عظيم"],["훌륭하고 장대한 광경.","장관을 이루다."]],1,[]],["유적(遺跡/遺蹟)","명사",0,"남길 유, 발자취 적 / 남길 유, 자취 적",[["남아 있는 자취. 건축물이나 싸움터 또는 역사적인 사건이 벌어졌던 곳이나 패총, 고분 따위를 이른다.","선사 시대의 유적."]],1,[]],["영어(英語)","명사",0,"꽃부리 영, 말씀 어",[["인도·유럽 어족 게르만 어파의 서게르만 어군에 속한 언어. 미국, 영국, 캐나다, 오스트레일리아 등을 비롯하여 세계 여러 나라에서 사용하는 국제어의 구실을 하고 있다.","영어 수업."]],1,[]],["계절(季節)","명사",0,"계절 계, 마디 절",[["일 년을 자연 현상에 따라 봄, 여름, 가을, 겨울로 나눈 것의 한 때.","새로운 계절."]],0,[]],["하나님","명사",0,"",[["‘하느님「2」’을 개신교에서 이르는 말.",""]],1,[]],["담","명사",0,"",[["집이나 일정한 공간의 둘레를 막기 위해 쌓아 올린 것.","담 구멍.","سِيَاج"],["‘다음01「1」’의 준말.","그녀는 그의 담이 자기라는 것을 알고 긴장했다."]],1,[]],["약속(約束)","명사",0,"맺을 약, 묶을 속",[["다른 사람과 앞으로의 일을 어떻게 할 것인가를 미리 정하여 둠. 또는 그렇게 정한 내용.","약속 시간."]],1,[]],["버섯","명사",0,"",[["담자균류와 자낭균류의 고등 균류를 통틀어 이르는 말. 주로 그늘진 땅이나 썩은 나무에서 자라며, 홀씨로 번식한다. 송이처럼 독이 없는 것은 식용하나 독이 있는 것도 많다.","버섯을 따다."]],1,[]],["일대(一代)","명사",0,"한 일, 대신할 대",[["한 시대나 한 세대 전체.","일대 영웅."]],1,[]],["직물(織物)","명사",0,"짤 직, 물건 물",[["씨실과 날실을 직기에 걸어 짠 물건을 통틀어 이르는 말. 면직물, 모직물, 견직물 따위가 있다.","천연 직물."]],1,[]],["명사(名士)","명사",0,"이름 명, 선비 사",[["세상에 널리 알려진 사람.","각계의 명사."]],1,[]],["정당(政黨)","명사",0,"정사 정, 무리 당",[["정치적인 주의나 주장이 같은 사람들이 정권을 잡고 정치적 이상을 실현하기 위하여 조직한 단체.","정당을 결성하다."]],1,[]],["평안북도(平安北道)","명사",0,"평평할 평, 편안 안, 북녘 북, 길 도",[["우리나라 북서부에 있는 도. 고려 시대에 강동 육성을 두었으며, 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 신의주이다. 면적은 약 28,442㎢.",""]],1,[]],["곤충강(昆蟲綱)","명사",0,"맏 곤, 벌레 충, 벼리 강",[["절지동물문의 한 강. 몸은 키틴질의 외골격으로 싸여 있고 많은 체절로 되었으며 머리, 가슴, 배의 세 부분으로 나누어진다. 머리에 한 쌍의 더듬이와 겹눈, 가슴에 두 쌍의 날개와 세 쌍의 다리가 있고 기관으로 호흡하며 암수딴몸으로 난생, 변태를 한다. 지구상에 약 80만 종이 분포하는데 전 동물의 4분의 3에 해당한다.",""]],1,[]],["배우(俳優)","명사",0,"배우 배, 넉넉할 우",[["연극이나 영화 따위에 등장하는 인물로 분장하여 연기를 하는 사람.","영화의 주역을 맡은 배우."]],1,[]],["미술(美術)","명사",0,"아름다울 미, 재주 술",[["공간 및 시각의 미를 표현하는 예술. 그림·조각·건축·공예·서예 따위로, 공간 예술·조형 예술 등으로 불린다.","고대 사회의 미술 활동은 주로 고분을 통해서 알 수 있다."]],1,[]],["영양(營養)","명사",0,"경영할 영, 기를 양",[["생물이 살아가는 데 필요한 에너지와 몸을 구성하는 성분을 외부에서 섭취하여 소화, 흡수, 순환, 호흡, 배설을 하는 과정. 또는 그것을 위하여 필요한 성분.","영양 보충."]],1,[]],["직책(職責)","명사",0,"직분 직, 꾸짖을 책",[["직무상의 책임.","맡은 직책을 성실히 수행하다."]],1,[]],["인식(認識)","명사",0,"알 인, 알 식",[["사물을 분별하고 판단하여 앎.","인식이 높다."]],1,[]],["직장(職場)","명사",0,"직분 직, 마당 장",[["돈을 받고 일하는 곳.","나쁜 직장.","معمل"],["사람들이 일정한 직업을 가지고 일하는 곳.","그는 아침 일찍 직장으로 출근했다."]],1,[]],["입고(入庫)","명사",0,"들 입, 곳집 고",[["물건을 창고에 넣음.","화물의 입고가 끝나 창고 문을 닫았다."]],1,[]],["양자(養子)","명사",0,"기를 양, 아들 자",[["아들이 없는 집에서 대를 잇기 위하여 동성동본 중에서 데려다 기르는 조카뻘 되는 남자아이.","둘째를 큰댁에 양자로 보냈다."]],1,[]],["일로(一路)","명사",0,"한 일, 길 로",[["단 하나의 길.",""]],1,[]],["불꽃","명사",0,"",[["타는 불에서 일어나는 붉은색의 빛.","빨간 불꽃.","شُعْلَة ، شَرَارَة"],["타는 불에서 일어나는 붉은빛을 띤 기운.","불꽃이 일다."]],1,[]],["붓","명사",0,"",[["자루 끝에 달린 털에 먹이나 물감을 묻혀 글씨를 쓰거나 그림을 그리는 도구.","대나무 붓.","رِيشَةُ الرَّسْمِ"],["글씨를 쓰거나 그림을 그리거나 페인트칠을 할 때 쓰는 도구의 하나. 주로 가는 대나무나 나무로 된 자루 끝에 짐승의 털을 꽂아서 먹이나 물감을 찍어 쓴다.","붓 한 자루."]],1,[]],["꾸밈","명사",0,"",[["꾸민 상태나 모양. 또는 꾸민 것.","솔직하고 꾸밈이 없는 태도."]],1,[]],["관절(關節)","명사",0,"관계할 관, 마디 절",[["뼈와 뼈가 서로 맞닿아 연결되어 있는 곳. 움직일 수 없는 관절과 움직일 수 있는 관절이 있다.","관절에 염증이 생겨 쑤신다."]],1,[]],["화석(化石)","명사",0,"될 화, 돌 석",[["아주 옛날에 살았던 생물의 뼈, 활동 흔적 등이 땅속에 묻혀 굳어져 지금까지 남아 있는 것.","발자국 화석.","أحْفُور، حفريّات"],["지질 시대에 생존한 동식물의 유해와 활동 흔적 따위가 퇴적물 중에 매몰된 채로 또는 지상에 그대로 보존되어 남아 있는 것을 통틀어 이르는 말. 생물의 진화, 그 시대의 지표 상태를 아는 데에 큰 도움이 된다.","화석 발굴."]],1,[]],["반죽","명사",0,"",[["가루에 물을 넣고 섞어 개어 놓음. 또는 그렇게 한 것.","밀가루 반죽.","عَجِين"],["가루에 물을 부어 이겨 갬. 또는 그렇게 한 것.","밀가루 반죽."]],1,[]],["주나라(周나라)","명사",0,"두루 주",[["기원전 1046년에서 기원전 256년까지 중국을 지배하던 왕조. 무왕이 은나라를 멸망시키고 건국하여, 호경에 도읍을 정하고 봉건 제도를 시행하였다.",""]],1,[]],["정권(政權)","명사",0,"정사 정, 권세 권",[["정치상의 권력. 또는 정치를 담당하는 권력.","정권 교체."]],1,[]],["근심","명사",0,"",[["해결되지 않은 일 때문에 속을 태우거나 우울해함.","근심이 많다."]],1,[]],["명의(名義)","명사",0,"이름 명, 옳을 의",[["어떤 행동의 주체로서 공식적으로 알리는 개인이나 기관의 이름.","교수 명의.","اِسْم"],["어떤 일이나 행동의 주체로서 공식적으로 알리는 개인 또는 기관의 이름.","동창회 명의로 모교에 장학금을 전달하였다."]],1,[]],["경상남도(慶尙南道)","명사",0,"경사 경, 오히려 상, 남녘 남, 길 도",[["우리나라 남동부에 있는 도. 삼한(三韓) 때에는 진한(辰韓), 삼국 시대에는 신라의 땅이었으며, 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 창원이다. 면적은 약 10,541㎢.",""]],1,[]],["동(東)","명사",0,"동녘 동",[["동서남북 네 방위 중의 하나로, 해가 뜨는 쪽.","동을 바라보다.","شَرْق"],["네 방위의 하나. 해가 떠오르는 쪽이다.","바람이 동에서 서로 불었다."]],1,[]],["가정(假定)","명사",0,"거짓 가, 정할 정",[["사실이 아니거나 사실인지 아닌지 분명하지 않은 것을 임시로 받아들임.","억지 가정.","اِفْتِرَاض"],["사실이 아니거나 또는 사실인지 아닌지 분명하지 않은 것을 임시로 인정함.","그의 의식 속에는 만약이라는 가정이 항상 존재하고 있다."]],1,[]],["향료(香料)","명사",0,"향기 향, 헤아릴 료",[["향기를 내는 데 쓰는 물질. 흔히 식품이나 화장품 따위에 넣어 향기를 내게 한다.","인공 향료."]],1,[]],["어린이","명사",0,"",[["‘어린아이’를 대접하거나 격식을 갖추어 이르는 말. 대개 4, 5세부터 초등학생까지의 아이를 이른다.","어린이는 나라의 보배."]],1,[]],["현악기(絃樂器)","명사",0,"줄 현, 즐길 악, 그릇 기",[["현을 켜거나 타서 소리를 내는 악기. 가야금, 거문고, 바이올린, 첼로, 비올라 따위이다.","현악기의 줄은 늘어질 대로 늘어져 흉한 마찰음만 낸다.≪이청준, 조율사≫"]],1,[]],["지형(地形)","명사",0,"땅 지, 모양 형",[["땅의 생긴 모양이나 형세.","지형이 험하다."]],1,[]],["두루높임","명사",0,"",[["상대 높임법에서, ‘하오체’와 ‘하십시오체’에 대신할 수 있는 높임. “철수가 벌써 그 연구를 시작했어.”의 ‘시작했어’에 ‘요’를 붙이면 된다.",""]],1,[]],["위아래","명사",0,"",[["위와 아래.","위아래가 같다.","فوق وتحت"],["아래와 위를 아울러 이르는 말.","위아래 입술을 꾹 다물다."]],1,[]],["낮","명사",0,"",[["해가 뜰 때부터 질 때까지의 동안.","낮과 밤."]],1,[]],["왕명(王命)","명사",0,"임금 왕, 목숨 명",[["임금의 명령.","왕명을 받들다."]],1,[]],["칸","명사",0,"",[["건물, 기차 안, 책장 등을 용도에 따라 일정한 크기나 모양으로 나누어 둘러막은 공간.","기차의 앞 칸.","رفّ، طابق، مقصورة، حجرة"],["건물, 기차 안, 책장 따위에서 일정한 규격으로 둘러막아 생긴 공간.","책장 맨 아래 칸에만 책이 꽂혀 있고 나머지 칸은 텅 비어 있다."]],1,[]],["나트륨(Natrium)","명사",0,"",[["열을 가하여 녹인 수산화 나트륨을 전기 분해를 하여 얻는 알칼리 금속 원소. 바닷물·광물·암염 따위에 다량으로 들어 있으며, 동물의 몸 안에서 생리 작용에 중요한 구실을 한다. 원자로의 냉각제·환원제, 합금 금속, 촉매 따위로 널리 쓴다. 원자 기호는 Na, 원자 번호는 11, 원자량은 22.98977.",""]],1,[]],["동사(凍死)","명사",0,"얼 동, 죽을 사",[["얼어 죽음.","추운 겨울에 만취한 상태에서 길에 쓰러지면 동사의 위험이 있다."]],1,[]],["만물(萬物)","명사",0,"일만 만, 물건 물",[["세상에 있는 모든 것.","우주 만물."]],1,[]],["원형(原形)","명사",0,"언덕 원, 모양 형",[["처음 생긴 대로의 모양이나 형태.","원형이 손상되다.","شَكْلٌ أَصْلِيّ"],["본디의 꼴.","원형 보존."]],1,[]],["지층(地層)","명사",0,"땅 지, 층 층",[["알갱이의 크기·색·성분 따위가 서로 달라서 위아래의 퇴적암과 구분되는 퇴적암체.",""]],1,[]],["용기(勇氣)","명사",0,"날랠 용, 기운 기",[["씩씩하고 굳센 기운. 또는 사물을 겁내지 아니하는 기개.","용기가 나다."]],1,[]],["잔(盞)","명사",0,"잔 잔",[["물이나 차 등을 따라 마시는 작은 그릇.","물 잔.","فنجان، كأس"],["차나 커피 따위의 음료를 따라 마시는 데 쓰는 작은 그릇. 손잡이와 받침이 있다.","잔에 우유를 따라 마시다."],["술을 따라 마시는 그릇. 유리·사기·쇠붙이 따위로 만들며, 크기와 모양은 여러 가지이다.","잔을 돌리다."]],1,[]],["렌즈(lens)","명사",0,"",[["유리나 수정을 볼록하거나 오목하게 깎아서 물체가 크거나 작게 보이도록 만든 물건.","국산 렌즈.","عَدَسَة"],["빛을 모으거나 분산하기 위하여 수정이나 유리를 갈아서 만든 투명한 물체. 오목 렌즈와 볼록 렌즈가 있고, 안경이나 현미경·망원경·가정용 손전등 따위에 사용된다.","카메라 렌즈를 교체하다."]],1,[]],["세대(世代)","명사",0,"인간 세, 대신할 대",[["부모가 속한 시대와 그 자녀가 속한 시대의 차이인 약 30년 정도 되는 기간.","다음 세대.","جِيل"],["어린아이가 성장하여 부모 일을 계승할 때까지의 30년 정도 되는 기간.","이제 이 땅에서 번역되거나 재구성된 삼국지는 대개가 한 세대 가까이 오래된 것이 됐다.≪이문열, 시대와의 불화≫"]],1,[]],["기법(技法)","명사",0,"재주 기, 법 법",[["기교와 방법을 아울러 이르는 말.",""]],1,[]],["전력(戰力)","명사",0,"싸움 전, 힘 력",[["전투나 경기 따위를 할 수 있는 능력.","전력을 증강하다."]],1,[]],["예로(曳撈)","명사",0,"끌 예, 건질 로",[["씨앗을 뿌린 뒤에 씨앗이 흙에 덮이게 하는 농기구. 가마니때기에 두 가닥의 줄을 매고 위에 뗏장을 놓고 끈다.",""]],1,[]],["중종(中宗)","명사",0,"가운데 중, 마루 종",[["조선 제11대 왕(1488~1544). 이름은 역(懌). 자는 낙천(樂天). 혁신 정치를 꾀하다가 훈구파의 반대로 실패하고 기묘사화를 불러일으켰다. 재위 기간은 1506~1544년이다.",""]],1,[]],["춤사위","명사",0,"",[["민속무에서, 춤의 기본이 되는 낱낱의 일정한 동작.","그녀는 일찍부터 보성, 고흥 일대를 발판으로 삼고 있는, 가락 좋고 춤사위 좋기로 그 이름을 떨친 당골네였다.≪조정래, 태백산맥≫"]],1,[]],["뒷날개","명사",0,"",[["곤충의 뒷가슴등에 달린 날개.",""]],1,[]],["발생(發生)","명사",0,"필 발, 날 생",[["어떤 일이나 사물이 생겨남.","문자의 발생."]],1,[]],["자금(資金)","명사",0,"재물 자, 쇠 금",[["사업을 하는 데에 쓰는 돈.","자금 사정.","أموال"],["사업을 경영하는 데에 쓰는 돈.","기업에 자금을 대다."]],1,[]],["비밀(祕密)","명사",0,"숨길 비, 빽빽할 밀",[["숨기고 있어 남이 모르는 일.","신체 비밀.","سِرّ"],["숨기어 남에게 드러내거나 알리지 말아야 할 일.","비밀이 탄로 나다."]],1,[]],["그림자","명사",0,"",[["물체가 빛을 가려서 그 물체의 뒷면에 나타나는 검은 그늘.","옅은 그림자."]],0,[]],["두상화(頭狀花)","명사",0,"머리 두, 형상 상, 꽃 화",[["꽃대 끝에 많은 꽃이 뭉쳐 붙어서 머리 모양을 이룬 꽃. 국화, 민들레, 해바라기 따위가 있다.",""]],1,[]],["전신(前身)","명사",0,"앞 전, 몸 신",[["신분, 단체, 회사 등의 바뀌기 전의 것.","단체의 전신.","السابق"],["신분, 단체, 회사 따위의 바뀌기 전의 본체.","문화 체육 관광부의 전신은 문화 관광부이다."]],1,[]],["결혼(結婚)","명사",0,"맺을 결, 혼인할 혼",[["남녀가 정식으로 부부 관계를 맺음.","결혼 상대."]],1,[]],["허물","명사",0,"",[["살갗에서 저절로 일어나는 얇은 껍질.","허물이 까지다.","سلخ، جلد منسلخ"],["잘못 저지른 실수.","허물을 들추어내다."],["살갗에서 저절로 일어나는 꺼풀.","허물이 벗어지다."]],1,[]],["춘추(春秋)","명사",0,"봄 춘, 가을 추",[["봄과 가을.","매해 춘추.","الربيع والخريف"],["봄과 가을을 아울러 이르는 말.","춘추 외투."]],1,[]],["향(香)","명사",0,"향기 향",[["장례식이나 제사 때 쓰는, 불에 태워서 냄새를 내는 물건.","향의 냄새.","بخور، لبان، عطر، طيب، عبق، رائحة عطرة"],["불에 태워서 냄새를 내는 물건. 주로 제사 때 쓴다.","향을 사르다."],["꽃, 향, 향수 따위에서 나는 좋은 냄새.","향이 독특한 나물."]],1,[]],["궁궐(宮闕)","명사",0,"집 궁, 대궐 궐",[["임금이 거처하는 집.","궁궐을 중수하다."]],1,[]],["점차(漸次)","명사",0,"점점 점, 버금 차",[["차례를 따라 진행됨.","점차로 희미해지는 기억."]],1,[]],["심리(心理)","명사",0,"마음 심, 다스릴 리",[["마음의 움직임이나 의식의 상태.","기대 심리.","النَّفْس"],["마음의 작용과 의식의 상태.","사람의 심리란 참 묘한 거야."]],1,[]],["나비","명사",0,"",[["천이나 종이 등의 너비.","나비가 넓다.","عَرْض"],["나비목의 곤충 가운데 낮에 활동하는 무리를 통틀어 이르는 말. 몸은 가늘고 빛깔이 매우 아름답다. 머리에 한 쌍의 더듬이와 두 개의 겹눈이 있고 가슴에 큰 잎 모양의 두 쌍의 날개가 있다. 긴 대롱처럼 생긴 입으로 꽃의 꿀을 빨아 먹으며, 애벌레는 대개 식물을 먹는다. 전 세계에 2만여 종, 우리나라에는 250여 종이 있다.","나비 두 마리를 잡다."]],1,[]],["왕비(王妃)","명사",0,"임금 왕, 왕비 비",[["임금의 아내.","왕과 왕비."]],1,[]],["백합과(白蛤科)","명사",0,"흰 백, 조개 합, 과목 과",[["연체동물문 이매패강 백합목의 한 과. 일반적으로 각정부가 왼쪽으로 치우쳐 있다. 대부분 식용하며 우리나라에는 24종이 보고되어 있다. 주름백합, 수수조개, 등뿔조개, 바지락 따위가 있다.",""]],1,[]],["인종(人種)","명사",0,"사람 인, 씨 종",[["인류를 지역과 신체적 특성에 따라 구분한 종류. 백인종, 황인종, 흑인종이 대표적이다.","아메리칸 인디언은 몽골 계통의 인종으로 알려져 있다."]],1,[]],["척추동물(脊椎動物)","명사",0,"등마루 척, 쇠몽치 추, 움직일 동, 물건 물",[["척추동물문의 동물을 통틀어 이르는 말.",""]],1,[]],["절반(折半)","명사",0,"꺾을 절, 반 반",[["하나를 반으로 가름. 또는 그렇게 가른 반.","절반으로 나누다."]],1,[]],["우유(牛乳)","명사",0,"소 우, 젖 유",[["소의 젖. 백색으로, 살균하여 음료로 마시며 아이스크림, 버터, 치즈 따위의 원료로도 쓴다.","우유 배달부."]],1,[]],["자줏빛(紫朱빛)","명사",0,"자줏빛 자, 붉을 줏",[["짙은 남빛을 띤 붉은빛.","자줏빛 고름."]],1,[]],["정사(正史)","명사",0,"바를 정, 사기 사",[["정확한 사실의 역사. 또는 그런 기록.","정사에 기록되다."]],1,[]],["자치(自治)","명사",0,"스스로 자, 다스릴 치",[["자신의 일을 스스로 다스림.","자치 계획.","الحكم الذاتي"],["자기 일을 스스로 다스림.","자치 정신."]],1,[]],["설","명사",0,"",[["한국의 명절의 하나. 음력 1월 1일로 아침에 가족과 친척들이 모여 차례를 지내고 어른들께 세배를 올린다. 떡국을 먹고 윷놀이, 널뛰기, 연날리기 같은 민속놀이를 즐기기도 한다.","","سُول"],["우리나라 명절의 하나. 정월 초하룻날이다.","설을 쇠다."]],1,[]],["노력(勞力)","명사",0,"일할 노, 힘 력",[["힘을 들여 일함.","시내의 공장에 노력 봉사를 나가고 있는 남편도 원래는 이 관리소 소속입니다.≪이문열, 영웅시대≫"]],1,[]],["전의(戰意)","명사",0,"싸움 전, 뜻 의",[["싸우고자 하는 의욕.","전의가 왕성하다."]],1,[]],["행실(行實)","명사",0,"다닐 행, 열매 실",[["실지로 드러나는 행동.","행실이 바르다."]],1,[]],["무명(無名)","명사",0,"없을 무, 이름 명",[["이름이 없거나 이름을 알 수 없음.","나는…자유의 제단 앞에 몸을 바친 무수한 무명의 의인들의 거룩한 피를 생각한다.≪안병욱, 사색인의 향연≫"]],1,[]],["불상(佛像)","명사",0,"부처 불, 모양 상",[["조각이나 그림 따위로 부처의 형상을 표현한 상.",""]],1,[]],["쑥","명사",0,"",[["국화과에 속하는 쑥, 산쑥, 덤불쑥, 참쑥, 물쑥 따위를 통틀어 이르는 말.","식용이 가능한 쑥에는 산쑥, 물쑥 등이 있다."]],1,[]],["상대방(相對方)","명사",0,"서로 상, 대할 대, 모 방",[["어떤 일이나 말을 할 때 짝을 이루는 사람.","상대방의 입장에서 생각하다."]],1,[]],["기상(氣像)","명사",0,"기운 기, 모양 상",[["사람이 타고난 기개나 마음씨. 또는 그것이 겉으로 드러난 모양.","늠름하고 활달한 기상."]],1,[]],["가곡(歌曲)","명사",0,"노래 가, 굽을 곡",[["시를 피리, 가야금, 거문고 등 전통 악기에 맞춰서 노래하는 한국의 전통 성악곡.","남창 가곡.","أُغْنِيَة كِلَاسِيكِيَّة"],["우리나라 전통 성악곡의 하나. 시조의 시를 5장 형식으로, 피리·젓대·가야금·거문고·해금 따위의 관현악 반주에 맞추어 부른다. 평조와 계면조 두 음계에 남창과 여창의 구분이 있다.","양반 계층을 비롯하여 중인 계층들이 향유하던 음악의 형태로는 가곡, 가사, 시조가 있었다."],["서양 음악에서, 시에 곡을 붙인 성악곡. 보통 피아노 반주에 맞추어 부르며, 독창곡·중창곡·합창곡이 있다.","성악가가 가곡을 부른다."]],1,[]],["과실(果實)","명사",0,"실과 과, 열매 실",[["나무 따위를 가꾸어 얻는, 사람이 먹을 수 있는 열매. 대개 수분이 많고 단맛 또는 신맛이 난다. 사과, 배, 포도, 귤, 감, 밤 따위가 있다.","제호는 사과 하나를 꺼내고서 과실 바구니를 통째로 내맡긴다.≪채만식, 탁류≫"]],1,[]],["종이품(從二品)","명사",0,"좇을 종, 두 이, 물건 품",[["조선 시대의 18품계 가운데 넷째 등급. 종친(宗親)의 중의대부·정의대부·소의대부, 의빈(儀賓)의 자의대부·순의대부, 문무(文武)의 가정대부·가의대부·가선대부 등이 해당한다.",""]],1,[]],["가래","명사",0,"",[["떡이나 엿 등을 둥근 모양으로 길게 늘여 만든 토막.","가래로 뽑다.","عُوْد"],["흙을 파헤치거나 떠서 던지는 기구.","한 사람이 가래를 잡고, 두 사람 내지 네 사람이 각기 가래에 달린 끈을 잡아당겨 가래질을 한다."]],1,[]],["넋","명사",0,"",[["사람의 몸 안에서 몸과 정신을 다스리며, 몸이 죽어도 영원히 남아 있다는 보이지 않는 존재.","조상의 넋.","رُوحٌ"],["사람의 몸에 있으면서 몸을 거느리고 정신을 다스리는 비물질적인 것. 몸이 죽어도 영원히 남아 있다고 생각하는 초자연적인 것이다.","넋을 위로하다."]],1,[]],["수평(水平)","명사",0,"물 수, 평평할 평",[["표면이 기울지 않고 평평한 상태.","수평 상태.","مُسْتَوٍ"],["기울지 않고 평평한 상태.","수평을 유지하다."]],1,[]],["종자(種子)","명사",0,"씨 종, 아들 자",[["식물에서 나온 씨 또는 씨앗.","종자로 쓰다."]],1,[]],["멕시코(Mexico)","명사",0,"",[["미국 서남부에 접하여 있는 연방 공화국. 1821년에 에스파냐에서 독립하였다. 농업이 주산업이나 수산 자원과 광산 자원도 풍부하며, 주민은 메스티소와 인디오족이고 주요 언어는 에스파냐어이다. 수도는 멕시코시티, 면적은 197만 2544㎢.",""]],1,[]],["성경(聖經)","명사",0,"성인 성, 지날 경",[["종교상 신앙의 최고 법전이 되는 책. 기독교의 성경, 불교의 팔만대장경, 유교의 사서오경, 이슬람교의 코란 등이 있다.",""]],1,[]],["보호(保護)","명사",0,"지킬 보, 도울 호",[["위험이나 곤란 따위가 미치지 아니하도록 잘 보살펴 돌봄.","보호를 받다."]],1,[]],["의장(議長)","명사",0,"의논할 의, 긴 장",[["회의를 주재하고 그 회의의 집행부를 대표하는 사람.","회의의 의장을 선출하다."]],1,[]],["공무원(公務員)","명사",0,"공평할 공, 힘쓸 무, 인원 원",[["국가 또는 지방 공공 단체의 사무를 맡아보는 사람. 사무 범위에 따라 국가 공무원과 지방 공무원으로 나누며, 선임 및 근무 방법에 따라 일반직과 별정직으로 나눈다.","공무원으로 일하다."]],1,[]],["연주(演奏)","명사",0,"펼 연, 아뢸 주",[["악기를 다루어 곡을 표현하거나 들려주는 일.","피아노 연주."]],1,[]],["박자(拍子)","명사",0,"칠 박, 아들 자",[["음악적 시간을 구성하는 기본적 단위. 보통 마디와 일치한다.","박자가 느리다."]],1,[]],["술잔(술盞)","명사",0,"잔 잔",[["술을 따라 마시는 잔.","유리 술잔.","كَأْسُ الْخَمْر"],["술을 따라 마시는 그릇. 유리·사기·쇠붙이 따위로 만들며, 크기와 모양은 여러 가지이다.","술잔이 돌다."]],1,[]],["머리카락","명사",0,"",[["머리털의 낱개.","머리카락을 뒤로 쓸어 넘기다."]],1,[]],["회전(回轉/廻轉)","명사",0,"돌아올 회, 구를 전 / 돌 회, 구를 전",[["물체 자체가 빙빙 돎.","제자리 회전.","دَوَرَان"],["어떤 것을 축으로 물체 자체가 빙빙 돎.","공중 3회전."]],1,[]],["꽃잎","명사",0,"",[["꽃을 이루고 있는 낱낱의 조각 잎.","꽃잎을 따다."]],1,[]],["종파(宗派)","명사",0,"마루 종, 갈래 파",[["한집안의 계통에서 갈라져 나간 집안.","종파를 나누다.","طَائِفَة"],["같은 종교의 갈린 갈래.","어떤 종파를 가릴 것 없이, 오늘날 종교가 종교 본래의 기능을 다하지 못하고 있는 요인은….≪법정, 무소유≫"]],1,[]],["눈알","명사",0,"",[["척추동물의 시각 기관인 눈구멍 안에 박혀 있는 공 모양의 기관. 공막, 각막으로 된 바깥 부분과 맥락막, 섬모체, 홍채로 된 가운데 부분, 그리고 망막체로 된 안 부분의 세 층으로 이루어져 있으며, 그 안쪽에는 수정체와 유리체 따위를 포함하고 있다. 망막에 물체의 영상을 비치게 하는 구실을 한다.","눈알을 굴리다."]],1,[]],["공물(貢物)","명사",0,"바칠 공, 물건 물",[["중앙 관서와 궁중의 수요를 충당하기 위하여 여러 군현에 부과하여 상납하게 한 특산물. 전통 세제(稅制)인 조(租)·용(庸)·조(調) 가운데 조(調)에 해당하는 것으로, 중간 관리의 부정으로 문란해지자 16세기에 이이, 유성룡 등이 쌀로 받게 하는 수미법을 주장하였으나 실시되지 않았고 광해군 즉위년(1608)에 이르러 경기 지역부터 대동법이 처음 실시되었고, 숙종34년(1708)에 전국적으로 실시되었다.","공물을 바치다."]],1,[]],["경주(慶州)","명사",0,"경사 경, 고을 주",[["경상북도의 동남부에 있는 시. 신라 천 년의 고도(古都)로 명승고적이 많아 관광 명소이다. 제삼차 산업과 농업이 주요 산업이며 특산물로 유기, 죽세공품 따위가 있다. 불국사, 석굴암, 분황사와 그 밖에도 많은 명승지가 있다. 1995년 행정 구역 개편 때 경주군을 통합하여 도농 복합 형태의 시를 이루었다. 면적은 1,324.08㎢.",""]],1,[]],["가공(加工)","명사",0,"더할 가, 장인 공",[["원자재나 반제품을 인공적으로 처리하여 새로운 제품을 만들거나 제품의 질을 높임.","식품 가공."]],1,[]],["왕실(王室)","명사",0,"임금 왕, 집 실",[["임금의 집안.","영국 왕실."]],1,[]],["인생(人生)","명사",0,"사람 인, 날 생",[["사람이 세상을 살아가는 일.","고달픈 인생."]],1,[]],["아주낮춤","명사",0,"",[["사람을 가리키는 대명사에서, 가장 낮추어 이르는 말.","왕 앞에서 사람들은 아주낮춤 표현을 써야 했다.","صيغة فائقة التواضع"],["인칭 대명사에서, 가장 낮추어 이르는 말. ‘너’, ‘저’, ‘소인’ 따위가 있다.",""],["서술어의 종결형에서, 청자를 아주 낮추는 등분.",""]],1,[]],["약물(藥物)","명사",0,"약 약, 물건 물",[["몸에 작용하여 병을 치료하거나 예방하는 데 쓰는 물질.",""]],1,[]],["콩팥","명사",0,"",[["척추동물의 비뇨 기관과 관련된 장기의 하나. 사람의 경우 강낭콩 모양으로 좌우에 한 쌍이 있으며, 체내에 생긴 불필요한 물질을 몸 밖으로 배출하고 체액의 조성이나 양을 일정하게 유지하는 작용을 한다.",""]],1,[]],["대장(大將)","명사",0,"클 대, 장수 장",[["한 무리나 집단의 우두머리.","대장 자격.","زَعِيم، قَائِد"],["한 무리의 우두머리.","그는 어린 시절에는 우리들 사이에서 대장 노릇을 하던 아이였다."]],1,[]],["믿음","명사",0,"",[["어떤 일이나 사람을 믿는 마음.","강한 믿음.","إِيمَانٌ"],["어떤 사실이나 사람을 믿는 마음.","믿음을 저버리다."]],1,[]],["너비","명사",0,"",[["평면이나 넓은 물체의 가로로 건너지른 거리.","강의 너비."]],1,[]],["이산화(二酸化)","명사",0,"두 이, 실 산, 될 화",[["어떤 원자 또는 분자가 산소 원자 두 개와 결합하는 일.",""]],1,[]],["표시(表示)","명사",0,"겉 표, 보일 시",[["겉으로 드러내 보임.","성의 표시."]],1,[]],["알기","명사",0,"",[["검은색이나 잿빛 나는 줄을 가로세로로 넣어서 짠 무명.",""]],1,[]],["황(黃)","명사",0,"누를 황",[["익은 벼의 빛깔과 같이 다소 어둡고 탁한 색.",""]],1,[]],["더위","명사",0,"",[["여름철의 더운 기운.","찌는 듯한 더위."]],1,[]],["영혼(靈魂)","명사",0,"신령 영, 넋 혼",[["죽은 사람의 몸에서 빠져나온 넋.","영혼이 되다.","رُوحٌ"],["죽은 사람의 넋.","희생당한 어린 영혼들을 기리는 추모제가 열렸다."],["육체에 깃들어 마음의 작용을 맡고 생명을 부여한다고 여겨지는 비물질적 실체.","영혼의 양식."]],1,[]],["계산(計算)","명사",0,"셀 계, 셈 산",[["수를 세거나 더하기, 빼기, 곱하기, 나누기 등의 셈을 함.","빠른 계산.","حِسَاب"],["수를 헤아림.","계산이 안 맞다."]],1,[]],["제목(題目)","명사",0,"제목 제, 눈 목",[["작품이나 강연, 보고 따위에서, 그것을 대표하거나 내용을 보이기 위하여 붙이는 이름.","학위 논문 제목."]],1,[]],["색채(色彩)","명사",0,"빛 색, 채색 채",[["물체가 빛을 받아 나타내는 색깔.","강렬한 색채.","لَوْن"],["물체가 빛을 받을 때 빛의 파장에 따라 그 거죽에 나타나는 특유한 빛.","강렬한 색채."]],1,[]],["부족(部族)","명사",0,"떼 부, 겨레 족",[["같은 조상·언어·종교 등을 가진, 원시 사회나 미개 사회의 구성단위가 되는 지역적 생활 공동체.","부족 공동체."]],1,[]],["신선(神仙)","명사",0,"귀신 신, 신선 선",[["도(道)를 닦아서 현실의 인간 세계를 떠나 자연과 벗하며 산다는 상상의 사람. 세속적인 상식에 구애되지 않고, 고통이나 질병도 없으며 죽지 않는다고 한다.","신선이 노니는 선경."]],1,[]],["스위스(Suisse)","명사",0,"",[["유럽 중부에 있는 연방 공화국. 1648년 신성 로마 제국에서 독립하여, 1815년 영세 중립국으로 승인을 받았다. 알프스산맥이 있어 경치가 아름다운 국제적 관광지로, 과일과 낙농 제품이 많이 나고 수공업적 기계 공업이 발달하였으며, 적십자사 따위의 많은 국제 기구 본부가 있다. 주민은 독일계, 프랑스계, 이탈리아계로 구성되어 있고 주요 언어는 독일어와 프랑스어이다. 수도는 베른, 면적은 4만 1287㎢.",""]],1,[]],["솥","명사",0,"",[["밥을 짓거나 국 따위를 끓이는 그릇. 주로 양은이나 알루미늄 따위의 쇠붙이로 만드나 오지·곱돌·무쇠로 만들기도 한다.","솥에 쌀을 안치다."]],1,[]],["사당(祠堂)","명사",0,"사당 사, 집 당",[["조상의 신주(神主)를 모셔 놓은 집.","사당에 위패를 모시다."]],1,[]],["잔털","명사",0,"",[["매우 가늘고 짧은 털.","뽀얀 목덜미에 보송보송 잔털이 청결하게 느껴지는데도 육감적이다.≪박경리, 토지≫"]],1,[]],["염소","명사",0,"",[["솟과의 동물. 어깨의 높이는 60~90cm이며, 몸빛은 품종에 따라 갈색, 흰색, 검은색 따위의 여러 가지이다. 뿔은 속이 비고 뒤로 굽었는데 수컷은 턱 밑에 긴 수염이 있다. 성질이 활발하고 민첩하다. 중요한 가축으로 품종이 많고 유용종, 모용종, 육용종 따위로 구분한다. 전 세계에 분포한다.",""]],1,[]],["시계(時計)","명사",0,"때 시, 셀 계",[["시간을 재거나 시각을 나타내는 기계나 장치를 통틀어 이르는 말.","시계가 느리다."]],1,[]],["한시(한時)","명사",0,"때 시",[["같은 시각.",""]],1,[]],["천도교(天道敎)","명사",0,"하늘 천, 길 도, 가르칠 교",[["최제우가 창건한 ‘동학’을 제3대 교주인 손병희가 개칭한 이름. 인격적이며 초월적인 유일신 한울님을 신앙 대상으로 하며, 천인합일(天人合一)의 인내천(人乃天) 사상과 사인여천(事人如天) 사상을 바탕으로 한 현세주의적 종교이다.",""]],1,[]],["토막","명사",0,"",[["좀 크게 덩어리가 진 도막.","토막을 내다.","قِطْعَة"],["크고 덩어리가 진 도막.","생선 토막."]],1,[]],["지표(指標)","명사",0,"가리킬 지, 표할 표",[["방향이나 목적, 기준 따위를 나타내는 표지.","교육의 지표."]],1,[]],["미래(未來)","명사",0,"아닐 미, 올 래",[["앞으로 올 때.","미래를 설계하다."]],1,[]],["지시(指示)","명사",0,"가리킬 지, 보일 시",[["어떤 것을 가리켜서 보게 함.","전방 지시.","تَعْلِيمَات"],["일러서 시킴. 또는 그 내용.","지시 사항."],["가리켜 보임.",""]],1,[]],["규범(規範)","명사",0,"법 규, 법 범",[["인간이 행동하거나 판단할 때에 마땅히 따르고 지켜야 할 가치 판단의 기준.","행동 규범."]],1,[]],["효력(效力)","명사",0,"본받을 효, 힘 력",[["약 등을 사용한 뒤에 얻는 좋은 결과.","약의 효력.","فَعَالِيَّة"],["약 따위를 사용한 후에 얻는 보람.","약의 효력."],["법률이나 규칙 따위의 작용.","효력 정지."]],1,[]],["문과(文科)","명사",0,"글월 문, 과목 과",[["사상, 심리, 역사 등 인간과 사회에 관하여 연구하는 학문. 문학, 철학, 사학 따위 문화에 관한 학문을 주로 이르며 때로는 법률, 경제학 따위도 포함한다.","문과를 선택하다."]],1,[]],["공로(功勞)","명사",0,"공 공, 일할 로",[["일을 마치거나 목적을 이루는 데 들인 노력과 수고. 또는 일을 마치거나 그 목적을 이룬 결과로서의 공적.","공로가 크다."]],1,[]],["탄(彈)","명사",0,"탄알 탄",[["탄알, 포탄, 폭탄 따위를 통틀어 이르는 말.","포격이다. 제일 탄이 작열하자 포탄은 골짝 좌우로 정신없이 황토 흙을 뿜어 올린다.≪홍성원, 육이오≫"]],1,[]],["수령(樹齡)","명사",0,"나무 수, 나이 령",[["나무의 나이.","이 은행나무는 수령이 200년이 넘어 보호수로 지정되었다."]],1,[]],["전선(前線)","명사",0,"앞 전, 줄 선",[["직접 뛰어든 활동 분야.","경제 전선.",""],["직접 뛰어든 일정한 활동 분야.","수험생들의 대입 전선에 먹구름이 끼고 있다."],["싸움터에서 적과 상대하는 맨 앞 지역을 가상적으로 연결한 선.",""]],1,[]],["법령(法令)","명사",0,"법 법, 하여금 령",[["법률과 명령을 아울러 이르는 말.","법령을 개정하다."]],1,[]],["녹말(綠末)","명사",0,"푸를 녹, 끝 말",[["감자, 고구마, 물에 불린 녹두 등을 갈아서 가라앉힌 앙금을 말린 가루.","녹말을 넣다.","نَشَاً"],["감자, 고구마, 물에 불린 녹두 따위를 갈아서 가라앉힌 앙금을 말린 가루.","녹말을 물에 개다."]],1,[]],["광선(光線)","명사",0,"빛 광, 줄 선",[["빛의 줄기.","태양 광선."]],1,[]],["부인(夫人)","명사",0,"지아비 부, 사람 인",[["남의 아내를 높여 이르는 말.","부인은 안녕하시지요?"]],1,[]],["자국","명사",0,"",[["다른 것이 닿거나 묻어서 생긴 자리. 또는 어떤 것 때문에 원래의 상태가 달라진 흔적.","글씨 자국.","علامة، أثر"],["다른 물건이 닿거나 묻어서 생긴 자리. 또는 어떤 것에 의하여 원래의 상태가 달라진 흔적.","글씨 자국."]],1,[]],["지중해(地中海)","명사",0,"땅 지, 가운데 중, 바다 해",[["대륙과 대륙 사이에 낀 바다. 북극해, 홍해 따위를 이른다.",""],["유럽, 아시아, 아프리카 세 대륙에 둘러싸인 바다. 동쪽으로 홍해와 인도양, 서쪽으로 대서양과 통하며, 북쪽에 흑해가 있다. 고대에 이집트, 페니키아, 그리스, 로마에 의하여 지중해 문화권이 형성된 바 있으며, 경제·군사적으로 중요한 지역이다.",""]],1,[]],["질소(窒素)","명사",0,"막힐 질, 본디 소",[["공기의 약 5분의 4를 차지하는 무색·무미·무취의 기체 질소 분자를 이루는 원소. 천연으로는 질소 가스·암모늄염·질산염으로 존재하며, 보통 질소 분자는 화학 반응을 일으키기 어려우나 높은 온도에서는 다른 원소와 화합하여 질화물을 만든다. 비료, 질산 따위를 만드는 데 쓴다. 기호는 N, 원자 번호는 7, 원자량은 14.0067.",""]],1,[]],["날짜","명사",0,"",[["날의 수.","날짜가 남다.","عَدَدُ الْأَيَّامِ"],["일정한 일을 하는 데 걸리는 날의 수.","날짜가 모자라다."],["어느 해의 어느 달 며칠에 해당하는 그날.","일이 바빠서 날짜가 가는 줄도 모르고 지냈다."]],1,[]],["밑부분(밑部分)","명사",0,"떼 부, 나눌 분",[["전체 가운데 밑에 해당되는 범위.","그는 오른손 엄지에 인주를 듬뿍 발라서 시키는 대로 서류의 밑부분에 꾹 눌렀다.≪이상문, 황색인≫"]],1,[]],["씨앗","명사",0,"",[["곡식이나 채소, 꽃 등의 씨.","씨앗이 날리다.","بذر"],["곡식이나 채소 따위의 씨.","씨앗을 뿌리다."]],1,[]],["나감(拿勘)","명사",0,"잡을 나, 헤아릴 감",[["조선 시대에, 중죄인을 의금부로 잡아들여 조처하던 일.",""]],1,[]],["소재(素材)","명사",0,"본디 소, 재목 재",[["어떤 것을 만드는 데 바탕이 되는 재료.","첨단 소재."]],1,[]],["병원(病院)","명사",0,"병 병, 집 원",[["병자(病者)를 진찰, 치료하는 데에 필요한 설비를 갖추어 놓은 곳.","병원에 입원하다."]],1,[]],["왕국(王國)","명사",0,"임금 왕, 나라 국",[["임금이 다스리는 나라.","고대 왕국."]],1,[]],["보라색(보라色)","명사",0,"빛 색",[["파랑과 빨강의 중간색. 또는 그런 색의 물감.","보라색 옷."]],1,[]],["몸집","명사",0,"",[["몸의 부피.","몸집이 좋다."]],1,[]],["옷감","명사",0,"",[["옷을 짓는 데 쓰는 천.","옷감을 마르다."]],1,[]],["조개","명사",0,"",[["이매패강의 연체동물을 통틀어 이르는 말. 몸은 양쪽이 같고 좌우로 납작하며, 둘 또는 하나의 껍데기와 외투막으로 덮여 있다. 바닷물에서 사는 것과 민물에서 사는 것이 있다.","조개를 잡다."]],1,[]],["양반(兩班)","명사",0,"두 양, 나눌 반",[["(옛날에) 지배층을 이루던 신분.","몰락한 양반.","يانغبان، النبلاء"],["고려·조선 시대에, 지배층을 이루던 신분. 원래 관료 체제를 이루는 동반과 서반을 일렀으나 점차 그 가족이나 후손까지 포괄하여 이르게 되었다.","양반 행세를 하다."]],1,[]],["기사(騎士)","명사",0,"말탈 기, 선비 사",[["말을 탄 무사.","백마 탄 기사."]],1,[]],["풍습(風習)","명사",0,"바람 풍, 익힐 습",[["풍속과 습관을 아울러 이르는 말.","우리 민족 고유의 전통과 풍습."]],1,[]],["선종(宣宗)","명사",0,"베풀 선, 마루 종",[["고려의 제13대 왕(1049~1094). 이름은 운(運). 승과(僧科)를 설치하고, 교장도감을 설치하여 도서를 출판하는 따위의 불교 발전에 힘썼다. 재위 기간은 1083~1094년이다.",""]],1,[]],["지지(支持)","명사",0,"지탱할 지, 가질 지",[["어떤 사람이나 단체 등이 내세우는 주의나 의견 등에 찬성하고 따름.","지지 세력.","تأييد"],["어떤 사람이나 단체 따위의 주의·정책·의견 따위에 찬동하여 이를 위하여 힘을 씀. 또는 그 원조.","지지 세력."],["무거운 물건을 받치거나 버팀.",""]],1,[]],["구덩이","명사",0,"",[["땅이 움푹하게 파인 곳.","진흙 구덩이."]],1,[]],["연꽃(蓮꽃)","명사",0,"연꽃 연",[["연꽃과의 여러해살이 수초. 연못에서 자라거나 연못이나 논과 같이 물 빠짐이 좋지 않은 곳에서 재배되며 뿌리줄기가 굵고 옆으로 뻗어 간다. 잎은 뿌리줄기에서 나와 잎자루 끝에 달리며, 꽃은 7~8월에 붉은색 또는 흰색으로 핀다. 잎과 열매는 약용하고, 뿌리는 식용한다. 인도, 중국, 오스트레일리아가 원산지다.","그녀는 잠깐 생각하는 듯하더니, 이내 옆에 있는 무화과 열매를 따서 연꽃으로 온통 뒤덮인 못 위에 던지고 던지고 하면서, 코끼리 이야기를 했다.≪최인훈, 가면고≫"]],1,[]],["세기(世紀)","명사",0,"인간 세, 벼리 기",[["백 년을 단위로 하는 기간.","우리는 이제 다음 세기를 준비해야 한다."]],1,[]],["아미타불(阿彌陀佛)","명사",0,"언덕 아, 미륵 미, 비탈질 타, 부처 불",[["서방 정토에 있는 부처. 대승 불교 정토교의 중심을 이루는 부처로, 수행 중에 모든 중생을 제도하겠다는 대원(大願)을 품고 성불하여 극락에서 교화하고 있으며, 이 부처를 염하면 죽은 뒤에 극락에 간다고 한다.",""]],1,[]],["운(韻)","명사",0,"운 운",[["한시의 운으로 다는 글자.","운을 달다.","سجع"],["각 시행의 동일한 위치에 규칙적으로 쓰인, 음조가 비슷한 글자.","운을 맞추어 시를 지었다."]],1,[]],["이듬해","명사",0,"",[["바로 다음의 해.","이듬해 봄."]],1,[]],["받기","명사",0,"",[["유도에서, 맞붙어 연습하는 두 사람 가운데 상대편이 거는 기술을 받아 낙법을 하는 사람.",""]],1,[]],["흔적(痕跡/痕迹)","명사",0,"흔적 흔, 발자취 적 / 흔적 흔, 자취 적",[["어떤 현상이나 실체가 없어졌거나 지나간 뒤에 남은 자국이나 자취.","흔적을 남기다."]],1,[]],["횟수(回數)","명사",0,"돌아올 횟, 셈 수",[["돌아오는 차례의 수효.","횟수를 거듭하다."]],1,[]],["한도(限度)","명사",0,"한할 한, 법도 도",[["일정한 정도. 또는 한정된 정도.","해외 투자 한도."]],1,[]],["상호(相互)","명사",0,"서로 상, 서로 호",[["상대가 되는 이쪽과 저쪽 모두.","상호 이해."]],1,[]],["국회(國會)","명사",0,"나라 국, 모일 회",[["국민의 대표인 국회 의원들로 이루어져, 법률을 만들고 행정부와 사법부를 감시하는 기능을 하는 국가 기관.","대한민국 국회.","بَرْلَمَان"],["국민의 대표로 구성한 입법 기관. 민의(民意)를 받들어 법치 정치의 기초인 법률을 제정하며 행정부와 사법부를 감시하고 그 책임을 추궁하는 따위의 여러 가지 국가의 중요 사항을 의결하는 권한을 가진다. 단원제와 양원제가 있는데 우리나라는 현재 단원제를 택하고 있다.","다만 국회 의원을 뽑음으로써 국회가 이루어지고, 그 국회가 만든 헌법에 따라 대통령을 뽑아 새로운 정부가 들어선다는 막연한 기대감에만 젖어 있었다.≪최일남, 거룩한 응달≫"]],1,[]],["언덕","명사",0,"",[["낮은 산처럼 비스듬하게 경사져 있고, 보통 땅보다 약간 높이 솟아 있는 곳.","모래 언덕.","تَلّ"],["땅이 비탈지고 조금 높은 곳.","언덕을 오르다."]],1,[]],["의원(議員)","명사",0,"의논할 의, 인원 원",[["국회나 지방 의회와 같은 합의체(合議體)의 구성원으로 의결권을 가진 사람.","국회 소장파 의원."]],1,[]],["약제(藥劑)","명사",0,"약 약, 약제 제",[["여러 가지 약재를 섞어 조제한 약.","진맥을 하고 약제를 짓기 위해 읍내를 나들이한 뒤 넉 달 만에 나왔건만 안 천총의 사랑방에는 달라진 것이 없었다.≪김원일, 불의 제전≫"]],1,[]],["푸른색(푸른色)","명사",0,"빛 색",[["맑은 가을 하늘이나 깊은 바다, 풀의 빛깔과 같이 맑고 선명한 색.","푸른색 청바지."]],1,[]],["정원(定員)","명사",0,"정할 정, 인원 원",[["일정한 규정에 의하여 정한 인원.","정원 미달."]],1,[]],["습기(濕氣)","명사",0,"젖을 습, 기운 기",[["물기가 많아 젖은 듯한 기운.","습기가 많다."]],1,[]],["반점(半點)","명사",0,"반 반, 점 점",[["한 점의 절반.",""]],1,[]],["파동(波動)","명사",0,"물결 파, 움직일 동",[["물결의 움직임.","수면에 파동이 일어나다."]],1,[]],["전남(全南)","명사",0,"온전할 전, 남녘 남",[["우리나라 남서부에 있는 도. 고려 현종 때 전라도가 되었고 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 무안군이다. 면적은 약 12,360㎢.",""]],1,[]],["왕세자(王世子)","명사",0,"임금 왕, 인간 세, 아들 자",[["제후국에서, 임금의 자리를 이을 임금의 아들.","왕세자로 봉하다."]],1,[]],["당사자(當事者)","명사",0,"마땅 당, 일 사, 놈 자",[["어떤 일이나 사건에 직접 관계가 있거나 관계한 사람.","당사자 이외 출입 금지."]],1,[]],["의문(疑問)","명사",0,"의심할 의, 물을 문",[["의심스럽게 생각함. 또는 그런 문제나 사실.","의문이 생기다."]],1,[]],["셈","명사",0,"",[["수를 세는 일.","셈을 배우다."]],1,[]],["운명(運命)","명사",0,"옮길 운, 목숨 명",[["인간과 세상 모든 것에 영향을 미치는 초인적이고 필연적인 힘. 또는 그 힘에 의해 이미 정해진 목숨이나 상태.","정해진 운명.","قدر"],["인간을 포함한 모든 것을 지배하는 초인간적인 힘. 또는 그것에 의하여 이미 정하여져 있는 목숨이나 처지.","운명에 맡기다."]],1,[]],["요충지(要衝地)","명사",0,"요긴할 요, 찌를 충, 땅 지",[["지세(地勢)가 군사적으로 아주 중요한 곳.","군사적 요충지."]],1,[]],["데이터(data)","명사",0,"",[["이론을 세우는 데 기초가 되는 사실이나 정보. 또는 관찰이나 실험, 조사로 얻은 사실이나 정보.","데이터를 관리하다.","بَيَانَات"],["이론을 세우는 데 기초가 되는 사실. 또는 바탕이 되는 자료.","고용 실태에 관한 데이터."]],1,[]],["자체(自體)","명사",0,"스스로 자, 몸 체",[["다른 것이 아닌 바로 그것.","나는 그의 태도, 말투도 싫었지만 무엇보다 그라는 인간 자체가 싫었다.","ذاته"],["다른 것을 제외한 사물 본래의 몸체. 또는 바로 그 본래의 바탕.","살아 있는 육체 그 자체의 아름다움."]],1,[]],["햇볕","명사",0,"",[["해가 내리쬐는 기운.","따사로운 햇볕."]],1,[]],["질문(質問)","명사",0,"바탕 질, 물을 문",[["알고자 하는 바를 얻기 위해 물음.","질문 사항."]],1,[]],["공자(孔子)","명사",0,"구멍 공, 아들 자",[["중국 춘추 시대의 사상가·학자(B.C.551~B.C.479). 이름은 구(丘). 자는 중니(仲尼). 노나라 사람으로 여러 나라를 두루 돌아다니면서 인(仁)을 정치와 윤리의 이상으로 하는 도덕주의를 설파하여 덕치 정치를 강조하였다. 만년에는 교육에 전념하여 3,000여 명의 제자를 길러 내고, ≪시경≫과 ≪서경≫ 등의 중국 고전을 정리하였다. 제자들이 엮은 ≪논어≫에 그의 언행과 사상이 잘 나타나 있다.",""]],1,[]],["읍(邑)","명사",0,"고을 읍",[["시나 군에 속한 지방 행정 구역.","읍 단위.","بَلْدة"],["시(市)나 군(郡)에 속한 지방 행정 구역 단위의 하나. 인구 2만 이상이 되어야 하나, 2만 미만인 경우도 있다.","읍이 시로 승격함에 따라 관련 지명이 모두 바뀔 예정이다."]],1,[]],["커피(coffee)","명사",0,"",[["볶은 후 갈아서 물에 끓여 차로 마시는 커피나무의 열매. 또는 그 가루.","커피 가루.","حبّ شجرة البُنّ، حبّ تتّخذ منه القهوة"],["커피나무의 열매를 볶아서 간 가루. 카페인을 함유하고 있으며, 독특한 향기가 있어 차의 원료로 널리 애용되고, 과자나 음료수의 복합 원료로도 많이 쓴다.","커피가 다 떨어져서 대신 홍차를 마셨다."]],1,[]],["물자(物資)","명사",0,"물건 물, 재물 자",[["어떤 활동에 필요한 여러 가지 물건이나 재료.","물자가 풍부하다."]],1,[]],["벽돌(甓돌)","명사",0,"벽돌 벽",[["진흙과 모래를 차지게 반죽하여 틀에 박아서 600~1,100℃에서 구워 만들거나, 시멘트와 모래를 버무려 틀에 박아 건조한 네모진 건축 재료. 표준 크기는 190×90×57mm이다.","벽돌 100장."]],1,[]],["네덜란드(Netherlands)","명사",0,"",[["유럽 서북부에 있는 입헌 군주국. 1648년 에스파냐에서 독립하였다. 북해에 면해 있어 간척지가 많으며 국토의 4분의 1이 해면보다 낮은 나라로, 낙농과 원예 농업이 주산업이나 기계·조선·섬유·정유 공업도 발달하였다. 주민의 대부분이 게르만 계통이고, 주요 언어는 네덜란드어이다. 수도는 암스테르담, 면적은 4만 1525㎢.",""]],1,[]],["불도(佛道)","명사",0,"부처 불, 길 도",[["부처의 가르침.",""]],1,[]],["곁","명사",0,"",[["어떤 대상의 바로 옆. 또는 아주 가까운 곳.","곁을 떠나다.","الجَانِب"],["어떤 대상의 옆. 또는 공간적·심리적으로 가까운 데.","환자 곁을 지키다."]],1,[]],["화약(火藥)","명사",0,"불 화, 약 약",[["열, 전기,충격 따위의 가벼운 자극에 의하여 순간적으로 연소 또는 분해 반응을 일으키고 높은 온도의 열과 압력을 가진 가스를 발생시켜 파괴, 추진 따위의 작용을 행하는 화합물이나 혼합물을 통틀어 이르는 말.","화약이 터지다."]],1,[]],["식(式)","명사",0,"법 식",[["정해진 방식에 따라 치르는 행사.","식이 거행되다.","مَرَاسِم"],["일정한 전례, 표준 또는 규정.",""]],1,[]],["명제(命題)","명사",0,"목숨 명, 제목 제",[["어떤 문제에 대한 하나의 논리적 판단 내용과 주장을 언어 또는 기호로 표시한 것. 참과 거짓을 판단할 수 있는 내용이라는 점이 특징이다. 이를테면, ‘고래는 포유류이다.’ 따위이다.","논리적 명제."]],1,[]],["한계(限界)","명사",0,"한할 한, 지경 계",[["사물이나 능력, 책임 따위가 실제 작용할 수 있는 범위. 또는 그런 범위를 나타내는 선.","한계를 극복하다."]],1,[]],["둑","명사",0,"",[["하천이나 호수의 물이 흘러넘치는 것을 막기 위해서 돌이나 흙 등으로 높이 막아 쌓은 긴 언덕.","저수지 둑.","سَدّ"],["높은 길을 내려고 쌓은 언덕.","둑을 쌓다."],["하천이나 호수의 물, 바닷물의 범람을 막기 위하여 설치하는, 흙이나 콘크리트 따위로 만든 구축물.","저수지 둑."]],1,[]],["개혁(改革)","명사",0,"고칠 개, 가죽 혁",[["제도나 기구 따위를 새롭게 뜯어고침.","교육 개혁."]],1,[]],["기타(guitar)","명사",0,"",[["현악기의 하나. 앞뒤가 편평한 표주박 모양의 공명통에 자루를 달고 여섯 개의 줄을 매어, 왼손 손가락으로 줄을 눌러 음정을 고르고 오른손 손가락으로 줄을 튕겨 연주한다.","기타를 치다."]],1,[]],["백색(白色)","명사",0,"흰 백, 빛 색",[["눈이나 우유의 빛깔과 같이 밝고 선명한 색.","백색 와이셔츠."]],1,[]],["뜻밖","명사",0,"",[["전혀 생각이나 예상을 하지 못함.","뜻밖의 선물."]],1,[]],["산맥(山脈)","명사",0,"메 산, 줄기 맥",[["산봉우리가 선상(線狀)이나 대상(帶狀)으로 길게 연속되어 있는 지형. 세계의 대산맥은 대지나 고원과는 달리 특정 지대에 분포하고 있다.",""]],1,[]],["구별(區別)","명사",0,"구분할 구, 다를 별",[["성질이나 종류에 따라 차이가 남. 또는 성질이나 종류에 따라 갈라놓음.","신분의 구별."]],1,[]],["강의(講義)","명사",0,"욀 강, 옳을 의",[["학문이나 기술의 일정한 내용을 체계적으로 설명하여 가르침.","논어 강의."]],1,[]],["산형(山形)","명사",0,"메 산, 모양 형",[["산의 생김새.","산형과 지세."]],1,[]],["김치","명사",0,"",[["소금에 절인 배추나 무 따위를 고춧가루, 파, 마늘 따위의 양념에 버무린 뒤 발효를 시킨 음식. 재료와 조리 방법에 따라 많은 종류가 있다.","묵은 김치."]],1,[]],["수지(收支)","명사",0,"거둘 수, 지탱할 지",[["수입과 지출.","수지 균형.","الْإِيرَادَات وَالنَّفَقَات"],["수입과 지출을 아울러 이르는 말.","수지 균형을 맞추다."]],1,[]],["성품(性品)","명사",0,"성품 성, 물건 품",[["사람의 성질이나 됨됨이.","강직한 성품."]],1,[]],["장구","명사",0,"",[["국악에서 쓰는 타악기의 하나. 기다란 오동나무로 만든 것으로, 통의 허리는 가늘고 잘록하며, 한쪽에는 말가죽을 메워 오른쪽 마구리에 대고, 한쪽에는 쇠가죽을 메워 왼쪽 마구리에 대어 붉은 줄로 얽어 팽팽하게 켕겨 놓았다. 왼쪽은 손이나 궁굴채로, 오른쪽은 열채로 치는데, 그 음색이 각기 다르다. 고려 시대에 중국에서 전하여 온 것이라고 하며, 우리나라의 대표적 악기로서 반주에 널리 쓰인다.","장구를 치다."]],1,[]],["원칙(原則)","명사",0,"언덕 원, 법칙 칙",[["어떤 행동이나 이론 따위에서 일관되게 지켜야 하는 기본적인 규칙이나 법칙.","원칙을 따르다."]],1,[]],["강원특별자치도(江原特別自治道)","명사",0,"강 강, 언덕 원, 특별할 특, 다를 별, 스스로 자, 다스릴 치, 길 도",[["‘강원도01’를 지방 자치 단체인 특별자치도로서 이르는 이름.",""]],1,[]],["종족(種族)","명사",0,"씨 종, 겨레 족",[["같은 종류의 생물 전체.","다른 종족.","عَشِيرَة"],["같은 종류의 생물 전체를 이르는 말.","종족의 분화."]],1,[]],["치마","명사",0,"",[["허리부터 다리 부분까지 하나로 이어져 가랑이가 없는 아래옷.","치마를 입다."]],1,[]],["혈(穴)","명사",0,"굴 혈",[["풍수지리에서, 용맥(龍脈)의 정기가 모인 자리.","혈이 잡히다."],["14경맥(經脈)에 속해 있는 혈(穴)을 이르는 말. 경락(經絡)의 기혈(氣血)이 신체 표면에 모여 통과하는 부위로, 침을 놓거나 뜸을 떠서 자극을 내부 장기(臟器)로 전달하기도 하고 내부 장기의 징후를 드러내기도 한다.","의원은 다시 다른 쪽의 혈에다 침을 꽂았다.≪박경리, 토지≫"]],1,[]],["넷째","명사",0,"",[["맨 앞에서부터 세어 모두 네 개가 됨을 이르는 말.","아이는 얼마나 배가 고팠는지 앉은 자리에서 빵을 넷째 먹는다."]],1,[]],["거품","명사",0,"",[["액체 속에 공기가 들어가 만들어진 속이 빈 둥근 방울.","맥주 거품.","فُقَّاعَة"],["액체가 기체를 머금고 부풀어서 생긴, 속이 빈 방울.","맥주 거품."]],1,[]],["무용(武勇)","명사",0,"호반 무, 날랠 용",[["무예와 용맹을 아울러 이르는 말.","무용을 떨치다."]],1,[]],["유역(流域)","명사",0,"흐를 유, 지경 역",[["강물이 흐르는 언저리.","낙동강 유역."]],1,[]],["칼륨(Kalium)","명사",0,"",[["알칼리 금속 원소의 하나. 식물 회(灰) 가운데 탄산염으로 들어 있으며, 이온으로서 동식물의 생리에 중요한 역할을 한다. 금속 원소 가운데 이온화 경향이 가장 큰 원소로서 산화하기 쉽고, 물에 넣으면 수소를 내고 수산화 칼륨이 되며, 자줏빛의 불꽃을 내며 탄다. 환원제·칼륨 화합물의 원료로 쓴다. 원자 기호는 K, 원자 번호는 19, 원자량은 39.0983.",""]],1,[]],["오늘날","명사",0,"",[["지금의 시대.","오늘날의 한국 현실."]],1,[]],["폭탄(爆彈)","명사",0,"불터질 폭, 탄알 탄",[["인명 살상이나 구조물 파괴를 위하여 금속 용기에 폭약을 채워서 던지거나 쏘거나 떨어뜨려서 터뜨리는 폭발물.","폭탄을 터뜨리다."]],1,[]],["경비(經費)","명사",0,"지날 경, 쓸 비",[["사업을 경영하거나 운영하는 데 필요한 비용.","사업 경비 절감."]],1,[]],["재난(災難)","명사",0,"재앙 재, 어려울 난",[["뜻밖에 일어난 재앙과 고난.","불의의 재난."]],1,[]],["국수","명사",0,"",[["밀가루·메밀가루·감자 가루 따위를 반죽한 다음, 반죽을 손이나 기계 따위로 가늘고 길게 뽑아낸 식품. 또는 그것을 삶아 만든 음식.","국수 가락."]],1,[]],["대포","명사",0,"",[["큰 술잔.",""]],1,[]],["다소(多少)","명사",0,"많을 다, 적을 소",[["분량이나 정도의 많고 적음.","다소의 가능성.","إِلَى حَدٍّ مَا"],["분량이나 정도의 많음과 적음.","발을 다쳐서 걷는 데 다소의 불편이 있다."]],1,[]],["광무(光武)","명사",0,"빛 광, 호반 무",[["조선 고종 때 사용한 연호(1897~1906). 대한 제국의 첫 연호이다.",""]],1,[]],["물리적(物理的)","명사",0,"물건 물, 다스릴 리, 과녁 적",[["물질의 원리에 기초한 것.","이번 실험으로 다양한 물리적인 현상을 설명할 수 있을까요?"]],1,[]],["자물쇠","명사",0,"",[["열고 닫게 되어 있는 물건을 잠그는 장치.","열쇠와 자물쇠.","قُفْل"],["여닫게 되어 있는 물건을 잠그는 장치.","자물쇠를 풀다."]],1,[]],["잿물","명사",0,"",[["(옛날에) 주로 빨래할 때 썼던, 짚이나 나무를 태운 재를 우려낸 물.","잿물을 만들다.","الصودا الكاوية، الغسول"],["짚이나 나무를 태운 재를 우려낸 물. 예전에 주로 빨래할 때 썼다.","빨래할 잿물을 만들기 위해 안마당에서 콩대를 태우던 그들의 어머니가….≪문순태, 타오르는 강≫"]],1,[]],["첫머리","명사",0,"",[["어떤 일이나 사물 따위가 시작되는 부분.","글의 첫머리."]],1,[]],["연장(延長)","명사",0,"늘일 연, 긴 장",[["길이나 시간, 거리 등을 본래보다 길게 늘림.","기간 연장.","مد"],["시간이나 거리 따위를 본래보다 길게 늘림.","연장 공연."]],1,[]],["수은(水銀)","명사",0,"물 수, 은 은",[["상온에서 유일하게 액체 상태로 있는 은백색의 금속 원소. 천연으로 산출되는 진사(辰沙)를 불에 녹여서 얻는 물질로, 독성이 있으며 질산에 쉽게 녹는다. 어떤 금속과도 쉽게 합금을 만들어 아말감이 된다. 금을 정련하거나, 의약·화약·살충제·온도계·기압계 따위를 만드는 데 쓴다. 끓는점은 356.6℃, 어는점은 영하 38.87℃, 원자 기호는 Hg, 원자 번호는 80, 원자량은 200.59.",""]],1,[]],["수입(收入)","명사",0,"거둘 수, 들 입",[["어떤 일을 하여 돈이나 물건 등을 거두어들임. 또는 그 돈이나 물건.","수입이 늘다.","دخل"],["돈이나 물품 따위를 거두어들임. 또는 그 돈이나 물품.","수입이 늘다."]],1,[]],["주가(株價)","명사",0,"그루 주, 값 가",[["주식이나 주권의 가격. 주식 시장에서 형성되는 시세에 따라서 결정된다.","주가 폭락."]],1,[]],["생물체(生物體)","명사",0,"날 생, 물건 물, 몸 체",[["생명을 가지고 스스로 생활 현상을 유지하여 나가는 물체. 영양·운동·생장·증식을 하며, 동물·식물·미생물로 나뉜다.","공장 주변의 생물체는 서서히 죽어 가고 있다.≪조세희, 기계 도시≫"]],1,[]],["차고(車庫)","명사",0,"수레 차, 곳집 고",[["자동차, 기차, 전차 따위의 차량을 넣어 두는 곳.","차고 앞 주차 금지."]],1,[]],["군데군데","명사",0,"",[["여러 군데. 또는 이곳저곳.","한 무덤에서 서너 삽씩, 이 무덤 저 무덤으로 돌아다니며 군데군데를 삽으로 도려 오고 있었다.≪이문구, 장한몽≫"]],1,[]],["탈춤","명사",0,"",[["탈을 쓰고 추는 춤.","탈춤 사위."]],1,[]],["도둑","명사",0,"",[["남의 물건을 훔치거나 빼앗는 행위.","도둑을 맞다.","لِصّ"],["남의 물건을 훔치거나 빼앗는 행위를 하는 사람.","도둑이 들다."]],0,[]],["색소(色素)","명사",0,"빛 색, 본디 소",[["물체의 색깔이 나타나도록 해 주는 성분. 이에는 생체의 색깔을 나타내는 동물 색소·식물 색소 따위의 천연 색소가 있고, 공업적으로 물건에 색을 입히는 도료·안료 따위의 공업용 인공 색소가 있다.","색소로 노랗게 물들인 단무지."]],1,[]],["무신(武臣)","명사",0,"호반 무, 신하 신",[["신하 가운데 무관인 사람.","문신들의 횡포에 맞서 무신들은 자신의 군사력으로 권세를 얻으려 했다."]],1,[]],["차지","명사",0,"",[["사물이나 공간, 지위 따위를 자기 몫으로 가짐. 또는 그 사물이나 공간.","어른들이 나가면 안방은 아이들 차지이다."]],1,[]],["형사(刑事)","명사",0,"형벌 형, 일 사",[["형법의 적용을 받는 사건.",""],["범죄의 수사 및 범인의 체포를 직무로 하는 사복(私服) 경찰관을 통틀어 이르는 말.","형사 기동대."]],1,[]],["토양(土壤)","명사",0,"흙 토, 흙덩이 양",[["지구의 표면을 덮고 있는, 작은 알갱이로 이루어진 물질.","토양 오염.","تربة"],["지구의 표면을 덮고 있는, 바위가 부스러져 생긴 가루인 무기물과 동식물에서 생긴 유기물이 섞여 이루어진 물질.",""]],1,[]],["동양(東洋)","명사",0,"동녘 동, 큰바다 양",[["유라시아 대륙의 동부 지역. 아시아의 동부 및 남부를 이르는데 한국, 중국, 일본, 인도, 미얀마, 타이, 인도네시아 등이 있다.",""]],1,[]],["짚","명사",0,"",[["벼, 보리, 밀, 조 따위의 이삭을 떨어낸 줄기와 잎.","온갖 짚과 콩깍지 등을 푹 끓여 쇠죽을 쑤었다."]],1,[]],["주먹","명사",0,"",[["손가락을 모두 모아 쥔 손.","주먹이 작다.","قَبْضَةُ الْيَدِ"],["손가락을 모두 오므려 쥔 손.","주먹을 쥐다."]],1,[]],["건축물(建築物)","명사",0,"세울 건, 쌓을 축, 물건 물",[["땅 위에 지은 구조물 중에서 지붕, 기둥, 벽이 있는 건물을 통틀어 이르는 말.","목조 건축물."]],1,[]],["동남쪽(東南쪽)","명사",0,"동녘 동, 남녘 남",[["동쪽을 기준으로 동쪽과 남쪽 사이의 방위.","독도는 울릉도에서 동남쪽으로 약 90km 떨어진 곳에 있다."]],1,[]],["전염병(傳染病)","명사",0,"전할 전, 물들 염, 병 병",[["전염성을 가진 병들을 통틀어 이르는 말. 곧 세균, 바이러스, 리케차, 스피로헤타, 진균, 원충 따위의 병원체가 다른 생물체에 옮아 집단적으로 유행하는 병들을 이른다. 공중위생의 측면에서 예방이 매우 중요하다.","전염병에 걸리다."]],1,[]],["직각(直角)","명사",0,"곧을 직, 뿔 각",[["두 직선이 만나서 이루는 90도의 각. ‘∠R’로 나타낸다.","그는 몸을 직각이 되게 굽혀 손님들에게 인사했다."]],1,[]],["노인(老人)","명사",0,"늙을 노, 사람 인",[["나이가 들어 늙은 사람.","노인을 공경하다."]],1,[]],["평북(平北)","명사",0,"평평할 평, 북녘 북",[["우리나라 북서부에 있는 도. 고려 시대에 강동 육성을 두었으며, 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 신의주이다. 면적은 약 28,442㎢.",""]],1,[]],["종묘(宗廟)","명사",0,"마루 종, 사당 묘",[["역대 왕과 왕비의 위패를 모시던 사당.",""]],1,[]],["본명(本名)","명사",0,"근본 본, 이름 명",[["가명이나 별명이 아닌 본디 이름.","연예인들은 본명 대신 가명을 많이 쓴다."]],1,[]],["서남쪽(西南쪽)","명사",0,"서녘 서, 남녘 남",[["서쪽을 기준으로 서쪽과 남쪽 사이의 방위.","이 지점에서 서남쪽으로 15마일 떨어진 해상에 폭풍이 몰아치고 있다."]],1,[]],["계율(戒律)","명사",0,"경계할 계, 법칙 율",[["종교를 가지고 있는 사람들이 그에 맞게 지켜야 하는 규율.","계율을 어기다.","قَوَاعِد دِينِيَّة"],["지켜야 할 규범.","무자비한 수탈 속에서 가난도 이별도 견디어야만 하고 도리를 준열한 계율로 삼아 온, 이 자각 없이 고행해 온 무리가 조선의 백성이요….≪박경리, 토지≫"]],1,[]],["오페라(opera)","명사",0,"",[["음악을 중심으로 한 종합 무대 예술. 대사는 독창, 중창, 합창 따위로 부르며, 서곡이나 간주곡 따위의 기악곡도 덧붙인다.","오페라를 관람하다."]],1,[]],["전압(電壓)","명사",0,"번개 전, 누를 압",[["전기장이나 도체 안에 있는 두 점 사이의 전기적인 위치 에너지 차. 단위는 볼트.","전압이 높다."]],1,[]],["충격(衝擊)","명사",0,"찌를 충, 칠 격",[["물체에 급격히 가하여지는 힘.","충격이 크다."]],1,[]],["남북(南北)","명사",0,"남녘 남, 북녘 북",[["남쪽과 북쪽.","남북 종단.","شَمَال وَجَنُوب"],["남쪽과 북쪽을 아울러 이르는 말.","남북으로 길게 뻗은 다리."]],1,[]],["줄무늬","명사",0,"",[["줄로 이루어진 무늬.","줄무늬 호랑이."]],1,[]],["친구(親舊)","명사",0,"친할 친, 예 구",[["사이가 가까워 서로 친하게 지내는 사람.","고향 친구.","صَدِيقٌ"],["가깝게 오래 사귄 사람.","친구를 사귀다."]],1,[]],["인재(人材)","명사",0,"사람 인, 재목 재",[["어떤 일을 할 수 있는 학식이나 능력을 갖춘 사람.","인재 양성."]],1,[]],["보조사(補助詞)","명사",0,"기울 보, 도울 조, 말씀 사",[["체언, 부사, 활용 어미 따위에 붙어서 어떤 특별한 의미를 더해 주는 조사. ‘은’, ‘는’, ‘도’, ‘만’, ‘까지’, ‘마저’, ‘조차’, ‘부터’ 따위가 있다.",""]],1,[]],["몫","명사",0,"",[["무엇을 여럿이 나누어 가질 때 각 사람이 가지게 되는 부분.","몫이 주어지다."]],0,[]],["유지(有志)","명사",0,"있을 유, 뜻 지",[["마을이나 지역에서 명망 있고 영향력을 가진 사람.","지역 유지."],["어떤 일에 뜻이 있거나 관심이 있는 사람.",""]],1,[]],["동력(動力)","명사",0,"움직일 동, 힘 력",[["수력, 전력, 화력, 원자력, 풍력 등을 사람이 쓸 수 있도록 바꾼 기계적인 에너지.","동력 기계.","طَاقَة"],["전기 또는 자연에 있는 에너지를 쓰기 위하여 기계적인 에너지로 바꾼 것. 전력, 수력, 풍력 따위가 주요 동력원(動力源)이 된다.","동력을 공급하다."]],1,[]],["캐나다(Canada)","명사",0,"",[["북아메리카 대륙 북부에 있는, 영국 연방 내의 연방 국가. 프랑스와 영국의 식민지였다가 1867년에 캐나다 자치령이 되었으며, 1949년에 독립국이 되었다. 세계적인 밀 생산지로, 니켈·아연·금·구리 따위의 광산 자원도 풍부하고 각종 공업과 수산업이 발달하였다. 주민은 영국계와 프랑스계 백인이고 주요 언어는 영어와 프랑스어이다. 수도는 오타와, 면적은 997만 6185㎢.",""]],1,[]],["삼림(森林)","명사",0,"수풀 삼, 수풀 림",[["나무가 많이 우거진 숲. 천연림, 시업림, 단순림, 혼효림 따위가 있다.","삼림 자원."]],1,[]],["얼룩점(얼룩點)","명사",0,"점 점",[["물체에 박힌 얼룩얼룩한 점.","그 송아지는 눈 밑에 얼룩점이 있다."]],1,[]],["동남아시아(東南Asia)","명사",0,"동녘 동, 남녘 남",[["아시아의 동남부. 지역적으로는 인도차이나반도와 말레이 제도로 나누어지며, 베트남·인도네시아·필리핀 따위의 나라가 포함된다.",""]],1,[]],["엉덩이","명사",0,"",[["볼기의 윗부분과 아랫부분을 통틀어 이르는 말.","엉덩이가 크고 펑퍼짐하다."]],1,[]],["대표적(代表的)","명사",0,"대신할 대, 겉 표, 과녁 적",[["어떤 분야나 집단에서 무엇을 대표할 만큼 전형적이거나 특징적인 것.","대표적인 경우."]],1,[]],["자본(資本)","명사",0,"재물 자, 근본 본",[["장사나 사업 등을 하는 데에 바탕이 되는 돈.","사업 자본.","رأسمال"],["장사나 사업 따위의 기본이 되는 돈.","자본을 마련하다."]],1,[]],["구실아치","명사",0,"",[["조선 시대에, 각 관아의 벼슬아치 밑에서 일을 보던 사람.","삼례는 이런 교통의 요지라 평소에도 구실아치나 양반들의 행차며 보부상과 예사 길손으로 꽤나 붐볐다.≪송기숙, 녹두 장군≫"]],1,[]],["수사(搜査)","명사",0,"찾을 수, 조사할 사",[["찾아서 조사함.","학급에서 키우던 햄스터가 사라지자 반 아이들 전체가 수사에 나섰다."]],1,[]],["열차(列車)","명사",0,"벌일 열, 수레 차",[["여러 개의 찻간을 길게 이어 놓은 차량. 흔히 전철이나 기차 따위를 이른다.","열차 시간표."]],1,[]],["서북쪽(西北쪽)","명사",0,"서녘 서, 북녘 북",[["서쪽을 기준으로 서쪽과 북쪽 사이의 방위.","성우는 멀리 서북쪽 방향에서 무슨 폭음이 들린 것 같아 귀를 세웠다.≪이원규, 훈장과 굴레≫"]],1,[]],["보석(寶石)","명사",0,"보배 보, 돌 석",[["아주 단단하고 빛깔과 광택이 아름다우며 희귀한 광물. 비금속 광물로 흔히 장신구로 쓰이며, 다이아몬드·옥수(玉髓)·비취(翡翠)·에메랄드·사파이어·루비·단백석 따위가 있다.","보석이 박힌 왕관."]],1,[]],["소문(所聞)","명사",0,"바 소, 들을 문",[["사람들 입에 오르내려 전하여 들리는 말.","소문이 돌다."]],1,[]],["마루","명사",0,"",[["긴 줄기로 이어져 있는 산이나 고개의 꼭대기.","마루에 걸린 해.","ذُرْوَة، قِمَّة"],["등성이를 이루는 지붕이나 산 따위의 꼭대기.","서거칠은 승달산 마루에 뎅그렇게 걸린 해를 보면서 일어섰다.≪문순태, 타오르는 강≫"],["집채 안에 바닥과 사이를 띄우고 깐 널빤지. 또는 그 널빤지를 깔아 놓은 곳.","마루를 깔다."]],1,[]],["중의(衆議)","명사",0,"무리 중, 의논할 의",[["여러 사람의 의견.","모든 중의가 적장에게 왕자가 편지를 해야만 좋을 형편이라 한다면 나도 억지로 반대하지 아니할 터이니 알아서들 처리하라.≪박종화, 임진왜란≫"]],1,[]],["과자(菓子)","명사",0,"과자 과, 아들 자",[["밀가루나 쌀가루 등에 설탕, 우유 따위를 섞어 굽거나 기름에 튀겨서 만든 음식. 주로 간식으로 먹는다.","과자 부스러기."]],1,[]],["지옥(地獄)","명사",0,"땅 지, 옥 옥",[["살아 있을 때 죄를 지은 사람이 죽은 뒤에 가서 벌을 받는다는 곳.","기독교의 지옥.","جحيم، جهنّم"],["큰 죄를 짓고 죽은 사람들이 구원을 받지 못하고 끝없이 벌을 받는다는 곳.",""]],1,[]],["현종(玄宗)","명사",0,"검을 현, 마루 종",[["중국 당나라의 제6대 황제(685~762). 성은 이(李), 이름은 융기(隆基). 시호는 명황(明皇)·무황(武皇). 초년에 정사(政事)를 바로잡아 ‘개원의 치’라고 불리는 성당(盛唐) 시대를 이루었으나, 만년에 양 귀비를 총애하고 간신에게 정치를 맡겨 안녹산의 난을 초래하였다. 재위 기간은 712~756년이다.",""]],1,[]],["순조(順調)","명사",0,"순할 순, 고를 조",[["일 따위가 아무 탈이나 말썽 없이 예정대로 잘되어 가는 상태.","그들의 목소리는 평탄하고 순조로 나오지 않고 구부러지고 흔들리며 나오는 것 같았다.≪나도향, 뉘우치려 할 때≫"]],1,[]],["눈썹","명사",0,"",[["두 눈두덩 위에 가로로 모여 난 짧은 털.","짙은 눈썹."]],1,[]],["유형(類型)","명사",0,"무리 유, 모형 형",[["성질이나 특징 따위가 공통적인 것끼리 묶은 하나의 틀. 또는 그 틀에 속하는 것.","사람을 세 가지 유형으로 나누다."]],1,[]],["팥","명사",0,"",[["콩과의 한해살이풀. 높이는 30~60cm이며, 잎은 어긋나고 세 쪽 겹잎인데 잔잎은 달걀 모양으로 뾰족하다. 여름에 노란 꽃이 잎겨드랑이에서 피고 가늘고 둥근 통 모양의 긴 꼬투리에 4~15개의 씨가 들어 있다. 씨는 유용한 잡곡이다. 인도가 원산지로 한국, 일본, 중국 등지에서 널리 분포한다.",""]],1,[]],["고름","명사",0,"",[["상처에 염증이 생겼을 때 피부에서 나오는 걸쭉하고 불투명한 액체.","상처의 고름.","صَدِيد، قَيْح"],["몸 안에 병균이 들어가 염증을 일으켰을 때에 피부나 조직이 썩어 생긴 물질이나, 파괴된 백혈구, 세균 따위가 들어 있는 걸쭉한 액체. 희고 누르무레하며 고약한 냄새가 난다.","고름을 짜다."]],1,[]],["자음(子音)","명사",0,"아들 자, 소리 음",[["목, 입, 혀 따위의 발음 기관에 의해 구강 통로가 좁아지거나 완전히 막히는 따위의 장애를 받으며 나는 소리. 자음은 조음 위치와 조음 방법에 따라서 분류할 수 있는데, 국어의 경우에 조음 위치에 따른 자음의 부류는 양순음(ㅂ, ㅃ, ㅍ, ㅁ), 치조음(ㄷ, ㄸ, ㅌ, ㅅ, ㅆ, ㄴ, ㄹ), 경구개음(ㅈ, ㅉ, ㅊ), 연구개음(ㄱ, ㄲ, ㅋ, ㅇ), 성문음(ㅎ)이 있으며, 조음 방법에 따른 부류는 파열음(ㅂ, ㅃ, ㅍ, ㄷ, ㄸ, ㅌ, ㄱ, ㄲ, ㅋ), 파찰음(ㅈ, ㅉ, ㅊ), 마찰음(ㅅ, ㅆ, ㅎ), 유음(ㄹ), 비음(ㄴ, ㅁ, ㅇ)이 있다.",""]],1,[]],["성과(成果)","명사",0,"이룰 성, 실과 과",[["이루어 낸 결실.","성과를 얻다."]],1,[]],["자기장(磁氣場)","명사",0,"자석 자, 기운 기, 마당 장",[["자석의 주위, 전류의 주위, 지구의 표면 따위와 같이 자기의 작용이 미치는 공간.",""]],1,[]],["파장(波長)","명사",0,"물결 파, 긴 장",[["전파나 음파의 파동에서, 같은 위상을 가진 서로 이웃한 두 점 사이의 거리.","노란색의 파장.","طول موجي"],["파동에서, 같은 위상을 가진 서로 이웃한 두 점 사이의 거리.","가시광선의 파장."]],1,[]],["걸","명사",0,"",[["윷놀이에서, 윷짝의 세 개는 젖혀지고 한 개는 엎어진 경우를 이르는 말. 끗수는 세 끗으로 친다.",""]],1,[]],["시멘트(cement)","명사",0,"",[["건축이나 토목 재료로 쓰는 접합제. 석회석과 진흙과 적당량의 석고를 섞어 이긴 것을 구워서 가루로 만든 것이다.","차가운 시멘트 바닥."]],1,[]],["거름","명사",0,"",[["식물이 잘 자라도록 땅에 뿌리거나 섞는 물질.","농작물의 거름."]],0,[]],["구한말(舊韓末)","명사",0,"예 구, 한국 한, 끝 말",[["조선 말기에서 대한 제국까지의 시기.","만주 지역에 거주하는 동포들은 구한말 일제 강점기 민족적 수난 시기에 어쩔 수 없이 고국을 등진 비운의 주인공들이다."]],1,[]],["원통(冤痛)","명사",0,"원통할 원, 아플 통",[["분하고 억울함.","생전 사후의 이 원통을 알아줄 이가 뉘 있더란 말이냐.≪송기숙, 녹두 장군≫"]],1,[]],["작물(作物)","명사",0,"지을 작, 물건 물",[["논밭에 심어 가꾸는 곡식이나 채소.","식량 작물."]],1,[]],["서양식(西洋式)","명사",0,"서녘 서, 큰바다 양, 법 식",[["서양의 양식이나 격식.","서양식 그림."]],1,[]],["체(體)","명사",0,"몸 체",[["글씨나 그림 등에서 나타나는 일정한 모양이나 격식.","체가 고르다.","خَطّ"],["일정한 격식이나 모양새.","체가 곱다."]],1,[]],["불빛","명사",0,"",[["타오르는 불의 빛.","뜨거운 불빛.","ضَوْء النَّار"],["타는 불의 빛.","가마 안은 더욱 달궈져 불빛이 파래졌다."]],1,[]],["발가락","명사",0,"",[["발끝의 다섯 개로 갈라진 부분. 또는 그것 하나하나.","발가락이 시리다."]],1,[]],["쥐","명사",0,"",[["사람의 집 근처 어두운 곳에서 살며 몸은 진한 회색에 긴 꼬리를 가지고 있는 작은 동물.","실험용 쥐.","فأر"],["쥣과의 포유류를 통틀어 이르는 말.","실험용 쥐."]],1,[]],["여유(餘裕)","명사",0,"남을 여, 넉넉할 유",[["시간이나 공간, 돈 등이 넉넉하여 남음이 있는 상태.","시간적 여유.","وفرة"],["물질적·공간적·시간적으로 넉넉하여 남음이 있는 상태.","시간적 여유를 갖다."]],1,[]],["독립운동가(獨立運動家)","명사",0,"홀로 독, 설 립, 옮길 운, 움직일 동, 집 가",[["일제 강점기에, 우리 민족의 독립을 위하여 여러 가지 민족 운동을 전문적으로 하던 사람.","독립운동가의 뜻을 기리다."]],1,[]],["기온(氣溫)","명사",0,"기운 기, 따뜻할 온",[["대기(大氣)의 온도. 보통 지면으로부터 1.5미터 높이의 백엽상 속에 놓인 온도계로 잰 온도를 이른다.","기온이 내려가다."]],1,[]],["아랫부분(아랫部分)","명사",0,"떼 부, 나눌 분",[["전체 가운데 아래에 해당되는 범위.","얼굴 아랫부분은 방금 면도를 끝낸 듯 파랗게 보였다."]],1,[]],["금융(金融)","명사",0,"쇠 금, 녹을 융",[["금전을 융통하는 일. 특히 이자를 붙여서 자금을 대차하는 일과 그 수급 관계를 이른다.","금융을 독점하다."]],1,[]],["점막(粘膜)","명사",0,"붙을 점, 꺼풀 막",[["위창자관, 기도와 같은 대롱 모양 구조의 속 공간을 덮고 있는 부드럽고 끈끈한 막을 통틀어 이르는 말.",""]],1,[]],["소나(SONAR)","명사",0,"",[["초음파를 발신하여 그 반사 파동으로 수중 장애물이나 해저 상황을 탐지하는 장치. 수상 함정, 잠수함, 기뢰 따위의 탐색 및 어군 탐지기, 음향 측심기 따위에 쓴다.",""]],1,[]],["바지","명사",0,"",[["아랫도리에 입는 옷의 하나. 위는 통으로 되고 아래에는 두 다리를 꿰는 가랑이가 있다.","바지를 입다."]],1,[]],["화학자(化學者)","명사",0,"될 화, 배울 학, 놈 자",[["화학을 전문으로 연구하는 사람.","독일의 화학자 룽게는 19세기에 처음으로 커피콩에서 카페인을 발견하였다."]],1,[]],["침입(侵入)","명사",0,"침노할 침, 들 입",[["침범하여 들어가거나 들어옴.","적의 침입을 격퇴하다."]],1,[]],["경제적(經濟的)","명사",0,"지날 경, 건널 제, 과녁 적",[["인간의 생활에 필요한 돈이나 물건, 노동을 생산, 분배, 소비하는 활동에 관한 것.","경제적인 독립.","اِقْتِصَادِيّ"],["인간의 생활에 필요한 재화나 용역을 생산·분배·소비하는 모든 활동에 관한 것.","경제적인 기회균등."],["돈이나 시간, 노력을 적게 들이는 것.","계획을 짜서 시간을 경제적으로 이용했다."]],1,[]],["인격(人格)","명사",0,"사람 인, 격식 격",[["사람의 품격.","인격 수양.","شَخْصِيَّة"],["사람으로서의 품격.","인격 모독."]],1,[]],["고전(古典)","명사",0,"예 고, 법 전",[["오래전부터 내려오던 방식이나 형식.","고전 경제학.","كِلَاسِيكِيّ"],["오랫동안 많은 사람에게 널리 읽히고 모범이 될 만한 문학이나 예술 작품.","문학 고전 100선."]],1,[]],["내장(內臟)","명사",0,"안 내, 오장 장",[["척추동물의 가슴안이나 배안 속에 있는 여러 가지 기관을 통틀어 이르는 말. 위, 창자, 간, 콩팥, 이자 따위가 있다.","수술을 해 본 결과 그의 내장은 성한 데가 없었다."]],1,[]],["언행(言行)","명사",0,"말씀 언, 다닐 행",[["말과 행동을 아울러 이르는 말.","언행에 유의하다."]],1,[]],["옥수수","명사",0,"",[["볏과의 한해살이풀. 높이는 2~3미터이며, 잎은 수숫잎같이 크고 길다. 꽃은 단성화로 웅화수는 줄기 끝에 달리고 자화수는 줄기 중앙의 잎겨드랑이에 달린다. 열매는 녹말이 풍부하고 식용하거나 가축 사료로 쓴다. 멕시코에서 남아메리카 북부에 걸친 지역이 원산지로, 전 세계에서 재배한다.","밭에 옥수수를 심다."]],1,[]],["장례(葬禮)","명사",0,"장사지낼 장, 예도 례",[["장사를 지내는 일. 또는 그런 예식.","장례를 치르다."]],1,[]],["강점기(強占期)","명사",0,"강할 강, 점칠 점, 기약할 기",[["남의 물건, 영토, 권리 따위를 강제로 차지한 시기.","강점기 동안 행해진 수많은 자원 수탈."]],1,[]],["찌꺼기","명사",0,"",[["액체 속에 있다가 액체가 다 빠진 뒤에 바닥에 남은 나머지.","찻잎 찌꺼기.","فضلة"],["액체가 다 빠진 뒤에 바닥에 남은 물건.","한약을 짜고 난 찌꺼기를 거름으로 쓰면 식물이 잘 자란다."]],1,[]],["우수리강(Ussuri江)","명사",0,"강 강",[["러시아 연해주와 만주 사이를 흐르는 강. 싱카이호(興凱湖)에서 시작하여 하바롭스크 부근에서 아무르강으로 흘러든다. 길이는 587km.",""]],1,[]],["회화(會話)","명사",0,"모일 회, 말씀 화",[["만나서 서로 이야기를 나눔. 또는 만나서 하는 이야기.","회화 중.","محادثة"],["서로 만나서 이야기를 나눔. 또는 만나서 하는 이야기.",""]],1,[]],["어버이","명사",0,"",[["아버지와 어머니를 아울러 이르는 말.","어버이의 은혜."]],1,[]],["등지느러미","명사",0,"",[["물고기의 등에 있는 지느러미.",""]],1,[]],["사막(沙漠/砂漠)","명사",0,"모래 사, 넓을 막 / 모래 사, 넓을 막",[["강수량이 적어서 식생이 보이지 않거나 적고, 인간의 활동도 제약되는 지역. 성인(成因)에 따라 열대 사막, 해안 사막, 내륙 사막, 한랭지 사막으로 나눈다.","그는 사막에서 오아시스를 보고 그대로 지나가는 것 같은 갈급증이 난다.≪이기영, 고향≫"]],1,[]],["감옥(監獄)","명사",0,"볼 감, 옥 옥",[["죄인을 가두어 두는 곳. 한때 형무소라고 부르다가 현재 ‘교도소’로 고쳤다.","감옥 생활."]],1,[]],["선원(船員)","명사",0,"배 선, 인원 원",[["배의 승무원.","태풍으로 우리 배에 타고 있던 선원 두 명이 실종되었다."]],1,[]],["수법(手法)","명사",0,"손 수, 법 법",[["수단과 방법.","동일 수법.","وَسِيطَةٌ وَطَرِيقَةٌ"],["수단과 방법을 아울러 이르는 말.","대담한 수법."]],1,[]],["아기","명사",0,"",[["젖을 먹는 때의 어린아이.","귀여운 아기.","رضيع"],["어린 젖먹이 아이.","아기를 돌보다."]],1,[]],["저항(抵抗)","명사",0,"막을 저, 겨룰 항",[["어떤 힘이나 조건에 굽히지 않고 거역하거나 견딤.","완강한 저항.","مُقَاوَمَة"],["어떤 힘이나 조건에 굽히지 아니하고 거역하거나 버팀.","저항 세력."]],1,[]],["요금(料金)","명사",0,"헤아릴 요, 쇠 금",[["물건이나 서비스 따위를 이용하는 대가로 내는 돈.","전화 요금."]],1,[]],["출신(出身)","명사",0,"날 출, 몸 신",[["출생 당시 가정이 속한 사회적 신분.","귀족 출신.","أصل، انتماء"],["출생 당시 가정이 속하여 있던 사회적 신분.","양반 출신."],["어떤 지방이나 파벌, 학교, 직업 따위에서 규정되는 사회적인 신분이나 이력 관계.","서울 출신."]],1,[]],["인삼(人蔘)","명사",0,"사람 인, 삼 삼",[["두릅나뭇과의 여러해살이풀. 높이는 60cm 정도이며, 잎은 줄기 끝에 서너 개씩 돌려나고 장상 복엽이다. 봄에 녹황색의 꽃이 피고 열매는 타원형으로 붉게 익는다. 뿌리는 희고 비대한 다육질인데 강장제로 귀중히 여겨진다. 깊은 산에 야생하거나 밭에서 기르는데 한국의 강원·경기·평남·평북·함남, 중국 등지에 분포한다.","인삼 열 근."]],1,[]],["재정(財政)","명사",0,"재물 재, 정사 정",[["돈에 관한 여러 가지 일.",""]],1,[]],["명종(明宗)","명사",0,"밝을 명, 마루 종",[["조선 제13대 왕(1534~1567). 이름은 환(峘). 자는 대양(對陽). 중종의 둘째 아들로 12세에 즉위하여 재위 중 을사사화, 을묘왜변 따위를 겪었다. 재위 기간은 1545~1567년이다.",""]],1,[]],["불경(佛經)","명사",0,"부처 불, 지날 경",[["불교의 교리를 밝혀 놓은 전적(典籍)을 통틀어 이르는 말.",""]],1,[]],["지고(至高)","명사",0,"이를 지, 높을 고",[["더할 수 없이 높음.","지고의 이상."]],1,[]],["지느러미","명사",0,"",[["물고기 또는 물에 사는 포유류가 몸의 균형을 유지하거나 헤엄치는 데 쓰는 기관. 등, 배, 가슴, 꼬리 따위에 붙어 있다.","오 리도 못 가서 아씨는 팔다리를 지느러미처럼 휘젓기만 하고 도무지 앞으로 가질 못했다.≪박완서, 미망≫"]],1,[]],["자취","명사",0,"",[["어떤 것이 남긴 표시나 자리.","자취를 남기다."]],1,[]],["문체(文體)","명사",0,"글월 문, 몸 체",[["문장의 개성적 특색. 시대, 문장의 종류, 글쓴이에 따라 그 특성이 문장의 전체 또는 부분에 드러난다.","개인 문체."]],1,[]],["기기(機器/器機)","명사",0,"틀 기, 그릇 기 / 그릇 기, 틀 기",[["기구, 기계(機械), 기계(器械) 따위를 통틀어 이르는 말.","음향 기기."]],1,[]],["부사(副詞)","명사",0,"버금 부, 말씀 사",[["용언 또는 다른 말 앞에 놓여 그 뜻을 분명하게 하는 품사. 활용하지 못하며 성분 부사와 문장 부사로 나뉜다. ‘매우’, ‘가장’, ‘과연’, ‘그리고’ 따위가 있다.",""]],1,[]],["충청남도(忠淸南道)","명사",0,"충성 충, 맑을 청, 남녘 남, 길 도",[["우리나라 중서부에 있는 도. 통일 신라 시대에는 웅천(熊川)으로, 고려 시대에는 하남도로 불리다가 조선 고종 때 지금의 이름이 되었다. 도청 소재지는 홍성군이다. 면적은 약 8,247㎢.",""]],1,[]],["선로(線路)","명사",0,"줄 선, 길 로",[["기차나 전차 등이 다닐 수 있도록 만들어 놓은 길.","선로가 복구되다.","السِّكَّة الْحَدِيدِيَّة"],["기차나 전차의 바퀴가 굴러가도록 레일을 깔아 놓은 길.",""]],1,[]],["서적(書籍)","명사",0,"글 서, 문서 적",[["일정한 목적, 내용, 체재에 맞추어 사상, 감정, 지식 따위를 글이나 그림으로 표현하여 적거나 인쇄하여 묶어 놓은 것.","이 서점에서는 중고 서적을 전문으로 판다."]],1,[]],["관등(官等)","명사",0,"벼슬 관, 무리 등",[["관리나 벼슬의 등급.","관등 조직."]],1,[]],["판결(判決)","명사",0,"판단할 판, 결단할 결",[["옳고 그름이나 좋고 나쁨을 판단하여 결정함.","공평한 판결.","قرار، حكم"],["시비나 선악을 판단하여 결정함.","공평한 판결."]],1,[]],["즙(汁)","명사",0,"즙 즙",[["물기가 들어 있는 물체에서 짜낸 액체.","즙을 내다."]],1,[]],["비료(肥料)","명사",0,"살찔 비, 헤아릴 료",[["경작지에 뿌리는 영양 물질. 토지의 생산력을 높이고 식물의 생장을 촉진하는 물질로 질소, 인산, 칼륨을 비료의 3요소라고 한다.","유기물 비료."]],1,[]],["알칼리(alkali)","명사",0,"",[["물에 녹으면 염기성을 나타내는 알칼리 또는 알칼리 토금속의 수용성 수산화물을 통틀어 이르는 말. 수산화 나트륨, 수산화 칼륨 따위가 있다.",""]],1,[]],["문명(文明)","명사",0,"글월 문, 밝을 명",[["인류가 이룩한 물질적, 기술적, 사회 구조적인 발전. 자연 그대로의 원시적 생활에 상대하여 발전되고 세련된 삶의 양태를 뜻한다. 흔히 문화를 정신적·지적인 발전으로, 문명을 물질적·기술적인 발전으로 구별하기도 하나 그리 엄밀히 구별할 수 있는 것은 아니다.","고대 문명."]],1,[]],["재상(災祥)","명사",0,"재앙 재, 상서 상",[["재앙과 상서(祥瑞)를 아울러 이르는 말.","길흉과 재상이 하늘에 달렸으니 사람의 힘으로 어찌하겠는가."]],1,[]],["고치","명사",0,"",[["벌레가 실을 내어 지은 집.","고치 상태.",""],["벌레가 실을 내어 지은 집. 활동 정지 상태에 있는 곤충의 알, 애벌레, 번데기를 보호한다.","고치를 뚫고 나온 나비가 하늘로 날아갔다."]],1,[]],["천연(天然)","명사",0,"하늘 천, 그럴 연",[["사람의 힘을 가하지 아니한 상태.","천연 샘물."]],1,[]],["고사(故事)","명사",0,"연고 고, 일 사",[["유래가 있는 옛날의 일. 또는 그런 일을 표현한 어구.","새옹지마라는 고사를 아나?≪홍성원, 육이오≫"]],1,[]],["정상(頂上)","명사",0,"정수리 정, 윗 상",[["산과 같이 높이가 있는 곳의 맨 꼭대기.","산 정상.","قِمَّةٌ"],["산 따위의 맨 꼭대기.","지리산의 정상."]],1,[]],["학습(學習)","명사",0,"배울 학, 익힐 습",[["배워서 익힘.","교과 학습."]],1,[]],["나뭇잎","명사",0,"",[["나무의 잎.","나뭇잎이 떨어지다."]],1,[]],["조화(造化)","명사",0,"지을 조, 될 화",[["이 세상의 모든 것을 만들고 기르는 대자연의 이치. 또는 그런 이치에 따라 만들어진 모든 것.","땅의 조화.","خلق ، طبيعة ، عالم ، عمل"],["만물을 창조하고 기르는 대자연의 이치. 또는 그런 이치에 따라 만들어진 우주 만물.","자연의 조화."]],1,[]],["사서(司書)","명사",0,"맡을 사, 글 서",[["도서관 따위에서, 일정한 자격을 가지고 자료의 수집, 정리, 보존 및 열람에 관한 사무에 종사하는 사람.","그녀는 학교 도서관에서 사서로 일하고 있다."]],1,[]],["천장(天障)","명사",0,"하늘 천, 막을 장",[["지붕의 안쪽. 지붕 안쪽의 구조물을 가리키기도 하고 지붕 밑과 반자 사이의 빈 공간에서 바라본 반자를 가리키기도 한다.","그 많은 밀기울로는 죄다 누룩을 디뎌 천장 속에 감춰 두기도 했다.≪이문구, 장한몽≫"]],1,[]],["오이","명사",0,"",[["박과의 한해살이 덩굴풀. 여름에 노란 통꽃이 잎겨드랑이에서 피고 열매는 긴 타원형의 장과(漿果)로 누런 갈색으로 익는다. 열매는 식용하며, 인도가 원산지로 세계 각지에 분포한다.","텃밭에 고추, 토마토, 오이를 심었다."]],1,[]],["뚜껑","명사",0,"",[["그릇이나 상자 따위의 아가리를 덮는 물건.","뚜껑을 덮다."]],1,[]],["경덕왕(景德王)","명사",0,"볕 경, 큰 덕, 임금 왕",[["신라 제35대 왕(?~765). 성은 김(金). 이름은 헌영(憲英). 당나라의 문물을 받아들여 제도와 관직을 당나라식으로 고치고 국내 지명도 한자식으로 고쳤다. 국학 진흥과 불교 중흥에 힘써, 통일 신라 문화의 황금시대를 이루었다. 재위 기간은 742~765년이다.",""]],1,[]],["질량(質量)","명사",0,"바탕 질, 헤아릴 량",[["물체의 고유한 역학적 기본량. 관성 질량과 중력 질량이 있다. 국제단위는 킬로그램(kg).",""]],1,[]],["비타민(vitamin)","명사",0,"",[["동물체의 주 영양소가 아니면서 동물의 정상적인 발육과 생리 작용을 유지하는 데 없어서는 안 되는 유기 화합물을 통틀어 이르는 말. 비교적 소량이 필요하지만 체내에서 생성되지 않는다. 크게 수용성 비타민과 지용성 비타민으로 나누어지고, 부족하면 특유의 결핍 증상이 나타난다.","비타민 음료."]],1,[]],["이조(李朝)","명사",0,"오얏 이, 아침 조",[["‘이씨 조선’을 줄여 이르는 말.",""]],1,[]],["아래위","명사",0,"",[["아래와 위를 아울러 이르는 말.","아래위로 훑어보는 그 시선은 참기 어려웠다."]],1,[]],["체언(體言)","명사",0,"몸 체, 말씀 언",[["문장에서 주어 따위의 기능을 하는 명사, 대명사, 수사를 통틀어 이르는 말.",""]],1,[]],["정기(精氣)","명사",0,"정할 정, 기운 기",[["세상의 모든 것을 생성하는 근원이 되는 기운.","백두산의 정기.","قوة حيوية"],["천지 만물을 생성하는 원천이 되는 기운.","백두산의 정기를 받다."]],1,[]],["이의(異議)","명사",0,"다를 이, 의논할 의",[["다른 의견이나 논의.","이의를 달다."]],1,[]],["검은빛","명사",0,"",[["숯이나 먹의 빛깔과 같이 어둡고 짙은 빛.","짙은 검은빛 수염."]],1,[]],["귀족(貴族)","명사",0,"귀할 귀, 겨레 족",[["가문이나 신분 따위가 좋아 정치적·사회적 특권을 가진 계층. 또는 그런 사람.","그는 왕실로부터 후작의 작위를 받은 귀족이다."]],1,[]],["소유(所有)","명사",0,"바 소, 있을 유",[["가지고 있음. 또는 그 물건.","버려진 땅을 개간한 토지는 양반들의 소유가 되었다.≪문순태, 타오르는 강≫"]],1,[]],["사과(沙果/砂果)","명사",0,"모래 사, 실과 과 / 모래 사, 실과 과",[["사과나무의 열매.","빨갛게 익은 사과."]],1,[]],["마당","명사",0,"",[["집에 딸려 있는 평평하고 비어 있는 땅.","마당 가운데.","سَاحَة، فِنَاء"],["집의 앞이나 뒤에 평평하게 닦아 놓은 땅.","마당이 넓은 집."]],1,[]],["수학자(數學者)","명사",0,"셈 수, 배울 학, 놈 자",[["수학을 전문적으로 연구하는 사람.","피타고라스의 정리는 피타고라스라는 고대 그리스 수학자의 이름을 딴 것이다."]],1,[]],["노동자(勞動者)","명사",0,"일할 노, 움직일 동, 놈 자",[["일을 하고 받은 돈으로 생활을 하는 사람.","공장 노동자.","عَامِلٌ"],["노동력을 제공하고 얻은 임금으로 생활을 유지하는 사람.","노동자들은 처우 개선을 요구했다."]],1,[]],["미나리아재빗과(미나리아재빗科)","명사",0,"과목 과",[["쌍떡잎식물 갈래꽃류 미나리아재비목의 한 과. 대개 초본이나, 관목 또는 덩굴성인 것도 있다. 전 세계에 2,500여 종이 분포하는데 우리나라에는 꿩의다리, 미나리아재비 따위의 100여 종이 있다.",""]],1,[]],["통로(通路)","명사",0,"통할 통, 길 로",[["지나다닐 수 있게 낸 길.","통로가 막히다.","ممرّ، مسلك"],["통하여 다니는 길.","통로가 막히다."]],1,[]],["능(陵)","명사",0,"언덕 능",[["임금이나 왕후의 무덤.","능을 쓰다."]],1,[]],["공적(公的)","명사",0,"공평할 공, 과녁 적",[["국가나 사회에 관계되는 것.","공적인 일."]],1,[]],["정치적(政治的)","명사",0,"정사 정, 다스릴 치, 과녁 적",[["정치와 관련된 것.","정치적인 사건."]],1,[]],["죄수(罪囚)","명사",0,"허물 죄, 가둘 수",[["죄를 지어 교도소에 수감된 사람.","죄수를 호송하다."]],1,[]],["정자(正字)","명사",0,"바를 정, 글자 자",[["서체가 바르고 또박또박 쓴 글자.","이력서에 정자로 기입하다."],["한자의 약자(略字)나 속자(俗字), 와자(訛字)가 아닌 본디의 글자.",""]],1,[]],["산성(酸性)","명사",0,"실 산, 성품 성",[["수용액에서 이온화할 때 수산 이온의 농도보다 수소 이온의 농도가 더 큰 물질의 성질. 수소 이온 농도 지수(pH)가 7보다 작고 물에 녹으면 신맛을 내고, 푸른색 리트머스 시험지를 붉은색으로 변화시키며, 염기를 중화시켜 염을 만든다. 수소 이온의 농도가 순수한 물의 경우보다 크다.",""]],1,[]],["부름","명사",0,"",[["어떤 일을 위하여 불러들임.","조국의 부름을 받다."]],1,[]],["해충(害蟲)","명사",0,"해할 해, 벌레 충",[["인간의 생활에 해를 끼치는 벌레를 통틀어 이르는 말. 사람의 몸에 기생하는 이·벼룩·회충 따위와 옷이나 음식물에 기생하는 좀·바퀴 따위, 농작물과 과실나무에 기생하는 응애 따위가 있다.","해충을 박멸하다."]],1,[]],["신주(神主)","명사",0,"귀신 신, 임금 주",[
