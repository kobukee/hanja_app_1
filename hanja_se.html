<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<title>한자 카드 1000</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1a1d24; --sub:#6b7280; --line:#e5e7eb;
  --brand:#1F3864; --brand2:#2d4f8a; --accent:#c8873a; --ok:#2e7d4f; --no:#b3423a;
  --chip:#eef1f6; --shadow:0 1px 3px rgba(15,25,50,.08),0 4px 14px rgba(15,25,50,.06);
  --hl:#fbeccb; --vh:100vh;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c; --card:#1c212b; --ink:#e8eaf0; --sub:#98a0ae; --line:#2a3140;
        --brand:#7d9bd4; --brand2:#5b7cb8; --accent:#d9a05c; --ok:#5cb883; --no:#d97b73; --chip:#252b38;
        --shadow:0 1px 3px rgba(0,0,0,.4); --hl:#4a3b1e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);height:100vh;height:var(--vh);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  touch-action:manipulation;-webkit-touch-callout:none}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;flex:none}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;
  padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.flash{flex:1 1 auto;min-height:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;cursor:pointer;margin-top:2px;
  -webkit-user-select:none;user-select:none;animation:pop .22s ease-out;overflow:hidden}
@keyframes pop{from{opacity:.4;transform:scale(.985)}to{opacity:1;transform:none}}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px 0}
.tagR{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:6px;padding:2px 8px;white-space:nowrap}
.prog{font-size:12px;color:var(--sub);white-space:nowrap}
.cbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px;
  display:flex;flex-direction:column}
.front,.back{margin:auto 0}
.front{text-align:center}
.hanja{font-family:"Noto Serif CJK KR","Noto Serif KR","Source Han Serif K","Batang","AppleMyungjo","Songti SC",serif;
  font-size:112px;font-size:min(112px,max(60px,calc(var(--vh)*.2)));line-height:1.1;font-weight:600;color:var(--brand);margin:4px 0 2px}
.lbl{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 9px;letter-spacing:.2px}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chips span{background:var(--chip);border-radius:12px;padding:8px 14px;font-size:18px;font-weight:700}
.back .read{text-align:center}
.back .hun{font-size:32px;font-weight:800;letter-spacing:-.5px}
.back .hun b{color:var(--accent)}
.back .hj{font-family:"Noto Serif CJK KR","Noto Serif KR","Batang",serif;color:var(--sub);font-size:15px;margin-top:2px}
.words{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.word{border-top:1px solid var(--line);padding-top:10px}
.word .wt{font-size:16px;font-weight:700}
.word .wt small.gr{font-family:inherit;font-size:11px;font-weight:500;color:var(--sub);background:var(--chip);border-radius:5px;padding:1px 6px;margin-left:6px}
.word .ex{margin-top:5px;font-size:15px;line-height:1.55;color:var(--ink)}
.word .ex mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px;font-weight:700}
.hjl{margin-top:3px;font-size:12.5px;color:var(--sub);line-height:1.7}
.hjl .hz{font-family:"Noto Serif CJK KR","Noto Serif KR","Batang","AppleMyungjo",serif;font-size:16px;color:var(--ink);font-weight:600}
.hjl .ps{font-size:11.5px;color:var(--sub);margin:0 3px 0 1px}
.chint{flex:none;text-align:center;font-size:12px;color:var(--sub);padding:6px 0 11px}
.answers{display:flex;gap:10px;margin-top:10px;flex:none}
.answers button{flex:1;padding:14px 0;border-radius:14px;border:0;font-size:15.5px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit}
.answers .no{background:var(--no)} .answers .ok{background:var(--ok)}
.navrow{display:flex;gap:10px;margin-top:8px;flex:none}
.navrow button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--brand);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.statline{flex:none;display:flex;justify-content:center;gap:18px;margin-top:9px;font-size:13px;color:var(--sub)}
.statline b{color:var(--ink)}
.err{padding:30px 10px;text-align:center;color:var(--no);font-size:14px;line-height:1.6}
@media (max-height:520px){
  .seg{margin-bottom:6px}.seg button{padding:5px 11px;font-size:12.5px}
  .answers button{padding:11px 0}.navrow button{padding:8px 0}.chint{padding:4px 0 8px}
}
@media (max-width:350px){.seg button{padding:7px 10px;font-size:12.5px}}
</style>
</head>

const isHanja=ch=>/[一-鿿㐀-䶿豈-﫿]/.test(ch);
function annot(hj){let o='';for(const ch of hj){if(isHanja(ch)&&HX[ch])o+=`<span class="hz">${ch}</span><span class="ps">(${esc(HX[ch])})</span>`;else o+=esc(ch)}return o}
const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}
  catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)}}}})();
// 저장 키는 한자 단어장 전체 앱과 같게 둔다(같은 곳에서 열면 학습 기록 공유)
const KEY='krw_hanja_prog',UIK='krw_hanja_ui';
let prog={};try{prog=JSON.parse(store.getItem(KEY)||'{}')}catch(e){}
if(!prog||typeof prog!=='object')prog={};
let ui={};try{ui=JSON.parse(store.getItem(UIK)||'{}')}catch(e){}
if(!ui||typeof ui!=='object')ui={};
const save=()=>{try{store.setItem(KEY,JSON.stringify(prog))}catch(e){}};
const saveUI=p=>{Object.assign(ui,p);try{store.setItem(UIK,JSON.stringify(ui))}catch(e){}};
let scope=['all','초급','중급'].includes(ui.scope)?ui.scope:'all';
let mode=ui.mode==='rnd'?'rnd':'seq',unkOnly=!!ui.unk,deck=[],pos=0,flipped=false;

function hl(w){const i=w.ex.indexOf(w.hit);
  if(i<0)return esc(w.ex);
  return esc(w.ex.slice(0,i))+'<mark>'+esc(w.hit)+'</mark>'+esc(w.ex.slice(i+w.hit.length))}
function buildDeck(){
  let a=ALL.filter(c=>scope==='all'||c.tier===scope);
  if(unkOnly)a=a.filter(c=>(prog[c.h]||0)<3);
  if(mode==='rnd')for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  deck=a;pos=0;flipped=false;
}
const tierLabel=c=>`빈도 ${c.rank}위 · ${c.tier} 어휘 ${c.n}개`;
function show(){
  const f=$('flash');
  f.style.animation='none';void f.offsetWidth;f.style.animation='';
  if(!deck.length){f.innerHTML='<div class="cbody"><div class="front"><div class="lbl">조건에 맞는 카드가 없습니다.<br>모두 학습 완료했는지 확인해 보세요.</div></div></div>';stat();return}
  const c=deck[pos];
  const top=`<div class="ctop"><span class="tagR">${tierLabel(c)}</span><span class="prog">${pos+1} / ${deck.length}</span></div>`;
  if(!flipped){
    f.innerHTML=top+`<div class="cbody"><div class="front"><div class="hanja">${esc(c.h)}</div>
      <div class="lbl">이 한자가 쓰인 어휘</div>
      <div class="chips">${c.ws.map(w=>`<span>${esc(w.w)}</span>`).join('')}</div></div></div>
      <div class="chint">카드를 누르면 음·훈과 예문이 보입니다</div>`;
  }else{
    f.innerHTML=top+`<div class="cbody"><div class="back"><div class="read"><div class="hun">${esc(c.hun)} <b>${esc(c.um)}</b></div>
      <div class="hj">${esc(c.h)}</div></div>
      <div class="words">${c.ws.map(w=>`<div class="word"><div class="wt">${esc(w.w)}<small class="gr">${esc(w.gr||'')}</small></div>
        <div class="hjl">${annot(w.hj)}</div>
        <div class="ex">${hl(w)}</div></div>`).join('')}</div></div></div>
      <div class="chint">다시 누르면 앞면 · 위아래로 밀어 예문 보기</div>`;
  }
  stat();
}
function stat(){
  let d=0,s=0;ALL.forEach(c=>{const v=prog[c.h]||0;if(v>=3)d++;else if(v>0)s++});
  $('stat').innerHTML=`<span>완료 <b>${d}</b></span><span>학습 중 <b>${s}</b></span><span>전체 <b>${ALL.length}</b></span>`;
}
function go(n){if(!deck.length)return;pos=(pos+n+deck.length)%deck.length;flipped=false;show()}
function mark(k){if(!deck.length)return;const h=deck[pos].h,v=prog[h]||0;prog[h]=k?Math.min(v+1,3):0;save();
  if(unkOnly&&prog[h]>=3){deck.splice(pos,1);if(pos>=deck.length)pos=0;flipped=false;show()}else go(1)}
$('flash').onclick=()=>{if(!deck.length)return;flipped=!flipped;show()};
$('btnOk').onclick=()=>mark(true);$('btnNo').onclick=()=>mark(false);
$('btnNext').onclick=()=>go(1);$('btnPrev').onclick=()=>go(-1);
function syncSeg(){
  document.querySelectorAll('#scope button').forEach(b=>b.classList.toggle('on',b.dataset.s===scope));
  document.querySelectorAll('#order [data-o]').forEach(b=>b.classList.toggle('on',b.dataset.o===mode));
  $('unk').classList.toggle('on',unkOnly);
}
$('scope').onclick=e=>{const b=e.target.closest('button');if(!b)return;scope=b.dataset.s;saveUI({scope});syncSeg();buildDeck();show()};
$('order').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.u){unkOnly=!unkOnly;saveUI({unk:unkOnly})}else{mode=b.dataset.o;saveUI({mode})}
  syncSeg();buildDeck();show()};
// 좌우로 밀어서 이전/다음
(function(){
  let x0=0,y0=0,t0=0,on=false;
  const f=$('flash');
  f.addEventListener('touchstart',e=>{if(e.touches.length!==1){on=false;return}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();on=true},{passive:true});
  f.addEventListener('touchend',e=>{if(!on)return;on=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-t0<700){go(dx<0?1:-1)}},{passive:true});
})();
syncSeg();buildDeck();show();
</script>
</body>
</html>
